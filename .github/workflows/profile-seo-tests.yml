name: Profile SEO privacy tests
on:
  push:
    branches: [profile-privacy-seo-review]
  pull_request:
    paths:
      - 'api/profile-*.js'
      - 'tests/profile-*.test.js'
      - 'supabase/migrations/*profile_setup*'
      - '.github/workflows/profile-seo-tests.yml'
jobs:
  profile-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/profile-seo-privacy.test.js tests/profile-preview.test.js tests/profile-sitemap.test.js
