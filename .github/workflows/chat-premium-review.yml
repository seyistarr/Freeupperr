name: Chat review — isolated checks
on:
  push:
    branches:
      - feature/chat-premium-secure-review-20261110
    paths:
      - chat.js
      - chat.html
      - docs/chat/sql/**
      - supabase/functions/chat-private-*/**
      - supabase/functions/view-once-open/**
      - tests/chat-premium-review.test.cjs
      - tests/chat-premium-browser.test.js
      - tests/chat-private-contract.test.cjs
      - tests/chat-private-postgres-fixture.sql
      - .github/workflows/chat-premium-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-chat-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse chat JavaScript
        run: node --check chat.js
      - name: Run isolated review tests
        run: node --test tests/chat-premium-review.test.cjs tests/chat-private-contract.test.cjs
  chat-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked browser-test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install headless Chromium and required libraries
        run: npx playwright install --with-deps chromium
      - name: Run isolated UI acceptance tests
        run: node --test tests/chat-premium-browser.test.js
  synthetic-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: chat_fixture_only
          POSTGRES_DB: chat_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test disposable private-media SQL and trigger behavior
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: chat_fixture_only
          PGDATABASE: chat_fixture
        run: |
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" \
            -v "$PWD:/work:ro" -w /work postgres:16 \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 \
            -U "$PGUSER" -d "$PGDATABASE" \
            -f tests/chat-private-postgres-fixture.sql
# Synthetic Postgres contains no production data or external connections.

  edge-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno type-check unpublished Edge Functions
        # JSR Supabase JS loads npm subdependencies; provision them in this
        # isolated CI job rather than changing the app's package management.
        run: >-
          deno check --node-modules-dir=auto
          supabase/functions/chat-private-upload/index.ts
          supabase/functions/view-once-open/index.ts
          supabase/functions/chat-private-cleanup/index.ts
# Type checks download public dependencies but use no app secrets or deployment.
