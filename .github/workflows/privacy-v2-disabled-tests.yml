name: Privacy V2 disabled-release tests
on:
  push:
    branches:
      - release/privacy-v2-disabled-review
  pull_request:
    paths:
      - 'api/post-media.js'
      - 'lib/protected-media/**'
      - 'tests/*media*.test.js'
      - 'tests/*asset*.test.js'
      - 'tests/production-delivery-gate.test.js'
      - 'package.json'
      - '.github/workflows/privacy-v2-disabled-tests.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:privacy-v2
