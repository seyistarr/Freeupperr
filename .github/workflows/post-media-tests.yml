name: Protected media privacy tests
on:
  workflow_dispatch:
  push:
    branches: [post-visibility-privacy-review]
  pull_request:
    paths:
      - 'api/post-media*.js'
      - 'tests/post-media*.test.js'
      - '.github/workflows/post-media-tests.yml'
jobs:
  protected-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cloudinary SDK for isolated compatibility check
        run: npm install --no-save --package-lock=false --ignore-scripts cloudinary@2
      - run: node --test tests/post-media-authorization.test.js tests/post-media-access.test.js tests/post-media-proxy.test.js tests/post-media-download-url.test.js tests/post-media-cloudinary.test.js tests/post-media-sdk-smoke.test.js
