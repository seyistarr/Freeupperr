name: Protected media tests
on:
  push:
    branches:
      - feature/post-privacy-v2-integration
  pull_request:
    paths:
      - 'api/post-media*.js'
      - 'tests/post-media-*.test.js'
      - 'package.json'
      - '.github/workflows/post-media-tests.yml'
permissions:
  contents: read
jobs:
  post-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test protected media authorization and transport
        run: npm run test:post-media
