            // ============================================================
            // LOAD MESSAGES
            // ============================================================
            async function loadMessages(convId) {
                try {
                    const { data, error } = await sb
                        .from('messages')
                        .select(`
                            *,
                            message_reactions ( user_id, emoji ),
                            message_reads ( user_id, read_at )
                        `)
                        .eq('conversation_id', convId)
                        .order('created_at', { ascending: true });

                    if (error) throw error;
                    messages = data || [];
                    renderMessages();
                    scrollToBottom();
                } catch (err) {
                    console.error('loadMessages error:', err);
                    showToast('Failed to load messages', 'r');
                }
            }

            // ============================================================
            // RENDER MESSAGES
            // ============================================================
            function renderMessages() {
                if (!messages.length) {
                    messagesArea.innerHTML = `
                        <div class="no-messages">
                            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            <h3>No messages yet</h3>
                            <p>Send a message to start the conversation.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                let lastDate = null;

                messages.forEach(msg => {
                    const msgDate = new Date(msg.created_at);
                    const dateKey = msgDate.toDateString();
                    if (dateKey !== lastDate) {
                        lastDate = dateKey;
                        html +=
                            `<div class="date-divider">${msgDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</div>`;
                    }

                    const isSent = msg.sender_id === currentUserId;
                    const time = formatTime(msg.created_at);
                    const msgClass = isSent ? 'sent' : 'received';

                    let contentHtml = '';
                    if (msg.message_type === 'image' && msg.media_url) {
                        contentHtml = `
                            <div class="msg-media" onclick="openImage('${msg.media_url}')">
                                <img src="${msg.media_url}" loading="lazy" alt="Image" />
                            </div>
                            ${msg.text ? `<div>${escapeHtml(msg.text)}</div>` : ''}
                        `;
                    } else if (msg.message_type === 'video' && msg.media_url) {
                        contentHtml = `
                            <div class="msg-media" onclick="openVideo('${msg.media_url}')">
                                <video src="${msg.media_url}" controls playsinline preload="metadata" style="max-height:300px;width:100%;"></video>
                            </div>
                            ${msg.text ? `<div>${escapeHtml(msg.text)}</div>` : ''}
                        `;
                    } else if (msg.message_type === 'voice' && msg.media_url) {
                        contentHtml = `
                            <div class="voice-msg">
                                <button class="play-btn" onclick="toggleVoicePlay(this, '${msg.media_url}')">
                                    <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                </button>
                                <div class="waveform">${Array.from({length: 30}, (_, i) => `<div class="bar ${i < 15 ? 'active' : ''}" style="height:${20 + Math.random() * 80}%;"></div>`).join('')}</div>
                                <span class="voice-duration">0:00</span>
                            </div>
                            ${msg.text ? `<div>${escapeHtml(msg.text)}</div>` : ''}
                        `;
                    } else if (msg.message_type === 'document' && msg.media_url) {
                        const fileName = msg.media_url.split('/').pop() || 'Document';
                        const ext = fileName.split('.').pop()?.toLowerCase() || '';
                        const icons = { pdf: '📄', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊', ppt: '📽️', pptx: '📽️',
                            zip: '📦', txt: '📃' };
                        const icon = icons[ext] || '📄';
                        contentHtml = `
                            <div class="msg-doc" onclick="openDocument('${msg.media_url}')">
                                <span class="doc-icon">${icon}</span>
                                <div class="doc-info">
                                    <div class="doc-name">${escapeHtml(fileName)}</div>
                                    <div class="doc-size">Tap to view</div>
                                </div>
                            </div>
                            ${msg.text ? `<div>${escapeHtml(msg.text)}</div>` : ''}
                        `;
                    } else if (msg.message_type === 'poll' && msg.poll_data) {
                        const poll = typeof msg.poll_data === 'string' ? JSON.parse(msg.poll_data) : msg.poll_data;
                        const totalVotes = poll.options.reduce((sum, o) => sum + (o.votes || 0), 0);
                        contentHtml = `
                            <div class="poll-container">
                                <div class="poll-question">${escapeHtml(poll.question)}</div>
                                ${poll.options.map((opt, idx) => {
                                    const pct = totalVotes > 0 ? Math.round((opt.votes || 0) / totalVotes * 100) : 0;
                                    const selected = poll.userVote === idx;
                                    return `
                                        <div class="poll-option ${selected ? 'selected' : ''}" onclick="votePoll('${msg.id}', ${idx})">
                                            <div class="poll-bar" style="width:${pct}%;"></div>
                                            <div class="poll-label">
                                                <span class="poll-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
                                                <span>${escapeHtml(opt.text)}</span>
                                            </div>
                                            <span class="poll-pct">${pct}%</span>
                                        </div>
                                    `;
                                }).join('')}
                                <div class="poll-total">${totalVotes} vote${totalVotes !== 1 ? 's' : ''}</div>
                            </div>
                            ${msg.text ? `<div>${escapeHtml(msg.text)}</div>` : ''}
                        `;
                    } else {
                        contentHtml = `<div>${escapeHtml(msg.text || '')}</div>`;
                    }

                    // Reply context
                    let replyHtml = '';
                    if (msg.reply_to) {
                        const replied = messages.find(m => m.id === msg.reply_to);
                        if (replied) {
                            const replyAuthor = replied.sender_id === currentUserId ? 'You' : (replied.sender_name ||
                                'User');
                            replyHtml = `
                                <div style="font-size:.75rem;opacity:.7;padding:2px 0 4px 0;border-left:2px solid var(--p);padding-left:8px;margin-bottom:4px;">
                                    ↳ ${escapeHtml(replyAuthor)}: ${escapeHtml(replied.text || '')}
                                </div>
                            `;
                        }
                    }

                    // Reactions
                    let reactionsHtml = '';
                    if (msg.message_reactions && msg.message_reactions.length) {
                        const emojiCounts = {};
                        msg.message_reactions.forEach(r => {
                            emojiCounts[r.emoji] = (emojiCounts[r.emoji] || 0) + 1;
                        });
                        reactionsHtml = Object.entries(emojiCounts).map(([emoji, count]) =>
                            `<span style="font-size:.85rem;margin-right:4px;">${emoji} ${count > 1 ? count : ''}</span>`
                        ).join('');
                    }

                    // Read receipt
                    let readReceiptHtml = '';
                    if (isSent) {
                        const reads = msg.message_reads || [];
                        const otherRead = reads.some(r => r.user_id !== currentUserId);
                        readReceiptHtml = otherRead ?
                            `<span class="read-receipt"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>` :
                            `<span class="read-receipt"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>`;
                    }

                    html += `
                        <div class="message-bubble ${msgClass}" data-msg-id="${msg.id}" data-sender-id="${msg.sender_id}" oncontextmenu="openContextMenu(event, '${msg.id}')" ondblclick="toggleReactionPicker(event, '${msg.id}')">
                            ${replyHtml}
                            ${contentHtml}
                            ${reactionsHtml ? `<div style="margin-top:4px;">${reactionsHtml}</div>` : ''}
                            <div class="msg-time">
                                ${time}
                                ${readReceiptHtml}
                            </div>
                        </div>
                    `;
                });

                messagesArea.innerHTML = html;
            }

            // ============================================================
            // SEND MESSAGE
            // ============================================================
            window.sendMessage = async function() {
                const text = messageInput.value.trim();
                if (!text || !selectedConversationId) return;
                const replyTo = replyTargetMessage ? replyTargetMessage.id : null;

                const payload = {
                    conversation_id: selectedConversationId,
                    sender_id: currentUserId,
                    text: text,
                    message_type: 'text',
                    reply_to: replyTo || null,
                };

                const tempId = 'temp-' + Date.now();
                const tempMsg = { ...payload, id: tempId, created_at: new Date().toISOString() };
                messages.push(tempMsg);
                renderMessages();
                scrollToBottom();
                messageInput.value = '';
                messageInput.style.height = 'auto';
                replyTargetMessage = null;
                messageInput.placeholder = 'Type a message...';

                try {
                    const { data, error } = await sb
                        .from('messages')
                        .insert(payload)
                        .select()
                        .single();

                    if (error) throw error;
                    const idx = messages.findIndex(m => m.id === tempId);
                    if (idx !== -1) messages[idx] = data;
                    renderMessages();

                    await sb.from('conversations')
                        .update({ updated_at: new Date().toISOString() })
                        .eq('id', selectedConversationId);

                    await loadConversations();
                } catch (err) {
                    console.error('sendMessage error:', err);
                    messages = messages.filter(m => m.id !== tempId);
                    renderMessages();
                    showToast('Failed to send message', 'r');
                }
            };

            // ============================================================
            // REAL-TIME SUBSCRIPTIONS
            // ============================================================
            function subscribeToMessages() {
                if (messageSubscription) {
                    sb.removeChannel(messageSubscription);
                    messageSubscription = null;
                }
                messageSubscription = sb.channel('messages-chat')
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'messages',
                    }, (payload) => {
                        const newMsg = payload.new;
                        if (newMsg.conversation_id === selectedConversationId) {
                            if (!messages.some(m => m.id === newMsg.id)) {
                                messages.push(newMsg);
                                renderMessages();
                                scrollToBottom();
                            }
                        }
                        loadConversations();
                    })
                    .on('postgres_changes', {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'messages',
                    }, (payload) => {
                        const updated = payload.new;
                        if (updated.conversation_id === selectedConversationId) {
                            const idx = messages.findIndex(m => m.id === updated.id);
                            if (idx !== -1) {
                                messages[idx] = updated;
                                renderMessages();
                            }
                        }
                    })
                    .on('postgres_changes', {
                        event: 'DELETE',
                        schema: 'public',
                        table: 'messages',
                    }, (payload) => {
                        const old = payload.old;
                        if (old.conversation_id === selectedConversationId) {
                            messages = messages.filter(m => m.id !== old.id);
                            renderMessages();
                        }
                    })
                    .subscribe();
            }

            function subscribeToConversations() {
                if (conversationSubscription) {
                    sb.removeChannel(conversationSubscription);
                    conversationSubscription = null;
                }
                conversationSubscription = sb.channel('conversations-chat')
                    .on('postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'conversations',
                    }, () => {
                        loadConversations();
                    })
                    .subscribe();
            }

            // ============================================================
            // TYPING INDICATORS
            // ============================================================
            function sendTypingIndicator(typing) {
                if (!selectedConversationId) return;
                const conv = conversations.find(c => c.id === selectedConversationId);
                if (!conv) return;
                let typingUsers = conv.typing_users || [];
                typingUsers = typingUsers.filter(id => id !== currentUserId);
                if (typing) typingUsers.push(currentUserId);
                sb.from('conversations')
                    .update({ typing_users: typingUsers })
                    .eq('id', selectedConversationId)
                    .then(() => {})
                    .catch(() => {});
            }

            // ============================================================
            // UPLOADS (Cloudinary)
            // ============================================================
            function uploadToCloudinary(file, onProgress) {
                return new Promise((resolve, reject) => {
                    const isVideo = file.type.startsWith('video');
                    const resourceType = isVideo ? 'video' : 'image';
                    const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', url);
                    xhr.timeout = 300000;

                    if (onProgress) {
                        xhr.upload.addEventListener('progress', (e) => {
                            if (e.lengthComputable) {
                                onProgress(Math.round((e.loaded / e.total) * 100));
                            }
                        });
                    }

                    xhr.onload = () => {
                        if (xhr.status === 200) {
                            try {
                                const data = JSON.parse(xhr.responseText);
                                resolve({ url: data.secure_url, type: resourceType });
                            } catch (e) {
                                reject(new Error('Invalid response from Cloudinary'));
                            }
                        } else {
                            reject(new Error(`Upload failed (HTTP ${xhr.status})`));
                        }
                    };
                    xhr.onerror = () => reject(new Error('Network error during upload'));
                    xhr.ontimeout = () => reject(new Error('Upload timed out'));
                    xhr.send(formData);
                });
            }

            // ============================================================
            // ATTACHMENT HANDLERS
            // ============================================================
            window.toggleAttachMenu = function() {
                document.getElementById('attachMenu').classList.toggle('open');
            };

            window.handleAttach = function(type) {
                document.getElementById('attachMenu').classList.remove('open');
                if (type === 'poll') { openPollModal(); return; }
                if (type === 'voice') { startVoiceRecording(); return; }
                fileInput.accept = type === 'image' ? 'image/*' : type === 'video' ? 'video/*' :
                    'application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain';
                fileInput.multiple = type === 'image';
                fileInput.dataset.type = type;
                fileInput.click();
            };

            // ============================================================
            // VOICE RECORDING
            // ============================================================
            let mediaRecorder = null;
            let audioChunks = [];
            let isRecording = false;

            function startVoiceRecording() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showToast('Voice recording not supported', 'o');
                    return;
                }
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        mediaRecorder = new MediaRecorder(stream);
                        audioChunks = [];
                        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                        mediaRecorder.onstop = () => {
                            const blob = new Blob(audioChunks, { type: 'audio/webm' });
                            const file = new File([blob], 'voice.webm', { type: 'audio/webm' });
                            uploadVoice(file);
                            stream.getTracks().forEach(t => t.stop());
                        };
                        mediaRecorder.start();
                        isRecording = true;
                        showToast('Recording... tap again to stop', 'p');
                    })
                    .catch(() => showToast('Could not access microphone', 'r'));
            }

            function stopVoiceRecording() {
                if (mediaRecorder && isRecording) {
                    mediaRecorder.stop();
                    isRecording = false;
                    showToast('Recording stopped', 'p');
                }
            }

            document.addEventListener('click', function(e) {
                if (e.target.closest('.attach-option') && e.target.closest('.attach-option').textContent.includes(
                        'Voice')) {
                    if (isRecording) stopVoiceRecording();
                }
            });

            async function uploadVoice(file) {
                showUploadProgress('Uploading voice note...');
                try {
                    const result = await uploadToCloudinary(file, (pct) => {
                        updateUploadProgress(pct);
                    });
                    hideUploadProgress();
                    await sendMessageToConv('', 'voice', result.url);
                } catch (err) {
                    hideUploadProgress();
                    showToast('Voice upload failed: ' + err.message, 'r');
                }
            }

            // Helper to send with custom payloads
            async function sendMessageToConv(text, type = 'text', mediaUrl = null, replyTo = null, pollData = null) {
                if (!selectedConversationId) return;
                const payload = {
                    conversation_id: selectedConversationId,
                    sender_id: currentUserId,
                    text: text || '',
                    message_type: type,
                    media_url: mediaUrl || null,
                    reply_to: replyTo || null,
                    poll_data: pollData || null,
                };
                const tempId = 'temp-' + Date.now();
                const tempMsg = { ...payload, id: tempId, created_at: new Date().toISOString() };
                messages.push(tempMsg);
                renderMessages();
                scrollToBottom();

                try {
                    const { data, error } = await sb
                        .from('messages')
                        .insert(payload)
                        .select()
                        .single();
                    if (error) throw error;
                    const idx = messages.findIndex(m => m.id === tempId);
                    if (idx !== -1) messages[idx] = data;
                    renderMessages();
                    await sb.from('conversations')
                        .update({ updated_at: new Date().toISOString() })
                        .eq('id', selectedConversationId);
                    await loadConversations();
                } catch (err) {
                    console.error('sendMessage error:', err);
                    messages = messages.filter(m => m.id !== tempId);
                    renderMessages();
                    showToast('Failed to send message', 'r');
                }
            }

            // ============================================================
            // FILE UPLOAD HANDLER
            // ============================================================
            fileInput.addEventListener('change', async function() {
                const files = Array.from(this.files);
                if (!files.length) return;
                this.value = '';

                const type = this.dataset.type || 'image';
                const isImage = type === 'image';
                const isVideo = type === 'video';

                for (const file of files) {
                    if (file.size > MAX_FILE_SIZE) {
                        showToast(`${file.name} is too large (max 25MB)`, 'o');
                        continue;
                    }
                    const label = isImage ? 'Uploading image...' : isVideo ? 'Uploading video...' :
                        'Uploading document...';
                    showUploadProgress(label);
                    try {
                        const result = await uploadToCloudinary(file, (pct) => {
                            updateUploadProgress(pct);
                        });
                        hideUploadProgress();
                        const msgType = isImage ? 'image' : isVideo ? 'video' : 'document';
                        await sendMessageToConv('', msgType, result.url);
                    } catch (err) {
                        hideUploadProgress();
                        showToast('Upload failed: ' + err.message, 'r');
                    }
                }
            });

            // ============================================================
            // UPLOAD PROGRESS UI
            // ============================================================
            function showUploadProgress(label) {
                uploadProgress.classList.add('visible');
                uploadLabel.textContent = label || 'Uploading...';
                uploadProgressFill.style.width = '0%';
                uploadPercent.textContent = '0%';
            }

            function updateUploadProgress(pct) {
                uploadProgressFill.style.width = pct + '%';
                uploadPercent.textContent = pct + '%';
            }

            function hideUploadProgress() {
                uploadProgress.classList.remove('visible');
            }

            // ============================================================
            // POLLS
            // ============================================================
            function openPollModal() {
                document.getElementById('pollModal').classList.add('open');
                pollQuestion.value = '';
                pollOptionsList.innerHTML = `
                    <div class="opt-row"><input type="text" class="poll-opt-input" placeholder="Option 1" maxlength="60"></div>
                    <div class="opt-row"><input type="text" class="poll-opt-input" placeholder="Option 2" maxlength="60"></div>
                `;
            }

            window.closePollModal = function() {
                document.getElementById('pollModal').classList.remove('open');
            };

            window.addPollOption = function() {
                const rows = pollOptionsList.querySelectorAll('.opt-row');
                if (rows.length >= 6) { showToast('Maximum 6 options', 'o'); return; }
                const row = document.createElement('div');
                row.className = 'opt-row';
                row.innerHTML = `
                    <input type="text" class="poll-opt-input" placeholder="Option ${rows.length + 1}" maxlength="60">
                    <button onclick="this.parentElement.remove()">×</button>
                `;
                pollOptionsList.appendChild(row);
            };

            window.sendPoll = function() {
                const question = pollQuestion.value.trim();
                if (!question) { showToast('Please enter a question', 'o'); return; }
                const inputs = pollOptionsList.querySelectorAll('.poll-opt-input');
                const options = Array.from(inputs).map(inp => inp.value.trim()).filter(Boolean);
                if (options.length < 2) { showToast('Please add at least 2 options', 'o'); return; }

                const pollData = {
                    question: question,
                    options: options.map(text => ({ text, votes: 0 })),
                    totalVotes: 0,
                };
                closePollModal();
                sendMessageToConv('', 'poll', null, null, pollData);
            };

            window.votePoll = async function(messageId, optionIdx) {
                const msg = messages.find(m => m.id === messageId);
                if (!msg || msg.sender_id === currentUserId) return;
                let poll = typeof msg.poll_data === 'string' ? JSON.parse(msg.poll_data) : msg.poll_data;
                if (poll.userVote !== undefined) { showToast('You already voted', 'o'); return; }

                poll.options[optionIdx].votes = (poll.options[optionIdx].votes || 0) + 1;
                poll.totalVotes = (poll.totalVotes || 0) + 1;
                poll.userVote = optionIdx;

                try {
                    await sb.from('messages')
                        .update({ poll_data: poll })
                        .eq('id', messageId);
                    msg.poll_data = poll;
                    renderMessages();
                } catch (err) {
                    showToast('Failed to vote', 'r');
                }
            };

            // ============================================================
            // CONTEXT MENU
            // ============================================================
            window.openContextMenu = function(event, msgId) {
                event.preventDefault();
                contextMenuMsgId = msgId;
                const msg = messages.find(m => m.id === msgId);
                if (!msg) return;
                const menu = document.getElementById('msgContextMenu');
                const x = Math.min(event.clientX, window.innerWidth - 200);
                const y = Math.min(event.clientY, window.innerHeight - 120);
                menu.style.left = x + 'px';
                menu.style.top = y + 'px';
                menu.classList.add('open');

                const isOwner = msg.sender_id === currentUserId;
                menu.querySelectorAll('.menu-item')[2].style.display = isOwner ? 'flex' : 'none';
            };

            document.addEventListener('click', () => {
                document.getElementById('msgContextMenu').classList.remove('open');
                document.getElementById('reactionPicker').classList.remove('open');
            });

            window.replyToMessage = function() {
                const msg = messages.find(m => m.id === contextMenuMsgId);
                if (msg) {
                    replyTargetMessage = msg;
                    messageInput.focus();
                    messageInput.placeholder = `Replying to ${msg.sender_id === currentUserId ? 'yourself' : '...'}`;
                    document.getElementById('msgContextMenu').classList.remove('open');
                }
            };

            window.copyMessage = function() {
                const msg = messages.find(m => m.id === contextMenuMsgId);
                if (msg && msg.text) {
                    navigator.clipboard.writeText(msg.text).then(() => {
                        showToast('Copied to clipboard', 'g');
                    }).catch(() => {});
                }
                document.getElementById('msgContextMenu').classList.remove('open');
            };

            window.deleteMessage = function() {
                const msgId = contextMenuMsgId;
                if (!msgId) return;
                const msg = messages.find(m => m.id === msgId);
                if (!msg || msg.sender_id !== currentUserId) return;
                if (!confirm('Delete this message?')) return;

                sb.from('messages')
                    .delete()
                    .eq('id', msgId)
                    .then(({ error }) => {
                        if (error) showToast('Failed to delete', 'r');
                        else {
                            messages = messages.filter(m => m.id !== msgId);
                            renderMessages();
                            showToast('Message deleted', 'g');
                        }
                    });
                document.getElementById('msgContextMenu').classList.remove('open');
            };

            // ============================================================
            // REACTION PICKER
            // ============================================================
            const REACTIONS = ['👍', '❤️', '😂', '😮', '😢', '🔥', '👏'];

            window.toggleReactionPicker = function(event, msgId) {
                const picker = document.getElementById('reactionPicker');
                const rect = event.target.closest('.message-bubble')?.getBoundingClientRect();
                if (!rect) return;
                picker.innerHTML = REACTIONS.map(r =>
                    `<span class="reaction-emoji" onclick="addReaction('${msgId}', '${r}')">${r}</span>`
                ).join('');
                picker.style.left = (rect.left + rect.width / 2 - 80) + 'px';
                picker.style.top = (rect.top - 50) + 'px';
                picker.classList.toggle('open');
            };

            window.addReaction = async function(msgId, emoji) {
                document.getElementById('reactionPicker').classList.remove('open');
                try {
                    const { error } = await sb
                        .from('message_reactions')
                        .insert({
                            message_id: msgId,
                            user_id: currentUserId,
                            emoji: emoji
                        });
                    if (error) {
                        if (error.code === '23505') { showToast('Already reacted', 'o'); return; }
                        throw error;
                    }
                    showToast(`Reacted ${emoji}`, 'p');
                    await loadMessages(selectedConversationId);
                } catch (err) {
                    showToast('Failed to add reaction', 'r');
                }
            };

            // ============================================================
            // MEDIA VIEWERS
            // ============================================================
            window.openImage = function(url) {
                const modal = document.createElement('div');
                modal.style.cssText =
                    'position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;';
                modal.innerHTML = `<img src="${url}" style="max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px;" />`;
                modal.onclick = () => modal.remove();
                document.body.appendChild(modal);
            };

            window.openVideo = function(url) {
                const modal = document.createElement('div');
                modal.style.cssText =
                    'position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;';
                modal.innerHTML = `<video src="${url}" controls autoplay style="max-width:95vw;max-height:95vh;border-radius:8px;" />`;
                modal.onclick = () => { modal.remove(); };
                document.body.appendChild(modal);
            };

            window.openDocument = function(url) {
                window.open(url, '_blank');
            };

            // ============================================================
            // VOICE PLAYBACK
            // ============================================================
            let currentAudio = null;

            window.toggleVoicePlay = function(btn, url) {
                if (currentAudio && !currentAudio.paused) {
                    currentAudio.pause();
                    currentAudio = null;
                    btn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
                    return;
                }
                const audio = new Audio(url);
                audio.play();
                currentAudio = audio;
                btn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
                audio.onended = () => {
                    btn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
                    currentAudio = null;
                };
            };

            // ============================================================
            // NEW CHAT MODAL (full-screen user search)
            // ============================================================
            window.openNewChatModal = function() {
                const modal = document.getElementById('newChatModal');
                modal.classList.add('open');
                document.getElementById('userSearchInput').value = '';
                document.getElementById('userSearchResults').innerHTML = '<div class="modal-empty">Type to find users</div>';
                document.getElementById('userSearchInput').focus();
                loadAllUsers();
            };

            window.closeNewChatModal = function() {
                document.getElementById('newChatModal').classList.remove('open');
            };

            async function loadAllUsers() {
                try {
                    const { data, error } = await sb
                        .from('profiles')
                        .select('id, display_name, username, avatar_url, verified_status')
                        .neq('id', currentUserId);
                    if (error) throw error;
                    allUsers = data || [];
                } catch (err) {
                    console.error('loadAllUsers error:', err);
                }
            }

            // Search function for the modal
            window.searchUsersInModal = function(query) {
                const q = query.toLowerCase().trim();
                const resultsContainer = document.getElementById('userSearchResults');
                if (!q) {
                    resultsContainer.innerHTML = '<div class="modal-empty">Type to find users</div>';
                    return;
                }
                const results = allUsers.filter(u =>
                    (u.display_name || '').toLowerCase().includes(q) ||
                    (u.username || '').toLowerCase().includes(q)
                );
                if (!results.length) {
                    resultsContainer.innerHTML = '<div class="modal-empty">No users found</div>';
                    return;
                }
                resultsContainer.innerHTML = results.map(u => {
                    const name = getDisplayName(u);
                    const avatar = getAvatar(u);
                    const badge = getVerifiedBadge(u.verified_status);
                    return `
                        <div class="user-row" onclick="startConversationWith('${u.id}')">
                            <img class="u-av" src="${avatar}" alt="${escapeHtml(name)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 100 100\\'%3E%3Ccircle cx=\\'50\\' cy=\\'50\\' r=\\'50\\' fill=\\'%23E5E7EB\\'/%3E%3Ccircle cx=\\'50\\' cy=\\'38\\' r=\\'16\\' fill=\\'%239CA3AF\\'/%3E%3Cellipse cx=\\'50\\' cy=\\'75\\' rx=\\'30\\' ry=\\'22\\' fill=\\'%239CA3AF\\'/%3E%3C/svg%3E'">
                            <div>
                                <div class="u-name">${escapeHtml(name)} ${badge}</div>
                                <div class="u-handle">@${escapeHtml(u.username||'')}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            };

            // ============================================================
            // START CONVERSATION WITH A USER
            // ============================================================
            window.startConversationWith = async function(otherUserId) {
                closeNewChatModal();
                let existing = conversations.find(c =>
                    (c.user1_id === currentUserId && c.user2_id === otherUserId) ||
                    (c.user1_id === otherUserId && c.user2_id === currentUserId)
                );
                if (existing) {
                    selectConversation(existing.id);
                    return;
                }
                try {
                    const { data, error } = await sb
                        .from('conversations')
                        .insert({
                            user1_id: currentUserId,
                            user2_id: otherUserId,
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString(),
                            typing_users: [],
                        })
                        .select()
                        .single();
                    if (error) throw error;
                    await loadConversations();
                    const newConv = conversations.find(c => c.id === data.id);
                    if (newConv) {
                        const otherProfile = allUsers.find(u => u.id === otherUserId);
                        if (otherProfile) newConv.otherUser = otherProfile;
                        selectConversation(data.id);
                    }
                } catch (err) {
                    console.error('startConversationWith error:', err);
                    showToast('Failed to create conversation', 'r');
                }
            };

            // ============================================================
            // CLOSE CHAT VIEW (mobile)
            // ============================================================
            window.closeChatView = function() {
                selectedConversationId = null;
                selectedPartnerId = null;
                messages = [];
                messagesArea.innerHTML = `
                    <div class="no-messages">
                        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <h3>No conversation selected</h3>
                        <p>Choose a conversation from the list or start a new one.</p>
                    </div>
                `;
                chatPartnerName.textContent = 'Select a conversation';
                chatPartnerAvatar.src = '';
                chatPartnerStatus.textContent = '';
                messageInput.disabled = true;
                sendBtn.disabled = true;
                document.getElementById('conversationsSidebar').classList.remove('hidden');
                renderConversations(convSearch.value);
            };

            window.openPartnerProfile = function() {
                if (selectedPartnerId) {
                    window.location.href = 'profile.html?uid=' + selectedPartnerId;
                }
            };

            // ============================================================
            // EVENT LISTENERS
            // ============================================================
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    window.sendMessage();
                }
                if (typingTimeout) clearTimeout(typingTimeout);
                sendTypingIndicator(true);
                typingTimeout = setTimeout(() => sendTypingIndicator(false), 2000);
            });

            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            });

            document.addEventListener('click', (e) => {
                const menu = document.getElementById('attachMenu');
                if (!menu.contains(e.target) && !e.target.closest('.attach-btn')) {
                    menu.classList.remove('open');
                }
            });

            // ============================================================
            // INIT
            // ============================================================
            async function initChat() {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) {
                    showToast('Please sign in to view messages', 'o');
                    if (window.AuthUser && window.AuthUser.openModal) {
                        window.AuthUser.openModal('signup', () => { window.location.reload(); });
                    }
                    return;
                }
                currentUserId = user.id;
                await loadMutualFollowers();
                await loadConversations();
                subscribeToMessages();
                subscribeToConversations();

                if (conversations.length > 0) {
                    selectConversation(conversations[0].id);
                }

                const params = new URLSearchParams(window.location.search);
                const uid = params.get('uid');
                if (uid) {
                    const existing = conversations.find(c => c.otherUserId === uid);
                    if (existing) {
                        selectConversation(existing.id);
                    } else {
                        const { data, error } = await sb
                            .from('profiles')
                            .select('id')
                            .eq('id', uid)
                            .single();
                        if (!error && data) {
                            await startConversationWith(uid);
                        }
                    }
                    history.replaceState({}, '', window.location.pathname);
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initChat);
            } else {
                initChat();
            }

        })();
    </script>

</body>
</html>
