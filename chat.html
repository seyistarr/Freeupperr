<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Chat · FreeUpper</title>
    <link rel="icon" type="image/png" href="freeupper.png" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="bottom-nav.css" />
    <link rel="stylesheet" href="side-nav.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="global.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="bottom-nav.js" defer></script>
    <script src="side-nav.js" defer></script>

    <style>
        /* ============================================================
           CHAT STYLES
        ============================================================ */
        :root {
            --chat-header-h: 56px;
            --chat-input-h: 64px;
            --sidebar-w: 360px;
            --max-msg-width: 75%;
            --avatar-size: 42px;
            --bubble-radius: 18px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        .layout { display: flex; height: 100vh; width: 100%; overflow: hidden; }
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

        /* ─── HEADER ─── */
        .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--brd); flex-shrink: 0; min-height: var(--chat-header-h); }
        .chat-header .brand { font-family: 'Poppins', 'Inter', sans-serif; font-weight: 900; font-size: 1.1rem; cursor: pointer; color: var(--text); display: flex; align-items: center; gap: 2px; }
        .chat-header .brand span { color: var(--p); }
        .chat-header .header-actions { display: flex; align-items: center; gap: 6px; }
        .chat-header .header-actions button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 50%; transition: background .15s, color .15s; display: flex; align-items: center; justify-content: center; }
        .chat-header .header-actions button:hover { background: var(--pdim); color: var(--p); }
        .chat-header .header-actions button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* ─── CHAT CONTAINER ─── */
        .chat-container { display: flex; flex: 1; overflow: hidden; position: relative; background: var(--bg); }

        /* ─── SIDEBAR ─── */
        .conversations-sidebar { width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--brd); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; transition: transform .25s ease; z-index: 5; }
        .conversations-sidebar .sidebar-header { padding: 14px 16px 8px; border-bottom: 1px solid var(--brd); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
        .conversations-sidebar .sidebar-header h2 { font-size: 1.1rem; font-weight: 800; color: var(--text); }
        .conversations-sidebar .sidebar-header .new-chat-btn { background: var(--p); color: #fff; border: none; border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: .8rem; cursor: pointer; transition: opacity .15s; }
        .conversations-sidebar .sidebar-header .new-chat-btn:hover { opacity: .85; }
        .conversations-sidebar .search-box { padding: 8px 16px; flex-shrink: 0; }
        .conversations-sidebar .search-box input { width: 100%; padding: 8px 14px 8px 36px; border-radius: 20px; border: 1.5px solid var(--brd); background: var(--inp); font-size: .9rem; color: var(--text); outline: none; transition: border-color .15s; background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='rgba(150,150,150,0.5)' stroke-width='2' stroke-linecap='round' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='11' cy='11' r='8'/%3E%3Cline x1='21' y1='21' x2='16.65' y2='16.65'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: 12px center; }
        .conversations-sidebar .search-box input:focus { border-color: var(--p); }
        .conversations-sidebar .conversation-list { flex: 1; overflow-y: auto; padding: 8px 0; -webkit-overflow-scrolling: touch; }
        .conversations-sidebar .conversation-list::-webkit-scrollbar { width: 0; }

        /* ─── CONVERSATION ITEM (also used for user search results) ─── */
        .conv-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; transition: background .12s; border-bottom: 1px solid var(--brd); position: relative; }
        .conv-item:hover { background: var(--pdim); }
        .conv-item.active { background: var(--pdim); border-left: 3px solid var(--p); }
        .conv-item .av { width: var(--avatar-size); height: var(--avatar-size); border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--bg4); position: relative; }
        .conv-item .av .online-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; background: #22c55e; border: 2px solid var(--bg2); }
        .conv-item .conv-info { flex: 1; min-width: 0; }
        .conv-item .conv-name { font-weight: 700; font-size: .95rem; color: var(--text); display: flex; align-items: center; gap: 4px; }
        .conv-item .conv-last-msg { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .conv-item .conv-last-msg .msg-sender { font-weight: 600; color: var(--text); }
        .conv-item .conv-time { font-size: .7rem; color: var(--muted2); flex-shrink: 0; align-self: flex-start; margin-top: 4px; }
        .conv-item .unread-badge { background: var(--p); color: #fff; font-size: .65rem; font-weight: 700; border-radius: 50%; min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; padding: 0 6px; flex-shrink: 0; }
        .conv-item .start-chat-btn { background: var(--p); color: #fff; border: none; border-radius: 16px; padding: 4px 12px; font-size: .7rem; font-weight: 700; cursor: pointer; transition: opacity .15s; }
        .conv-item .start-chat-btn:hover { opacity: .85; }

        /* ─── SECTION HEADER IN SEARCH RESULTS ─── */
        .search-section-header { font-size: .7rem; font-weight: 700; color: var(--muted2); text-transform: uppercase; letter-spacing: .05em; padding: 12px 16px 4px; border-bottom: 1px solid var(--brd); }

        /* ─── CHAT VIEW ─── */
        .chat-view { flex: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; position: relative; }
        .chat-view .chat-view-header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--brd); flex-shrink: 0; min-height: 56px; }
        .chat-view .chat-view-header .back-btn { display: none; background: none; border: none; color: var(--text); cursor: pointer; padding: 4px; }
        .chat-view .chat-view-header .back-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .chat-view .chat-view-header .chat-partner-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: var(--bg4); flex-shrink: 0; cursor: pointer; }
        .chat-view .chat-view-header .chat-partner-info { flex: 1; min-width: 0; cursor: pointer; }
        .chat-view .chat-view-header .chat-partner-name { font-weight: 700; font-size: 1rem; color: var(--text); display: flex; align-items: center; gap: 4px; }
        .chat-view .chat-view-header .chat-partner-status { font-size: .75rem; color: var(--muted); }
        .chat-view .chat-view-header .chat-actions { display: flex; gap: 4px; }
        .chat-view .chat-view-header .chat-actions button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 50%; transition: background .15s, color .15s; display: flex; align-items: center; justify-content: center; }
        .chat-view .chat-view-header .chat-actions button:hover { background: var(--pdim); color: var(--p); }
        .chat-view .chat-view-header .chat-actions button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* ─── MESSAGES AREA ─── */
        .messages-area { flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 2px; -webkit-overflow-scrolling: touch; background: var(--bg); position: relative; }
        .messages-area::-webkit-scrollbar { width: 0; }

        .date-divider { text-align: center; padding: 12px 0 8px; font-size: .75rem; color: var(--muted2); font-weight: 600; position: sticky; top: 0; z-index: 2; background: var(--bg); }

        .message-bubble { max-width: var(--max-msg-width); padding: 10px 14px; border-radius: var(--bubble-radius); font-size: .9rem; line-height: 1.5; word-break: break-word; position: relative; animation: fadeUp .15s ease both; margin-bottom: 2px; }
        .message-bubble.sent { align-self: flex-end; background: var(--p); color: #fff; border-bottom-right-radius: 4px; }
        .message-bubble.received { align-self: flex-start; background: var(--bg3); border: 1px solid var(--brd); color: var(--text); border-bottom-left-radius: 4px; }
        .message-bubble .msg-time { font-size: .65rem; opacity: .7; margin-top: 4px; text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
        .message-bubble .msg-time .read-receipt { display: inline-flex; align-items: center; }
        .message-bubble .msg-time .read-receipt svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .message-bubble .msg-media { margin: -4px -2px 6px; border-radius: 12px; overflow: hidden; cursor: pointer; background: #000; max-height: 300px; }
        .message-bubble .msg-media img, .message-bubble .msg-media video { width: 100%; max-height: 300px; object-fit: contain; display: block; }
        .message-bubble .msg-doc { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(255,255,255,.06); border-radius: 10px; margin: 4px 0 6px; cursor: pointer; transition: background .15s; }
        .message-bubble .msg-doc:hover { background: rgba(255,255,255,.12); }
        .message-bubble .msg-doc .doc-icon { font-size: 1.6rem; line-height: 1; }
        .message-bubble .msg-doc .doc-info { flex: 1; min-width: 0; }
        .message-bubble .msg-doc .doc-name { font-weight: 600; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .message-bubble .msg-doc .doc-size { font-size: .7rem; opacity: .6; }

        /* Voice */
        .message-bubble .voice-msg { display: flex; align-items: center; gap: 12px; padding: 4px 0; min-width: 120px; }
        .message-bubble .voice-msg .play-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--p); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .15s; }
        .message-bubble .voice-msg .play-btn:active { transform: scale(.92); }
        .message-bubble .voice-msg .play-btn svg { width: 14px; height: 14px; fill: currentColor; }
        .message-bubble .voice-msg .waveform { flex: 1; height: 28px; display: flex; align-items: center; gap: 2px; }
        .message-bubble .voice-msg .waveform .bar { flex: 1; height: 100%; background: var(--muted2); border-radius: 2px; transition: height .1s; }
        .message-bubble .voice-msg .waveform .bar.active { background: var(--p); }
        .message-bubble .voice-msg .voice-duration { font-size: .75rem; opacity: .7; flex-shrink: 0; }

        /* Poll */
        .message-bubble .poll-container { margin: 6px 0 2px; padding: 12px 14px; background: rgba(255,255,255,.05); border-radius: 12px; border: 1px solid var(--brd); }
        .message-bubble .poll-container .poll-question { font-weight: 700; font-size: .95rem; margin-bottom: 8px; }
        .message-bubble .poll-container .poll-option { display: flex; align-items: center; gap: 10px; padding: 6px 10px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; transition: background .12s; position: relative; }
        .message-bubble .poll-container .poll-option:hover { background: var(--pdim); }
        .message-bubble .poll-container .poll-option .poll-bar { position: absolute; left: 0; top: 0; height: 100%; background: var(--pdim); border-radius: 8px; transition: width .3s ease; pointer-events: none; }
        .message-bubble .poll-container .poll-option .poll-label { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        .message-bubble .poll-container .poll-option .poll-label .poll-check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
        .message-bubble .poll-container .poll-option.selected .poll-check { border-color: var(--p); background: var(--p); }
        .message-bubble .poll-container .poll-option.selected .poll-check svg { display: block; }
        .message-bubble .poll-container .poll-option .poll-check svg { display: none; width: 10px; height: 10px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; }
        .message-bubble .poll-container .poll-option .poll-pct { font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0; position: relative; z-index: 1; }
        .message-bubble .poll-container .poll-total { font-size: .7rem; color: var(--muted2); margin-top: 6px; text-align: right; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .typing-indicator { align-self: flex-start; padding: 8px 14px; background: var(--bg3); border: 1px solid var(--brd); border-radius: var(--bubble-radius); border-bottom-left-radius: 4px; display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); animation: fadeUp .2s ease both; }
        .typing-indicator .dots { display: flex; gap: 4px; }
        .typing-indicator .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted2); animation: typingDot 1.2s infinite; }
        .typing-indicator .dots span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes typingDot { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-6px); opacity: 1; } }

        .no-messages { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted); text-align: center; gap: 8px; }
        .no-messages svg { width: 48px; height: 48px; stroke: var(--muted2); fill: none; stroke-width: 1.5; }
        .no-messages h3 { font-weight: 700; font-size: 1.1rem; }
        .no-messages p { font-size: .9rem; max-width: 220px; }

        /* ─── MESSAGE INPUT ─── */
        .message-input-area { display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px; padding-bottom: max(8px, var(--safe-bottom)); background: var(--bg2); border-top: 1px solid var(--brd); flex-shrink: 0; min-height: var(--chat-input-h); }
        .message-input-area .input-wrapper { flex: 1; display: flex; align-items: flex-end; gap: 6px; background: var(--inp); border: 1.5px solid var(--brd); border-radius: 24px; padding: 4px 6px 4px 14px; transition: border-color .15s; position: relative; }
        .message-input-area .input-wrapper:focus-within { border-color: var(--p); box-shadow: 0 0 0 3px var(--pdim); }
        .message-input-area .input-wrapper .attach-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background .15s, color .15s; flex-shrink: 0; }
        .message-input-area .input-wrapper .attach-btn:hover { background: var(--pdim); color: var(--p); }
        .message-input-area .input-wrapper .attach-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .message-input-area .input-wrapper textarea { flex: 1; border: none; padding: 8px 0; font-size: .9rem; resize: none; outline: none; font-family: inherit; background: transparent; color: var(--text); line-height: 1.4; min-height: 20px; max-height: 100px; box-sizing: border-box; }
        .message-input-area .input-wrapper textarea::placeholder { color: var(--muted2); }
        .message-input-area .send-btn { background: var(--p); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: opacity .15s, transform .15s; }
        .message-input-area .send-btn:active { transform: scale(.92); }
        .message-input-area .send-btn:disabled { opacity: .4; cursor: not-allowed; }
        .message-input-area .send-btn svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

        .attach-menu { display: none; position: absolute; bottom: 70px; left: 12px; background: var(--bg3); border: 1px solid var(--brd); border-radius: 16px; padding: 12px 16px; box-shadow: 0 8px 32px rgba(0,0,0,.3); z-index: 20; min-width: 200px; }
        .attach-menu.open { display: block; }
        .attach-menu .attach-option { display: flex; align-items: center; gap: 12px; padding: 8px 4px; cursor: pointer; border-radius: 8px; transition: background .12s; color: var(--text); }
        .attach-menu .attach-option:hover { background: var(--pdim); }
        .attach-menu .attach-option .icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
        .attach-menu .attach-option .label { font-size: .85rem; font-weight: 600; }

        /* ─── NEW CHAT MODAL ─── */
        .new-chat-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,.5);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .new-chat-modal.open { display: flex; }
        .new-chat-modal .modal-sheet {
            background: var(--bg3);
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--brd2);
            box-shadow: 0 24px 60px rgba(0,0,0,.4);
            overflow: hidden;
            animation: fadeUp .25s ease both;
        }
        .modal-sheet .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--brd); flex-shrink: 0; }
        .modal-sheet .modal-header h3 { font-weight: 800; font-size: 1.1rem; color: var(--text); }
        .modal-sheet .modal-header button { background: none; border: none; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: background .15s; }
        .modal-sheet .modal-header button:hover { background: var(--pdim); }
        .modal-sheet .modal-header button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }
        .modal-sheet .modal-search { padding: 12px 20px; flex-shrink: 0; border-bottom: 1px solid var(--brd); }
        .modal-sheet .modal-search input { width: 100%; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--brd); background: var(--inp); font-size: .9rem; color: var(--text); outline: none; transition: border-color .15s; }
        .modal-sheet .modal-search input:focus { border-color: var(--p); }
        .modal-sheet .modal-list { flex: 1; overflow-y: auto; padding: 8px 0; -webkit-overflow-scrolling: touch; }
        .modal-sheet .modal-list::-webkit-scrollbar { width: 0; }
        .modal-sheet .user-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; transition: background .12s; }
        .modal-sheet .user-row:hover { background: var(--pdim); }
        .modal-sheet .user-row .u-av { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--bg4); flex-shrink: 0; }
        .modal-sheet .user-row .u-name { font-weight: 700; font-size: .9rem; color: var(--text); }
        .modal-sheet .user-row .u-handle { font-size: .8rem; color: var(--muted); }
        .modal-sheet .modal-empty { text-align: center; padding: 40px 20px; color: var(--muted); }

        /* ─── CONTEXT MENU ─── */
        .msg-context-menu { position: fixed; background: var(--bg3); border: 1px solid var(--brd); border-radius: 14px; padding: 6px 0; box-shadow: 0 8px 32px rgba(0,0,0,.4); z-index: 300; min-width: 180px; display: none; animation: fadeUp .15s ease both; }
        .msg-context-menu.open { display: block; }
        .msg-context-menu .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; transition: background .1s; font-size: .85rem; color: var(--text); border: none; background: none; width: 100%; text-align: left; }
        .msg-context-menu .menu-item:hover { background: var(--pdim); }
        .msg-context-menu .menu-item.danger { color: var(--danger); }
        .msg-context-menu .menu-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

        /* ─── REACTION PICKER ─── */
        .reaction-picker { display: none; position: absolute; bottom: 100%; left: 0; background: var(--bg3); border: 1px solid var(--brd); border-radius: 20px; padding: 6px 10px; box-shadow: 0 8px 32px rgba(0,0,0,.3); z-index: 30; gap: 4px; animation: fadeUp .15s ease both; }
        .reaction-picker.open { display: flex; }
        .reaction-picker .reaction-emoji { font-size: 1.5rem; cursor: pointer; padding: 4px 6px; border-radius: 50%; transition: transform .15s, background .15s; line-height: 1; }
        .reaction-picker .reaction-emoji:hover { transform: scale(1.2); background: var(--pdim); }

        /* ─── UPLOAD PROGRESS ─── */
        .upload-progress { display: none; align-self: flex-end; max-width: var(--max-msg-width); padding: 10px 14px; background: var(--bg3); border: 1px solid var(--brd); border-radius: var(--bubble-radius); border-bottom-right-radius: 4px; font-size: .8rem; color: var(--muted); gap: 8px; align-items: center; }
        .upload-progress.visible { display: flex; }
        .upload-progress .progress-bar { flex: 1; height: 4px; background: var(--brd); border-radius: 2px; overflow: hidden; min-width: 60px; }
        .upload-progress .progress-bar .fill { height: 100%; background: var(--p); width: 0%; transition: width .15s; }

        /* ─── POLL MODAL ─── */
        .poll-modal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px; }
        .poll-modal.open { display: flex; }
        .poll-modal .poll-sheet { background: var(--bg3); border-radius: 24px; max-width: 480px; width: 100%; max-height: 80vh; display: flex; flex-direction: column; border: 1px solid var(--brd2); box-shadow: 0 24px 60px rgba(0,0,0,.4); padding: 20px 24px 24px; overflow: hidden; animation: fadeUp .25s ease both; }
        .poll-sheet .poll-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .poll-sheet .poll-header h3 { font-weight: 800; font-size: 1.1rem; }
        .poll-sheet .poll-header button { background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; }
        .poll-sheet .poll-header button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
        .poll-sheet .form-group { margin-bottom: 12px; }
        .poll-sheet .form-group label { font-size: .8rem; font-weight: 700; color: var(--muted); display: block; margin-bottom: 4px; }
        .poll-sheet .form-group input { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--brd); background: var(--inp); font-size: .9rem; color: var(--text); outline: none; transition: border-color .15s; }
        .poll-sheet .form-group input:focus { border-color: var(--p); }
        .poll-sheet .poll-options-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
        .poll-sheet .poll-options-list .opt-row { display: flex; align-items: center; gap: 8px; }
        .poll-sheet .poll-options-list .opt-row input { flex: 1; }
        .poll-sheet .poll-options-list .opt-row button { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.2rem; padding: 4px; }
        .poll-sheet .add-opt-btn { background: none; border: 1.5px dashed var(--brd); border-radius: 12px; padding: 8px; width: 100%; color: var(--muted); font-weight: 600; cursor: pointer; transition: background .15s; }
        .poll-sheet .add-opt-btn:hover { background: var(--pdim); }
        .poll-sheet .poll-footer { display: flex; gap: 8px; margin-top: 12px; }
        .poll-sheet .poll-footer button { flex: 1; padding: 12px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: opacity .15s; }
        .poll-sheet .poll-footer .cancel-poll { background: var(--inp); color: var(--text); }
        .poll-sheet .poll-footer .create-poll { background: var(--p); color: #fff; }
        .poll-sheet .poll-footer .create-poll:hover { opacity: .85; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            .conversations-sidebar { width: 100%; border-right: none; position: absolute; top: 0; left: 0; bottom: 0; z-index: 10; background: var(--bg2); transform: translateX(0); }
            .conversations-sidebar.hidden { transform: translateX(-100%); }
            .chat-view .chat-view-header .back-btn { display: flex; }
            .chat-view { width: 100%; }
            .chat-view .chat-view-header { padding-left: 8px; }
            :root { --max-msg-width: 90%; }
        }
        @media (min-width: 769px) {
            .conversations-sidebar { display: flex; }
            .chat-view .chat-view-header .back-btn { display: none; }
        }

        /* ─── TOAST ─── */
        #tw { position: fixed; top: clamp(14px, 4vw, 22px); left: 50%; transform: translateX(-50%); z-index: 99999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: calc(100vw - 32px); }
        .toast { background: var(--bg3); border: 1px solid var(--brd2); border-radius: 100px; padding: 11px 18px; font-size: 13px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.55); animation: tIn .3s cubic-bezier(.34,1.2,.64,1) both; white-space: nowrap; }
        .toast.out { animation: tOut .25s ease forwards; }
        @keyframes tIn { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes tOut { to { transform: translateY(-10px); opacity: 0; } }
        .td { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .tg { background: var(--ok); }
        .tp { background: var(--p); }
        .tr { background: var(--danger); }
        .to { background: var(--warn); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="tw"></div>

    <div class="layout">
        <side-nav show-chat></side-nav>

        <div class="main">
            <!-- ===== HEADER ===== -->
            <header class="chat-header">
                <div class="brand">Free<span>Upper</span></div>
                <div class="header-actions">
                    <button onclick="window.location.href='settings.html'" title="Settings">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </button>
                </div>
            </header>

            <!-- ===== CHAT CONTAINER ===== -->
            <div class="chat-container">
                <!-- Conversations Sidebar -->
                <div class="conversations-sidebar" id="conversationsSidebar">
                    <div class="sidebar-header">
                        <h2>Messages</h2>
                        <!-- "+ New" button with inline onclick -->
                        <button class="new-chat-btn" onclick="openNewChatModal()">+ New</button>
                    </div>
                    <div class="search-box">
                        <input type="text" id="convSearch" placeholder="Search conversations or friends..." oninput="filterConversations(this.value)">
                    </div>
                    <div class="conversation-list" id="conversationList"></div>
                </div>

                <!-- Chat View -->
                <div class="chat-view" id="chatView">
                    <div class="chat-view-header">
                        <button class="back-btn" onclick="closeChatView()">
                            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                        </button>
                        <img class="chat-partner-avatar" id="chatPartnerAvatar" src="" alt="" onclick="openPartnerProfile()">
                        <div class="chat-partner-info" onclick="openPartnerProfile()">
                            <div class="chat-partner-name" id="chatPartnerName">Select a conversation</div>
                            <div class="chat-partner-status" id="chatPartnerStatus">Online</div>
                        </div>
                        <div class="chat-actions">
                            <button onclick="openPartnerProfile()" title="Profile">
                                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="messages-area" id="messagesArea">
                        <div class="no-messages">
                            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            <h3>No conversation selected</h3>
                            <p>Choose a conversation from the list or start a new one.</p>
                        </div>
                    </div>

                    <div class="message-input-area">
                        <div class="input-wrapper" style="position:relative;">
                            <button class="attach-btn" onclick="toggleAttachMenu()" title="Attach">
                                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            </button>
                            <textarea id="messageInput" rows="1" placeholder="Type a message..." disabled></textarea>
                            <div class="attach-menu" id="attachMenu">
                                <div class="attach-option" onclick="handleAttach('image')"><span class="icon">🖼️</span><span class="label">Photo</span></div>
                                <div class="attach-option" onclick="handleAttach('video')"><span class="icon">🎬</span><span class="label">Video</span></div>
                                <div class="attach-option" onclick="handleAttach('voice')"><span class="icon">🎤</span><span class="label">Voice note</span></div>
                                <div class="attach-option" onclick="handleAttach('document')"><span class="icon">📄</span><span class="label">Document</span></div>
                                <div class="attach-option" onclick="handleAttach('poll')"><span class="icon">📊</span><span class="label">Poll</span></div>
                            </div>
                            <input type="file" id="fileInput" accept="image/*,video/*,audio/*,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none" multiple />
                        </div>
                        <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">
                            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                    <div class="upload-progress" id="uploadProgress">
                        <span id="uploadLabel">Uploading...</span>
                        <div class="progress-bar"><div class="fill" id="uploadProgressFill"></div></div>
                        <span id="uploadPercent">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <bottom-nav></bottom-nav>
    </div>

    <!-- ===== NEW CHAT MODAL ===== -->
    <div class="new-chat-modal" id="newChatModal">
        <div class="modal-sheet">
            <div class="modal-header">
                <h3>New Conversation</h3>
                <button onclick="closeNewChatModal()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-search">
                <input type="text" id="userSearchInput" placeholder="Search by name or username..." oninput="searchUsersInModal(this.value)">
            </div>
            <div class="modal-list" id="userSearchResults">
                <div class="modal-empty">Type to find users</div>
            </div>
        </div>
    </div>

    <!-- ===== POLL MODAL ===== -->
    <div class="poll-modal" id="pollModal">
        <div class="poll-sheet">
            <div class="poll-header">
                <h3>Create a Poll</h3>
                <button onclick="closePollModal()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="form-group">
                <label>Question</label>
                <input type="text" id="pollQuestion" placeholder="Ask a question..." maxlength="120">
            </div>
            <div class="form-group">
                <label>Options (2–6)</label>
                <div class="poll-options-list" id="pollOptionsList">
                    <div class="opt-row"><input type="text" class="poll-opt-input" placeholder="Option 1" maxlength="60"></div>
                    <div class="opt-row"><input type="text" class="poll-opt-input" placeholder="Option 2" maxlength="60"></div>
                </div>
                <button class="add-opt-btn" onclick="addPollOption()">+ Add option</button>
            </div>
            <div class="poll-footer">
                <button class="cancel-poll" onclick="closePollModal()">Cancel</button>
                <button class="create-poll" onclick="sendPoll()">Create Poll</button>
            </div>
        </div>
    </div>

    <!-- ===== CONTEXT MENU ===== -->
    <div class="msg-context-menu" id="msgContextMenu">
        <button class="menu-item" onclick="replyToMessage()">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Reply
        </button>
        <button class="menu-item" onclick="copyMessage()">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy
        </button>
        <button class="menu-item danger" onclick="deleteMessage()">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete
        </button>
    </div>

    <!-- ===== REACTION PICKER ===== -->
    <div class="reaction-picker" id="reactionPicker"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIG
            // ============================================================
            const CLOUDINARY_CLOUD_NAME = 'duzyf1kda';
            const CLOUDINARY_UPLOAD_PRESET = 'chat_uploads';
            const MAX_FILE_SIZE = 25 * 1024 * 1024;

            // ============================================================
            // GLOBAL STATE
            // ============================================================
            let currentUserId = null;
            let conversations = [];
            let selectedConversationId = null;
            let selectedPartnerId = null;
            let messages = [];
            let allUsers = [];
            let mutualFollowers = new Set(); // user IDs of mutual followers
            let messageSubscription = null;
            let conversationSubscription = null;
            let typingTimeout = null;
            let replyTargetMessage = null;
            let contextMenuMsgId = null;

            const sb = window.sb;
            if (!sb) { console.error('Supabase client not ready'); return; }

            // ============================================================
            // DOM REFS
            // ============================================================
            const convList = document.getElementById('conversationList');
            const messagesArea = document.getElementById('messagesArea');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const chatPartnerName = document.getElementById('chatPartnerName');
            const chatPartnerAvatar = document.getElementById('chatPartnerAvatar');
            const chatPartnerStatus = document.getElementById('chatPartnerStatus');
            const convSearch = document.getElementById('convSearch');
            const fileInput = document.getElementById('fileInput');
            const uploadProgress = document.getElementById('uploadProgress');
            const uploadProgressFill = document.getElementById('uploadProgressFill');
            const uploadPercent = document.getElementById('uploadPercent');
            const uploadLabel = document.getElementById('uploadLabel');

            // ============================================================
            // HELPERS
            // ============================================================
            function showToast(msg, type) {
                const w = document.getElementById('tw');
                if (!w) return;
                const el = document.createElement('div');
                el.className = 'toast';
                const colorMap = { p: 'tp', g: 'tg', r: 'tr', o: 'to' };
                el.innerHTML = '<div class="td ' + (colorMap[type] || 'tp') + '"></div>' + msg;
                w.appendChild(el);
                setTimeout(function() {
                    el.classList.add('out');
                    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
                }, 2600);
            }

            function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

            function formatTime(iso) {
                const d = new Date(iso);
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function formatDate(iso) {
                const d = new Date(iso);
                const now = new Date();
                const diff = (now - d) / 1000;
                if (diff < 60) return 'Just now';
                if (diff < 3600) return Math.floor(diff / 60) + 'm';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h';
                if (diff < 604800) return Math.floor(diff / 86400) + 'd';
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            function getCurrentUser() {
                if (window.AuthUser && window.AuthUser.getCurrentUser) return window.AuthUser.getCurrentUser();
                if (typeof window.getCurrentUser === 'function') return window.getCurrentUser();
                return null;
            }

            function getAvatar(profile) {
                return profile?.avatar_url || profile?.avatar || 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23E5E7EB\'/%3E%3Ccircle cx=\'50\' cy=\'38\' r=\'16\' fill=\'%239CA3AF\'/%3E%3Cellipse cx=\'50\' cy=\'75\' rx=\'30\' ry=\'22\' fill=\'%239CA3AF\'/%3E%3C/svg%3E';
            }

            function getDisplayName(profile) {
                return profile?.display_name || profile?.username || 'User';
            }

            function getVerifiedBadge(status) {
                if (!status || status === 'none' || status === 'pending') return '';
                const label = status === 'official' ? 'Official' : status === 'staff' ? 'Staff' : status === 'business' ? 'Business' : 'Verified';
                return `<span class="verified-badge-sm" style="display:inline-flex;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--pd));margin-left:2px;flex-shrink:0;" title="${label}"><svg viewBox="0 0 24 24" style="width:9px;height:9px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;"><polyline points="20 6 9 17 4 12"/></svg></span>`;
            }

            function scrollToBottom() {
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }

            // ============================================================
            // LOAD MUTUAL FOLLOWERS (Friends)
            // ============================================================
            async function loadMutualFollowers() {
                if (!currentUserId) return;
                try {
                    // Get users I follow
                    const { data: following, error: fErr } = await sb
                        .from('follows')
                        .select('following_id')
                        .eq('follower_id', currentUserId);
                    if (fErr) throw fErr;
                    const followingIds = following.map(f => f.following_id);

                    // Get users who follow me
                    const { data: followers, error: flErr } = await sb
                        .from('follows')
                        .select('follower_id')
                        .eq('following_id', currentUserId);
                    if (flErr) throw flErr;
                    const followerIds = followers.map(f => f.follower_id);

                    // Mutual = intersection
                    const mutual = followingIds.filter(id => followerIds.includes(id));
                    mutualFollowers = new Set(mutual);
                } catch (err) {
                    console.error('loadMutualFollowers error:', err);
                }
            }

            // ============================================================
            // SUPABASE - CONVERSATIONS
            // ============================================================
            async function loadConversations() {
                if (!currentUserId) return;
                try {
                    const { data, error } = await sb
                        .from('conversations')
                        .select(`
                            *,
                            messages:messages( id, text, sender_id, created_at, message_type, media_url, reply_to )
                        `)
                        .or(`user1_id.eq.${currentUserId},user2_id.eq.${currentUserId}`)
                        .order('updated_at', { ascending: false });

                    if (error) throw error;
                    conversations = data.map(conv => {
                        const otherId = conv.user1_id === currentUserId ? conv.user2_id : conv.user1_id;
                        const msgs = conv.messages || [];
                        const lastMsg = msgs.length ? msgs.reduce((a, b) => new Date(a.created_at) > new Date(b
                            .created_at) ? a : b) : null;
                        return { ...conv, otherUserId: otherId, lastMessage: lastMsg, lastMessageTime: lastMsg ?
                                lastMsg.created_at : conv.updated_at };
                    });

                    const userIds = conversations.map(c => c.otherUserId).filter(Boolean);
                    if (userIds.length) {
                        const { data: profiles, error: pErr } = await sb
                            .from('profiles')
                            .select('id, display_name, username, avatar_url, verified_status, online_status')
                            .in('id', userIds);
                        if (!pErr && profiles) {
                            const profileMap = {};
                            profiles.forEach(p => profileMap[p.id] = p);
                            conversations.forEach(c => {
                                c.otherUser = profileMap[c.otherUserId] || null;
                            });
                        }
                    }
                    renderConversations();
                } catch (err) {
                    console.error('loadConversations error:', err);
                    showToast('Failed to load conversations', 'r');
                }
            }

            // ============================================================
            // RENDER CONVERSATIONS (with search for friends)
            // ============================================================
            function renderConversations(filter = '') {
                const q = filter.toLowerCase().trim();
                let html = '';

                // 1. Filter existing conversations
                let matchedConvs = conversations;
                if (q) {
                    matchedConvs = matchedConvs.filter(c => {
                        const name = c.otherUser ? (c.otherUser.display_name || c.otherUser.username || '') :
                        '';
                        return name.toLowerCase().includes(q);
                    });
                }

                // 2. Find mutual followers matching the query (only if query not empty)
                let matchedFriends = [];
                if (q && mutualFollowers.size > 0) {
                    const allFriendIds = Array.from(mutualFollowers);
                    // Fetch profiles for these friends (we can cache them to avoid repeated queries)
                    // We'll fetch them on demand and cache in allUsers
                    const friendProfiles = allUsers.filter(u => mutualFollowers.has(u.id));
                    // Also, ensure we have profiles for all mutual followers
                    // For simplicity, we'll rely on allUsers being populated (from loadAllUsers)
                    // If not, we'll query them now.
                    if (friendProfiles.length === 0 && mutualFollowers.size > 0) {
                        // Fetch them now
                        sb.from('profiles')
                            .select('id, display_name, username, avatar_url, verified_status')
                            .in('id', Array.from(mutualFollowers))
                            .then(({ data, error }) => {
                                if (!error && data) {
                                    allUsers = allUsers.concat(data);
                                    // Re-render
                                    renderConversations(filter);
                                }
                            })
                            .catch(() => {});
                        return;
                    }
                    matchedFriends = friendProfiles.filter(u => {
                        const name = (u.display_name || u.username || '').toLowerCase();
                        return name.includes(q) && !conversations.some(c => c.otherUserId === u.id);
                    });
                }

                // Build HTML
                if (matchedConvs.length === 0 && matchedFriends.length === 0) {
                    convList.innerHTML = `
                        <div style="padding: 30px 16px; text-align: center; color: var(--muted);">
                            <p>${q ? 'No results found.' : 'No conversations yet. Start a new one!'}</p>
                        </div>
                    `;
                    return;
                }

                // Conversations section
                if (matchedConvs.length > 0) {
                    if (q) {
                        html += `<div class="search-section-header">Conversations</div>`;
                    }
                    html += matchedConvs.map(c => {
                        const other = c.otherUser || {};
                        const name = other.display_name || other.username || 'User';
                        const avatar = getAvatar(other);
                        let lastMsg = 'No messages yet';
                        if (c.lastMessage) {
                            const prefix = c.lastMessage.sender_id === currentUserId ? 'You: ' : '';
                            lastMsg = prefix + (c.lastMessage.text || 'Media');
                        }
                        const time = c.lastMessageTime ? formatDate(c.lastMessageTime) : '';
                        const active = c.id === selectedConversationId ? 'active' : '';
                        const badge = getVerifiedBadge(other.verified_status);
                        const online = other.online_status === 'online' ? '<div class="online-dot"></div>' : '';
                        return `
                            <div class="conv-item ${active}" data-conv-id="${c.id}" onclick="selectConversation('${c.id}')">

                                <div class="conv-info">

            // ============================================================
            // SELECT CONVERSATION
            // ============================================================
            window.selectConversation = async function(convId) {
                selectedConversationId = convId;
                const conv = conversations.find(c => c.id === convId);
                if (!conv) return;
                selectedPartnerId = conv.otherUserId;

                const other = conv.otherUser || {};
                chatPartnerName.textContent = getDisplayName(other);
                chatPartnerAvatar.src = getAvatar(other);
                chatPartnerStatus.textContent = other.online_status === 'online' ? 'Online' : 'Last seen recently';

                messageInput.disabled = false;
                sendBtn.disabled = false;

                await loadMessages(convId);

                    document.getElementById('conversationsSidebar').classList.add('hidden');
