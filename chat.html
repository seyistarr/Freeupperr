<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatSaaS – 1v1 Messaging</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>
    <script src="https://unpkg.com/lucide@latest">
    </script>
    <style>
        /* ── Keep your original CSS, then extend ── */
        :root {
            --brand-primary: #5B21B6;
            --brand-light: #F3E8FF;
            --brand-surface: #FAF5FF;
            --bg-main: #f8fafc;
            --bg-chat: #f1f5f9;
            --bg-sidebar: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        .dark {
            --bg-main: #0f172a;
            --bg-chat: #1e293b;
            --bg-sidebar: #1e293b;
            --border-color: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            transition: background 0.25s, color 0.25s;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        /* ── Auth screen ── */
        .auth-bg {
            background: radial-gradient(ellipse at 20% 50%, var(--brand-light) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 50%, #dbeafe 0%, transparent 70%),
                var(--bg-main);
        }
        .dark .auth-bg {
            background: radial-gradient(ellipse at 20% 50%, rgba(91, 33, 182, 0.15) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 70%),
                var(--bg-main);
        }

        /* ── Chat bubbles ── */
        .message-bubble {
            animation: messageIn 0.2s ease;
        }
        @keyframes messageIn {
            0% {
                opacity: 0;
                transform: translateY(8px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Voice wave bars ── */
        .wave-bar {
            display: inline-block;
            width: 3px;
            height: 12px;
            background: var(--brand-primary);
            border-radius: 2px;
            animation: waveAnim 0.6s ease-in-out infinite alternate;
        }
        .wave-bar:nth-child(2) {
            height: 18px;
            animation-delay: 0.1s;
        }
        .wave-bar:nth-child(3) {
            height: 24px;
            animation-delay: 0.2s;
        }
        .wave-bar:nth-child(4) {
            height: 18px;
            animation-delay: 0.3s;
        }
        .wave-bar:nth-child(5) {
            height: 12px;
            animation-delay: 0.4s;
        }
        @keyframes waveAnim {
            0% {
                transform: scaleY(0.4);
            }
            100% {
                transform: scaleY(1);
            }
        }

        /* ── Mobile sidebar overlay ── */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 40;
            backdrop-filter: blur(4px);
            display: none;
        }

        /* ── Responsive sidebar ── */
        @media (max-width: 768px) {
            .sidebar-desktop {
                display: none;
            }
            .sidebar-mobile-btn {
                display: flex;
            }
        }
        @media (min-width: 769px) {
            .sidebar-desktop {
                display: flex;
            }
            .sidebar-mobile-btn {
                display: none;
            }
        }

        /* ── Toast ── */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
        }
        .toast {
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div id="app" class="h-screen w-full flex items-center justify-center p-0 sm:p-4">

        <!-- ─── AUTH SCREEN ─── -->
        <div id="auth-screen" class="auth-bg w-full h-full sm:max-w-md sm:h-auto sm:rounded-2xl sm:shadow-xl border border-slate-200/50 dark:border-slate-700/50 p-6 sm:p-8 flex flex-col justify-center transition-all duration-300">
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-2xl bg-purple-700 text-white flex items-center justify-center text-2xl font-bold mx-auto shadow-lg shadow-purple-500/25">
                    C
                </div>
                <h1 class="text-2xl font-bold mt-4 text-slate-800 dark:text-white">ChatSaaS</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Secure 1v1 messaging</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="text-sm font-medium text-slate-700 dark:text-slate-300 block mb-1.5">Email</label>
                    <input type="email" id="auth-email" value="demo@chatsaas.com" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/40 focus:border-purple-500 transition-all dark:text-white" />
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-700 dark:text-slate-300 block mb-1.5">Password</label>
                    <input type="password" id="auth-password" value="password123" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/40 focus:border-purple-500 transition-all dark:text-white" />
                </div>

                <button type="submit" id="auth-btn" class="w-full bg-purple-700 hover:bg-purple-800 text-white rounded-xl py-3.5 font-semibold text-sm shadow-lg shadow-purple-500/20 transition-all">
                    Sign In
                </button>

                <p class="text-center text-sm text-slate-500 dark:text-slate-400">
                    <span id="auth-toggle-text">Don't have an account?</span>
                    <button type="button" id="auth-toggle-btn" class="text-purple-600 dark:text-purple-400 font-medium hover:underline cursor-pointer">Sign Up</button>
                </p>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400 dark:text-slate-500">
                <span>⚡ Instant • Encrypted • Free</span>
            </div>
        </div>

        <!-- ─── MAIN CHAT APP ─── -->
        <div id="chat-app" class="hidden w-full h-full sm:max-w-6xl sm:h-[92vh] bg-white dark:bg-slate-800 sm:rounded-2xl shadow-xl border border-slate-200/60 dark:border-slate-700/60 flex overflow-hidden transition-all duration-300">

            <!-- Sidebar (Desktop & Mobile) -->
            <aside id="sidebar" class="sidebar-desktop w-[280px] lg:w-[320px] bg-slate-50 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700 flex flex-col shrink-0 h-full">

                <!-- Sidebar Header -->
                <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between shrink-0">
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-xl bg-purple-700 text-white flex items-center justify-center text-sm font-bold">C</div>
                        <span class="font-semibold text-slate-800 dark:text-white text-base">ChatSaaS</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button id="theme-toggle" class="p-2 rounded-lg text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" title="Toggle theme">
                            <i data-lucide="moon" id="theme-icon" class="w-4 h-4"></i>
                        </button>
                        <button id="logout-btn" class="p-2 rounded-lg text-slate-400 hover:text-rose-500 transition-colors" title="Sign out">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Search -->
                <div class="p-3 shrink-0">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="contact-search" placeholder="Search contacts..." class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/40 focus:border-purple-500 transition-all dark:text-white" />
                    </div>
                </div>

                <!-- Contact List -->
                <div class="flex-1 overflow-y-auto px-2 py-2 space-y-1" id="contact-list">
                    <!-- Rendered by JS -->
                </div>

                <!-- Sidebar Footer (user info) -->
                <div class="p-3 border-t border-slate-200 dark:border-slate-700 shrink-0 flex items-center gap-3">
                    <img id="sidebar-avatar" src="" alt="User" class="w-9 h-9 rounded-full object-cover border border-slate-200 dark:border-slate-600" />
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-slate-800 dark:text-white truncate" id="sidebar-username">User</p>
                        <p class="text-xs text-slate-400 dark:text-slate-500">Online</p>
                    </div>
                </div>
            </aside>

            <!-- Mobile Sidebar Overlay -->
            <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeMobileSidebar()"></div>

            <!-- Mobile Sidebar (slide-out) -->
            <aside id="mobile-sidebar" class="fixed top-0 left-0 h-full w-[280px] max-w-[80vw] bg-slate-50 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700 transform -translate-x-full transition-transform duration-300 z-50 flex flex-col">
                <!-- Same content as desktop sidebar, but we'll clone it via JS for simplicity -->
                <div id="mobile-sidebar-content" class="flex flex-col h-full">
                    <!-- Will be filled by JS -->
                </div>
            </aside>

            <!-- ─── CHAT AREA ─── -->
            <div class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-800 relative">

                <!-- Chat Header -->
                <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 sm:px-6 py-3 flex items-center justify-between shadow-sm shrink-0">

                    <div class="flex items-center gap-3">
                        <button id="mobile-menu-btn" class="sidebar-mobile-btn p-1.5 -ml-1 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
                            <i data-lucide="menu" class="w-5 h-5"></i>
                        </button>
                        <div class="flex items-center gap-3">
                            <div class="relative">
                                <img id="chat-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=80&h=80&q=80" alt="Contact" class="w-10 h-10 rounded-full object-cover border border-slate-200 dark:border-slate-600" />
                                <span id="chat-status-dot" class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white dark:border-slate-800 rounded-full"></span>
                            </div>
                            <div>
                                <h2 id="chat-contact-name" class="text-slate-800 dark:text-white font-semibold text-base leading-tight">Alice</h2>
                                <span id="chat-status-text" class="text-xs text-emerald-600 dark:text-emerald-400 font-medium">online</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-1 sm:gap-2">
                        <button id="theme-toggle-header" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                            <i data-lucide="moon" id="theme-icon-header" class="w-4 h-4"></i>
                        </button>
                        <button id="more-chat-btn" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                            <i data-lucide="more-vertical" class="w-5 h-5"></i>
                        </button>
                    </div>
                </header>

                <!-- Messages -->
                <main id="chat-thread" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3 flex flex-col">
                    <!-- Rendered by JS -->
                    <div class="flex-1 flex items-center justify-center text-slate-400 dark:text-slate-500 text-sm flex-col gap-2">
                        <i data-lucide="message-circle" class="w-10 h-10 opacity-30"></i>
                        <span>Select a contact to start chatting</span>
                    </div>
                </main>

                <!-- Typing Indicator -->
                <div id="typing-indicator" class="px-4 sm:px-6 py-1.5 hidden">
                    <div class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400">
                        <span id="typing-name" class="font-medium">Alice</span>
                        <span>is typing</span>
                        <span class="flex gap-1">
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </span>
                    </div>
                </div>

                <!-- Input (your original code with minor adjustments) -->
                <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 p-3 sm:p-4 shrink-0">
                    <form id="chat-form" class="flex items-center gap-2 sm:gap-3">

                        <div id="standard-inputs" class="flex items-center gap-1 sm:gap-2 flex-1">
                            <button type="button" class="p-2 sm:p-2.5 text-slate-400 hover:text-purple-600 hover:bg-purple-50 dark:hover:bg-purple-900/20 rounded-xl transition-all">
                                <i data-lucide="paperclip" class="w-5 h-5"></i>
                            </button>

                            <div class="relative flex-1">
                                <input type="text" id="message-input" autocomplete="off" placeholder="Type a message..." class="w-full bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-xl pl-4 pr-10 py-2.5 sm:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/40 focus:border-purple-500 transition-all" />
                                <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-purple-600 transition-colors">
                                    <i data-lucide="smile" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Voice Recording Overlay (exactly as you had) -->
                        <div id="voice-overlay" class="hidden flex-1 items-center justify-between bg-purple-50 dark:bg-purple-900/20 border border-purple-200 dark:border-purple-700/40 rounded-xl px-3 sm:px-4 py-2 animate-pulse">
                            <div class="flex items-center gap-2 sm:gap-3">
                                <div class="flex items-center gap-0.5">
                                    <span class="wave-bar"></span>
                                    <span class="wave-bar"></span>
                                    <span class="wave-bar"></span>
                                    <span class="wave-bar"></span>
                                    <span class="wave-bar"></span>
                                </div>
                                <span class="text-sm font-semibold text-purple-700 dark:text-purple-300" id="rec-timer">00:00</span>
                                <span class="text-xs text-purple-600 dark:text-purple-400 font-medium hidden sm:inline" id="rec-status">Recording...</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <button type="button" id="pause-resume-btn" class="p-1.5 sm:p-2 text-purple-700 dark:text-purple-300 hover:bg-purple-200/60 dark:hover:bg-purple-900/30 rounded-lg transition-colors">
                                    <i data-lucide="pause" id="pause-icon" class="w-4 h-4"></i>
                                </button>
                                <button type="button" id="cancel-rec-btn" class="p-1.5 sm:p-2 text-rose-600 dark:text-rose-400 hover:bg-rose-100 dark:hover:bg-rose-900/20 rounded-lg transition-colors">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" id="action-btn" class="p-3 sm:p-3.5 bg-purple-700 hover:bg-purple-800 active:scale-95 text-white rounded-xl shadow-md shadow-purple-500/25 transition-all flex items-center justify-center shrink-0">
                            <i data-lucide="mic" id="action-icon" class="w-5 h-5"></i>
                        </button>
                    </form>
                </footer>
            </div>
        </div>
    </div>

    <!-- ─── TOAST CONTAINER ─── -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  YOUR ORIGINAL CODE (core functions) + extensions
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // ── DOM refs ──
        const authScreen = document.getElementById('auth-screen');
        const chatApp = document.getElementById('chat-app');
        const authForm = document.getElementById('auth-form');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authBtn = document.getElementById('auth-btn');
        const authToggleBtn = document.getElementById('auth-toggle-btn');
        const authToggleText = document.getElementById('auth-toggle-text');

        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatThread = document.getElementById('chat-thread');
        const actionBtn = document.getElementById('action-btn');
        const actionIcon = document.getElementById('action-icon');
        const standardInputs = document.getElementById('standard-inputs');
        const voiceOverlay = document.getElementById('voice-overlay');
        const recTimer = document.getElementById('rec-timer');
        const recStatus = document.getElementById('rec-status');
        const pauseResumeBtn = document.getElementById('pause-resume-btn');
        const pauseIcon = document.getElementById('pause-icon');
        const cancelRecBtn = document.getElementById('cancel-rec-btn');

        const contactList = document.getElementById('contact-list');
        const contactSearch = document.getElementById('contact-search');
        const chatContactName = document.getElementById('chat-contact-name');
        const chatAvatar = document.getElementById('chat-avatar');
        const chatStatusText = document.getElementById('chat-status-text');
        const chatStatusDot = document.getElementById('chat-status-dot');
        const typingIndicator = document.getElementById('typing-indicator');
        const typingName = document.getElementById('typing-name');

        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileSidebar = document.getElementById('mobile-sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const logoutBtn = document.getElementById('logout-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const themeToggleHeader = document.getElementById('theme-toggle-header');
        const themeIcon = document.getElementById('theme-icon');
        const themeIconHeader = document.getElementById('theme-icon-header');
        const moreChatBtn = document.getElementById('more-chat-btn');

        const toastContainer = document.getElementById('toast-container');

        // ── State ──
        let isLogin = true;
        let currentUser = null;
        let contacts = [];
        let messages = {}; // contactId -> array of message objects
        let activeContactId = null;

        // Voice recording state (from your original)
        let isRecording = false;
        let isPaused = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let timerInterval = null;
        let totalSeconds = 0;
        let recordingStream = null;

        // ── Helpers ──
        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

        function timeStr() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' } [
                tag] || tag));
        }

        function autoScroll() {
            chatThread.scrollTop = chatThread.scrollHeight;
        }

        function getContact(id) {
            return contacts.find(c => c.id === id);
        }

        function getMessages(id) {
            if (!messages[id]) messages[id] = [];
            return messages[id];
        }

        function formatDateLabel(ts) {
            const d = new Date(ts);
            const now = new Date();
            if (d.toDateString() === now.toDateString()) return 'Today';
            const y = new Date(now);
            y.setDate(y.getDate() - 1);
            if (d.toDateString() === y.toDateString()) return 'Yesterday';
            return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function persistData() {
            localStorage.setItem('chatsaas-messages', JSON.stringify(messages));
            localStorage.setItem('chatsaas-contacts', JSON.stringify(contacts));
        }

        function loadData() {
            const savedMsgs = localStorage.getItem('chatsaas-messages');
            if (savedMsgs) messages = JSON.parse(savedMsgs);
            const savedContacts = localStorage.getItem('chatsaas-contacts');
            if (savedContacts) contacts = JSON.parse(savedContacts);
        }

        // ── Toast ──
        function showToast(message, type = 'info', duration = 3000) {
            const icons = { success: 'check-circle', error: 'alert-circle', info: 'info' };
            const el = document.createElement('div');
            el.className = `toast`;
            el.innerHTML = `
                <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 ${type === 'success' ? 'text-emerald-500' : type === 'error' ? 'text-rose-500' : 'text-purple-500'}"></i>
                <span>${escapeHTML(message)}</span>
            `;
            toastContainer.appendChild(el);
            lucide.createIcons();
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(20px)';
                setTimeout(() => el.remove(), 300);
            }, duration);
        }

        // ── Theme ──
        function setTheme(dark) {
            document.documentElement.classList.toggle('dark', dark);
            const icon = dark ? 'sun' : 'moon';
            [themeIcon, themeIconHeader].forEach(el => { if (el) el.setAttribute('data-lucide', icon); });
            lucide.createIcons();
            localStorage.setItem('chatsaas-theme', dark ? 'dark' : 'light');
        }

        function toggleTheme() {
            setTheme(!document.documentElement.classList.contains('dark'));
        }

        // ── Auth ──
        function toggleAuthMode() {
            isLogin = !isLogin;
            authBtn.textContent = isLogin ? 'Sign In' : 'Create Account';
            authToggleText.textContent = isLogin ? "Don't have an account?" : 'Already have an account?';
            authToggleBtn.textContent = isLogin ? 'Sign Up' : 'Sign In';
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = authEmail.value.trim();
            const pass = authPassword.value.trim();
            if (!email || !pass) {
                showToast('Please fill in all fields.', 'error');
                return;
            }

            let users = JSON.parse(localStorage.getItem('chatsaas-users') || '[]');
            if (isLogin) {
                const found = users.find(u => u.email === email && u.password === pass);
                if (!found) {
                    showToast('Invalid credentials. Try "demo@chatsaas.com" / "password123"', 'error');
                    return;
                }
                currentUser = found;
                localStorage.setItem('chatsaas-user', JSON.stringify(found));
                showToast(`Welcome back, ${found.name}!`, 'success');
                initApp();
            } else {
                if (users.find(u => u.email === email)) {
                    showToast('Email already registered.', 'error');
                    return;
                }
                const newUser = {
                    id: uid(),
                    name: email.split('@')[0] || 'User',
                    email,
                    password: pass,
                    avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(email.split('@')[0])}&background=5B21B6&color=fff&size=80`
                };
                users.push(newUser);
                localStorage.setItem('chatsaas-users', JSON.stringify(users));
                currentUser = newUser;
                localStorage.setItem('chatsaas-user', JSON.stringify(newUser));
                showToast('Account created! Welcome.', 'success');
                initApp();
            }
        }

        // ── Mock Contacts ──
        const MOCK_CONTACTS = [
            { id: 'c1', name: 'Alice', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&h=150&q=80',
                online: true },
            { id: 'c2', name: 'Bob', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&h=150&q=80',
                online: false },
            { id: 'c3', name: 'Carol', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&h=150&q=80',
                online: true },
            { id: 'c4', name: 'Dave', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150&h=150&q=80',
                online: false },
        ];

        const MOCK_MESSAGES = {
            c1: [
                { id: 'm1', text: 'Hey! How are you?', sent: false, timestamp: Date.now() - 7200000, voice: false },
                { id: 'm2', text: "I'm good, thanks! You?", sent: true, timestamp: Date.now() - 6000000, voice: false },
                { id: 'm3', text: 'I\'m good too 😊', sent: false, timestamp: Date.now() - 5000000, voice: false },
            ],
            c2: [
                { id: 'm4', text: 'Hey Bob, how\'s the project?', sent: true, timestamp: Date.now() - 86400000,
                    voice: false },
                { id: 'm5', text: 'Almost done!', sent: false, timestamp: Date.now() - 82800000, voice: false },
            ],
            c3: [
                { id: 'm6', text: 'Carol, are you coming?', sent: true, timestamp: Date.now() - 3600000, voice: false },
                { id: 'm7', text: 'Yes, in 5 min!', sent: false, timestamp: Date.now() - 1800000, voice: false },
            ],
        };

        function initMockData() {
            if (!localStorage.getItem('chatsaas-contacts')) {
                localStorage.setItem('chatsaas-contacts', JSON.stringify(MOCK_CONTACTS));
            }
            if (!localStorage.getItem('chatsaas-messages')) {
                localStorage.setItem('chatsaas-messages', JSON.stringify(MOCK_MESSAGES));
            }
            loadData();
        }

        // ── Render Contacts ──
        function renderContacts(filter = '') {
            const q = filter.toLowerCase().trim();
            let list = contacts;
            if (q) list = list.filter(c => c.name.toLowerCase().includes(q));

            if (list.length === 0) {
                contactList.innerHTML = `
                    <div class="text-center text-slate-400 dark:text-slate-500 text-sm py-8">
                        <i data-lucide="users" class="w-8 h-8 mx-auto mb-2 opacity-30"></i>
                        <p>${q ? 'No contacts found' : 'No contacts yet'}</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            contactList.innerHTML = list.map(c => {
                const isActive = activeContactId === c.id;
                const msgs = getMessages(c.id);
                const last = msgs.length > 0 ? msgs[msgs.length - 1] : null;
                const lastText = last ? (last.voice ? '🎤 Voice message' : last.text) : 'No messages';
                const lastTime = last ? timeStr(last.timestamp) : '';
                const unread = msgs.filter(m => !m.sent && !m.read).length;

                return `
                    <div data-contact-id="${c.id}" class="contact-item flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer transition-all ${isActive ? 'bg-purple-100 dark:bg-purple-900/30 shadow-sm' : 'hover:bg-slate-200/70 dark:hover:bg-slate-700/50'}" onclick="selectContact('${c.id}')">
                        <div class="relative shrink-0">
                            <img src="${c.avatar}" alt="${c.name}" class="w-10 h-10 rounded-full object-cover border ${isActive ? 'border-purple-500' : 'border-slate-200 dark:border-slate-600'}" />
                            <span class="absolute bottom-0 right-0 w-3 h-3 ${c.online ? 'bg-emerald-500' : 'bg-slate-400'} border-2 border-white dark:border-slate-800 rounded-full"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-2">
                                <span class="font-medium text-sm text-slate-800 dark:text-white truncate">${escapeHTML(c.name)}</span>
                                <span class="text-[10px] text-slate-400 dark:text-slate-500 shrink-0">${lastTime}</span>
                            </div>
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-xs text-slate-500 dark:text-slate-400 truncate">${escapeHTML(lastText)}</span>
                                ${unread > 0 ? `<span class="shrink-0 w-5 h-5 rounded-full bg-purple-600 text-white text-[10px] font-bold flex items-center justify-center">${unread}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // ── Render Messages ──
        function renderMessages(contactId) {
            const msgs = getMessages(contactId);
            if (msgs.length === 0) {
                chatThread.innerHTML = `
                    <div class="flex-1 flex items-center justify-center text-slate-400 dark:text-slate-500 text-sm flex-col gap-2">
                        <i data-lucide="message-circle" class="w-10 h-10 opacity-30"></i>
                        <span>No messages yet. Say hello!</span>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let html = '';
            let lastDate = null;
            msgs.forEach(m => {
                const dateLabel = formatDateLabel(m.timestamp);
                if (dateLabel !== lastDate) {
                    html += `
                        <div class="self-center bg-slate-200/60 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 text-xs px-3 py-1 rounded-full font-medium my-1">${dateLabel}</div>
                    `;
                    lastDate = dateLabel;
                }

                const isSent = m.sent;
                const align = isSent ? 'self-end items-end' : 'self-start items-start';
                const bubbleClass = isSent ?
                    'bg-purple-700 text-white rounded-2xl rounded-tr-none shadow-sm' :
                    'bg-white dark:bg-slate-700 text-slate-800 dark:text-white rounded-2xl rounded-tl-none shadow-sm border border-slate-200 dark:border-slate-600';

                if (m.voice && m.audioUrl) {
                    html += `
                        <div class="flex flex-col max-w-[85%] sm:max-w-[70%] ${align} message-bubble">
                            <div class="${bubbleClass} p-3 w-64 sm:w-72">
                                <audio src="${m.audioUrl}" controls class="w-full accent-purple-600 dark:accent-purple-400 h-8"></audio>
                            </div>
                            <div class="flex items-center gap-1 mt-1 ${isSent ? 'mr-1' : 'ml-1'}">
                                <span class="text-[10px] text-slate-400 dark:text-slate-500">${timeStr(m.timestamp)}</span>
                                ${isSent ? `<i data-lucide="${m.read ? 'check-check' : 'check'}" class="w-3.5 h-3.5 ${m.read ? 'text-purple-600 dark:text-purple-400' : 'text-slate-400'}"></i>` : ''}
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="flex flex-col max-w-[85%] sm:max-w-[70%] ${align} message-bubble">
                            <div class="${bubbleClass} px-4 py-3">
                                <p class="text-sm leading-relaxed break-words">${escapeHTML(m.text)}</p>
                            </div>
                            <div class="flex items-center gap-1 mt-1 ${isSent ? 'mr-1' : 'ml-1'}">
                                <span class="text-[10px] text-slate-400 dark:text-slate-500">${timeStr(m.timestamp)}</span>
                                ${isSent ? `<i data-lucide="${m.read ? 'check-check' : 'check'}" class="w-3.5 h-3.5 ${m.read ? 'text-purple-600 dark:text-purple-400' : 'text-slate-400'}"></i>` : ''}
                            </div>
                        </div>
                    `;
                }
            });

            chatThread.innerHTML = html;
            lucide.createIcons();
            autoScroll();
        }

        // ── Select Contact ──
        window.selectContact = function(id) {
            activeContactId = id;
            const contact = getContact(id);
            if (!contact) return;

            chatContactName.textContent = contact.name;
            chatAvatar.src = contact.avatar;
            chatStatusText.textContent = contact.online ? 'online' : 'offline';
            chatStatusText.className = `text-xs font-medium ${contact.online ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400 dark:text-slate-500'}`;
            chatStatusDot.className =
                `absolute bottom-0 right-0 w-3 h-3 ${contact.online ? 'bg-emerald-500' : 'bg-slate-400'} border-2 border-white dark:border-slate-800 rounded-full`;

            // Mark messages as read
            const msgs = getMessages(id);
            let changed = false;
            msgs.forEach(m => { if (!m.sent && !m.read) { m.read = true;
                    changed = true; } });
            if (changed) { persistData();
                renderContacts(contactSearch.value); }

            renderMessages(id);
            renderContacts(contactSearch.value);
            closeMobileSidebar();
            messageInput.focus();
        };

        // ── Send Text ──
        function sendTextMessage(text) {
            if (!activeContactId) { showToast('Select a contact first.', 'error'); return; }
            if (!text.trim()) return;
            const msgs = getMessages(activeContactId);
            const msg = {
                id: uid(),
                text: text.trim(),
                sent: true,
                timestamp: Date.now(),
                voice: false,
                read: false,
            };
            msgs.push(msg);
            persistData();
            renderMessages(activeContactId);
            renderContacts(contactSearch.value);
            messageInput.value = '';
            actionIcon.setAttribute('data-lucide', 'mic');
            lucide.createIcons();
            simulateReply(activeContactId);
        }

        // ── Send Voice ──
        function sendVoiceMessage(audioUrl) {
            if (!activeContactId) { showToast('Select a contact first.', 'error'); return; }
            const msgs = getMessages(activeContactId);
            const msg = {
                id: uid(),
                text: '🎤 Voice message',
                sent: true,
                timestamp: Date.now(),
                voice: true,
                audioUrl: audioUrl,
                read: false,
            };
            msgs.push(msg);
            persistData();
            renderMessages(activeContactId);
            renderContacts(contactSearch.value);
            simulateReply(activeContactId);
        }

        // ── Simulate Reply ──
        const REPLY_POOL = ['That\'s great! 😊', 'I agree!', 'Let me think...', 'Sure!', 'Haha, nice!', '👍', 'Will do!',
            'Thanks!', 'No problem!', 'See you!', 'Got it!', 'Perfect!', 'Awesome!'
        ];
        let replyTimeout = null;

        function simulateReply(contactId) {
            if (replyTimeout) clearTimeout(replyTimeout);
            const contact = getContact(contactId);
            if (!contact) return;
            typingName.textContent = contact.name;
            typingIndicator.classList.remove('hidden');
            autoScroll();

            replyTimeout = setTimeout(() => {
                typingIndicator.classList.add('hidden');
                const msgs = getMessages(contactId);
                const reply = REPLY_POOL[Math.floor(Math.random() * REPLY_POOL.length)];
                const msg = {
                    id: uid(),
                    text: reply,
                    sent: false,
                    timestamp: Date.now(),
                    voice: false,
                    read: false,
                };
                msgs.push(msg);
                persistData();
                renderMessages(contactId);
                renderContacts(contactSearch.value);
                replyTimeout = null;
            }, 1500 + Math.random() * 1500);
        }

        // ── Voice Recording (your original implementation) ──
        async function startRecording() {
            try {
                recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(recordingStream);

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    if (recordingStream) {
                        recordingStream.getTracks().forEach(t => t.stop());
                        recordingStream = null;
                    }
                    if (audioChunks.length > 0 && totalSeconds > 0) {
                        sendVoiceMessage(url);
                        showToast('Voice message sent!', 'success');
                    }
                    resetRecordingUI();
                };

                mediaRecorder.start(200);
                isRecording = true;
                isPaused = false;
                totalSeconds = 0;

                standardInputs.classList.add('hidden');
                voiceOverlay.classList.remove('hidden');
                actionIcon.setAttribute('data-lucide', 'square');
                lucide.createIcons();

                startTimer();
            } catch (err) {
                console.error(err);
                showToast('Could not access microphone.', 'error');
            }
        }

        function stopRecording(cancel = false) {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                if (cancel) audioChunks = [];
                mediaRecorder.stop();
            }
        }

        function togglePauseResume() {
            if (!mediaRecorder) return;
            if (!isPaused) {
                mediaRecorder.pause();
                isPaused = true;
                clearInterval(timerInterval);
                recStatus.textContent = 'Paused';
                pauseIcon.setAttribute('data-lucide', 'play');
                lucide.createIcons();
            } else {
                mediaRecorder.resume();
                isPaused = false;
                startTimer();
                recStatus.textContent = 'Recording...';
                pauseIcon.setAttribute('data-lucide', 'pause');
                lucide.createIcons();
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                totalSeconds++;
                const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
                const secs = String(totalSeconds % 60).padStart(2, '0');
                recTimer.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function resetRecordingUI() {
            clearInterval(timerInterval);
            isRecording = false;
            isPaused = false;
            totalSeconds = 0;
            recTimer.textContent = '00:00';
            recStatus.textContent = 'Recording...';
            pauseIcon.setAttribute('data-lucide', 'pause');
            voiceOverlay.classList.add('hidden');
            standardInputs.classList.remove('hidden');
            actionIcon.setAttribute('data-lucide', 'mic');
            lucide.createIcons();
            mediaRecorder = null;
        }

        // ── Mobile Sidebar ──
        function openMobileSidebar() {
            mobileSidebar.classList.remove('-translate-x-full');
            sidebarOverlay.style.display = 'block';
        }

        function closeMobileSidebar() {
            mobileSidebar.classList.add('-translate-x-full');
            sidebarOverlay.style.display = 'none';
        }

        // ── Init App ──
        function initApp() {
            authScreen.classList.add('hidden');
            chatApp.classList.remove('hidden');

            initMockData();
            loadData();

            // Set user info
            if (currentUser) {
                document.getElementById('sidebar-username').textContent = currentUser.name;
                document.getElementById('sidebar-avatar').src = currentUser.avatar ||
                    `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.name)}&background=5B21B6&color=fff&size=80`;
            }

            renderContacts();
            if (contacts.length > 0) selectContact(contacts[0].id);

            // Restore theme
            const savedTheme = localStorage.getItem('chatsaas-theme');
            if (savedTheme === 'dark') setTheme(true);
            else setTheme(false);

            // Clone sidebar content into mobile sidebar
            const mobileContent = document.getElementById('mobile-sidebar-content');
            mobileContent.innerHTML = document.querySelector('#sidebar').cloneNode(true).innerHTML;
            // Fix event listeners on cloned elements (we'll just use the same functions)
            mobileContent.querySelectorAll('[data-contact-id]').forEach(el => {
                const id = el.dataset.contactId;
                el.onclick = () => selectContact(id);
            });
            // Add theme toggle in mobile sidebar
            const mobileThemeBtn = mobileContent.querySelector('#theme-toggle');
            if (mobileThemeBtn) mobileThemeBtn.onclick = toggleTheme;
            const mobileLogoutBtn = mobileContent.querySelector('#logout-btn');
            if (mobileLogoutBtn) mobileLogoutBtn.onclick = logout;
        }

        // ── Logout ──
        function logout() {
            if (confirm('Sign out?')) {
                currentUser = null;
                localStorage.removeItem('chatsaas-user');
                activeContactId = null;
                chatApp.classList.add('hidden');
                authScreen.classList.remove('hidden');
                showToast('Signed out.', 'success');
                closeMobileSidebar();
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EVENT BINDINGS (keep your original logic)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // Auth
        authForm.addEventListener('submit', handleAuth);
        authToggleBtn.addEventListener('click', toggleAuthMode);

        // Chat form (your original submit handler)
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text.length > 0) {
                sendTextMessage(text);
                return;
            }
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording(false);
            }
        });

        // Input toggle mic/send
        messageInput.addEventListener('input', () => {
            if (!isRecording) {
                const val = messageInput.value.trim();
                actionIcon.setAttribute('data-lucide', val.length > 0 ? 'send' : 'mic');
                lucide.createIcons();
            }
        });

        // Voice controls
        pauseResumeBtn.addEventListener('click', togglePauseResume);
        cancelRecBtn.addEventListener('click', () => stopRecording(true));

        // Search
        contactSearch.addEventListener('input', (e) => renderContacts(e.target.value));

        // Theme toggles
        themeToggle.addEventListener('click', toggleTheme);
        themeToggleHeader.addEventListener('click', toggleTheme);

        // Mobile menu
        mobileMenuBtn.addEventListener('click', openMobileSidebar);
        sidebarOverlay.addEventListener('click', closeMobileSidebar);

        // Logout
        logoutBtn.addEventListener('click', logout);

        // More button (just a toast for now)
        moreChatBtn.addEventListener('click', () => {
            showToast('⚙️ Settings coming soon', 'info');
        });

        // ── Boot ──
        const savedUser = JSON.parse(localStorage.getItem('chatsaas-user') || 'null');
        if (savedUser) {
            currentUser = savedUser;
            initApp();
        } else {
            authScreen.classList.remove('hidden');
            chatApp.classList.add('hidden');
        }

        // Lucide
        lucide.createIcons();

        console.log('✅ ChatSaaS (based on your original code) loaded.');
    </script>
