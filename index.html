      function exploreSkeletonGrid() {
        let h = '';
        for (let i = 0; i < 8; i++) {
          h += '<div class="explore-skeleton-card"><div class="explore-skeleton-thumb"></div></div>';
        }
        return h;
      }

      function buildExploreCards(posts) {
        const cu = getCurrentUser();
        return posts.map(post => {
          const profile = post.profile || {};
          const author = window.getAuthorFromProfile ? window.getAuthorFromProfile(profile) : { name: 'Anonymous', avatar: '' };
          const mediaItems = getMediaItems(post);
          let mh = '';
          if (mediaItems.length > 0) {
            const first = mediaItems[0];
            const url = first.url;
            const isVideo = first.type === 'video' || (url && isYouTubeUrl(url));
            if (url) {
              if (isVideo && isYouTubeUrl(url)) {
                const ytId = extractYouTubeId(url);
                if (ytId) {
                  mh = `<div class="ig-video-wrap" style="width:100%;margin:0;height:100%;position:relative;background:#000;"><div class="yt-wrap" style="padding-bottom:56.25%;height:0;position:relative;width:100%;"><iframe src="https://www.youtube.com/embed/${ytId}?autoplay=0&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0" allow="autoplay; encrypted-media" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"></iframe><div class="yt-tap" onclick="event.stopPropagation();"></div></div></div>`;
                } else {
                  mh = `<div class="ig-video-wrap" style="width:100%;margin:0;height:100%;"><video src="${url}" muted playsinline preload="metadata" class="explore-card-thumb" style="pointer-events:none;object-fit:cover;width:100%;height:100%;"></video></div>`;
                }
              } else if (isVideo) {
                mh = `<div class="ig-video-wrap" style="width:100%;margin:0;height:100%;"><video src="${url}" muted playsinline preload="metadata" class="explore-card-thumb" style="pointer-events:none;object-fit:cover;width:100%;height:100%;"></video></div>`;
              } else {
                mh = `<img src="${url}" class="explore-card-thumb" loading="lazy" alt="" onload="this.closest('.explore-card').classList.add('loaded')" onerror="this.closest('.explore-card').classList.add('loaded');this.outerHTML='<div class=\\"explore-card-no-media\\"><div class=\\"explore-card-no-media-text\\">${escapeHtml(post.title)}</div></div>'" />`;
              }
            } else {
              mh = `<div class="explore-card-no-media loaded"><div class="explore-card-no-media-text">${escapeHtml(post.title)}</div></div>`;
            }
          } else {
            mh = `<div class="explore-card-no-media loaded"><div class="explore-card-no-media-text">${escapeHtml(post.title)}</div></div>`;
          }

          const vb = mediaItems.length > 0 && (mediaItems[0].type === 'video' || (mediaItems[0].url && isYouTubeUrl(mediaItems[0].url))) ?
            `<div class="explore-card-video-badge"><svg width="9" height="9" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg> Video</div>` : '';
          const ah = author.avatar ?
            `<img src="${author.avatar}" class="explore-card-avatar" alt="" onerror="this.style.display='none'">` :
            `<div class="explore-card-avatar" style="display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#9CA3AF;">${author.name.charAt(0).toUpperCase()}</div>`;
          return `<div class="explore-card" data-post-id="${post.id}">${mh}<div class="explore-card-category">${escapeHtml(post.category || 'General')}</div>${vb}<div class="explore-card-overlay"><div class="explore-card-title">${escapeHtml(post.title)}</div><div class="explore-card-meta">${ah}<span class="explore-card-author">${escapeHtml(author.name)}</span><span class="explore-card-views">${svgEye()}${formatCount(post.views || 0)}</span></div></div></div>`;
        }).join('');
      }

      // ─── MARKET ──────────────────────────────────────────

      const MARKET_CATEGORIES = [
        { group: "Home & Garden", items: ["Tools", "Furniture", "Garden Appliance", "Household"] },
        { group: "Entertainment", items: ["Books, Movies & Music", "Video Games"] },
        { group: "Clothing & Accessories", items: ["Jewelry & Accessories", "Bags & Luggage", "Men's Clothing & Shoes", "Women's Clothing & Shoes"] },
        { group: "Family", items: ["Toys & Games", "Baby & Kids", "Pet Supplies"] },
        { group: "Health & Beauty", items: [] },
        { group: "Electronics", items: ["Mobile Phones", "Electronics & Computers"] },
        { group: "Hobbies", items: ["Sports", "Musical Instruments", "Arts & Crafts", "Antiques & Collectibles", "Auto Parts", "Bicycles"] },
        { group: "Classified", items: ["Garage Sale", "Miscellaneous"] },
        { group: "Vehicle", items: ["Cars & Trucks", "Motorcycles", "Powersports", "RVs & Campers", "Boats", "Commercial & Industrial", "Trailers", "Other"] },
        { group: "Home for Sales", items: ["Home sales", "Rental"] },
        { group: "Service", items: ["Repairs", "Maintenance", "Others"] }
      ];

      function getFilteredMarketItems() {
        let items = [...appData.marketItems];
        if (marketCategoryFilter) items = items.filter(i => i.category === marketCategoryFilter);
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          items = items.filter(i => i.title.toLowerCase().includes(q) || (i.description || '').toLowerCase().includes(q) || (i.category || '').toLowerCase().includes(q) || (i.location || '').toLowerCase().includes(q));
        }
        items.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
        return items;
      }

      function buildMarketCard(item) {
        let imageUrls = [];
        if (item.images && Array.isArray(item.images)) {
          if (item.images.length > 0 && typeof item.images[0] === 'object' && item.images[0].url) {
            imageUrls = item.images.map(img => img.url);
          } else {
            imageUrls = item.images;
          }
        } else if (item.imageUrl) {
          imageUrls = [item.imageUrl];
        }
        const ih = imageUrls.length > 0 ? `<img src="${imageUrls[0]}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\"market-card-no-image\\"><svg width=\\"32\\" height=\\"32\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"#D1D5DB\\" stroke-width=\\"1.5\\"><rect x=\\"3\\" y=\\"3\\" width=\\"18\\" height=\\"18\\" rx=\\"2\\"/></svg></div>'" />` : `<div class="market-card-no-image"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#D1D5DB" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div>`;
        const seller = { displayName: item.seller_name || 'Seller', avatar: item.seller_avatar || '' };
        const sr = `<div class="market-card-seller-row"><img src="${seller.avatar}" class="market-card-seller-avatar" onerror="this.style.display='none'" alt=""><span class="market-card-seller-name">${escapeHtml(seller.displayName)}</span></div>`;
        return `<div class="market-card" data-item-id="${item.id}">
          <div class="market-card-image-wrap">
            ${ih}
            <span class="market-card-category-badge">${escapeHtml(item.category || 'Item')}</span>
            <span class="market-card-price-tag">₦${formatPrice(item.price)}</span>
          </div>
          <div class="market-card-body">
            <div class="market-card-title">${escapeHtml(item.title)}</div>
            <div class="market-card-location">${svgLocation()} ${escapeHtml(item.location || 'Campus')}</div>
            ${sr}
          </div>
        </div>`;
      }

      function renderMarketGrid() {
        const items = getFilteredMarketItems();
        if (items.length === 0) {
          return `<div class="flex flex-col items-center justify-center py-16 text-center"><div class="w-14 h-14 rounded-full flex items-center justify-center mb-3" style="background:rgba(124,58,237,.08);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div><p class="font-heading font-bold text-base mb-1" style="color:var(--text);">No items listed yet</p><p class="text-sm" style="color:var(--muted);">Be the first to sell something on campus!</p></div>`;
        }
        return `<div class="market-grid">${items.map(buildMarketCard).join('')}</div>`;
      }

      function marketSkeleton() {
        let h = '<div class="market-grid">';
        for (let i = 0; i < 6; i++) {
          h += `<div class="market-skeleton-card"><div class="market-skeleton-image"></div><div class="market-skeleton-body"><div class="market-skeleton-line" style="width:80%;height:14px;"></div><div class="market-skeleton-line" style="width:55%;"></div><div class="market-skeleton-line" style="width:40%;"></div></div></div>`;
        }
        h += '</div>';
        return h;
      }

      function renderMarketView() {
        return `<div class="max-w-2xl mx-auto px-4 py-4">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
            <div><h2 class="font-heading font-extrabold text-lg" style="color:var(--text);">Campus Market</h2><p class="text-xs" style="color:var(--muted);">Buy & sell within your campus.</p></div>
            <button class="subtitle-filter-btn ${marketCategoryFilter?'active':''}" id="market-filter-inline-btn">${svgFilter()} ${marketCategoryFilter||'Filter'}</button>
          </div>
          <div id="market-container">${marketSkeleton()}</div>
        </div>`;
      }

      function setupMarketGridEvents() {
        document.querySelectorAll('.market-card').forEach(card => {
          card.addEventListener('click', () => openMarketFullscreen(parseInt(card.dataset.itemId)));
        });
      }

      function openMarketFullscreen(itemId) {
        const item = appData.marketItems.find(i => i.id === itemId);
        if (!item) return;
        // For now, just show a toast
        showToast('Item details coming soon');
      }

      function filterMarketCategory(c) {
        marketCategoryFilter = (marketCategoryFilter === c) ? '' : c;
        const mc = document.getElementById('market-container');
        if (mc) {
          mc.innerHTML = marketSkeleton();
          setTimeout(() => {
            if (document.getElementById('market-container')) {
              document.getElementById('market-container').innerHTML = renderMarketGrid();
              setupMarketGridEvents();
            }
            const fb = document.getElementById('market-filter-inline-btn');
            if (fb) {
              fb.innerHTML = `${svgFilter()} ${marketCategoryFilter||'Filter'}`;
              fb.classList.toggle('active', !!marketCategoryFilter);
            }
          }, 300);
        }
        closeMarketFilterModal();
      }

      function openMarketFilterModal() {
        const body = document.getElementById('market-filter-body');
        let html = '';
        MARKET_CATEGORIES.forEach(group => {
          html += `<div class="category-group-header">${escapeHtml(group.group)}</div>`;
          if (group.items.length > 0) {
            group.items.forEach(item => {
              const fullName = `${group.group} - ${item}`;
              html += `<button class="category-option ${marketCategoryFilter === fullName ? 'selected' : ''}" data-cat="${escapeHtml(fullName)}">${escapeHtml(item)}</button>`;
            });
          } else {
            html += `<button class="category-option ${marketCategoryFilter === group.group ? 'selected' : ''}" data-cat="${escapeHtml(group.group)}">All ${escapeHtml(group.group)}</button>`;
          }
        });
        body.innerHTML = html;
        body.querySelectorAll('.category-option').forEach(btn => {
          btn.addEventListener('click', () => filterMarketCategory(btn.dataset.cat));
        });
        document.getElementById('market-filter-modal').classList.add('open');
      }

      function closeMarketFilterModal() {
        document.getElementById('market-filter-modal').classList.remove('open');
      }

      // ─── TABS / NAV ───────────────────────────────────────

      function setTab(mode) {
        if (uiPage === 'home') tabScrollPositions.home = window.scrollY;
        else if (uiPage === 'explore') tabScrollPositions.explore = window.scrollY;
        else if (uiPage === 'market') tabScrollPositions.market = window.scrollY;
        currentCategoryFilter = '';
        searchQuery = '';
        feedPage = 1;
        if (mode === 'foryou') {
          currentSortMethod = 'foryou';
          uiPage = 'home';
        } else if (mode === 'explore') {
          currentSortMethod = 'trending';
          uiPage = 'explore';
        } else if (mode === 'market') {
          uiPage = 'market';
        }
        renderUI();
      }

      function renderUI() {
        const co = document.getElementById('user-content');
        if (uiPage === 'explore') {
          renderExploreGrid();
          setCommentBarVisible(false);
          refreshTabStates();
          setTimeout(() => window.scrollTo(0, tabScrollPositions.explore || 0), 80);
          return;
        }
        if (uiPage === 'market') {
          co.innerHTML = renderMarketView();
          setCommentBarVisible(false);
          refreshTabStates();
          setTimeout(() => {
            const mc = document.getElementById('market-container');
            if (mc) {
              mc.innerHTML = renderMarketGrid();
              setupMarketGridEvents();
            }
            document.getElementById('market-filter-inline-btn')?.addEventListener('click', openMarketFilterModal);
          }, 300);
          setTimeout(() => window.scrollTo(0, tabScrollPositions.market || 0), 80);
          return;
        }
        // home
        co.innerHTML = renderFeedContainer();
        loadInitialFeed();
        setCommentBarVisible(false);
        refreshTabStates();
        setTimeout(() => window.scrollTo(0, tabScrollPositions.home || 0), 80);
      }

      function refreshTabStates() {
        document.querySelectorAll('.tab-pill').forEach(el => el.classList.remove('tab-pill--active'));
        const map = { home: 'tab-foryou', explore: 'tab-explore', market: 'tab-market' };
        const id = map[uiPage];
        if (id) document.getElementById(id)?.classList.add('tab-pill--active');
      }

      async function refreshHome() {
        await reloadData();
        currentCategoryFilter = '';
        searchQuery = '';
        currentSortMethod = 'foryou';
        feedPage = 1;
        uiPage = 'home';
        renderUI();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast('Feed refreshed');
      }

      function filterCategory(c) {
        currentCategoryFilter = c;
        searchQuery = '';
        feedPage = 1;
        uiPage = 'home';
        currentSortMethod = 'trending';
        renderUI();
      }

      function navigateToProfile(uid) {
        const u = getCurrentUser();
        if (!u.isLoggedIn) { showToast('Sign in to view profiles'); return; }
        window.location.href = uid === u.id ? 'profile.html' : `profile.html?uid=${uid}`;
      }

      function openInAppWebView(url) {
        window.open(url, '_blank', 'noopener,noreferrer');
      }

      function openLightbox(src) {
        const modal = document.getElementById('lightbox');
        const img = document.getElementById('lightbox-img');
        if (!modal || !img) return;
        img.src = src;
        modal.classList.add('show');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        const modal = document.getElementById('lightbox');
        if (modal) modal.classList.remove('show');
        document.body.style.overflow = '';
      }

      // ─── FILTER DRAWER ─────────────────────────────────────

      function openFilterDrawer() {
        refreshDrawerCategories();
        const d = document.getElementById('filter-drawer');
        const b = document.getElementById('filter-backdrop');
        if (d) d.classList.remove('translate-y-full');
        if (b) {
          b.classList.remove('bg-opacity-0', 'pointer-events-none');
          b.classList.add('bg-opacity-40', 'pointer-events-auto');
        }
        document.body.style.overflow = 'hidden';
      }

      function closeFilterDrawer() {
        const d = document.getElementById('filter-drawer');
        const b = document.getElementById('filter-backdrop');
        if (d) d.classList.add('translate-y-full');
        if (b) {
          b.classList.add('bg-opacity-0', 'pointer-events-none');
          b.classList.remove('bg-opacity-40', 'pointer-events-auto');
        }
        document.body.style.overflow = '';
      }

      function refreshDrawerCategories() {
        const de = document.getElementById('drawer-categories');
        if (!de) return;
        const CATS = ["Technology", "Education", "Campus gist", "News & Updates", "Entertainment", "Movies", "Lifestyle", "Business & Finance", "Opinion / Thoughts", "Health & Fitness", "Travel & Culture", "Gaming", "Memes", "Science", "Fashion", "Music"];
        de.innerHTML = CATS.map(c =>
          `<button class="drawer-cat-btn ${currentCategoryFilter === c ? 'drawer-cat-btn--active' : ''}" style="width:100%;text-align:left;padding:11px 14px;border-radius:10px;font-size:.875rem;font-weight:500;color:${currentCategoryFilter === c ? '#7C3AED' : 'var(--muted)'};background:${currentCategoryFilter === c ? 'rgba(124,58,237,.08)' : 'var(--inp)'};border:1.5px solid ${currentCategoryFilter === c ? '#7C3AED' : 'transparent'};cursor:pointer;">${escapeHtml(c)}</button>`
        ).join('');
        de.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => { closeFilterDrawer(); filterCategory(btn.textContent.trim()); });
        });
      }

      // ─── TOAST ─────────────────────────────────────────────

      function showToast(msg) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
      }

      // ─── COMMENT BAR ──────────────────────────────────────

      function setCommentBarVisible(show, focus) {
        const b = document.getElementById('global-comment-bar');
        if (!b) return;
        if (show) {
          b.classList.add('visible');
          replyTarget = null;
          updateReplyContextUI();
          const ta = document.getElementById('global-comment-textarea');
          if (ta) { ta.value = ''; if (focus) setTimeout(() => ta.focus(), 260); }
        } else {
          b.classList.remove('visible');
        }
      }

      async function submitCommentFromBar() {
        const ta = document.getElementById('global-comment-textarea');
        const m = ta.value.trim();
        if (!m) return showToast('Reply cannot be empty.');
        const pi = replyTarget ? replyTarget.commentId : null;
        ta.value = '';
        ta.style.height = '40px';
        replyTarget = null;
        updateReplyContextUI();
        try {
          await addComment(currentPostId, pi, m);
          showToast(pi ? 'Reply posted' : 'Reply posted');
        } catch (err) {
          showToast(err.message || 'Failed to post reply', 'r');
        }
      }

      async function addComment(postId, parentId, message) {
        try {
          const comment = await window.PostsAPI.addComment(postId, parentId, message);
          const post = appData.posts.find(p => p.id === postId);
          if (post) {
            if (!post.comments) post.comments = [];
            post.comments.push(comment);
            post.commentCount = (post.commentCount || 0) + 1;
          }
          return comment;
        } catch (err) {
          showToast(err.message || 'Failed to post comment');
          throw err;
        }
      }

      // ─── PULL TO REFRESH ──────────────────────────────────

      function setupPullToRefresh() {
        let sy = 0, sx = 0, pulling = false;
        const ind = document.getElementById('pull-indicator');
        const pt = document.getElementById('pull-text');
        const pi = document.getElementById('pull-icon');
        document.addEventListener('touchstart', e => { sy = e.touches[0].clientY; sx = e.touches[0].clientX; }, { passive: true });
        document.addEventListener('touchmove', e => {
          if (window.scrollY > 0) return;
          const dy = e.touches[0].clientY - sy;
          const dx = Math.abs(e.touches[0].clientX - sx);
          if (dx > 30) return;
          if (dy > 55) {
            pulling = true;
            ind.classList.add('visible');
            if (dy > 120) {
              ind.classList.add('releasing');
              pt.textContent = 'Release to refresh';
              pi.style.transform = 'rotate(180deg)';
            } else {
              ind.classList.remove('releasing');
              pt.textContent = 'Pull down to refresh';
              pi.style.transform = 'rotate(0deg)';
            }
          } else {
            pulling = false;
            ind.classList.remove('visible', 'releasing');
          }
        }, { passive: true });
        document.addEventListener('touchend', () => {
          if (pulling) {
            pulling = false;
            ind.classList.remove('visible', 'releasing');
            pt.textContent = 'Pull down to refresh';
            pi.style.transform = 'rotate(0deg)';
            document.getElementById('refresh-spinner')?.classList.remove('hidden');
            setTimeout(() => document.getElementById('refresh-spinner')?.classList.add('hidden'), 1000);
            refreshHome();
          }
        });
      }

      // ─── KEYBOARD AVOIDANCE ──────────────────────────────

      function setupKeyboardAvoidance() {
        if (!window.visualViewport) return;
        const vv = window.visualViewport;
        function adjust() {
          const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
          const gcb = document.getElementById('global-comment-bar');
          const ecb = document.getElementById('explore-comment-bar');
          if (gcb) gcb.style.bottom = kb + 'px';
          if (ecb) ecb.style.bottom = kb + 'px';
          if (kb > 0) {
            const active = document.activeElement;
            if (active && (active.id === 'global-comment-textarea' || active.id === 'explore-comment-textarea')) {
              setTimeout(() => active.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60);
            }
          }
        }
        vv.addEventListener('resize', adjust);
        vv.addEventListener('scroll', adjust);
      }

      // ─── NAV SCROLL ──────────────────────────────────────

      function handleNavScroll() {
        const nav = document.getElementById('bottomNav');
        if (!nav || window.innerWidth >= 768) return;
        const currentScroll = window.scrollY;
        const scrollDiff = currentScroll - lastScrollY;
        const threshold = 15;
        if (Math.abs(scrollDiff) > threshold) {
          if (scrollDiff > 0 && !bottomNavHidden) {
            nav.classList.add('bottom-nav-hidden');
            bottomNavHidden = true;
            document.body.style.paddingBottom = '0';
          } else if (scrollDiff < 0 && bottomNavHidden) {
            nav.classList.remove('bottom-nav-hidden');
            bottomNavHidden = false;
            document.body.style.paddingBottom = 'calc(var(--bottom-nav-height) + 20px)';
          }
        }
        lastScrollY = currentScroll;
      }

      // ─── INIT ─────────────────────────────────────────────

      let tabScrollPositions = { home: 0, explore: 0, market: 0 };
      let lastScrollY = 0;
      let bottomNavHidden = false;
      let commentSortMode = 'top';

      async function init() {
        updateNavAvatar();
        await reloadData();

        // DOM events
        document.getElementById('topMsgBtn').addEventListener('click', () => window.location.href = 'chat.html');
        document.getElementById('logo-text').addEventListener('click', refreshHome);
        document.getElementById('tab-foryou').addEventListener('click', () => setTab('foryou'));
        document.getElementById('tab-explore').addEventListener('click', () => setTab('explore'));
        document.getElementById('tab-market').addEventListener('click', () => setTab('market'));
        document.getElementById('bottomHomeBtn').addEventListener('click', function(e) { e.preventDefault(); refreshHome(); });

        document.getElementById('filter-backdrop').addEventListener('click', closeFilterDrawer);
        document.getElementById('drawer-close-btn').addEventListener('click', closeFilterDrawer);
        document.getElementById('clear-filter-btn').addEventListener('click', () => { closeFilterDrawer(); currentCategoryFilter = ''; renderUI(); });

        // Comment bar
        document.getElementById('global-comment-textarea').addEventListener('input', function() {
          this.style.height = 'auto';
          this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });
        document.getElementById('global-comment-textarea').addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitCommentFromBar(); }
        });
        document.getElementById('global-comment-submit-btn').addEventListener('click', submitCommentFromBar);
        document.getElementById('reply-cancel-btn').addEventListener('click', cancelReply);

        // Lightbox
        document.getElementById('lightbox').addEventListener('click', function(e) {
          if (e.target === this || e.target.classList.contains('lightbox-close')) closeLightbox();
        });
        document.querySelector('.lightbox-close')?.addEventListener('click', closeLightbox);

        // Share modal close
        document.getElementById('share-close-btn')?.addEventListener('click', closeShareModal);

        // Explore fullscreen back
        document.getElementById('explore-back-btn')?.addEventListener('click', closeExploreFullscreen);

        // Pull to refresh
        setupPullToRefresh();
        setupKeyboardAvoidance();

        // Scroll
        window.addEventListener('scroll', handleNavScroll, { passive: true });

        // Set initial page
        currentSortMethod = 'foryou';
        uiPage = 'home';
        renderUI();

        // Realtime for profile updates
        if (window.sb) {
          const channel = window.sb.channel('profile-updates')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, (payload) => {
              const updated = payload.new;
              if (typeof window.updateAuthorUI === 'function') {
                window.updateAuthorUI(updated);
              }
              // Also update in-memory posts
              allPosts = allPosts.map(post => {
                if (post.user_id === updated.id) {
                  post.profile = { ...post.profile, ...updated };
                }
                return post;
              });
            })
            .subscribe();
        }

        console.log('FreeUpper Home initialized with single source of truth (profiles)');
      }

      // Expose some functions for global use
      window.toggleReaction = toggleReaction;
      window.openExplorePost = openExplorePost;
      window.closeExploreFullscreen = closeExploreFullscreen;
      window.showToast = showToast;
      window.toggleYtControls = toggleYtControls;
      window.initYtListener = initYtListener;
      window.seekYoutube = seekYoutube;
      window.toggleFollowHandler = toggleFollowHandler;
      window.openShareModal = openShareModal;
      window.closeShareModal = closeShareModal;
      window.reloadData = reloadData;
      window.refreshHome = refreshHome;

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
