<style>
/* ===== CSS VARIABLES ===== */
:root{
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --gold: #FFD700;
  --heart-red: #DC2626;
  --bg: #ffffff;
  --bg2: #f9fafb;
  --bg3: #ffffff;
  --bg4: #f3f4f6;
  --text: #111827;
  --muted: #6B7280;
  --muted2: #9CA3AF;
  --brd: #e5e7eb;
  --brd2: #d1d5db;
  --inp: #f9fafb;
  --p: #7C3AED;
  --pdim: rgba(124,58,237,0.1);
  --pbrd: #7C3AED;
  --navbg: rgba(255,255,255,0.92);
  --sidebg: #f9fafb;
}
[data-theme="dark"] {
  --bg: #0f0f0f;
  --bg2: #1a1a1a;
  --bg3: #242424;
  --bg4: #2a2a2a;
  --text: #f0f0f0;
  --muted: #9ca3af;
  --muted2: #6b7280;
  --brd: #2a2a2a;
  --brd2: #3a3a3a;
  --inp: #1f1f1f;
  --navbg: rgba(20,20,20,0.92);
  --sidebg: #0f0f0f;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter','Roboto',sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;touch-action:manipulation;
  padding-top:var(--safe-top);
  padding-bottom:70px;
}
.font-heading{font-family:'Poppins','Inter',sans-serif;}
body.single-post-open nav.sticky,body.single-post-open #category-chips,
body.explore-open nav.sticky,body.explore-open #category-chips,
body.market-fullscreen-open nav.sticky,body.market-fullscreen-open #category-chips{display:none !important;}

/* ────────────────── SIDE NAV (desktop) ────────────────── */
.side-nav {
  display: none;
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  flex-direction: column;
  align-items: center;
  padding: 28px 0 24px;
  background: var(--sidebg);
  border-right: 1px solid var(--brd);
  width: 70px;
  flex-shrink: 0;
  gap: 2px;
  z-index: 30;
  transition: background .3s, border-color .3s;
}
.side-logo {
  font-size: 20px;
  font-weight: 900;
  color: var(--p);
  margin-bottom: 20px;
  letter-spacing: -1px;
  cursor: pointer;
}
.side-logo a { color: inherit; text-decoration: none; }
.side-btn {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .15s, transform .1s;
  background: none;
  border: none;
  position: relative;
  gap: 3px;
  color: inherit;
  text-decoration: none;
}
.side-btn:hover { background: var(--pdim); transform: scale(1.04); }
.side-btn svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: var(--muted);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke .15s;
}
.side-btn span {
  font-size: 8px;
  color: var(--muted2);
  font-weight: 600;
}
.side-btn.active svg { stroke: var(--p); }
.side-btn.active span { color: var(--p); }
.side-btn .side-badge {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--p);
  border: 1.5px solid var(--sidebg);
}
.side-gap { flex: 1; }
.side-av {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid transparent;
  background: linear-gradient(135deg, #1a1035, #3b1a6b);
}
.side-btn.active .side-av { border-color: var(--p); }
@media (min-width: 768px) {
  .side-nav { display: flex; }
  body { padding-left: 70px; padding-bottom: 0; }
  .bottom-nav { display: none !important; }
}

/* ────────────────── BOTTOM NAV (mobile) ────────────────── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--navbg);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border-top: 1px solid var(--brd);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 0 max(env(safe-area-inset-bottom), 16px);
  z-index: 30;
  transition: transform .25s cubic-bezier(.4,0,.2,1), background .3s, border-color .3s;
  transform: translateY(0);
}
.bottom-nav.hidden {
  transform: translateY(100%);
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 6px clamp(8px,3vw,14px);
  border-radius: 14px;
  transition: background .15s;
  position: relative;
  background: none;
  border: none;
  text-decoration: none;
  color: inherit;
}
.nav-item:hover { background: var(--pdim); }
.nav-item svg {
  width: clamp(20px,5vw,24px);
  height: clamp(20px,5vw,24px);
  fill: none;
  stroke: var(--muted);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke .15s;
}
.nav-item span {
  font-size: clamp(9px,2vw,10px);
  color: var(--muted);
  font-weight: 600;
  letter-spacing: .03em;
}
.nav-item.active svg { stroke: var(--p); }
.nav-item.active span { color: var(--p); }
.nav-av {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid transparent;
  background: linear-gradient(135deg,#1a1035,#3b1a6b);
}
.nav-item.active .nav-av { border-color: var(--p); }
.nav-badge {
  position: absolute;
  top: 3px;
  right: clamp(4px,2vw,6px);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--p);
  border: 1.5px solid var(--bg);
}

/* ────────────────── PULL TO REFRESH ────────────────── */
#pull-indicator{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-80px);z-index:60;background:#fff;border:1px solid #E5E7EB;border-radius:999px;padding:8px 18px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.1);transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s;opacity:0;pointer-events:none;font-size:.8rem;font-weight:600;color:#7C3AED;}
#pull-indicator.visible{transform:translateX(-50%) translateY(12px);opacity:1;}
#pull-indicator.releasing{background:#F5F3FF;}

/* ────────────────── FEED POSTS ────────────────── */
.feed-post{border-bottom:1px solid var(--brd);padding:16px 0;position:relative;transition:background .1s ease;cursor:pointer;}
.feed-post:active{background:rgba(0,0,0,.02);}
.feed-post:last-child{border-bottom:none;}
.content-text{white-space:pre-wrap;line-height:1.6;font-size:1rem;color:var(--text);font-weight:400;word-wrap:break-word;}
.content-preview{white-space:pre-wrap;line-height:1.55;font-size:.98rem;color:var(--text);font-weight:400;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;}

/* ────── VIDEO WRAPPER (YouTube + non-YouTube) ────── */
.ig-video-wrap{position:relative;width:calc(100% + 32px);margin-left:-16px;margin-right:-16px;background:#000;border-radius:0;overflow:hidden;margin-top:10px;}
.ig-video-wrap video{width:100%;display:block;max-height:70vh;object-fit:contain;background:#000;pointer-events:none;}
.ig-video-wrap .plyr--video{background:#000;}
.ig-video-wrap .plyr__controls{background:rgba(0,0,0,.6);backdrop-filter:blur(4px);}
.ig-video-wrap .plyr__control--overlaid{background:rgba(124,58,237,.85);}
.ig-video-wrap .plyr__control--overlaid:hover{background:#7C3AED;}

/* ── YouTube custom controls ── */
.yt-wrap{position:relative;width:100%;padding-bottom:56.25%;height:0;background:#000;}
.yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.yt-tap{position:absolute;inset:0;z-index:10;cursor:pointer;}
.yt-mute-badge{position:absolute;top:12px;left:12px;width:34px;height:34px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:11;pointer-events:none;opacity:.95;transition:opacity .2s;}
.yt-mute-badge svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.yt-pause-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);width:68px;height:68px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:11;transition:transform .12s cubic-bezier(.34,1.56,.64,1),opacity .2s;opacity:0;pointer-events:none;}
.yt-pause-icon svg{width:28px;height:28px;fill:#fff;}
.yt-pause-icon.show{transform:translate(-50%,-50%) scale(1);opacity:1;}
.yt-pause-icon.hide{transform:translate(-50%,-50%) scale(0.8);opacity:0;}
.yt-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2);z-index:12;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.yt-progress-fill{height:100%;background:#fff;border-radius:0 2px 2px 0;transition:width .1s linear;pointer-events:none;width:0%;}
.yt-progress-thumb{position:absolute;top:50%;right:calc(100% - var(--pct, 0%));transform:translate(50%,-50%) scale(0);width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .15s;pointer-events:none;}
.yt-progress:hover .yt-progress-thumb,.yt-progress:active .yt-progress-thumb{transform:translate(50%,-50%) scale(1);}

/* ──────────────── REACTION / BOOKMARK / ETC ──────────────── */
.reaction-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:20px;cursor:pointer;font-weight:500;font-size:.85rem;border:none;background:transparent;transition:.15s;user-select:none;color:var(--muted);}
.reaction-btn:hover{background:rgba(220,38,38,.08);color:var(--heart-red);}
.reaction-btn:active{transform:scale(.9);}
.reaction-btn .heart-icon{width:19px;height:19px;transition:transform .18s ease;}
.reaction-btn.reacted{color:var(--heart-red);}
.reaction-btn.reacted .heart-icon{animation:heartPop .35s ease;}
.reaction-btn .reaction-count{font-weight:600;font-variant-numeric:tabular-nums;}
@keyframes heartPop{0%{transform:scale(1);}35%{transform:scale(1.45);}65%{transform:scale(.9);}100%{transform:scale(1);}}

.bookmark-badge{cursor:pointer;transition:.2s;display:inline-flex;align-items:center;color:var(--muted);padding:6px;border-radius:20px;}
.bookmark-badge:hover{background:rgba(255,215,0,.15);color:var(--gold);}
.bookmark-badge.bookmarked{color:var(--gold);}
.bookmark-badge svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;}
.bookmark-badge.bookmarked svg{fill:var(--gold);stroke:var(--gold);}
@keyframes bookmarkBreath{0%{transform:scale(1);}50%{transform:scale(1.3);}100%{transform:scale(1);}}
.bookmark-breathe{animation:bookmarkBreath .4s ease;}

/* ── Modern share icon (replaces old) ── */
.share-btn .share-icon-svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.comment-btn,.share-btn{cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);font-weight:500;padding:6px 8px;border-radius:20px;}
.share-btn:hover{background:rgba(124,58,237,.08);color:#7C3AED;}
.comment-btn:hover{background:rgba(124,58,237,.08);color:#7C3AED;}
.views-count{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);padding:6px 8px;}
.post-actions-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;max-width:420px;}
.post-actions-row svg{width:18px;height:18px;}

/* ──────────────── FOLLOW BUTTON ──────────────── */
.follow-btn {
  font-size: .72rem;
  font-weight: 700;
  padding: 2px 12px;
  border-radius: 999px;
  border: 1.5px solid var(--brd);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
  line-height: 1.8;
}
.follow-btn:hover {
  background: var(--pdim);
  border-color: var(--p);
  color: var(--p);
}
.follow-btn.following {
  background: rgba(124,58,237,.1);
  border-color: var(--p);
  color: var(--p);
}
.follow-btn.following:hover {
  background: rgba(220,38,38,.1);
  border-color: var(--heart-red);
  color: var(--heart-red);
}
.follow-btn.hidden-follow {
  display: none !important;
}

.btn-primary{background:#7C3AED;color:#fff;font-weight:700;border-radius:999px;padding:10px 20px;transition:all .2s;cursor:pointer;border:none;font-size:.9rem;display:inline-flex;align-items:center;gap:8px;}
.btn-primary:hover{background:#6D28D9;}
.btn-primary:active{transform:scale(.97);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:transparent;color:#4B5563;font-weight:600;border-radius:999px;padding:8px 16px;border:1px solid #E5E7EB;transition:.18s;cursor:pointer;font-size:.875rem;display:inline-flex;align-items:center;gap:6px;}
.btn-ghost:hover{background:#F3F4F6;}
.btn-ghost:active{transform:scale(.97);}
.input-soft{border:1.5px solid #E5E7EB;border-radius:10px;padding:10px 14px;font-size:.925rem;width:100%;background:#FAFBFC;outline:none;transition:.2s;}
.input-soft:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.08);background:#fff;}

.tab-pill{padding:14px 16px;font-size:.9rem;font-weight:700;color:#6B7280;background:none;border:none;cursor:pointer;position:relative;white-space:nowrap;transition:color .2s;flex:1;}
.tab-pill::after{content:'';position:absolute;bottom:0;left:50%;width:56px;height:3px;background:#7C3AED;border-radius:3px 3px 0 0;transform:translateX(-50%) scaleX(0);transition:transform .2s ease;}
.tab-pill--active{color:var(--text);}
.tab-pill--active::after{transform:translateX(-50%) scaleX(1);}
[data-theme="dark"] .tab-pill--active{color:#fff;}

nav.sticky{position:sticky;top:0;z-index:30;background:var(--bg2);border-bottom:1px solid var(--brd);}
#category-chips{position:sticky;top:52px;z-index:20;background:var(--bg2);border-bottom:1px solid var(--brd);}
#chips-container{display:flex;width:100%;}

/* ──────────────── EXPLORE GRID ──────────────── */
.explore-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;}
@media(min-width:768px){.explore-grid{grid-template-columns:1fr 1fr 1fr;gap:12px;}}
.explore-card{position:relative;border-radius:14px;overflow:hidden;background:#111;cursor:pointer;aspect-ratio:9/16;opacity:0;transform:scale(.97);transition:opacity .35s ease,transform .35s ease;}
.explore-card.loaded{opacity:1;transform:scale(1);}
.explore-card:active{transform:scale(.97);transition:transform .15s;}
.explore-card-thumb{width:100%;height:100%;object-fit:cover;display:block;}
.explore-card-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:32px 9px 10px;}
.explore-card-title{font-size:.78rem;font-weight:700;color:#fff;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px;}
.explore-card-meta{display:flex;align-items:center;gap:5px;}
.explore-card-avatar{width:20px;height:20px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.55);flex-shrink:0;background:#374151;}
.explore-card-author{font-size:.68rem;font-weight:600;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.explore-card-views{font-size:.65rem;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:2px;flex-shrink:0;}
.explore-card-category{position:absolute;top:8px;left:8px;background:rgba(124,58,237,.9);color:#fff;font-size:.58rem;font-weight:700;padding:3px 7px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;}
.explore-card-video-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.6rem;font-weight:700;padding:3px 7px;border-radius:20px;display:flex;align-items:center;gap:3px;}
.explore-card-no-media{width:100%;height:100%;background:#1F2937;display:flex;align-items:center;justify-content:center;}
.explore-card-no-media-text{font-size:.7rem;font-weight:700;color:rgba(255,255,255,.25);text-align:center;padding:10px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.explore-skeleton-card{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:9/16;background:#1a1a1a;}
.explore-skeleton-thumb{width:100%;height:100%;background:linear-gradient(90deg,#1f1f1f 25%,#2a2a2a 50%,#1f1f1f 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}

/* ──────────────── MARKET GRID ──────────────── */
.market-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 0;}
@media(min-width:640px){.market-grid{grid-template-columns:1fr 1fr 1fr;gap:12px;}}
.market-card{position:relative;border-radius:16px;overflow:hidden;background:#fff;cursor:pointer;border:1px solid #F3F4F6;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .18s ease;animation:feedFadeIn .35s ease-out;}
.market-card:active{transform:scale(.97);}
.market-card-image-wrap{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:#F9FAFB;}
.market-card-image-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.market-card-no-image{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#F3F4F6;color:#D1D5DB;}
.market-card-price-tag{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.78);color:#fff;font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:20px;}
.market-card-body{padding:10px 12px 12px;}
.market-card-title{font-size:.82rem;font-weight:600;color:#111827;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px;}
.market-card-location{font-size:.68rem;color:#9CA3AF;display:flex;align-items:center;gap:3px;}
.market-card-seller-row{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid #F3F4F6;}
.market-card-seller-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.market-card-seller-name{font-size:.68rem;color:#6B7280;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.market-card-category-badge{position:absolute;top:8px;left:8px;background:rgba(124,58,237,.9);color:#fff;font-size:.55rem;font-weight:700;padding:3px 7px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;z-index:2;}
.market-skeleton-card{border-radius:16px;overflow:hidden;background:#fff;border:1px solid #F3F4F6;}
.market-skeleton-image{width:100%;aspect-ratio:1/1;background:linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 50%,#f3f4f6 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
.market-skeleton-body{padding:10px 12px 12px;}
.market-skeleton-line{height:10px;border-radius:5px;background:linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 50%,#f3f4f6 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;margin-bottom:6px;}

.skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
.skeleton-post{padding:16px 0;border-bottom:1px solid var(--brd);}
.skeleton-line{height:12px;margin-bottom:10px;border-radius:6px;}
.skeleton-title{height:20px;width:75%;margin-bottom:10px;border-radius:6px;}
.skeleton-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;}
.skeleton-image{height:180px;width:100%;border-radius:14px;margin:10px 0;}
.skeleton-reactions{height:24px;width:220px;border-radius:20px;margin-top:12px;}
@keyframes feedFadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.subtitle-filter-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:16px;font-size:.72rem;font-weight:700;cursor:pointer;border:1.5px solid var(--brd);background:var(--bg3);color:var(--muted);transition:all .15s;white-space:nowrap;}
.subtitle-filter-btn:hover,.subtitle-filter-btn.active{background:#F5F3FF;border-color:#7C3AED;color:#7C3AED;}

/* ──────────────── COMMENTS ──────────────── */
.comment-item{display:flex;gap:10px;padding:10px 0;align-items:flex-start;width:100%;box-sizing:border-box;}
.comment-avatar{width:36px;height:36px;border-radius:50%;background:#E5E7EB;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#6B7280;flex-shrink:0;overflow:hidden;cursor:pointer;}
.comment-avatar img{width:100%;height:100%;object-fit:cover;}
.comment-body{flex:1;min-width:0;overflow:hidden;}
.comment-username{font-size:.88rem;font-weight:700;color:var(--text);margin-bottom:2px;}
.comment-text{white-space:pre-wrap;line-height:1.5;font-size:.92rem;color:var(--text);font-weight:400;word-break:break-word;overflow-wrap:anywhere;}
.comment-text.collapsed{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.comment-show-more{font-size:.78rem;color:#7C3AED;font-weight:700;cursor:pointer;background:none;border:none;padding:2px 0 0 0;display:block;}
.comment-meta{display:flex;align-items:center;gap:12px;margin-top:5px;flex-wrap:wrap;}
.comment-time{font-size:.75rem;color:#9CA3AF;}
.comment-reply-btn{font-size:.75rem;color:#6B7280;font-weight:700;cursor:pointer;background:none;border:none;padding:0;}
.comment-reply-btn:hover{color:#7C3AED;}
.comment-like-btn{font-size:.75rem;color:#9CA3AF;font-weight:500;cursor:pointer;background:none;border:none;padding:0;display:flex;align-items:center;gap:3px;}
.comment-like-btn.liked{color:var(--heart-red);}
.comment-like-btn svg{width:14px;height:14px;}
.replies-thread{border-left:2px solid #E5E7EB;margin-left:18px;padding-left:0;box-sizing:border-box;width:calc(100% - 18px);}
.reply-item{display:flex;gap:8px;padding:8px 0 8px 14px;align-items:flex-start;width:100%;box-sizing:border-box;}
.reply-avatar-dot{width:26px;height:26px;border-radius:50%;background:#E5E7EB;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.6rem;color:#6B7280;margin-left:-10px;border:2px solid #fff;z-index:2;overflow:hidden;cursor:pointer;}
.reply-avatar-dot img{width:100%;height:100%;object-fit:cover;}
.reply-body{flex:1;min-width:0;overflow:hidden;}
.reply-username{font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:1px;}
.reply-text{white-space:pre-wrap;line-height:1.45;font-size:.88rem;color:var(--text);font-weight:400;word-break:break-word;overflow-wrap:anywhere;}
.reply-meta{display:flex;align-items:center;gap:10px;margin-top:3px;flex-wrap:wrap;}
.reply-time{font-size:.7rem;color:#9CA3AF;}
.reply-reply-btn{font-size:.7rem;color:#6B7280;font-weight:700;cursor:pointer;background:none;border:none;padding:0;}
.reply-like-btn{font-size:.7rem;color:#9CA3AF;font-weight:500;cursor:pointer;background:none;border:none;padding:0;display:flex;align-items:center;gap:2px;}
.reply-like-btn.liked{color:var(--heart-red);}
.view-replies-btn,.hide-replies-btn{display:flex;align-items:center;gap:4px;font-size:.78rem;color:#7C3AED;font-weight:700;cursor:pointer;background:none;border:none;padding:0;margin-top:4px;}
.view-replies-btn{margin-left:46px;}
.hide-replies-btn{margin-left:18px;padding-left:14px;color:#6B7280;}

/* ──────────────── GLOBAL COMMENT BAR ──────────────── */
#global-comment-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--brd);z-index:45;padding:8px 14px;padding-bottom:max(8px,var(--safe-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1),bottom .15s ease;box-shadow:0 -2px 12px rgba(0,0,0,.06);}
#global-comment-bar.visible{transform:translateY(0);}
#reply-context-banner{display:none;align-items:center;gap:6px;margin-bottom:6px;font-size:.8rem;color:var(--muted);padding:4px 0;}
#reply-context-banner.show{display:flex;}
#reply-context-username{font-weight:700;color:#7C3AED;}
#reply-cancel-btn{margin-left:auto;cursor:pointer;background:none;border:none;font-size:1rem;color:#9CA3AF;padding:2px 6px;border-radius:4px;line-height:1;}
.global-comment-row{display:flex;gap:8px;align-items:flex-end;}
.global-comment-row textarea{flex:1;min-width:0;border:1.5px solid var(--brd);border-radius:20px;padding:9px 14px;font-size:.9rem;resize:none;outline:none;font-family:inherit;background:var(--inp);line-height:1.45;transition:.2s;min-height:40px;max-height:100px;box-sizing:border-box;height:40px;color:var(--text);}
.global-comment-row textarea:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.07);background:var(--bg);}
.global-comment-row button{background:#7C3AED;color:#fff;border:none;border-radius:999px;padding:9px 18px;font-size:.85rem;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap;align-self:flex-end;}
.global-comment-row button:disabled{opacity:.5;cursor:not-allowed;}

/* ──────────────── LIGHTBOX ──────────────── */
.lightbox-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
.lightbox-modal.show{opacity:1;pointer-events:auto;}
.lightbox-modal img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px;}
.lightbox-close{position:absolute;top:20px;right:30px;color:#fff;font-size:30px;cursor:pointer;background:none;border:none;}

/* ──────────────── EXPLORE FULLSCREEN ──────────────── */
.explore-fullscreen,.market-fullscreen,.market-filter-modal{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);padding-top:var(--safe-top);}
.explore-fullscreen{z-index:80;overflow:hidden !important;}
.market-fullscreen{z-index:85;}
.market-filter-modal{z-index:86;}
.explore-fullscreen.open,.market-fullscreen.open,.market-filter-modal.open{transform:translateY(0);}
.explore-fullscreen-header,.market-fullscreen-header,.market-filter-header{position:relative;z-index:10;background:var(--bg2);border-bottom:1px solid var(--brd);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.explore-fullscreen-header{justify-content:space-between;}
.explore-fullscreen-header .explore-category-name{font-weight:600;font-size:.85rem;color:var(--muted);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
#explore-fullscreen-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:20px;}
.market-fullscreen-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.market-filter-body{flex:1;overflow-y:auto;padding:16px;}
.category-group-header{font-weight:700;font-size:.72rem;color:#7C3AED;text-transform:uppercase;letter-spacing:.06em;padding:12px 4px 6px;}
.category-option{width:100%;text-align:left;padding:12px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:.9rem;cursor:pointer;transition:.12s;display:flex;align-items:center;justify-content:space-between;}
.category-option:hover{background:var(--bg4);}
.category-option.selected{background:var(--pdim);color:var(--p);font-weight:700;}
.category-option.selected::after{content:'✓';color:var(--p);font-weight:700;}

/* ──────────────── MARKET FULLSCREEN SLIDER ──────────────── */
.market-fs-slider{position:relative;width:100%;background:#000;overflow:hidden;}
.market-fs-track{display:flex;transition:transform .3s ease;will-change:transform;}
.market-fs-track img{flex:0 0 100%;width:100%;max-height:60vh;object-fit:contain;display:block;}
.market-fs-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3;}
.market-fs-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:.2s;}
.market-fs-dot.active{background:#fff;width:16px;border-radius:3px;}
.market-fs-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;color:#fff;}
.market-fs-arrow.left{left:8px;}
.market-fs-arrow.right{right:8px;}

/* ──────────────── SHARE SHEET ──────────────── */
.share-sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg2);
  border-radius: 20px 20px 0 0;
  z-index: 100;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
  padding: 16px 20px max(env(safe-area-inset-bottom), 20px);
  box-shadow: 0 -4px 30px rgba(0,0,0,.15);
  max-height: 80vh;
  overflow-y: auto;
}
.share-sheet.open {
  transform: translateY(0);
}
.share-sheet-handle {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--muted2);
  margin: 0 auto 16px;
}
.share-sheet-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 16px;
  text-align: center;
}
.share-option-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.share-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 4px;
  background: var(--bg3);
  border-radius: 14px;
  border: 1px solid var(--brd);
  cursor: pointer;
  transition: background .15s;
  -webkit-tap-highlight-color: transparent;
}
.share-option:hover {
  background: var(--pdim);
}
.share-option svg {
  width: 28px;
  height: 28px;
  stroke: var(--muted);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.share-option span {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
}
.share-option.share-profile svg { stroke: var(--p); }
.share-option.share-copy svg { stroke: var(--muted); }
.share-option.share-whatsapp svg { stroke: #25D366; }
.share-option.share-instagram svg { stroke: #E1306C; }
.share-option.share-repost svg { stroke: #00BA7C; }
.share-option.share-download svg { stroke: var(--muted); }

.share-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 99;
  opacity: 0;
  visibility: hidden;
  transition: opacity .3s, visibility .3s;
}
.share-backdrop.open {
  opacity: 1;
  visibility: visible;
}

/* ──────────────── MISC ──────────────── */
.single-post-container{padding-bottom:100px;}
.spinner{width:18px;height:18px;border:2.5px solid var(--brd);border-top-color:#7C3AED;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#toast{transition:all .3s cubic-bezier(.68,-.55,.265,1.55);}
.comment-skeleton {
  display: flex;
  gap: 10px;
  padding: 10px 0;
  align-items: flex-start;
}
.comment-skeleton .sk-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg4);
  flex-shrink: 0;
}
.comment-skeleton .sk-lines {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.comment-skeleton .sk-line {
  height: 12px;
  border-radius: 4px;
  background: var(--bg4);
  width: 100%;
}
.comment-skeleton .sk-line.short {
  width: 60%;
}
</style>
</head>

<script>
(function(){
'use strict';

// ───────────────────────────────────────────────────────────────
// DATA LAYER
// ───────────────────────────────────────────────────────────────
const SK='freeupper_blog_data_v2', UK='freeupper_user_profile', BK='freeupper_bookmarks',
      CVK='freeupper_comments_visible', UCK='freeupper_user_categories', MSK='freeupper_market_saved',
      ALL_USERS_KEY='freeupper_all_users', FOLLOW_KEY='freeupper_follows',
      SHARE_KEY='freeupper_shares'; // track shares

const CATS=["Technology","Education","Campus gist","News & Updates","Entertainment","Movies","Lifestyle",
  "Business & Finance","Opinion / Thoughts","Health & Fitness","Travel & Culture","Gaming","Memes","Science",
  "Fashion","Music"];

const MARKET_CATEGORIES=[
  {group:"Home & Garden",items:["Tools","Furniture","Garden Appliance","Household"]},
  {group:"Entertainment",items:["Books, Movies & Music","Video Games"]},
  {group:"Clothing & Accessories",items:["Jewelry & Accessories","Bags & Luggage","Men's Clothing & Shoes","Women's Clothing & Shoes"]},
  {group:"Family",items:["Toys & Games","Baby & Kids","Pet Supplies"]},
  {group:"Health & Beauty",items:[]},
  {group:"Electronics",items:["Mobile Phones","Electronics & Computers"]},
  {group:"Hobbies",items:["Sports","Musical Instruments","Arts & Crafts","Antiques & Collectibles","Auto Parts","Bicycles"]},
  {group:"Classified",items:["Garage Sale","Miscellaneous"]},
  {group:"Vehicle",items:["Cars & Trucks","Motorcycles","Powersports","RVs & Campers","Boats","Commercial & Industrial","Trailers","Other"]},
  {group:"Home for Sales",items:["Home sales","Rental"]},
  {group:"Service",items:["Repairs","Maintenance","Others"]}
];

const REPLY_BATCH=3, PAGE_SIZE=5;

function getDefaultData(){ return {posts:[],nextId:1,nextCommentId:1,userReactions:{},marketItems:[],nextMarketId:1}; }
function loadData(){const r=localStorage.getItem(SK); if(r){try{return JSON.parse(r);}catch(e){}} const d=getDefaultData(); saveData(d); return d;}
function saveData(d){localStorage.setItem(SK,JSON.stringify(d));}
let appData=loadData();
function persist(){saveData(appData);}
if(!appData.marketItems||!Array.isArray(appData.marketItems)){appData.marketItems=[];persist();}

function getShares(){ const s=localStorage.getItem(SHARE_KEY); return s ? JSON.parse(s) : {}; }
function incrementShares(postId){ const s=getShares(); s[postId]=(s[postId]||0)+1; localStorage.setItem(SHARE_KEY,JSON.stringify(s)); }

// ───────────────────────────────────────────────────────────────
// USER
// ───────────────────────────────────────────────────────────────
function getCurrentUser(){
  let u=JSON.parse(localStorage.getItem(UK));
  if(!u){
    u={id:'FU-'+Math.random().toString(36).substr(2,9).toUpperCase(),username:'',displayName:'Guest',bio:'',
      website:'',avatar:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#E5E7EB"/><circle cx="50" cy="38" r="16" fill="#9CA3AF"/><ellipse cx="50" cy="75" rx="30" ry="22" fill="#9CA3AF"/></svg>'),
      createdAt:Date.now(),isLoggedIn:false,verified:false};
    localStorage.setItem(UK,JSON.stringify(u));
  }
  return u;
}
function saveCurrentUser(u){localStorage.setItem(UK,JSON.stringify(u));}
function getAllUsers(){return JSON.parse(localStorage.getItem(ALL_USERS_KEY)||'[]');}
function registerCurrentUserInDirectory(){
  const user=getCurrentUser();
  let all=getAllUsers();
  const idx=all.findIndex(u=>u.id===user.id);
  const rec={id:user.id,username:user.username,displayName:user.displayName,bio:user.bio,website:user.website,
    avatar:user.avatar,isPrivate:false,verified:user.verified||false};
  if(idx>=0) all[idx]=rec; else all.push(rec);
  localStorage.setItem(ALL_USERS_KEY,JSON.stringify(all));
}
function updateNavAvatar(){
  const u=getCurrentUser();
  ['navAv','sideAv'].forEach(id=>{const el=document.getElementById(id); if(el) el.src=u.avatar;});
  const a=document.getElementById('nav-user-avatar');
  if(a){a.src=u.avatar;a.classList.remove('hidden');}
}

// ───────────────────────────────────────────────────────────────
// FOLLOW SYSTEM
// ───────────────────────────────────────────────────────────────
function getFollows(){ const raw=localStorage.getItem(FOLLOW_KEY); return raw ? JSON.parse(raw) : {}; }
function saveFollows(f){ localStorage.setItem(FOLLOW_KEY, JSON.stringify(f)); }
function isFollowing(userId){ const f=getFollows(); return !!f[userId]; }
function toggleFollowUser(userId){
  const f=getFollows();
  if(f[userId]){ delete f[userId]; } else { f[userId]=true; }
  saveFollows(f);
  return !!f[userId];
}
function getFollowCounts(userId){
  const all=getAllUsers();
  const follows=getFollows();
  let followers=0, following=0;
  for(const uid in follows){
    if(follows[uid]) following++;
  }
  for(const uid in follows){
    if(follows[uid] && all.find(u=>u.id===uid)) followers++;
  }
  return { followers, following };
}

// ───────────────────────────────────────────────────────────────
// HELPERS
// ───────────────────────────────────────────────────────────────
function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function linkifyContent(t){const r=/(https?:\/\/[^\s<>"{}|\\^`\[\]]+)/g;return escapeHtml(t).replace(r,u=>`<a href="javascript:void(0)" class="text-primary underline font-medium break-all" data-extlink="${encodeURIComponent(u)}">${u}</a>`);}
function formatCount(n){ if(!n) return '0'; if(n>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B'; if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M'; if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K'; return String(n); }
function formatPrice(a){return a.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function formatRelativeTime(iso){ const now=Date.now(), then=new Date(iso).getTime(), diff=Math.floor((now-then)/1000); if(diff<60) return 'Just now'; if(diff<3600) return Math.floor(diff/60)+'m ago'; if(diff<86400) return Math.floor(diff/3600)+'h ago'; if(diff<172800) return 'Yesterday'; if(diff<604800) return Math.floor(diff/86400)+'d ago'; return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

// ───────────────────────────────────────────────────────────────
// ICONS (modern share)
// ───────────────────────────────────────────────────────────────
function svgClock(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';}
function svgEye(){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V10"/><path d="M12 19V5"/><path d="M20 19V14"/></svg>';}
function svgComment(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';}
function svgShare(){return '<svg class="share-icon-svg" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';}
function svgChevronDown(){return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>';}
function svgChevronUp(){return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>';}
function svgFilter(){return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>';}
function svgLocation(){return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';}
function svgHeart(reacted){ return reacted ? '<svg class="heart-icon" viewBox="0 0 24 24" fill="#DC2626" stroke="#DC2626" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' : '<svg class="heart-icon" viewBox="0 0 24 24" fill="#FFFFFF" stroke="currentColor" stroke-width="1.7"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'; }
function bookmarkIcon(filled){ const color=filled?'var(--gold)':'none'; return `<svg width="19" height="19" viewBox="0 0 24 24" fill="${color}" stroke="var(--gold)" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`; }

// ───────────────────────────────────────────────────────────────
// BOOKMARKS / REACTIONS
// ───────────────────────────────────────────────────────────────
function getBookmarks(){const b=localStorage.getItem(BK);return b?JSON.parse(b):[];}
function saveBookmarks(a){localStorage.setItem(BK,JSON.stringify(a));}
function toggleBookmark(postId){let b=getBookmarks(); if(b.includes(postId)) b=b.filter(i=>i!==postId); else b.push(postId); saveBookmarks(b); return b.includes(postId);}
function isBookmarked(postId){return getBookmarks().includes(postId);}

function getMarketSaved(){const r=localStorage.getItem(MSK);return r?JSON.parse(r):[];}
function saveMarketSaved(a){localStorage.setItem(MSK,JSON.stringify(a));}
function toggleMarketSaved(id){let s=getMarketSaved(); if(s.includes(id)) s=s.filter(i=>i!==id); else s.push(id); saveMarketSaved(s); return s.includes(id);}
function isMarketSaved(id){return getMarketSaved().includes(id);}

function toggleReaction(postId){
  const post=appData.posts.find(p=>p.id===postId);
  if(!post) return;
  const key=`${postId}-like`;
  if(appData.userReactions[key]){ delete appData.userReactions[key]; post.reactions.like=Math.max(0,(post.reactions.like||0)-1); }
  else { appData.userReactions[key]=true; post.reactions.like=(post.reactions.like||0)+1; }
  persist();
  updateReactionsUI(postId);
}
function updateReactionsUI(postId){
  const post=appData.posts.find(p=>p.id===postId);
  if(!post) return;
  const reacted=!!appData.userReactions[`${postId}-like`];
  document.querySelectorAll(`[data-post-reactions="${postId}"] .reaction-btn`).forEach(btn=>{
    btn.classList.toggle('reacted',reacted);
    const icon=btn.querySelector('.heart-icon-wrap');
    if(icon) icon.innerHTML=svgHeart(reacted);
    const cnt=btn.querySelector('.reaction-count');
    if(cnt) cnt.textContent=formatCount(post.reactions.like||0);
  });
}
function buildReactionButton(postId){
  const post=appData.posts.find(p=>p.id===postId);
  const count=post?post.reactions.like||0:0;
  const reacted=!!appData.userReactions[`${postId}-like`];
  return `<button type="button" class="reaction-btn ${reacted?'reacted':''}" data-reaction="like">
    <span class="heart-icon-wrap">${svgHeart(reacted)}</span>
    <span class="reaction-count">${formatCount(count)}</span>
  </button>`;
}

// ───────────────────────────────────────────────────────────────
// YOUTUBE PLAYER
// ───────────────────────────────────────────────────────────────
let ytState = {};
let ytInfo = {};
let ytWindows = {};

function ytPostMessage(idx, func, args = []) {
  const iframe = document.getElementById('yt-' + idx);
  if (!iframe || !iframe.contentWindow) return;
  iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args }), '*');
}

function updateYtProgressUI(idx, currentTime, duration) {
  if (!duration) return;
  const pct = (currentTime / duration) * 100;
  const fill = document.getElementById('ytProgFill-' + idx);
  const thumb = document.getElementById('ytProgThumb-' + idx);
  if (fill) fill.style.width = pct + '%';
  if (thumb) thumb.style.setProperty('--pct', pct + '%');
}

function _updateMuteBadge(idx) {
  const badge = document.getElementById('ytMuteBadge-' + idx);
  const ico = document.getElementById('ytMuteIco-' + idx);
  if (!badge || !ico) return;
  const state = ytState[idx] || { muted: true };
  if (state.muted) {
    ico.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
    badge.style.opacity = '.95';
  } else {
    ico.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
    badge.style.opacity = '.6';
  }
}

function _showYtPauseIcon(idx, isPlaying) {
  const icon = document.getElementById('ytPauseIcon-' + idx);
  if (!icon) return;
  icon.querySelector('svg').innerHTML = isPlaying ?
    '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' :
    '<polygon points="5 3 19 12 5 21 5 3"/>';
  icon.classList.remove('hide');
  icon.classList.add('show');
  setTimeout(() => {
    icon.classList.remove('show');
    icon.classList.add('hide');
    setTimeout(() => icon.classList.remove('hide'), 200);
  }, 700);
}

function toggleYtControls(idx) {
  if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
  const state = ytState[idx];

  if (state.muted) {
    ytPostMessage(idx, 'unMute');
    state.muted = false;
    showToast('Sound on 🔊');
    _updateMuteBadge(idx);
    return;
  }

  if (state.playing) {
    ytPostMessage(idx, 'pauseVideo');
    state.playing = false;
    _showYtPauseIcon(idx, false);
  } else {
    ytPostMessage(idx, 'playVideo');
    state.playing = true;
    _showYtPauseIcon(idx, true);
  }
}

function initYtListener(idx) {
  const iframe = document.getElementById('yt-' + idx);
  if (!iframe || !iframe.contentWindow) return;
  ytWindows[idx] = iframe.contentWindow;
  iframe.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'yt-' + idx }), '*');
}

function seekYoutube(e, idx) {
  const prog = document.getElementById('ytProg-' + idx);
  if (!prog) return;
  const rect = prog.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const info = ytInfo[idx];
  if (!info || !info.duration) return;
  const time = pct * info.duration;
  ytPostMessage(idx, 'seekTo', [time, true]);
  updateYtProgressUI(idx, time, info.duration);
}

function setupPlyrPlayer(videoElement) {
  if (videoElement.plyr) return;
  videoElement.setAttribute('playsinline', '');
  videoElement.setAttribute('webkit-playsinline', 'true');
  videoElement.removeAttribute('controls');
  const player = new Plyr(videoElement, {
    controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
    fullscreen: { enabled: true, fallback: true, iosNative: false },
    settings: ['quality', 'speed'],
    quality: { default: 'auto', options: ['1080p', '720p', '480p', '360p'] }
  });
  videoElement.plyr = player;
  return player;
}

// ───────────────────────────────────────────────────────────────
// DETECT YOUTUBE URL
// ───────────────────────────────────────────────────────────────
function isYouTubeUrl(url) {
  if (!url) return false;
  return url.includes('youtube.com/embed') || url.includes('youtu.be') || url.includes('youtube.com/watch');
}

function extractYouTubeId(url) {
  const match = url.match(/(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/) ||
                url.match(/(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/) ||
                url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
  return match ? match[1] : null;
}

// ───────────────────────────────────────────────────────────────
// VIDEO AUTOPLAY WITH INTERSECTION OBSERVER
// ───────────────────────────────────────────────────────────────
let videoObserver = null;

function setupVideoAutoplay() {
  if (videoObserver) videoObserver.disconnect();
  const videoWraps = document.querySelectorAll('.ig-video-wrap');
  if (!videoWraps.length) return;

  videoObserver = new IntersectionObserver((entries) => {
    let visibleWrap = null;
    for (const entry of entries) {
      if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
        visibleWrap = entry.target;
        break;
      }
    }

    videoWraps.forEach(wrap => {
      if (wrap === visibleWrap) return;
      // Pause Plyr videos
      const vid = wrap.querySelector('video');
      if (vid && vid.plyr) vid.plyr.pause();
      // Pause YouTube videos
      const ytIframe = wrap.querySelector('iframe');
      if (ytIframe) {
        const idx = ytIframe.id.replace('yt-', '');
        if (ytState[idx] && ytState[idx].playing) {
          ytPostMessage(idx, 'pauseVideo');
          ytState[idx].playing = false;
          _showYtPauseIcon(idx, false);
        }
      }
    });

    if (visibleWrap) {
      const vid = visibleWrap.querySelector('video');
      if (vid && vid.plyr) { vid.plyr.play().catch(()=>{}); }
      const ytIframe = visibleWrap.querySelector('iframe');
      if (ytIframe) {
        const idx = ytIframe.id.replace('yt-', '');
        if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
        if (!ytState[idx].playing) {
          ytPostMessage(idx, 'playVideo');
          ytState[idx].playing = true;
          _showYtPauseIcon(idx, true);
          _updateMuteBadge(idx);
        }
      }
    }
  }, { threshold: 0.6 });

  videoWraps.forEach(wrap => videoObserver.observe(wrap));
}

function pauseAllVideos() {
  document.querySelectorAll('.ig-video-wrap video').forEach(vid => {
    if (vid.plyr) vid.plyr.pause();

  document.querySelectorAll('.ig-video-wrap iframe').forEach(iframe => {
    const idx = iframe.id.replace('yt-', '');
    if (ytState[idx] && ytState[idx].playing) {

      ytState[idx].playing = false;

    }
  });
}

let lastScrollY = 0;
let ticking = false;

function handleNavVisibility() {
  const nav = document.getElementById('bottomNav');
  if (!nav) return;
  const currentScrollY = window.scrollY;
  if (currentScrollY > lastScrollY && currentScrollY > 50) {
    // Scrolling down – hide
    nav.classList.add('hidden');
  } else {
    // Scrolling up – show
    nav.classList.remove('hidden');
  }
  lastScrollY = currentScrollY;
  ticking = false;
}

  if (!ticking) {
    window.requestAnimationFrame(function() {
      handleNavVisibility();
    });
    ticking = true;

});

function getFilteredSortedPosts(){
  const allUsers=getAllUsers(), currentUser=getCurrentUser();
  let p=[...appData.posts];
  p=p.filter(post=>{
    if(post.authorId===currentUser.id) return true;
    const author=allUsers.find(u=>u.id===post.authorId);
    return !author || !author.isPrivate;
  });
  if(currentCategoryFilter) p=p.filter(p=>p.category===currentCategoryFilter);
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    p=p.filter(p=>p.title.toLowerCase().includes(q)||(p.content||'').toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q)||(p.author||'').toLowerCase().includes(q)||(p.tags&&p.tags.some(t=>t.toLowerCase().includes(q))));
  }
  if(currentSortMethod==='trending') p.sort((a,b)=>(b.views||0)-(a.views||0));
  else if(currentSortMethod==='foryou'){
    const uc=getUserCategories();
    p.sort((a,b)=>{
      const score=p=>{const ah=(Date.now()-new Date(p.date))/36e5, eg=(p.views||0)+((p.reactions.like||0)*2)+(p.comments.length*2); return eg/Math.pow(ah+2,1.5);};
      return (score(b)*(uc.includes(b.category)?1.4:1)) - (score(a)*(uc.includes(a.category)?1.4:1));
    });
  } else p.sort((a,b)=>new Date(b.date)-new Date(a.date));
  return p;
}

function renderCommentsSkeleton(){
  let html = '';
  for(let i=0;i<3;i++){
    html += `<div class="comment-skeleton"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>`;
  }
  return html;
}

function getAllDescendants(pid,comments){const r=[]; const dc=comments.filter(c=>c.parentId===pid); for(const c of dc){r.push(c);r.push(...getAllDescendants(c.id,comments));} return r;}
function renderCommentsHTML(comments,postId,vc){
  const tl=comments.filter(c=>c.parentId===null);
  if(tl.length===0) return '<p class="text-sm py-8 text-center" style="color:var(--muted);">No replies yet. Be the first.</p>';
  const sh=tl.slice(0,vc), hi=tl.length>vc;
  let h=sh.map(c=>renderCommentThread(c,comments,postId)).join('');
  if(hi) h+=`<button type="button" class="view-replies-btn load-more-comments-btn" style="margin-left:0;" data-post-id="${postId}" onclick="loadMoreComments(${postId})">${svgChevronDown()} View ${formatCount(tl.length-vc)} more repl${tl.length-vc!==1?'ies':'y'}</button>`;
  return h;
}
function renderCommentThread(c,allComments,postId){
  const ds=getAllDescendants(c.id,allComments), hr=ds.length>0, ec=expandedThreads.get(c.id)||0;
  let rh='';
  if(hr&&ec>0){
    const sh=ds.slice(0,ec), rm=ds.length-ec;
    rh=`<div class="replies-thread">${sh.map(r=>renderReplyItem(r,allComments,postId)).join('')}</div>`;
    if(rm>0) rh+=`<button type="button" class="view-replies-btn expand-replies-btn" data-comment-id="${c.id}" data-post-id="${postId}" onclick="expandReplies(${c.id},${postId})">${svgChevronDown()} View ${formatCount(rm)} more repl${rm!==1?'ies':'y'}</button>`;
    else rh+=`<button type="button" class="hide-replies-btn collapse-replies-btn" data-comment-id="${c.id}" data-post-id="${postId}" onclick="collapseReplies(${c.id},${postId})">${svgChevronUp()} Hide replies</button>`;
  } else if(hr&&ec===0){
    rh=`<button type="button" class="view-replies-btn expand-replies-btn" data-comment-id="${c.id}" data-post-id="${postId}" onclick="expandReplies(${c.id},${postId})">${svgChevronDown()} View ${formatCount(ds.length)} repl${ds.length!==1?'ies':'y'}</button>`;
  }
  const lc=parseInt(localStorage.getItem('comment-like-'+c.id)||'0'), isL=lc>0, il=c.message.length>220;
  return `<div class="comment-item" data-comment-id="${c.id}">
    <div class="comment-avatar" data-username="${escapeHtml(c.username)}">${c.username.charAt(0).toUpperCase()}</div>
    <div class="comment-body">
      <div class="comment-username">${escapeHtml(c.username)}</div>
      <div class="comment-text${il?' collapsed':''}" data-cid="${c.id}">${escapeHtml(c.message)}</div>
      ${il?`<button class="comment-show-more" onclick="toggleCommentExpand(this, '${c.id}')">Show more</button>`:''}
      <div class="comment-meta">
        <span class="comment-time">${formatRelativeTime(c.time)}</span>
        <button class="comment-reply-btn" data-post-id="${postId}" onclick="replyToComment('${c.id}', '${escapeHtml(c.username)}')">Reply</button>
        <button class="comment-like-btn ${isL?'liked':''}" onclick="toggleCommentLikeUI(this, '${c.id}')">
          <svg viewBox="0 0 24 24" fill="${isL?'#DC2626':'none'}" stroke="${isL?'#DC2626':'currentColor'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="like-count">${lc>0?lc:''}</span>
        </button>
      </div>
    </div>
  </div>${rh}`;
}
function renderReplyItem(r,allComments,postId){
  const lc=parseInt(localStorage.getItem('comment-like-'+r.id)||'0'), isL=lc>0;
  const pc=allComments.find(c=>c.id===r.parentId), ru=pc?pc.username:'';
  const mn=(ru&&ru!==r.username)?`<span style="color:#7C3AED;font-weight:600;">@${escapeHtml(ru)}</span> `:'';
  const il=r.message.length>220;
  return `<div class="reply-item" data-comment-id="${r.id}">
    <div class="reply-avatar-dot" data-username="${escapeHtml(r.username)}">${r.username.charAt(0).toUpperCase()}</div>
    <div class="reply-body">
      <div class="reply-username">${escapeHtml(r.username)}</div>
      <div class="comment-text reply-text${il?' collapsed':''}" data-cid="${r.id}">${mn}${escapeHtml(r.message)}</div>
      ${il?`<button class="comment-show-more" onclick="toggleCommentExpand(this, '${r.id}')">Show more</button>`:''}
      <div class="reply-meta">
        <span class="reply-time">${formatRelativeTime(r.time)}</span>
        <button class="reply-reply-btn" data-post-id="${postId}" onclick="replyToComment('${r.id}', '${escapeHtml(r.username)}')">Reply</button>
        <button class="reply-like-btn ${isL?'liked':''}" onclick="toggleCommentLikeUI(this, '${r.id}')">
          <svg viewBox="0 0 24 24" fill="${isL?'#DC2626':'none'}" stroke="${isL?'#DC2626':'currentColor'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="like-count">${lc>0?lc:''}</span>
        </button>
      </div>
    </div>
  </div>`;
}
function addComment(postId,parentId,message){
  const p=appData.posts.find(p=>p.id===postId);
  if(!p) return;
  const cu=getCurrentUser();
  p.comments.push({id:appData.nextCommentId++,username:cu.displayName,message,time:new Date().toISOString(),approved:true,parentId:parentId||null});
  persist();
}
function refreshCommentsList(postId,listId){
  const p=appData.posts.find(p=>p.id===postId); if(!p) return;
  const cl=document.getElementById(listId); if(!cl) return;
  const ac=p.comments.filter(c=>c.approved!==false), vc=getVisibleComments(postId);
  cl.innerHTML=renderCommentsHTML(ac,postId,vc);
}
function updateCommentCount(postId){
  const p=appData.posts.find(p=>p.id===postId); if(!p) return;
  const cc=p.comments.filter(c=>c.approved!==false).length;
  document.querySelectorAll(`article[data-post-id="${postId}"] .comment-btn span`).forEach(el=>el.textContent=formatCount(cc));
  const h3=document.querySelector(`#comments-count-${postId}`);
  if(h3) h3.textContent=formatCount(cc);
}
function toggleCommentLikeUI(btn, commentId){
  const isLiked=btn.classList.toggle('liked');
  const key='comment-like-'+commentId;
  let count=parseInt(localStorage.getItem(key)||'0');
  count=isLiked?count+1:Math.max(0,count-1);
  if(count===0) localStorage.removeItem(key); else localStorage.setItem(key,String(count));
  const svg=btn.querySelector('svg'), cnt=btn.querySelector('.like-count');
  if(svg){svg.setAttribute('fill',isLiked?'#DC2626':'none');svg.setAttribute('stroke',isLiked?'#DC2626':'currentColor');}
  if(cnt) cnt.textContent=count>0?count:'';
}
function toggleCommentExpand(btn,commentId){
  const el=document.querySelector(`.comment-text[data-cid="${commentId}"]`);
  if(!el) return;
  const collapsed=el.classList.toggle('collapsed');
  btn.textContent=collapsed?'Show more':'Show less';
}
function expandReplies(commentId,postId){expandedThreads.set(commentId,(expandedThreads.get(commentId)||0)+REPLY_BATCH);refreshCommentsList(postId,'comments-list');}
function collapseReplies(commentId,postId){expandedThreads.delete(commentId);refreshCommentsList(postId,'comments-list');}
function loadMoreComments(postId){setCommentsVisible(postId,getVisibleComments(postId)+5);refreshCommentsList(postId,'comments-list');}
function setupCommentListDelegation(container,postId){
  container.addEventListener('click',function(e){
    const t=e.target;
    if(t.closest('.comment-reply-btn')||t.closest('.reply-reply-btn')){
      const btn=t.closest('.comment-reply-btn')||t.closest('.reply-reply-btn');
      const ci=parseInt(btn.closest('[data-comment-id]')?.dataset.commentId);
      const un=btn.closest('[data-comment-id]')?.querySelector('.comment-username,.reply-username')?.textContent;
      if(ci&&un) replyToComment(ci,un);
      return;
    }
    if(t.closest('.comment-like-btn')||t.closest('.reply-like-btn')){toggleCommentLikeUI(t.closest('.comment-like-btn')||t.closest('.reply-like-btn'), t.closest('[data-comment-id]')?.dataset.commentId);return;}
    if(t.closest('.comment-show-more')){
      const btn=t.closest('.comment-show-more');
      const ci=btn.parentElement.querySelector('.comment-text')?.dataset.cid;
      if(ci) toggleCommentExpand(btn,ci);
      return;
    }
    if(t.closest('.expand-replies-btn')){const ci=parseInt(t.closest('.expand-replies-btn').dataset.commentId);if(ci) expandReplies(ci,postId);return;}
    if(t.closest('.collapse-replies-btn')){const ci=parseInt(t.closest('.collapse-replies-btn').dataset.commentId);if(ci) collapseReplies(ci,postId);return;}
    if(t.closest('.load-more-comments-btn')){loadMoreComments(postId);return;}
    if(t.closest('.comment-avatar')||t.closest('.reply-avatar-dot')){
      const el=t.closest('.comment-avatar')||t.closest('.reply-avatar-dot');
      navigateToProfileByUsername(el.dataset.username);
      return;
    }
  });
}
function replyToComment(commentId,username){
  if(uiPage==='single-post-explore'){
    exploreReplyTarget={commentId,username};
    updateExploreReplyContextUI();
    const ta=document.getElementById('explore-comment-textarea');
    if(ta){ta.focus();ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,100)+'px';}
    document.getElementById('explore-comment-bar').scrollIntoView({behavior:'smooth'});
  } else {
    replyTarget={commentId,username};
    updateReplyContextUI();
    const ta=document.getElementById('global-comment-textarea');
    if(ta){ta.focus();}
    setCommentBarVisible(true);
  }
}
function updateReplyContextUI(){
  const banner=document.getElementById('reply-context-banner'), ue=document.getElementById('reply-context-username');
  if(replyTarget){banner.classList.add('show');ue.textContent='@'+replyTarget.username;} else {banner.classList.remove('show');ue.textContent='';}
}
function updateExploreReplyContextUI(){
  const banner=document.getElementById('explore-reply-banner'), ue=document.getElementById('explore-reply-username');
  if(exploreReplyTarget){banner.style.display='flex';ue.textContent='@'+exploreReplyTarget.username;} else {banner.style.display='none';ue.textContent='';}
}
function cancelReply(){replyTarget=null;updateReplyContextUI();const ta=document.getElementById('global-comment-textarea');if(ta) ta.value='';}
function cancelExploreReply(){exploreReplyTarget=null;updateExploreReplyContextUI();const ta=document.getElementById('explore-comment-textarea');if(ta) ta.value='';}
function submitCommentFromBar(){
  const ta=document.getElementById('global-comment-textarea');
  const m=ta.value.trim();
  if(!m) return showToast('Reply cannot be empty.');
  const pi=replyTarget?replyTarget.commentId:null;
  addComment(currentPostId,pi,m);
  ta.value='';ta.style.height='40px';
  replyTarget=null;updateReplyContextUI();
  updateCommentCount(currentPostId);
  showToast(pi?'Reply posted':'Reply posted');
}
function submitExploreComment(){
  const ta=document.getElementById('explore-comment-textarea');
  const m=ta.value.trim();
  if(!m) return showToast('Reply cannot be empty.');
  const pi=exploreReplyTarget?exploreReplyTarget.commentId:null;
  addComment(currentPostId,pi,m);
  ta.value='';ta.style.height='40px';
  exploreReplyTarget=null;updateExploreReplyContextUI();
  refreshCommentsList(currentPostId,'comments-list');
  updateCommentCount(currentPostId);
  showToast(pi?'Reply posted':'Reply posted');
}
function setCommentBarVisible(show,focus){
  const b=document.getElementById('global-comment-bar');
  if(!b) return;
  if(show){ b.classList.add('visible'); replyTarget=null;updateReplyContextUI(); const ta=document.getElementById('global-comment-textarea'); if(ta){ta.value='';if(focus) setTimeout(()=>ta.focus(),260);} }
  else b.classList.remove('visible');
}

function buildSinglePostHTML(post){
  if(!post) return '<div class="p-8 text-center" style="color:var(--muted);">Post not found</div>';
  const cu=getCurrentUser(), isOwn=post.authorId&&post.authorId===cu.id;
  const aa=isOwn?cu.avatar:(post.authorAvatar||cu.avatar), da=isOwn?cu.displayName:(post.author||'Anonymous');
  const mh=buildMediaHTML(post, 'single');
  const bm=isBookmarked(post.id);
  const comments=post.comments.filter(c=>c.approved!==false), vc=getVisibleComments(post.id);
  const followBtn = buildFollowButton(post.authorId, da);
  return `<div class="max-w-2xl mx-auto px-4 py-4 single-post-container" data-post-id="${post.id}">
    <article>
      <div class="flex items-center gap-2 mb-2">
        <img src="${aa}" class="w-10 h-10 rounded-full object-cover cursor-pointer" style="flex-shrink:0;">
        <div>
          <div class="font-bold text-sm cursor-pointer hover:underline" style="color:var(--text);">${escapeHtml(da)}</div>
          <div class="text-xs flex items-center gap-1" style="color:var(--muted);">${svgClock()} ${formatRelativeTime(post.date)}</div>
          ${followBtn}
        </div>
      </div>
      <h1 class="font-heading font-extrabold mt-1 mb-1" style="font-size:clamp(1.25rem,4vw,1.7rem);word-break:break-word;overflow-wrap:anywhere;line-height:1.3;color:var(--text);">${escapeHtml(post.title)}</h1>
      ${mh}
      ${post.description?`<p class="text-sm leading-relaxed mt-2 mb-1" style="white-space:pre-wrap;color:var(--muted);">${escapeHtml(post.description)}</p>`:''}
      <div class="content-text mt-1">${linkifyContent(post.content)}</div>
    </article>
    <hr class="my-4" style="border-color:var(--brd);">
    <div class="post-actions-row" style="max-width:100%;justify-content:space-between;" data-post-reactions="${post.id}">
      <span class="comment-btn">${svgComment()}<span id="comments-count-${post.id}">${formatCount(comments.length)}</span></span>
      ${buildReactionButton(post.id)}
      <span class="views-count">${svgEye()}<span>${formatCount(post.views||0)}</span></span>
      <span class="bookmark-badge ${bm?'bookmarked':''}" id="single-bookmark-${post.id}">${bookmarkIcon(bm)}</span>
      <span class="share-btn" onclick="openShareSheet(${post.id})">${svgShare()}</span>
    </div>
    <div class="mt-5">
      <h3 class="font-heading font-bold text-base mb-3" style="color:var(--text);">Replies</h3>
      <div id="comments-list">${renderCommentsSkeleton()}</div>
    </div>
  </div>`;
}

function openExplorePost(id,returnPage,focusComment){
  pauseHomepageVideos();

  const fs=document.getElementById('explore-fullscreen'), fc=document.getElementById('explore-fullscreen-content');
  if(!fs||!fc) return;
  currentPostId=id;
  uiPage='single-post-explore';
  window._fullscreenReturnPage=returnPage||uiPage||'home';
  exploreReplyTarget=null; expandedThreads.clear();
  const post=appData.posts.find(p=>p.id===id);
  if(post){post.views=(post.views||0)+1;persist();}
  const catNameEl=document.getElementById('explore-category-name');
  if(catNameEl) catNameEl.textContent=post?(post.category||'Post'):'Post';
  fc.innerHTML=buildSinglePostHTML(post);
  requestAnimationFrame(()=>{
    initPlayers(fc);
    // Replace skeleton with actual comments after a short delay
    setTimeout(()=>{
      if(post) refreshCommentsList(id, 'comments-list');
    }, 300);
  });
  fs.classList.add('open');
  document.body.classList.add('explore-open');
  document.body.style.overflow='hidden';
  fs.scrollTop=0;
  setCommentBarVisible(false);
  const eb=document.getElementById('explore-comment-bar'); if(eb) eb.style.display='block';
  updateExploreReplyContextUI();
  setupExploreEventDelegation(fc,id);
  setupCommentListDelegation(fc,id);
  if(focusComment){
    const ta=document.getElementById('explore-comment-textarea');
    if(ta) setTimeout(()=>ta.focus(),300);
  }
}

function closeExploreFullscreen(){
  const fs=document.getElementById('explore-fullscreen'); if(!fs) return;
  const eb=document.getElementById('explore-comment-bar'); if(eb) eb.style.display='none';
  fs.classList.remove('open');
  document.body.classList.remove('explore-open');
  document.body.style.overflow='';
  currentPostId=null;
  uiPage=window._fullscreenReturnPage||'home';
  refreshTabStates();
  setTimeout(()=>{
    const fc=document.getElementById('explore-fullscreen-content');
    if(fc) fc.innerHTML='';
    setupVideoAutoplay();
  },400);
}
function setupExploreEventDelegation(container,postId){
  container.addEventListener('click',function(e){
    const t=e.target;
    if(t.closest('#single-share-btn')){e.stopPropagation();openShareSheet(postId);return;}
    if(t.closest('.bookmark-badge')){
      const nb=toggleBookmark(postId), btn=t.closest('.bookmark-badge');
      btn.classList.toggle('bookmarked',nb);
      btn.innerHTML=bookmarkIcon(nb);
      btn.classList.add('bookmark-breathe');
      setTimeout(()=>btn.classList.remove('bookmark-breathe'),400);
      document.querySelectorAll(`article[data-post-id="${postId}"] .bookmark-badge`).forEach(el=>{el.classList.toggle('bookmarked',nb);el.innerHTML=bookmarkIcon(nb);});
      showToast(nb?'Saved':'Removed from saved');
      return;
    }
    if(t.closest('.reaction-btn')){toggleReaction(postId);return;}
    if(t.closest('[data-full-img]')){const c=t.closest('[data-full-img]');openLightbox(c.dataset.fullImg);return;}
    if(t.closest('[data-extlink]')){openInAppWebView(decodeURIComponent(t.closest('[data-extlink]').dataset.extlink));return;}
    if(t.closest('.font-bold.text-sm')){
      const p=appData.posts.find(p=>p.id===postId);
      if(p&&p.authorId) navigateToProfile(p.authorId);
      return;
    }
  });
}

function renderExploreGrid(){
  const co=document.getElementById('user-content');
  const allUsers=getAllUsers(), currentUser=getCurrentUser();
  let p=[...appData.posts].filter(post=>{
    if(post.authorId===currentUser.id) return true;
    const author=allUsers.find(u=>u.id===post.authorId);
    return !author||!author.isPrivate;
  });
  p.sort((a,b)=>((b.views||0)+(b.reactions.like||0)) - ((a.views||0)+(a.reactions.like||0)));

  co.innerHTML=`<div class="max-w-2xl mx-auto px-3 py-3">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 6px;">
      <h2 class="font-heading font-extrabold text-lg" style="color:var(--text);">Explore</h2>
      <button class="subtitle-filter-btn ${currentCategoryFilter?'active':''}" id="explore-filter-inline-btn">${svgFilter()} ${currentCategoryFilter||'Filter'}</button>
    </div>
    <div class="explore-grid" id="explore-grid-content">${exploreSkeletonGrid()}</div>
  </div>`;

  if(currentCategoryFilter) p=p.filter(post=>post.category===currentCategoryFilter);

  setTimeout(()=>{
    const gc=document.getElementById('explore-grid-content');
    if(!gc||uiPage!=='explore') return;
    if(p.length===0){
      gc.outerHTML='<div class="flex flex-col items-center justify-center py-16 text-center col-span-2" style="grid-column:1/-1;"><p class="text-sm" style="color:var(--muted);">No posts yet. Be the first to post!</p></div>';
      return;
    }
    gc.innerHTML=buildExploreCards(p);
    // Init videos in explore grid
    initPlayers(gc);
    gc.querySelectorAll('.explore-card').forEach(card=>{
      card.addEventListener('click',()=>{const pid=parseInt(card.dataset.postId); if(pid) openExplorePost(pid,'explore');});
    });
  },350);

  document.getElementById('explore-filter-inline-btn')?.addEventListener('click',openFilterDrawer);
}
function exploreSkeletonGrid(){
  let h=''; for(let i=0;i<8;i++) h+='<div class="explore-skeleton-card"><div class="explore-skeleton-thumb"></div></div>';
  return h;
}
function buildExploreCards(posts){
  const cu=getCurrentUser();
  return posts.map(post=>{
    const isOwn=post.authorId&&post.authorId===cu.id, av=isOwn?cu.avatar:(post.authorAvatar||''), au=isOwn?cu.displayName:(post.author||'Anonymous');
    let mh='';
    if(post.mediaType==='image'&&post.mediaUrl){
      mh=`<img src="${post.mediaUrl}" class="explore-card-thumb" loading="lazy" alt="" onload="this.closest('.explore-card').classList.add('loaded')" onerror="this.closest('.explore-card').classList.add('loaded');this.outerHTML='<div class=\\'explore-card-no-media\\'><div class=\\'explore-card-no-media-text\\'>${escapeHtml(post.title).replace(/'/g,"\\'")}</div></div>'">`;
    } else if(post.mediaType==='video'&&post.mediaUrl){
      if(isYouTubeUrl(post.mediaUrl)){
        const ytId=extractYouTubeId(post.mediaUrl);
        if(ytId){
          mh=`<div class="ig-video-wrap" style="width:100%;margin:0;"><div class="yt-wrap" style="padding-bottom:56.25%;"><iframe src="https://www.youtube.com/embed/${ytId}?autoplay=0&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0" allow="autoplay; encrypted-media" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"></iframe></div></div>`;
        } else {
          mh=`<div class="ig-video-wrap" style="width:100%;margin:0;"><video src="${post.mediaUrl}" muted playsinline preload="metadata" class="explore-card-thumb" style="pointer-events:none;"></video></div>`;
        }
      } else {
        mh=`<div class="ig-video-wrap" style="width:100%;margin:0;"><video src="${post.mediaUrl}" muted playsinline preload="metadata" class="explore-card-thumb" style="pointer-events:none;"></video></div>`;
      }
    } else {
      mh=`<div class="explore-card-no-media loaded"><div class="explore-card-no-media-text">${escapeHtml(post.title)}</div></div>`;
    }
    const vb=post.mediaType==='video'?`<div class="explore-card-video-badge"><svg width="9" height="9" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg> Video</div>`:'';
    const ah=av?`<img src="${av}" class="explore-card-avatar" alt="" onerror="this.style.display='none'">`:`<div class="explore-card-avatar" style="display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#9CA3AF;">${au.charAt(0).toUpperCase()}</div>`;
    const nl=!post.mediaUrl, cc=nl?'explore-card loaded':'explore-card';
    return `<div class="${cc}" data-post-id="${post.id}">${mh}<div class="explore-card-category">${escapeHtml(post.category||'General')}</div>${vb}<div class="explore-card-overlay"><div class="explore-card-title">${escapeHtml(post.title)}</div><div class="explore-card-meta">${ah}<span class="explore-card-author">${escapeHtml(au)}</span><span class="explore-card-views">${svgEye()}${formatCount(post.views||0)}</span></div></div></div>`;
  }).join('');
}

function getMarketItems(){if(!appData.marketItems||!Array.isArray(appData.marketItems)) appData.marketItems=[]; return appData.marketItems;}
function getFilteredMarketItems(){
  let items=[...getMarketItems()];
  if(marketCategoryFilter) items=items.filter(i=>i.category===marketCategoryFilter);
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    items=items.filter(i=>i.title.toLowerCase().includes(q)||(i.description||'').toLowerCase().includes(q)||(i.category||'').toLowerCase().includes(q)||(i.location||'').toLowerCase().includes(q));
  }
  items.sort((a,b)=>new Date(b.date||b.createdAt||0)-new Date(a.date||a.createdAt||0));
  return items;
}

// ───────────────────────────────────────────────────────────────
// TABS / NAV
// ───────────────────────────────────────────────────────────────
function setTab(mode){
  const scrollY=window.scrollY;
  if(uiPage==='home') tabScrollPositions.home=scrollY;
  else if(uiPage==='explore') tabScrollPositions.explore=scrollY;
  else if(uiPage==='market') tabScrollPositions.market=scrollY;
  currentCategoryFilter=''; searchQuery=''; feedPage=1;
  if(mode==='foryou'){currentSortMethod='foryou';uiPage='home';}
  else if(mode==='explore'){currentSortMethod='trending';uiPage='explore';}
  else if(mode==='market'){uiPage='market';}
  renderUI();
}
function renderUI(){
  const co=document.getElementById('user-content');
  if(uiPage==='explore'){ renderExploreGrid(); setCommentBarVisible(false); refreshTabStates(); setTimeout(()=>window.scrollTo(0,tabScrollPositions.explore||0),80); return; }
  if(uiPage==='market'){ co.innerHTML=renderMarketView(); setCommentBarVisible(false); refreshTabStates(); setTimeout(()=>{ const mc=document.getElementById('market-container'); if(mc){mc.innerHTML=renderMarketGrid();setupMarketGridEvents();} document.getElementById('market-filter-inline-btn')?.addEventListener('click',openMarketFilterModal); },300); setTimeout(()=>window.scrollTo(0,tabScrollPositions.market||0),80); return; }
  co.innerHTML=renderFeedContainer(); loadInitialFeed(); setCommentBarVisible(false); refreshTabStates(); setTimeout(()=>window.scrollTo(0,tabScrollPositions.home||0),80);
}
function refreshTabStates(){
  document.querySelectorAll('.tab-pill').forEach(el=>el.classList.remove('tab-pill--active'));
  const map={home:'tab-foryou',explore:'tab-explore',market:'tab-market','single-post-explore':null};
  const id=map[uiPage];
  if(id) document.getElementById(id)?.classList.add('tab-pill--active');
}

function navigateToProfile(uid){ const u=getCurrentUser(); if(!u.isLoggedIn){showToast('Sign in to view profiles');return;} window.location.href=uid===u.id?'profile.html':`profile.html?uid=${uid}`; }
function navigateToProfileByUsername(username){ if(!username||username==='Guest') return; const found=getAllUsers().find(u=>u.username===username||u.displayName===username); if(found) navigateToProfile(found.id); else showToast('User not found'); }
function openInAppWebView(url){ window.open(url,'_blank','noopener,noreferrer'); }
function closeInAppWebView(){ const o=document.getElementById('inapp-webview-overlay'), f=document.getElementById('inapp-webview-frame'); f.src=''; o.classList.add('hidden'); document.body.style.overflow=''; }

function openFilterDrawer(){ refreshDrawerCategories(); const d=document.getElementById('filter-drawer'), b=document.getElementById('filter-backdrop'); d.classList.remove('translate-y-full'); b.classList.remove('bg-opacity-0','pointer-events-none'); b.classList.add('bg-opacity-40','pointer-events-auto'); document.body.style.overflow='hidden'; }
function closeFilterDrawer(){ const d=document.getElementById('filter-drawer'), b=document.getElementById('filter-backdrop'); d.classList.add('translate-y-full'); b.classList.add('bg-opacity-0','pointer-events-none'); b.classList.remove('bg-opacity-40','pointer-events-auto'); document.body.style.overflow=''; }
function refreshDrawerCategories(){ const de=document.getElementById('drawer-categories'); if(!de) return; de.innerHTML=CATS.map(c=>`<button class="drawer-cat-btn ${currentCategoryFilter===c?'drawer-cat-btn--active':''}" style="width:100%;text-align:left;padding:11px 14px;border-radius:10px;font-size:.875rem;font-weight:500;color:${currentCategoryFilter===c?'#7C3AED':'var(--muted)'};background:${currentCategoryFilter===c?'rgba(124,58,237,.08)':'var(--inp)'};border:1.5px solid ${currentCategoryFilter===c?'#7C3AED':'transparent'};cursor:pointer;">${escapeHtml(c)}</button>`).join(''); de.querySelectorAll('button').forEach(btn=>{ btn.addEventListener('click',()=>{closeFilterDrawer();filterCategory(btn.textContent.trim());}); }); }

function showToast(msg,d=2000){ const t=document.getElementById('toast'); t.textContent=msg; t.style.background='var(--bg3)';t.style.color='var(--text)';t.style.border='1px solid var(--brd2)'; t.classList.add('opacity-100');t.classList.remove('opacity-0','pointer-events-none'); clearTimeout(t._t); t._t=setTimeout(()=>{t.classList.add('opacity-0','pointer-events-none');t.classList.remove('opacity-100');},d); }

function setupPullToRefresh(){ let sy=0,sx=0,pulling=false; const ind=document.getElementById('pull-indicator'), pt=document.getElementById('pull-text'), pi=document.getElementById('pull-icon'); document.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;sx=e.touches[0].clientX;},{passive:true}); document.addEventListener('touchmove',e=>{ if(window.scrollY>0) return; const dy=e.touches[0].clientY-sy, dx=Math.abs(e.touches[0].clientX-sx); if(dx>30) return; if(dy>55){pulling=true;ind.classList.add('visible'); if(dy>120){ind.classList.add('releasing');pt.textContent='Release to refresh';pi.style.transform='rotate(180deg)';} else{ind.classList.remove('releasing');pt.textContent='Pull down to refresh';pi.style.transform='rotate(0deg)';} } else {pulling=false;ind.classList.remove('visible','releasing');} },{passive:true}); document.addEventListener('touchend',()=>{ if(pulling){pulling=false;ind.classList.remove('visible','releasing');pt.textContent='Pull down to refresh';pi.style.transform='rotate(0deg)'; document.getElementById('refresh-spinner').classList.remove('hidden'); setTimeout(()=>document.getElementById('refresh-spinner').classList.add('hidden'),1000); setTimeout(()=>renderUI(),250); } }); }
function setupKeyboardAvoidance(){ if(!window.visualViewport) return; const vv=window.visualViewport; function adjust(){ const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop); const gcb=document.getElementById('global-comment-bar'), ecb=document.getElementById('explore-comment-bar'); if(gcb) gcb.style.bottom=kb+'px'; if(ecb) ecb.style.bottom=kb+'px'; if(kb>0){ const active=document.activeElement; if(active&&(active.id==='global-comment-textarea'||active.id==='explore-comment-textarea')){ setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),60); } } } vv.addEventListener('resize',adjust); vv.addEventListener('scroll',adjust); }

function init(){
  updateNavAvatar();
  registerCurrentUserInDirectory();

  document.getElementById('logo-text').addEventListener('click',()=>{uiPage='home';currentSortMethod='foryou';currentCategoryFilter='';renderUI();});
  document.getElementById('tab-foryou').addEventListener('click',()=>setTab('foryou'));
  document.getElementById('tab-explore').addEventListener('click',()=>setTab('explore'));
  document.getElementById('tab-market').addEventListener('click',()=>setTab('market'));

  document.getElementById('filter-backdrop').addEventListener('click',closeFilterDrawer);
  document.getElementById('drawer-close-btn').addEventListener('click',closeFilterDrawer);
  document.getElementById('clear-filter-btn').addEventListener('click',()=>{ closeFilterDrawer();currentCategoryFilter='';currentSortMethod='foryou';uiPage='home';renderUI(); });

  document.getElementById('global-comment-textarea').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';});
  document.getElementById('global-comment-textarea').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitCommentFromBar();}});
  document.getElementById('global-comment-submit-btn').addEventListener('click',submitCommentFromBar);
  document.getElementById('reply-cancel-btn').addEventListener('click',cancelReply);

  document.getElementById('explore-comment-textarea').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';});
  document.getElementById('explore-comment-textarea').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitExploreComment();}});
  document.getElementById('explore-comment-submit-btn').addEventListener('click',submitExploreComment);
  document.getElementById('explore-reply-cancel-btn').addEventListener('click',cancelExploreReply);
  document.getElementById('explore-back-btn').addEventListener('click',closeExploreFullscreen);

  document.getElementById('market-fullscreen-back-btn').addEventListener('click',closeMarketFullscreen);
  document.getElementById('market-filter-back-btn').addEventListener('click',closeMarketFilterModal);
  document.getElementById('market-filter-clear-btn').addEventListener('click',()=>{marketCategoryFilter='';closeMarketFilterModal();filterMarketCategory('');});

  document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this||e.target.classList.contains('lightbox-close')) closeLightbox();});
  document.querySelector('.lightbox-close').addEventListener('click',closeLightbox);

  document.getElementById('webview-close-btn').addEventListener('click',closeInAppWebView);
  document.getElementById('external-browser-btn').addEventListener('click',()=>{if(window._currentWebviewUrl) window.open(window._currentWebviewUrl,'_blank');});
  document.getElementById('inapp-webview-overlay').addEventListener('click',function(e){if(e.target===this) closeInAppWebView();});

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      closeLightbox();closeInAppWebView();
      if(document.getElementById('market-fullscreen').classList.contains('open')) closeMarketFullscreen();
      if(document.getElementById('market-filter-modal').classList.contains('open')) closeMarketFilterModal();
      if(document.getElementById('explore-fullscreen').classList.contains('open')) closeExploreFullscreen();
    }
  });

  const urlParams=new URLSearchParams(window.location.search);
  const postIdParam=urlParams.get('post');
  if(postIdParam){
    const id=parseInt(postIdParam);
    if(appData.posts.some(p=>p.id===id)){
      setTimeout(()=>{openExplorePost(id,'home');history.replaceState({},'',window.location.pathname);},400);
    }
  }

  renderUI();
  setupPullToRefresh();
  setupKeyboardAvoidance();
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();

})();
