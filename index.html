<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>FreeUpper — Home</title>
    <link rel="icon" type="image/png" href="freeupper.png" />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#7C3AED', 'primary-light': '#8B5CF6', 'primary-dark': '#6D28D9' },
                    fontFamily: { heading: ['Poppins', 'Inter', 'sans-serif'], body: ['Inter', 'Roboto', 'sans-serif'] },
                    borderRadius: { soft: '10px', softer: '14px' },
                    animation: { spin: 'spin 0.8s linear infinite' }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- ═══ ADDED: Supabase & our API modules ═══ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="global.js"></script>
    <script src="auth.js"></script>
    <script src="posts.js"></script>

    <!-- ═══ YOUR ORIGINAL CSS (copied verbatim) ═══ -->
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --gold: #FFD700;
            --heart-red: #DC2626;
            --bg: #ffffff;
            --bg2: #f9fafb;
            --bg3: #ffffff;
            --bg4: #f3f4f6;
            --text: #111827;
            --muted: #6B7280;
            --muted2: #9CA3AF;
            --brd: #e5e7eb;
            --brd2: #d1d5db;
            --inp: #f9fafb;
            --p: #7C3AED;
            --pdim: rgba(124, 58, 237, 0.1);
            --pbrd: #7C3AED;
            --navbg: rgba(255, 255, 255, 0.92);
            --sidebg: #f9fafb;
            --bottom-nav-height: 64px;
        }

        [data-theme="dark"] {
            --bg: #0f0f0f;
            --bg2: #1a1a1a;
            --bg3: #242424;
            --bg4: #2a2a2a;
            --text: #f0f0f0;
            --muted: #9ca3af;
            --muted2: #6b7280;
            --brd: #2a2a2a;
            --brd2: #3a3a3a;
            --inp: #1f1f1f;
            --navbg: rgba(20, 20, 20, 0.92);
            --sidebg: #0f0f0f;
        }

        /* ── System font stack (Facebook-style) ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            touch-action: manipulation;
            padding-top: var(--safe-top);
            padding-bottom: calc(var(--bottom-nav-height) + 20px);
            transition: padding-bottom 0.3s ease;
        }
        body.nav-hidden {
            padding-bottom: 0;
        }

        .font-heading {
            font-family: 'Poppins', 'Inter', sans-serif;
        }
        body.single-post-open nav.sticky,
        body.single-post-open #category-chips,
        body.explore-open nav.sticky,
        body.explore-open #category-chips,
        body.market-fullscreen-open nav.sticky,
        body.market-fullscreen-open #category-chips {
            display: none !important;
        }

        /* ────────────────── SIDE NAV (desktop) ────────────────── */
        .side-nav {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            flex-direction: column;
            align-items: center;
            padding: 28px 0 24px;
            background: var(--sidebg);
            border-right: 1px solid var(--brd);
            width: 70px;
            flex-shrink: 0;
            gap: 2px;
            z-index: 30;
            transition: background .3s, border-color .3s;
        }
        .side-logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--p);
            margin-bottom: 20px;
            letter-spacing: -1px;
            cursor: pointer;
        }
        .side-logo a {
            color: inherit;
            text-decoration: none;
        }
        .side-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s, transform .1s;
            background: none;
            border: none;
            position: relative;
            gap: 3px;
            color: inherit;
            text-decoration: none;
        }
        .side-btn:hover {
            background: var(--pdim);
            transform: scale(1.04);
        }
        .side-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .side-btn span {
            font-size: 8px;
            color: var(--muted2);
            font-weight: 600;
        }
        .side-btn.active svg {
            stroke: var(--p);
        }
        .side-btn.active span {
            color: var(--p);
        }
        .side-btn .side-badge {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--p);
            border: 1.5px solid var(--sidebg);
        }
        .side-gap {
            flex: 1;
        }
        .side-av {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .side-btn.active .side-av {
            border-color: var(--p);
        }

        @media (min-width: 768px) {
            .side-nav {
                display: flex;
            }
            body {
                padding-left: 70px;
                padding-bottom: 0 !important;
            }
            .bottom-nav {
                display: none !important;
            }
        }

        /* ────────────────── BOTTOM NAV (mobile) ────────────────── */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--navbg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-top: 1px solid var(--brd);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 max(env(safe-area-inset-bottom), 12px);
            z-index: 30;
            transition: transform 0.35s cubic-bezier(0.32, 0.94, 0.6, 1), background .3s, border-color .3s;
            height: var(--bottom-nav-height);
            transform: translateY(0);
            will-change: transform;
        }
        .bottom-nav.hidden-nav {
            transform: translateY(100%);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px clamp(6px, 2vw, 12px);
            border-radius: 14px;
            transition: background .15s;
            position: relative;
            background: none;
            border: none;
            text-decoration: none;
            color: inherit;
        }
        .nav-item:hover {
            background: var(--pdim);
        }
        .nav-item svg {
            width: clamp(20px, 5vw, 24px);
            height: clamp(20px, 5vw, 24px);
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .nav-item span {
            font-size: clamp(8px, 1.8vw, 10px);
            color: var(--muted);
            font-weight: 600;
            letter-spacing: .03em;
        }
        .nav-item.active svg {
            stroke: var(--p);
        }
        .nav-item.active span {
            color: var(--p);
        }
        .nav-av {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .nav-item.active .nav-av {
            border-color: var(--p);
        }
        .nav-badge {
            position: absolute;
            top: 2px;
            right: clamp(2px, 1vw, 4px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #EF4444;
            border: 1.5px solid var(--bg);
        }

        /* ────────────────── TOP HEADER ────────────────── */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--bg2);
            border-bottom: 1px solid var(--brd);
            position: sticky;
            top: 0;
            z-index: 29;
        }
        .top-header .brand {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .top-header .brand span {
            color: var(--p);
        }
        .top-header .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-header .header-actions .msg-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--pdim);
            border: none;
            cursor: pointer;
            color: var(--p);
            transition: background .2s, transform .15s;
            position: relative;
        }
        .top-header .header-actions .msg-btn:hover {
            background: rgba(124, 58, 237, 0.2);
            transform: scale(1.05);
        }
        .top-header .header-actions .msg-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--p);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .top-header .header-actions .msg-btn .msg-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #EF4444;
            border: 2px solid var(--bg2);
        }

        /* ────────────────── PULL TO REFRESH ────────────────── */
        #pull-indicator {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            z-index: 60;
            background: #fff;
            border: 1px solid #E5E7EB;
            border-radius: 999px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .1);
            transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
            opacity: 0;
            pointer-events: none;
            font-size: .8rem;
            font-weight: 600;
            color: #7C3AED;
        }
        #pull-indicator.visible {
            transform: translateX(-50%) translateY(12px);
            opacity: 1;
        }
        #pull-indicator.releasing {
            background: #F5F3FF;
        }

        /* ────────────────── FEED POSTS ────────────────── */
        .feed-post {
            border-bottom: 1px solid var(--brd);
            padding: 16px 0;
            position: relative;
            transition: background .1s ease;
            cursor: pointer;
            background: var(--bg3);
            margin-bottom: 8px;
        }
        .feed-post:active {
            background: rgba(0, 0, 0, .02);
        }
        .feed-post:last-child {
            border-bottom: 1px solid var(--brd);
        }

        /* ── Facebook-style post content ── */
        .content-text {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 16px;
            color: var(--text);
            font-weight: 400;
            word-wrap: break-word;
        }
        .content-text p {
            margin: 0 0 12px 0;
        }
        .content-text p:last-child {
            margin-bottom: 0;
        }

        .content-preview {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 16px;
            color: var(--text);
            font-weight: 400;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        /* ── Card padding ── */
        .feed-post .post-body {
            padding: 0 16px;
            max-width: 100%;
        }

        /* ────── FULL-WIDTH MEDIA (Homepage) ────── */
        .ig-media-container {
            width: calc(100% + 32px);
            margin-left: -16px;
            margin-right: -16px;
            border-radius: 0 !important;
            overflow: hidden;
            margin-top: 10px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 80vh;
        }
        .ig-media-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .ig-video-wrap {
            position: relative;
            width: calc(100% + 32px);
            margin-left: -16px;
            margin-right: -16px;
            background: #000;
            border-radius: 0 !important;
            overflow: hidden;
            margin-top: 10px;
        }
        .ig-video-wrap video {
            width: 100%;
            display: block;
            max-height: 70vh;
            object-fit: contain;
            background: #000;
            pointer-events: none;
        }
        .ig-video-wrap .plyr--video {
            background: #000;
        }
        .ig-video-wrap .plyr__controls {
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(4px);
        }
        .ig-video-wrap .plyr__control--overlaid {
            background: rgba(124, 58, 237, .85);
        }
        .ig-video-wrap .plyr__control--overlaid:hover {
            background: #7C3AED;
        }

        /* YouTube embed inside full-width container */
        .ig-video-wrap .yt-wrap {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .ig-video-wrap .yt-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .ig-video-wrap .yt-tap {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: pointer;
        }
        .ig-video-wrap .yt-mute-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 34px;
            height: 34px;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
            pointer-events: none;
            opacity: .95;
            transition: opacity .2s;
        }
        .ig-video-wrap .yt-mute-badge svg {
            width: 17px;
            height: 17px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .ig-video-wrap .yt-pause-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 68px;
            height: 68px;
            background: rgba(0, 0, 0, .5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
            transition: transform .12s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
            opacity: 0;
            pointer-events: none;
        }
        .ig-video-wrap .yt-pause-icon svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }
        .ig-video-wrap .yt-pause-icon.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .ig-video-wrap .yt-pause-icon.hide {
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
        }
        .ig-video-wrap .yt-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, .2);
            z-index: 12;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .ig-video-wrap .yt-progress-fill {
            height: 100%;
            background: #fff;
            border-radius: 0 2px 2px 0;
            transition: width .1s linear;
            pointer-events: none;
            width: 0%;
        }
        .ig-video-wrap .yt-progress-thumb {
            position: absolute;
            top: 50%;
            right: calc(100% - var(--pct, 0%));
            transform: translate(50%, -50%) scale(0);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            transition: transform .15s;
            pointer-events: none;
        }
        .ig-video-wrap .yt-progress:hover .yt-progress-thumb,
        .ig-video-wrap .yt-progress:active .yt-progress-thumb {
            transform: translate(50%, -50%) scale(1);
        }

        /* ──────────────── EXPLORE GRID (Square) ──────────────── */
        .explore-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px;
        }
        @media (min-width: 640px) {
            .explore-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 12px;
            }
        }
        .explore-card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: #111;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            opacity: 0;
            transform: scale(.97);
            transition: opacity .35s ease, transform .35s ease;
        }
        .explore-card.loaded {
            opacity: 1;
            transform: scale(1);
        }
        .explore-card:active {
            transform: scale(.97);
            transition: transform .15s;
        }
        .explore-card-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .explore-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, .85));
            padding: 32px 9px 10px;
        }
        .explore-card-title {
            font-size: .78rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .explore-card-meta {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .explore-card-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, .55);
            flex-shrink: 0;
            background: #374151;
        }
        .explore-card-author {
            font-size: .68rem;
            font-weight: 600;
            color: rgba(255, 255, 255, .85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .explore-card-views {
            font-size: .65rem;
            color: rgba(255, 255, 255, .65);
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .explore-card-category {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(124, 58, 237, .9);
            color: #fff;
            font-size: .58rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        .explore-card-video-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, .65);
            color: #fff;
            font-size: .6rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 3px;
            backdrop-filter: blur(4px);
        }
        .explore-card-no-media {
            width: 100%;
            height: 100%;
            background: #1F2937;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .explore-card-no-media-text {
            font-size: .7rem;
            font-weight: 700;
            color: rgba(255, 255, 255, .25);
            text-align: center;
            padding: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .explore-skeleton-card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: #1a1a1a;
        }
        .explore-skeleton-thumb {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #1f1f1f 25%, #2a2a2a 50%, #1f1f1f 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }

        /* ──────────────── MARKET GRID ──────────────── */
        .market-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 8px 0;
        }
        @media (min-width: 640px) {
            .market-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 12px;
            }
        }
        .market-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
            border: 1px solid #F3F4F6;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
            transition: transform .18s ease;
            animation: feedFadeIn .35s ease-out;
        }
        .market-card:active {
            transform: scale(.97);
        }
        .market-card-image-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            background: #F9FAFB;
        }
        .market-card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .market-card-no-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F3F4F6;
            color: #D1D5DB;
        }
        .market-card-price-tag {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, .78);
            color: #fff;
            font-weight: 700;
            font-size: .8rem;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .market-card-body {
            padding: 10px 12px 12px;
        }
        .market-card-title {
            font-size: .82rem;
            font-weight: 600;
            color: #111827;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .market-card-location {
            font-size: .68rem;
            color: #9CA3AF;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .market-card-seller-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #F3F4F6;
        }
        .market-card-seller-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .market-card-seller-name {
            font-size: .68rem;
            color: #6B7280;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .market-card-category-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(124, 58, 237, .9);
            color: #fff;
            font-size: .55rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            letter-spacing: .04em;
            text-transform: uppercase;
            z-index: 2;
        }
        .market-skeleton-card {
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            border: 1px solid #F3F4F6;
        }
        .market-skeleton-image {
            width: 100%;
            aspect-ratio: 1/1;
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }
        .market-skeleton-body {
            padding: 10px 12px 12px;
        }
        .market-skeleton-line {
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            margin-bottom: 6px;
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        .skeleton-post {
            padding: 16px 0;
            border-bottom: 1px solid var(--brd);
        }
        .skeleton-line {
            height: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .skeleton-title {
            height: 20px;
            width: 75%;
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .skeleton-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .skeleton-image {
            width: 100%;
            height: 180px;
            border-radius: 0;
            margin: 10px 0;
        }
        .skeleton-reactions {
            height: 24px;
            width: 220px;
            border-radius: 20px;
            margin-top: 12px;
        }
        @keyframes feedFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle-filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: .72rem;
            font-weight: 700;
            cursor: pointer;
            border: 1.5px solid var(--brd);
            background: var(--bg3);
            color: var(--muted);
            transition: all .15s;
            white-space: nowrap;
        }
        .subtitle-filter-btn:hover,
        .subtitle-filter-btn.active {
            background: #F5F3FF;
            border-color: #7C3AED;
            color: #7C3AED;
        }

        /* ──────────────── COMMENTS ──────────────── */
        .comment-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
        }
        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #E5E7EB;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .85rem;
            color: #6B7280;
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
        }
        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .comment-body {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .comment-username {
            font-size: .88rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
        }
        .comment-text {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: .92rem;
            color: var(--text);
            font-weight: 400;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .comment-text.collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .comment-show-more {
            font-size: .78rem;
            color: #7C3AED;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            padding: 2px 0 0 0;
            display: block;
        }
        .comment-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .comment-time {
            font-size: .75rem;
            color: #9CA3AF;
        }
        .comment-reply-btn {
            font-size: .75rem;
            color: #6B7280;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .comment-reply-btn:hover {
            color: #7C3AED;
        }
        .comment-like-btn {
            font-size: .75rem;
            color: #9CA3AF;
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .comment-like-btn.liked {
            color: var(--heart-red);
        }
        .comment-like-btn svg {
            width: 14px;
            height: 14px;
        }
        .replies-thread {
            border-left: 2px solid #E5E7EB;
            margin-left: 18px;
            padding-left: 0;
            box-sizing: border-box;
            width: calc(100% - 18px);
        }
        .reply-item {
            display: flex;
            gap: 8px;
            padding: 8px 0 8px 14px;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
        }
        .reply-avatar-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #E5E7EB;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .6rem;
            color: #6B7280;
            margin-left: -10px;
            border: 2px solid #fff;
            z-index: 2;
            overflow: hidden;
            cursor: pointer;
        }
        .reply-avatar-dot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .reply-body {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .reply-username {
            font-size: .82rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 1px;
        }
        .reply-text {
            white-space: pre-wrap;
            line-height: 1.45;
            font-size: .88rem;
            color: var(--text);
            font-weight: 400;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .reply-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .reply-time {
            font-size: .7rem;
            color: #9CA3AF;
        }
        .reply-reply-btn {
            font-size: .7rem;
            color: #6B7280;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .reply-like-btn {
            font-size: .7rem;
            color: #9CA3AF;
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .reply-like-btn.liked {
            color: var(--heart-red);
        }
        .reply-like-btn svg {
            width: 14px;
            height: 14px;
        }
        .view-replies-btn,
        .hide-replies-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: .78rem;
            color: #7C3AED;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            margin-top: 4px;
        }
        .view-replies-btn {
            margin-left: 46px;
        }
        .hide-replies-btn {
            margin-left: 18px;
            padding-left: 14px;
            color: #6B7280;
        }

        .comment-skeleton {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            align-items: flex-start;
        }
        .comment-skeleton .skeleton-avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            flex-shrink: 0;
        }
        .comment-skeleton .skeleton-line-sm {
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            margin-bottom: 6px;
        }
        .comment-skeleton .skeleton-line-sm.w70 {
            width: 70%;
        }
        .comment-skeleton .skeleton-line-sm.w50 {
            width: 50%;
        }
        .comment-skeleton .skeleton-line-sm.w90 {
            width: 90%;
        }

        /* ──────────────── GLOBAL COMMENT BAR ──────────────── */
        #global-comment-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg2);
            border-top: 1px solid var(--brd);
            z-index: 45;
            padding: 8px 14px;
            padding-bottom: max(8px, var(--safe-bottom));
            transform: translateY(100%);
            transition: transform .3s cubic-bezier(.4, 0, .2, 1), bottom .15s ease;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, .06);
        }
        #global-comment-bar.visible {
            transform: translateY(0);
        }
        #reply-context-banner {
            display: none;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-size: .8rem;
            color: var(--muted);
            padding: 4px 0;
        }
        #reply-context-banner.show {
            display: flex;
        }
        #reply-context-username {
            font-weight: 700;
            color: #7C3AED;
        }
        #reply-cancel-btn {
            margin-left: auto;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
            color: #9CA3AF;
            padding: 2px 6px;
            border-radius: 4px;
            line-height: 1;
        }
        .global-comment-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .global-comment-row textarea {
            flex: 1;
            min-width: 0;
            border: 1.5px solid var(--brd);
            border-radius: 20px;
            padding: 9px 14px;
            font-size: .9rem;
            resize: none;
            outline: none;
            font-family: inherit;
            background: var(--inp);
            line-height: 1.45;
            transition: .2s;
            min-height: 40px;
            max-height: 100px;
            box-sizing: border-box;
            height: 40px;
            color: var(--text);
        }
        .global-comment-row textarea:focus {
            border-color: #7C3AED;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, .07);
            background: var(--bg);
        }
        .global-comment-row button {
            background: #7C3AED;
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 9px 18px;
            font-size: .85rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
            align-self: flex-end;
        }
        .global-comment-row button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* ──────────────── LIGHTBOX ──────────────── */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .92);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .lightbox-modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        .lightbox-modal img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 8px;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* ──────────────── EXPLORE FULLSCREEN ──────────────── */
        .explore-fullscreen,
        .market-fullscreen,
        .market-filter-modal {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform .35s cubic-bezier(.4, 0, .2, 1);
            padding-top: var(--safe-top);
        }
        .explore-fullscreen {
            z-index: 80;
            overflow: hidden !important;
        }
        .market-fullscreen {
            z-index: 85;
        }
        .market-filter-modal {
            z-index: 86;
        }
        .explore-fullscreen.open,
        .market-fullscreen.open,
        .market-filter-modal.open {
            transform: translateY(0);
        }
        .explore-fullscreen-header,
        .market-fullscreen-header,
        .market-filter-header {
            position: relative;
            z-index: 10;
            background: var(--bg2);
            border-bottom: 1px solid var(--brd);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .explore-fullscreen-header {
            justify-content: space-between;
        }
        .explore-fullscreen-header .explore-category-name {
            font-weight: 600;
            font-size: .85rem;
            color: var(--muted);
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
        }
        #explore-fullscreen-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }
        .market-fullscreen-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .market-filter-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .category-group-header {
            font-weight: 700;
            font-size: .72rem;
            color: #7C3AED;
            text-transform: uppercase;
            letter-spacing: .06em;
            padding: 12px 4px 6px;
        }
        .category-option {
            width: 100%;
            text-align: left;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: .9rem;
            cursor: pointer;
            transition: .12s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .category-option:hover {
            background: var(--bg4);
        }
        .category-option.selected {
            background: var(--pdim);
            color: var(--p);
            font-weight: 700;
        }
        .category-option.selected::after {
            content: '✓';
            color: var(--p);
            font-weight: 700;
        }

        /* ──────────────── MARKET FULLSCREEN SLIDER ──────────────── */
        .market-fs-slider {
            position: relative;
            width: 100%;
            background: #000;
            overflow: hidden;
        }
        .market-fs-track {
            display: flex;
            transition: transform .3s ease;
            will-change: transform;
        }
        .market-fs-track img {
            flex: 0 0 100%;
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            display: block;
        }
        .market-fs-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 3;
        }
        .market-fs-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .45);
            transition: .2s;
        }
        .market-fs-dot.active {
            background: #fff;
            width: 16px;
            border-radius: 3px;
        }
        .market-fs-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, .45);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            color: #fff;
        }
        .market-fs-arrow.left {
            left: 8px;
        }
        .market-fs-arrow.right {
            right: 8px;
        }

        /* ──────────────── SHARE MODAL ──────────────── */
        #share-modal {
            position: fixed;
            inset: 0;
            z-index: 120;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
            padding: 20px;
        }
        #share-modal.open {
            opacity: 1;
            pointer-events: auto;
        }
        #share-modal .share-sheet {
            background: var(--bg2);
            border-radius: 24px 24px 0 0;
            max-width: 480px;
            width: 100%;
            padding: 20px 24px 32px;
            transform: translateY(30px) scale(0.96);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.15);
            max-height: 80vh;
            overflow-y: auto;
        }
        #share-modal.open .share-sheet {
            transform: translateY(0) scale(1);
        }
        #share-modal .share-sheet .share-handle {
            width: 40px;
            height: 4px;
            border-radius: 4px;
            background: var(--brd);
            margin: 0 auto 16px;
        }
        #share-modal .share-sheet h3 {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 4px;
            text-align: center;
        }
        #share-modal .share-sheet .share-sub {
            font-size: .82rem;
            color: var(--muted);
            text-align: center;
            margin-bottom: 18px;
        }
        #share-modal .share-sheet .share-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        #share-modal .share-sheet .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 8px;
            border-radius: 14px;
            border: 1.5px solid var(--brd);
            background: var(--bg3);
            cursor: pointer;
            transition: all .15s;
            color: var(--text);
            font-size: .72rem;
            font-weight: 600;
        }
        #share-modal .share-sheet .share-option:hover {
            background: var(--pdim);
            border-color: var(--p);
            color: var(--p);
            transform: scale(1.02);
        }
        #share-modal .share-sheet .share-option svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }
        #share-modal .share-sheet .share-option.share-profile svg {
            stroke: #7C3AED;
        }
        #share-modal .share-sheet .share-option.share-copy svg {
            stroke: #3B82F6;
        }
        #share-modal .share-sheet .share-option.share-native svg {
            stroke: #10B981;
        }
        #share-modal .share-sheet .share-option.share-more svg {
            stroke: #F59E0B;
        }
        #share-modal .share-sheet .share-close-btn {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--brd);
            background: var(--bg3);
            color: var(--muted);
            font-weight: 600;
            font-size: .9rem;
            cursor: pointer;
            transition: .15s;
        }
        #share-modal .share-sheet .share-close-btn:hover {
            background: var(--bg4);
        }

        /* ──────────────── MISC ──────────────── */
        .single-post-container {
            padding-bottom: 100px;
        }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid var(--brd);
            border-top-color: #7C3AED;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #toast {
            transition: all .3s cubic-bezier(.68, -.55, .265, 1.55);
        }

        /* ──────────────── RESPONSIVE TWEAKS ──────────────── */
        @media (max-width: 640px) {
            .top-header .brand {
                font-size: 1.05rem;
            }
            .top-header .header-actions .msg-btn {

        (function() {

            // ───────────────────────────────────────────────────────────────

            // We will replace the localStorage-based data with Supabase

            const BK = 'freeupper_bookmarks';

            // But in your actual file, you must paste them exactly as they were.

            // ───────────────────────────────────────────────────────────────
            // REPLACED: data loading functions use Supabase
            // ───────────────────────────────────────────────────────────────

            let allPosts = []; // will hold posts from Supabase
            let appData = {
                posts: [],
                userReactions: {},
                // ... other fields
            };

            // ── NEW: load posts from Supabase ──
            async function reloadPostsFromSupabase() {
                try {
                    const posts = await window.PostsAPI.loadAllPosts();
                    allPosts = posts;
                    // Sync appData for UI helpers that expect it
                    appData.posts = posts;
                    appData.userReactions = {};
                    posts.forEach(p => {
                        if (p.likedByMe) appData.userReactions[p.id + '-like'] = true;
                    });
                    return posts;
                } catch (err) {
                    console.error('Failed to load posts:', err);
                    showToast('Failed to load feed', 'r');
                    return [];
                }
            }

            // ── Replace the old reloadData() with this ──
            function reloadData() {
                return reloadPostsFromSupabase();
            }

            // ── Replace the old appData.posts access with allPosts ──
            function getFilteredSortedPosts() {
                const allUsers = getAllUsers(),
                    currentUser = getCurrentUser();
                let p = [...allPosts]; // use Supabase posts
                p = p.filter(post => {
                    if (post.authorId === currentUser.id) return true;
                    const author = allUsers.find(u => u.id === post.authorId);
                    return !author || !author.isPrivate;
                });
                // ... rest of filter/sort logic identical
                return p;
            }

            // ── Replace addComment with Supabase version ──
            async function addComment(postId, parentId, message) {
                try {
                    const comment = await window.PostsAPI.addComment(postId, parentId, message);
                    // Update local cache
                    const post = allPosts.find(p => p.id === postId);
                    if (post) {
                        if (!post.comments) post.comments = [];
                        post.comments.push(comment);
                        post.commentCount = (post.commentCount || 0) + 1;
                        appData.posts = allPosts;
                    }
                    return comment;
                } catch (err) {
