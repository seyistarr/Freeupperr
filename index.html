    <!-- ═══════════════════ SCRIPTS ═══════════════════ -->
    <script src="global.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        (function() {
            'use strict';

            // ───────────────────────────────────────────────────────────────
            // DATA LAYER - ALL SUPABASE
            // ───────────────────────────────────────────────────────────────

            const CVK = 'freeupper_comments_visible';
            const UCK = 'freeupper_user_categories';
            const REPLY_BATCH = 3,
                PAGE_SIZE = 5;
            const INITIAL_COMMENT_DISPLAY = 3;
            const COMMENT_LOAD_MORE = 5;

            // ── Global state ──
            let allPosts = [];
            let appData = {
                posts: [],
                userReactions: {},
                marketItems: [],
                nextMarketId: 1
            };

            // ── Caches for follows, bookmarks, shares (Supabase sets) ──
            let followingSet = new Set();
            let bookmarksSet = new Set();
            let sharesSet = new Set();

            // ── DOM refs ──
            const content = document.getElementById('user-content');
            const toastEl = document.getElementById('toast');

            // ───────────────────────────────────────────────────────────────
            // HELPERS
            // ───────────────────────────────────────────────────────────────

            function getCurrentUser() {
                if (window.AuthUser && window.AuthUser.getCurrentUser) {
                    return window.AuthUser.getCurrentUser();
                }
                if (typeof window.getCurrentUser === 'function') {
                    return window.getCurrentUser();
                }
                return { id: 'guest', isLoggedIn: false, displayName: 'Guest', avatar: '' };
            }

            // We no longer use getAllUsers() – profile is joined in posts.
            // getAllUsers is removed.

            function updateNavAvatar() {
                const u = getCurrentUser();
                ['navAv', 'sideAv'].forEach(id => { const el = document.getElementById(id); if (el) el.src = u
                        .avatar || ''; });
            }

            function escapeHtml(s) { const d = document.createElement('div');
                d.textContent = s || '';
                return d.innerHTML; }

            function linkifyContent(t) {
                const r = /(https?:\/\/[^\s<>"{}|\\^`\[\]]+)/g;
                return escapeHtml(t).replace(r, u =>
                    `<a href="javascript:void(0)" class="text-primary underline font-medium break-all" data-extlink="${encodeURIComponent(u)}">${u}</a>`
                    );
            }

            function formatCount(n) { if (!n) return '0'; if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/,
                    '') + 'B'; if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'; if (n >= 1e3)
                    return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K'; return String(n); }

            function formatPrice(a) { return a.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

            function formatRelativeTime(iso) {
                const now = Date.now(),
                    then = new Date(iso).getTime(),
                    diff = Math.floor((now - then) / 1000);
                if (diff < 60) return 'Just now';
                if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                if (diff < 172800) return 'Yesterday';
                if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
                return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric',
                year: 'numeric' });
            }

            // ───────────────────────────────────────────────────────────────
            // ICONS
            // ───────────────────────────────────────────────────────────────

            function svgClock() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'; }

            function svgEye() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V10"/><path d="M12 19V5"/><path d="M20 19V14"/></svg>'; }

            function svgComment() {
                return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
            }

            function svgShare() {
                return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4z"/></svg>';
            }

            function svgChevronDown() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>'; }

            function svgChevronUp() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>'; }

            function svgFilter() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>'; }

            function svgLocation() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'; }

            function svgHeart(reacted) {
                return reacted ?
                    '<svg class="heart-icon" viewBox="0 0 24 24" fill="#DC2626" stroke="#DC2626" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' :
                    '<svg class="heart-icon" viewBox="0 0 24 24" fill="#FFFFFF" stroke="currentColor" stroke-width="1.7"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
            }

            function bookmarkIcon(filled) { const color = filled ? 'var(--gold)' : 'none'; return `<svg width="19" height="19" viewBox="0 0 24 24" fill="${color}" stroke="var(--gold)" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`; }

            // ───────────────────────────────────────────────────────────────
            // YOUTUBE PLAYER
            // ───────────────────────────────────────────────────────────────
            let ytState = {};
            let ytInfo = {};
            let ytWindows = {};

            function ytPostMessage(idx, func, args = []) {
                const iframe = document.getElementById('yt-' + idx);
                if (!iframe || !iframe.contentWindow) return;
                iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args }),
                    '*');
            }

            function updateYtProgressUI(idx, currentTime, duration) {
                if (!duration) return;
                const pct = (currentTime / duration) * 100;
                const fill = document.getElementById('ytProgFill-' + idx);
                const thumb = document.getElementById('ytProgThumb-' + idx);
                if (fill) fill.style.width = pct + '%';
                if (thumb) thumb.style.setProperty('--pct', pct + '%');
            }

            function _updateMuteBadge(idx) {
                const badge = document.getElementById('ytMuteBadge-' + idx);
                const ico = document.getElementById('ytMuteIco-' + idx);
                if (!badge || !ico) return;
                const state = ytState[idx] || { muted: true };
                if (state.muted) {
                    ico.innerHTML =
                        '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
                    badge.style.opacity = '.95';
                } else {
                    ico.innerHTML =
                        '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
                    badge.style.opacity = '.6';
                }
            }

            function _showYtPauseIcon(idx, isPlaying) {
                const icon = document.getElementById('ytPauseIcon-' + idx);
                if (!icon) return;
                icon.querySelector('svg').innerHTML = isPlaying ?
                    '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' :
                    '<polygon points="5 3 19 12 5 21 5 3"/>';
                icon.classList.remove('hide');
                icon.classList.add('show');
                setTimeout(() => {
                    icon.classList.remove('show');
                    icon.classList.add('hide');
                    setTimeout(() => icon.classList.remove('hide'), 200);
                }, 700);
            }

            function toggleYtControls(idx) {
                if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
                const state = ytState[idx];

                if (state.muted) {
                    ytPostMessage(idx, 'unMute');
                    state.muted = false;
                    showToast('Sound on 🔊');
                    _updateMuteBadge(idx);
                    return;
                }

                if (state.playing) {
                    ytPostMessage(idx, 'pauseVideo');
                    state.playing = false;
                    _showYtPauseIcon(idx, false);
                } else {
                    ytPostMessage(idx, 'playVideo');
                    state.playing = true;
                    _showYtPauseIcon(idx, true);
                }
            }

            function initYtListener(idx) {
                const iframe = document.getElementById('yt-' + idx);
                if (!iframe || !iframe.contentWindow) return;
                ytWindows[idx] = iframe.contentWindow;
                iframe.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'yt-' + idx }), '*');
            }

            function seekYoutube(e, idx) {
                const prog = document.getElementById('ytProg-' + idx);
                if (!prog) return;
                const rect = prog.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                const info = ytInfo[idx];
                if (!info || !info.duration) return;
                const time = pct * info.duration;
                ytPostMessage(idx, 'seekTo', [time, true]);
                updateYtProgressUI(idx, time, info.duration);
            }

            window.toggleYtControls = toggleYtControls;
            window.initYtListener = initYtListener;
            window.seekYoutube = seekYoutube;

            // ───────────────────────────────────────────────────────────────
            // PLYR SETUP
            // ───────────────────────────────────────────────────────────────
            function setupPlyrPlayer(videoElement) {
                if (videoElement.plyr) return;
                videoElement.setAttribute('playsinline', '');
                videoElement.setAttribute('webkit-playsinline', 'true');
                videoElement.removeAttribute('controls');
                const player = new Plyr(videoElement, {
                    controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                    fullscreen: { enabled: true, fallback: true, iosNative: false },
                    settings: ['quality', 'speed'],
                    quality: { default: 'auto', options: ['1080p', '720p', '480p', '360p'] }
                });
                videoElement.plyr = player;
                return player;
            }

            // ───────────────────────────────────────────────────────────────
            // MEDIA HELPERS (supports both new `media` array and old `mediaUrl`)
            // ───────────────────────────────────────────────────────────────
            function isYouTubeUrl(url) {
                if (!url) return false;
                return url.includes('youtube.com/embed') || url.includes('youtu.be') || url.includes(
                    'youtube.com/watch');
            }

            function extractYouTubeId(url) {
                const match = url.match(/(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/) ||
                    url.match(/(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/) ||
                    url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
                return match ? match[1] : null;
            }

            function getMediaItems(post) {
                if (post.media && Array.isArray(post.media) && post.media.length > 0) {
                    return post.media;
                }
                if (post.mediaUrl) {
                    return [{ url: post.mediaUrl, type: post.mediaType || 'image' }];
                }
                return [];
            }

            // ───────────────────────────────────────────────────────────────
            // BUILD MEDIA HTML — FULL WIDTH, NO BORDER RADIUS
            // ───────────────────────────────────────────────────────────────
            function buildMediaHTML(p, postIndex) {
                const mediaItems = getMediaItems(p);
                if (!mediaItems || mediaItems.length === 0) return '';

                if (mediaItems.length === 1) {
                    const item = mediaItems[0];
                    const isVideo = item.type === 'video' || (item.url && isYouTubeUrl(item.url));
                    if (isVideo) {
                        if (isYouTubeUrl(item.url)) {
                            const ytId = extractYouTubeId(item.url);
                            if (!ytId) return '';
                            const idx = postIndex;
                            return `
                        <div class="ig-video-wrap">
                          <div class="yt-wrap">
                            <iframe id="yt-${idx}" src="https://www.youtube.com/embed/${ytId}?autoplay=0&loop=0&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}" allow="autoplay; encrypted-media" allowfullscreen onload="initYtListener('${idx}')"></iframe>
                            <div class="yt-tap" id="ytTap-${idx}" onclick="toggleYtControls('${idx}')"></div>
                            <div class="yt-mute-badge" id="ytMuteBadge-${idx}">
                              <svg id="ytMuteIco-${idx}" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                            </div>
                            <div class="yt-pause-icon" id="ytPauseIcon-${idx}">
                              <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                            </div>
                            <div class="yt-progress" id="ytProg-${idx}" onclick="seekYoutube(event, '${idx}')">
                              <div class="yt-progress-fill" id="ytProgFill-${idx}"></div>
                              <div class="yt-progress-thumb" id="ytProgThumb-${idx}"></div>
                            </div>
                          </div>
                        </div>
                      `;
                        } else {
                            return `<div class="ig-video-wrap" data-full-img="${item.url}">
                        <video src="${item.url}" playsinline webkit-playsinline="true" muted preload="metadata"></video>
                      </div>`;
                        }
                    } else {
                        return `<div class="ig-media-container" data-full-img="${item.url}">
                        <img src="${item.url}" class="fade-in-image" loading="lazy" onload="this.classList.add('loaded')" />
                      </div>`;
                    }
                }

                return buildCarousel(mediaItems, postIndex);
            }

            // ───────────────────────────────────────────────────────────────
            // CAROUSEL (multiple images)
            // ───────────────────────────────────────────────────────────────
            function buildCarousel(mediaItems, postIndex) {
                const items = mediaItems.filter(m => m.url).slice(0, 5);
                if (items.length === 0) return '';
                const carouselId = 'carousel-' + postIndex;

                let slidesHtml = items.map((item, idx) => {
                    const isVideo = item.type === 'video' || (item.url && isYouTubeUrl(item.url));
                    let contentHtml = '';

                    if (isVideo && isYouTubeUrl(item.url)) {
                        const ytId = extractYouTubeId(item.url);
                        if (ytId) {
                            contentHtml = `
                        <div class="yt-wrap">
                          <iframe id="yt-${carouselId}-${idx}" src="https://www.youtube.com/embed/${ytId}?autoplay=0&loop=0&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}" allow="autoplay; encrypted-media" allowfullscreen onload="initYtListener('${carouselId}-${idx}')"></iframe>
                          <div class="yt-tap" onclick="toggleYtControls('${carouselId}-${idx}')"></div>
                          <div class="yt-mute-badge" id="ytMuteBadge-${carouselId}-${idx}">
                            <svg id="ytMuteIco-${carouselId}-${idx}" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                          </div>
                          <div class="yt-pause-icon" id="ytPauseIcon-${carouselId}-${idx}">
                            <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                          </div>
                          <div class="yt-progress" id="ytProg-${carouselId}-${idx}" onclick="seekYoutube(event, '${carouselId}-${idx}')">
                            <div class="yt-progress-fill" id="ytProgFill-${carouselId}-${idx}"></div>
                          </div>
                        </div>
                      `;
                        } else {
                            contentHtml =
                                `<video src="${item.url}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain;background:#000;"></video>`;
                        }
                    } else if (isVideo) {
                        contentHtml =
                            `<video src="${item.url}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain;background:#000;"></video>`;
                    } else {
                        contentHtml =
                            `<img src="${item.url}" class="fade-in-image" loading="lazy" onload="this.classList.add('loaded')" style="width:100%;height:100%;object-fit:contain;background:#000;" />`;
                    }

                    return `<div class="media-carousel-slide" data-slide="${idx}">${contentHtml}</div>`;
                }).join('');

                let dotsHtml = '';
                if (items.length > 1) {
                    dotsHtml = `<div class="carousel-dots">${items.map((_, i) => 
                        `<div class="carousel-dot ${i === 0 ? 'active' : ''}" data-slide="${i}"></div>`
                    ).join('')}</div>`;
                }

                let arrowsHtml = '';
                if (items.length > 1) {
                    arrowsHtml = `
                    <button class="carousel-arrow left" data-carousel="${carouselId}" data-dir="-1">
                      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <button class="carousel-arrow right" data-carousel="${carouselId}" data-dir="1">
                      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                  `;
                }

                return `
                <div class="media-carousel" id="${carouselId}" data-slides="${items.length}" data-current="0">
                  <div class="media-carousel-track">${slidesHtml}</div>
                  ${dotsHtml}
                  ${arrowsHtml}
                </div>
              `;
            }

            function initCarousel(carouselEl) {
                if (!carouselEl) return;
                const carouselId = carouselEl.id;
                const track = carouselEl.querySelector('.media-carousel-track');
                const slides = carouselEl.querySelectorAll('.media-carousel-slide');
                const dots = carouselEl.querySelectorAll('.carousel-dot');
                const leftArrow = carouselEl.querySelector('.carousel-arrow.left');
                const rightArrow = carouselEl.querySelector('.carousel-arrow.right');

                if (slides.length <= 1) return;

                let current = 0;
                const total = slides.length;
                let autoTimer = null;
                let arrowTimeout = null;

                function goToSlide(idx) {
                    current = (idx + total) % total;
                    track.style.transform = `translateX(-${current * 100}%)`;
                    dots.forEach((d, i) => d.classList.toggle('active', i === current));
                    resetAutoTimer();
                }

                function nextSlide() { goToSlide(current + 1); }

                function resetAutoTimer() {
                    if (autoTimer) { clearInterval(autoTimer);
                        autoTimer = null; }
                    autoTimer = setInterval(nextSlide, 3000);
                }

                dots.forEach((dot, i) => {
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goToSlide(i);
                        showArrowsTemporarily();
                    });
                });

                if (leftArrow) {
                    leftArrow.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goToSlide(current - 1);
                        showArrowsTemporarily();
                    });
                }
                if (rightArrow) {
                    rightArrow.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goToSlide(current + 1);
                        showArrowsTemporarily();
                    });
                }

                function showArrowsTemporarily() {
                    if (leftArrow) leftArrow.classList.remove('hidden');
                    if (rightArrow) rightArrow.classList.remove('hidden');
                    if (arrowTimeout) clearTimeout(arrowTimeout);
                    arrowTimeout = setTimeout(() => {
                        if (leftArrow) leftArrow.classList.add('hidden');
                        if (rightArrow) rightArrow.classList.add('hidden');
                    }, 3000);
                }

                setTimeout(showArrowsTemporarily, 500);

                let startX = 0;
                let isDragging = false;
                carouselEl.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    isDragging = true;
                }, { passive: true });
                carouselEl.addEventListener('touchend', (e) => {
                    if (!isDragging) return;
                    isDragging = false;
                    const endX = e.changedTouches[0].clientX;
                    const diff = startX - endX;
                    if (Math.abs(diff) > 30) {
                        if (diff > 0) goToSlide(current + 1);
                        else goToSlide(current - 1);
                        showArrowsTemporarily();
                    }
                }, { passive: true });

                resetAutoTimer();

                carouselEl._cleanup = function() {
                    if (autoTimer) clearInterval(autoTimer);
                    if (arrowTimeout) clearTimeout(arrowTimeout);
                };
            }

            function initAllCarousels(scope) {
                const root = scope || document;
                root.querySelectorAll('.media-carousel').forEach(el => {
                    if (el._inited) return;
                    el._inited = true;
                    initCarousel(el);
                });
            }

            // ───────────────────────────────────────────────────────────────
            // VIDEO AUTO-PLAY (scoped)
            // ───────────────────────────────────────────────────────────────
            let videoObserver = null;
            let currentlyPlayingVideo = null;

            function pauseAllVideos() {
                document.querySelectorAll('video').forEach(vid => {
                    if (vid.plyr) { vid.plyr.pause(); } else { vid.pause(); }
                });
                document.querySelectorAll('iframe').forEach(iframe => {
                    if (iframe.src && iframe.src.includes('youtube.com/embed')) {
                        const idx = iframe.id.replace('yt-', '');
                        if (ytState[idx] && ytState[idx].playing) {
                            ytPostMessage(idx, 'pauseVideo');
                            ytState[idx].playing = false;
                            _showYtPauseIcon(idx, false);
                        }
                    }
                });
                currentlyPlayingVideo = null;
            }

            function setupVideoAutoplay(scope) {
                if (videoObserver) videoObserver.disconnect();
                const searchRoot = scope || document;
                const videoElements = searchRoot.querySelectorAll('.ig-video-wrap video, .video-container video, .media-carousel-slide video');

                videoObserver = new IntersectionObserver((entries) => {
                    let visibleVideo = null;
                    for (const entry of entries) {
                        if (entry.isIntersecting && entry.intersectionRatio >= 0.75) {
                            visibleVideo = entry.target;
                            break;
                        }
                    }

                    searchRoot.querySelectorAll('.ig-video-wrap video, .video-container video, .media-carousel-slide video').forEach(vid => {
                        if (vid === visibleVideo) return;
                        if (vid.plyr) { vid.plyr.pause(); } else { vid.pause(); }
                        if (currentlyPlayingVideo === vid) currentlyPlayingVideo = null;
                    });

                    searchRoot.querySelectorAll('.ig-video-wrap iframe, .media-carousel-slide iframe').forEach(iframe => {
                        const idx = iframe.id.replace('yt-', '');
                        if (ytState[idx] && ytState[idx].playing) {
                            ytPostMessage(idx, 'pauseVideo');
                            ytState[idx].playing = false;
                            _showYtPauseIcon(idx, false);
                            if (currentlyPlayingVideo === idx) currentlyPlayingVideo = null;
                        }
                    });

                    if (visibleVideo) {
                        if (visibleVideo.plyr) {
                            if (currentlyPlayingVideo !== visibleVideo) {
                                visibleVideo.plyr.play().catch(() => {});
                                currentlyPlayingVideo = visibleVideo;
                            }
                        } else {
                            if (currentlyPlayingVideo !== visibleVideo) {
                                visibleVideo.play().catch(() => {});
                                currentlyPlayingVideo = visibleVideo;
                            }
                        }
                    }
                }, { threshold: 0.75, rootMargin: '0px 0px -20px 0px' });

                videoElements.forEach(vid => videoObserver.observe(vid));
            }

            function pauseHomepageVideos() { pauseAllVideos(); }

            // ───────────────────────────────────────────────────────────────
            // FOLLOW, BOOKMARK, SHARE – Supabase
            // ───────────────────────────────────────────────────────────────

            async function loadFollows() {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { followingSet = new Set(); return; }
                try {
                    const { data, error } = await window.sb.from('follows').select('following_id').eq('follower_id', user
                        .id);
                    if (!error) followingSet = new Set(data.map(f => f.following_id));
                } catch (e) { console.warn('loadFollows error:', e); }
            }

            async function loadBookmarks() {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { bookmarksSet = new Set(); return; }
                try {
                    const { data, error } = await window.sb.from('bookmarks').select('post_id').eq('user_id', user.id);
                    if (!error) bookmarksSet = new Set(data.map(b => b.post_id));
                } catch (e) { console.warn('loadBookmarks error:', e); }
            }

            async function loadShares() {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { sharesSet = new Set(); return; }
                try {
                    const { data, error } = await window.sb.from('shares').select('post_id').eq('user_id', user.id);
                    if (!error) sharesSet = new Set(data.map(s => s.post_id));
                } catch (e) { console.warn('loadShares error:', e); }
            }

            function isFollowing(userId) { return followingSet.has(userId); }

            async function toggleFollowUser(userId) {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { showToast('Please sign in to follow', 'o'); return false; }
                const currently = isFollowing(userId);
                try {
                    if (currently) {
                        await window.sb.from('follows').delete().eq('follower_id', user.id).eq('following_id', userId);
                        followingSet.delete(userId);
                    } else {
                        await window.sb.from('follows').insert({ follower_id: user.id, following_id: userId });
                        followingSet.add(userId);
                    }
                    return !currently;
                } catch (err) {
                    showToast(err.message, 'r');
                    return currently;
                }
            }

            function isBookmarked(postId) { return bookmarksSet.has(postId); }

            async function toggleBookmark(postId) {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { showToast('Please sign in to bookmark', 'o'); return false; }
                const currently = isBookmarked(postId);
                try {
                    if (currently) {
                        await window.sb.from('bookmarks').delete().eq('user_id', user.id).eq('post_id', postId);
                        bookmarksSet.delete(postId);

                        await window.sb.from('bookmarks').insert({ user_id: user.id, post_id: postId });

                    showToast(err.message, 'r');

            }

                        sharesSet.delete(postId);

            // ───────────────────────────────────────────────────────────────
            // REACTIONS (toggle like) – Supabase
            // ───────────────────────────────────────────────────────────────

            async function toggleReaction(postId) {
                const post = appData.posts.find(p => p.id === postId);
                if (!post) return;

                document.querySelectorAll(`[data-post-id="${postId}"] .reaction-btn, [data-post-reactions="${postId}"] .reaction-btn`)
                    .forEach(btn => {
                        btn.classList.add('bounce-heart');
                        setTimeout(() => btn.classList.remove('bounce-heart'), 500);
                    });

                if (window.AuthUser && window.AuthUser.requireAuth) {
                    window.AuthUser.requireAuth(async () => {
                        try {
                            const { liked, count } = await window.PostsAPI.toggleLike(postId);
                            post.likedByMe = liked;
                            post.reactions.like = count;
                            appData.userReactions[postId + '-like'] = liked;
                            updateReactionsUI(postId);
                        } catch (err) {
                            showToast(err.message, 'r');
                        }
                    });
                } else {
                    showToast('Please sign in to like', 'o');
                }
            }

            function updateReactionsUI(postId) {
                const post = appData.posts.find(p => p.id === postId);
                if (!post) return;
                const reacted = !!post.likedByMe;
                document.querySelectorAll(`[data-post-reactions="${postId}"] .reaction-btn, [data-post-id="${postId}"] .reaction-btn`)
                    .forEach(btn => {
                        btn.classList.toggle('reacted', reacted);
                        const icon = btn.querySelector('.heart-icon-wrap');
                        if (icon) icon.innerHTML = svgHeart(reacted);
                        const cnt = btn.querySelector('.reaction-count');
                        if (cnt) cnt.textContent = formatCount(post.reactions.like || 0);
                    });
                document.querySelectorAll(`#comments-list .reaction-btn`).forEach(btn => {
                    const pid = btn.closest('[data-post-reactions]')?.dataset.postReactions;
                    if (pid == postId) {
                        btn.classList.toggle('reacted', reacted);
                        const icon = btn.querySelector('.heart-icon-wrap');
                        if (icon) icon.innerHTML = svgHeart(reacted);
                        const cnt = btn.querySelector('.reaction-count');
                        if (cnt) cnt.textContent = formatCount(post.reactions.like || 0);
                    }
                });
            }

            function buildReactionButton(postId) {
                const post = appData.posts.find(p => p.id === postId);
                const count = post ? post.reactions.like || 0 : 0;
                const reacted = post ? !!post.likedByMe : false;
                return `<button type="button" class="reaction-btn ${reacted?'reacted':''}" data-reaction="like">
                <span class="heart-icon-wrap">${svgHeart(reacted)}</span>
                <span class="reaction-count">${formatCount(count)}</span>
              </button>`;

            // ───────────────────────────────────────────────────────────────
            // BUILD FOLLOW BUTTON
            // ───────────────────────────────────────────────────────────────

            function buildFollowButton(authorId, authorName) {
                const cu = getCurrentUser();
                if (!authorId || authorId === cu.id) return `<span class="follow-btn hidden-follow"></span>`;
                const following = isFollowing(authorId);
                return `<button class="follow-btn ${following?'following':''}" data-user-id="${authorId}" onclick="toggleFollowHandler(event, '${authorId}')">${following?'Following':'Follow'}</button>`;
            }

            window.toggleFollowHandler = async function(e, userId) {
                e.stopPropagation();
                const btn = e.currentTarget;
                const newState = await toggleFollowUser(userId);
                btn.textContent = newState ? 'Following' : 'Follow';
                btn.classList.toggle('following', newState);
                document.querySelectorAll(`.follow-btn[data-user-id="${userId}"]`).forEach(b => {
                    if (b !== btn) {
                        b.textContent = newState ? 'Following' : 'Follow';
                        b.classList.toggle('following', newState);
                    }
                });
                showToast(newState ? 'Following ✓' : 'Unfollowed');
            };

            // ───────────────────────────────────────────────────────────────

            // ───────────────────────────────────────────────────────────────
            // BUILD POST HTML – using post.profile (single source of truth)
            // ───────────────────────────────────────────────────────────────
            function buildPostHTML(p, index) {
                // Use the author helper from global.js (assumes getAuthorFromProfile is available)
                const profile = p.profile || {};
                const author = window.getAuthorFromProfile ? window.getAuthorFromProfile(profile) : {
                    name: 'Anonymous',
                    avatar: '',
                    verified_status: 'none',
                    verified: false
                };
                const da = author.name;
                const aa = author.avatar;
                const verifiedStatus = author.verified_status;
                const isVerified = author.verified;

                const hd = p.description && p.description.trim().length > 0;
                const pt = (p.content || '').substring(0, 250);
                const isLong = (p.content || '').length > 250;
                const th = p.tags && p.tags.length > 0 ?
                    `<div class="flex flex-wrap gap-1 mt-2">${p.tags.map(t=>`<span class="tag-badge" style="display:inline-block;padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:600;background:rgba(124,58,237,.08);color:#7C3AED;">#${escapeHtml(t)}</span>`).join('')}</div>` :

                const mh = buildMediaHTML(p, index);

                return `<article class="feed-post" data-post-id="${p.id}" data-author-id="${author.id}">
                <div class="flex items-start gap-3" style="padding:0 16px;">
                  <img data-author-avatar src="${aa}" class="user-mini-avatar" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;">
                  <div style="min-width:0;flex:1;">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span data-author-name class="font-bold text-sm cursor-pointer hover:underline" style="color:var(--text);">${escapeHtml(da)}</span>
                      <span data-author-badge-wrapper>${badgeHtml}</span>
                      <span class="text-xs" style="color:var(--muted);">· ${formatRelativeTime(p.timestamp || p.date)}</span>
                      ${followBtn}
                      <span class="text-xs text-primary font-semibold uppercase tracking-wide cursor-pointer hover:underline ml-auto flex-shrink-0">${escapeHtml(p.category||'General')}</span>
                    </div>
                    <h3 class="font-heading font-bold text-base mt-0.5 cursor-pointer" style="overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;overflow-wrap:anywhere;color:var(--text);">${escapeHtml(p.title)}</h3>
                    ${hd?`<p class="text-sm mt-1 leading-relaxed" style="white-space:pre-wrap;color:var(--muted);">${escapeHtml(p.description)}</p>`:''}
                    <div class="mt-1" id="post-content-${p.id}">
                      <div class="content-preview preview-text-${p.id}">${linkifyContent(pt)}</div>
                      ${isLong?`<div class="content-text full-text-${p.id} hidden">${linkifyContent(p.content)}</div><button type="button" class="read-more-btn mt-1 text-primary font-semibold text-sm">Show more</button>`:`<div class="content-text full-text-${p.id}">${linkifyContent(p.content)}</div>`}

            // ───────────────────────────────────────────────────────────────
            // STATE & FEED RENDER (updated to use profile data in filtering)
            // ───────────────────────────────────────────────────────────────
            let uiPage = 'home',
                currentCategoryFilter = '',
                currentSortMethod = 'foryou',
                searchQuery = '';
            let feedPage = 1,
                observer = null,
                sentinel = null,
                loader = null,
                isTogglingContent = false,
                isLoadingMore = false;
            let currentPostId = null,
                replyTarget = null,
                exploreReplyTarget = null,
                expandedThreads = new Map(),
                lastDoubleTapTime = 0;
            let marketCategoryFilter = '';
            const tabScrollPositions = { home: 0, explore: 0, market: 0 };
            let lastScrollY = 0;
            let bottomNavHidden = false;

            function handleNavScroll() {
                const nav = document.getElementById('bottomNav');
                if (!nav || window.innerWidth >= 768) return;
                const currentScroll = window.scrollY;
                const scrollDiff = currentScroll - lastScrollY;
                const threshold = 15;
                if (Math.abs(scrollDiff) > threshold) {
                    if (scrollDiff > 0 && !bottomNavHidden) {
                        nav.classList.add('hidden-nav');
                        bottomNavHidden = true;
                        document.body.style.paddingBottom = '0';
                    } else if (scrollDiff < 0 && bottomNavHidden) {
                        nav.classList.remove('hidden-nav');
                        bottomNavHidden = false;
                        document.body.style.paddingBottom = 'calc(var(--bottom-nav-height) + 20px)';
                    }
                }
                lastScrollY = currentScroll;
            }

            function getFilteredSortedPosts() {
                const currentUser = getCurrentUser();
                let p = [...allPosts];
                // Use profile.is_private (from join) to filter
                p = p.filter(post => {
                    if (post.user_id === currentUser.id) return true;
                    const profile = post.profile || {};
                    return !profile.is_private;
                });
                if (currentCategoryFilter) p = p.filter(p => p.category === currentCategoryFilter);
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    p = p.filter(p => p.title.toLowerCase().includes(q) || (p.content || '').toLowerCase()
                        .includes(q) || (p.description || '').toLowerCase().includes(q) || (p.tags && p.tags
                        .some(t => t.toLowerCase().includes(q))));
                }
                if (currentSortMethod === 'trending') p.sort((a, b) => (b.views || 0) - (a.views || 0));
                else if (currentSortMethod === 'foryou') {
                    const uc = getUserCategories();
                    p.sort((a, b) => {
                        const score = p => { const ah = (Date.now() - new Date(p.timestamp || p.date)) / 36e5,
                                eg = (p.views || 0) + ((p.reactions.like || 0) * 2) + ((p.comments ?
                                    p.comments.filter(c => c.approved !== false).length : 0) * 2); return eg /
                                Math.pow(ah + 2, 1.5); };
                        return (score(b) * (uc.includes(b.category) ? 1.4 : 1)) - (score(a) * (uc
                            .includes(a.category) ? 1.4 : 1));
                    });
                } else p.sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date));
                return p;
            }

            function getUserCategories() { const r = localStorage.getItem(UCK); return r ? JSON.parse(r) : []; }

            function renderFeedContainer() {
                const ps = getFilteredSortedPosts(),
                    hf = searchQuery || currentCategoryFilter;
                const hh = hf ?
                    `<div class="mb-4 px-4 pt-3"><h1 class="text-xl font-heading font-bold" style="color:var(--text);">${searchQuery?'Search results':currentCategoryFilter}</h1><p class="text-sm" style="color:var(--muted);">${ps.length} post(s)</p></div>` :
                    '';
                return `<div class="max-w-2xl mx-auto"><div>${hh}</div><div id="feed-container" class="px-0"></div></div>`;
            }

            function renderSkeletons(c = 3) {
                let h = '';
                for (let i = 0; i < c; i++) h +=
                    `<div class="skeleton-post"><div class="flex gap-3" style="padding:0 16px;"><div class="skeleton skeleton-avatar"></div><div style="flex:1;"><div class="skeleton skeleton-line" style="width:40%;height:10px"></div><div class="skeleton skeleton-title"></div>${i===0?'<div class="skeleton skeleton-image"></div>':''}<div class="skeleton skeleton-line" style="width:100%"></div><div class="skeleton skeleton-line" style="width:70%"></div><div class="skeleton skeleton-reactions"></div></div></div></div>`;
                return h;
            }

            function getSentinel() { if (!sentinel) { sentinel = document.createElement('div');
                    sentinel.id = 'sentinel';
                    sentinel.style.height = '1px'; } return sentinel; }

            function getLoader() { if (!loader) { loader = document.createElement('div');
                    loader.id = 'feed-loader';
                    loader.className = 'hidden';
                    loader.innerHTML =
                    '<div style="text-align:center;padding:20px;"><div class="spinner" style="margin:0 auto;"></div></div>'; } return loader; }

            function setupSentinel() { const co = document.getElementById('feed-container'); if (co && !co.contains(
                    getSentinel())) co.appendChild(getSentinel()); const l = getLoader(); if (co && !co.contains(l))
                    co.insertBefore(l, getSentinel()); }

            function setupInfiniteScroll() {
                if (observer) observer.disconnect();
                observer = new IntersectionObserver(es => { if (isTogglingContent || isLoadingMore) return; if (es[
                        0].isIntersecting) loadMorePosts(); }, { root: null, rootMargin: '200px',
                    threshold: 0 });
                observer.observe(getSentinel());
            }

            function initPlayers(root) {
                root.querySelectorAll('.ig-video-wrap video:not([data-plyr-init]), .video-container video:not([data-plyr-init]), .media-carousel-slide video:not([data-plyr-init])')
                    .forEach(vid => {
                        vid.dataset.plyrInit = 'true';
                        setupPlyrPlayer(vid);
                    });
                initAllCarousels(root);
                setTimeout(() => {
                    setupVideoAutoplay(root);
                    setTimeout(() => {
                        const visibleWraps = root.querySelectorAll(
                            '.ig-video-wrap, .video-container, .media-carousel');
                        let firstVisible = null;
                        for (const w of visibleWraps) {
                            const rect = w.getBoundingClientRect();
                            if (rect.top < window.innerHeight && rect.bottom > 0) {
                                firstVisible = w;
                                break;
                            }
                        }
                        if (firstVisible) {
                            const vid = firstVisible.querySelector('video');
                            if (vid && vid.plyr) {
                                vid.plyr.play().catch(() => {});
                                currentlyPlayingVideo = vid;
                            } else if (vid) {
                                vid.play().catch(() => {});
                                currentlyPlayingVideo = vid;
                            }
                            const ytIframe = firstVisible.querySelector('iframe');
                            if (ytIframe) {
                                const idx = ytIframe.id.replace('yt-', '');
                                if (!ytState[idx]) ytState[idx] = { muted: true,
                                playing: true };
                                if (!ytState[idx].playing) {
                                    ytPostMessage(idx, 'playVideo');
                                    ytState[idx].playing = true;
                                    _showYtPauseIcon(idx, true);
                                    _updateMuteBadge(idx);
                                    currentlyPlayingVideo = idx;
                                }
                            }
                        }
                    }, 400);
                }, 300);
            }

            function loadInitialFeed() {
                feedPage = 1;
                isLoadingMore = false;
                if (observer) observer.disconnect();
                const co = document.getElementById('feed-container');
                if (!co) return;
                co.innerHTML = renderSkeletons(3);
                setTimeout(() => {
                    const ps = getFilteredSortedPosts();
                    co.innerHTML = '';
                    if (ps.length === 0) { co.innerHTML =
                            '<div class="flex flex-col items-center justify-center py-20 text-center"><p class="text-sm" style="color:var(--muted);">No posts yet.</p></div>';
                        return; }
                    const fb = ps.slice(0, PAGE_SIZE);
                    co.innerHTML = fb.map((p, i) => buildPostHTML(p, i)).join('');
                    requestAnimationFrame(() => {
                        initPlayers(co);
                        setupSentinel();
                        setupInfiniteScroll();
                        co.querySelectorAll('article').forEach(a => setupPostEventDelegation(a));
                        window._currentFeedPosts = ps;
                    });
                }, 150);
            }

            function loadMorePosts() {
                if (isLoadingMore) return;
                const ps = window._currentFeedPosts || getFilteredSortedPosts();
                const start = feedPage * PAGE_SIZE,
                    nb = ps.slice(start, start + PAGE_SIZE);
                if (nb.length === 0) { if (observer && sentinel) observer.unobserve(sentinel); return; }
                isLoadingMore = true;
                const co = document.getElementById('feed-container'),
                    s = getSentinel();
                const t = document.createElement('div');
                t.innerHTML = nb.map((p, i) => buildPostHTML(p, start + i)).join('');
                while (t.firstChild) co.insertBefore(t.firstChild, s);
                requestAnimationFrame(() => {
                    initPlayers(co);
                    co.querySelectorAll('article:not([data-events-set])').forEach(a => { setupPostEventDelegation(
                            a);
                        a.dataset.eventsSet = 'true'; });
                    feedPage++;
                    isLoadingMore = false;
                });
            }

            function setupPostEventDelegation(article) {
                article.addEventListener('click', function(e) {
                    const t = e.target,
                        pid = article.dataset.postId;
                    if (t.classList.contains('read-more-btn')) { e.stopPropagation();
                        toggleReadMore(article); return; }
                    if (t.closest('.reaction-btn')) { e.stopPropagation();
                        toggleReaction(pid); return; }
                    if (t.closest('.bookmark-badge')) { e.stopPropagation();
                        toggleBookmarkUI(article); return; }
                    if (t.closest('.share-btn')) { e.stopPropagation();
                        const btn = t.closest('.share-btn');
                        const postId = btn.dataset.sharePost || pid;
                        openShareModal(postId);
                        return; }
                    if (t.closest('.comment-btn')) { e.stopPropagation();
                        openExplorePost(pid, 'home', true); return; }
                    if (t.closest('.user-mini-avatar') || t.closest('.font-bold.text-sm')) {
                        e.stopPropagation();
                        const p = allPosts.find(p => p.id === pid);
                        if (p && p.user_id) navigateToProfile(p.user_id);
                        return;
                    }
                    if (t.closest('.text-primary.uppercase')) {
                        e.stopPropagation();
                        const p = allPosts.find(p => p.id === pid);
                        if (p) filterCategory(p.category);
                        return;
                    }
                    if (t.closest('[data-full-img]')) {
                        const c = t.closest('[data-full-img]');
                        e.stopPropagation();
                        openLightbox(c.dataset.fullImg);
                        return;
                    }
                    if (t.closest('[data-extlink]')) { e.stopPropagation();
                        openInAppWebView(decodeURIComponent(t.closest('[data-extlink]').dataset
                        .extlink)); return; }
                    if (t.closest('.carousel-arrow') || t.closest('.carousel-dot')) { e.stopPropagation(); return; }
                    const now = Date.now(),
                        gap = now - lastDoubleTapTime;
                    if (gap < 300 && gap > 0) { e.preventDefault();
                        toggleReaction(pid); }
                    lastDoubleTapTime = now;
                    if (gap >= 300) { setTimeout(() => { if (Date.now() - lastDoubleTapTime >= 300)
                            openExplorePost(pid, 'home'); }, 310); }
                });
            }

            function toggleReadMore(article) {
                isTogglingContent = true;
                const pid = article.dataset.postId;
                const pv = article.querySelector(`.preview-text-${pid}`),
                    fl = article.querySelector(`.full-text-${pid}`),
                    b = article.querySelector('.read-more-btn');
                if (!pv || !fl) { isTogglingContent = false; return; }
                if (fl.classList.contains('hidden')) { pv.classList.add('hidden');
                    fl.classList.remove('hidden');
                    b.textContent = 'Show less'; } else { pv.classList.remove('hidden');
                    fl.classList.add('hidden');
                    b.textContent = 'Show more'; }
                isTogglingContent = false;
            }

            async function toggleBookmarkUI(article) {
                const pid = article.dataset.postId;
                const nb = await toggleBookmark(pid);
                article.querySelectorAll('.bookmark-badge').forEach(el => {
                    el.classList.toggle('bookmarked', nb);
                    el.innerHTML = bookmarkIcon(nb);
                    el.classList.add('bookmark-breathe');
                    setTimeout(() => el.classList.remove('bookmark-breathe'), 400);
                });
                document.querySelectorAll(`#single-bookmark-${pid}`).forEach(el => {
                    el.classList.toggle('bookmarked', nb);
                    el.innerHTML = bookmarkIcon(nb);
                });
                showToast(nb ? 'Saved' : 'Removed from saved');

            function filterCategory(c) { currentCategoryFilter = c;
                searchQuery = '';
                feedPage = 1;
                uiPage = 'home';
                currentSortMethod = 'trending';
                renderUI(); }

            // ───────────────────────────────────────────────────────────────
            // SHARE MODAL
            // ───────────────────────────────────────────────────────────────
            let sharePostId = null;

            function openShareModal(postId) {
                sharePostId = postId;
                const modal = document.getElementById('share-modal');
                modal.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeShareModal() {
                document.getElementById('share-modal').classList.remove('open');
                document.body.style.overflow = '';
                sharePostId = null;
            }

            function handleShareAction(action) {
                if (!sharePostId) return;
                const post = allPosts.find(p => p.id === sharePostId);
                if (!post) { showToast('Post not found'); return; }
                const url = `${window.location.origin}${window.location.pathname}?post=${sharePostId}`;
                const title = post.title || 'FreeUpper post';

                toggleShare(sharePostId).then(shared => {
                    if (action === 'profile') {
                        showToast('Shared to your profile! ✨');
                        closeShareModal();
                    } else if (action === 'copy') {
                        navigator.clipboard.writeText(url).then(() => {
                            showToast('Link copied to clipboard 📋');
                            closeShareModal();
                        }).catch(() => {
                            showToast('Could not copy link');
                            closeShareModal();
                        });
                    } else if (action === 'native') {
                        if (navigator.share) {
                            navigator.share({ title: title, text: title, url: url }).catch(() => {});
                        } else {
                            navigator.clipboard.writeText(url).then(() => {
                                showToast('Link copied to clipboard 📋');
                                closeShareModal();
                            });
                        }
                        closeShareModal();
                    } else if (action === 'more') {
                        navigator.clipboard.writeText(url).then(() => {
                            showToast('Link copied to clipboard 📋');
                            closeShareModal();
                        }).catch(() => {
                            showToast('Could not copy link');
                            closeShareModal();
                        });
                    }
                });
            }

            // ───────────────────────────────────────────────────────────────
            // COMMENTS – Supabase (updated to use comment.profile)
            // ───────────────────────────────────────────────────────────────

            function getAllDescendants(pid, comments) { const r = [];
                const dc = comments.filter(c => c.parentId === pid); for (const c of dc) { r.push(c);
                    r.push(...getAllDescendants(c.id, comments)); } return r; }

            function getCommentsVisible() { const r = localStorage.getItem(CVK); return r ? JSON.parse(r) : {}; }

            function getVisibleComments(postId) { return getCommentsVisible()[postId] || INITIAL_COMMENT_DISPLAY; }

            function setCommentsVisible(postId, count) { const cv = getCommentsVisible();
                cv[postId] = count;
                localStorage.setItem(CVK, JSON.stringify(cv)); }

            function commentSkeletons(count = 3) {
                let h = '';
                for (let i = 0; i < count; i++) {
                    h += `<div class="comment-skeleton">
                <div class="skeleton-avatar-sm"></div>
                <div style="flex:1;">
                  <div class="skeleton-line-sm w70"></div>
                  <div class="skeleton-line-sm w90"></div>
                  <div class="skeleton-line-sm w50"></div>
                </div>
              </div>`;
                }
                return h;
            }

            function renderCommentsHTML(comments, postId, vc) {
                const tl = comments.filter(c => c.parentId === null);
                if (tl.length === 0) return '<p class="text-sm py-8 text-center" style="color:var(--muted);">No replies yet. Be the first.</p>';
                const sh = tl.slice(0, vc),
                    hi = tl.length > vc;
                let h = sh.map(c => renderCommentThread(c, comments, postId)).join('');
                if (hi) h +=
                    `<button type="button" class="view-replies-btn load-more-comments-btn" style="margin-left:0;" data-post-id="${postId}">${svgChevronDown()} View ${formatCount(tl.length-vc)} more repl${tl.length-vc!==1?'ies':'y'}</button>`;
                return h;
            }

            function renderCommentThread(c, allComments, postId) {
                // Use profile data from comment (loaded via join)
                const profile = c.profile || {};
                const author = window.getAuthorFromProfile ? window.getAuthorFromProfile(profile) : {
                    name: 'Anonymous',
                    avatar: '',
                    verified_status: 'none',
                    verified: false
                };
                const username = author.name;
                const avatar = author.avatar;
                const verifiedStatus = author.verified_status;
                const isVerified = author.verified;

                const ds = getAllDescendants(c.id, allComments),
                    hr = ds.length > 0,
                    ec = expandedThreads.get(c.id) || 0;
                let rh = '';
                if (hr && ec > 0) {
                    const sh = ds.slice(0, ec),
                        rm = ds.length - ec;
                    rh = `<div class="replies-thread">${sh.map(r=>renderReplyItem(r,allComments,postId)).join('')}</div>`;
                    if (rm > 0) rh +=
                        `<button type="button" class="view-replies-btn expand-replies-btn" data-comment-id="${c.id}" data-post-id="${postId}">${svgChevronDown()} View ${formatCount(rm)} more repl${rm!==1?'ies':'y'}</button>`;
                    else rh +=
                        `<button type="button" class="hide-replies-btn collapse-replies-btn" data-comment-id="${c.id}" data-post-id="${postId}">${svgChevronUp()} Hide replies</button>`;
                } else if (hr && ec === 0) {
                    rh =
                        `<button type="button" class="view-replies-btn expand-replies-btn" data-comment-id="${c.id}" data-post-id="${postId}">${svgChevronDown()} View ${formatCount(ds.length)} repl${ds.length!==1?'ies':'y'}</button>`;
                }
                const lc = parseInt(localStorage.getItem('comment-like-' + c.id) || '0'),
                    isL = lc > 0,
                    il = c.message.length > 220;
                const avatarHtml = avatar ?
                    `<img src="${avatar}" alt="">` :
                    username.charAt(0).toUpperCase();
                const avatarClass = avatar ? 'comment-avatar has-image' : 'comment-avatar';
                const badgeHtml = window.getVerifiedBadgeHTML ? window.getVerifiedBadgeHTML(verifiedStatus) : '';

                return `<div class="comment-item" data-comment-id="${c.id}">
                <div class="${avatarClass}" data-username="${escapeHtml(username)}">${avatarHtml}</div>
                <div class="comment-body">
                  <div class="comment-username">${escapeHtml(username)} ${badgeHtml}</div>
                  <div class="comment-text${il?' collapsed':''}" data-cid="${c.id}">${escapeHtml(c.message)}</div>
                  ${il?`<button class="comment-show-more">Show more</button>`:''}
                  <div class="comment-meta">
                    <span class="comment-time">${formatRelativeTime(c.time)}</span>
                    <button class="comment-reply-btn" data-post-id="${postId}">Reply</button>
                    <button class="comment-like-btn ${isL?'liked':''}" data-comment-id="${c.id}">
                      <svg viewBox="0 0 24 24" fill="${isL?'#DC2626':'none'}" stroke="${isL?'#DC2626':'currentColor'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                      <span class="like-count">${lc>0?lc:''}</span>
                    </button>
                  </div>
                </div>
              </div>${rh}`;
            }

            function renderReplyItem(r, allComments, postId) {
                const profile = r.profile || {};
                const author = window.getAuthorFromProfile ? window.getAuthorFromProfile(profile) : {
                    name: 'Anonymous',
                    avatar: '',
                    verified_status: 'none',
                    verified: false
                };
                const username = author.name;
                const avatar = author.avatar;
                const verifiedStatus = author.verified_status;
                const isVerified = author.verified;

                const lc = parseInt(localStorage.getItem('comment-like-' + r.id) || '0'),
                    isL = lc > 0;
                const pc = allComments.find(c => c.id === r.parentId),
                    ru = pc ? (pc.profile ? pc.profile.display_name : '') : '';
                const mn = (ru && ru !== username) ? `<span style="color:#7C3AED;font-weight:600;">@${escapeHtml(ru)}</span> ` :
                    '';
                const il = r.message.length > 220;
                const avatarHtml = avatar ?
                    `<img src="${avatar}" alt="">` :
                    username.charAt(0).toUpperCase();
                const avatarClass = avatar ? 'reply-avatar-dot has-image' : 'reply-avatar-dot';
                const badgeHtml = window.getVerifiedBadgeHTML ? window.getVerifiedBadgeHTML(verifiedStatus) : '';

                return `<div class="reply-item" data-comment-id="${r.id}">
                <div class="${avatarClass}" data-username="${escapeHtml(username)}">${avatarHtml}</div>
                <div class="reply-body">
                  <div class="reply-username">${escapeHtml(username)} ${badgeHtml}</div>
                  <div class="comment-text reply-text${il?' collapsed':''}" data-cid="${r.id}">${mn}${escapeHtml(r.message)}</div>
                  ${il?`<button class="comment-show-more">Show more</button>`:''}
                  <div class="reply-meta">
                    <span class="reply-time">${formatRelativeTime(r.time)}</span>
                    <button class="reply-reply-btn" data-post-id="${postId}">Reply</button>
                    <button class="reply-like-btn ${isL?'liked':''}" data-comment-id="${r.id}">
                      <svg viewBox="0 0 24 24" fill="${isL?'#DC2626':'none'}" stroke="${isL?'#DC2626':'currentColor'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                      <span class="like-count">${lc>0?lc:''}</span>
                    </button>
                  </div>
                </div>
              </div>`;
            }

            // ── Add comment (Supabase) ──
            async function addComment(postId, parentId, message) {
                const p = appData.posts.find(p => p.id === postId);
                if (!p) return;
                if (window.AuthUser && window.AuthUser.requireAuth) {
                    return new Promise((resolve, reject) => {
                        window.AuthUser.requireAuth(async () => {
                            try {
                                const comment = await window.PostsAPI.addComment(postId, parentId,
                                message);
                                if (!p.comments) p.comments = [];
                                p.comments.push(comment);
                                p.commentCount = (p.commentCount || 0) + 1;
                                resolve(comment);
                            } catch (err) {
                                showToast(err.message, 'r');
                                reject(err);
                            }
                        });
                    });
                } else {
                    const cu = getCurrentUser();
                    const comment = {
                        id: 'temp-' + Date.now(),
                        profile: { display_name: cu.displayName, avatar_url: cu.avatar },
                        message,
                        time: new Date().toISOString(),
                        approved: true,
                        parentId: parentId || null
                    };
                    if (!p.comments) p.comments = [];
                    p.comments.push(comment);
                    p.commentCount = (p.commentCount || 0) + 1;
                    return comment;
                }
            }

            function refreshCommentsList(postId, listId) {
                const p = appData.posts.find(p => p.id === postId);
                if (!p) return;
                const cl = document.getElementById(listId);
                if (!cl) return;
                const ac = p.comments ? p.comments.filter(c => c.approved !== false) : [],
                    vc = getVisibleComments(postId);
                cl.innerHTML = commentSkeletons(3);
                setTimeout(() => {
                    cl.innerHTML = renderCommentsHTML(ac, postId, vc);
                }, 200);
            }

            function updateCommentCount(postId) {
                const p = appData.posts.find(p => p.id === postId);
                if (!p) return;
                const cc = p.comments ? p.comments.filter(c => c.approved !== false).length : 0;
                document.querySelectorAll(`article[data-post-id="${postId}"] .comment-btn .comment-count`).forEach(el =>
                    el.textContent = formatCount(cc));
                const h3 = document.querySelector(`#comments-count-${postId}`);
                if (h3) h3.textContent = formatCount(cc);
            }

            function toggleCommentLikeUI(btn) {
                const isLiked = btn.classList.toggle('liked');
                const ci = btn.dataset.commentId;
                if (!ci) return;
                const key = 'comment-like-' + ci;
                let count = parseInt(localStorage.getItem(key) || '0');
                count = isLiked ? count + 1 : Math.max(0, count - 1);
                if (count === 0) localStorage.removeItem(key);
                else localStorage.setItem(key, String(count));
                const svg = btn.querySelector('svg'),
                    cnt = btn.querySelector('.like-count');
                if (svg) { svg.setAttribute('fill', isLiked ? '#DC2626' : 'none');
                    svg.setAttribute('stroke', isLiked ? '#DC2626' : 'currentColor'); }
                if (cnt) cnt.textContent = count > 0 ? count : '';
            }

            function toggleCommentExpand(btn, commentId) {
                const el = document.querySelector(`.comment-text[data-cid="${commentId}"]`);
                if (!el) return;
                const collapsed = el.classList.toggle('collapsed');
                btn.textContent = collapsed ? 'Show more' : 'Show less';
            }

            function expandReplies(commentId, postId) { expandedThreads.set(commentId, (expandedThreads.get(
                    commentId) || 0) + REPLY_BATCH);
                refreshCommentsList(postId, 'comments-list'); }

            function collapseReplies(commentId, postId) { expandedThreads.delete(commentId);
                refreshCommentsList(postId, 'comments-list'); }

            function loadMoreComments(postId) { setCommentsVisible(postId, getVisibleComments(postId) +
                    COMMENT_LOAD_MORE);
                refreshCommentsList(postId, 'comments-list'); }

            function setupCommentListDelegation(container, postId) {
                container.addEventListener('click', function(e) {
                    const t = e.target;
                    if (t.closest('.comment-reply-btn') || t.closest('.reply-reply-btn')) {
                        const btn = t.closest('.comment-reply-btn') || t.closest('.reply-reply-btn');
                        const ci = parseInt(btn.closest('[data-comment-id]')?.dataset.commentId);
                        const un = btn.closest('[data-comment-id]')?.querySelector(
                            '.comment-username,.reply-username')?.textContent;
                        if (ci && un) replyToComment(ci, un);
                        return;
                    }
                    if (t.closest('.comment-like-btn') || t.closest('.reply-like-btn')) {
                        const btn = t.closest('.comment-like-btn') || t.closest('.reply-like-btn');
                        toggleCommentLikeUI(btn);
                        return;
                    }
                    if (t.closest('.comment-show-more')) {
                        const btn = t.closest('.comment-show-more');
                        const ci = btn.parentElement.querySelector('.comment-text')?.dataset.cid;
                        if (ci) toggleCommentExpand(btn, ci);
                        return;
                    }
                    if (t.closest('.expand-replies-btn')) { const ci = parseInt(t.closest(
                            '.expand-replies-btn').dataset.commentId); if (ci) expandReplies(ci,
                        postId); return; }
                    if (t.closest('.collapse-replies-btn')) { const ci = parseInt(t.closest(
                            '.collapse-replies-btn').dataset.commentId); if (ci) collapseReplies(ci,
                        postId); return; }
                    if (t.closest('.load-more-comments-btn')) { loadMoreComments(postId); return; }
                    if (t.closest('.comment-avatar') || t.closest('.reply-avatar-dot')) {
                        const el = t.closest('.comment-avatar') || t.closest('.reply-avatar-dot');
                        navigateToProfileByUsername(el.dataset.username);
                        return;
                    }
                });
            }

            function replyToComment(commentId, username) {
                if (uiPage === 'single-post-explore') {
                    exploreReplyTarget = { commentId, username };
                    updateExploreReplyContextUI();
                    const ta = document.getElementById('explore-comment-textarea');
                    if (ta) { ta.focus();
                        ta.style.height = 'auto';
                        ta.style.height = Math.min(ta.scrollHeight, 100) + 'px'; }
                    document.getElementById('explore-comment-bar').scrollIntoView({ behavior: 'smooth' });
                } else {
                    replyTarget = { commentId, username };
                    updateReplyContextUI();
                    const ta = document.getElementById('global-comment-textarea');
                    if (ta) { ta.focus(); }
                    setCommentBarVisible(true);
                }
            }

            function updateReplyContextUI() {
                const banner = document.getElementById('reply-context-banner'),
                    ue = document.getElementById('reply-context-username');
                if (replyTarget) { banner.classList.add('show');
                    ue.textContent = '@' + replyTarget.username; } else { banner.classList.remove('show');
                    ue.textContent = ''; }
            }

            function updateExploreReplyContextUI() {
                const banner = document.getElementById('explore-reply-banner'),
                    ue = document.getElementById('explore-reply-username');
                if (exploreReplyTarget) { banner.style.display = 'flex';
                    ue.textContent = '@' + exploreReplyTarget.username; } else { banner.style.display = 'none';
                    ue.textContent = ''; }
            }

            function cancelReply() { replyTarget = null;
                updateReplyContextUI(); const ta = document.getElementById('global-comment-textarea'); if (ta) ta

            function cancelExploreReply() { exploreReplyTarget = null;
                updateExploreReplyContextUI(); const ta = document.getElementById('explore-comment-textarea'); if (
                    ta) ta.value = ''; }

            async function submitCommentFromBar() {
                const ta = document.getElementById('global-comment-textarea');
                const m = ta.value.trim();
                if (!m) return showToast('Reply cannot be empty.');
                const pi = replyTarget ? replyTarget.commentId : null;
                ta.value = '';
                ta.style.height = '40px';

                } catch (err) {
                    showToast(err.message || 'Failed to post reply', 'r');
                }
            }

                const ta = document.getElementById('explore-comment-textarea');
                const m = ta.value.trim();
                if (!m) return showToast('Reply cannot be empty.');
                const pi = exploreReplyTarget ? exploreReplyTarget.commentId : null;
                ta.value = '';
                ta.style.height = '40px';
                exploreReplyTarget = null;
                updateExploreReplyContextUI();
                try {
                    await addComment(currentPostId, pi, m);
                    refreshCommentsList(currentPostId, 'comments-list');

                    showToast(pi ? 'Reply posted' : 'Reply posted');
                } catch (err) {
                    showToast(err.message || 'Failed to post reply', 'r');

            function setCommentBarVisible(show, focus) {
