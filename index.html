                <div class="mt-5">
                  <h3 class="font-heading font-bold text-base mb-3" style="color:var(--text);">Replies</h3>
                  <div id="comments-list">${renderCommentsHTML(comments,post.id,vc)}</div>
                </div>
              </div>`;
            }

            async function openExplorePost(id, returnPage, focusComment) {
                pauseHomepageVideos();
                const fs = document.getElementById('explore-fullscreen'),
                    fc = document.getElementById('explore-fullscreen-content');
                if (!fs || !fc) return;
                currentPostId = id;
                uiPage = 'single-post-explore';
                window._fullscreenReturnPage = returnPage || uiPage || 'home';
                exploreReplyTarget = null;
                expandedThreads.clear();
                const post = allPosts.find(p => p.id === id);
                if (post) {
                    if (window.PostsAPI && window.PostsAPI.incrementView) {
                        window.PostsAPI.incrementView(id);
                    }
                    post.views = (post.views || 0) + 1;
                    if (!post.comments || post.comments.length === 0) {
                        if (window.PostsAPI && window.PostsAPI.loadComments) {
                            try {
                                post.comments = await window.PostsAPI.loadComments(id);
                            } catch (err) {
                                console.error('Failed to load comments:', err);
                                post.comments = [];
                            }
                        }
                    }
                }
                const catNameEl = document.getElementById('explore-category-name');
                if (catNameEl) catNameEl.textContent = post ? (post.category || 'Post') : 'Post';
                fc.innerHTML = buildSinglePostHTML(post);
                requestAnimationFrame(() => {
                    initPlayers(fc);
                    setTimeout(() => {
                        const vid = fc.querySelector('.ig-video-wrap video, .video-container video, .media-carousel-slide video');
                        if (vid && vid.plyr) {
                            vid.plyr.play().catch(() => {});
                            currentlyPlayingVideo = vid;
                        } else if (vid) {
                            vid.play().catch(() => {});
                            currentlyPlayingVideo = vid;
                        }
                        const ytIframe = fc.querySelector('.ig-video-wrap iframe, .media-carousel-slide iframe');
                        if (ytIframe) {
                            const idx = ytIframe.id.replace('yt-', '');
                            if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
                            if (!ytState[idx].playing) {
                                ytPostMessage(idx, 'playVideo');
                                ytState[idx].playing = true;
                                _showYtPauseIcon(idx, true);
                                _updateMuteBadge(idx);
                                currentlyPlayingVideo = idx;
                            }
                        }
                    }, 400);
                });
                fs.classList.add('open');
                document.body.classList.add('explore-open');
                document.body.style.overflow = 'hidden';
                fs.scrollTop = 0;
                setCommentBarVisible(false);
                const eb = document.getElementById('explore-comment-bar');
                if (eb) eb.style.display = 'block';
                updateExploreReplyContextUI();
                setupExploreEventDelegation(fc, id);
                setupCommentListDelegation(fc, id);
                if (focusComment) {
                    const ta = document.getElementById('explore-comment-textarea');
                    if (ta) setTimeout(() => ta.focus(), 300);
                }
            }

            function closeExploreFullscreen() {
                const fs = document.getElementById('explore-fullscreen');
                if (!fs) return;
                const eb = document.getElementById('explore-comment-bar');
                if (eb) eb.style.display = 'none';
                fs.classList.remove('open');
                document.body.classList.remove('explore-open');
                document.body.style.overflow = '';
                currentPostId = null;
                uiPage = window._fullscreenReturnPage || 'home';
                refreshTabStates();
                setTimeout(() => {
                    const fc = document.getElementById('explore-fullscreen-content');
                    if (fc) fc.innerHTML = '';
                    setupVideoAutoplay(document);
                }, 400);
            }

            function setupExploreEventDelegation(container, postId) {
                container.addEventListener('click', function(e) {
                    const t = e.target;
                    if (t.closest('#single-share-btn')) {
                        const pid = t.closest('#single-share-btn').dataset.sharePost || postId;
                        openShareModal(pid);
                        return;
                    }
                    if (t.closest('.bookmark-badge')) {
                        const btn = t.closest('.bookmark-badge');
                        toggleBookmark(postId).then(nb => {
                            btn.classList.toggle('bookmarked', nb);
                            btn.innerHTML = bookmarkIcon(nb);
                            btn.classList.add('bookmark-breathe');
                            setTimeout(() => btn.classList.remove('bookmark-breathe'), 400);
                            document.querySelectorAll(`article[data-post-id="${postId}"] .bookmark-badge`)
                                .forEach(el => { el.classList.toggle('bookmarked', nb);
                                    el.innerHTML = bookmarkIcon(nb); });
                            showToast(nb ? 'Saved' : 'Removed from saved');
                        });
                        return;
                    }
                    if (t.closest('.reaction-btn')) { toggleReaction(postId); return; }
                    if (t.closest('[data-full-img]')) { const c = t.closest('[data-full-img]');
                        openLightbox(c.dataset.fullImg); return; }
                    if (t.closest('[data-extlink]')) { openInAppWebView(decodeURIComponent(t.closest(
                        '[data-extlink]').dataset.extlink)); return; }
                    if (t.closest('.font-bold.text-sm')) {
                        const p = allPosts.find(p => p.id === postId);
                        if (p && p.user_id) navigateToProfile(p.user_id);
                        return;
                    }
                });
            }

            // ───────────────────────────────────────────────────────────────
            // EXPLORE GRID (updated to use profile data)
            // ───────────────────────────────────────────────────────────────
            function renderExploreGrid() {
                const co = document.getElementById('user-content');
                const currentUser = getCurrentUser();
                let p = [...allPosts].filter(post => {
                    if (post.user_id === currentUser.id) return true;
                    const profile = post.profile || {};
                    return !profile.is_private;
                });
                p.sort((a, b) => ((b.views || 0) + (b.reactions.like || 0)) - ((a.views || 0) + (a.reactions
                    .like || 0)));

                co.innerHTML = `<div class="max-w-2xl mx-auto px-3 py-3">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 6px;">
                  <h2 class="font-heading font-extrabold text-lg" style="color:var(--text);">Explore</h2>
                  <button class="subtitle-filter-btn ${currentCategoryFilter?'active':''}" id="explore-filter-inline-btn">${svgFilter()} ${currentCategoryFilter||'Filter'}</button>
                </div>
                <div class="explore-grid" id="explore-grid-content">${exploreSkeletonGrid()}</div>
              </div>`;

                if (currentCategoryFilter) p = p.filter(post => post.category === currentCategoryFilter);

                setTimeout(() => {
                    const gc = document.getElementById('explore-grid-content');
                    if (!gc || uiPage !== 'explore') return;
                    if (p.length === 0) {
                        gc.outerHTML =
                            '<div class="flex flex-col items-center justify-center py-16 text-center col-span-2" style="grid-column:1/-1;"><p class="text-sm" style="color:var(--muted);">No posts yet. Be the first to post!</p></div>';
                        return;
                    }
                    gc.innerHTML = buildExploreCards(p);
                    gc.querySelectorAll('.explore-card').forEach(card => {
                        card.addEventListener('click', () => { const pid = card.dataset.postId;
                            if (pid) openExplorePost(pid, 'explore'); });
                    });
                    setTimeout(() => {
                        initPlayers(gc);
                    }, 300);
                }, 300);
                document.getElementById('explore-filter-inline-btn')?.addEventListener('click',
                openFilterDrawer);
            }

            function exploreSkeletonGrid() {
                let h = '';
                for (let i = 0; i < 8; i++) h +=
                    '<div class="explore-skeleton-card"><div class="explore-skeleton-thumb"></div></div>';
                return h;
            }

            function buildExploreCards(posts) {
                const cu = getCurrentUser();
                return posts.map(post => {
                    const profile = post.profile || {};
                    const author = window.getAuthorFromProfile ? window.getAuthorFromProfile(profile) : {
                        name: 'Anonymous',
                        avatar: '',
                        verified_status: 'none'
                    };
                    const av = author.avatar;
                    const au = author.name;
                    const mediaItems = getMediaItems(post);
                    let mh = '';
                    if (mediaItems.length > 0) {
                        const first = mediaItems[0];
                        const url = first.url;
                        const isVideo = first.type === 'video' || (url && isYouTubeUrl(url));
                        if (url) {
                            if (isVideo && isYouTubeUrl(url)) {
                                const ytId = extractYouTubeId(url);
                                if (ytId) {
                                    mh =
                                        `<div class="ig-video-wrap" style="width:100%;margin:0;height:100%;position:relative;background:#000;"><div class="yt-wrap" style="padding-bottom:56.25%;height:0;position:relative;width:100%;"><iframe src="https://www.youtube.com/embed/${ytId}?autoplay=0&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0" allow="autoplay; encrypted-media" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"></iframe><div class="yt-tap" onclick="event.stopPropagation();"></div></div></div>`;
                                } else {
                                    mh =
                                        `<div class="ig-video-wrap" style="width:100%;margin:0;height:100%;"><video src="${url}" muted playsinline preload="metadata" class="explore-card-thumb" style="pointer-events:none;object-fit:cover;width:100%;height:100%;"></video></div>`;
                                }
                            } else if (isVideo) {
                                mh =
                                    `<div class="ig-video-wrap" style="width:100%;margin:0;height:100%;"><video src="${url}" muted playsinline preload="metadata" class="explore-card-thumb" style="pointer-events:none;object-fit:cover;width:100%;height:100%;"></video></div>`;
                            } else {
                                mh =
                                    `<img src="${url}" class="explore-card-thumb" loading="lazy" alt="" onload="this.closest('.explore-card').classList.add('loaded')" onerror="this.closest('.explore-card').classList.add('loaded');this.outerHTML='<div class=\\'explore-card-no-media\\'><div class=\\'explore-card-no-media-text\\'>${escapeHtml(post.title).replace(/'/g,"\\'")}</div></div>'">`;
                            }
                        } else {
                            mh =
                                `<div class="explore-card-no-media loaded"><div class="explore-card-no-media-text">${escapeHtml(post.title)}</div></div>`;
                        }
                    } else {
                        mh =
                            `<div class="explore-card-no-media loaded"><div class="explore-card-no-media-text">${escapeHtml(post.title)}</div></div>`;
                    }
                    const vb = mediaItems.length > 0 && (mediaItems[0].type === 'video' || (mediaItems[0].url && isYouTubeUrl(mediaItems[0].url))) ?
                        `<div class="explore-card-video-badge"><svg width="9" height="9" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg> Video</div>` :
                        '';
                    const ah = av ?
                        `<img src="${av}" class="explore-card-avatar" alt="" onerror="this.style.display='none'">` :
                        `<div class="explore-card-avatar" style="display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#9CA3AF;">${au.charAt(0).toUpperCase()}</div>`;
                    const nl = !post.mediaUrl && mediaItems.length === 0;
                    const cc = nl ? 'explore-card loaded' : 'explore-card';
                    return `<div class="${cc}" data-post-id="${post.id}" ${mediaItems.length > 0 && mediaItems[0].type === 'video' ? 'data-video-card="true"' : ''}>${mh}<div class="explore-card-category">${escapeHtml(post.category||'General')}</div>${vb}<div class="explore-card-overlay"><div class="explore-card-title">${escapeHtml(post.title)}</div><div class="explore-card-meta">${ah}<span class="explore-card-author">${escapeHtml(au)}</span><span class="explore-card-views">${svgEye()}${formatCount(post.views||0)}</span></div></div></div>`;
                }).join('');
            }

            // ───────────────────────────────────────────────────────────────
            // MARKET – Supabase (updated seller lookup – uses profile)
            // ───────────────────────────────────────────────────────────────

            const MARKET_CATEGORIES = [
                { group: "Home & Garden", items: ["Tools", "Furniture", "Garden Appliance", "Household"] },
                { group: "Entertainment", items: ["Books, Movies & Music", "Video Games"] },
                { group: "Clothing & Accessories", items: ["Jewelry & Accessories", "Bags & Luggage",
                        "Men's Clothing & Shoes", "Women's Clothing & Shoes"
                    ] },
                { group: "Family", items: ["Toys & Games", "Baby & Kids", "Pet Supplies"] },
                { group: "Health & Beauty", items: [] },
                { group: "Electronics", items: ["Mobile Phones", "Electronics & Computers"] },
                { group: "Hobbies", items: ["Sports", "Musical Instruments", "Arts & Crafts",
                        "Antiques & Collectibles", "Auto Parts", "Bicycles"
                    ] },
                { group: "Classified", items: ["Garage Sale", "Miscellaneous"] },
                { group: "Vehicle", items: ["Cars & Trucks", "Motorcycles", "Powersports", "RVs & Campers",
                        "Boats", "Commercial & Industrial", "Trailers", "Other"
                    ] },
                { group: "Home for Sales", items: ["Home sales", "Rental"] },
                { group: "Service", items: ["Repairs", "Maintenance", "Others"] }
            ];

            function getMarketItems() { return appData.marketItems || []; }

            function getFilteredMarketItems() {
                let items = [...getMarketItems()];
                if (marketCategoryFilter) items = items.filter(i => i.category === marketCategoryFilter);
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    items = items.filter(i => i.title.toLowerCase().includes(q) || (i.description || '')
                        .toLowerCase().includes(q) || (i.category || '').toLowerCase().includes(q) || (i
                        .location || '').toLowerCase().includes(q));
                }
                items.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
                return items;
            }

            function buildMarketCard(item) {
                // Support both old and new image formats
                let imageUrls = [];
                if (item.images && Array.isArray(item.images)) {
                    if (item.images.length > 0 && typeof item.images[0] === 'object' && item.images[0].url) {
                        imageUrls = item.images.map(img => img.url);
                    } else {
                        imageUrls = item.images;
                    }
                } else if (item.imageUrl) {
                    imageUrls = [item.imageUrl];
                }

                const ih = imageUrls.length > 0 ?
                    `<img src="${imageUrls[0]}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'market-card-no-image\\'><svg width=\\'32\\' height=\\'32\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'#D1D5DB\\' stroke-width=\\'1.5\\'><rect x=\\'3\\' y=\\'3\\' width=\\'18\\' height=\\'18\\' rx=\\'2\\'/></svg></div>'">` :
                    '<div class="market-card-no-image"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#D1D5DB" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div>';
                // For seller, we could join profiles, but we use seller_name/avatar from item; we could also fetch from profiles if needed.
                // For simplicity, keep as is.
                const seller = { displayName: item.seller_name || 'Seller', avatar: item.seller_avatar || '' };
                const sr =
                    `<div class="market-card-seller-row"><img src="${seller.avatar}" class="market-card-seller-avatar" onerror="this.style.display='none'" alt=""><span class="market-card-seller-name">${escapeHtml(seller.displayName)}</span></div>`;
                return `<div class="market-card" data-item-id="${item.id}"><div class="market-card-image-wrap">${ih}<span class="market-card-category-badge">${escapeHtml(item.category||'Item')}</span><span class="market-card-price-tag">₦${formatPrice(item.price)}</span></div><div class="market-card-body"><div class="market-card-title">${escapeHtml(item.title)}</div><div class="market-card-location">${svgLocation()} ${escapeHtml(item.location||'Campus')}</div>${sr}</div></div>`;
            }

            function renderMarketGrid() {
                const items = getFilteredMarketItems();
                if (items.length === 0) return `<div class="flex flex-col items-center justify-center py-16 text-center"><div class="w-14 h-14 rounded-full flex items-center justify-center mb-3" style="background:rgba(124,58,237,.08);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div><p class="font-heading font-bold text-base mb-1" style="color:var(--text);">No items listed yet</p><p class="text-sm" style="color:var(--muted);">Be the first to sell something on campus!</p></div>`;
                return `<div class="market-grid">${items.map(buildMarketCard).join('')}</div>`;
            }

            function marketSkeleton() {
                let h = '<div class="market-grid">';
                for (let i = 0; i < 6; i++) h +=
                    `<div class="market-skeleton-card"><div class="market-skeleton-image"></div><div class="market-skeleton-body"><div class="market-skeleton-line" style="width:80%;height:14px;"></div><div class="market-skeleton-line" style="width:55%"></div><div class="market-skeleton-line" style="width:40%"></div></div></div>`;
                h += '</div>';
                return h;
            }

            function renderMarketView() {
                return `<div class="max-w-2xl mx-auto px-4 py-4"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;"><div><h2 class="font-heading font-extrabold text-lg" style="color:var(--text);">Campus Market</h2><p class="text-xs" style="color:var(--muted);">Buy & sell within your campus.</p></div><button class="subtitle-filter-btn ${marketCategoryFilter?'active':''}" id="market-filter-inline-btn">${svgFilter()} ${marketCategoryFilter||'Filter'}</button></div><div id="market-container">${marketSkeleton()}</div></div>`;
            }

            function setupMarketGridEvents() {
                document.querySelectorAll('.market-card').forEach(card => {
                    card.addEventListener('click', () => openMarketFullscreen(parseInt(card.dataset
                        .itemId)));
                });
            }

            function openMarketFullscreen(itemId) {
                const item = getMarketItems().find(i => i.id === itemId);
                if (!item) return;

                let imageUrls = [];
                if (item.images && Array.isArray(item.images)) {
                    if (item.images.length > 0 && typeof item.images[0] === 'object' && item.images[0].url) {
                        imageUrls = item.images.map(img => img.url);
                    } else {
                        imageUrls = item.images;
                    }
                } else if (item.imageUrl) {
                    imageUrls = [item.imageUrl];
                }

                let sliderHtml = '';
                if (imageUrls.length > 1) {
                    const dotsHtml = imageUrls.map((_, i) =>
                        `<div class="market-fs-dot ${i===0?'active':''}" data-slide="${i}"></div>`).join('');
                    sliderHtml = `
                    <div class="market-fs-slider" id="mfs-slider-${itemId}">
                      <div class="market-fs-track" id="mfs-track-${itemId}">
                        ${imageUrls.map(url => `<img src="${url}" alt="">`).join('')}
                      </div>
                      <div class="market-fs-dots" id="mfs-dots-${itemId}">${dotsHtml}</div>
                      <button class="market-fs-arrow left" id="mfs-prev-${itemId}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
                      <button class="market-fs-arrow right" id="mfs-next-${itemId}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
                    </div>
                  `;
                } else if (imageUrls.length === 1) {
                    sliderHtml =
                        `<img src="${imageUrls[0]}" style="width:100%;max-height:60vh;object-fit:contain;background:#000;" alt="">`;
                } else {
                    sliderHtml =
                        '<div style="width:100%;height:200px;display:flex;align-items:center;justify-content:center;background:#F3F4F6;color:#D1D5DB;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#D1D5DB" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div>';
                }

                const seller = { displayName: item.seller_name || 'Seller', avatar: item.seller_avatar || '' };

                document.getElementById('market-fullscreen-body').innerHTML = `${sliderHtml}<div style="padding:16px;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><img src="${seller.avatar}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none'" alt=""><div><div style="font-weight:700;color:var(--text);">${escapeHtml(seller.displayName)}</div><div style="font-size:.75rem;color:var(--muted);">${svgLocation()} ${escapeHtml(item.location||'Campus')}</div></div></div><div style="font-size:1.6rem;font-weight:800;color:var(--text);margin-bottom:4px;">₦${formatPrice(item.price)}</div><h2 style="font-weight:700;font-size:1.1rem;color:var(--text);margin-bottom:8px;line-height:1.4;">${escapeHtml(item.title)}</h2>${item.description?`<p style="font-size:.9rem;color:var(--muted);line-height:1.6;margin-bottom:12px;white-space:pre-wrap;">${escapeHtml(item.description)}</p>`:''}<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn-primary" style="flex:1;justify-content:center;" id="mfs-chat-btn">Chat Seller</button><button class="btn-ghost" style="flex:1;justify-content:center;" id="mfs-save-btn">Save</button></div></div>`;
                let idx = 0;

                function updateSlider() {
                    const track = document.getElementById(`mfs-track-${itemId}`);
                    if (track) track.style.transform = `translateX(-${idx*100}%)`;
                    document.querySelectorAll(`#mfs-dots-${itemId} .market-fs-dot`).forEach((d, i) => d
                        .classList.toggle('active', i === idx));
                }
                document.getElementById(`mfs-prev-${itemId}`)?.addEventListener('click', () => { idx = idx >
                        0 ? idx - 1 : imageUrls.length - 1;
                    updateSlider(); });
                document.getElementById(`mfs-next-${itemId}`)?.addEventListener('click', () => { idx = idx <
                        imageUrls.length - 1 ? idx + 1 : 0;
                    updateSlider(); });
                document.getElementById('mfs-chat-btn')?.addEventListener('click', () => { window.location
                        .href = `chat.html?with=${encodeURIComponent(item.seller_id||'')}`; });
                document.getElementById('mfs-save-btn')?.addEventListener('click', function() {
                    showToast('Item saved (coming soon)');
                });
                document.getElementById('market-fullscreen').classList.add('open');
                document.body.classList.add('market-fullscreen-open');
            }

            function closeMarketFullscreen() {
                document.getElementById('market-fullscreen').classList.remove('open');
                document.body.classList.remove('market-fullscreen-open');
                setTimeout(() => { document.getElementById('market-fullscreen-body').innerHTML = ''; },
                350);
            }

            function filterMarketCategory(c) {
                marketCategoryFilter = (marketCategoryFilter === c) ? '' : c;
                const mc = document.getElementById('market-container');
                if (mc) {
                    mc.innerHTML = marketSkeleton();
                    setTimeout(() => {
                        if (document.getElementById('market-container')) {
                            document.getElementById('market-container').innerHTML = renderMarketGrid();
                            setupMarketGridEvents();
                        }
                        const fb = document.getElementById('market-filter-inline-btn');
                        if (fb) { fb.innerHTML = `${svgFilter()} ${marketCategoryFilter||'Filter'}`;
                            fb.classList.toggle('active', !!marketCategoryFilter); }
                    }, 300);
                }
                closeMarketFilterModal();
            }

            function openMarketFilterModal() {
                const body = document.getElementById('market-filter-body');
                let html = '';
                MARKET_CATEGORIES.forEach(group => {
                    html += `<div class="category-group-header">${escapeHtml(group.group)}</div>`;
                    if (group.items.length > 0) {
                        group.items.forEach(item => {
                            const fullName = `${group.group} - ${item}`;
                            html +=
                                `<button class="category-option ${marketCategoryFilter===fullName?'selected':''}" data-cat="${escapeHtml(fullName)}">${escapeHtml(item)}</button>`;
                        });
                    } else {
                        html +=
                            `<button class="category-option ${marketCategoryFilter===group.group?'selected':''}" data-cat="${escapeHtml(group.group)}">All ${escapeHtml(group.group)}</button>`;
                    }
                });
                body.innerHTML = html;
                body.querySelectorAll('.category-option').forEach(btn => btn.addEventListener('click', () =>
                    filterMarketCategory(btn.dataset.cat)));
                document.getElementById('market-filter-modal').classList.add('open');
            }

            function closeMarketFilterModal() { document.getElementById('market-filter-modal').classList
                .remove('open'); }

            // ───────────────────────────────────────────────────────────────
            // TABS / NAV
            // ───────────────────────────────────────────────────────────────
            async function refreshHome() {
                await reloadData();
                currentCategoryFilter = '';
                searchQuery = '';
                currentSortMethod = 'foryou';
                feedPage = 1;
                uiPage = 'home';
                renderUI();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showToast('Feed refreshed');
            }

            function setTab(mode) {
                const scrollY = window.scrollY;
                if (uiPage === 'home') tabScrollPositions.home = scrollY;
                else if (uiPage === 'explore') tabScrollPositions.explore = scrollY;
                else if (uiPage === 'market') tabScrollPositions.market = scrollY;
                currentCategoryFilter = '';
                searchQuery = '';
                feedPage = 1;
                if (mode === 'foryou') { currentSortMethod = 'foryou';
                    uiPage = 'home'; } else if (mode === 'explore') { currentSortMethod = 'trending';
                    uiPage = 'explore'; } else if (mode === 'market') { uiPage = 'market'; }
                renderUI();
            }

            function renderUI() {
                const co = document.getElementById('user-content');
                if (uiPage === 'explore') { renderExploreGrid();
                    setCommentBarVisible(false);
                    refreshTabStates();
                    setTimeout(() => window.scrollTo(0, tabScrollPositions.explore || 0), 80); return; }
                if (uiPage === 'market') {
                    co.innerHTML = renderMarketView();
                    setCommentBarVisible(false);
                    refreshTabStates();
                    setTimeout(() => {
                        const mc = document.getElementById('market-container');
                        if (mc) { mc.innerHTML = renderMarketGrid();
                            setupMarketGridEvents(); }
                        document.getElementById('market-filter-inline-btn')?.addEventListener('click',
                            openMarketFilterModal);
                    }, 300);
                    setTimeout(() => window.scrollTo(0, tabScrollPositions.market || 0), 80);
                    return;
                }
                co.innerHTML = renderFeedContainer();
                loadInitialFeed();
                setCommentBarVisible(false);
                refreshTabStates();
                setTimeout(() => window.scrollTo(0, tabScrollPositions.home || 0), 80);
            }

            function refreshTabStates() {
                document.querySelectorAll('.tab-pill').forEach(el => el.classList.remove('tab-pill--active'));
                const map = { home: 'tab-foryou', explore: 'tab-explore', market: 'tab-market',
                    'single-post-explore': null };
                const id = map[uiPage];
                if (id) document.getElementById(id)?.classList.add('tab-pill--active');
            }

            function navigateToProfile(uid) {
                const u = getCurrentUser();
                if (!u.isLoggedIn) { showToast('Sign in to view profiles'); return; }
                window.location.href = uid === u.id ? 'profile.html' : `profile.html?uid=${uid}`;
            }

            function navigateToProfileByUsername(username) {
                if (!username || username === 'Guest') return;
                // We no longer use getAllUsers – we'd need to fetch user by username from Supabase.
                // For now, fallback to first matching username from allPosts profile.
                const found = allPosts.find(p => p.profile && p.profile.username === username);
                if (found) navigateToProfile(found.user_id);
                else showToast('User not found');
            }

            function openInAppWebView(url) { window.open(url, '_blank', 'noopener,noreferrer'); }

            function closeInAppWebView() { const o = document.getElementById('inapp-webview-overlay'),
                    f = document.getElementById('inapp-webview-frame');
                f.src = '';
                o.classList.add('hidden');
                document.body.style.overflow = ''; }

            function openFilterDrawer() {
                refreshDrawerCategories();
                const d = document.getElementById('filter-drawer'),
                    b = document.getElementById('filter-backdrop');
                d.classList.remove('translate-y-full');
                b.classList.remove('bg-opacity-0', 'pointer-events-none');
                b.classList.add('bg-opacity-40', 'pointer-events-auto');
                document.body.style.overflow = 'hidden';
            }

            function closeFilterDrawer() {
                const d = document.getElementById('filter-drawer'),
                    b = document.getElementById('filter-backdrop');
                d.classList.add('translate-y-full');
                b.classList.add('bg-opacity-0', 'pointer-events-none');
                b.classList.remove('bg-opacity-40', 'pointer-events-auto');
                document.body.style.overflow = '';
            }

            function refreshDrawerCategories() {
                const de = document.getElementById('drawer-categories');
                if (!de) return;
                const CATS = ["Technology", "Education", "Campus gist", "News & Updates", "Entertainment", "Movies",
                    "Lifestyle", "Business & Finance", "Opinion / Thoughts", "Health & Fitness", "Travel & Culture",
                    "Gaming", "Memes", "Science", "Fashion", "Music"
                ];
                de.innerHTML = CATS.map(c =>
                    `<button class="drawer-cat-btn ${currentCategoryFilter===c?'drawer-cat-btn--active':''}" style="width:100%;text-align:left;padding:11px 14px;border-radius:10px;font-size:.875rem;font-weight:500;color:${currentCategoryFilter===c?'#7C3AED':'var(--muted)'};background:${currentCategoryFilter===c?'rgba(124,58,237,.08)':'var(--inp)'};border:1.5px solid ${currentCategoryFilter===c?'#7C3AED':'transparent'};cursor:pointer;">${escapeHtml(c)}</button>`
                    ).join('');
                de.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => { closeFilterDrawer();
                        filterCategory(btn.textContent.trim()); });
                });
            }

            function showToast(msg, d = 2000) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.style.background = 'var(--bg3)';
                t.style.color = 'var(--text)';
                t.style.border = '1px solid var(--brd2)';
                t.classList.add('opacity-100');
                t.classList.remove('opacity-0', 'pointer-events-none');
                clearTimeout(t._t);
                t._t = setTimeout(() => { t.classList.add('opacity-0', 'pointer-events-none');
                    t.classList.remove('opacity-100'); }, d);
            }

            function openLightbox(src) {
                const modal = document.getElementById('lightbox'),
                    img = document.getElementById('lightbox-img');
                img.src = src;
                modal.classList.add('show');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                document.getElementById('lightbox').classList.remove('show');
                document.body.style.overflow = '';
            }

            // ───────────────────────────────────────────────────────────────
            // PULL TO REFRESH
            // ───────────────────────────────────────────────────────────────
            function setupPullToRefresh() {
                let sy = 0,
                    sx = 0,
                    pulling = false;
                const ind = document.getElementById('pull-indicator'),
                    pt = document.getElementById('pull-text'),
                    pi = document.getElementById('pull-icon');
                document.addEventListener('touchstart', e => { sy = e.touches[0].clientY;
                    sx = e.touches[0].clientX; }, { passive: true });
                document.addEventListener('touchmove', e => {
                    if (window.scrollY > 0) return;
                    const dy = e.touches[0].clientY - sy,
                        dx = Math.abs(e.touches[0].clientX - sx);
                    if (dx > 30) return;
                    if (dy > 55) { pulling = true;
                        ind.classList.add('visible'); if (dy > 120) { ind.classList.add(
                            'releasing');
                            pt.textContent = 'Release to refresh';
                            pi.style.transform = 'rotate(180deg)'; } else { ind.classList
                                .remove('releasing');
                            pt.textContent = 'Pull down to refresh';
                            pi.style.transform = 'rotate(0deg)'; } } else { pulling = false;
                        ind.classList.remove('visible', 'releasing'); }
                }, { passive: true });
                document.addEventListener('touchend', () => {
                    if (pulling) { pulling = false;
                        ind.classList.remove('visible', 'releasing');
                        pt.textContent = 'Pull down to refresh';
                        pi.style.transform = 'rotate(0deg)';
                        document.getElementById('refresh-spinner').classList.remove('hidden');
                        setTimeout(() => document.getElementById('refresh-spinner').classList
                            .add('hidden'), 1000);
                        refreshHome();
                    }
                });
            }

            function setupKeyboardAvoidance() {
                if (!window.visualViewport) return;
                const vv = window.visualViewport;

                function adjust() {
                    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
                    const gcb = document.getElementById('global-comment-bar'),
                        ecb = document.getElementById('explore-comment-bar');
                    if (gcb) gcb.style.bottom = kb + 'px';
                    if (ecb) ecb.style.bottom = kb + 'px';
                    if (kb > 0) {
                        const active = document.activeElement;
                        if (active && (active.id === 'global-comment-textarea' || active.id ===
                                'explore-comment-textarea')) {
                            setTimeout(() => active.scrollIntoView({ block: 'center',
                                behavior: 'smooth' }), 60);
                        }
                    }
                }
                vv.addEventListener('resize', adjust);
                vv.addEventListener('scroll', adjust);
            }

            // ───────────────────────────────────────────────────────────────
            // LOAD DATA FROM SUPABASE
            // ───────────────────────────────────────────────────────────────
            async function reloadData() {
                await reloadPosts();
                await loadMarketItems();
                await loadFollows();
                await loadBookmarks();
                await loadShares();
                return appData;
            }

            // ───────────────────────────────────────────────────────────────
            // INIT
            // ───────────────────────────────────────────────────────────────
            async function init() {
                if (window.AuthUser && window.AuthUser.getCurrentUser) {} else {
                    await new Promise(resolve => setTimeout(resolve, 300));
                }

                updateNavAvatar();
                if (typeof registerCurrentUserInDirectory === 'function') {
                    registerCurrentUserInDirectory();
                }
                await reloadData();

                document.getElementById('topMsgBtn').addEventListener('click', () => {
                    window.location.href = 'chat.html';
                });

                document.getElementById('logo-text').addEventListener('click', refreshHome);

                document.getElementById('tab-foryou').addEventListener('click', () => setTab('foryou'));

                const bottomHome = document.getElementById('bottomHomeBtn');
                if (bottomHome) {
                    bottomHome.addEventListener('click', function(e) {
                        e.preventDefault();
                        refreshHome();
                    });
                }

                document.getElementById('tab-explore').addEventListener('click', () => setTab('explore'));
                document.getElementById('tab-market').addEventListener('click', () => setTab('market'));

                document.getElementById('filter-backdrop').addEventListener('click', closeFilterDrawer);
                document.getElementById('drawer-close-btn').addEventListener('click', closeFilterDrawer);
                document.getElementById('clear-filter-btn').addEventListener('click', () => { closeFilterDrawer();
                    currentCategoryFilter = '';
                    currentSortMethod = 'foryou';
                    uiPage = 'home';
                    renderUI(); });

                document.getElementById('global-comment-textarea').addEventListener('input', function() { this
                        .style.height = 'auto';
                    this.style.height = Math.min(this.scrollHeight, 100) + 'px'; });
                document.getElementById('global-comment-textarea').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                        submitCommentFromBar(); }
                });
                document.getElementById('global-comment-submit-btn').addEventListener('click',
                    submitCommentFromBar);
                document.getElementById('reply-cancel-btn').addEventListener('click', cancelReply);

                document.getElementById('explore-comment-textarea').addEventListener('input', function() { this
                        .style.height = 'auto';
                    this.style.height = Math.min(this.scrollHeight, 100) + 'px'; });
                document.getElementById('explore-comment-textarea').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                        submitExploreComment(); }
                });
                document.getElementById('explore-comment-submit-btn').addEventListener('click',
                    submitExploreComment);
                document.getElementById('explore-reply-cancel-btn').addEventListener('click',
                cancelExploreReply);
                document.getElementById('explore-back-btn').addEventListener('click', closeExploreFullscreen);

                document.getElementById('market-fullscreen-back-btn').addEventListener('click',
                    closeMarketFullscreen);
                document.getElementById('market-filter-back-btn').addEventListener('click',
                    closeMarketFilterModal);
                document.getElementById('market-filter-clear-btn').addEventListener('click', () => {
                    marketCategoryFilter = '';
                    closeMarketFilterModal();
                    filterMarketCategory('');
                });

                document.getElementById('lightbox').addEventListener('click', function(e) { if (e.target ===
                        this || e.target.classList.contains('lightbox-close')) closeLightbox(); });
                document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);

                document.getElementById('webview-close-btn').addEventListener('click', closeInAppWebView);
                document.getElementById('external-browser-btn').addEventListener('click', () => { if (window
                        ._currentWebviewUrl) window.open(window._currentWebviewUrl, '_blank'); });
                document.getElementById('inapp-webview-overlay').addEventListener('click', function(e) { if (
                        e.target === this) closeInAppWebView(); });

                document.getElementById('share-close-btn').addEventListener('click', closeShareModal);
                document.getElementById('share-modal').addEventListener('click', function(e) {
                    if (e.target === this) closeShareModal();
                });
                document.querySelectorAll('.share-option').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const action = btn.dataset.share;
                        if (action) handleShareAction(action);
                    });
                });

                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape') {
                        closeLightbox();
                        closeInAppWebView();
                        closeShareModal();
                        if (document.getElementById('market-fullscreen').classList.contains('open'))
                            closeMarketFullscreen();
                        if (document.getElementById('market-filter-modal').classList.contains(
                            'open')) closeMarketFilterModal();
                        if (document.getElementById('explore-fullscreen').classList.contains(
                            'open')) closeExploreFullscreen();
                        closeFilterDrawer();
                    }
                });

                window.addEventListener('scroll', handleNavScroll, { passive: true });

                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        reloadData().then(() => {
                            if (uiPage === 'home' || uiPage === 'explore' || uiPage ===
                                'market') {
                                renderUI();
                            } else if (uiPage === 'single-post-explore' && currentPostId) {
                                const post = allPosts.find(p => p.id === currentPostId);
                                if (post) {
                                    const cl = document.getElementById('comments-list');
                                    if (cl) {
                                        const vc = getVisibleComments(currentPostId);
                                        const ac = post.comments.filter(c => c.approved !==
                                            false);
                                        cl.innerHTML = renderCommentsHTML(ac,
                                        currentPostId, vc);
                                    }
                                    updateCommentCount(currentPostId);
                                }
                            }
                        });
                    }
                });

                window.addEventListener('storage', (e) => {
                    if (e.key === UK || e.key === BK || e.key === FOLLOW_KEY) {
                        // only UI state; we can ignore heavy reloads
                    }
                });

                // Setup Realtime for profile updates
                if (window.sb) {
                    const channel = window.sb.channel('profile-updates')
                        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' },
                            (payload) => {
                                const updated = payload.new;
                                if (typeof window.updateAuthorUI === 'function') {
                                    window.updateAuthorUI(updated);
                                }
                                // Update in-memory data
                                allPosts = allPosts.map(post => {
                                    if (post.user_id === updated.id) {
                                        post.profile = { ...post.profile, ...updated };
                                        // author will be re-computed when rendering
                                    }
                                    return post;
                                });
                            })
                        .subscribe();
                }

                const urlParams = new URLSearchParams(window.location.search);
                const postIdParam = urlParams.get('post');
                if (postIdParam) {
                    const id = postIdParam;
                    if (allPosts.some(p => p.id === id)) {
                        setTimeout(() => { openExplorePost(id, 'home');
                            history.replaceState({}, '', window.location.pathname); }, 400);
                    }
                }

                renderUI();
                setupPullToRefresh();
                setupKeyboardAvoidance();
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();

            window.toggleReaction = toggleReaction;
            window.openExplorePost = openExplorePost;
            window.closeExploreFullscreen = closeExploreFullscreen;
            window.showToast = showToast;
            window.toggleYtControls = toggleYtControls;
            window.initYtListener = initYtListener;
            window.seekYoutube = seekYoutube;
            window.toggleFollowHandler = toggleFollowHandler;
            window.openShareModal = openShareModal;
            window.closeShareModal = closeShareModal;
            window.reloadData = reloadData;
            window.refreshHome = refreshHome;

        })();
    </script>
</body>
</html>
