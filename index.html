                    return `<div class="media-carousel-slide" data-slide="${idx}">${contentHtml}</div>`;
                }).join('');

                let dotsHtml = '';
                if (items.length > 1) {
                    dotsHtml = `<div class="carousel-dots">${items.map((_, i) => 
                            `<div class="carousel-dot ${i === 0 ? 'active' : ''}" data-slide="${i}"></div>`

                return `
                    <div class="media-carousel" id="${carouselId}" data-slides="${items.length}" data-current="0">
                      <div class="media-carousel-track">${slidesHtml}</div>

            function initCarousel(carouselEl) {
                if (!carouselEl) return;
                const carouselId = carouselEl.id;
                const track = carouselEl.querySelector('.media-carousel-track');
                const slides = carouselEl.querySelectorAll('.media-carousel-slide');
                const dots = carouselEl.querySelectorAll('.carousel-dot');
                const leftArrow = carouselEl.querySelector('.carousel-arrow.left');
                const rightArrow = carouselEl.querySelector('.carousel-arrow.right');

                if (slides.length <= 1) return;

                let current = 0;
                const total = slides.length;
                let autoTimer = null;
                let arrowTimeout = null;

                function goToSlide(idx) {
                    current = (idx + total) % total;
                    track.style.transform = `translateX(-${current * 100}%)`;
                    dots.forEach((d, i) => d.classList.toggle('active', i === current));
                    resetAutoTimer();
                }

                function nextSlide() { goToSlide(current + 1); }

                function resetAutoTimer() {
                    if (autoTimer) { clearInterval(autoTimer);
                        autoTimer = null; }
                    autoTimer = setInterval(nextSlide, 3000);
                }

                dots.forEach((dot, i) => {
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goToSlide(i);
                        showArrowsTemporarily();
                    });
                });

                if (leftArrow) {
                    leftArrow.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goToSlide(current - 1);
                        showArrowsTemporarily();
                    });
                }
                if (rightArrow) {
                    rightArrow.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goToSlide(current + 1);
                        showArrowsTemporarily();
                    });
                }

                function showArrowsTemporarily() {
                    if (leftArrow) leftArrow.classList.remove('hidden');
                    if (rightArrow) rightArrow.classList.remove('hidden');
                    if (arrowTimeout) clearTimeout(arrowTimeout);
                    arrowTimeout = setTimeout(() => {
                        if (leftArrow) leftArrow.classList.add('hidden');
                        if (rightArrow) rightArrow.classList.add('hidden');
                    }, 3000);
                }

                setTimeout(showArrowsTemporarily, 500);

                let startX = 0;
                let isDragging = false;
                carouselEl.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    isDragging = true;
                }, { passive: true });
                carouselEl.addEventListener('touchend', (e) => {
                    if (!isDragging) return;
                    isDragging = false;
                    const endX = e.changedTouches[0].clientX;
                    const diff = startX - endX;
                    if (Math.abs(diff) > 30) {
                        if (diff > 0) goToSlide(current + 1);
                        else goToSlide(current - 1);
                        showArrowsTemporarily();
                    }
                }, { passive: true });

                resetAutoTimer();

                carouselEl._cleanup = function() {
                    if (autoTimer) clearInterval(autoTimer);
                    if (arrowTimeout) clearTimeout(arrowTimeout);
                };
            }

            function initAllCarousels(scope) {
                const root = scope || document;
                root.querySelectorAll('.media-carousel').forEach(el => {
                    if (el._inited) return;
                    el._inited = true;
                    initCarousel(el);
                });
            }

            // ───────────────────────────────────────────────────────────────

            let videoObserver = null;
            let currentlyPlayingVideo = null;
            let exploreVideoObserver = null;

            function pauseAllVideos() {
                document.querySelectorAll('video').forEach(vid => {
                    if (vid.plyr) { vid.plyr.pause(); } else { vid.pause(); }
                });
                document.querySelectorAll('iframe').forEach(iframe => {
                    if (iframe.src && iframe.src.includes('youtube.com/embed')) {
                        const idx = iframe.id.replace('yt-', '');
                        if (ytState[idx] && ytState[idx].playing) {
                            ytPostMessage(idx, 'pauseVideo');
                            ytState[idx].playing = false;
                            _showYtPauseIcon(idx, false);
                        }
                    }
                });
                currentlyPlayingVideo = null;
            }

            function setupVideoAutoplay(scope) {
                if (videoObserver) videoObserver.disconnect();
                const searchRoot = scope || document;
                const videoElements = searchRoot.querySelectorAll('.ig-video-wrap video, .video-container video, .media-carousel-slide video');

                videoObserver = new IntersectionObserver((entries) => {
                    let visibleVideo = null;
                    for (const entry of entries) {
                        if (entry.isIntersecting && entry.intersectionRatio >= 0.75) {
                            visibleVideo = entry.target;
                            break;
                        }
                    }

                    searchRoot.querySelectorAll('.ig-video-wrap video, .video-container video, .media-carousel-slide video')
                        .forEach(vid => {
                            if (vid === visibleVideo) return;
                            if (vid.plyr) { vid.plyr.pause(); } else { vid.pause(); }
                            if (currentlyPlayingVideo === vid) currentlyPlayingVideo = null;
                        });

                    searchRoot.querySelectorAll('.ig-video-wrap iframe, .media-carousel-slide iframe').forEach(
                        iframe => {
                            const idx = iframe.id.replace('yt-', '');
                            if (ytState[idx] && ytState[idx].playing) {
                                ytPostMessage(idx, 'pauseVideo');
                                ytState[idx].playing = false;
                                _showYtPauseIcon(idx, false);
                                if (currentlyPlayingVideo === idx) currentlyPlayingVideo = null;
                            }
                        });

                    if (visibleVideo) {
                        if (visibleVideo.plyr) {
                            if (currentlyPlayingVideo !== visibleVideo) {
                                visibleVideo.plyr.play().catch(() => {});
                                currentlyPlayingVideo = visibleVideo;
                            }
                        } else {
                            if (currentlyPlayingVideo !== visibleVideo) {
                                visibleVideo.play().catch(() => {});
                                currentlyPlayingVideo = visibleVideo;
                            }
                        }
                    }
                }, { threshold: 0.75, rootMargin: '0px 0px -20px 0px' });

                videoElements.forEach(vid => videoObserver.observe(vid));
            }

            // ───────────────────────────────────────────────────────────────
            // EXPLORE GRID VIDEO AUTOPLAY
            // ───────────────────────────────────────────────────────────────

            function setupExploreVideoAutoplay(container) {
                if (exploreVideoObserver) exploreVideoObserver.disconnect();
                const videoEls = container.querySelectorAll('video.explore-card-thumb');
                if (!videoEls.length) return;

                exploreVideoObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const vid = entry.target;
                        if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
                            vid.play().catch(() => {});
                        } else {
                            vid.pause();
                        }
                    });
                }, { threshold: [0, 0.6, 1] });

                videoEls.forEach(vid => exploreVideoObserver.observe(vid));
            }

            async function loadFollows() {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { followingSet = new Set();
                    followerSet = new Set(); return; }
                try {
                    const [followingRes, followerRes] = await Promise.all([
                        window.sb.from('follows').select('following_id').eq('follower_id', user.id),
                        window.sb.from('follows').select('follower_id').eq('following_id', user.id)
                    ]);
                    if (!followingRes.error) followingSet = new Set(followingRes.data.map(f => f.following_id));
                    if (!followerRes.error) followerSet = new Set(followerRes.data.map(f => f.follower_id));
                } catch (e) { console.warn('loadFollows error:', e); }
            }

            async function loadBookmarks() {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { bookmarksSet = new Set(); return; }
                try {
                    const { data, error } = await window.sb.from('bookmarks').select('post_id').eq('user_id', user.id);
                    if (!error) bookmarksSet = new Set(data.map(b => b.post_id));
                } catch (e) { console.warn('loadBookmarks error:', e); }
            }

            async function loadShares() {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { sharesSet = new Set(); return; }
                try {
                    const { data, error } = await window.sb.from('shares').select('post_id').eq('user_id', user.id);
                    if (!error) sharesSet = new Set(data.map(s => s.post_id));
                } catch (e) { console.warn('loadShares error:', e); }
            }

            function isFollowedByMe(userId) { return followingSet.has(userId); }

            function doesFollowMe(userId) { return followerSet.has(userId); }

            function getRelationshipState(userId) {
                const iFollowThem = isFollowedByMe(userId);
                const theyFollowMe = doesFollowMe(userId);
                if (iFollowThem && theyFollowMe) return 'friends';
                if (iFollowThem) return 'following';
                if (theyFollowMe) return 'follow-back';
                return 'follow';
            }

            async function toggleFollowUser(userId) {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { showToast('Please sign in to follow', 'o'); return false; }
                const currently = isFollowedByMe(userId);
                try {
                    if (currently) {
                        await window.sb.from('follows').delete().eq('follower_id', user.id).eq('following_id', userId);
                        followingSet.delete(userId);
                    } else {
                        await window.sb.from('follows').insert({ follower_id: user.id, following_id: userId });
                        followingSet.add(userId);
                    }
                    return !currently;
                } catch (err) {
                    showToast(err.message, 'r');
                    return currently;
                }
            }

            function isBookmarked(postId) { return bookmarksSet.has(postId); }

            async function toggleBookmark(postId) {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { showToast('Please sign in to bookmark', 'o'); return false; }
                const currently = isBookmarked(postId);
                try {
                    if (currently) {
                        await window.sb.from('bookmarks').delete().eq('user_id', user.id).eq('post_id', postId);
                        bookmarksSet.delete(postId);
                    } else {
                        await window.sb.from('bookmarks').insert({ user_id: user.id, post_id: postId });
                        bookmarksSet.add(postId);
                    }
                    return !currently;
                } catch (err) {
                    showToast(err.message, 'r');
                    return currently;
                }
            }

            function isShared(postId) { return sharesSet.has(postId); }

            async function toggleShare(postId) {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { showToast('Please sign in to share', 'o'); return false; }
                const currently = isShared(postId);
                try {
                    if (currently) {
                        await window.sb.from('shares').delete().eq('user_id', user.id).eq('post_id', postId);
                        sharesSet.delete(postId);
                    } else {
                        await window.sb.from('shares').insert({ user_id: user.id, post_id: postId });
                        sharesSet.add(postId);
                    }
                    return !currently;
                } catch (err) {
                    showToast(err.message, 'r');
                    return currently;
                }
            }

            async function loadMarketSubcategoriesForCategory(categoryId) {
                if (!window.CategoryAPI) return [];

            async function loadMarketListings() {
                if (!window.ListingsAPI) return;
                try {
                    const result = await window.ListingsAPI.getListings({ status: 'active', limit: 100 });
                    marketListings = result.data.map(item => {
                        let images = [];
                        if (Array.isArray(item.images)) {
                            images = item.images.map(img => {
                                return typeof img === 'object' && img !== null ? (img.url || '') :
                                String(img);
                            }).filter(Boolean);
                        } else if (typeof item.images === 'string') {
                            try {
                                const parsed = JSON.parse(item.images);
                                if (Array.isArray(parsed)) {
                                    images = parsed.map(img => typeof img === 'object' && img !== null ? (img
                                        .url || '') : String(img)).filter(Boolean);
                                } else {
                                    images = [item.images];
                                }
                            } catch (e) {
                                images = [item.images];
                            }
                        } else {
                            images = [];
                        }
                        return {
                            id: item.id,
                            title: item.title,
                            price: item.price,
                            priceFormatted: '₦' + Number(item.price).toLocaleString(),
                            category: item.market_categories ? item.market_categories.name : 'General',
                            subcategory: item.market_subcategories ? item.market_subcategories.name :
                            'General',
                            seller: item.profiles ? (item.profiles.display_name || item.profiles.username) :
                                'Unknown',
                            sellerImg: item.profiles ? (item.profiles.avatar_url || '') : '',
                            sellerId: item.seller_id,
                            images: images,
                            location: item.location || 'Nigeria',
                            featured: item.featured || false,
                            description: item.description || '',
                            created_at: item.created_at,
                            whatsapp: item.whatsapp || '',
                            profiles: item.profiles || {},
                            market_categories: item.market_categories || {},
                            market_subcategories: item.market_subcategories || {},
                        };
                    });
                } catch (e) {
                    console.error('Error loading market listings:', e);
                    marketListings = [];
                }
            }

                        <button onclick="selectMarketCategory('${cat.name.replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-xl text-xs font-bold flex-shrink-0 transition ${isSelected ? 'bg-brand-600 text-white shadow-md shadow-brand-500/20' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
                            ${cat.name}
                        </button>
                    `;
                });

                    subBar.classList.add('hidden');

                subBar.classList.remove('hidden');
                let subHtml = `
                    <button onclick="selectMarketSubcategory('All')" class="px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0 transition ${activeMarketSubcategory === 'All' ? 'bg-brand-100 text-brand-600' : 'bg-gray-100 text-gray-600'}">

                    subHtml += `
                        <button onclick="selectMarketSubcategory('${sub.name.replace(/'/g, "\\'")}')" class="px-3 py-1.5 rounded-lg text-xs font-medium flex-shrink-0 transition ${isSelected ? 'bg-brand-100 text-brand-600 font-bold' : 'bg-gray-100 text-gray-600'}">
                            ${sub.name}
                        </button>
                    `;
                });

            function selectMarketCategory(cat) {
                activeMarketCategory = cat;
                activeMarketSubcategory = 'All';
                renderMarketCategoryBars();
                applyMarketFiltersAndRender();
                if (cat !== 'All') {
                    const catObj = marketCategories.find(c => c.name === cat);
                    if (catObj) {
                        loadMarketSubcategoriesForCategory(catObj.id).then(subs => {
                            marketSubcategories = subs;
                            renderMarketCategoryBars();
                            applyMarketFiltersAndRender();
                        });
                    }
                } else {
                    marketSubcategories = [];
                    renderMarketCategoryBars();
                    applyMarketFiltersAndRender();
                }
            }

            function selectMarketSubcategory(sub) {
                activeMarketSubcategory = sub;
                renderMarketCategoryBars();
                applyMarketFiltersAndRender();
            }

            function applyMarketFiltersAndRender() {
                let filtered = [...marketListings];
                if (activeMarketCategory !== 'All') {
                    filtered = filtered.filter(p => p.category === activeMarketCategory);
                    if (activeMarketSubcategory !== 'All') {
                        filtered = filtered.filter(p => p.subcategory === activeMarketSubcategory);
                    }
                }
                if (maxPriceFilter !== null && !isNaN(maxPriceFilter) && maxPriceFilter > 0) {
                    filtered = filtered.filter(p => p.price <= maxPriceFilter);
                }
                renderMarketProducts(filtered);
            }

                const newlyGrid = document.getElementById('newlyGrid');
                const emptyState = document.getElementById('emptyState');
                const featuredSection = document.getElementById('featuredSection');
                const newlySection = document.getElementById('newlySection');

                featuredGrid.innerHTML = '';
                newlyGrid.innerHTML = '';

                if (items.length === 0) {
                    emptyState.classList.remove('hidden');
                    emptyState.classList.add('flex');
                    featuredSection.classList.add('hidden');
                    newlySection.classList.add('hidden');
                    return;

                emptyState.classList.add('hidden');

                newlySection.classList.remove('hidden');

            async function toggleReaction(postId) {
                const post = appData.posts.find(p => p.id === postId);
                if (!post) return;

                document.querySelectorAll(`[data-post-id="${postId}"] .reaction-btn, [data-post-reactions="${postId}"] .reaction-btn`)
                    .forEach(btn => {
                        btn.classList.add('bounce-heart');
                        setTimeout(() => btn.classList.remove('bounce-heart'), 500);
                    });

                if (window.AuthUser && window.AuthUser.requireAuth) {
                    window.AuthUser.requireAuth(async () => {
                        try {
                            const { liked, count } = await window.PostsAPI.toggleLike(postId);
                            post.likedByMe = liked;
                            post.reactions.like = count;
                            appData.userReactions[postId + '-like'] = liked;
                            updateReactionsUI(postId);
                        } catch (err) {
                            showToast(err.message, 'r');
                        }
                    });
                } else {
                    showToast('Please sign in to like', 'o');
                }
            }

            function updateReactionsUI(postId) {
                const post = appData.posts.find(p => p.id === postId);
                if (!post) return;
                const reacted = !!post.likedByMe;
                document.querySelectorAll(`[data-post-reactions="${postId}"] .reaction-btn, [data-post-id="${postId}"] .reaction-btn`)
                    .forEach(btn => {
                        btn.classList.toggle('reacted', reacted);
                        const icon = btn.querySelector('.heart-icon-wrap');
                        if (icon) icon.innerHTML = svgHeart(reacted);
                        const cnt = btn.querySelector('.reaction-count');
                        if (cnt) cnt.textContent = formatCount(post.reactions.like || 0);
                    });
                document.querySelectorAll(`#comments-list .reaction-btn`).forEach(btn => {
                    const pid = btn.closest('[data-post-reactions]')?.dataset.postReactions;
                    if (pid == postId) {
                        btn.classList.toggle('reacted', reacted);
                        const icon = btn.querySelector('.heart-icon-wrap');
                        if (icon) icon.innerHTML = svgHeart(reacted);
                        const cnt = btn.querySelector('.reaction-count');
                        if (cnt) cnt.textContent = formatCount(post.reactions.like || 0);
                    }
                });

            function reportPostFromShare(postId) {
                const reason = prompt('Please describe why you are reporting this post:');
                if (reason && reason.trim().length > 0) {
                    if (window.PostsAPI && typeof window.PostsAPI.reportPost === 'function') {
                        window.PostsAPI.reportPost(postId, reason)
                            .then(() => {
                                showToast('Report submitted. Thank you for helping keep FreeUpper safe.', 'p');
                                closeShareModal();
                            })
                            .catch(err => showToast(err.message, 'r'));
                    } else {
                        const user = getCurrentUser();
                        if (!user || !user.isLoggedIn) { showToast('Please sign in', 'o'); return; }
                        window.sb.from('reports').insert({
                            reporter_id: user.id,
                            target_type: 'post',
                            target_id: postId,
                            reason: reason,
                            status: 'pending',
                            created_at: new Date().toISOString()
                        }).then(({ error }) => {
                            if (error) showToast('Error: ' + error.message, 'r');
                            else { showToast('Report submitted', 'p');

                    showToast('Report cancelled', 'o');

            // ───────────────────────────────────────────────────────────────
            // FEED / EXPLORE RENDER
            // ───────────────────────────────────────────────────────────────

            function getFilteredSortedPosts() {
                const currentUser = getCurrentUser();
                let p = [...allPosts];
                p = p.filter(post => {
                    if (post.user_id === currentUser.id) return true;
                    const profile = post.profile || {};
                    return !profile.is_private;
                });
                if (currentCategoryFilter) p = p.filter(p => p.category === currentCategoryFilter);
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    p = p.filter(p => p.title.toLowerCase().includes(q) || (p.content || '').toLowerCase()
                        .includes(q) || (p.description || '').toLowerCase().includes(q) || (p.tags && p.tags
                        .some(t => t.toLowerCase().includes(q))));
                }
                if (currentSortMethod === 'trending') p.sort((a, b) => (b.views || 0) - (a.views || 0));
                else if (currentSortMethod === 'foryou') {
                    const uc = getUserCategories();
                    p.sort((a, b) => {
                        const score = p => {
                            const ah = (Date.now() - new Date(p.timestamp || p.date)) / 36e5;
                            const commentCount = Array.isArray(p.comments) ? p.comments.filter(c => c
                                .approved !== false).length : (p.comments || 0);
                            const eg = (p.views || 0) + ((p.reactions.like || 0) * 2) + (commentCount *
                            2);
                            return eg / Math.pow(ah + 2, 1.5);
                        };
                        return (score(b) * (uc.includes(b.category) ? 1.4 : 1)) - (score(a) * (uc
                            .includes(a.category) ? 1.4 : 1));
                    });
                } else p.sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date));
                return p;
            }

            function getUserCategories() { const r = localStorage.getItem(UCK); return r ? JSON.parse(r) : []; }

            function renderFeedContainer() {
                const ps = getFilteredSortedPosts(),
                    hf = searchQuery || currentCategoryFilter;
                const hh = hf ?
                    `<div class="mb-4 px-4 pt-3"><h1 class="text-xl font-heading font-bold" style="color:var(--text);">${searchQuery?'Search results':currentCategoryFilter}</h1><p class="text-sm" style="color:var(--muted);">${ps.length} post(s)</p></div>` :
                    '';
                return `<div class="max-w-2xl mx-auto"><div>${hh}</div><div id="feed-container" class="px-0"></div></div>`;
            }

            function renderSkeletons(c = 3) {
                let h = '';
                for (let i = 0; i < c; i++) h +=
                    `<div class="skeleton-post"><div class="flex gap-3" style="padding:0 16px;"><div class="skeleton skeleton-avatar"></div><div style="flex:1;"><div class="skeleton skeleton-line" style="width:40%;height:10px"></div><div class="skeleton skeleton-title"></div>${i===0?'<div class="skeleton skeleton-image"></div>':''}<div class="skeleton skeleton-line" style="width:100%"></div><div class="skeleton skeleton-line" style="width:70%"></div><div class="skeleton skeleton-reactions"></div></div></div></div>`;
                return h;
            }

            function getSentinel() { if (!sentinel) { sentinel = document.createElement('div');
                    sentinel.id = 'sentinel';
                    sentinel.style.height = '1px'; } return sentinel; }

            function getLoader() { if (!loader) { loader = document.createElement('div');
                    loader.id = 'feed-loader';
                    loader.className = 'hidden';
                    loader.innerHTML =
                    '<div style="text-align:center;padding:20px;"><div class="spinner" style="margin:0 auto;"></div></div>'; } return loader; }

            function setupSentinel() { const co = document.getElementById('feed-container'); if (co && !co.contains(
                    getSentinel())) co.appendChild(getSentinel()); const l = getLoader(); if (co && !co.contains(l))
                    co.insertBefore(l, getSentinel()); }

            function setupInfiniteScroll() {
                if (observer) observer.disconnect();
                observer = new IntersectionObserver(es => { if (isTogglingContent || isLoadingMore) return; if (es[
                        0].isIntersecting) loadMorePosts(); }, { root: null, rootMargin: '200px',
                    threshold: 0 });
                observer.observe(getSentinel());
            }

            function initPlayers(root) {
                root.querySelectorAll('.ig-video-wrap video:not([data-plyr-init]), .video-container video:not([data-plyr-init]), .media-carousel-slide video:not([data-plyr-init])')
                    .forEach(vid => {
                        vid.dataset.plyrInit = 'true';
                        setupPlyrPlayer(vid);
                    });
                initAllCarousels(root);
                setTimeout(() => {
                    setupVideoAutoplay(root);
                    setTimeout(() => {
                        const visibleWraps = root.querySelectorAll(
                            '.ig-video-wrap, .video-container, .media-carousel');
                        let firstVisible = null;
                        for (const w of visibleWraps) {
                            const rect = w.getBoundingClientRect();
                            if (rect.top < window.innerHeight && rect.bottom > 0) {
                                firstVisible = w;
                                break;
                            }
                        }
                        if (firstVisible) {
                            const vid = firstVisible.querySelector('video');
                            if (vid && vid.plyr) {
                                vid.plyr.play().catch(() => {});
                                currentlyPlayingVideo = vid;
                            } else if (vid) {
                                vid.play().catch(() => {});
                                currentlyPlayingVideo = vid;
                            }
                            const ytIframe = firstVisible.querySelector('iframe');
                            if (ytIframe) {
                                const idx = ytIframe.id.replace('yt-', '');
                                if (!ytState[idx]) ytState[idx] = { muted: true,
                                playing: true };
                                if (!ytState[idx].playing) {
                                    ytPostMessage(idx, 'playVideo');
                                    ytState[idx].playing = true;
                                    _showYtPauseIcon(idx, true);
                                    _updateMuteBadge(idx);
                                    currentlyPlayingVideo = idx;
                                }
                            }
                        }
                    }, 400);
                }, 300);
            }

            function loadInitialFeed() {
                feedPage = 1;
                isLoadingMore = false;
                if (observer) observer.disconnect();
                const co = document.getElementById('feed-container');
                if (!co) return;
                co.innerHTML = renderSkeletons(3);
                setTimeout(() => {
                    const ps = getFilteredSortedPosts();
                    co.innerHTML = '';
                    if (ps.length === 0) { co.innerHTML =
                            '<div class="flex flex-col items-center justify-center py-20 text-center"><p class="text-sm" style="color:var(--muted);">No posts yet.</p></div>';
                        return; }
                    const fb = ps.slice(0, PAGE_SIZE);
                    co.innerHTML = fb.map((p, i) => buildPostHTML(p, i)).join('');
                    requestAnimationFrame(() => {
                        initPlayers(co);
                        setupSentinel();
                        setupInfiniteScroll();
                        co.querySelectorAll('article').forEach(a => setupPostEventDelegation(a));
                        window._currentFeedPosts = ps;
                    });
                }, 150);
            }

            function loadMorePosts() {
                if (isLoadingMore) return;
                const ps = window._currentFeedPosts || getFilteredSortedPosts();
                const start = feedPage * PAGE_SIZE,
                    nb = ps.slice(start, start + PAGE_SIZE);
                if (nb.length === 0) { if (observer && sentinel) observer.unobserve(sentinel); return; }
                isLoadingMore = true;
                const co = document.getElementById('feed-container'),
                    s = getSentinel();
                const t = document.createElement('div');
                t.innerHTML = nb.map((p, i) => buildPostHTML(p, start + i)).join('');
                while (t.firstChild) co.insertBefore(t.firstChild, s);
                requestAnimationFrame(() => {
                    initPlayers(co);
                    co.querySelectorAll('article:not([data-events-set])').forEach(a => { setupPostEventDelegation(
                            a);
                        a.dataset.eventsSet = 'true'; });
                    feedPage++;
                    isLoadingMore = false;
                });
            }

            function setupPostEventDelegation(article) {
                article.addEventListener('click', function(e) {
                    const t = e.target,
                        pid = article.dataset.postId;
                    if (t.classList.contains('read-more-btn')) { e.stopPropagation();
                        toggleReadMore(article); return; }
                    if (t.closest('.reaction-btn')) { e.stopPropagation();
                        toggleReaction(pid); return; }
                    if (t.closest('.bookmark-badge')) { e.stopPropagation();
                        toggleBookmarkUI(article); return; }
                    if (t.closest('.share-btn')) {
                        e.stopPropagation();
                        const btn = t.closest('.share-btn');
                        const postId = btn.dataset.sharePost || pid;
                        btn.classList.add('share-bounce');
                        setTimeout(() => btn.classList.remove('share-bounce'), 450);
                        openShareModal(postId);
                        return;
                    }
                    if (t.closest('.comment-btn')) { e.stopPropagation();
                        openExplorePost(pid, 'home', true); return; }
                    if (t.closest('.user-mini-avatar') || t.closest('.font-bold.text-sm')) {
                        e.stopPropagation();
                        const p = allPosts.find(p => p.id === pid);
                        if (p && p.user_id) navigateToProfile(p.user_id);
                        return;
                    }
                    if (t.closest('[data-full-img]')) {
                        const c = t.closest('[data-full-img]');
                        e.stopPropagation();
                        openLightbox(c.dataset.fullImg);
                        return;
                    }
                    if (t.closest('[data-extlink]')) { e.stopPropagation();
                        openInAppWebView(decodeURIComponent(t.closest('[data-extlink]').dataset
                        .extlink)); return; }
                    if (t.closest('.carousel-arrow') || t.closest('.carousel-dot')) { e.stopPropagation(); return; }
                    if (t.closest('.tag-badge')) { e.stopPropagation();
                        const tag = t.textContent.replace('#', '').trim();
                        if (tag) openTagsModal(tag);
                        return; }
                    const now = Date.now(),
                        gap = now - lastDoubleTapTime;
                    if (gap < 300 && gap > 0) {
                        e.preventDefault();
                        toggleReaction(pid);
                        lastDoubleTapTime = 0;
                        return;
                    }
                    lastDoubleTapTime = now;
                    setTimeout(() => {
                        if (lastDoubleTapTime === now) {
                            openExplorePost(pid, 'home');
                        }
                    }, 300);
                });
            }

            function toggleReadMore(article) {
                isTogglingContent = true;
                const pid = article.dataset.postId;
                const pv = article.querySelector(`.preview-text-${pid}`),
                    fl = article.querySelector(`.full-text-${pid}`),
                    b = article.querySelector('.read-more-btn');
                if (!pv || !fl) { isTogglingContent = false; return; }
                if (fl.classList.contains('hidden')) { pv.classList.add('hidden');
                    fl.classList.remove('hidden');
                    b.textContent = 'Show less'; } else { pv.classList.remove('hidden');
                    fl.classList.add('hidden');
                    b.textContent = 'Show more'; }
                isTogglingContent = false;
            }

            async function toggleBookmarkUI(article) {
                const pid = article.dataset.postId;
                const nb = await toggleBookmark(pid);
                article.querySelectorAll('.bookmark-badge').forEach(el => {
                    el.classList.toggle('bookmarked', nb);
                    el.innerHTML = bookmarkIcon(nb);
                    el.classList.add('bookmark-breathe');
                    setTimeout(() => el.classList.remove('bookmark-breathe'), 400);
                });
                document.querySelectorAll(`#single-bookmark-${pid}`).forEach(el => {
                    el.classList.toggle('bookmarked', nb);
                    el.innerHTML = bookmarkIcon(nb);
                });
                showToast(nb ? 'Saved' : 'Removed from saved');
            }

            function filterCategory(c) { currentCategoryFilter = c;
                searchQuery = '';
                feedPage = 1;
                uiPage = 'home';
                currentSortMethod = 'trending';
                renderUI(); }

            // ───────────────────────────────────────────────────────────────
            // SHARE MODAL (with Report & Delete)
            // ───────────────────────────────────────────────────────────────

            let sharePostId = null;

            function openShareModal(postId) {
                sharePostId = postId;
                const modal = document.getElementById('share-modal');
                // Show/hide delete and report buttons based on ownership
                const post = allPosts.find(p => p.id === postId);
                const cu = getCurrentUser();
                const isOwner = post && cu && cu.isLoggedIn && post.user_id === cu.id;
                const deleteBtn = document.getElementById('share-delete-btn');
                const reportBtn = document.getElementById('share-report-btn');
                if (deleteBtn) deleteBtn.style.display = isOwner ? 'flex' : 'none';
                if (reportBtn) reportBtn.style.display = isOwner ? 'none' : 'flex';
                modal.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeShareModal() {
                document.getElementById('share-modal').classList.remove('open');
                document.body.style.overflow = '';
                sharePostId = null;
            }

            function handleShareAction(action) {
                if (!sharePostId) return;
                const post = allPosts.find(p => p.id === sharePostId);
                if (!post) { showToast('Post not found'); return; }
                const url = `${window.location.origin}${window.location.pathname}?post=${sharePostId}`;
                const title = post.title || 'FreeUpper post';

                toggleShare(sharePostId).then(shared => {
                    post.shareCount = Math.max(0, (post.shareCount || 0) + (shared ? 1 : -1));
                    document.querySelectorAll(
                            `article[data-post-id="${sharePostId}"] .share-btn, #single-share-btn[data-share-post="${sharePostId}"]`
                            )
                        .forEach(el => {
                            el.classList.toggle('shared', shared);
                            const cnt = el.querySelector('.share-count');
                            if (cnt) cnt.textContent = formatCount(post.shareCount);
                        });
                    if (action === 'profile') {
                        showToast('Shared to your profile! ✨');
                        closeShareModal();
                    } else if (action === 'copy') {
                        navigator.clipboard.writeText(url).then(() => {
                            showToast('Link copied to clipboard 📋');
                            closeShareModal();
                        }).catch(() => {
                            showToast('Could not copy link');
                            closeShareModal();
                        });
                    } else if (action === 'native') {
                        if (navigator.share) {
                            navigator.share({ title: title, text: title, url: url }).catch(() => {});
                        } else {
                            navigator.clipboard.writeText(url).then(() => {
                                showToast('Link copied to clipboard 📋');
                                closeShareModal();
                            });
                        }
                        closeShareModal();
                    } else if (action === 'more') {
                        navigator.clipboard.writeText(url).then(() => {
                            showToast('Link copied to clipboard 📋');
                            closeShareModal();
                        }).catch(() => {
                            showToast('Could not copy link');
                            closeShareModal();
                        });
                    }
                });
            }

            // ───────────────────────────────────────────────────────────────
            // COMMENTS
            // ───────────────────────────────────────────────────────────────

            function getAllDescendants(pid, comments) { const r = [];
                const dc = comments.filter(c => c.parentId === pid); for (const c of dc) { r.push(c);
                    r.push(...getAllDescendants(c.id, comments)); } return r; }

            function findTopAncestorId(commentId, comments) {
                let current = comments.find(c => c.id === commentId);
                if (!current) return commentId;
                while (current.parentId) {
                    const parent = comments.find(c => c.id === current.parentId);
                    if (!parent) break;
                    current = parent;
                }
                return current.id;
            }

            function getCommentsVisible() { const r = localStorage.getItem(CVK); return r ? JSON.parse(r) : {}; }

            function getVisibleComments(postId) { return getCommentsVisible()[postId] || INITIAL_COMMENT_DISPLAY; }

            function setCommentsVisible(postId, count) { const cv = getCommentsVisible();
                cv[postId] = count;
                localStorage.setItem(CVK, JSON.stringify(cv)); }

            function commentSkeletons(count = 3) {
                let h = '';
                for (let i = 0; i < count; i++) {
                    h += `<div class="comment-skeleton">
                            <div class="skeleton-avatar-sm"></div>
                            <div style="flex:1;">
                              <div class="skeleton-line-sm w70"></div>
                              <div class="skeleton-line-sm w90"></div>
                              <div class="skeleton-line-sm w50"></div>
                            </div>
                          </div>`;
                }
                return h;
            }

            function renderCommentsHTML(comments, postId, vc) {
                const tl = comments.filter(c => c.parentId === null);
                if (tl.length === 0) return '<p class="text-sm py-8 text-center" style="color:var(--muted);">No replies yet. Be the first.</p>';
                const sh = tl.slice(0, vc),
                    hi = tl.length > vc;
                let h = sh.map(c => renderCommentThread(c, comments, postId)).join('');
                if (hi) h +=
                    `<button type="button" class="view-replies-btn load-more-comments-btn" style="margin-left:0;" data-post-id="${postId}">${svgChevronDown()} View ${formatCount(tl.length-vc)} more repl${tl.length-vc!==1?'ies':'y'}</button>`;
                return h;
            }

            function renderCommentThread(c, allComments, postId) {
                const author = window.getAuthorFromProfile(c.profile);
                const username = author.name;
                const avatar = author.avatar;
                const verifiedStatus = author.verified_status;

                const ds = getAllDescendants(c.id, allComments),
                    hr = ds.length > 0,
                    ec = expandedThreads.get(c.id) || 0;
                let rh = '';
                if (hr && ec > 0) {
                    const sh = ds.slice(0, ec),
                        rm = ds.length - ec;
                    rh = `<div class="replies-thread">${sh.map(r=>renderReplyItem(r,allComments,postId)).join('')}</div>`;
                    if (rm > 0) rh +=
                        `<button type="button" class="view-replies-btn expand-replies-btn" data-comment-id="${c.id}" data-post-id="${postId}">${svgChevronDown()} View ${formatCount(rm)} more repl${rm!==1?'ies':'y'}</button>`;
                    else rh +=
                        `<button type="button" class="hide-replies-btn collapse-replies-btn" data-comment-id="${c.id}" data-post-id="${postId}">${svgChevronUp()} Hide replies</button>`;
                } else if (hr && ec === 0) {
                    rh =
                        `<button type="button" class="view-replies-btn expand-replies-btn" data-comment-id="${c.id}" data-post-id="${postId}">${svgChevronDown()} View ${formatCount(ds.length)} repl${ds.length!==1?'ies':'y'}</button>`;
                }
                const lc = parseInt(localStorage.getItem('comment-like-' + c.id) || '0'),
                    isL = lc > 0,
                    il = c.message.length > 220;
                const avatarHtml = avatar ?
                    `<img src="${avatar}" alt="">` :
                    username.charAt(0).toUpperCase();
                const avatarClass = avatar ? 'comment-avatar has-image' : 'comment-avatar';
                const badgeHtml = window.getVerifiedBadgeHTML ? window.getVerifiedBadgeHTML(verifiedStatus) : '';
                const renderedMsg = window.Mentions ? window.Mentions.renderMentions(c.message, c.mentions || []) : escapeHtml(c.message);

                return `<div class="comment-item" data-comment-id="${c.id}">
                        <div class="${avatarClass}" data-username="${escapeHtml(username)}">${avatarHtml}</div>
                        <div class="comment-body">
                          <div class="comment-username">${escapeHtml(username)} ${badgeHtml}</div>
                          <div class="comment-text${il?' collapsed':''}" data-cid="${c.id}">${renderedMsg}</div>
                          ${il?`<button class="comment-show-more">Show more</button>`:''}
                          <div class="comment-meta">
                            <span class="comment-time">${formatRelativeTime(c.time)}</span>
                            <button class="comment-reply-btn" data-post-id="${postId}">Reply</button>
                            <button class="comment-like-btn ${isL?'liked':''}" data-comment-id="${c.id}">
                              <svg viewBox="0 0 24 24" fill="${isL?'#DC2626':'none'}" stroke="${isL?'#DC2626':'currentColor'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                              <span class="like-count">${lc>0?lc:''}</span>
                            </button>
                          </div>
                        </div>
                      </div>${rh}`;
            }

            function renderReplyItem(r, allComments, postId) {
                const author = window.getAuthorFromProfile(r.profile);
                const username = author.name;
                const avatar = author.avatar;
                const verifiedStatus = author.verified_status;

                const lc = parseInt(localStorage.getItem('comment-like-' + r.id) || '0'),
                    isL = lc > 0;
                const pc = allComments.find(c => c.id === r.parentId),
                    ru = pc ? (pc.profile ? pc.profile.display_name : '') : '';
                const mn = (ru && ru !== username) ? `<span style="color:#7C3AED;font-weight:600;">@${escapeHtml(ru)}</span> ` :
                    '';
                const il = r.message.length > 220;
                const avatarHtml = avatar ?
                    `<img src="${avatar}" alt="">` :
                    username.charAt(0).toUpperCase();
                const avatarClass = avatar ? 'reply-avatar-dot has-image' : 'reply-avatar-dot';
                const badgeHtml = window.getVerifiedBadgeHTML ? window.getVerifiedBadgeHTML(verifiedStatus) : '';
                const renderedMsg = window.Mentions ? window.Mentions.renderMentions(r.message, r.mentions || []) : escapeHtml(r.message);

                return `<div class="reply-item" data-comment-id="${r.id}">
                        <div class="${avatarClass}" data-username="${escapeHtml(username)}">${avatarHtml}</div>
                        <div class="reply-body">
                          <div class="reply-username">${escapeHtml(username)} ${badgeHtml}</div>
                          <div class="comment-text reply-text${il?' collapsed':''}" data-cid="${r.id}">${mn}${renderedMsg}</div>
                          ${il?`<button class="comment-show-more">Show more</button>`:''}
                          <div class="reply-meta">
                            <span class="reply-time">${formatRelativeTime(r.time)}</span>
                            <button class="reply-reply-btn" data-post-id="${postId}">Reply</button>
                            <button class="reply-like-btn ${isL?'liked':''}" data-comment-id="${r.id}">
                              <svg viewBox="0 0 24 24" fill="${isL?'#DC2626':'none'}" stroke="${isL?'#DC2626':'currentColor'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                              <span class="like-count">${lc>0?lc:''}</span>
                            </button>
                          </div>
                        </div>
                      </div>`;
            }

            async function addComment(postId, parentId, message, mentions = []) {
                const p = appData.posts.find(p => p.id === postId);
                if (!p) return;
                if (window.AuthUser && window.AuthUser.requireAuth) {
                    return new Promise((resolve, reject) => {
                        window.AuthUser.requireAuth(async () => {
                            try {
                                const comment = await window.PostsAPI.addComment(postId, parentId, message, mentions);
                                if (!Array.isArray(p.comments)) p.comments = [];
                                p.comments.push(comment);
                                p.commentCount = (p.commentCount || 0) + 1;
                                // Notify mentioned users
                                const user = getCurrentUser();
                                if (comment.id && mentions.length > 0 && window.Mentions) {
                                    window.Mentions.notifyMentionedUsers(
                                        'comment',
                                        comment.id,
                                        mentions,
                                        user.id,
                                        postId
                                    );
                                }
                                resolve(comment);
                            } catch (err) {
                                showToast(err.message, 'r');
                                reject(err);
                            }
                        });
                    });
                } else {
                    const cu = getCurrentUser();
                    const comment = {
                        id: 'temp-' + Date.now(),
                        profile: { display_name: cu.displayName, avatar_url: cu.avatar },
                        message,
                        mentions: mentions || [],
                        time: new Date().toISOString(),
                        approved: true,
                        parentId: parentId || null
                    };
                    if (!Array.isArray(p.comments)) p.comments = [];
                    p.comments.push(comment);
                    p.commentCount = (p.commentCount || 0) + 1;
                    return comment;
                }
            }

            function refreshCommentsList(postId, listId) {
                const p = appData.posts.find(p => p.id === postId);
                if (!p) return;
                const cl = document.getElementById(listId);
                if (!cl) return;
                const ac = Array.isArray(p.comments) ? p.comments.filter(c => c.approved !== false) : [],
                    vc = getVisibleComments(postId);
                cl.innerHTML = commentSkeletons(3);
                setTimeout(() => {
                    cl.innerHTML = renderCommentsHTML(ac, postId, vc);
                }, 200);
            }

            function updateCommentCount(postId) {
                const p = appData.posts.find(p => p.id === postId);
                if (!p) return;
                const cc = Array.isArray(p.comments) ? p.comments.filter(c => c.approved !== false).length : (p
                    .comments || 0);
                document.querySelectorAll(`article[data-post-id="${postId}"] .comment-btn .comment-count`).forEach(el =>
                    el.textContent = formatCount(cc));
                const h3 = document.querySelector(`#comments-count-${postId}`);
                if (h3) h3.textContent = formatCount(cc);
            }

            function toggleCommentLikeUI(btn) {
                const isLiked = btn.classList.toggle('liked');
                const ci = btn.dataset.commentId;
                if (!ci) return;
                const key = 'comment-like-' + ci;
                let count = parseInt(localStorage.getItem(key) || '0');
                count = isLiked ? count + 1 : Math.max(0, count - 1);
                if (count === 0) localStorage.removeItem(key);
                else localStorage.setItem(key, String(count));
                const svg = btn.querySelector('svg'),
                    cnt = btn.querySelector('.like-count');
                if (svg) { svg.setAttribute('fill', isLiked ? '#DC2626' : 'none');
                    svg.setAttribute('stroke', isLiked ? '#DC2626' : 'currentColor'); }
                if (cnt) cnt.textContent = count > 0 ? count : '';
            }

            function toggleCommentExpand(btn, commentId) {
                const el = document.querySelector(`.comment-text[data-cid="${commentId}"]`);
                if (!el) return;
                const collapsed = el.classList.toggle('collapsed');
                btn.textContent = collapsed ? 'Show more' : 'Show less';
            }

            function expandReplies(commentId, postId) { expandedThreads.set(commentId, (expandedThreads.get(
                    commentId) || 0) + REPLY_BATCH);
                refreshCommentsList(postId, 'comments-list'); }

            function collapseReplies(commentId, postId) { expandedThreads.delete(commentId);
                refreshCommentsList(postId, 'comments-list'); }

            function loadMoreComments(postId) { setCommentsVisible(postId, getVisibleComments(postId) +
                    COMMENT_LOAD_MORE);
                refreshCommentsList(postId, 'comments-list'); }

            function setupCommentListDelegation(container, postId) {
                container.addEventListener('click', function(e) {
                    const t = e.target;
                    if (t.closest('.comment-reply-btn') || t.closest('.reply-reply-btn')) {
                        const btn = t.closest('.comment-reply-btn') || t.closest('.reply-reply-btn');
                        const ci = parseInt(btn.closest('[data-comment-id]')?.dataset.commentId);
                        const un = btn.closest('[data-comment-id]')?.querySelector(
                            '.comment-username,.reply-username')?.textContent;
                        if (ci && un) replyToComment(ci, un);
                        return;
                    }
                    if (t.closest('.comment-like-btn') || t.closest('.reply-like-btn')) {
                        const btn = t.closest('.comment-like-btn') || t.closest('.reply-like-btn');
                        toggleCommentLikeUI(btn);
                        return;
                    }
                    if (t.closest('.comment-show-more')) {
                        const btn = t.closest('.comment-show-more');
                        const ci = btn.parentElement.querySelector('.comment-text')?.dataset.cid;
                        if (ci) toggleCommentExpand(btn, ci);
                        return;
                    }
                    if (t.closest('.expand-replies-btn')) { const ci = parseInt(t.closest(
                            '.expand-replies-btn').dataset.commentId); if (ci) expandReplies(ci,
                        postId); return; }
                    if (t.closest('.collapse-replies-btn')) { const ci = parseInt(t.closest(
                            '.collapse-replies-btn').dataset.commentId); if (ci) collapseReplies(ci,
                        postId); return; }
                    if (t.closest('.load-more-comments-btn')) { loadMoreComments(postId); return; }
                    if (t.closest('.comment-avatar') || t.closest('.reply-avatar-dot')) {
                        const el = t.closest('.comment-avatar') || t.closest('.reply-avatar-dot');
                        navigateToProfileByUsername(el.dataset.username);
                        return;
                    }
                });
            }

            function replyToComment(commentId, username) {
                if (uiPage === 'single-post-explore') {
                    exploreReplyTarget = { commentId, username };
                    updateExploreReplyContextUI();
                    const ta = document.getElementById('explore-comment-textarea');
                    if (ta) { ta.focus();
                        ta.style.height = 'auto';
                        ta.style.height = Math.min(ta.scrollHeight, 100) + 'px'; }
                    document.getElementById('explore-comment-bar').scrollIntoView({ behavior: 'smooth' });
                } else {
                    replyTarget = { commentId, username };
                    updateReplyContextUI();
                    const ta = document.getElementById('global-comment-textarea');
                    if (ta) { ta.focus(); }
                    setCommentBarVisible(true);
                }
            }

            function updateReplyContextUI() {
                const banner = document.getElementById('reply-context-banner'),
                    ue = document.getElementById('reply-context-username');
                if (replyTarget) { banner.classList.add('show');
                    ue.textContent = '@' + replyTarget.username; } else { banner.classList.remove('show');
                    ue.textContent = ''; }
            }

            function updateExploreReplyContextUI() {
                const banner = document.getElementById('explore-reply-banner'),
                    ue = document.getElementById('explore-reply-username');
                if (exploreReplyTarget) { banner.style.display = 'flex';
                    ue.textContent = '@' + exploreReplyTarget.username; } else { banner.style.display = 'none';
                    ue.textContent = ''; }
            }

            function cancelReply() { replyTarget = null;
                updateReplyContextUI(); const ta = document.getElementById('global-comment-textarea'); if (ta) ta
                    .value = ''; }

            function cancelExploreReply() { exploreReplyTarget = null;
                updateExploreReplyContextUI(); const ta = document.getElementById('explore-comment-textarea'); if (
                    ta) ta.value = ''; }

            async function submitCommentFromBar() {
                const ta = document.getElementById('global-comment-textarea');
                const message = ta.value.trim();
                if (!message) return showToast('Reply cannot be empty.');
                const mentions = window.Mentions ? window.Mentions.extractMentions(ta) : [];
                const pi = replyTarget ? replyTarget.commentId : null;
                ta.value = '';
                ta.style.height = '40px';
                replyTarget = null;
                updateReplyContextUI();
                try {
                    await addComment(currentPostId, pi, message, mentions);
                    if (pi) {
                        const p = appData.posts.find(x => x.id === currentPostId);
                        const ac = p && Array.isArray(p.comments) ? p.comments.filter(c => c.approved !== false) : [];
                        const topId = findTopAncestorId(pi, ac);
                        const ds = getAllDescendants(topId, ac);
                        expandedThreads.set(topId, ds.length);
                    }
                    if (document.getElementById('comments-list')) {
                        refreshCommentsList(currentPostId, 'comments-list');
                    }
                    updateCommentCount(currentPostId);
                    showToast(pi ? 'Reply posted' : 'Reply posted');
                } catch (err) {
                    showToast(err.message || 'Failed to post reply', 'r');
                }
            }

            async function submitExploreComment() {
                const ta = document.getElementById('explore-comment-textarea');
                const message = ta.value.trim();
                if (!message) return showToast('Reply cannot be empty.');
                const mentions = window.Mentions ? window.Mentions.extractMentions(ta) : [];
                const pi = exploreReplyTarget ? exploreReplyTarget.commentId : null;
                ta.value = '';
                ta.style.height = '40px';
                exploreReplyTarget = null;
                updateExploreReplyContextUI();
                try {
                    await addComment(currentPostId, pi, message, mentions);
                    if (pi) {
                        const p = appData.posts.find(x => x.id === currentPostId);
                        const ac = p && Array.isArray(p.comments) ? p.comments.filter(c => c.approved !== false) : [];
                        const topId = findTopAncestorId(pi, ac);
                        const ds = getAllDescendants(topId, ac);
                        expandedThreads.set(topId, ds.length);
                    }
                    refreshCommentsList(currentPostId, 'comments-list');
                    updateCommentCount(currentPostId);
                    showToast(pi ? 'Reply posted' : 'Reply posted');
                } catch (err) {
                    showToast(err.message || 'Failed to post reply', 'r');
                }
            }

            async function openExplorePost(id, returnPage, focusComment) {
                pauseAllVideos();
                if (exploreVideoObserver) { exploreVideoObserver.disconnect(); exploreVideoObserver = null; }
                const fs = document.getElementById('explore-fullscreen'),
                    fc = document.getElementById('explore-fullscreen-content');
                if (!fs || !fc) return;
                const originPage = returnPage || uiPage || 'home';
                window._fullscreenReturnPage = originPage;
                if (originPage === 'home') tabScrollPositions.home = window.scrollY;
                else if (originPage === 'explore') tabScrollPositions.explore = window.scrollY;
                else if (originPage === 'market') tabScrollPositions.market = window.scrollY;
                currentPostId = id;
                uiPage = 'single-post-explore';
                exploreReplyTarget = null;
                expandedThreads.clear();
                const post = allPosts.find(p => p.id === id);
                if (post) {
                    if (window.PostsAPI && window.PostsAPI.incrementView) {
                        window.PostsAPI.incrementView(id);
                    }
                    post.views = (post.views || 0) + 1;
                    if (!Array.isArray(post.comments)) {
                        if (window.PostsAPI && window.PostsAPI.loadComments) {
                            try {
                                post.comments = await window.PostsAPI.loadComments(id);
                            } catch (err) {
                                console.error('Failed to load comments:', err);
                                post.comments = [];
                            }
                        }
                    }
                }
                const catNameEl = document.getElementById('explore-category-name');
                if (catNameEl) catNameEl.textContent = post ? (post.title || 'Post') : 'Post';
                fc.innerHTML = buildSinglePostHTML(post);
                requestAnimationFrame(() => {
                    initPlayers(fc);
                    setTimeout(() => {
                        const vid = fc.querySelector('.ig-video-wrap video, .video-container video, .media-carousel-slide video');
                        if (vid && vid.plyr) {
                            vid.plyr.play().catch(() => {});
                            currentlyPlayingVideo = vid;
                        } else if (vid) {
                            vid.play().catch(() => {});
                            currentlyPlayingVideo = vid;
                        }
                        const ytIframe = fc.querySelector('.ig-video-wrap iframe, .media-carousel-slide iframe');
                        if (ytIframe) {
                            const idx = ytIframe.id.replace('yt-', '');
                            if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
                            if (!ytState[idx].playing) {
                                ytPostMessage(idx, 'playVideo');
                                ytState[idx].playing = true;
                                _showYtPauseIcon(idx, true);
                                _updateMuteBadge(idx);
                                currentlyPlayingVideo = idx;
                            }
                        }
                    }, 400);
                });
                fs.classList.add('open');
                document.body.classList.add('explore-open');
                document.body.style.overflow = 'hidden';
                fs.scrollTop = 0;
                setCommentBarVisible(false);
                const eb = document.getElementById('explore-comment-bar');
                if (eb) eb.style.display = 'block';
                updateExploreReplyContextUI();
                setupExploreEventDelegation(fc, id);
                setupCommentListDelegation(fc, id);
                if (focusComment) {
                    const ta = document.getElementById('explore-comment-textarea');
                    if (ta) setTimeout(() => ta.focus(), 300);
                }
            }

            function closeExploreFullscreen() {
                const fs = document.getElementById('explore-fullscreen');
                if (!fs) return;
                const eb = document.getElementById('explore-comment-bar');
                if (eb) eb.style.display = 'none';
                fs.classList.remove('open');
                document.body.classList.remove('explore-open');
                document.body.style.overflow = '';
                currentPostId = null;
                const returnPage = window._fullscreenReturnPage || 'home';
                uiPage = returnPage;
                refreshTabStates();
                renderUI();

            function setupExploreEventDelegation(container, postId) {
                container.addEventListener('click', function(e) {
                    const t = e.target;
                    if (t.closest('#single-share-btn')) {
                        const pid = t.closest('#single-share-btn').dataset.sharePost || postId;
                        const btn = t.closest('#single-share-btn');
                        btn.classList.add('share-bounce');
                        setTimeout(() => btn.classList.remove('share-bounce'), 450);
                        openShareModal(pid);
                        return;
                    }
                    if (t.closest('.bookmark-badge')) {
                        const btn = t.closest('.bookmark-badge');
                        toggleBookmark(postId).then(nb => {
                            btn.classList.toggle('bookmarked', nb);
                            btn.innerHTML = bookmarkIcon(nb);
                            btn.classList.add('bookmark-breathe');
                            setTimeout(() => btn.classList.remove('bookmark-breathe'), 400);
                            document.querySelectorAll(`article[data-post-id="${postId}"] .bookmark-badge`)
                                .forEach(el => { el.classList.toggle('bookmarked', nb);
                                    el.innerHTML = bookmarkIcon(nb); });
                            showToast(nb ? 'Saved' : 'Removed from saved');
                        });
                        return;
                    }
                    if (t.closest('.reaction-btn')) { toggleReaction(postId); return; }
                    if (t.closest('[data-full-img]')) { const c = t.closest('[data-full-img]');
                        openLightbox(c.dataset.fullImg); return; }
                    if (t.closest('[data-extlink]')) { openInAppWebView(decodeURIComponent(t.closest(
                        '[data-extlink]').dataset.extlink)); return; }
                    if (t.closest('.font-bold.text-sm')) {
                        const p = allPosts.find(p => p.id === postId);
                        if (p && p.user_id) navigateToProfile(p.user_id);
                        return;
                    }
                });
            }

            function exploreSkeletonGrid() {
                let h = '';

                    '<div class="explore-skeleton-card"><div class="explore-skeleton-thumb"></div></div>';

            function buildExploreCards(posts) {
                return posts.map(post => {
                    const author = window.getAuthorFromProfile(post.profile);
                    const av = author.avatar;
                    const au = author.name;
                    const mediaItems = getMediaItems(post);
                    let mh = '';
                    if (mediaItems.length > 0) {
                        const first = mediaItems[0];
                        const url = first.url;
                        const isVideo = first.type === 'video' || (url && isYouTubeUrl(url));
                        if (url) {
                            if (isVideo && isYouTubeUrl(url)) {
                                const ytId = extractYouTubeId(url);
                                if (ytId) {
                                    mh =
                                        `<div class="ig-video-wrap" style="width:100%;margin:0;height:100%;position:relative;background:#000;"><div class="yt-wrap" style="padding-bottom:56.25%;height:0;position:relative;width:100%;"><iframe style="pointer-events:none;position:absolute;top:0;left:0;width:100%;height:100%;border:none;" src="https://www.youtube.com/embed/${ytId}?autoplay=0&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0" allow="autoplay; encrypted-media"></iframe></div></div>`;
                                } else {
                                    mh =
                                        `<video src="${url}" muted playsinline loop preload="metadata" class="explore-card-thumb" style="pointer-events:none;" onloadeddata="this.closest('.explore-card').classList.add('loaded')"></video>`;
                                }
                            } else if (isVideo) {
                                mh =
                                    `<video src="${url}" muted playsinline loop preload="metadata" class="explore-card-thumb" style="pointer-events:none;" onloadeddata="this.closest('.explore-card').classList.add('loaded')"></video>`;
                            } else {
                                mh =
                                    `<img src="${url}" class="explore-card-thumb" loading="lazy" alt="" onload="this.closest('.explore-card').classList.add('loaded')" onerror="this.closest('.explore-card').classList.add('loaded');this.outerHTML='<div class=\\'explore-card-no-media loaded\\'><div class=\\'explore-card-no-media-text\\'>${escapeHtml(post.title).replace(/'/g,"\\'")}</div></div>'">`;
                            }
                        } else {
                            mh =
                                `<div class="explore-card-no-media loaded"><div class="explore-card-no-media-text">${escapeHtml(post.title)}</div></div>`;
                        }
                    } else {
                        mh =
                            `<div class="explore-card-no-media loaded"><div class="explore-card-no-media-text">${escapeHtml(post.title)}</div></div>`;
                    }
                    const vb = mediaItems.length > 0 && (mediaItems[0].type === 'video' || (mediaItems[0].url && isYouTubeUrl(mediaItems[0].url))) ?
                        `<div class="explore-card-video-badge"><svg width="9" height="9" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg> Video</div>` :
                        '';
                    const ah = av ?
                        `<img src="${av}" class="explore-card-avatar" alt="" onerror="this.style.display='none'">` :
                        `<div class="explore-card-avatar" style="display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#9CA3AF;">${au.charAt(0).toUpperCase()}</div>`;
                    const nl = !post.mediaUrl && mediaItems.length === 0;
                    const cc = nl ? 'explore-card loaded' : 'explore-card';
                    return `<div class="${cc}" data-post-id="${post.id}" ${mediaItems.length > 0 && mediaItems[0].type === 'video' ? 'data-video-card="true"' : ''}>${mh}${vb}<div class="explore-card-overlay"><div class="explore-card-title">${escapeHtml(post.title)}</div><div class="explore-card-meta">${ah}<span class="explore-card-author">${escapeHtml(au)}</span><span class="explore-card-views">${svgEye()}${formatCount(post.views||0)}</span></div></div></div>`;
                }).join('');
            }

                            searchInput.oninput = function(e) { handleMarketSearch(this.value); };
