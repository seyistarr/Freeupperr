                if (!myId || !targetId || myId === targetId) return { iFollowThem: false, theyFollowMe: false };
                const [mine, theirs] = await Promise.all([
                    window.sb.from('follows').select('id').eq('follower_id', myId).eq('following_id', targetId)
                    .maybeSingle(),
                    window.sb.from('follows').select('id').eq('follower_id', targetId).eq('following_id', myId)
                    .maybeSingle()
                ]);
                return { iFollowThem: !!mine.data, theyFollowMe: !!theirs.data };
            }

            async function toggleFollow(targetId) {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { showToast('Please sign in to follow', 'o'); return false; }
                const currently = await isFollowing(user.id, targetId);
                if (currently) {
                    await window.sb.from('follows').delete().eq('follower_id', user.id).eq('following_id', targetId);
                    followingSet.delete(targetId);
                } else {
                    await window.sb.from('follows').insert({ follower_id: user.id, following_id: targetId });
                    followingSet.add(targetId);
                }
                return !currently;
            }

            function followButtonLabel(rel) {
                if (rel.iFollowThem && rel.theyFollowMe) return 'Friends';
                if (rel.iFollowThem) return 'Following';
                if (rel.theyFollowMe) return 'Follow Back';
                return 'Follow';
            }

            function followButtonClass(rel) {
                if (rel.iFollowThem && rel.theyFollowMe) return 'follow-btn friends';
                if (rel.iFollowThem) return 'follow-btn following';
                return 'follow-btn';
            }

            function renderFollowButtonHTML(userId, rel) {
                if (!userId) return '';
                const currentUser = getCurrentUser();
                if (currentUser && currentUser.id === userId) return '';
                const label = followButtonLabel(rel);
                const cls = followButtonClass(rel);
                return `<button class="${cls}" data-target-id="${userId}" data-following="${rel.iFollowThem}" onclick="handleFollowClick(event, '${userId}')">${label}</button>`;
            }

            window.handleFollowClick = async function(e, targetId) {
                e.stopPropagation();
                const btn = e.currentTarget;
                if (btn.dataset.busy === '1') return;
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { showToast('Please sign in to follow', 'o'); return; }

                const wasFollowing = btn.dataset.following === 'true';
                btn.dataset.busy = '1';
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '.65';

                btn.textContent = wasFollowing ? 'Follow' : 'Following';
                btn.className = wasFollowing ? 'follow-btn' : 'follow-btn following';
                btn.dataset.following = String(!wasFollowing);

                try {
                    const newState = await toggleFollow(targetId);
                    const rel = await getRelationship(user.id, targetId);
                    const label = followButtonLabel(rel);
                    const cls = followButtonClass(rel);
                    btn.textContent = label;
                    btn.className = cls;
                    btn.dataset.following = String(rel.iFollowThem);

                    document.querySelectorAll(`.follow-btn[data-target-id="${targetId}"]`).forEach(b => {
                        if (b !== btn) { b.textContent = label;
                            b.className = cls;
                            b.dataset.following = String(rel.iFollowThem); }
                    });

                    showToast(
                        rel.iFollowThem && rel.theyFollowMe ? 'You are now friends' :
                        newState ? 'Following ✓' : 'Unfollowed'
                    );
                } catch (err) {
                    btn.textContent = wasFollowing ? 'Following' : 'Follow';
                    btn.className = wasFollowing ? 'follow-btn following' : 'follow-btn';
                    btn.dataset.following = String(wasFollowing);
                    showToast(err.message || 'Failed to follow', 'r');
                } finally {
                    btn.dataset.busy = '0';
                    btn.style.pointerEvents = '';
                    btn.style.opacity = '';
                }
            };

            async function hydrateFollowButtons() {
                const buttons = document.querySelectorAll('.follow-btn[data-target-id]');
                const authorIds = [...new Set([...buttons].map(btn => btn.dataset.targetId))];
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn || authorIds.length === 0) return;

                for (const authorId of authorIds) {
                    const rel = await getRelationship(user.id, authorId);
                    const btns = document.querySelectorAll(`.follow-btn[data-target-id="${authorId}"]`);
                    btns.forEach(btn => {
                        btn.textContent = followButtonLabel(rel);
                        btn.className = followButtonClass(rel);
                        btn.dataset.following = String(rel.iFollowThem);
                        btn.onclick = function(e) { handleFollowClick(e, authorId); };
                    });
                }
            }

            // ─────────────────────────────────────────────
            // BOOKMARKS
            // ─────────────────────────────────────────────

            let bookmarksSet = new Set();

            async function loadBookmarks() {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { bookmarksSet = new Set(); return; }
                try {
                    const { data, error } = await window.sb.from('bookmarks').select('post_id').eq('user_id', user.id);
                    if (!error) bookmarksSet = new Set(data.map(b => b.post_id));
                } catch (e) { console.warn('loadBookmarks error:', e); }
            }

            function isBookmarked(postId) { return bookmarksSet.has(postId); }

            async function toggleBookmark(postId) {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { showToast('Please sign in to bookmark', 'o'); return false; }
                const currently = isBookmarked(postId);
                try {
                    if (currently) {
                        await window.sb.from('bookmarks').delete().eq('user_id', user.id).eq('post_id', postId);
                        bookmarksSet.delete(postId);
                    } else {
                        await window.sb.from('bookmarks').insert({ user_id: user.id, post_id: postId });
                        bookmarksSet.add(postId);
                    }
                    return !currently;
                } catch (err) { showToast(err.message, 'r'); return currently; }
            }

            // ─────────────────────────────────────────────
            // REACTIONS
            // ─────────────────────────────────────────────

            let allPosts = [];
            let appData = { posts: [], userReactions: {} };

            async function reloadPosts() {
                try {
                    const posts = await window.PostsAPI.loadAllPosts();
                    allPosts = posts;
                    appData.posts = posts;
                    appData.userReactions = {};
                    posts.forEach(p => { if (p.likedByMe) appData.userReactions[p.id + '-like'] = true; });
                    return posts;
                } catch (err) {
                    console.error('Failed to load posts:', err);
                    showToast('Failed to load feed', 'r');
                    return [];
                }
            }

            async function toggleReaction(postId) {
                const post = appData.posts.find(p => p.id === postId);
                if (!post) return;

                document.querySelectorAll(`[data-post-id="${postId}"] .reaction-btn, [data-post-reactions="${postId}"] .reaction-btn`)
                    .forEach(btn => { btn.classList.add('bounce-heart');
                        setTimeout(() => btn.classList.remove('bounce-heart'), 500); });

                if (window.AuthUser && window.AuthUser.requireAuth) {
                    window.AuthUser.requireAuth(async () => {
                        try {
                            const { liked, count } = await window.PostsAPI.toggleLike(postId);
                            post.likedByMe = liked;
                            post.reactions.like = count;
                            appData.userReactions[postId + '-like'] = liked;
                            updateReactionsUI(postId);
                        } catch (err) { showToast(err.message, 'r'); }
                    });
                } else {
                    showToast('Please sign in to like', 'o');
                }
            }

            function updateReactionsUI(postId) {
                const post = appData.posts.find(p => p.id === postId);
                if (!post) return;
                const reacted = !!post.likedByMe;
                document.querySelectorAll(`[data-post-reactions="${postId}"] .reaction-btn, [data-post-id="${postId}"] .reaction-btn`)
                    .forEach(btn => {
                        btn.classList.toggle('reacted', reacted);
                        const icon = btn.querySelector('.heart-icon-wrap');
                        if (icon) icon.innerHTML = svgHeart(reacted);
                        const cnt = btn.querySelector('.reaction-count');
                        if (cnt) cnt.textContent = formatCount(post.reactions.like || 0);
                    });
            }

            function buildReactionButton(post) {
                const count = post.reactions.like || 0;
                const reacted = !!post.likedByMe;
                return `<button type="button" class="reaction-btn ${reacted?'reacted':''}" data-reaction="like">
                    <span class="heart-icon-wrap">${svgHeart(reacted)}</span>
                    <span class="reaction-count">${formatCount(count)}</span>
                </button>`;
            }

            // ─────────────────────────────────────────────
            // MEDIA HELPERS (Youtube, Plyr, Carousel)
            // ─────────────────────────────────────────────

            function isYouTubeUrl(url) {
                if (!url) return false;
                return url.includes('youtube.com/embed') || url.includes('youtu.be') || url.includes(
                    'youtube.com/watch');
            }

            function extractYouTubeId(url) {
                const match = url.match(/(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/) ||
                    url.match(/(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/) ||
                    url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
                return match ? match[1] : null;
            }

            function getMediaItems(post) {
                if (post.media && Array.isArray(post.media) && post.media.length > 0) return post.media;
                if (post.mediaUrl) return [{ url: post.mediaUrl, type: post.mediaType || 'image' }];
                return [];
            }

            let ytState = {};

            function ytPostMessage(idx, func, args = []) {
                const iframe = document.getElementById('yt-' + idx);
                if (!iframe || !iframe.contentWindow) return;
                iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*');
            }

            function _updateMuteBadge(idx) {
                const badge = document.getElementById('ytMuteBadge-' + idx);
                const ico = document.getElementById('ytMuteIco-' + idx);
                if (!badge || !ico) return;
                const state = ytState[idx] || { muted: true };
                if (state.muted) {
                    ico.innerHTML =
                        '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
                    badge.style.opacity = '.95';
                } else {
                    ico.innerHTML =
                        '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
                    badge.style.opacity = '.6';
                }
            }

            function _showYtPauseIcon(idx, isPlaying) {
                const icon = document.getElementById('ytPauseIcon-' + idx);
                if (!icon) return;
                icon.querySelector('svg').innerHTML = isPlaying ?
                    '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' :
                    '<polygon points="5 3 19 12 5 21 5 3"/>';
                icon.classList.remove('hide');
                icon.classList.add('show');
                setTimeout(() => {
                    icon.classList.remove('show');
                    icon.classList.add('hide');
                    setTimeout(() => icon.classList.remove('hide'), 200);
                }, 700);
            }

            window.toggleYtControls = function(idx) {
                if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
                const state = ytState[idx];
                if (state.muted) {
                    ytPostMessage(idx, 'unMute');
                    state.muted = false;
                    showToast('Sound on 🔊');
                    _updateMuteBadge(idx);
                    return;
                }
                if (state.playing) {
                    ytPostMessage(idx, 'pauseVideo');
                    state.playing = false;
                    _showYtPauseIcon(idx, false);
                } else {
                    ytPostMessage(idx, 'playVideo');
                    state.playing = true;
                    _showYtPauseIcon(idx, true);
                }
            };

            window.initYtListener = function(idx) {
                const iframe = document.getElementById('yt-' + idx);
                if (!iframe || !iframe.contentWindow) return;
                iframe.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'yt-' + idx }), '*');
            };

            window.seekYoutube = function(e, idx) {
                const prog = document.getElementById('ytProg-' + idx);
                if (!prog) return;
                const rect = prog.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                // We'll just send seekTo; actual duration not needed for UI
                ytPostMessage(idx, 'seekTo', [pct * 100, true]);
            };

            function setupPlyrPlayer(videoElement) {
                if (videoElement.plyr) return;
                videoElement.setAttribute('playsinline', '');
                videoElement.setAttribute('webkit-playsinline', 'true');
                videoElement.removeAttribute('controls');
                const player = new Plyr(videoElement, {
                    controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                    fullscreen: { enabled: true, fallback: true, iosNative: false },
                    settings: ['quality', 'speed'],
                    quality: { default: 'auto', options: ['1080p', '720p', '480p', '360p'] }
                });
                videoElement.plyr = player;
                return player;
            }

            function buildMediaHTML(post, postIndex) {
                const mediaItems = getMediaItems(post);
                if (!mediaItems || mediaItems.length === 0) return '';

                if (mediaItems.length === 1) {
                    const item = mediaItems[0];
                    const isVideo = item.type === 'video' || (item.url && isYouTubeUrl(item.url));
                    if (isVideo) {
                        if (isYouTubeUrl(item.url)) {
                            const ytId = extractYouTubeId(item.url);
                            if (!ytId) return '';
                            const idx = postIndex || 'single';
                            return `
                            <div class="ig-video-wrap">
                                <div class="yt-wrap">
                                    <iframe id="yt-${idx}" src="https://www.youtube.com/embed/${ytId}?autoplay=0&loop=0&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}" allow="autoplay; encrypted-media" allowfullscreen onload="initYtListener('${idx}')"></iframe>
                                    <div class="yt-tap" id="ytTap-${idx}" onclick="toggleYtControls('${idx}')"></div>
                                    <div class="yt-mute-badge" id="ytMuteBadge-${idx}">
                                        <svg id="ytMuteIco-${idx}" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                                    </div>
                                    <div class="yt-pause-icon" id="ytPauseIcon-${idx}">
                                        <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                                    </div>
                                    <div class="yt-progress" id="ytProg-${idx}" onclick="seekYoutube(event, '${idx}')">
                                        <div class="yt-progress-fill" id="ytProgFill-${idx}"></div>
                                        <div class="yt-progress-thumb" id="ytProgThumb-${idx}"></div>
                                    </div>
                                </div>
                            </div>`;
                        } else {
                            return `<div class="ig-video-wrap" data-full-img="${item.url}"><video src="${item.url}" playsinline webkit-playsinline="true" muted preload="metadata"></video></div>`;
                        }
                    } else {
                        return `<div class="ig-media-container" data-full-img="${item.url}"><img src="${item.url}" class="fade-in-image" loading="lazy" onload="this.classList.add('loaded')" /></div>`;
                    }
                }

                // Carousel
                const items = mediaItems.filter(m => m.url).slice(0, 5);
                if (items.length === 0) return '';
                const carouselId = 'carousel-' + postIndex;
                let slidesHtml = items.map((item, idx) => {
                    const isVideo = item.type === 'video' || (item.url && isYouTubeUrl(item.url));
                    let contentHtml = '';
                    if (isVideo && isYouTubeUrl(item.url)) {
                        const ytId = extractYouTubeId(item.url);
                        if (ytId) {
                            contentHtml = `
                                <div class="yt-wrap">
                                    <iframe id="yt-${carouselId}-${idx}" src="https://www.youtube.com/embed/${ytId}?autoplay=0&loop=0&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}" allow="autoplay; encrypted-media" allowfullscreen onload="initYtListener('${carouselId}-${idx}')"></iframe>
                                    <div class="yt-tap" onclick="toggleYtControls('${carouselId}-${idx}')"></div>
                                    <div class="yt-mute-badge" id="ytMuteBadge-${carouselId}-${idx}">
                                        <svg id="ytMuteIco-${carouselId}-${idx}" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                                    </div>
                                    <div class="yt-pause-icon" id="ytPauseIcon-${carouselId}-${idx}">
                                        <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                                    </div>
                                    <div class="yt-progress" id="ytProg-${carouselId}-${idx}" onclick="seekYoutube(event, '${carouselId}-${idx}')">
                                        <div class="yt-progress-fill" id="ytProgFill-${carouselId}-${idx}"></div>
                                    </div>
                                </div>`;
                        } else {
                            contentHtml =
                                `<video src="${item.url}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain;background:#000;"></video>`;
                        }
                    } else if (isVideo) {
                        contentHtml =
                            `<video src="${item.url}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain;background:#000;"></video>`;
                    } else {
                        contentHtml =
                            `<img src="${item.url}" class="fade-in-image" loading="lazy" onload="this.classList.add('loaded')" style="width:100%;height:100%;object-fit:contain;background:#000;" />`;
                    }
                    return `<div class="media-carousel-slide" data-slide="${idx}">${contentHtml}</div>`;
                }).join('');

                let dotsHtml = '';
                if (items.length > 1) {
                    dotsHtml = `<div class="carousel-dots">${items.map((_, i) => `<div class="carousel-dot ${i===0?'active':''}" data-slide="${i}"></div>`).join('')}</div>`;
                }
                let arrowsHtml = '';
                if (items.length > 1) {
                    arrowsHtml = `
                        <button class="carousel-arrow left" data-carousel="${carouselId}" data-dir="-1">
                            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                        </button>
                        <button class="carousel-arrow right" data-carousel="${carouselId}" data-dir="1">
                            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                        </button>
                    `;
                }
                return `<div class="media-carousel" id="${carouselId}" data-slides="${items.length}" data-current="0">
                        <div class="media-carousel-track">${slidesHtml}</div>
                        ${dotsHtml}
                        ${arrowsHtml}
                    </div>`;
            }

            function initCarousel(el) {
                if (!el || el._inited) return;
                el._inited = true;
                const track = el.querySelector('.media-carousel-track');
                const slides = el.querySelectorAll('.media-carousel-slide');
                const dots = el.querySelectorAll('.carousel-dot');
                const left = el.querySelector('.carousel-arrow.left');
                const right = el.querySelector('.carousel-arrow.right');
                if (slides.length <= 1) return;
                let current = 0,
                    total = slides.length,
                    autoTimer = null;

                function goTo(idx) {
                    current = (idx + total) % total;
                    track.style.transform = `translateX(-${current*100}%)`;
                    dots.forEach((d, i) => d.classList.toggle('active', i === current));
                    resetAuto();
                }

                function next() { goTo(current + 1); }

                function resetAuto() { if (autoTimer) clearInterval(autoTimer);
                    autoTimer = setInterval(next, 3000); }

                dots.forEach((d, i) => d.addEventListener('click', () => { goTo(i);
                    showArrowsTemporarily(); }));
                if (left) left.addEventListener('click', () => { goTo(current - 1);
                    showArrowsTemporarily(); });
                if (right) right.addEventListener('click', () => { goTo(current + 1);
                    showArrowsTemporarily(); });

                function showArrowsTemporarily() {
                    if (left) left.classList.remove('hidden');
                    if (right) right.classList.remove('hidden');
                    setTimeout(() => { if (left) left.classList.add('hidden'); if (right) right.classList.add(
                            'hidden'); }, 3000);
                }
                setTimeout(showArrowsTemporarily, 500);
                resetAuto();

                let startX = 0,
                    dragging = false;
                el.addEventListener('touchstart', e => { startX = e.touches[0].clientX;
                    dragging = true; }, { passive: true });
                el.addEventListener('touchend', e => {
                    if (!dragging) return;
                    dragging = false;
                    const diff = startX - e.changedTouches[0].clientX;
                    if (Math.abs(diff) > 30) { if (diff > 0) goTo(current + 1);
                        else goTo(current - 1);
                        showArrowsTemporarily(); }
                }, { passive: true });
            }

            function initAllCarousels(scope) {
                scope.querySelectorAll('.media-carousel').forEach(el => initCarousel(el));
            }

            // ─────────────────────────────────────────────
            // VIDEO AUTOPLAY
            // ─────────────────────────────────────────────

            let videoObserver = null;

            function setupVideoAutoplay(scope) {
                if (videoObserver) videoObserver.disconnect();
                const root = scope || document;
                const videos = root.querySelectorAll('.ig-video-wrap video, .video-container video, .media-carousel-slide video');
                videoObserver = new IntersectionObserver((entries) => {
                    let visible = null;
                    for (const e of entries) {
                        if (e.isIntersecting && e.intersectionRatio >= 0.75) { visible = e.target; break; }
                    }
                    root.querySelectorAll(
                        '.ig-video-wrap video, .video-container video, .media-carousel-slide video').forEach(v => {
                        if (v === visible) return;
                        if (v.plyr) v.plyr.pause();
                        else v.pause();
                    });
                    root.querySelectorAll('.ig-video-wrap iframe, .media-carousel-slide iframe').forEach(iframe => {
                        const idx = iframe.id.replace('yt-', '');
                        if (ytState[idx] && ytState[idx].playing) {
                            ytPostMessage(idx, 'pauseVideo');
                            ytState[idx].playing = false;
                            _showYtPauseIcon(idx, false);
                        }
                    });
                    if (visible) {
                        if (visible.plyr) visible.plyr.play().catch(() => {});
                        else visible.play().catch(() => {});
                    }
                }, { threshold: 0.75, rootMargin: '0px 0px -20px 0px' });
                videos.forEach(v => videoObserver.observe(v));
            }

            function pauseAllVideos() {
                document.querySelectorAll('video').forEach(v => { if (v.plyr) v.plyr.pause();
                    else v.pause(); });
                document.querySelectorAll('.ig-video-wrap iframe, .media-carousel-slide iframe').forEach(iframe => {
                    const idx = iframe.id.replace('yt-', '');
                    if (ytState[idx] && ytState[idx].playing) {
                        ytPostMessage(idx, 'pauseVideo');
                        ytState[idx].playing = false;
                        _showYtPauseIcon(idx, false);
                    }
                });
            }

            // ─────────────────────────────────────────────
            // POST HTML
            // ─────────────────────────────────────────────

            function buildActionsRow(post) {
                const bm = isBookmarked(post.id);
                const cc = post.comments ? post.comments.filter(c => c.approved !== false).length : (post.commentCount ||
                    0);
                return `<div class="post-actions-row" data-post-reactions="${post.id}">
                        <span class="comment-btn">${svgComment()}<span class="comment-count">${formatCount(cc)}</span></span>
                        ${buildReactionButton(post)}
                        <span class="views-count">${svgEye()}<span>${formatCount(post.views||0)}</span></span>
                        <span class="bookmark-badge ${bm?'bookmarked':''}" data-bookmark="${post.id}">${bookmarkIcon(bm)}</span>
                        <span class="share-btn" data-share-post="${post.id}">${svgShare()}</span>
                    </div>`;
            }

            function buildPostHTML(post, index) {
                const profile = post.profile || {};
                const author = getAuthorFromProfile(profile);
                const cu = getCurrentUser();
                const isOwn = post.user_id && post.user_id === cu.id;
                const displayName = isOwn ? cu.displayName : author.name;
                const avatar = isOwn ? cu.avatar : author.avatar;
                const verifiedStatus = isOwn ? cu.verified_status : author.verified_status;

                const hd = post.description && post.description.trim().length > 0;
                const pt = (post.content || '').substring(0, 250);
                const isLong = (post.content || '').length > 250;
                const th = post.tags && post.tags.length > 0 ?
                    `<div class="flex flex-wrap gap-1 mt-2">${post.tags.map(t=>`<span class="tag-badge" style="display:inline-block;padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:600;background:rgba(124,58,237,.08);color:#7C3AED;">#${escapeHtml(t)}</span>`).join('')}</div>` :
                    '';
                const mh = buildMediaHTML(post, index);

                // Placeholder follow button (will be hydrated)
                const rel = { iFollowThem: false, theyFollowMe: false };
                const followBtn = renderFollowButtonHTML(post.user_id, rel);
                const badgeHtml = getVerifiedBadgeHTML(verifiedStatus);

                return `<article class="feed-post" data-post-id="${post.id}" data-author-id="${post.user_id}">
                        <div class="flex items-start gap-3" style="padding:0 16px;">
                            <img data-author-avatar src="${avatar}" class="user-mini-avatar" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=${displayName}'" />
                            <div style="min-width:0;flex:1;">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span data-author-name class="font-bold text-sm cursor-pointer hover:underline" style="color:var(--text);">${escapeHtml(displayName)}</span>
                                    <span data-author-badge-wrapper>${badgeHtml}</span>
                                    <span class="text-xs" style="color:var(--muted);">${formatRelativeTime(post.timestamp || post.date)}</span>
                                    ${followBtn}
                                    <span class="text-xs text-primary font-semibold uppercase tracking-wide cursor-pointer hover:underline ml-auto flex-shrink-0">${escapeHtml(post.category||'General')}</span>
                                </div>
                                <h3 class="font-heading font-bold text-base mt-0.5 cursor-pointer" style="overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;overflow-wrap:anywhere;color:var(--text);">${escapeHtml(post.title)}</h3>
                                ${hd?`<p class="text-sm mt-1 leading-relaxed" style="white-space:pre-wrap;color:var(--muted);">${escapeHtml(post.description)}</p>`:''}
                                <div class="mt-1" id="post-content-${post.id}">
                                    <div class="content-preview preview-text-${post.id}">${linkifyContent(pt)}</div>
                                    ${isLong?`<div class="content-text full-text-${post.id} hidden">${linkifyContent(post.content)}</div><button type="button" class="read-more-btn mt-1 text-primary font-semibold text-sm">Show more</button>`:`<div class="content-text full-text-${post.id}">${linkifyContent(post.content)}</div>`}
                                </div>
                                ${mh}
                                ${th}
                                ${buildActionsRow(post)}
                            </div>
                        </div>
                    </article>`;
            }

            // ─────────────────────────────────────────────
            // FEED RENDER
            // ─────────────────────────────────────────────

            let uiPage = 'home',
                currentCategoryFilter = '',
                currentSortMethod = 'foryou',
                searchQuery = '';
            let feedPage = 1,
                observer = null,
                sentinel = null,
                isLoadingMore = false;
            let lastDoubleTapTime = 0;
            const PAGE_SIZE = 5;
            const tabScrollPositions = { home: 0, explore: 0, market: 0 };
            let lastScrollY = 0,
                bottomNavHidden = false;

            function getFilteredSortedPosts() {
                const allUsers = getAllUsers(),
                    currentUser = getCurrentUser();
                let p = [...allPosts];
                p = p.filter(post => {
                    if (post.user_id === currentUser.id) return true;
                    const author = allUsers.find(u => u.id === post.user_id);
                    return !author || !author.isPrivate;
                });
                if (currentCategoryFilter) p = p.filter(p => p.category === currentCategoryFilter);
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    p = p.filter(p => p.title.toLowerCase().includes(q) || (p.content || '').toLowerCase()
                        .includes(q) || (p.description || '').toLowerCase().includes(q) || (p.profile &&
                            p.profile.display_name && p.profile.display_name.toLowerCase().includes(q)) ||
                        (p.tags && p.tags.some(t => t.toLowerCase().includes(q))));
                }
                if (currentSortMethod === 'trending') p.sort((a, b) => (b.views || 0) - (a.views || 0));
                else if (currentSortMethod === 'foryou') {
                    const uc = getUserCategories();
                    p.sort((a, b) => {
                        const score = p => { const ah = (Date.now() - new Date(p.timestamp || p.date)) / 36e5,
                                eg = (p.views || 0) + ((p.reactions.like || 0) * 2) + ((p.comments ?
                                    p.comments.filter(c => c.approved !== false).length : 0) * 2); return eg /
                                Math.pow(ah + 2, 1.5); };
                        return (score(b) * (uc.includes(b.category) ? 1.4 : 1)) - (score(a) * (uc
                            .includes(a.category) ? 1.4 : 1));
                    });
                } else p.sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date));
                return p;
            }

            function getUserCategories() { const r = localStorage.getItem('freeupper_user_categories'); return r ? JSON
                    .parse(r) : []; }

            function renderFeedContainer() {
                const ps = getFilteredSortedPosts(),
                    hf = searchQuery || currentCategoryFilter;
                const hh = hf ?
                    `<div class="mb-4 px-4 pt-3"><h1 class="text-xl font-heading font-bold" style="color:var(--text);">${searchQuery?'Search results':currentCategoryFilter}</h1><p class="text-sm" style="color:var(--muted);">${ps.length} post(s)</p></div>` :
                    '';
                return `<div class="max-w-2xl mx-auto"><div>${hh}</div><div id="feed-container" class="px-0"></div></div>`;
            }

            function renderSkeletons(c = 3) {
                let h = '';
                for (let i = 0; i < c; i++) h +=
                    `<div class="skeleton-post"><div class="flex gap-3" style="padding:0 16px;"><div class="skeleton skeleton-avatar"></div><div style="flex:1;"><div class="skeleton skeleton-line" style="width:40%;height:10px"></div><div class="skeleton skeleton-title"></div>${i===0?'<div class="skeleton skeleton-image"></div>':''}<div class="skeleton skeleton-line" style="width:100%"></div><div class="skeleton skeleton-line" style="width:70%"></div><div class="skeleton skeleton-reactions"></div></div></div></div>`;
                return h;
            }

            function getSentinel() { if (!sentinel) { sentinel = document.createElement('div');
                    sentinel.id = 'sentinel';
                    sentinel.style.height = '1px'; } return sentinel; }

            function setupSentinel() { const co = document.getElementById('feed-container'); if (co && !co.contains(
                    getSentinel())) co.appendChild(getSentinel()); }

            function setupInfiniteScroll() {
                if (observer) observer.disconnect();
                observer = new IntersectionObserver(es => { if (es[0].isIntersecting && !isLoadingMore)
                        loadMorePosts(); }, { root: null, rootMargin: '200px', threshold: 0 });
                observer.observe(getSentinel());
            }

            function initPlayers(root) {
                root.querySelectorAll('.ig-video-wrap video:not([data-plyr-init]), .video-container video:not([data-plyr-init]), .media-carousel-slide video:not([data-plyr-init])')
                    .forEach(vid => { vid.dataset.plyrInit = 'true';
                        setupPlyrPlayer(vid); });
                initAllCarousels(root);
                setTimeout(() => {
                    setupVideoAutoplay(root);
                    // auto-play first visible
                    setTimeout(() => {
                        const wraps = root.querySelectorAll('.ig-video-wrap, .video-container, .media-carousel');
                        for (const w of wraps) {
                            const rect = w.getBoundingClientRect();
                            if (rect.top < window.innerHeight && rect.bottom > 0) {
                                const vid = w.querySelector('video');
                                if (vid) { if (vid.plyr) vid.plyr.play().catch(() => {});
                                    else vid.play().catch(() => {}); }
                                const iframe = w.querySelector('iframe');
                                if (iframe) {
                                    const idx = iframe.id.replace('yt-', '');
                                    if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
                                    if (!ytState[idx].playing) {
                                        ytPostMessage(idx, 'playVideo');
                                        ytState[idx].playing = true;
                                        _showYtPauseIcon(idx, true);
                                        _updateMuteBadge(idx);
                                    }
                                }
                                break;
                            }
                        }
                    }, 400);
                }, 300);
            }

            function loadInitialFeed() {
                feedPage = 1;
                isLoadingMore = false;
                if (observer) observer.disconnect();
                const co = document.getElementById('feed-container');
                if (!co) return;
                co.innerHTML = renderSkeletons(3);
                setTimeout(async () => {
                    const ps = getFilteredSortedPosts();
                    co.innerHTML = '';
                    if (ps.length === 0) { co.innerHTML =
                            '<div class="flex flex-col items-center justify-center py-20 text-center"><p class="text-sm" style="color:var(--muted);">No posts yet.</p></div>';
                        return; }
                    const fb = ps.slice(0, PAGE_SIZE);
                    co.innerHTML = fb.map((p, i) => buildPostHTML(p, i)).join('');
                    requestAnimationFrame(async () => {
                        initPlayers(co);
                        setupSentinel();
                        setupInfiniteScroll();
                        co.querySelectorAll('article').forEach(a => setupPostEventDelegation(a));
                        window._currentFeedPosts = ps;
                        await hydrateFollowButtons();
                    });
                }, 150);
            }

            function loadMorePosts() {
                if (isLoadingMore) return;
                const ps = window._currentFeedPosts || getFilteredSortedPosts();
                const start = feedPage * PAGE_SIZE,
                    nb = ps.slice(start, start + PAGE_SIZE);
                if (nb.length === 0) { if (observer && sentinel) observer.unobserve(sentinel); return; }
                isLoadingMore = true;
                const co = document.getElementById('feed-container'),
                    s = getSentinel();
                const t = document.createElement('div');
                t.innerHTML = nb.map((p, i) => buildPostHTML(p, start + i)).join('');
                while (t.firstChild) co.insertBefore(t.firstChild, s);
                requestAnimationFrame(async () => {
                    initPlayers(co);
                    co.querySelectorAll('article:not([data-events-set])').forEach(a => { setupPostEventDelegation(
                            a);
                        a.dataset.eventsSet = 'true'; });
                    feedPage++;
                    isLoadingMore = false;
                    await hydrateFollowButtons();
                });
            }

            function setupPostEventDelegation(article) {
                article.addEventListener('click', function(e) {
                    const t = e.target,
                        pid = article.dataset.postId;
                    if (t.classList.contains('read-more-btn')) { e.stopPropagation();
                        toggleReadMore(article); return; }
                    if (t.closest('.reaction-btn')) { e.stopPropagation();
                        toggleReaction(pid); return; }
                    if (t.closest('.bookmark-badge')) { e.stopPropagation();
                        toggleBookmarkUI(article); return; }
                    if (t.closest('.share-btn')) { e.stopPropagation();
                        const btn = t.closest('.share-btn');
                        const postId = btn.dataset.sharePost || pid;
                        openShare(postId);
                        return; }
                    if (t.closest('.comment-btn')) { e.stopPropagation();
                        openExplorePost(pid, 'home', true); return; }
                    if (t.closest('.user-mini-avatar') || t.closest('[data-author-name]')) {
                        e.stopPropagation();
                        const p = allPosts.find(p => p.id === pid);
                        if (p && p.user_id) navigateToProfile(p.user_id);
                        return;
                    }
                    if (t.closest('.text-primary.uppercase')) {
                        e.stopPropagation();
                        const p = allPosts.find(p => p.id === pid);
                        if (p) filterCategory(p.category);
                        return;
                    }
                    if (t.closest('[data-full-img]')) {
                        const c = t.closest('[data-full-img]');
                        e.stopPropagation();
                        openLightbox(c.dataset.fullImg);
                        return;
                    }
                    if (t.closest('[data-extlink]')) { e.stopPropagation();
                        openInAppWebView(decodeURIComponent(t.closest('[data-extlink]').dataset
                        .extlink)); return; }
                    if (t.closest('.carousel-arrow') || t.closest('.carousel-dot')) { e.stopPropagation(); return; }
                    const now = Date.now(),
                        gap = now - lastDoubleTapTime;
                    if (gap < 300 && gap > 0) { e.preventDefault();
                        toggleReaction(pid); }
                    lastDoubleTapTime = now;
                    if (gap >= 300) { setTimeout(() => { if (Date.now() - lastDoubleTapTime >= 300)
                            openExplorePost(pid, 'home'); }, 310); }
                });
            }

            function toggleReadMore(article) {
                const pid = article.dataset.postId;
                const pv = article.querySelector(`.preview-text-${pid}`),
                    fl = article.querySelector(`.full-text-${pid}`),
                    b = article.querySelector('.read-more-btn');
                if (!pv || !fl) return;
                if (fl.classList.contains('hidden')) { pv.classList.add('hidden');
                    fl.classList.remove('hidden');
                    b.textContent = 'Show less'; } else { pv.classList.remove('hidden');
                    fl.classList.add('hidden');
                    b.textContent = 'Show more'; }
            }

            async function toggleBookmarkUI(article) {
                const pid = article.dataset.postId;
                const nb = await toggleBookmark(pid);
                article.querySelectorAll('.bookmark-badge').forEach(el => {
                    el.classList.toggle('bookmarked', nb);
                    el.innerHTML = bookmarkIcon(nb);
                    el.classList.add('bookmark-breathe');
                    setTimeout(() => el.classList.remove('bookmark-breathe'), 400);
                });
                document.querySelectorAll(`#single-bookmark-${pid}`).forEach(el => {
                    el.classList.toggle('bookmarked', nb);
                    el.innerHTML = bookmarkIcon(nb);
                });
                showToast(nb ? 'Saved' : 'Removed from saved');
            }

            function filterCategory(c) { currentCategoryFilter = c;
                searchQuery = '';
                feedPage = 1;
                uiPage = 'home';
                currentSortMethod = 'trending';
                renderUI(); }

            // ─────────────────────────────────────────────
            // SHARE SYSTEM
            // ─────────────────────────────────────────────

            let _shareIdx = null;
            let _toastTimer = null;

            function showToast(msg) {
                const el = document.getElementById('toast');
                if (!el) return;
                el.textContent = msg;
                el.classList.add('opacity-100');
                el.classList.remove('opacity-0', 'pointer-events-none');
                clearTimeout(_toastTimer);
                _toastTimer = setTimeout(() => { el.classList.add('opacity-0', 'pointer-events-none');
                    el.classList.remove('opacity-100'); }, 2200);
            }

            function getPostUrl(id) { return `${window.location.origin}${window.location.pathname}?post=${encodeURIComponent(id||'')}`; }

            function getPostTitle(id) { const post = allPosts.find(p => p.id === id); return (post && post.title) ||
                    'Check this out on Freeupper'; }

            function openShare(postId) {
                _shareIdx = postId;
                const post = allPosts.find(p => p.id === postId);
                const nativeBtn = document.getElementById('nativeShareBtn');
                if (nativeBtn) nativeBtn.style.display = navigator.share ? 'flex' : 'none';
                const thumb = document.getElementById('sharePreviewThumb');
                const cap = document.getElementById('sharePreviewCaption');
                const handle = document.getElementById('sharePreviewHandle');
                if (thumb) { const media = getMediaItems(post);
                    thumb.src = media.length > 0 ? media[0].url : ''; }
                if (cap) cap.textContent = (post && post.title) || 'Post';
                if (handle) {
                    const profile = post && post.profile ? getAuthorFromProfile(post.profile) : { name: 'User' };
                    handle.textContent = '@' + profile.name.toLowerCase().replace(/\s/g, '');
                }
                openSheet('shareSheet');
            }

            async function shareAction(type) {
                const postId = _shareIdx;
                const url = getPostUrl(postId);
                const title = getPostTitle(postId);
                const text = `${title} — ${url}`;
                if (navigator.vibrate) navigator.vibrate(8);

                switch (type) {
                    case 'native':
                        try { await navigator.share({ title, text: title, url }); } catch (e) { return; }
                        closeSheet('shareSheet');
                        return;
                    case 'copy': {
                        const btn = document.getElementById('copyLinkBtn');
                        const lbl = document.getElementById('copyLbl');
                        try {
                            await navigator.clipboard.writeText(url);
                            if (btn) btn.classList.add('copied');
                            if (lbl) lbl.textContent = 'Copied ✓';
                            showToast('Link copied 🔗');
                            setTimeout(() => { if (btn) btn.classList.remove('copied'); if (lbl) lbl.textContent =
                                    'Copy link'; }, 2000);
                        } catch (e) { showToast('Could not copy link'); }
                        return;
                    }
                    case 'whatsapp':
                        closeSheet('shareSheet');
                        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                        return;
                    case 'twitter':
                        closeSheet('shareSheet');
                        window.open(
                            `https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`,
                            '_blank');
                        return;
                    case 'telegram':
                        closeSheet('shareSheet');
                        window.open(
                            `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`,
                            '_blank');
                        return;
                    case 'facebook':
                        closeSheet('shareSheet');
                        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,
                            '_blank');
                        return;
                    case 'instagram':
                        closeSheet('shareSheet');
                        if (navigator.share) { try { await navigator.share({ title, url }); } catch (e) {} } else { showToast(
                                'Open Instagram app to share'); }
                        return;
                    case 'repost':
                        closeSheet('shareSheet');
                        openSheet('repostSheet');
                        return;
                    case 'quote':
                        closeSheet('shareSheet');
                        openSheet('quoteSheet');
                        return;
                }
            }

            function submitRepost() {
                const postId = _shareIdx;
                const post = allPosts.find(p => p.id === postId);
                if (post) post.reposts = (post.reposts || 0) + 1;
                document.getElementById('repostComment').value = '';
                closeSheet('repostSheet');
                showToast('Reposted ✓');
            }

            function submitQuote() {
                const comment = document.getElementById('quoteComment').value.trim();
                if (!comment) return showToast('Add a thought before posting');
                document.getElementById('quoteComment').value = '';
                closeSheet('quoteSheet');
                showToast('Quote posted ✓');
            }

            // ─────────────────────────────────────────────
            // SHEET HELPERS
            // ─────────────────────────────────────────────

            function openSheet(id) { document.getElementById('backdrop').classList.add('open');
                document.getElementById(id).classList.add('open'); }

            function closeSheet(id) { document.getElementById(id).classList.remove('open'); if (!document.querySelector(
                    '.sheet.open')) document.getElementById('backdrop').classList.remove('open'); }

            window.openSheet = openSheet;
            window.closeSheet = closeSheet;
            window.shareAction = shareAction;
            window.submitRepost = submitRepost;
            window.submitQuote = submitQuote;

            // ─────────────────────────────────────────────
            // COMMENT SYSTEM
            // ─────────────────────────────────────────────

            let currentPostId = null;
            let replyTarget = null;
            let expandedThreads = new Map();
            let commentSortMode = 'top';
            const REPLY_FIRST_BATCH = 4,
                REPLY_BATCH = 5;
            const CVK = 'freeupper_comments_visible';

            function getCommentsVisible() { const r = localStorage.getItem(CVK); return r ? JSON.parse(r) : {}; }

            function setCommentsVisible(postId, count) { const cv = getCommentsVisible();
                cv[postId] = count;
                localStorage.setItem(CVK, JSON.stringify(cv)); }

            function getVisibleComments(postId) { const cv = getCommentsVisible(); return cv[postId] || 5; }

            function getAllDescendants(pid, comments) {
                const r = [];
                const d = comments.filter(c => c.parentId === pid);
                for (const c of d) { r.push(c);
                    r.push(...getAllDescendants(c.id, comments)); }
                return r;
            }

            function renderCommentsHTML(comments, postId, visibleCount) {
                const topLevel = comments.filter(c => c.parentId === null);
                if (topLevel.length === 0) return '<p style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">Be the first to comment.</p>';
                const shown = topLevel.slice(0, visibleCount);
                const hidden = topLevel.length - visibleCount;
                let html = shown.map(c => renderCommentThread(c, comments, postId)).join('');
                if (hidden > 0) html +=
                    `<button class="view-replies-btn load-more-comments-btn" onclick="loadMoreComments('${postId}')">View ${hidden} more comment${hidden>1?'s':''} ⌄</button>`;
                return html;
            }

            function renderCommentThread(comment, allComments, postId) {
                const replies = getAllDescendants(comment.id, allComments);
                const total = replies.length;
                const expandedCount = expandedThreads.get(comment.id) || 0;
                const post = allPosts.find(p => p.id === postId);
                const isCreator = post && comment.userId === post.user_id;
                const author = comment.profile ? getAuthorFromProfile(comment.profile) : { name: comment.username ||
                        'User' };
                const avatar = comment.avatar || author.avatar;
                let repliesHtml = '';
                if (total > 0 && expandedCount === 0) {
                    repliesHtml =
                        `<button class="view-replies-btn" onclick="expandReplies('${comment.id}','${postId}')">View ${total} repl${total>1?'ies':'y'} ⌄</button>`;
                } else if (total > 0) {
                    const shownReplies = replies.slice(0, expandedCount);
                    const remaining = total - expandedCount;
                    repliesHtml =
                        `<div class="replies-thread">${shownReplies.map(r=>renderReplyItem(r,allComments,postId)).join('')}</div>`;
                    if (remaining > 0) repliesHtml +=
                        `<button class="view-replies-btn" onclick="expandReplies('${comment.id}','${postId}')">See ${remaining} more repl${remaining>1?'ies':'y'} ⌄</button>`;
                    else repliesHtml +=
                        `<button class="hide-replies-btn" onclick="collapseReplies('${comment.id}','${postId}')">Hide replies ⌃</button>`;
                }
                const likeCount = parseInt(localStorage.getItem('comment-like-' + comment.id) || '0');
                const isLiked = likeCount > 0;
                return `<div class="comment-item" data-comment-id="${comment.id}">
                        <div class="comment-avatar ${isCreator?'has-image':''}" data-username="${escapeHtml(author.name)}">
                            ${avatar?`<img src="${avatar}" alt="">`:author.name.charAt(0).toUpperCase()}
                        </div>
                        <div class="comment-body">
                            <div class="comment-username-row">
                                ${isCreator?`<span class="creator-lbl">Creator</span>`:''}
                                <span class="comment-username">@${escapeHtml(author.name)}</span>
                                <span data-author-badge-wrapper>${getVerifiedBadgeHTML(author.verified_status)}</span>
                                <span class="comment-time">${formatRelativeTime(comment.time)}</span>
                            </div>
                            <div class="comment-text" data-cid="${comment.id}">${escapeHtml(comment.message)}</div>
                            <button class="comment-reply-btn" onclick="replyToComment('${comment.id}','${escapeHtml(author.name)}')">Reply</button>
                            ${repliesHtml}
                        </div>
                        <button class="comment-like-btn ${isLiked?'liked':''}" onclick="toggleCommentLikeUI(this,'${comment.id}')">
                            <svg class="like-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                            <span class="like-count">${likeCount>0?likeCount:''}</span>
                        </button>
                    </div>`;
            }

            function renderReplyItem(reply, allComments, postId) {
                const parent = allComments.find(c => c.id === reply.parentId);
                const parentName = parent ? (parent.profile ? getAuthorFromProfile(parent.profile).name : parent
                    .username) : '';
                const author = reply.profile ? getAuthorFromProfile(reply.profile) : { name: reply.username || 'User' };
                const mention = (parentName && parentName !== author.name) ?
                    `<span style="color:var(--p);font-weight:500;">@${escapeHtml(parentName)}</span> ` : '';
                const post = allPosts.find(p => p.id === postId);
                const isCreator = post && reply.userId === post.user_id;
                const likeCount = parseInt(localStorage.getItem('comment-like-' + reply.id) || '0');
                const isLiked = likeCount > 0;
                const avatar = reply.avatar || author.avatar;
                return `<div class="reply-item" data-comment-id="${reply.id}">
                        <div class="reply-avatar-dot ${isCreator?'has-image':''}" data-username="${escapeHtml(author.name)}">
                            ${avatar?`<img src="${avatar}" alt="">`:author.name.charAt(0).toUpperCase()}
                        </div>
                        <div class="reply-body">
                            <div class="reply-username">
                                ${isCreator?`<span class="creator-lbl">Creator</span>`:''}
                                @${escapeHtml(author.name)}
                                <span data-author-badge-wrapper>${getVerifiedBadgeHTML(author.verified_status)}</span>
                            </div>
                            <div class="reply-text">${mention}${escapeHtml(reply.message)}</div>
                            <div class="reply-meta">
                                <span class="reply-time">${formatRelativeTime(reply.time)}</span>
                                <button class="reply-reply-btn" onclick="replyToComment('${reply.id}','${escapeHtml(author.name)}')">Reply</button>
                                <button class="reply-like-btn ${isLiked?'liked':''}" onclick="toggleCommentLikeUI(this,'${reply.id}')">
                                    <svg class="like-heart" viewBox="0 0 24 24" width="12" height="12"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                    <span class="like-count">${likeCount>0?likeCount:''}</span>
                                </button>
                            </div>
                        </div>
                    </div>`;
            }

            function replyToComment(commentId, username) {
                replyTarget = { commentId, username };
                updateReplyContextUI();
                document.getElementById('commentInput').focus();
                document.getElementById('commentInput').placeholder = `Reply to @${username}...`;
                showToast(`Replying to @${username}`);
            }

            function cancelReply() { replyTarget = null;
                updateReplyContextUI();
                document.getElementById('commentInput').placeholder = 'Add a comment…';
                document.getElementById('commentInput').value = ''; }

            function updateReplyContextUI() {
                const banner = document.getElementById('reply-context-banner'),
                    ue = document.getElementById('reply-context-username');
                if (replyTarget) { banner.classList.add('show');
                    ue.textContent = '@' + replyTarget.username; } else { banner.classList.remove('show');
                    ue.textContent = ''; }
            }

            function toggleCommentLikeUI(btn, commentId) {
                const isLiked = btn.classList.toggle('liked');
                const key = 'comment-like-' + commentId;
                let count = parseInt(localStorage.getItem(key) || '0');
                if (isLiked) count++;
                else count = Math.max(0, count - 1);
                if (count === 0) localStorage.removeItem(key);
                else localStorage.setItem(key, String(count));
                const countEl = btn.querySelector('.like-count');
                if (countEl) countEl.textContent = count > 0 ? count : '';
            }

            async function expandReplies(commentId, postId) {
                const current = expandedThreads.get(commentId) || 0;
                const nextCount = current === 0 ? REPLY_FIRST_BATCH : current + REPLY_BATCH;
                try {
                    if (window.PostsAPI && window.PostsAPI.loadReplies) {
                        const fresh = await window.PostsAPI.loadReplies(postId, commentId, current, nextCount);
                        const post = allPosts.find(p => p.id === postId);
                        if (post) { if (!post.comments) post.comments = [];
                            fresh.forEach(r => { if (!post.comments.some(c => c.id === r.id)) post.comments.push(
                                r); }); }
                    }
                } catch (err) { showToast('Could not load replies'); return; }
                const container = document.getElementById('commentBody');
                const prevScroll = container ? container.scrollTop : 0;
                expandedThreads.set(commentId, nextCount);
                refreshCommentsList(postId, true, prevScroll);
            }

            function collapseReplies(commentId, postId) { expandedThreads.delete(commentId);
                refreshCommentsList(postId); }

            function loadMoreComments(postId) {
                const current = getVisibleComments(postId);
                setCommentsVisible(postId, current + 5);
                refreshCommentsList(postId);
            }

            async function refreshCommentsList(postId, preserveScroll, prevScroll) {
                const container = document.getElementById('comments-list');
                const scrollBody = document.getElementById('commentBody');
                if (!container) return;
                try {
                    const post = allPosts.find(p => p.id === postId);
                    let comments = post?.comments?.length ? post.comments : await window.PostsAPI.loadComments(postId);
                    if (post) post.comments = comments;
                    comments = [...comments].sort((a, b) => {
                        if (commentSortMode === 'newest') return new Date(b.time) - new Date(a.time);
                        const la = parseInt(localStorage.getItem('comment-like-' + a.id) || '0');
                        const lb = parseInt(localStorage.getItem('comment-like-' + b.id) || '0');
                        return lb - la;
                    });
                    const visibleCount = getVisibleComments(postId);
                    container.innerHTML = renderCommentsHTML(comments, postId, visibleCount);
                    if (preserveScroll && scrollBody) scrollBody.scrollTop = prevScroll;
                } catch (err) { console.warn('Failed to load comments:', err);
                    container.innerHTML =
                        '<p style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">Could not load comments.</p>'; }
            }

            function toggleSortMenu() {
                let menu = document.getElementById('sortMenuPopover');
                if (menu) { menu.remove(); return; }
                menu = document.createElement('div');
                menu.id = 'sortMenuPopover';
                menu.innerHTML =
                    `<button class="sort-option ${commentSortMode==='top'?'active':''}" data-mode="top">Top comments</button><button class="sort-option ${commentSortMode==='newest'?'active':''}" data-mode="newest">Newest comments</button>`;
                document.getElementById('commentSheet').appendChild(menu);
                menu.querySelectorAll('.sort-option').forEach(btn => {
                    btn.onclick = () => { commentSortMode = btn.dataset.mode;
                        menu.remove();
                        refreshCommentsList(currentPostId);
                        showToast(commentSortMode === 'top' ? 'Sorted by: Top comments' :
                            'Sorted by: Newest'); };
                });
                setTimeout(() => {
                    document.addEventListener('pointerdown', function closeMenu(ev) {
                        if (!menu.contains(ev.target)) { menu.remove();
                            document.removeEventListener('pointerdown', closeMenu); }
                    }, { capture: true, once: true });
                }, 0);
            }

            function openComments(postId) {
                currentPostId = postId;
                const post = allPosts.find(p => p.id === postId);
                const countEl = document.getElementById('commentCount');
                if (countEl) countEl.textContent = formatCount(post ? post.commentCount || 0 : 0) + ' comments';
                replyTarget = null;
                updateReplyContextUI();
                const user = getCurrentUser();
                const avatarEl = document.getElementById('commentUserAvatar');
                if (avatarEl) { avatarEl.src = user.avatar || '';
                    avatarEl.onerror = function() { this.style.display = 'none'; }; }
                refreshCommentsList(postId);
                openSheet('commentSheet');
            }

            async function submitCommentFromBar() {
                const textarea = document.getElementById('commentInput');
                const message = textarea.value.trim();
                if (!message) return showToast('Comment cannot be empty.');
                const parentId = replyTarget ? replyTarget.commentId : null;
                try {
                    const comment = await window.PostsAPI.addComment(currentPostId, parentId, message);
                    const post = allPosts.find(p => p.id === currentPostId);
                    if (post) { if (!post.comments) post.comments = [];
                        post.comments.push(comment);
                        post.commentCount = (post.commentCount || 0) + 1; }
                    textarea.value = '';
                    replyTarget = null;
                    updateReplyContextUI();
                    refreshCommentsList(currentPostId);
                    showToast(parentId ? 'Reply posted' : 'Comment posted');
                    const countEl = document.getElementById('commentCount');
                    if (countEl && post) countEl.textContent = formatCount(post.commentCount || 0) + ' comments';
                    document.querySelectorAll(`article[data-post-id="${currentPostId}"] .comment-btn .comment-count`)
                        .forEach(el => el.textContent = formatCount(post ? post.commentCount || 0 : 0));
                } catch (err) { showToast(err.message || 'Failed to post comment', 'r'); }
            }

            window.replyToComment = replyToComment;
            window.cancelReply = cancelReply;
            window.toggleCommentLikeUI = toggleCommentLikeUI;
            window.expandReplies = expandReplies;
            window.collapseReplies = collapseReplies;
            window.loadMoreComments = loadMoreComments;
            window.toggleSortMenu = toggleSortMenu;
            window.openComments = openComments;
            window.submitCommentFromBar = submitCommentFromBar;

            // ─────────────────────────────────────────────
            // EXPLORE FULLSCREEN
            // ─────────────────────────────────────────────

            function buildSinglePostHTML(post) {
                if (!post) return '<div class="p-8 text-center" style="color:var(--muted);">Post not found</div>';
                const profile = post.profile || {};
                const author = getAuthorFromProfile(profile);
                const cu = getCurrentUser();
                const isOwn = post.user_id && post.user_id === cu.id;
                const displayName = isOwn ? cu.displayName : author.name;
                const avatar = isOwn ? cu.avatar : author.avatar;
                const verifiedStatus = isOwn ? cu.verified_status : author.verified_status;
                const mh = buildMediaHTML(post, 'single');
                const bm = isBookmarked(post.id);
                const comments = post.comments ? post.comments.filter(c => c.approved !== false) : [];
                const vc = getVisibleComments(post.id);
                const rel = { iFollowThem: false, theyFollowMe: false };
                const followBtn = renderFollowButtonHTML(post.user_id, rel);
                const badgeHtml = getVerifiedBadgeHTML(verifiedStatus);
                return `<div class="max-w-2xl mx-auto px-4 py-4 single-post-container" data-post-id="${post.id}">
                        <article>
                            <div class="flex items-center gap-2 mb-2">
                                <img src="${avatar}" class="w-10 h-10 rounded-full object-cover cursor-pointer" style="flex-shrink:0;" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=${displayName}'" />
                                <div>
                                    <div class="font-bold text-sm cursor-pointer hover:underline flex items-center gap-1" style="color:var(--text);">${escapeHtml(displayName)} ${badgeHtml}</div>
                                    <div class="text-xs flex items-center gap-1" style="color:var(--muted);">${svgClock()} ${formatRelativeTime(post.timestamp||post.date)}</div>
                                    ${followBtn}
                                </div>
                            </div>
                            <h1 class="font-heading font-extrabold mt-1 mb-1" style="font-size:clamp(1.25rem,4vw,1.7rem);word-break:break-word;overflow-wrap:anywhere;line-height:1.3;color:var(--text);">${escapeHtml(post.title)}</h1>
                            ${mh}
                            ${post.description?`<p class="text-sm leading-relaxed mt-2 mb-1" style="white-space:pre-wrap;color:var(--muted);">${escapeHtml(post.description)}</p>`:''}
                            <div class="content-text mt-1">${linkifyContent(post.content)}</div>
                        </article>
                        <hr class="my-4" style="border-color:var(--brd);">
                        <div class="post-actions-row" style="max-width:100%;justify-content:space-between;" data-post-reactions="${post.id}">
                            <span class="comment-btn" onclick="openComments('${post.id}')">${svgComment()}<span class="comment-count" id="comments-count-${post.id}">${formatCount(comments.length)}</span></span>
                            ${buildReactionButton(post)}
                            <span class="views-count">${svgEye()}<span>${formatCount(post.views||0)}</span></span>
                            <span class="bookmark-badge ${bm?'bookmarked':''}" id="single-bookmark-${post.id}" onclick="toggleBookmarkUIFromSingle('${post.id}')">${bookmarkIcon(bm)}</span>
                            <span class="share-btn" id="single-share-btn" onclick="openShare('${post.id}')">${svgShare()}</span>
                        </div>
                        <div class="mt-5">
                            <h3 class="font-heading font-bold text-base mb-3" style="color:var(--text);">Replies</h3>
                            <div id="comments-list">${renderCommentsHTML(comments,post.id,vc)}</div>
                        </div>
                    </div>`;
            }

            async function toggleBookmarkUIFromSingle(postId) {
                const nb = await toggleBookmark(postId);
                document.querySelectorAll(`#single-bookmark-${postId}`).forEach(el => {
                    el.classList.toggle('bookmarked', nb);
                    el.innerHTML = bookmarkIcon(nb);
                    el.classList.add('bookmark-breathe');
                    setTimeout(() => el.classList.remove('bookmark-breathe'), 400);
                });
                document.querySelectorAll(`article[data-post-id="${postId}"] .bookmark-badge`).forEach(el => {
                    el.classList.toggle('bookmarked', nb);
                    el.innerHTML = bookmarkIcon(nb);
                });
                showToast(nb ? 'Saved' : 'Removed from saved');
            }

            async function openExplorePost(id, returnPage, focusComment) {
                pauseAllVideos();
                const fs = document.getElementById('explore-fullscreen'),
                    fc = document.getElementById('explore-fullscreen-content');
                if (!fs || !fc) return;
                currentPostId = id;
                uiPage = 'single-post-explore';
                window._fullscreenReturnPage = returnPage || 'home';
                expandedThreads.clear();
                const post = allPosts.find(p => p.id === id);
                if (post) {
                    if (window.PostsAPI && window.PostsAPI.incrementView) window.PostsAPI.incrementView(id);
                    post.views = (post.views || 0) + 1;
                    if (!post.comments || post.comments.length === 0) {
                        try { post.comments = await window.PostsAPI.loadComments(id); } catch (e) { post
                                .comments = []; }
                    }
                    if (!post.profile && post.user_id) {
                        const users = getAllUsers();
                        const found = users.find(u => u.id === post.user_id);
                        if (found) post.profile = found;
                    }
                }
                const catNameEl = document.getElementById('explore-category-name');
                if (catNameEl) catNameEl.textContent = post ? (post.category || 'Post') : 'Post';
                fc.innerHTML = buildSinglePostHTML(post);
                requestAnimationFrame(async () => {
                    initPlayers(fc);
                    await hydrateFollowButtons();
                    setTimeout(() => {
                        const vid = fc.querySelector('.ig-video-wrap video, .video-container video, .media-carousel-slide video');
                        if (vid) { if (vid.plyr) vid.plyr.play().catch(() => {});
                            else vid.play().catch(() => {}); }
                        const iframe = fc.querySelector('.ig-video-wrap iframe, .media-carousel-slide iframe');
                        if (iframe) {
                            const idx = iframe.id.replace('yt-', '');
                            if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
                            if (!ytState[idx].playing) {
                                ytPostMessage(idx, 'playVideo');
                                ytState[idx].playing = true;
                                _showYtPauseIcon(idx, true);
                                _updateMuteBadge(idx);
                            }
                        }
                    }, 400);
                });
                fs.classList.add('open');
                document.body.classList.add('explore-open');
                document.body.style.overflow = 'hidden';
                fs.scrollTop = 0;
                const eb = document.getElementById('explore-comment-bar');
                if (eb) eb.style.display = 'block';
                updateExploreReplyContextUI();
                setupExploreEventDelegation(fc, id);
                setupCommentListDelegation(fc, id);
                if (focusComment) {
                    const ta = document.getElementById('explore-comment-textarea');
                    if (ta) setTimeout(() => ta.focus(), 300);
                }
            }

            function closeExploreFullscreen() {
                const fs = document.getElementById('explore-fullscreen');
                if (!fs) return;
                const eb = document.getElementById('explore-comment-bar');
                if (eb) eb.style.display = 'none';
