<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7C3AED" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>FreeUpper – Home</title>
  <link rel="icon" type="image/png" href="freeupper.png" />
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#7C3AED',
            'primary-light': '#8B5CF6',
            'primary-dark': '#6D28D9'
          },
          fontFamily: {
            heading: ['Poppins', 'Inter', 'sans-serif'],
            body: ['Inter', 'Roboto', 'sans-serif']
          },
          borderRadius: { soft: '10px', softer: '14px' },
          animation: { spin: 'spin 0.8s linear infinite' }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Supabase & API Modules -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="global.js"></script>
  <script src="auth.js"></script>
  <script src="posts.js"></script>

  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --gold: #FFD700;
      --heart-red: #DC2626;
      --bg: #ffffff;
      --bg2: #f9fafb;
      --bg3: #ffffff;
      --bg4: #f3f4f6;
      --text: #111827;
      --muted: #6B7280;
      --muted2: #9CA3AF;
      --brd: #e5e7eb;
      --brd2: #d1d5db;
      --inp: #f9fafb;
      --p: #7C3AED;
      --pdim: rgba(124, 58, 237, 0.1);
      --pbrd: #7C3AED;
      --navbg: rgba(255, 255, 255, 0.92);
      --sidebg: #f9fafb;
      --bottom-nav-height: 64px;
      --nav-h: 78px;
    }
    [data-theme="dark"] {
      --bg: #0f0f0f;
      --bg2: #1a1a1a;
      --bg3: #242424;
      --bg4: #2a2a2a;
      --text: #f0f0f0;
      --muted: #9ca3af;
      --muted2: #6b7280;
      --brd: #2a2a2a;
      --brd2: #3a3a3a;
      --inp: #1f1f1f;
      --navbg: rgba(20, 20, 20, 0.92);
      --sidebg: #0f0f0f;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      touch-action: manipulation;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--bottom-nav-height) + 20px);
      transition: padding-bottom 0.3s ease;
    }
    body.nav-hidden { padding-bottom: 0; }
    .font-heading { font-family: 'Poppins', 'Inter', sans-serif; }
    body.single-post-open nav.sticky,
    body.single-post-open #category-chips,
    body.explore-open nav.sticky,
    body.explore-open #category-chips,
    body.market-fullscreen-open nav.sticky,
    body.market-fullscreen-open #category-chips {
      display: none !important;
    }

    /* ── SIDE NAV (desktop) ── */
    .side-nav {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      flex-direction: column;
      align-items: center;
      padding: 28px 0 24px;
      background: var(--sidebg);
      border-right: 1px solid var(--brd);
      width: 70px;
      flex-shrink: 0;
      gap: 2px;
      z-index: 30;
      transition: background .3s, border-color .3s;
    }
    .side-logo { font-size: 20px; font-weight: 900; color: var(--p); margin-bottom: 20px; letter-spacing: -1px; cursor: pointer; }
    .side-logo a { color: inherit; text-decoration: none; }
    .side-btn {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, transform .1s;
      background: none; border: none; position: relative; gap: 3px;
      color: inherit; text-decoration: none;
    }
    .side-btn:hover { background: var(--pdim); transform: scale(1.04); }
    .side-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s; }
    .side-btn span { font-size: 8px; color: var(--muted2); font-weight: 600; }
    .side-btn.active svg { stroke: var(--p); }
    .side-btn.active span { color: var(--p); }
    .side-btn .side-badge { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--p); border: 1.5px solid var(--sidebg); }
    .side-gap { flex: 1; }
    .side-av { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; background: linear-gradient(135deg, #1a1035, #3b1a6b); }
    .side-btn.active .side-av { border-color: var(--p); }

    @media (min-width: 768px) {
      .side-nav { display: flex; }
      body { padding-left: 70px; padding-bottom: 0 !important; }
      .bottom-nav { display: none !important; }
    }

    /* ── BOTTOM NAV (mobile) ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--navbg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-top: 1px solid var(--brd);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 max(env(safe-area-inset-bottom), 12px);
      z-index: 30;
      transition: transform 0.35s cubic-bezier(0.32, 0.94, 0.6, 1), background .3s, border-color .3s;
      height: var(--bottom-nav-height);
      transform: translateY(0);
      will-change: transform;
    }
    .bottom-nav-hidden { transform: translateY(100%); }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      cursor: pointer; padding: 4px clamp(6px, 2vw, 12px); border-radius: 14px;
      transition: background .15s; position: relative;
      background: none; border: none; text-decoration: none; color: inherit;
    }
    .nav-item:hover { background: var(--pdim); }
    .nav-item svg { width: clamp(20px, 5vw, 24px); height: clamp(20px, 5vw, 24px); fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s; }
    .nav-item span { font-size: clamp(8px, 1.8vw, 10px); color: var(--muted); font-weight: 600; letter-spacing: .03em; }
    .nav-item.active svg { stroke: var(--p); }
    .nav-item.active span { color: var(--p); }
    .nav-av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; background: linear-gradient(135deg, #1a1035, #3b1a6b); }
    .nav-item.active .nav-av { border-color: var(--p); }
    .nav-badge { position: absolute; top: 2px; right: clamp(2px,1vw,4px); width: 8px; height: 8px; border-radius: 50%; background: #EF4444; border: 1.5px solid var(--bg); }

    /* Raised "Create" button */
    .add-post-btn {
      background: var(--p);
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: none; cursor: pointer;
      box-shadow: 0 4px 10px rgba(139, 92, 246, .4);
      transform: translateY(-2px);
      flex-shrink: 0;
      transition: transform .15s, box-shadow .15s;
    }
    .add-post-btn:active { transform: translateY(-2px) scale(.92); }
    .add-post-btn svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; }

    /* ── TOP HEADER ── */
    .top-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--brd);
      position: sticky; top: 0; z-index: 29;
    }
    .top-header .brand {
      font-family: 'Poppins', 'Inter', sans-serif;
      font-weight: 900; font-size: 1.25rem; cursor: pointer; color: var(--text); display: flex; align-items: center; gap: 2px;
    }
    .top-header .brand span { color: var(--p); }
    .top-header .header-actions { display: flex; align-items: center; gap: 8px; }
    .top-header .header-actions .msg-btn {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--pdim); border: none; cursor: pointer;
      color: var(--p); transition: background .2s, transform .15s; position: relative;
    }
    .top-header .header-actions .msg-btn:hover { background: rgba(124,58,237,0.2); transform: scale(1.05); }
    .top-header .header-actions .msg-btn svg { width: 22px; height: 22px; stroke: var(--p); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .top-header .header-actions .msg-btn .msg-badge {
      position: absolute; top: 2px; right: 2px;
      width: 10px; height: 10px; border-radius: 50%; background: #EF4444; border: 2px solid var(--bg2);
    }

    /* ── CATEGORY CHIPS ── */
    #category-chips {
      position: sticky; top: 52px; z-index: 20;
      background: var(--bg2); border-bottom: 1px solid var(--brd);
    }
    #chips-container { display: flex; width: 100%; }
    .tab-pill {
      padding: 14px 16px; font-size: .9rem; font-weight: 700;
      color: #6B7280; background: none; border: none; cursor: pointer;
      position: relative; white-space: nowrap; transition: color .2s; flex: 1; text-align: center;
    }
    .tab-pill::after {
      content: ''; position: absolute; bottom: 0; left: 50%; width: 56px; height: 3px;
      background: #7C3AED; border-radius: 3px 3px 0 0;
      transform: translateX(-50%) scaleX(0); transition: transform .2s ease;
    }
    .tab-pill--active { color: var(--text); }
    .tab-pill--active::after { transform: translateX(-50%) scaleX(1); }
    [data-theme="dark"] .tab-pill--active { color: #fff; }

    /* ── FEED POSTS ── */
    .feed-post {
      border-bottom: 1px solid var(--brd);
      padding: 16px 0; position: relative; transition: background .1s ease; cursor: pointer;
      background: var(--bg3); margin-bottom: 8px;
    }
    .feed-post:active { background: rgba(0,0,0,.02); }
    .feed-post:last-child { border-bottom: 1px solid var(--brd); }
    .content-text {
      white-space: pre-wrap; line-height: 1.5; font-size: 16px;
      color: var(--text); font-weight: 400; word-wrap: break-word;
    }
    .content-preview {
      white-space: pre-wrap; line-height: 1.5; font-size: 16px;
      color: var(--text); font-weight: 400;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    }
    .feed-post .post-body { padding: 0 16px; max-width: 100%; }

    /* ── MEDIA ── */
    .ig-media-container,
    .ig-video-wrap,
    .media-carousel {
      width: calc(100% + 32px);
      margin-left: -16px; margin-right: -16px;
      border-radius: 0 !important;
      overflow: hidden; margin-top: 10px; background: #000;
    }
    .ig-media-container img { width: 100%; height: auto; display: block; object-fit: contain; }
    .ig-video-wrap video { width: 100%; display: block; max-height: 70vh; object-fit: contain; background: #000; pointer-events: none; }
    .ig-video-wrap.plyr-video { background: #000; }
    .ig-video-wrap .plyr__controls { background: rgba(0,0,0,.6); backdrop-filter: blur(4px); }
    .ig-video-wrap .plyr__control--overlaid { background: rgba(124,58,237,.85); }
    .ig-video-wrap .plyr__control--overlaid:hover { background: #7C3AED; }

    .media-carousel {
      aspect-ratio: 16 / 9; max-height: 80vh;
    }
    .media-carousel-track { display: flex; transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94); height: 100%; width: 100%; will-change: transform; }
    .media-carousel-slide { flex: 0 0 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
    .media-carousel-slide img,
    .media-carousel-slide video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
    .carousel-dots {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 5;
      background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 20px; backdrop-filter: blur(4px);
    }
    .carousel-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.35); transition: all 0.3s ease; cursor: pointer; }
    .carousel-dot.active { background: #fff; width: 18px; border-radius: 4px; }
    .carousel-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(0,0,0,0.5); border: 1.5px solid rgba(255,255,255,0.15);
      color: #fff; cursor: pointer; z-index: 6;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px); opacity: 1;
      transition: opacity 0.6s ease, transform 0.2s ease;
    }
    .carousel-arrow.hidden { opacity: 0; pointer-events: none; }
    .carousel-arrow:hover { background: rgba(0,0,0,0.7); transform: translateY(-50%) scale(1.05); }
    .carousel-arrow:active { transform: translateY(-50%) scale(0.92); }
    .carousel-arrow.left { left: 8px; }
    .carousel-arrow.right { right: 8px; }
    .carousel-arrow svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    /* ── POST ACTIONS ROW ── */
    .post-actions-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; max-width: 100%;
    }
    .post-actions-row .comment-btn,
    .post-actions-row .reaction-btn,
    .post-actions-row .views-count,
    .post-actions-row .bookmark-badge,
    .post-actions-row .share-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 8px; border-radius: 20px;
      font-size: .85rem; color: var(--muted);
      cursor: pointer; transition: background .15s, color .15s;
      background: transparent; border: none; font-weight: 500;
    }
    .post-actions-row .comment-btn:hover { background: rgba(124,58,237,.08); color: #7C3AED; }
    .post-actions-row .share-btn:hover { background: rgba(124,58,237,.08); color: #7C3AED; }
    .post-actions-row .reaction-btn:hover { background: rgba(220,38,38,.08); color: var(--heart-red); }
    .post-actions-row .bookmark-badge:hover { background: rgba(255,215,0,.15); color: var(--gold); }
    .post-actions-row .bookmark-badge.bookmarked { color: var(--gold); }
    .post-actions-row .bookmark-badge.bookmarked svg { fill: var(--gold); stroke: var(--gold); }
    .post-actions-row .reaction-btn.reacted { color: var(--heart-red); }
    .post-actions-row svg { width: 18px; height: 18px; flex-shrink: 0; }
    .post-actions-row .reaction-count,
    .post-actions-row .comment-count { font-weight: 600; font-variant-numeric: tabular-nums; font-size: .85rem; }
    .post-actions-row .views-count span { font-weight: 500; }

    /* ── PULL TO REFRESH ── */
    #pull-indicator {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%) translateY(-80px);
      z-index: 60; background: #fff; border: 1px solid #E5E7EB; border-radius: 999px;
      padding: 8px 18px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s;
      opacity: 0; pointer-events: none; font-size: .8rem; font-weight: 600; color: #7C3AED;
    }
    #pull-indicator.visible { transform: translateX(-50%) translateY(12px); opacity: 1; }
    #pull-indicator.releasing { background: #F5F3FF; }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(30,30,30,.95); color: #fff; font-size: 13px; font-weight: 700;
      padding: 10px 20px; border-radius: 100px; border: 1px solid rgba(255,255,255,.12);
      z-index: 400; opacity: 0; transition: opacity .25s, transform .25s;
      white-space: nowrap; pointer-events: none; backdrop-filter: blur(12px);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── SHARE SHEET ── */
    /* (Will be added inline below) */

    /* ── COMMENT SHEET ── */
    /* (Will be added inline below) */

    /* ── SKELETON / LOADER ── */
    .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .skeleton-post { padding: 16px 0; border-bottom: 1px solid var(--brd); }
    .skeleton-line { height: 12px; margin-bottom: 10px; border-radius: 6px; }
    .skeleton-title { height: 20px; width: 75%; margin-bottom: 10px; border-radius: 6px; }
    .skeleton-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
    .skeleton-image { width: 100%; height: 180px; border-radius: 0; margin: 10px 0; }
    .skeleton-reactions { height: 24px; width: 220px; border-radius: 20px; margin-top: 12px; }

    .spinner { width: 18px; height: 18px; border: 2.5px solid var(--brd); border-top-color: #7C3AED; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .top-header .brand { font-size: 1.05rem; }
      .top-header .header-actions .msg-btn { width: 34px; height: 34px; }
      .top-header .header-actions .msg-btn svg { width: 20px; height: 20px; }
      #category-chips .tab-pill { padding: 10px 12px; font-size: .78rem; }
      #category-chips .tab-pill::after { width: 40px; }
      .post-actions-row { gap: 2px; flex-wrap: nowrap; justify-content: space-between; }
      .post-actions-row .comment-btn,
      .post-actions-row .reaction-btn,
      .post-actions-row .views-count,
      .post-actions-row .bookmark-badge,
      .post-actions-row .share-btn { padding: 4px 4px; font-size: .7rem; }
      .post-actions-row svg { width: 15px; height: 15px; }
      .feed-post { margin-bottom: 6px; border-radius: 10px; }
      .ig-media-container,
      .ig-video-wrap,
      .media-carousel { width: 100%; margin-left: 0; margin-right: 0; border-radius: 0 !important; }
    }

    /* ═══════════════════ SHEETS (share, comment) ═══════════════════ */
    /* (Inlined from the snippet) */

    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200;
      opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s;
    }
    .sheet-backdrop.open { opacity: 1; visibility: visible; }

    .sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--sheet-bg, #111);
      border-radius: 20px 20px 0 0;
      z-index: 201;
      transform: translateY(100%);
      transition: transform .32s cubic-bezier(.4,0,.2,1);
      max-height: 90dvh;
      display: flex; flex-direction: column;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 36px; height: 4px; background: rgba(255,255,255,.2);
      border-radius: 2px; margin: 12px auto 0; flex-shrink: 0;
    }
    .sheet-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px 12px; border-bottom: 1px solid var(--sheet-bd, #2a2a2a);
      flex-shrink: 0; position: relative;
    }
    .sheet-title { font-size: 16px; font-weight: 800; color: var(--text); }
    .sheet-close {
      width: 30px; height: 30px; background: rgba(255,255,255,.08); border-radius: 50%;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sheet-close svg { width: 14px; height: 14px; stroke: var(--text); fill: none; stroke-width: 2.5; stroke-linecap: round; }

    /* ---- Share sheet ---- */
    .share-preview { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--sheet-bd); }
    .share-preview-thumb { width: 48px; height: 60px; border-radius: 8px; object-fit: cover; background: var(--bg4); flex-shrink: 0; }
    .share-preview-meta { min-width: 0; }
    .share-preview-caption { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .share-preview-handle { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .share-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 16px 12px 8px; }
    .share-item {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 14px 8px; border-radius: 14px; background: none; border: none;
      cursor: pointer; transition: transform .12s ease, background .18s;
      -webkit-tap-highlight-color: transparent; position: relative; overflow: hidden;
    }
    .share-item:active { transform: scale(.95); }
    .share-item:hover { background: rgba(255,255,255,.07); }
    .share-ico { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
    .share-ico svg { width: 26px; height: 26px; }
    .share-lbl { font-size: 12px; font-weight: 600; color: var(--text); }
    .share-item.copied .share-ico { background: rgba(0,186,124,.18) !important; }
    .share-item.copied .share-lbl { color: #00ba7c; }

    .share-links { display: flex; flex-direction: column; gap: 2px; padding: 4px 12px 12px; }
    .share-link-row {
      display: flex; align-items: center; gap: 14px; padding: 14px 8px;
      border-radius: 12px; background: none; border: none; cursor: pointer;
      width: 100%; text-align: left;
      transition: transform .12s ease, background .18s;
      -webkit-tap-highlight-color: transparent; position: relative; overflow: hidden;
    }
    .share-link-row:active { transform: scale(.95); }
    .share-link-row:hover { background: rgba(255,255,255,.07); }
    .share-link-ico { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .share-link-ico svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .share-link-txt { font-size: 14px; font-weight: 600; color: var(--text); }

    .share-cancel-btn {
      width: calc(100% - 24px); margin: 4px 12px calc(12px + env(safe-area-inset-bottom));
      padding: 14px; border-radius: 14px; background: var(--inp-bg, #1a1a1a);
      border: none; color: var(--text); font-weight: 700; font-size: 15px;
      cursor: pointer; transition: transform .12s ease, background .18s;
      position: relative; overflow: hidden;
    }
    .share-cancel-btn:active { transform: scale(.95); }
    .share-cancel-btn:hover { background: var(--bg4); }

    /* ---- Comment sheet ---- */
    #commentSheet { height: 88dvh; max-height: 88dvh; }
    #commentSheet .sheet-body { flex: 1; overflow-y: auto; padding: 0 0 8px; scrollbar-width: none; }
    #commentSheet .sheet-body::-webkit-scrollbar { display: none; }

    .comment-item { display: flex; gap: 12px; padding: 14px 18px; align-items: flex-start; border-bottom: 1px solid rgba(255,255,255,.04); }
    .comment-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); flex-shrink: 0; overflow: hidden; cursor: pointer; font-size: 16px; }
    .comment-avatar.has-image { background: transparent; padding: 0; }
    .comment-avatar.has-image img { width: 100%; height: 100%; object-fit: cover; }
    .comment-body { flex: 1; min-width: 0; }
    .comment-username-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .creator-lbl { color: var(--p); font-weight: 700; font-size: 13px; }
    .comment-username { color: var(--text); font-weight: 700; font-size: 14px; }
    .comment-time { color: var(--muted2); font-size: 12px; }
    .comment-text { color: var(--text); font-size: 15px; line-height: 1.5; margin-bottom: 6px; word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap; }
    .comment-reply-btn { background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; transition: color .15s; }
    .comment-reply-btn:hover { color: var(--p); }

    .comment-like-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; flex-shrink: 0; padding: 0 0 0 8px; margin-left: auto; min-width: 32px; }
    .like-heart { width: 18px; height: 18px; stroke: var(--muted2); fill: none; transition: stroke .15s, fill .15s, transform .2s cubic-bezier(.34,1.56,.64,1); }
    .comment-like-btn.liked .like-heart { stroke: var(--red, #DC2626); fill: var(--red, #DC2626); transform: scale(1.1); }
    .comment-like-btn .like-count { font-size: 11px; color: var(--muted2); font-weight: 600; }
    .comment-like-btn.liked .like-count { color: var(--red, #DC2626); }

    .replies-thread { border-left: 2px solid var(--brd); margin-left: 20px; padding-left: 0; box-sizing: border-box; width: calc(100% - 20px); margin-top: 4px; }
    .reply-item { display: flex; gap: 8px; padding: 8px 0 8px 16px; align-items: flex-start; width: 100%; box-sizing: border-box; }
    .reply-avatar-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--bg4); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.6rem; color: var(--muted); margin-left: -12px; border: 2px solid var(--bg); z-index: 2; overflow: hidden; cursor: pointer; }
    .reply-avatar-dot.has-image { background: transparent; padding: 0; }
    .reply-avatar-dot.has-image img { width: 100%; height: 100%; object-fit: cover; }
    .reply-body { flex: 1; min-width: 0; }
    .reply-username { font-size: 0.78rem; font-weight: 600; color: var(--text); margin-bottom: 1px; }
    .reply-text { white-space: pre-wrap; line-height: 1.5; font-size: 0.88rem; color: var(--text); font-weight: 400; word-break: break-word; overflow-wrap: anywhere; }
    .reply-meta { display: flex; align-items: center; gap: 10px; margin-top: 3px; flex-wrap: wrap; }
    .reply-time { font-size: 0.7rem; color: var(--muted2); }
    .reply-reply-btn { font-size: 0.7rem; color: var(--muted); font-weight: 600; cursor: pointer; background: none; border: none; padding: 0; }
    .reply-reply-btn:hover { color: var(--p); }
    .reply-like-btn { font-size: 0.7rem; color: var(--muted2); font-weight: 500; cursor: pointer; background: none; border: none; padding: 0; display: flex; align-items: center; gap: 2px; }
    .reply-like-btn.liked { color: var(--red, #DC2626); }

    .view-replies-btn,
    .hide-replies-btn {
      display: flex; align-items: center; gap: 4px; font-size: 0.78rem; color: var(--p); font-weight: 600;
      cursor: pointer; background: none; border: none; padding: 0; margin-top: 4px; transition: color .15s;
    }
    .view-replies-btn:hover,
    .hide-replies-btn:hover { text-decoration: underline; color: var(--pd); }
    .view-replies-btn { margin-left: 52px; }
    .hide-replies-btn { margin-left: 20px; padding-left: 16px; color: var(--muted); }
    .hide-replies-btn:hover { color: var(--text); }
    .load-more-comments-btn { margin-left: 0 !important; padding: 8px 0; color: var(--p); }

    .comment-inp-row { display: flex; align-items: center; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--sheet-bd); background: var(--sheet-bg); flex-shrink: 0; }
    .comment-inp-ava { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--bg4); }
    .comment-inp-wrap { flex: 1; display: flex; align-items: center; background: var(--inp-bg, #1a1a1a); border: 1px solid var(--sheet-bd); border-radius: 100px; padding: 8px 14px; gap: 6px; }
    .comment-inp { flex: 1; background: none; border: none; color: var(--text); font-size: 14px; font-family: inherit; outline: none; min-width: 0; }
    .comment-inp::placeholder { color: var(--muted2); }
    .comment-icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 2px 4px; flex-shrink: 0; color: var(--muted2); transition: color .15s, transform .12s; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .comment-icon-btn:hover { color: var(--text); }
    .comment-icon-btn:active { transform: scale(.9); }
    .comment-icon-btn svg { width: 18px; height: 18px; stroke: var(--muted2); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s; }
    .comment-icon-btn:hover svg { stroke: var(--text); }
    .comment-send { width: 32px; height: 32px; background: var(--p); border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .15s, background .15s; }
    .comment-send:active { transform: scale(.88); }
    .comment-send:hover { background: var(--pd); }
    .comment-send svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; }

    #reply-context-banner { display: none; align-items: center; gap: 6px; padding: 6px 18px; font-size: 0.8rem; color: var(--muted); background: var(--inp-bg); border-bottom: 1px solid var(--sheet-bd); }
    #reply-context-banner.show { display: flex; }
    #reply-context-username { font-weight: 600; color: var(--p); }
    #reply-cancel-btn { margin-left: auto; cursor: pointer; background: none; border: none; font-size: 1rem; color: var(--muted); padding: 2px 6px; border-radius: 4px; line-height: 1; }
    #reply-cancel-btn:hover { color: var(--text); background: var(--rowh); }

    #sortMenuPopover { position: absolute; top: 52px; right: 52px; background: var(--sheet-bg); border: 1px solid var(--sheet-bd); border-radius: 12px; overflow: hidden; z-index: 210; box-shadow: 0 8px 24px rgba(0,0,0,.4); min-width: 170px; }
    #sortMenuPopover .sort-option { display: block; width: 100%; text-align: left; padding: 12px 16px; background: none; border: none; color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s; }
    #sortMenuPopover .sort-option:hover { background: var(--rowh); }
    #sortMenuPopover .sort-option:not(:last-child) { border-bottom: 1px solid var(--sheet-bd); }
    #sortMenuPopover .sort-option.active { font-weight: 800; }

    .share-ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.35); transform: scale(0); animation: shareRipple .5s ease-out forwards; pointer-events: none; }
    @keyframes shareRipple { to { transform: scale(3); opacity: 0; } }
  </style>
</head>
<body>

  <!-- ═══ PULL TO REFRESH ═══ -->
  <div id="pull-indicator">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="pull-icon"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    <span id="pull-text">Pull down to refresh</span>
  </div>

  <!-- ═══ TOP HEADER ═══ -->
  <header class="top-header">
    <div class="brand" id="logo-text">Free<span>Upper</span></div>
    <div class="header-actions">
      <button class="msg-btn" id="topMsgBtn" aria-label="Messages">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="msg-badge"></span>
      </button>
    </div>
  </header>

  <!-- ═══ CATEGORY CHIPS ═══ -->
  <div id="category-chips">
    <div class="max-w-5xl mx-auto px-2 flex items-center justify-between">
      <div id="chips-container">
        <button class="tab-pill tab-pill--active" id="tab-foryou">For You</button>
        <button class="tab-pill" id="tab-explore">Explore</button>
        <button class="tab-pill" id="tab-market">Market</button>
      </div>
    </div>
  </div>

  <!-- ═══ MAIN CONTENT ═══ -->
  <div id="user-content"></div>

  <!-- ═══ GLOBAL COMMENT BAR ═══ -->
  <div id="global-comment-bar">
    <div id="reply-context-banner"><span>Replying to</span> <span id="reply-context-username"></span> <button id="reply-cancel-btn">✕</button></div>
    <div class="global-comment-row">
      <textarea id="global-comment-textarea" placeholder="Post your reply..." rows="1"></textarea>
      <button type="button" id="global-comment-submit-btn">Post</button>
    </div>
  </div>

  <!-- ═══ TOAST ═══ -->
  <div id="toast"></div>

  <!-- ═══ SHEET BACKDROP ═══ -->
  <div class="sheet-backdrop" id="backdrop" onclick="closeAllSheets()"></div>

  <!-- ═══ SHARE SHEET ═══ -->
  <div class="sheet" id="shareSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <span class="sheet-title">Share</span>
      <button class="sheet-close" onclick="closeSheet('shareSheet')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="share-preview" id="sharePreview">
      <img class="share-preview-thumb" id="sharePreviewThumb" src="" alt="">
      <div class="share-preview-meta">
        <div class="share-preview-caption" id="sharePreviewCaption"></div>
        <div class="share-preview-handle" id="sharePreviewHandle"></div>
      </div>
    </div>
    <div class="share-grid">
      <button class="share-item" id="nativeShareBtn" onclick="shareAction('native')" style="display:none">
        <div class="share-ico" style="background:rgba(139,92,246,.22)">
          <svg viewBox="0 0 24 24" style="stroke:#8b5cf6;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:26px;height:26px"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        </div>
        <span class="share-lbl">Share via…</span>
      </button>
      <button class="share-item" onclick="shareAction('repost')">
        <div class="share-ico" style="background:rgba(0,186,124,.15)">
          <svg viewBox="0 0 24 24" style="stroke:#00ba7c;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:26px;height:26px"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </div>
        <span class="share-lbl">Repost</span>
      </button>
      <button class="share-item" onclick="shareAction('quote')">
        <div class="share-ico" style="background:rgba(29,155,240,.15)">
          <svg viewBox="0 0 24 24" style="stroke:#1d9bf0;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:26px;height:26px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <span class="share-lbl">Quote</span>
      </button>
      <button class="share-item" id="copyLinkBtn" onclick="shareAction('copy')">
        <div class="share-ico" id="copyLinkIco" style="background:rgba(29,161,242,.22)">
          <svg viewBox="0 0 24 24" style="stroke:#1d9bf0;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;width:26px;height:26px"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </div>
        <span class="share-lbl" id="copyLbl">Copy link</span>
      </button>
    </div>
    <div class="share-links">
      <button class="share-link-row" onclick="shareAction('whatsapp')">
        <div class="share-link-ico" style="background:rgba(37,211,102,.15)">
          <svg viewBox="0 0 24 24" style="stroke:#25d366;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <span class="share-link-txt">WhatsApp</span>
      </button>
      <button class="share-link-row" onclick="shareAction('twitter')">
        <div class="share-link-ico" style="background:rgba(255,255,255,.1)">
          <svg viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 4l16 16M20 4L4 20"/></svg>
        </div>
        <span class="share-link-txt">X (Twitter)</span>
      </button>
      <button class="share-link-row" onclick="shareAction('telegram')">
        <div class="share-link-ico" style="background:rgba(41,182,246,.15)">
          <svg viewBox="0 0 24 24" style="stroke:#29b6f6;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
        </div>
        <span class="share-link-txt">Telegram</span>
      </button>
      <button class="share-link-row" onclick="shareAction('facebook')">
        <div class="share-link-ico" style="background:rgba(24,119,242,.15)">
          <svg viewBox="0 0 24 24" style="stroke:#1877f2;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </div>
        <span class="share-link-txt">Facebook</span>
      </button>
      <button class="share-link-row" onclick="shareAction('instagram')">
        <div class="share-link-ico" style="background:rgba(225,48,108,.15)">
          <svg viewBox="0 0 24 24" style="stroke:#e1306c;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        </div>
        <span class="share-link-txt">Instagram</span>
      </button>
      <button class="share-link-row" id="saveVideoBtn" onclick="shareAction('download')">
        <div class="share-link-ico">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </div>
        <span class="share-link-txt" id="saveVideoLbl">Save Video</span>
      </button>
    </div>
    <button class="share-cancel-btn" onclick="closeSheet('shareSheet')">Cancel</button>
  </div>

  <!-- ═══ REPOST COMPOSER ═══ -->
  <div class="sheet" id="repostSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <span class="sheet-title">Repost</span>
      <button class="sheet-close" onclick="closeSheet('repostSheet')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="composer-body">
      <textarea class="composer-input" id="repostComment" placeholder="Also add a comment… (optional)" maxlength="280"></textarea>
    </div>
    <div class="composer-actions">
      <button class="composer-btn ghost" onclick="closeSheet('repostSheet')">Cancel</button>
      <button class="composer-btn solid" onclick="submitRepost()">Repost</button>
    </div>
  </div>

  <!-- ═══ QUOTE COMPOSER ═══ -->
  <div class="sheet" id="quoteSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <span class="sheet-title">Quote</span>
      <button class="sheet-close" onclick="closeSheet('quoteSheet')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="composer-body">
      <textarea class="composer-input" id="quoteComment" placeholder="Add your thoughts…" maxlength="280"></textarea>
    </div>
    <div class="composer-actions">
      <button class="composer-btn ghost" onclick="closeSheet('quoteSheet')">Cancel</button>
      <button class="composer-btn solid" onclick="submitQuote()">Post</button>
    </div>
  </div>

  <!-- ═══ COMMENT SHEET ═══ -->
  <div class="sheet" id="commentSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <span class="sheet-title" id="commentCount">0 comments</span>
      <button class="sheet-sort-btn" onclick="toggleSortMenu()">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
      </button>
      <button class="sheet-close" onclick="closeSheet('commentSheet')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="reply-context-banner">
      <span>Replying to</span>
      <span id="reply-context-username"></span>
      <button id="reply-cancel-btn" onclick="cancelReply()">✕</button>
    </div>
    <div class="sheet-body" id="commentBody">
      <div id="comments-list"></div>
    </div>
    <div class="comment-inp-row">
      <img class="comment-inp-ava" id="commentUserAvatar" src="" alt="" onerror="this.style.display='none'" />
      <div class="comment-inp-wrap">
        <input class="comment-inp" id="commentInput" placeholder="Add a comment…" maxlength="280" />
        <button class="comment-icon-btn">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <button class="comment-icon-btn">@</button>
        <button class="comment-icon-btn">
          <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M12 8v13M19 12v9H5v-9M12 8a3 3 0 1 0-3-3c0 1.5 3 3 3 3zM12 8a3 3 0 1 1 3-3c0 1.5-3 3-3 3z"/></svg>
        </button>
      </div>
      <button class="comment-send" onclick="submitCommentFromBar()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- ═══ SIDE NAV (desktop) ═══ -->
  <nav class="side-nav">
    <div class="side-logo"><a href="index.html">◈</a></div>
    <a href="index.html" class="side-btn active">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
      <span>Home</span>
    </a>
    <a href="search.html" class="side-btn">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
