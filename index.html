<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>FreeUpper — Home</title>
    <link rel="icon" type="image/png" href="freeupper.png" />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#7C3AED', 'primary-light': '#8B5CF6', 'primary-dark': '#6D28D9' },
                    fontFamily: { heading: ['Poppins', 'Inter', 'sans-serif'], body: ['Inter', 'Roboto', 'sans-serif'] },
                    borderRadius: { soft: '10px', softer: '14px' },
                    animation: { spin: 'spin 0.8s linear infinite' }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- ═══ SUPABASE & API MODULES ═══ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script src="global.js">
    </script>
    <script src="auth.js">
    </script>
    <script src="posts.js">
    </script>

    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --gold: #FFD700;
            --heart-red: #DC2626;
            --bg: #ffffff;
            --bg2: #f9fafb;
            --bg3: #ffffff;
            --bg4: #f3f4f6;
            --text: #111827;
            --muted: #6B7280;
            --muted2: #9CA3AF;
            --brd: #e5e7eb;
            --brd2: #d1d5db;
            --inp: #f9fafb;
            --p: #7C3AED;
            --pd: #6D28D9;
            --pdim: rgba(124, 58, 237, 0.1);
            --pbrd: #7C3AED;
            --pglow: rgba(124, 58, 237, 0.35);
            --navbg: rgba(255, 255, 255, 0.92);
            --sidebg: #f9fafb;
            --bottom-nav-height: 64px;
            --sheet-bg: #1a1a1a;
            --sheet-bd: rgba(255, 255, 255, 0.08);
            --inp-bg: rgba(255, 255, 255, 0.06);
            --rowh: rgba(255, 255, 255, 0.06);
            --red: #DC2626;
        }

        [data-theme="dark"] {
            --bg: #0f0f0f;
            --bg2: #1a1a1a;
            --bg3: #242424;
            --bg4: #2a2a2a;
            --text: #f0f0f0;
            --muted: #9ca3af;
            --muted2: #6b7280;
            --brd: #2a2a2a;
            --brd2: #3a3a3a;
            --inp: #1f1f1f;
            --navbg: rgba(20, 20, 20, 0.92);
            --sidebg: #0f0f0f;
            --sheet-bg: #1a1a1a;
            --sheet-bd: rgba(255, 255, 255, 0.08);
            --inp-bg: rgba(255, 255, 255, 0.06);
            --rowh: rgba(255, 255, 255, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            touch-action: manipulation;
            padding-top: var(--safe-top);
            padding-bottom: calc(var(--bottom-nav-height) + 20px);
            transition: padding-bottom 0.3s ease;
        }
        body.nav-hidden {
            padding-bottom: 0;
        }

        .font-heading {
            font-family: 'Poppins', 'Inter', sans-serif;
        }
        body.single-post-open nav.sticky,
        body.single-post-open #category-chips,
        body.explore-open nav.sticky,
        body.explore-open #category-chips,
        body.market-fullscreen-open nav.sticky,
        body.market-fullscreen-open #category-chips {
            display: none !important;
        }

        /* ── SIDE NAV (desktop) ── */
        .side-nav {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            flex-direction: column;
            align-items: center;
            padding: 28px 0 24px;
            background: var(--sidebg);
            border-right: 1px solid var(--brd);
            width: 70px;
            flex-shrink: 0;
            gap: 2px;
            z-index: 30;
            transition: background .3s, border-color .3s;
        }
        .side-logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--p);
            margin-bottom: 20px;
            letter-spacing: -1px;
            cursor: pointer;
        }
        .side-logo a {
            color: inherit;
            text-decoration: none;
        }
        .side-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s, transform .1s;
            background: none;
            border: none;
            position: relative;
            gap: 3px;
            color: inherit;
            text-decoration: none;
        }
        .side-btn:hover {
            background: var(--pdim);
            transform: scale(1.04);
        }
        .side-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .side-btn span {
            font-size: 8px;
            color: var(--muted2);
            font-weight: 600;
        }
        .side-btn.active svg {
            stroke: var(--p);
        }
        .side-btn.active span {
            color: var(--p);
        }
        .side-btn .side-badge {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--p);
            border: 1.5px solid var(--sidebg);
        }
        .side-gap {
            flex: 1;
        }
        .side-av {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .side-btn.active .side-av {
            border-color: var(--p);
        }

        @media (min-width: 768px) {
            .side-nav {
                display: flex;
            }
            body {
                padding-left: 70px;
                padding-bottom: 0 !important;
            }
            .bottom-nav {
                display: none !important;
            }
        }

        /* ── BOTTOM NAV (mobile) ── */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--navbg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-top: 1px solid var(--brd);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 max(env(safe-area-inset-bottom), 12px);
            z-index: 30;
            transition: transform 0.35s cubic-bezier(0.32, 0.94, 0.6, 1), background .3s, border-color .3s;
            height: var(--bottom-nav-height);
            transform: translateY(0);
            will-change: transform;
        }
        .bottom-nav.hidden-nav {
            transform: translateY(100%);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px clamp(6px, 2vw, 12px);
            border-radius: 14px;
            transition: background .15s;
            position: relative;
            background: none;
            border: none;
            text-decoration: none;
            color: inherit;
        }
        .nav-item:hover {
            background: var(--pdim);
        }
        .nav-item svg {
            width: clamp(20px, 5vw, 24px);
            height: clamp(20px, 5vw, 24px);
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .nav-item span {
            font-size: clamp(8px, 1.8vw, 10px);
            color: var(--muted);
            font-weight: 600;
            letter-spacing: .03em;
        }
        .nav-item.active svg {
            stroke: var(--p);
        }
        .nav-item.active span {
            color: var(--p);
        }
        .nav-av {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .nav-item.active .nav-av {
            border-color: var(--p);
        }
        .nav-badge {
            position: absolute;
            top: 2px;
            right: clamp(2px, 1vw, 4px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #EF4444;
            border: 1.5px solid var(--bg);
        }

        /* Raised "Create" button */
        .add-post-btn {
            background: var(--p);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(139, 92, 246, .4);
            transform: translateY(-2px);
            flex-shrink: 0;
            transition: transform .15s, box-shadow .15s;
        }
        .add-post-btn:active {
            transform: translateY(-2px) scale(.92);
        }
        .add-post-btn svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        /* ── TOP HEADER ── */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--bg2);
            border-bottom: 1px solid var(--brd);
            position: sticky;
            top: 0;
            z-index: 29;
        }
        .top-header .brand {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .top-header .brand span {
            color: var(--p);
        }
        .top-header .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-header .header-actions .msg-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--pdim);
            border: none;
            cursor: pointer;
            color: var(--p);
            transition: background .2s, transform .15s;
            position: relative;
        }
        .top-header .header-actions .msg-btn:hover {
            background: rgba(124, 58, 237, 0.2);
            transform: scale(1.05);
        }
        .top-header .header-actions .msg-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--p);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .top-header .header-actions .msg-btn .msg-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #EF4444;
            border: 2px solid var(--bg2);
        }

        /* ── PULL TO REFRESH ── */
        #pull-indicator {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            z-index: 60;
            background: #fff;
            border: 1px solid #E5E7EB;
            border-radius: 999px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .1);
            transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
            opacity: 0;
            pointer-events: none;
            font-size: .8rem;
            font-weight: 600;
            color: #7C3AED;
        }
        #pull-indicator.visible {
            transform: translateX(-50%) translateY(12px);
            opacity: 1;
        }
        #pull-indicator.releasing {
            background: #F5F3FF;
        }

        /* ── FEED POSTS ── */
        .feed-post {
            border-bottom: 1px solid var(--brd);
            padding: 16px 0;
            position: relative;
            transition: background .1s ease;
            cursor: pointer;
            background: var(--bg3);
            margin-bottom: 8px;
        }
        .feed-post:active {
            background: rgba(0, 0, 0, .02);
        }
        .feed-post:last-child {
            border-bottom: 1px solid var(--brd);
        }

        .content-text {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 16px;
            color: var(--text);
            font-weight: 400;
            word-wrap: break-word;
        }
        .content-text p {
            margin: 0 0 12px 0;
        }
        .content-text p:last-child {
            margin-bottom: 0;
        }

        .content-preview {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 16px;
            color: var(--text);
            font-weight: 400;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        .feed-post .post-body {
            padding: 0 16px;
            max-width: 100%;
        }

        /* ── FULL-WIDTH MEDIA ── */
        .ig-media-container {
            width: calc(100% + 32px);
            margin-left: -16px;
            margin-right: -16px;
            border-radius: 0 !important;
            overflow: hidden;
            margin-top: 10px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 80vh;
        }
        .ig-media-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .ig-video-wrap {
            position: relative;
            width: calc(100% + 32px);
            margin-left: -16px;
            margin-right: -16px;
            background: #000;
            border-radius: 0 !important;
            overflow: hidden;
            margin-top: 10px;
        }
        .ig-video-wrap video {
            width: 100%;
            display: block;
            max-height: 70vh;
            object-fit: contain;
            background: #000;
            pointer-events: none;
        }
        .ig-video-wrap .plyr--video {
            background: #000;
        }
        .ig-video-wrap .plyr__controls {
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(4px);
        }
        .ig-video-wrap .plyr__control--overlaid {
            background: rgba(124, 58, 237, .85);
        }
        .ig-video-wrap .plyr__control--overlaid:hover {
            background: #7C3AED;
        }

        .ig-video-wrap .yt-wrap {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .ig-video-wrap .yt-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .ig-video-wrap .yt-tap {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: pointer;
        }
        .ig-video-wrap .yt-mute-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 34px;
            height: 34px;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
            pointer-events: none;
            opacity: .95;
            transition: opacity .2s;
        }
        .ig-video-wrap .yt-mute-badge svg {
            width: 17px;
            height: 17px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .ig-video-wrap .yt-pause-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 68px;
            height: 68px;
            background: rgba(0, 0, 0, .5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
            transition: transform .12s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
            opacity: 0;
            pointer-events: none;
        }
        .ig-video-wrap .yt-pause-icon svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }
        .ig-video-wrap .yt-pause-icon.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .ig-video-wrap .yt-pause-icon.hide {
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
        }
        .ig-video-wrap .yt-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, .2);
            z-index: 12;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .ig-video-wrap .yt-progress-fill {
            height: 100%;
            background: #fff;
            border-radius: 0 2px 2px 0;
            transition: width .1s linear;
            pointer-events: none;
            width: 0%;
        }
        .ig-video-wrap .yt-progress-thumb {
            position: absolute;
            top: 50%;
            right: calc(100% - var(--pct, 0%));
            transform: translate(50%, -50%) scale(0);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            transition: transform .15s;
            pointer-events: none;
        }
        .ig-video-wrap .yt-progress:hover .yt-progress-thumb,
        .ig-video-wrap .yt-progress:active .yt-progress-thumb {
            transform: translate(50%, -50%) scale(1);
        }

        /* ── CAROUSEL ── */
        .media-carousel {
            width: calc(100% + 32px);
            margin-left: -16px;
            margin-right: -16px;
            position: relative;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
            max-height: 80vh;
            margin-top: 10px;
            border-radius: 0;
        }
        .media-carousel-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            height: 100%;
            width: 100%;
            will-change: transform;
        }
        .media-carousel-slide {
            flex: 0 0 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }
        .media-carousel-slide img,
        .media-carousel-slide video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }
        .media-carousel-slide video {
            pointer-events: none;
        }
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .carousel-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .carousel-dot.active {
            background: #fff;
            width: 18px;
            border-radius: 4px;
        }
        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            cursor: pointer;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, transform 0.2s ease;
            backdrop-filter: blur(4px);
            opacity: 1;
        }
        .carousel-arrow.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .carousel-arrow:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: translateY(-50%) scale(1.05);
        }
        .carousel-arrow:active {
            transform: translateY(-50%) scale(0.92);
        }
        .carousel-arrow.left {
            left: 8px;
        }
        .carousel-arrow.right {
            right: 8px;
        }
        .carousel-arrow svg {
            width: 18px;
            height: 18px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── EXPLORE GRID ── */
        .explore-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px;
        }
        @media (min-width: 640px) {
            .explore-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 12px;
            }
        }
        .explore-card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: #111;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            opacity: 0;
            transform: scale(.97);
            transition: opacity .35s ease, transform .35s ease;
        }
        .explore-card.loaded {
            opacity: 1;
            transform: scale(1);
        }
        .explore-card:active {
            transform: scale(.97);
            transition: transform .15s;
        }
        .explore-card-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .explore-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, .85));
            padding: 32px 9px 10px;
        }
        .explore-card-title {
            font-size: .78rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .explore-card-meta {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .explore-card-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, .55);
            flex-shrink: 0;
            background: #374151;
        }
        .explore-card-author {
            font-size: .68rem;
            font-weight: 600;
            color: rgba(255, 255, 255, .85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .explore-card-views {
            font-size: .65rem;
            color: rgba(255, 255, 255, .65);
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .explore-card-category {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(124, 58, 237, .9);
            color: #fff;
            font-size: .58rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        .explore-card-video-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, .65);
            color: #fff;
            font-size: .6rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 3px;
            backdrop-filter: blur(4px);
        }
        .explore-card-no-media {
            width: 100%;
            height: 100%;
            background: #1F2937;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .explore-card-no-media-text {
            font-size: .7rem;
            font-weight: 700;
            color: rgba(255, 255, 255, .25);
            text-align: center;
            padding: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .explore-skeleton-card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: #1a1a1a;
        }
        .explore-skeleton-thumb {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #1f1f1f 25%, #2a2a2a 50%, #1f1f1f 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }

        /* ── MARKET GRID ── */
        .market-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 8px 0;
        }
        @media (min-width: 640px) {
            .market-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 12px;
            }
        }
        .market-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
            border: 1px solid #F3F4F6;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
            transition: transform .18s ease;
            animation: feedFadeIn .35s ease-out;
        }
        .market-card:active {
            transform: scale(.97);
        }
        .market-card-image-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            background: #F9FAFB;
        }
        .market-card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .market-card-no-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F3F4F6;
            color: #D1D5DB;
        }
        .market-card-price-tag {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, .78);
            color: #fff;
            font-weight: 700;
            font-size: .8rem;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .market-card-body {
            padding: 10px 12px 12px;
        }
        .market-card-title {
            font-size: .82rem;
            font-weight: 600;
            color: #111827;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .market-card-location {
            font-size: .68rem;
            color: #9CA3AF;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .market-card-seller-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #F3F4F6;
        }
        .market-card-seller-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .market-card-seller-name {
            font-size: .68rem;
            color: #6B7280;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .market-card-category-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(124, 58, 237, .9);
            color: #fff;
            font-size: .55rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            letter-spacing: .04em;
            text-transform: uppercase;
            z-index: 2;
        }
        .market-skeleton-card {
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            border: 1px solid #F3F4F6;
        }
        .market-skeleton-image {
            width: 100%;
            aspect-ratio: 1/1;
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }
        .market-skeleton-body {
            padding: 10px 12px 12px;
        }
        .market-skeleton-line {
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            margin-bottom: 6px;
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        /* ── REACTION & BOOKMARK ANIMATIONS ── */
        @keyframes bounceHeart {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.35);
            }
            50% {
                transform: scale(0.92);
            }
            70% {
                transform: scale(1.12);
            }
            100% {
                transform: scale(1);
            }
        }
        .reaction-btn.bounce-heart .heart-icon-wrap svg {
            animation: bounceHeart 0.5s cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes bookmarkBreathe {
            0% {
                transform: scale(1) rotate(0deg);
            }
            40% {
                transform: scale(1.3) rotate(-6deg);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
            }
        }
        .bookmark-badge.bookmark-breathe svg {
            animation: bookmarkBreathe 0.4s cubic-bezier(.34, 1.56, .64, 1);
        }

        .skeleton-post {
            padding: 16px 0;
            border-bottom: 1px solid var(--brd);
        }
        .skeleton-line {
            height: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .skeleton-title {
            height: 20px;
            width: 75%;
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .skeleton-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .skeleton-image {
            width: 100%;
            height: 180px;
            border-radius: 0;
            margin: 10px 0;
        }
        .skeleton-reactions {
            height: 24px;
            width: 220px;
            border-radius: 20px;
            margin-top: 12px;
        }
        @keyframes feedFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle-filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: .72rem;
            font-weight: 700;
            cursor: pointer;
            border: 1.5px solid var(--brd);
            background: var(--bg3);
            color: var(--muted);
            transition: all .15s;
            white-space: nowrap;
        }
        .subtitle-filter-btn:hover,
        .subtitle-filter-btn.active {
            background: #F5F3FF;
            border-color: #7C3AED;
            color: #7C3AED;
        }

        /* ── VERIFIED BADGE ── */
        .verified-badge,
        .verified-badge-sm,
        .verified-badge-lg {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--p), var(--pd));
            border-radius: 50%;
            box-shadow: 0 2px 10px var(--pglow);
            margin-left: 2px;
            vertical-align: middle;
        }
        .verified-badge {
            width: 20px;
            height: 20px;
        }
        .verified-badge-sm {
            width: 16px;
            height: 16px;
            box-shadow: 0 2px 6px var(--pglow);
        }
        .verified-badge-lg {
            width: 24px;
            height: 24px;
            box-shadow: 0 2px 12px var(--pglow);
        }
        .verified-badge svg,
        .verified-badge-sm svg,
        .verified-badge-lg svg {
            stroke: #fff;
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            width: 100%;
            height: 100%;
        }

        /* ── FOLLOW BUTTON ── */
        .follow-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 14px;
            border-radius: 100px;
            font-size: .72rem;
            font-weight: 700;
            border: 1.5px solid #7C3AED;
            background: #7C3AED;
            color: #fff;
            cursor: pointer;
            transition: background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
            margin-left: 4px;
            flex-shrink: 0;
        }
        .follow-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(124, 58, 237, .35);
        }
        .follow-btn:active {
            transform: scale(.95);
        }
        .follow-btn.following {
            background: transparent;
            color: #7C3AED;
            border-color: var(--brd2);
        }
        .follow-btn.following:hover {
            background: rgba(220, 38, 38, .08);
            color: #DC2626;
            border-color: rgba(220, 38, 38, .3);
        }
        .follow-btn.following:hover::after {
            content: ' Unfollow';
        }
        .follow-btn.friends {
            background: var(--pdim);
            color: var(--p) !important;
            border-color: var(--pbrd);
        }
        .follow-btn.friends:hover {
            background: rgba(220, 38, 38, .08);
            color: #DC2626;
            border-color: rgba(220, 38, 38, .3);
        }
        .follow-btn.friends:hover::after {
            content: ' Unfriend';
        }

        /* ── POST ACTIONS ROW ── */
        .post-actions-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            max-width: 100%;
        }
        .post-actions-row .comment-btn,
        .post-actions-row .reaction-btn,
        .post-actions-row .views-count,
        .post-actions-row .bookmark-badge,
        .post-actions-row .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 20px;
            font-size: .85rem;
            color: var(--muted);
            cursor: pointer;
            transition: background .15s, color .15s;
            background: transparent;
            border: none;
            font-weight: 500;
        }
        .post-actions-row .comment-btn:hover {
            background: rgba(124, 58, 237, .08);
            color: #7C3AED;
        }
        .post-actions-row .share-btn:hover {
            background: rgba(124, 58, 237, .08);
            color: #7C3AED;
        }
        .post-actions-row .reaction-btn:hover {
            background: rgba(220, 38, 38, .08);
            color: var(--heart-red);
        }
        .post-actions-row .bookmark-badge:hover {
            background: rgba(255, 215, 0, .15);
            color: var(--gold);
        }
        .post-actions-row .bookmark-badge.bookmarked {
            color: var(--gold);
        }
        .post-actions-row .bookmark-badge.bookmarked svg {
            fill: var(--gold);
            stroke: var(--gold);
        }
        .post-actions-row .reaction-btn.reacted {
            color: var(--heart-red);
        }
        .post-actions-row svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .post-actions-row .reaction-count,
        .post-actions-row .comment-count {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-size: .85rem;
        }
        .post-actions-row .views-count span {
            font-weight: 500;
        }

        /* ── TAB PILLS ── */
        .tab-pill {
            padding: 14px 16px;
            font-size: .9rem;
            font-weight: 700;
            color: #6B7280;
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
            white-space: nowrap;
            transition: color .2s;
            flex: 1;
            text-align: center;
        }
        .tab-pill::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 56px;
            height: 3px;
            background: #7C3AED;
            border-radius: 3px 3px 0 0;
            transform: translateX(-50%) scaleX(0);
            transition: transform .2s ease;
        }
        .tab-pill--active {
            color: var(--text);
        }
        .tab-pill--active::after {
            transform: translateX(-50%) scaleX(1);
        }
        [data-theme="dark"] .tab-pill--active {
            color: #fff;
        }

        #category-chips {
            position: sticky;
            top: 52px;
            z-index: 20;
            background: var(--bg2);
            border-bottom: 1px solid var(--brd);
        }
        #chips-container {
            display: flex;
            width: 100%;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid var(--brd);
            border-top-color: #7C3AED;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #toast {
            transition: all .3s cubic-bezier(.68, -.55, .265, 1.55);
        }

        @media (max-width: 640px) {
            .top-header .brand {
                font-size: 1.05rem;
            }
            .top-header .header-actions .msg-btn {
                width: 34px;
                height: 34px;
            }
            .top-header .header-actions .msg-btn svg {
                width: 20px;
                height: 20px;
            }
            #category-chips .tab-pill {
                padding: 10px 12px;
                font-size: .78rem;
            }
            #category-chips .tab-pill::after {
                width: 40px;
            }
            .explore-grid {
                gap: 6px;
                padding: 8px;
            }
            .market-grid {
                gap: 8px;
                padding: 4px 0;
            }
            .post-actions-row {
                gap: 2px;
                flex-wrap: nowrap;
                justify-content: space-between;
            }
            .post-actions-row .comment-btn,
            .post-actions-row .reaction-btn,
            .post-actions-row .views-count,
            .post-actions-row .bookmark-badge,
            .post-actions-row .share-btn {
                padding: 4px 4px;
                font-size: .7rem;
            }
            .post-actions-row svg {
                width: 15px;
                height: 15px;
            }
            .feed-post {
                margin-bottom: 6px;
                border-radius: 10px;
            }
            .ig-media-container,
            .ig-video-wrap,
            .media-carousel {
                width: 100%;
                margin-left: 0;
                margin-right: 0;
                border-radius: 0 !important;
            }
        }

        /* ── SHEETS ── */
        .sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--sheet-bg);
            border-radius: 24px 24px 0 0;
            transform: translateY(100%);
            transition: transform .35s cubic-bezier(.4, 0, .2, 1);
            z-index: 110;
            display: flex;
            flex-direction: column;
            max-height: 92dvh;
            border-top: 1px solid var(--sheet-bd);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, .4);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .sheet.open {
            transform: translateY(0);
        }
        .sheet-handle {
            width: 40px;
            height: 4px;
            border-radius: 2px;
            background: var(--muted2);
            margin: 10px auto 6px;
            flex-shrink: 0;
            opacity: .4;
        }
        .sheet-hdr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 18px 10px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--sheet-bd);
        }
        .sheet-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }
        .sheet-sort-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: background .15s;
        }
        .sheet-sort-btn:hover {
            background: var(--rowh);
        }
        .sheet-sort-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2;
        }
        .sheet-close {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: background .15s;
        }
        .sheet-close:hover {
            background: var(--rowh);
        }
        .sheet-close svg {
            width: 20px;
            height: 20px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2;
        }

        #backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease;
        }
        #backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* ── SHARE SHEET ── */
        .share-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--sheet-bd);
        }
        .share-preview-thumb {
            width: 48px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--bg4);
            flex-shrink: 0;
        }
        .share-preview-meta {
            min-width: 0;
        }
        .share-preview-caption {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .share-preview-handle {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .share-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            padding: 16px 12px 8px;
        }
        .share-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 8px;
            border-radius: 14px;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform .12s ease, background .18s;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }
        .share-item:active {
            transform: scale(.95);
        }
        .share-item:hover {
            background: rgba(255, 255, 255, .07);
        }
        .share-ico {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .share-ico svg {
            width: 26px;
            height: 26px;
        }
        .share-lbl {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        .share-item.copied .share-ico {
            background: rgba(0, 186, 124, .18) !important;
        }
        .share-item.copied .share-lbl {
            color: #00ba7c;
        }

        .share-links {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 4px 12px 12px;
        }
        .share-link-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 8px;
            border-radius: 12px;
            background: none;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: transform .12s ease, background .18s;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }
        .share-link-row:active {
            transform: scale(.95);
        }
        .share-link-row:hover {
            background: rgba(255, 255, 255, .07);
        }
        .share-link-ico {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .share-link-ico svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .share-link-txt {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .share-cancel-btn {
            width: calc(100% - 24px);
            margin: 4px 12px calc(12px + env(safe-area-inset-bottom));
            padding: 14px;
            border-radius: 14px;
            background: var(--inp-bg);
            border: none;
            color: var(--text);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: transform .12s ease, background .18s;
            position: relative;
            overflow: hidden;
        }
        .share-cancel-btn:active {
            transform: scale(.95);
        }
        .share-cancel-btn:hover {
            background: var(--bg4);
        }

        /* ── COMMENT SHEET ── */
        #commentSheet {
            height: 88dvh;
            max-height: 88dvh;
        }
        #commentSheet .sheet-body {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 8px;
            scrollbar-width: none;
        }
        #commentSheet .sheet-body::-webkit-scrollbar {
            display: none;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            padding: 14px 18px;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
        }
        .comment-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--muted);
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
            font-size: 16px;
        }
        .comment-avatar.has-image {
            background: transparent;
            padding: 0;
        }
        .comment-avatar.has-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .comment-body {
            flex: 1;
            min-width: 0;
        }
        .comment-username-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .creator-lbl {
            color: var(--p);
            font-weight: 700;
            font-size: 13px;
        }
        .comment-username {
            color: var(--text);
            font-weight: 700;
            font-size: 14px;
        }
        .comment-time {
            color: var(--muted2);
            font-size: 12px;
        }
        .comment-text {
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 6px;
            word-break: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        .comment-reply-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            transition: color .15s;
        }
        .comment-reply-btn:hover {
            color: var(--p);
        }

        .comment-like-btn {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            flex-shrink: 0;
            padding: 0 0 0 8px;
            margin-left: auto;
            min-width: 32px;
        }
        .like-heart {
            width: 18px;
            height: 18px;
            stroke: var(--muted2);
            fill: none;
            transition: stroke .15s, fill .15s, transform .2s cubic-bezier(.34, 1.56, .64, 1);
        }
        .comment-like-btn.liked .like-heart {
            stroke: var(--red);
            fill: var(--red);
            transform: scale(1.1);
        }
        .comment-like-btn .like-count {
            font-size: 11px;
            color: var(--muted2);
            font-weight: 600;
        }
        .comment-like-btn.liked .like-count {
            color: var(--red);
        }

        .replies-thread {
            border-left: 2px solid var(--brd);
            margin-left: 20px;
            padding-left: 0;
            box-sizing: border-box;
            width: calc(100% - 20px);
            margin-top: 4px;
        }
        .reply-item {
            display: flex;
            gap: 8px;
            padding: 8px 0 8px 16px;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
        }
        .reply-avatar-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--bg4);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.6rem;
            color: var(--muted);
            margin-left: -12px;
            border: 2px solid var(--bg);
            z-index: 2;
            overflow: hidden;
            cursor: pointer;
        }
        .reply-avatar-dot.has-image {
            background: transparent;
            padding: 0;
        }
        .reply-avatar-dot.has-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .reply-body {
            flex: 1;
            min-width: 0;
        }
        .reply-username {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1px;
        }
        .reply-text {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 0.88rem;
            color: var(--text);
            font-weight: 400;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .reply-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .reply-time {
            font-size: 0.7rem;
            color: var(--muted2);
        }
        .reply-reply-btn {
            font-size: 0.7rem;
            color: var(--muted);
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .reply-reply-btn:hover {
            color: var(--p);
        }
        .reply-like-btn {
            font-size: 0.7rem;
            color: var(--muted2);
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .reply-like-btn.liked {
            color: var(--red);
        }

        .view-replies-btn,
        .hide-replies-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.78rem;
            color: var(--p);
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            margin-top: 4px;
            transition: color .15s;
        }
        .view-replies-btn:hover,
        .hide-replies-btn:hover {
            text-decoration: underline;
            color: var(--pd);
        }
        .view-replies-btn {
            margin-left: 52px;
        }
        .hide-replies-btn {
            margin-left: 20px;
            padding-left: 16px;
            color: var(--muted);
        }
        .hide-replies-btn:hover {
            color: var(--text);
        }

        .load-more-comments-btn {
            margin-left: 0 !important;
            padding: 8px 0;
            color: var(--p);
        }

        .comment-inp-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--sheet-bd);
            background: var(--sheet-bg);
            flex-shrink: 0;
        }
        .comment-inp-ava {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--bg4);
        }
        .comment-inp-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--inp-bg);
            border: 1px solid var(--sheet-bd);
            border-radius: 100px;
            padding: 8px 14px;
            gap: 6px;
        }
        .comment-inp {
            flex: 1;
            background: none;
            border: none;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            min-width: 0;
        }
        .comment-inp::placeholder {
            color: var(--muted2);
        }
        .comment-icon-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 2px 4px;
            flex-shrink: 0;
            color: var(--muted2);
            transition: color .15s, transform .12s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .comment-icon-btn:hover {
            color: var(--text);
        }
        .comment-icon-btn:active {
            transform: scale(.9);
        }
        .comment-icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: var(--muted2);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .comment-icon-btn:hover svg {
            stroke: var(--text);
        }
        .comment-send {
            width: 32px;
            height: 32px;
            background: var(--p);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform .15s, background .15s;
        }
        .comment-send:active {
            transform: scale(.88);
        }
        .comment-send:hover {
            background: var(--pd);
        }
        .comment-send svg {
            width: 15px;
            height: 15px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        #reply-context-banner {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 6px 18px;
            font-size: 0.8rem;
            color: var(--muted);
            background: var(--inp-bg);
            border-bottom: 1px solid var(--sheet-bd);
        }
        #reply-context-banner.show {
            display: flex;
        }
        #reply-context-username {
            font-weight: 600;
            color: var(--p);
        }
        #reply-cancel-btn {
            margin-left: auto;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--muted);
            padding: 2px 6px;
            border-radius: 4px;
            line-height: 1;
        }
        #reply-cancel-btn:hover {
            color: var(--text);
            background: var(--rowh);
        }

        /* SORT POPOVER */
        #sortMenuPopover {
            position: absolute;
            top: 52px;
            right: 52px;
            background: var(--sheet-bg);
            border: 1px solid var(--sheet-bd);
            border-radius: 12px;
            overflow: hidden;
            z-index: 210;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
            min-width: 170px;
        }
        #sortMenuPopover .sort-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            background: none;
            border: none;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background .15s;
        }
        #sortMenuPopover .sort-option:hover {
            background: var(--rowh);
        }
        #sortMenuPopover .sort-option:not(:last-child) {
            border-bottom: 1px solid var(--sheet-bd);
        }
        #sortMenuPopover .sort-option.active {
            font-weight: 800;
        }

        /* ── COMPOSER ── */
        .composer-body {
            padding: 16px 18px;
        }
        .composer-input {
            width: 100%;
            min-height: 90px;
            background: var(--inp-bg);
            border: 1px solid var(--sheet-bd);
            border-radius: 14px;
            padding: 12px 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        .composer-input::placeholder {
            color: var(--muted2);
        }
        .composer-actions {
            display: flex;
            gap: 10px;
            padding: 0 18px calc(16px + env(safe-area-inset-bottom));
        }
        .composer-btn {
            flex: 1;
            padding: 13px;
            border-radius: 100px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform .12s ease, background .18s;
            position: relative;
            overflow: hidden;
        }
        .composer-btn:active {
            transform: scale(.95);
        }
        .composer-btn.ghost {
            background: var(--inp-bg);
            color: var(--text);
        }
        .composer-btn.solid {
            background: var(--p);
            color: #fff;
        }
        .composer-btn.solid:hover {
            background: var(--pd);
        }

        /* ── LIGHTBOX ── */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .92);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .lightbox-modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        .lightbox-modal img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 8px;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* ── EXPLORE FULLSCREEN ── */
        .explore-fullscreen,
        .market-fullscreen,
        .market-filter-modal {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform .35s cubic-bezier(.4, 0, .2, 1);
            padding-top: var(--safe-top);
        }
        .explore-fullscreen {
            z-index: 80;
            overflow: hidden !important;
        }
        .market-fullscreen {
            z-index: 85;
        }
        .market-filter-modal {
            z-index: 86;
        }
        .explore-fullscreen.open,
        .market-fullscreen.open,
        .market-filter-modal.open {
            transform: translateY(0);
        }
        .explore-fullscreen-header,
        .market-fullscreen-header,
        .market-filter-header {
            position: relative;
            z-index: 10;
            background: var(--bg2);
            border-bottom: 1px solid var(--brd);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .explore-fullscreen-header {
            justify-content: space-between;
        }
        .explore-fullscreen-header .explore-category-name {
            font-weight: 600;
            font-size: .85rem;
            color: var(--muted);
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
        }
        #explore-fullscreen-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }
        .market-fullscreen-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .market-filter-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .category-group-header {
            font-weight: 700;
            font-size: .72rem;
            color: #7C3AED;
            text-transform: uppercase;
            letter-spacing: .06em;
            padding: 12px 4px 6px;
        }
        .category-option {
            width: 100%;
            text-align: left;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: .9rem;
            cursor: pointer;
            transition: .12s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .category-option:hover {
            background: var(--bg4);
        }
        .category-option.selected {
            background: var(--pdim);
            color: var(--p);
            font-weight: 700;
        }
        .category-option.selected::after {
            content: '✓';
            color: var(--p);
            font-weight: 700;
        }

        /* ── MARKET FULLSCREEN SLIDER ── */
        .market-fs-slider {
            position: relative;
            width: 100%;
            background: #000;
            overflow: hidden;
        }
        .market-fs-track {
            display: flex;
            transition: transform .3s ease;
            will-change: transform;
        }
        .market-fs-track img {
            flex: 0 0 100%;
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            display: block;
        }
        .market-fs-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 3;
        }
        .market-fs-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .45);
            transition: .2s;
        }
        .market-fs-dot.active {
            background: #fff;
            width: 16px;
            border-radius: 3px;
        }
        .market-fs-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, .45);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            color: #fff;
        }
        .market-fs-arrow.left {
            left: 8px;
        }
        .market-fs-arrow.right {
            right: 8px;
        }

        /* ── IN-APP WEBVIEW ── */
        #inapp-webview-overlay {
            background: var(--bg);
        }
        #inapp-webview-overlay .border-b {
            border-color: var(--brd);
        }

        /* ── FILTER DRAWER ── */
        #filter-drawer {
            background: var(--bg);
            border-radius: 24px 24px 0 0;
        }
        #filter-drawer .border-b,
        #filter-drawer .border-t {
            border-color: var(--brd);
        }
        .drawer-cat-btn {
            background: var(--inp);
            border: 1.5px solid transparent;
            color: var(--muted);
        }
        .drawer-cat-btn--active {
            background: var(--pdim);
            color: var(--p);
            border-color: var(--p);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 640px) {
            .top-header .brand {
                font-size: 1.05rem;
            }
            .top-header .header-actions .msg-btn {
                width: 34px;
                height: 34px;
            }
            .top-header .header-actions .msg-btn svg {
                width: 20px;
                height: 20px;
            }
            #category-chips .tab-pill {
                padding: 10px 12px;
                font-size: .78rem;
            }
            #category-chips .tab-pill::after {
                width: 40px;
            }
            .explore-grid {
                gap: 6px;
                padding: 8px;
            }
            .market-grid {
                gap: 8px;
                padding: 4px 0;
            }
            .post-actions-row {
                gap: 2px;
                flex-wrap: nowrap;
                justify-content: space-between;
            }
            .post-actions-row .comment-btn,
            .post-actions-row .reaction-btn,
            .post-actions-row .views-count,
            .post-actions-row .bookmark-badge,
            .post-actions-row .share-btn {
                padding: 4px 4px;
                font-size: .7rem;
            }
            .post-actions-row svg {
                width: 15px;
                height: 15px;
            }
            .feed-post {
                margin-bottom: 6px;
                border-radius: 10px;
            }
            .ig-media-container,
            .ig-video-wrap,
            .media-carousel {
                width: 100%;
                margin-left: 0;
                margin-right: 0;
                border-radius: 0 !important;
            }
        }
    </style>
</head>

    <!-- ═══════════════════ PULL TO REFRESH ═══════════════════ -->

    <!-- ═══════════════════ TOP HEADER ═══════════════════ -->

                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span class="msg-badge"></span>
            </button>
        </div>
    </header>

    <!-- ═══════════════════ CATEGORY CHIPS ═══════════════════ -->
    <div id="category-chips">
        <div class="max-w-5xl mx-auto px-2 flex items-center justify-between">
            <div id="chips-container">

    <!-- ═══════════════════ SCRIPTS ═══════════════════ -->
    <script src="global.js">
    </script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ─────────────────────────────────────────────
            // CORE HELPERS
            // ─────────────────────────────────────────────

            function getCurrentUser() {
                if (window.AuthUser && window.AuthUser.getCurrentUser) return window.AuthUser.getCurrentUser();
                if (typeof window.getCurrentUser === 'function') return window.getCurrentUser();
                return { id: 'guest', isLoggedIn: false, displayName: 'Guest', avatar: '' };
            }

            function getAllUsers() {
                if (typeof window.getAllUsers === 'function') return window.getAllUsers();
                return [];
            }

            function getAuthorFromProfile(profile) {
                if (!profile) return { name: 'Guest', avatar: '', verified_status: 'unverified' };
                return {
                    id: profile.id || '',
                    name: profile.display_name || profile.username || 'Guest',
                    avatar: profile.avatar || '',
                    verified_status: profile.verified_status || 'unverified',
                    isVerified: profile.verified_status === 'verified' || profile.verified_status === 'official'
                };
            }

            function getVerifiedBadgeHTML(status) {
                if (status === 'verified' || status === 'official') {
                    return `<span class="verified-badge-sm"><svg viewBox="0 0 24 24"><polyline points="4 13 9 18 20 6"/></svg></span>`;
                }
                return '';
            }

            function escapeHtml(s) { const d = document.createElement('div');
                d.textContent = s || '';
                return d.innerHTML; }

            function linkifyContent(t) {
                const r = /(https?:\/\/[^\s<>"{}|\\^`\[\]]+)/g;
                return escapeHtml(t).replace(r, u =>
                    `<a href="javascript:void(0)" class="text-primary underline font-medium break-all" data-extlink="${encodeURIComponent(u)}">${u}</a>`
                    );
            }

            function formatCount(n) { if (!n) return '0'; if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/,
                    '') + 'B'; if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'; if (n >= 1e3)
                    return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K'; return String(n); }

            function formatRelativeTime(iso) {
                const now = Date.now(),
                    then = new Date(iso).getTime(),
                    diff = Math.floor((now - then) / 1000);
                if (diff < 60) return 'Just now';
                if (diff < 3600) return Math.floor(diff / 60) + 'm';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h';
                if (diff < 604800) return Math.floor(diff / 86400) + 'd';
                return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }

            function svgHeart(reacted) {
                return reacted ?
                    '<svg class="heart-icon" viewBox="0 0 24 24" fill="#DC2626" stroke="#DC2626" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' :
                    '<svg class="heart-icon" viewBox="0 0 24 24" fill="#FFFFFF" stroke="currentColor" stroke-width="1.7"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
            }

            function bookmarkIcon(filled) { const color = filled ? 'var(--gold)' : 'none'; return `<svg width="19" height="19" viewBox="0 0 24 24" fill="${color}" stroke="var(--gold)" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`; }

            function svgComment() {
                return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
            }

            function svgShare() {
                return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4z"/></svg>';
            }

            function svgEye() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V10"/><path d="M12 19V5"/><path d="M20 19V14"/></svg>'; }

            function svgClock() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'; }

            function svgFilter() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>'; }

            // ─────────────────────────────────────────────
            // FOLLOW SYSTEM
            // ─────────────────────────────────────────────

            let followingSet = new Set();

            async function loadFollows() {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) { followingSet = new Set(); return; }
                try {
                    const { data, error } = await window.sb.from('follows').select('following_id').eq('follower_id', user
                        .id);
                    if (!error) followingSet = new Set(data.map(f => f.following_id));
                } catch (e) { console.warn('loadFollows error:', e); }
            }

            async function isFollowing(followerId, targetId) {
                const { data, error } = await window.sb
                    .from('follows')
                    .select('id')
                    .eq('follower_id', followerId)
                    .eq('following_id', targetId)
                    .maybeSingle();
                if (error) { console.warn('isFollowing error:', error); return false; }
                return !!data;
            }

            async function getRelationship(myId, targetId) {
