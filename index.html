            function refreshTabStates() {
                document.querySelectorAll('.tab-pill').forEach(el => el.classList.remove('tab-pill--active'));
                const map = { home: 'tab-foryou', explore: 'tab-explore', market: 'tab-market',
                    'single-post-explore': null };
                const id = map[uiPage];
                if (id) document.getElementById(id)?.classList.add('tab-pill--active');
            }

            function navigateToProfile(uid) {
                const u = getCurrentUser();
                if (!u.isLoggedIn) { showToast('Sign in to view profiles'); return; }
                window.location.href = uid === u.id ? 'profile.html' : `profile.html?uid=${uid}`;
            }

            function navigateToProfileByUsername(username) {
                if (!username || username === 'Guest') return;
                const found = allPosts.find(p => p.profile && p.profile.username === username);
                if (found) navigateToProfile(found.user_id);
                else showToast('User not found');
            }

            function openInAppWebView(url) { window.open(url, '_blank', 'noopener,noreferrer'); }

            function closeInAppWebView() { const o = document.getElementById('inapp-webview-overlay'),
                    f = document.getElementById('inapp-webview-frame');
                f.src = '';
                o.classList.add('hidden');
                document.body.style.overflow = ''; }

            function openFilterDrawer() {
                refreshDrawerCategories();
                const d = document.getElementById('filter-drawer'),
                    b = document.getElementById('filter-backdrop');
                d.classList.remove('translate-y-full');
                b.classList.remove('bg-opacity-0', 'pointer-events-none');
                b.classList.add('bg-opacity-40', 'pointer-events-auto');
                document.body.style.overflow = 'hidden';
            }

            function closeFilterDrawer() {
                const d = document.getElementById('filter-drawer'),
                    b = document.getElementById('filter-backdrop');
                d.classList.add('translate-y-full');
                b.classList.add('bg-opacity-0', 'pointer-events-none');
                b.classList.remove('bg-opacity-40', 'pointer-events-auto');
                document.body.style.overflow = '';
            }

            function refreshDrawerCategories() {
                const de = document.getElementById('drawer-categories');
                if (!de) return;
                const CATS = ["Technology", "Education", "Campus gist", "News & Updates", "Entertainment", "Movies",
                    "Lifestyle", "Business & Finance", "Opinion / Thoughts", "Health & Fitness", "Travel & Culture",
                    "Gaming", "Memes", "Science", "Fashion", "Music"
                ];
                de.innerHTML = CATS.map(c =>
                    `<button class="drawer-cat-btn ${currentCategoryFilter===c?'drawer-cat-btn--active':''}" style="width:100%;text-align:left;padding:11px 14px;border-radius:10px;font-size:.875rem;font-weight:500;color:${currentCategoryFilter===c?'#7C3AED':'var(--muted)'};background:${currentCategoryFilter===c?'rgba(124,58,237,.08)':'var(--inp)'};border:1.5px solid ${currentCategoryFilter===c?'#7C3AED':'transparent'};cursor:pointer;">${escapeHtml(c)}</button>`
                    ).join('');
                de.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => { closeFilterDrawer();
                        filterCategory(btn.textContent.trim()); });
                });
            }

            function showToast(msg, d = 2000) {
                const t = document.getElementById('toast');
                if (!t) return;
                t.textContent = msg;
                t.style.background = 'var(--bg3)';
                t.style.color = 'var(--text)';
                t.style.border = '1px solid var(--brd2)';
                t.classList.add('opacity-100');
                t.classList.remove('opacity-0', 'pointer-events-none');
                clearTimeout(t._t);
                t._t = setTimeout(() => { t.classList.add('opacity-0', 'pointer-events-none');
                    t.classList.remove('opacity-100'); }, d);
            }

            function openLightbox(src) {
                const modal = document.getElementById('lightbox'),
                    img = document.getElementById('lightbox-img');
                img.src = src;
                modal.classList.add('show');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                document.getElementById('lightbox').classList.remove('show');
                document.body.style.overflow = '';
            }

            // ───────────────────────────────────────────────────────────────
            // PULL TO REFRESH
            // ───────────────────────────────────────────────────────────────

            function setupPullToRefresh() {
                let sy = 0,
                    sx = 0,
                    pulling = false;
                const ind = document.getElementById('pull-indicator'),
                    pt = document.getElementById('pull-text'),
                    pi = document.getElementById('pull-icon');
                document.addEventListener('touchstart', e => { sy = e.touches[0].clientY;
                    sx = e.touches[0].clientX; }, { passive: true });
                document.addEventListener('touchmove', e => {
                    if (window.scrollY > 0) return;
                    const dy = e.touches[0].clientY - sy,
                        dx = Math.abs(e.touches[0].clientX - sx);
                    if (dx > 30) return;
                    if (dy > 55) { pulling = true;
                        ind.classList.add('visible'); if (dy > 120) { ind.classList.add(
                            'releasing');
                            pt.textContent = 'Release to refresh';
                            pi.style.transform = 'rotate(180deg)'; } else { ind.classList
                                .remove('releasing');
                            pt.textContent = 'Pull down to refresh';
                            pi.style.transform = 'rotate(0deg)'; } } else { pulling = false;
                        ind.classList.remove('visible', 'releasing'); }
                }, { passive: true });
                document.addEventListener('touchend', () => {
                    if (pulling) { pulling = false;
                        ind.classList.remove('visible', 'releasing');
                        pt.textContent = 'Pull down to refresh';
                        pi.style.transform = 'rotate(0deg)';
                        document.getElementById('refresh-spinner').classList.remove('hidden');
                        setTimeout(() => document.getElementById('refresh-spinner').classList
                            .add('hidden'), 1000);
                        refreshHome();
                    }
                });
            }

            // ───────────────────────────────────────────────────────────────
            // KEYBOARD AVOIDANCE
            // ───────────────────────────────────────────────────────────────

            function setupKeyboardAvoidance() {
                if (!window.visualViewport) return;
                const vv = window.visualViewport;

                function adjust() {
                    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
                    const gcb = document.getElementById('global-comment-bar'),
                        ecb = document.getElementById('explore-comment-bar');
                    if (gcb) gcb.style.bottom = kb + 'px';
                    if (ecb) ecb.style.bottom = kb + 'px';
                    if (kb > 0) {
                        const active = document.activeElement;
                        if (active && (active.id === 'global-comment-textarea' || active.id ===
                                'explore-comment-textarea')) {
                            setTimeout(() => active.scrollIntoView({ block: 'center',
                                behavior: 'smooth' }), 60);
                        }
                    }
                }
                vv.addEventListener('resize', adjust);
                vv.addEventListener('scroll', adjust);
            }

            // ───────────────────────────────────────────────────────────────
            // REALTIME
            // ───────────────────────────────────────────────────────────────

            function setupRealtime() {
                if (window.PostsAPI && window.PostsAPI.subscribe) {
                    window.PostsAPI.subscribe((payload) => {
                        if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
                            reloadPosts().then(() => {
                                if (uiPage === 'home' || uiPage === 'single-post-explore') {
                                    renderUI();
                                }
                            });
                        }
                    });
                }

                if (window.ListingsAPI && window.ListingsAPI.subscribe) {
                    window.ListingsAPI.subscribe((payload) => {
                        if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE' ||
                            payload.eventType === 'DELETE') {
                            if (uiPage === 'market') {
                                loadMarketListings().then(() => {
                                    applyMarketFiltersAndRender();
                                });
                            }
                        }
                    });
                }
            }

            // ───────────────────────────────────────────────────────────────
            // LOAD DATA
            // ───────────────────────────────────────────────────────────────

            async function reloadData() {
                await reloadPosts();
                await loadFollows();
                await loadBookmarks();
                await loadShares();
                return appData;
            }

            // ───────────────────────────────────────────────────────────────
            // REFRESH HOME
            // ───────────────────────────────────────────────────────────────

            async function refreshHome() {
                await reloadData();
                currentCategoryFilter = '';
                searchQuery = '';
                currentSortMethod = 'foryou';
                feedPage = 1;
                uiPage = 'home';
                renderUI();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showToast('Feed refreshed');
            }

            // ───────────────────────────────────────────────────────────────
            // INIT
            // ───────────────────────────────────────────────────────────────

            async function init() {
                if (window.AuthUser && window.AuthUser.getCurrentUser) {} else {
                    await new Promise(resolve => setTimeout(resolve, 300));
                }

                updateNavAvatar();
                if (typeof registerCurrentUserInDirectory === 'function') {
                    registerCurrentUserInDirectory();
                }
                await reloadData();
                setupRealtime();

                // Init mentions
                const globalComment = document.getElementById('global-comment-textarea');
                if (globalComment && window.Mentions) {
                    window.Mentions.initMentions(globalComment);
                }
                const exploreComment = document.getElementById('explore-comment-textarea');
                if (exploreComment && window.Mentions) {
                    window.Mentions.initMentions(exploreComment);
                }

                document.getElementById('topMsgBtn').addEventListener('click', () => {
                    window.location.href = 'chat.html';
                });

                document.getElementById('logo-text').addEventListener('click', refreshHome);

                document.getElementById('tab-foryou').addEventListener('click', () => setTab('foryou'));
                document.getElementById('tab-explore').addEventListener('click', () => setTab('explore'));
                document.getElementById('tab-market').addEventListener('click', () => setTab('market'));

                const bottomHome = document.getElementById('bottomHomeBtn');
                if (bottomHome) {
                    bottomHome.addEventListener('click', function(e) {
                        e.preventDefault();
                        refreshHome();
                    });
                }

                document.getElementById('filter-backdrop').addEventListener('click', closeFilterDrawer);
                document.getElementById('drawer-close-btn').addEventListener('click', closeFilterDrawer);
                document.getElementById('clear-filter-btn').addEventListener('click', () => { closeFilterDrawer();
                    currentCategoryFilter = '';
                    currentSortMethod = 'foryou';
                    uiPage = 'home';
                    renderUI(); });

                const commentTextarea = document.getElementById('global-comment-textarea');
                if (commentTextarea) {
                    commentTextarea.addEventListener('input', function() { this.style.height = 'auto';
                        this.style.height = Math.min(this.scrollHeight, 100) + 'px'; });
                    commentTextarea.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                            submitCommentFromBar(); }
                    });
                }
                document.getElementById('global-comment-submit-btn').addEventListener('click',
                    submitCommentFromBar);
                document.getElementById('reply-cancel-btn').addEventListener('click', cancelReply);

                const exploreCommentTextarea = document.getElementById('explore-comment-textarea');
                if (exploreCommentTextarea) {
                    exploreCommentTextarea.addEventListener('input', function() { this.style.height = 'auto';
                        this.style.height = Math.min(this.scrollHeight, 100) + 'px'; });
                    exploreCommentTextarea.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                            submitExploreComment(); }
                    });
                }
                document.getElementById('explore-comment-submit-btn').addEventListener('click',
                    submitExploreComment);
                document.getElementById('explore-reply-cancel-btn').addEventListener('click',
                cancelExploreReply);
                document.getElementById('explore-back-btn').addEventListener('click', closeExploreFullscreen);

                document.getElementById('lightbox').addEventListener('click', function(e) { if (e.target ===
                        this || e.target.classList.contains('lightbox-close')) closeLightbox(); });
                document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);

                document.getElementById('webview-close-btn').addEventListener('click', closeInAppWebView);
                document.getElementById('external-browser-btn').addEventListener('click', () => { if (window
                        ._currentWebviewUrl) window.open(window._currentWebviewUrl, '_blank'); });
                document.getElementById('inapp-webview-overlay').addEventListener('click', function(e) { if (
                        e.target === this) closeInAppWebView(); });

                document.getElementById('share-close-btn').addEventListener('click', closeShareModal);
                document.getElementById('share-modal').addEventListener('click', function(e) {
                    if (e.target === this) closeShareModal();
                });
                document.querySelectorAll('.share-option').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const action = btn.dataset.share;
                        if (action) handleShareAction(action);
                    });
                });

                // Report button in share modal
                document.getElementById('share-report-btn').addEventListener('click', () => {
                    if (sharePostId) {
                        reportPostFromShare(sharePostId);
                    } else {
                        showToast('No post selected to report');
                    }
                });

                // Delete button in share modal
                document.getElementById('share-delete-btn').addEventListener('click', () => {
                    deletePostFromShare(sharePostId);
                });

                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape') {
                        closeLightbox();
                        closeInAppWebView();
                        closeShareModal();
                        if (document.getElementById('explore-fullscreen').classList.contains(
                            'open')) closeExploreFullscreen();
                        closeFilterDrawer();
                        closeProductModal();
                        closeSeeAllModal();
                        closeFilterModal();
                        closeTagsModal();
                    }
                });

                document.addEventListener('click', function(e) {
                    // No 3-dot menu to close
                });

                window.addEventListener('scroll', handleNavScroll, { passive: true });

                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        reloadData().then(() => {
                            if (uiPage === 'home' || uiPage === 'explore' || uiPage ===
                                'market') {
                                renderUI();
                            } else if (uiPage === 'single-post-explore' && currentPostId) {
                                const post = allPosts.find(p => p.id === currentPostId);
                                if (post) {
                                    const cl = document.getElementById('comments-list');
                                    if (cl) {
                                        const vc = getVisibleComments(currentPostId);
                                        const ac = Array.isArray(post.comments) ? post.comments
                                            .filter(c => c.approved !== false) : [];
                                        cl.innerHTML = renderCommentsHTML(ac,
                                        currentPostId, vc);
                                    }
                                    updateCommentCount(currentPostId);
                                }
                            }
                        });
                    }
                });

                if (window.sb) {
                    const channel = window.sb.channel('profile-updates')
                        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' },
                            (payload) => {
                                const updated = payload.new;
                                if (typeof window.updateAuthorUI === 'function') {
                                    window.updateAuthorUI(updated);
                                }
                                allPosts = allPosts.map(post => {
                                    if (post.user_id === updated.id) {
                                        post.profile = { ...post.profile, ...updated };
                                    }
                                    return post;
                                });
                            })
                        .subscribe();
                }

                const urlParams = new URLSearchParams(window.location.search);
                const postIdParam = urlParams.get('post');
                if (postIdParam) {
                    const id = postIdParam;
                    if (allPosts.some(p => p.id === id)) {
                        setTimeout(() => { openExplorePost(id, 'home');
                            history.replaceState({}, '', window.location.pathname); }, 400);
                    }
                }

                renderUI();
                setupPullToRefresh();
                setupKeyboardAvoidance();
            }

            function handleNavScroll() {
                const currentScrollY = window.scrollY;
                if (currentScrollY > lastScrollY && currentScrollY > 100) {
                    if (!bottomNavHidden) {
                        bottomNavHidden = true;
                        document.getElementById('bottomNav').classList.add('hidden-nav');
                    }
                } else if (currentScrollY < lastScrollY) {
                    if (bottomNavHidden) {
                        bottomNavHidden = false;
                        document.getElementById('bottomNav').classList.remove('hidden-nav');
                    }
                }
                lastScrollY = currentScrollY;
            }

            // ─── EXPOSE GLOBALLY ─────────────────────────────────
            window.toggleReaction = toggleReaction;
            window.openExplorePost = openExplorePost;
            window.closeExploreFullscreen = closeExploreFullscreen;
            window.showToast = showToast;
            window.toggleYtControls = toggleYtControls;
            window.initYtListener = initYtListener;
            window.seekYoutube = seekYoutube;
            window.toggleFollowHandler = toggleFollowHandler;
            window.openShareModal = openShareModal;
            window.closeShareModal = closeShareModal;
            window.reloadData = reloadData;
            window.refreshHome = refreshHome;
            window.openTagsModal = openTagsModal;
            window.closeTagsModal = closeTagsModal;

            window.selectMarketCategory = selectMarketCategory;
            window.selectMarketSubcategory = selectMarketSubcategory;
            window.openProductModal = openProductModal;
            window.closeProductModal = closeProductModal;
            window.shareCurrentProduct = shareCurrentProduct;
            window.openSellerProfile = openSellerProfile;
            window.openFilterModal = openFilterModal;
            window.closeFilterModal = closeFilterModal;
            window.applyFilters = applyFilters;
            window.resetFilters = resetFilters;
            window.openSeeAllModal = openSeeAllModal;
            window.closeSeeAllModal = closeSeeAllModal;
            window.handleMarketSearch = handleMarketSearch;
            window.toggleFavorite = toggleFavorite;
            window.changeMarketImage = changeMarketImage;
            window.triggerToast = triggerToast;

            // Expose report/delete handlers
            window.reportPostFromShare = reportPostFromShare;
            window.deletePostFromShare = deletePostFromShare;

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();

        })();
    </script>

    <!-- TAGS MODAL -->
    <div class="tags-modal" id="tagsModal">
        <div class="tags-sheet">
            <div class="tags-header">
                <h3 id="tagsModalTitle">#tag</h3>
                <button onclick="closeTagsModal()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="tags-body" id="tagsBody"></div>
        </div>
    </div>
</body>
</html>
