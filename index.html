<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>FreeUpper — Home</title>
    <link rel="icon" type="image/png" href="freeupper.png" />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' },
                        primary: '#7C3AED',
                        'primary-light': '#8B5CF6',
                        'primary-dark': '#6D28D9'
                    },
                    fontFamily: { heading: ['Poppins', 'Inter', 'sans-serif'], body: ['Inter', 'Roboto',
                            'sans-serif'
                        ] },
                    borderRadius: { soft: '10px', softer: '14px' },
                    animation: { spin: 'spin 0.8s linear infinite' }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="global.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script src="global.js">
    </script>
    <script src="auth.js">
    </script>
    <script src="posts.js">
    </script>
    <script src="listings.js">
    </script>
    <script src="mentions.js"></script>

    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --gold: #FFD700;
            --heart-red: #DC2626;
            --bg: #ffffff;
            --bg2: #f9fafb;
            --bg3: #ffffff;
            --bg4: #f3f4f6;
            --text: #111827;
            --muted: #6B7280;
            --muted2: #9CA3AF;
            --brd: #e5e7eb;
            --brd2: #d1d5db;
            --inp: #f9fafb;
            --p: #7C3AED;
            --pdim: rgba(124, 58, 237, 0.1);
            --pbrd: #7C3AED;
            --navbg: rgba(255, 255, 255, 0.92);
            --sidebg: #f9fafb;
            --bottom-nav-height: 72px;
            --nav-h: 78px;
        }

        [data-theme="dark"] {
            --bg: #0f0f0f;
            --bg2: #1a1a1a;
            --bg3: #242424;
            --bg4: #2a2a2a;
            --text: #f0f0f0;
            --muted: #9ca3af;
            --muted2: #6b7280;
            --brd: #2a2a2a;
            --brd2: #3a3a3a;
            --inp: #1f1f1f;
            --navbg: rgba(20, 20, 20, 0.92);
            --sidebg: #0f0f0f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            touch-action: manipulation;
            padding-top: var(--safe-top);
            padding-bottom: calc(var(--bottom-nav-height) + 20px);
            transition: padding-bottom 0.3s ease;
        }
        body.nav-hidden {
            padding-bottom: 0;
        }
        .font-heading {
            font-family: 'Poppins', 'Inter', sans-serif;
        }
        body.single-post-open nav.sticky,
        body.single-post-open #category-chips,
        body.explore-open nav.sticky,
        body.explore-open #category-chips,
        body.market-fullscreen-open nav.sticky,
        body.market-fullscreen-open #category-chips {
            display: none !important;
        }

        /* ─── SIDE NAV ─── */
        .side-nav {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            flex-direction: column;
            align-items: center;
            padding: 28px 0 24px;
            background: var(--sidebg);
            border-right: 1px solid var(--brd);
            width: 70px;
            flex-shrink: 0;
            gap: 2px;
            z-index: 30;
            transition: background .3s, border-color .3s;
        }
        .side-logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--p);
            margin-bottom: 20px;
            letter-spacing: -1px;
            cursor: pointer;
        }
        .side-logo a {
            color: inherit;
            text-decoration: none;
        }
        .side-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s, transform .1s;
            background: none;
            border: none;
            position: relative;
            gap: 3px;
            color: inherit;
            text-decoration: none;
        }
        .side-btn:hover {
            background: var(--pdim);
            transform: scale(1.04);
        }
        .side-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .side-btn span {
            font-size: 8px;
            color: var(--muted2);
            font-weight: 600;
        }
        .side-btn.active svg {
            stroke: var(--p);
        }
        .side-btn.active span {
            color: var(--p);
        }
        .side-btn .side-badge {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--p);
            border: 1.5px solid var(--sidebg);
        }
        .side-gap {
            flex: 1;
        }
        .side-av {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .side-btn.active .side-av {
            border-color: var(--p);
        }
        @media (min-width: 768px) {
            .side-nav {
                display: flex;
            }
            body {
                padding-left: 70px;
                padding-bottom: 0 !important;
            }
            .bottom-nav {
                display: none !important;
            }
        }

        /* ─── BOTTOM NAV ─── */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--navbg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-top: 1px solid var(--brd);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0 max(env(safe-area-inset-bottom), 16px);
            z-index: 50;
            transition: transform 0.35s cubic-bezier(0.32, 0.94, 0.6, 1), background .3s, border-color .3s;
            height: var(--nav-h, 78px);
            transform: translateY(0);
            will-change: transform;
        }
        .bottom-nav.hidden-nav {
            transform: translateY(100%);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px clamp(8px, 3vw, 14px);
            border-radius: 14px;
            transition: background .15s;
            position: relative;
            background: none;
            border: none;
            text-decoration: none;
            color: inherit;
        }
        .nav-item:hover {
            background: var(--pdim);
        }
        .nav-item svg {
            width: clamp(20px, 5vw, 24px);
            height: clamp(20px, 5vw, 24px);
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .nav-item span {
            font-size: clamp(9px, 2vw, 10px);
            color: var(--muted);
            font-weight: 600;
            letter-spacing: .03em;
        }
        .nav-item.active svg {
            stroke: var(--p);
        }
        .nav-item.active span {
            color: var(--p);
        }
        .nav-av {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .nav-item.active .nav-av {
            border-color: var(--p);
        }
        .nav-badge {
            position: absolute;
            top: 2px;
            right: clamp(2px, 1vw, 4px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #EF4444;
            border: 1.5px solid var(--bg);
        }
        .add-post-btn {
            background: var(--p);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(139, 92, 246, .4);
            transform: translateY(-2px);
            flex-shrink: 0;
            transition: transform .15s, box-shadow .15s;
        }
        .add-post-btn:active {
            transform: translateY(-2px) scale(.92);
        }
        .add-post-btn svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        /* ─── TOP HEADER ─── */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--bg2);
            border-bottom: 1px solid var(--brd);
            position: sticky;
            top: 0;
            z-index: 29;
        }
        .top-header .brand {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .top-header .brand span {
            color: var(--p);
        }
        .top-header .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-header .header-actions .msg-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--pdim);
            border: none;
            cursor: pointer;
            color: var(--p);
            transition: background .2s, transform .15s;
            position: relative;
        }
        .top-header .header-actions .msg-btn:hover {
            background: rgba(124, 58, 237, 0.2);
            transform: scale(1.05);
        }
        .top-header .header-actions .msg-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--p);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .top-header .header-actions .msg-btn .msg-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #EF4444;
            border: 2px solid var(--bg2);
        }

        /* ─── PULL TO REFRESH ─── */
        #pull-indicator {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            z-index: 60;
            background: #fff;
            border: 1px solid #E5E7EB;
            border-radius: 999px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .1);
            transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
            opacity: 0;
            pointer-events: none;
            font-size: .8rem;
            font-weight: 600;
            color: #7C3AED;
        }
        #pull-indicator.visible {
            transform: translateX(-50%) translateY(12px);
            opacity: 1;
        }
        #pull-indicator.releasing {
            background: #F5F3FF;
        }

        /* ─── FEED POSTS ─── */
        .feed-post {
            border-bottom: 1px solid var(--brd);
            padding: 16px 0;
            position: relative;
            transition: background .1s ease;
            cursor: pointer;
            background: var(--bg3);
            margin-bottom: 8px;
        }
        .feed-post:active {
            background: rgba(0, 0, 0, .02);
        }
        .feed-post:last-child {
            border-bottom: 1px solid var(--brd);
        }
        .content-text {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 16px;
            color: var(--text);
            font-weight: 400;
            word-wrap: break-word;
        }
        .content-text p {
            margin: 0 0 12px 0;
        }
        .content-text p:last-child {
            margin-bottom: 0;
        }
        .content-preview {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 16px;
            color: var(--text);
            font-weight: 400;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }
        .feed-post .post-body {
            padding: 0 16px;
            max-width: 100%;
        }

        /* ─── FULL-WIDTH MEDIA ─── */
        .ig-media-container {
            width: calc(100% + 32px);
            margin-left: -16px;
            margin-right: -16px;
            border-radius: 0 !important;
            overflow: hidden;
            margin-top: 10px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 80vh;
        }
        .ig-media-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }
        .ig-video-wrap {
            position: relative;
            width: calc(100% + 32px);
            margin-left: -16px;
            margin-right: -16px;
            background: #000;
            border-radius: 0 !important;
            overflow: hidden;
            margin-top: 10px;
        }
        .ig-video-wrap video {
            width: 100%;
            display: block;
            max-height: 70vh;
            object-fit: contain;
            background: #000;
            pointer-events: none;
        }
        .ig-video-wrap .plyr--video {
            background: #000;
        }
        .ig-video-wrap .plyr__controls {
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(4px);
        }
        .ig-video-wrap .plyr__control--overlaid {
            background: rgba(124, 58, 237, .85);
        }
        .ig-video-wrap .plyr__control--overlaid:hover {
            background: #7C3AED;
        }
        .ig-video-wrap .yt-wrap {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .ig-video-wrap .yt-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .ig-video-wrap .yt-tap {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: pointer;
        }
        .ig-video-wrap .yt-mute-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 34px;
            height: 34px;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
            pointer-events: none;
            opacity: .95;
            transition: opacity .2s;
        }
        .ig-video-wrap .yt-mute-badge svg {
            width: 17px;
            height: 17px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .ig-video-wrap .yt-pause-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 68px;
            height: 68px;
            background: rgba(0, 0, 0, .5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
            transition: transform .12s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
            opacity: 0;
            pointer-events: none;
        }
        .ig-video-wrap .yt-pause-icon svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }
        .ig-video-wrap .yt-pause-icon.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .ig-video-wrap .yt-pause-icon.hide {
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
        }
        .ig-video-wrap .yt-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, .2);
            z-index: 12;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .ig-video-wrap .yt-progress-fill {
            height: 100%;
            background: #fff;
            border-radius: 0 2px 2px 0;
            transition: width .1s linear;
            pointer-events: none;
            width: 0%;
        }
        .ig-video-wrap .yt-progress-thumb {
            position: absolute;
            top: 50%;
            right: calc(100% - var(--pct, 0%));
            transform: translate(50%, -50%) scale(0);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            transition: transform .15s;
            pointer-events: none;
        }
        .ig-video-wrap .yt-progress:hover .yt-progress-thumb,
        .ig-video-wrap .yt-progress:active .yt-progress-thumb {
            transform: translate(50%, -50%) scale(1);
        }

        /* ─── CAROUSEL ─── */
        .media-carousel {
            width: calc(100% + 32px);
            margin-left: -16px;
            margin-right: -16px;
            position: relative;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
            max-height: 80vh;
            margin-top: 10px;
            border-radius: 0;
        }
        .media-carousel-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            height: 100%;
            width: 100%;
            will-change: transform;
        }
        .media-carousel-slide {
            flex: 0 0 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }
        .media-carousel-slide img,
        .media-carousel-slide video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }
        .media-carousel-slide video {
            pointer-events: none;
        }
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .carousel-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .carousel-dot.active {
            background: #fff;
            width: 18px;
            border-radius: 4px;
        }
        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            cursor: pointer;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, transform 0.2s ease;
            backdrop-filter: blur(4px);
            opacity: 1;
        }
        .carousel-arrow.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .carousel-arrow:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: translateY(-50%) scale(1.05);
        }
        .carousel-arrow:active {
            transform: translateY(-50%) scale(0.92);
        }
        .carousel-arrow.left {
            left: 8px;
        }
        .carousel-arrow.right {
            right: 8px;
        }
        .carousel-arrow svg {
            width: 18px;
            height: 18px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ─── EXPLORE GRID ─── */
        .explore-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px;
        }
        @media (min-width: 640px) {
            .explore-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 12px;
            }
        }
        .explore-card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: #111;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            opacity: 1;
            transform: none;
            transition: transform .18s ease;
        }
        .explore-card:active {
            transform: scale(.97);
            transition: transform .15s;
        }
        .explore-card-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .explore-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, .85));
            padding: 32px 9px 10px;
        }
        .explore-card-title {
            font-size: .78rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .explore-card-meta {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .explore-card-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, .55);
            flex-shrink: 0;
            background: #374151;
        }
        .explore-card-author {
            font-size: .68rem;
            font-weight: 600;
            color: rgba(255, 255, 255, .85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .explore-card-views {
            font-size: .65rem;
            color: rgba(255, 255, 255, .65);
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .explore-card-category {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(124, 58, 237, .9);
            color: #fff;
            font-size: .58rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            letter-spacing: .04em;
            text-transform: uppercase;
            display: none;
        }
        .explore-card-video-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, .65);
            color: #fff;
            font-size: .6rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 3px;
            backdrop-filter: blur(4px);
        }
        .explore-card-no-media {
            width: 100%;
            height: 100%;
            background: #1F2937;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .explore-card-no-media-text {
            font-size: .7rem;
            font-weight: 700;
            color: rgba(255, 255, 255, .25);
            text-align: center;
            padding: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .explore-skeleton-card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: #1a1a1a;
        }
        .explore-skeleton-thumb {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #1f1f1f 25%, #2a2a2a 50%, #1f1f1f 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }

        /* ─── MARKETPLACE ─── */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .heart-icon {
            transition: fill 0.2s ease, color 0.2s ease;
        }
        .heart-icon.liked {
            fill: #ef4444;
            color: #ef4444;
        }
        .product-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
        }
        .product-card:active {
            transform: scale(0.97);
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        .market-main-content {
            display: block;
        }

        /* ─── COMMENTS ─── */
        .comment-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
        }
        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #E5E7EB;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .85rem;
            color: #6B7280;
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
        }
        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .comment-body {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .comment-username {
            font-size: .88rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
        }
        .comment-text {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: .92rem;
            color: var(--text);
            font-weight: 400;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .comment-text.collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .comment-show-more {
            font-size: .78rem;
            color: #7C3AED;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            padding: 2px 0 0 0;
            display: block;
        }
        .comment-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .comment-time {
            font-size: .75rem;
            color: #9CA3AF;
        }
        .comment-reply-btn {
            font-size: .75rem;
            color: #6B7280;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .comment-reply-btn:hover {
            color: #7C3AED;
        }
        .comment-like-btn {
            font-size: .75rem;
            color: #9CA3AF;
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .comment-like-btn.liked {
            color: var(--heart-red);
        }
        .comment-like-btn svg {
            width: 14px;
            height: 14px;
        }
        .replies-thread {
            border-left: 2px solid #E5E7EB;
            margin-left: 18px;
            padding-left: 0;
            box-sizing: border-box;
            width: calc(100% - 18px);
        }
        .reply-item {
            display: flex;
            gap: 8px;
            padding: 8px 0 8px 14px;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
        }
        .reply-avatar-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #E5E7EB;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .6rem;
            color: #6B7280;
            margin-left: -10px;
            border: 2px solid #fff;
            z-index: 2;
            overflow: hidden;
            cursor: pointer;
        }
        .reply-avatar-dot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .reply-body {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .reply-username {
            font-size: .82rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 1px;
        }
        .reply-text {
            white-space: pre-wrap;
            line-height: 1.45;
            font-size: .88rem;
            color: var(--text);
            font-weight: 400;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .reply-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .reply-time {
            font-size: .7rem;
            color: #9CA3AF;
        }
        .reply-reply-btn {
            font-size: .7rem;
            color: #6B7280;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .reply-like-btn {
            font-size: .7rem;
            color: #9CA3AF;
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .reply-like-btn.liked {
            color: var(--heart-red);
        }
        .reply-like-btn svg {
            width: 14px;
            height: 14px;
        }
        .view-replies-btn,
        .hide-replies-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: .78rem;
            color: #7C3AED;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            margin-top: 4px;
        }
        .view-replies-btn {
            margin-left: 46px;
        }
        .hide-replies-btn {
            margin-left: 18px;
            padding-left: 14px;
            color: #6B7280;
        }
        .comment-skeleton {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            align-items: flex-start;
        }
        .comment-skeleton .skeleton-avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            flex-shrink: 0;
        }
        .comment-skeleton .skeleton-line-sm {
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            margin-bottom: 6px;
        }
        .comment-skeleton .skeleton-line-sm.w70 {
            width: 70%;
        }
        .comment-skeleton .skeleton-line-sm.w50 {
            width: 50%;
        }
        .comment-skeleton .skeleton-line-sm.w90 {
            width: 90%;
        }

        /* ─── GLOBAL COMMENT BAR ─── */
        #global-comment-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg2);
            border-top: 1px solid var(--brd);
            z-index: 45;
            padding: 8px 14px;
            padding-bottom: max(8px, var(--safe-bottom));
            transform: translateY(100%);
            transition: transform .3s cubic-bezier(.4, 0, .2, 1), bottom .15s ease;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, .06);
        }
        #global-comment-bar.visible {
            transform: translateY(0);
        }
        #reply-context-banner {
            display: none;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-size: .8rem;
            color: var(--muted);
            padding: 4px 0;
        }
        #reply-context-banner.show {
            display: flex;
        }
        #reply-context-username {
            font-weight: 700;
            color: #7C3AED;
        }
        #reply-cancel-btn {
            margin-left: auto;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
            color: #9CA3AF;
            padding: 2px 6px;
            border-radius: 4px;
            line-height: 1;
        }
        .global-comment-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .global-comment-row textarea {
            flex: 1;
            min-width: 0;
            border: 1.5px solid var(--brd);
            border-radius: 20px;
            padding: 9px 14px;
            font-size: .9rem;
            resize: none;
            outline: none;
            font-family: inherit;
            background: var(--inp);
            line-height: 1.45;
            transition: .2s;
            min-height: 40px;
            max-height: 100px;
            box-sizing: border-box;
            height: 40px;
            color: var(--text);
        }
        .global-comment-row textarea:focus {
            border-color: #7C3AED;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, .07);
            background: var(--bg);
        }
        .global-comment-row button {
            background: #7C3AED;
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 9px 18px;
            font-size: .85rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
            align-self: flex-end;
        }
        .global-comment-row button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* ─── LIGHTBOX ─── */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .92);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .lightbox-modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        .lightbox-modal img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 8px;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* ─── EXPLORE FULLSCREEN ─── */
        .explore-fullscreen,
        .market-fullscreen,
        .market-filter-modal {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform .35s cubic-bezier(.4, 0, .2, 1);
            padding-top: var(--safe-top);
        }
        .explore-fullscreen {
            z-index: 80;
            overflow: hidden !important;
        }
        .market-fullscreen {
            z-index: 85;
        }
        .market-filter-modal {
            z-index: 86;
        }
        .explore-fullscreen.open,
        .market-fullscreen.open,
        .market-filter-modal.open {
            transform: translateY(0);
        }
        .explore-fullscreen-header,
        .market-fullscreen-header,
        .market-filter-header {
            position: relative;
            z-index: 10;
            background: var(--bg2);
            border-bottom: 1px solid var(--brd);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .explore-fullscreen-header {
            justify-content: space-between;
        }
        .explore-fullscreen-header .explore-category-name {
            font-weight: 600;
            font-size: .85rem;
            color: var(--muted);
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
        }
        #explore-fullscreen-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }
        .market-fullscreen-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .market-filter-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* ─── SHARE MODAL (with Report & Delete) ─── */
        #share-modal {
            position: fixed;
            inset: 0;
            z-index: 120;
            background: rgba(15, 15, 15, .55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease;
            padding: 20px;
        }
        #share-modal.open {
            opacity: 1;
            pointer-events: auto;
        }
        #share-modal .share-sheet {
            background: var(--bg2);
            border: 1px solid var(--brd);
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            padding: 28px 26px 24px;
            transform: translateY(16px) scale(.96);
            transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .25);
        }
        #share-modal.open .share-sheet {
            transform: translateY(0) scale(1);
        }
        #share-modal .share-sheet .share-handle {
            display: none;
        }
        #share-modal .share-sheet h3 {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text);
            margin-bottom: 4px;
            text-align: left;
        }
        #share-modal .share-sheet .share-sub {
            font-size: .85rem;
            color: var(--muted);
            text-align: left;
            margin-bottom: 22px;
        }
        #share-modal .share-sheet .share-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        #share-modal .share-sheet .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 6px;
            border-radius: 16px;
            border: 1px solid var(--brd);
            background: var(--bg3);
            cursor: pointer;
            transition: transform .15s, box-shadow .15s, border-color .15s;
            color: var(--text);
            font-size: .72rem;
            font-weight: 600;
        }
        #share-modal .share-sheet .share-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, .15);
            border-color: #7C3AED;
        }
        #share-modal .share-sheet .share-option.share-more {
            flex-direction: row;
            justify-content: center;
            padding: 12px;
        }
        #share-modal .share-sheet .share-icon-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        #share-modal .share-sheet .share-option svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
        }
        #share-modal .share-sheet .share-profile .share-icon-circle {
            background: linear-gradient(135deg, #7C3AED, #A855F7);
        }
        #share-modal .share-sheet .share-copy .share-icon-circle {
            background: linear-gradient(135deg, #3B82F6, #60A5FA);
        }
        #share-modal .share-sheet .share-native .share-icon-circle {
            background: linear-gradient(135deg, #10B981, #34D399);
        }
        #share-modal .share-sheet .share-more .share-icon-circle {
            background: linear-gradient(135deg, #F59E0B, #FBBF24);
        }

        /* ─── DELETE & REPORT BUTTONS (share sheet) ─── */
        #share-modal .share-sheet .share-delete-btn {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: rgba(220, 38, 38, .1);
            color: #DC2626;
            font-weight: 800;
            font-size: .9rem;
            cursor: pointer;
            transition: .15s;
            margin-top: 6px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #share-modal .share-sheet .share-delete-btn:hover {
            background: rgba(220, 38, 38, .18);
        }
        #share-modal .share-sheet .share-delete-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #share-modal .share-sheet .share-report-btn {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: rgba(220, 38, 38, .08);
            color: #DC2626;
            font-weight: 700;
            font-size: .9rem;
            cursor: pointer;
            transition: .15s;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #share-modal .share-sheet .share-report-btn:hover {
            background: rgba(220, 38, 38, .16);
        }
        #share-modal .share-sheet .share-report-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #share-modal .share-sheet .share-close-btn {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: var(--bg4);
            color: var(--muted);
            font-weight: 700;
            font-size: .9rem;
            cursor: pointer;
            transition: .15s;
            margin-top: 6px;
        }
        #share-modal .share-sheet .share-close-btn:hover {
            background: var(--brd2);
            color: var(--text);
        }

        /* ─── MISC ─── */
        .single-post-container {
            padding-bottom: 100px;
        }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid var(--brd);
            border-top-color: #7C3AED;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #toast {
            transition: all .3s cubic-bezier(.68, -.55, .265, 1.55);
        }

        /* ─── RESPONSIVE TWEAKS ─── */
        @media (max-width: 640px) {
            .top-header .brand {
                font-size: 1.05rem;
            }
            .top-header .header-actions .msg-btn {
                width: 34px;
                height: 34px;
            }
            .top-header .header-actions .msg-btn svg {
                width: 20px;
                height: 20px;
            }
            #category-chips .tab-pill {
                padding: 10px 12px;
                font-size: .78rem;
            }
            #category-chips .tab-pill::after {
                width: 40px;
            }
            .explore-grid {
                gap: 6px;
                padding: 8px;
            }
            .post-actions-row {
                gap: 2px;
                flex-wrap: nowrap;
                justify-content: flex-start;
            }
            .post-actions-row .comment-btn,
            .post-actions-row .reaction-btn,
            .post-actions-row .views-count,
            .post-actions-row .bookmark-badge,
            .post-actions-row .share-btn {
                padding: 4px 4px;
                font-size: .7rem;
            }
            .post-actions-row svg {
                width: 15px;
                height: 15px;
            }
            .feed-post {
                margin-bottom: 6px;
                border-radius: 10px;
            }
            .ig-media-container,
            .ig-video-wrap,
            .media-carousel {
                width: 100%;
                margin-left: 0;
                margin-right: 0;
                border-radius: 0 !important;
            }
        }

        /* ─── VIDEO AUTO-PLAY ─── */
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            overflow: hidden;
            margin-top: 10px;
        }
        .video-container video {
            width: 100%;
            display: block;
            max-height: 70vh;
            object-fit: contain;
            background: #000;
        }
        .video-container .plyr--video {
            background: #000;
        }
        .video-container .plyr__controls {
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(4px);
        }
        .video-container .plyr__control--overlaid {
            background: rgba(124, 58, 237, .85);
        }
        .video-container .plyr__control--overlaid:hover {
            background: #7C3AED;
        }
        .fade-in-image {
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .fade-in-image.loaded {
            opacity: 1;
        }

        /* ─── POST ACTIONS ROW ─── */
        .post-actions-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 4px;
            margin-top: 10px;
            max-width: 100%;
        }
        .post-actions-row>* {
            flex: 1 1 auto;
            display: inline-flex;
            justify-content: center;
        }
        .post-actions-row .bookmark-badge {
            flex: 0 1 auto;
            margin-left: auto;
        }
        .post-actions-row .comment-btn,
        .post-actions-row .reaction-btn,
        .post-actions-row .views-count,
        .post-actions-row .bookmark-badge,
        .post-actions-row .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 20px;
            font-size: .85rem;
            color: var(--muted);
            cursor: pointer;
            transition: background .15s, color .15s;
            background: transparent;
            border: none;
            font-weight: 500;
        }
        .post-actions-row .comment-btn:hover {
            background: rgba(124, 58, 237, .08);
            color: #7C3AED;
        }
        .post-actions-row .share-btn:hover {
            background: rgba(124, 58, 237, .08);
            color: #7C3AED;
        }
        .post-actions-row .reaction-btn:hover {
            background: rgba(220, 38, 38, .08);
            color: var(--heart-red);
        }
        .post-actions-row .bookmark-badge:hover {
            background: rgba(255, 215, 0, .15);
            color: var(--gold);
        }
        .post-actions-row .bookmark-badge.bookmarked {
            color: var(--gold);
        }
        .post-actions-row .bookmark-badge.bookmarked svg {
            fill: var(--gold);
            stroke: var(--gold);
        }
        .post-actions-row .reaction-btn.reacted {
            color: var(--heart-red);
        }
        .post-actions-row svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .post-actions-row .reaction-count,
        .post-actions-row .comment-count,
        .post-actions-row .share-count {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-size: .85rem;
        }
        .post-actions-row .views-count span {
            font-weight: 500;
        }

        /* ─── TAB PILLS ─── */
        .tab-pill {
            padding: 14px 16px;
            font-size: .9rem;
            font-weight: 700;
            color: #6B7280;
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
            white-space: nowrap;
            transition: color .2s;
            flex: 1;
            text-align: center;
        }
        .tab-pill::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 56px;
            height: 3px;
            background: #7C3AED;
            border-radius: 3px 3px 0 0;
            transform: translateX(-50%) scaleX(0);
            transition: transform .2s ease;
        }
        .tab-pill--active {
            color: var(--text);
        }
        .tab-pill--active::after {
            transform: translateX(-50%) scaleX(1);
        }
        [data-theme="dark"] .tab-pill--active {
            color: #fff;
        }

        /* ─── FOLLOW BUTTON ─── */
        .follow-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: .72rem;
            font-weight: 700;
            cursor: pointer;
            border: 1.5px solid transparent;
            background: #7C3AED;
            color: #fff;
            transition: background .15s, color .15s, border-color .15s, transform .1s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .follow-btn:active {
            transform: scale(.95);
        }
        .follow-btn.hidden-follow {
            display: none;
        }
        .follow-btn.rel-follow {
            background: #7C3AED;
            color: #fff;
        }
        .follow-btn.rel-follow-back {
            background: #A855F7;
            color: #fff;
        }
        .follow-btn.rel-following {
            background: rgba(124, 58, 237, .12);
            color: #7C3AED;
            border-color: rgba(124, 58, 237, .35);
        }
        .follow-btn.rel-friends {
            background: rgba(124, 58, 237, .1);
            color: #8B5CF6;
            border-color: rgba(139, 92, 246, .3);
        }
        [data-theme="dark"] .follow-btn.rel-following {
            background: rgba(139, 92, 246, .18);
            color: #C4B5FD;
            border-color: rgba(139, 92, 246, .4);
        }
        [data-theme="dark"] .follow-btn.rel-friends {
            background: rgba(139, 92, 246, .15);
            color: #C4B5FD;
            border-color: rgba(139, 92, 246, .35);
        }

        #category-chips {
            position: sticky;
            top: 52px;
            z-index: 20;
            background: var(--bg2);
            border-bottom: 1px solid var(--brd);
        }
        #chips-container {
            display: flex;
            width: 100%;
        }

        /* ─── MARKETPLACE SPECIFIC OVERLAYS ─── */
        #filterModal,
        #seeAllModal,
        #productModal {
            z-index: 100;
        }
        #productModal {
            z-index: 101;
        }
        #seeAllModal {
            z-index: 100;
        }
        #filterModal {
            z-index: 99;
        }

        /* ─── TAGS MODAL ─── */
        .tags-modal {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
            padding: 20px;
        }
        .tags-modal.open {
            opacity: 1;
            pointer-events: auto;
        }
        .tags-modal .tags-sheet {
            background: var(--bg3);
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--brd2);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .4);
            overflow: hidden;
            transform: translateY(20px) scale(.96);
            transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
        }
        .tags-modal.open .tags-sheet {
            transform: translateY(0) scale(1);
        }
        .tags-sheet .tags-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--brd);
            flex-shrink: 0;
        }
        .tags-sheet .tags-header h3 {
            font-size: 18px;
            font-weight: 800;
        }
        .tags-sheet .tags-header button {
            background: none;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            transition: background .15s;
        }
        .tags-sheet .tags-header button:hover {
            background: var(--pdim);
        }
        .tags-sheet .tags-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .tags-sheet .tag-result {
            padding: 12px 0;
            border-bottom: 1px solid var(--brd);
            cursor: pointer;
            transition: background .15s;
        }
        .tags-sheet .tag-result:hover {
            background: var(--pdim);
            margin: 0 -12px;
            padding: 12px;
            border-radius: 8px;
        }
        .tags-sheet .tag-result .tag-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--text);
        }
        .tags-sheet .tag-result .tag-post-title {
            font-size: 13px;
            color: var(--muted);
            margin-top: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .tags-sheet .tag-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }
    </style>
</head>

    <script>
        (function() {
            'use strict';

            // ───────────────────────────────────────────────────────────────
            // CONSTANTS & GLOBAL STATE
            // ───────────────────────────────────────────────────────────────

            const CVK = 'freeupper_comments_visible';
            const UCK = 'freeupper_user_categories';
            const REPLY_BATCH = 3,
                PAGE_SIZE = 5;
            const INITIAL_COMMENT_DISPLAY = 3;
            const COMMENT_LOAD_MORE = 5;

            let allPosts = [];
            let appData = {
                posts: [],
                userReactions: {},
                marketItems: [],
            };

            let followingSet = new Set();
            let followerSet = new Set();
            let bookmarksSet = new Set();
            let sharesSet = new Set();

            let uiPage = 'home';
            let currentCategoryFilter = '';
            let currentSortMethod = 'foryou';
            let searchQuery = '';
            let feedPage = 1;
            let observer = null,
                sentinel = null,
                loader = null,
                isTogglingContent = false,
                isLoadingMore = false;
            let currentPostId = null,
                replyTarget = null,
                exploreReplyTarget = null,
                expandedThreads = new Map(),
                lastDoubleTapTime = 0;
            const tabScrollPositions = { home: 0, explore: 0, market: 0 };
            let lastScrollY = 0,
                bottomNavHidden = false;

            // Marketplace state
            let marketCategories = [];
            let marketSubcategories = [];
            let marketListings = [];
            let activeMarketCategory = 'All';
            let activeMarketSubcategory = 'All';
            let maxPriceFilter = null;
            let currentProductId = null;
            let currentImageIndexMap = {};

            // Tags modal
            let tagsModalData = null;

            const content = document.getElementById('user-content');

            // ───────────────────────────────────────────────────────────────
            // HELPERS
            // ───────────────────────────────────────────────────────────────

            function getCurrentUser() {
                if (window.AuthUser && window.AuthUser.getCurrentUser) {
                    return window.AuthUser.getCurrentUser();
                }
                if (typeof window.getCurrentUser === 'function') {
                    return window.getCurrentUser();
                }
                return { id: 'guest', isLoggedIn: false, displayName: 'Guest', avatar: '' };
            }

            function updateNavAvatar() {
                const u = getCurrentUser();
                ['navAv', 'sideAv'].forEach(id => { const el = document.getElementById(id); if (el) el.src = u
                        .avatar || ''; });
            }

            function escapeHtml(s) { const d = document.createElement('div');
                d.textContent = s || '';
                return d.innerHTML; }

            function linkifyContent(t) {
                const r = /(https?:\/\/[^\s<>"{}|\\^`\[\]]+)/g;
                return escapeHtml(t).replace(r, u =>
                    `<a href="javascript:void(0)" class="text-primary underline font-medium break-all" data-extlink="${encodeURIComponent(u)}">${u}</a>`
                    );
            }

            function formatCount(n) {
                n = Number(n) || 0;
                if (n < 1000) return String(n);
                if (n < 1e6) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
                if (n < 1e9) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'm';
                return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'b';
            }

            function formatPrice(a) { return a.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

            function formatRelativeTime(iso) {
                const now = Date.now(),
                    then = new Date(iso).getTime(),
                    diff = Math.floor((now - then) / 1000);
                if (diff < 60) return 'Just now';
                if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                if (diff < 172800) return 'Yesterday';
                if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
                return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric',
                year: 'numeric' });
            }

            // ─── ICONS ─────────────────────────────────────────────────────
            function svgClock() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'; }

            function svgEye() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V10"/><path d="M12 19V5"/><path d="M20 19V14"/></svg>'; }

            function svgComment() {
                return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
            }

            function svgShare() {
                return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4z"/></svg>';
            }

            function svgChevronDown() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>'; }

            function svgChevronUp() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>'; }

            function svgFilter() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>'; }

            function svgLocation() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'; }

            function svgHeart(reacted) {
                return reacted ?
                    '<svg class="heart-icon" viewBox="0 0 24 24" fill="#DC2626" stroke="#DC2626" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' :
                    '<svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
            }

            function bookmarkIcon(filled) { const color = filled ? 'var(--gold)' : 'none'; return `<svg width="19" height="19" viewBox="0 0 24 24" fill="${color}" stroke="var(--gold)" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`; }

            // ───────────────────────────────────────────────────────────────
            // YOUTUBE PLAYER (reused)
            // ───────────────────────────────────────────────────────────────

            let ytState = {};
            let ytInfo = {};
            let ytWindows = {};

            function ytPostMessage(idx, func, args = []) {
                const iframe = document.getElementById('yt-' + idx);
                if (!iframe || !iframe.contentWindow) return;
                iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args }),
                    '*');
            }

            function updateYtProgressUI(idx, currentTime, duration) {
                if (!duration) return;
                const pct = (currentTime / duration) * 100;
                const fill = document.getElementById('ytProgFill-' + idx);
                const thumb = document.getElementById('ytProgThumb-' + idx);
                if (fill) fill.style.width = pct + '%';
                if (thumb) thumb.style.setProperty('--pct', pct + '%');
            }

            function _updateMuteBadge(idx) {
                const badge = document.getElementById('ytMuteBadge-' + idx);
                const ico = document.getElementById('ytMuteIco-' + idx);
                if (!badge || !ico) return;
                const state = ytState[idx] || { muted: true };
                if (state.muted) {
                    ico.innerHTML =
                        '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
                    badge.style.opacity = '.95';
                } else {
                    ico.innerHTML =
                        '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
                    badge.style.opacity = '.6';
                }
            }

            function _showYtPauseIcon(idx, isPlaying) {
                const icon = document.getElementById('ytPauseIcon-' + idx);
                if (!icon) return;
                icon.querySelector('svg').innerHTML = isPlaying ?
                    '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' :
                    '<polygon points="5 3 19 12 5 21 5 3"/>';
                icon.classList.remove('hide');
                icon.classList.add('show');
                setTimeout(() => {
                    icon.classList.remove('show');
                    icon.classList.add('hide');
                    setTimeout(() => icon.classList.remove('hide'), 200);
                }, 700);
            }

            function toggleYtControls(idx) {
                if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
                const state = ytState[idx];
                if (state.muted) {
                    ytPostMessage(idx, 'unMute');
                    state.muted = false;
                    showToast('Sound on 🔊');
                    _updateMuteBadge(idx);
                    return;
                }
                if (state.playing) {
                    ytPostMessage(idx, 'pauseVideo');
                    state.playing = false;
                    _showYtPauseIcon(idx, false);
                } else {
                    ytPostMessage(idx, 'playVideo');
                    state.playing = true;
                    _showYtPauseIcon(idx, true);
                }
            }

            function initYtListener(idx) {
                const iframe = document.getElementById('yt-' + idx);
                if (!iframe || !iframe.contentWindow) return;
                ytWindows[idx] = iframe.contentWindow;
                iframe.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'yt-' + idx }), '*');
            }

            function seekYoutube(e, idx) {
                const prog = document.getElementById('ytProg-' + idx);
                if (!prog) return;
                const rect = prog.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                const info = ytInfo[idx];
                if (!info || !info.duration) return;
                const time = pct * info.duration;
                ytPostMessage(idx, 'seekTo', [time, true]);
                updateYtProgressUI(idx, time, info.duration);
            }

            window.toggleYtControls = toggleYtControls;
            window.initYtListener = initYtListener;
            window.seekYoutube = seekYoutube;

            // ───────────────────────────────────────────────────────────────
            // PLYR SETUP
            // ───────────────────────────────────────────────────────────────

            function setupPlyrPlayer(videoElement) {
                if (videoElement.plyr) return;
                videoElement.setAttribute('playsinline', '');
                videoElement.setAttribute('webkit-playsinline', 'true');
                videoElement.removeAttribute('controls');
                const player = new Plyr(videoElement, {
                    controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                    fullscreen: { enabled: true, fallback: true, iosNative: false },
                    settings: ['quality', 'speed'],
                    quality: { default: 'auto', options: ['1080p', '720p', '480p', '360p'] }
                });
                videoElement.plyr = player;
                return player;
            }

            // ───────────────────────────────────────────────────────────────
            // MEDIA HELPERS
            // ───────────────────────────────────────────────────────────────

            function isYouTubeUrl(url) {
                if (!url) return false;
                return url.includes('youtube.com/embed') || url.includes('youtu.be') || url.includes(
                    'youtube.com/watch');
            }

            function extractYouTubeId(url) {
                const match = url.match(/(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/) ||
                    url.match(/(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/) ||
                    url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
                return match ? match[1] : null;
            }

            function getMediaItems(post) {
                if (post.media && Array.isArray(post.media) && post.media.length > 0) {
                    return post.media;
                }
                if (post.mediaUrl) {
                    return [{ url: post.mediaUrl, type: post.mediaType || 'image' }];
                }
                return [];
            }

            // ───────────────────────────────────────────────────────────────
            // BUILD MEDIA HTML
            // ───────────────────────────────────────────────────────────────

            function buildMediaHTML(p, postIndex) {
                const mediaItems = getMediaItems(p);
                if (!mediaItems || mediaItems.length === 0) return '';

                if (mediaItems.length === 1) {
                    const item = mediaItems[0];
                    const isVideo = item.type === 'video' || (item.url && isYouTubeUrl(item.url));
                    if (isVideo) {
                        if (isYouTubeUrl(item.url)) {
                            const ytId = extractYouTubeId(item.url);
                            if (!ytId) return '';
                            const idx = postIndex;
                            return `
                            <div class="ig-video-wrap">
                              <div class="yt-wrap">
                                <iframe id="yt-${idx}" src="https://www.youtube.com/embed/${ytId}?autoplay=0&loop=0&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}" allow="autoplay; encrypted-media" allowfullscreen onload="initYtListener('${idx}')"></iframe>
                                <div class="yt-tap" id="ytTap-${idx}" onclick="toggleYtControls('${idx}')"></div>
                                <div class="yt-mute-badge" id="ytMuteBadge-${idx}">
                                  <svg id="ytMuteIco-${idx}" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                                </div>
                                <div class="yt-pause-icon" id="ytPauseIcon-${idx}">
                                  <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                                </div>
                                <div class="yt-progress" id="ytProg-${idx}" onclick="seekYoutube(event, '${idx}')">
                                  <div class="yt-progress-fill" id="ytProgFill-${idx}"></div>
                                  <div class="yt-progress-thumb" id="ytProgThumb-${idx}"></div>
                                </div>
                              </div>
                            </div>
                          `;
                        } else {
                            return `<div class="ig-video-wrap" data-full-img="${item.url}">
                            <video src="${item.url}" playsinline webkit-playsinline="true" muted preload="metadata"></video>
                          </div>`;
                        }
                    } else {
                        return `<div class="ig-media-container" data-full-img="${item.url}">
                            <img src="${item.url}" class="fade-in-image" loading="lazy" onload="this.classList.add('loaded')" />
                          </div>`;
                    }
                }

                return buildCarousel(mediaItems, postIndex);
            }

            // ───────────────────────────────────────────────────────────────
            // CAROUSEL
            // ───────────────────────────────────────────────────────────────

            function buildCarousel(mediaItems, postIndex) {
                const items = mediaItems.filter(m => m.url).slice(0, 5);
                if (items.length === 0) return '';
                const carouselId = 'carousel-' + postIndex;

                let slidesHtml = items.map((item, idx) => {
                    const isVideo = item.type === 'video' || (item.url && isYouTubeUrl(item.url));
                    let contentHtml = '';

                    if (isVideo && isYouTubeUrl(item.url)) {
                        const ytId = extractYouTubeId(item.url);
                        if (ytId) {
                            contentHtml = `

                              <div class="yt-mute-badge" id="ytMuteBadge-${carouselId}-${idx}">

                              </div>
                              <div class="yt-pause-icon" id="ytPauseIcon-${carouselId}-${idx}">
                                <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                              </div>
                              <div class="yt-progress" id="ytProg-${carouselId}-${idx}" onclick="seekYoutube(event, '${carouselId}-${idx}')">
                                <div class="yt-progress-fill" id="ytProgFill-${carouselId}-${idx}"></div>
                              </div>
                            </div>
                          `;
                        } else {
                            contentHtml =
                                `<video src="${item.url}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain;background:#000;"></video>`;
                        }
                    } else if (isVideo) {
                        contentHtml =
                            `<video src="${item.url}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain;background:#000;"></video>`;
                    } else {

                            `<img src="${item.url}" class="fade-in-image" loading="lazy" onload="this.classList.add('loaded')" style="width:100%;height:100%;object-fit:contain;background:#000;" />`;
