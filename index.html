  <!-- ═══════════════════ SCRIPTS ═══════════════════ -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script>
    (function() {
      'use strict';

      // ─── CONSTANTS ──────────────────────────────────────────
      const CVK = 'freeupper_comments_visible';
      const UCK = 'freeupper_user_categories';
      const REPLY_BATCH = 3;
      const PAGE_SIZE = 5;
      const INITIAL_COMMENT_DISPLAY = 3;
      const COMMENT_LOAD_MORE = 5;
      const SITE_URL = 'https://freeupper.vercel.app';

      // ─── STATE ──────────────────────────────────────────────
      let allPosts = [];
      let appData = { posts: [], userReactions: {}, marketItems: [], nextMarketId: 1 };
      let followingSet = new Set();
      let bookmarksSet = new Set();
      let sharesSet = new Set();
      let uiPage = 'home';
      let currentCategoryFilter = '';
      let currentSortMethod = 'foryou';
      let searchQuery = '';
      let feedPage = 1;
      let observer = null;
      let sentinel = null;
      let loader = null;
      let isTogglingContent = false;
      let isLoadingMore = false;
      let currentPostId = null;
      let replyTarget = null;
      let exploreReplyTarget = null;
      let expandedThreads = new Map();
      let lastDoubleTapTime = 0;
      let marketCategoryFilter = '';
      let sharePostId = null;
      let _toastTimer = null;
      let _shareIdx = 0;

      // ─── DOM REFS ──────────────────────────────────────────
      const content = document.getElementById('user-content');
      const toastEl = document.getElementById('toast');

      // ─── HELPERS ────────────────────────────────────────────

      function getCurrentUser() {
        if (window.AuthUser && window.AuthUser.getCurrentUser) {
          return window.AuthUser.getCurrentUser();
        }
        if (typeof window.getCurrentUser === 'function') {
          return window.getCurrentUser();
        }
        return { id: 'guest', isLoggedIn: false, displayName: 'Guest', avatar: '' };
      }

      function updateNavAvatar() {
        const u = getCurrentUser();
        ['navAv', 'sideAv'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.src = u.avatar || '';
        });
      }

      function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
      }

      function formatCount(n) {
        if (!n) return '0';
        if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
        if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
        return String(n);
      }

      function formatRelativeTime(iso) {
        const now = Date.now();
        const then = new Date(iso).getTime();
        const diff = Math.floor((now - then) / 1000);
        if (diff < 60) return 'Just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        if (diff < 172800) return 'Yesterday';
        if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
        return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      function fmtNum(n) {
        if (n >= 1000000000) return (n / 1000000000).toFixed(1).replace('.0', '') + 'B';
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
        return String(n);
      }

      function svgClock() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'; }
      function svgEye() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V10"/><path d="M12 19V5"/><path d="M20 19V14"/></svg>'; }
      function svgComment() { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>'; }
      function svgShare() { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4z"/></svg>'; }
      function svgChevronDown() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>'; }
      function svgChevronUp() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>'; }
      function svgFilter() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>'; }
      function svgLocation() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'; }

      function svgHeart(reacted) {
        return reacted ?
          '<svg class="heart-icon" viewBox="0 0 24 24" fill="#DC2626" stroke="#DC2626" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' :
          '<svg class="heart-icon" viewBox="0 0 24 24" fill="#FFFFFF" stroke="currentColor" stroke-width="1.7"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
      }

      function bookmarkIcon(filled) {
        const color = filled ? 'var(--gold)' : 'none';
        return `<svg width="19" height="19" viewBox="0 0 24 24" fill="${color}" stroke="var(--gold)" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
      }

      // ─── FOLLOW, BOOKMARK, SHARE HELPERS ──────────────────

      async function loadFollows() {
        const user = getCurrentUser();
        if (!user || !user.isLoggedIn) { followingSet = new Set(); return; }
        try {
          const { data, error } = await window.sb.from('follows').select('following_id').eq('follower_id', user.id);
          if (!error) followingSet = new Set(data.map(f => f.following_id));
        } catch (e) { console.warn('loadFollows error:', e); }
      }

      async function loadBookmarks() {
        const user = getCurrentUser();
        if (!user || !user.isLoggedIn) { bookmarksSet = new Set(); return; }
        try {
          const { data, error } = await window.sb.from('bookmarks').select('post_id').eq('user_id', user.id);
          if (!error) bookmarksSet = new Set(data.map(b => b.post_id));
        } catch (e) { console.warn('loadBookmarks error:', e); }
      }

      async function loadShares() {
        const user = getCurrentUser();
        if (!user || !user.isLoggedIn) { sharesSet = new Set(); return; }
        try {
          const { data, error } = await window.sb.from('shares').select('post_id').eq('user_id', user.id);
          if (!error) sharesSet = new Set(data.map(s => s.post_id));
        } catch (e) { console.warn('loadShares error:', e); }
      }

      function isFollowing(userId) { return followingSet.has(userId); }
      function isBookmarked(postId) { return bookmarksSet.has(postId); }
      function isShared(postId) { return sharesSet.has(postId); }

      async function toggleFollowUser(userId) {
        const user = getCurrentUser();
        if (!user || !user.isLoggedIn) { showToast('Please sign in to follow', 'o'); return false; }
        const currently = isFollowing(userId);
        try {
          if (currently) {
            await window.sb.from('follows').delete().eq('follower_id', user.id).eq('following_id', userId);
            followingSet.delete(userId);
          } else {
            await window.sb.from('follows').insert({ follower_id: user.id, following_id: userId });
            followingSet.add(userId);
          }
          return !currently;
        } catch (err) {
          showToast(err.message, 'r');
          return currently;
        }
      }

      async function toggleBookmark(postId) {
        const user = getCurrentUser();
        if (!user || !user.isLoggedIn) { showToast('Please sign in to bookmark', 'o'); return false; }
        const currently = isBookmarked(postId);
        try {
          if (currently) {
            await window.sb.from('bookmarks').delete().eq('user_id', user.id).eq('post_id', postId);
            bookmarksSet.delete(postId);
          } else {
            await window.sb.from('bookmarks').insert({ user_id: user.id, post_id: postId });
            bookmarksSet.add(postId);
          }
          return !currently;
        } catch (err) {
          showToast(err.message, 'r');
          return currently;
        }
      }

      async function toggleShare(postId) {
        const user = getCurrentUser();
        if (!user || !user.isLoggedIn) { showToast('Please sign in to share', 'o'); return false; }
        const currently = isShared(postId);
        try {
          if (currently) {
            await window.sb.from('shares').delete().eq('user_id', user.id).eq('post_id', postId);
            sharesSet.delete(postId);
          } else {
            await window.sb.from('shares').insert({ user_id: user.id, post_id: postId });
            sharesSet.add(postId);
          }
          return !currently;
        } catch (err) {
          showToast(err.message, 'r');
          return currently;
        }
      }

      // ─── POSTS, COMMENTS, LIKES ───────────────────────────

      async function reloadPosts() {
        try {
          const posts = await window.PostsAPI.loadAllPosts();
          allPosts = posts;
          appData.posts = posts;
          appData.userReactions = {};
          posts.forEach(p => {
            if (p.likedByMe) appData.userReactions[p.id + '-like'] = true;
          });
          return posts;
        } catch (err) {
          console.error('Failed to load posts:', err);
          showToast('Failed to load feed', 'r');
          return [];
        }
      }

      async function loadMarketItems() {
        try {
          const { data, error } = await window.sb.from('market_items').select('*').order('created_at', { ascending: false });
          if (!error) appData.marketItems = data || [];
        } catch (e) { console.warn('Market load error:', e); appData.marketItems = []; }
      }

      async function reloadData() {
        await reloadPosts();
        await loadMarketItems();
        await loadFollows();
        await loadBookmarks();
        await loadShares();
        return appData;
      }

      function getFilteredSortedPosts() {
        const currentUser = getCurrentUser();
        let p = [...allPosts];
        // Filter private posts using profile.is_private (from the join)
        p = p.filter(post => {
          if (post.user_id === currentUser.id) return true;
          const profile = post.profile || {};
          return !profile.is_private;
        });

        if (currentCategoryFilter) p = p.filter(post => post.category === currentCategoryFilter);
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          p = p.filter(post =>
            post.title.toLowerCase().includes(q) ||
            (post.content || '').toLowerCase().includes(q) ||
            (post.description || '').toLowerCase().includes(q) ||
            (post.tags && post.tags.some(t => t.toLowerCase().includes(q)))
          );
        }

        if (currentSortMethod === 'trending') {
          p.sort((a, b) => (b.views || 0) - (a.views || 0));
        } else if (currentSortMethod === 'foryou') {
          // simple recency + engagement
          p.sort((a, b) => {
            const score = post => {
              const hours = (Date.now() - new Date(post.timestamp)) / 36e5;
              const engagement = (post.views || 0) + ((post.likes || 0) * 2) + ((post.comments || 0) * 2);
              return engagement / Math.pow(hours + 2, 1.5);
            };
            return score(b) - score(a);
          });
        } else {
          p.sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date));
        }
        return p;
      }

      function getUserCategories() {
        const r = localStorage.getItem(UCK);
        return r ? JSON.parse(r) : [];
      }

      // ─── MEDIA HELPERS ─────────────────────────────────────

      function isYouTubeUrl(url) {
        if (!url) return false;
        return url.includes('youtube.com/embed') || url.includes('youtu.be') || url.includes('youtube.com/watch');
      }

      function extractYouTubeId(url) {
        const match = url.match(/(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/) ||
                      url.match(/(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/) ||
                      url.match(/(?:[?&]v=)([a-zA-Z0-9_-]{11})/);
        return match ? match[1] : null;
      }

      function getMediaItems(post) {
        if (post.media && Array.isArray(post.media) && post.media.length > 0) {
          return post.media;
        }
        if (post.mediaUrl) {
          return [{ url: post.mediaUrl, type: post.mediaType || 'image' }];
        }
        return [];
      }

      // ─── RENDER HELPERS ────────────────────────────────────

      function buildFollowButton(authorId, authorName) {
        const cu = getCurrentUser();
        if (!authorId || authorId === cu.id) return `<span class="follow-btn hidden-follow"></span>`;
        const following = isFollowing(authorId);
        return `<button class="follow-btn ${following?'following':''}" data-user-id="${authorId}" onclick="toggleFollowHandler(event, '${authorId}')">${following?'Following':'Follow'}</button>`;
      }

      window.toggleFollowHandler = async function(e, userId) {
        e.stopPropagation();
        const btn = e.currentTarget;
        const newState = await toggleFollowUser(userId);
        btn.textContent = newState ? 'Following' : 'Follow';
        btn.classList.toggle('following', newState);
        document.querySelectorAll(`.follow-btn[data-user-id="${userId}"]`).forEach(b => {
          if (b !== btn) {
            b.textContent = newState ? 'Following' : 'Follow';
            b.classList.toggle('following', newState);
          }
        });
        showToast(newState ? 'Following ✓' : 'Unfollowed');
      };

      function buildReactionButton(postId) {
        const post = appData.posts.find(p => p.id === postId);
        const count = post ? post.likes || 0 : 0;
        const reacted = post ? !!post.likedByMe : false;
        return `<button type="button" class="reaction-btn ${reacted?'reacted':''}" data-reaction="like" onclick="toggleReaction('${postId}')">
          <span class="heart-icon-wrap">${svgHeart(reacted)}</span>
          <span class="reaction-count">${formatCount(count)}</span>
        </button>`;
      }

      function buildActionsRow(post) {
        const bm = isBookmarked(post.id);
        const cc = post.comments || 0;
        return `<div class="post-actions-row" data-post-reactions="${post.id}">
          <span class="comment-btn" onclick="openExplorePost('${post.id}','home',true)">${svgComment()}<span class="comment-count">${formatCount(cc)}</span></span>
          ${buildReactionButton(post.id)}
          <span class="views-count">${svgEye()}<span>${formatCount(post.views || 0)}</span></span>
          <span class="bookmark-badge ${bm?'bookmarked':''}" data-bookmark="${post.id}" onclick="toggleBookmarkUI(event, '${post.id}')">${bookmarkIcon(bm)}</span>
          <span class="share-btn" data-share-post="${post.id}" onclick="openShareModal('${post.id}')">${svgShare()}</span>
        </div>`;
      }

      async function toggleBookmarkUI(event, postId) {
        event.stopPropagation();
        const nb = await toggleBookmark(postId);
        document.querySelectorAll(`.bookmark-badge[data-bookmark="${postId}"]`).forEach(el => {
          el.classList.toggle('bookmarked', nb);
          el.innerHTML = bookmarkIcon(nb);
          el.classList.add('bookmark-breathe');
          setTimeout(() => el.classList.remove('bookmark-breathe'), 400);
        });
        showToast(nb ? 'Saved' : 'Removed from saved');
      }

      function toggleReaction(postId) {
        const post = appData.posts.find(p => p.id === postId);
        if (!post) return;
        if (window.AuthUser && window.AuthUser.requireAuth) {
          window.AuthUser.requireAuth(async () => {
            try {
              const { liked, count } = await window.PostsAPI.toggleLike(postId);
              post.likedByMe = liked;
              post.likes = count;
              appData.userReactions[postId + '-like'] = liked;
              // Update all reaction buttons for this post
              document.querySelectorAll(`[data-post-reactions="${postId}"] .reaction-btn, .reaction-btn[data-reaction][onclick*="${postId}"]`).forEach(btn => {
                btn.classList.toggle('reacted', liked);
                const icon = btn.querySelector('.heart-icon-wrap');
                if (icon) icon.innerHTML = svgHeart(liked);
                const cnt = btn.querySelector('.reaction-count');
                if (cnt) cnt.textContent = formatCount(count);
              });
            } catch (err) {
              showToast(err.message, 'r');
            }
          });
        } else {
          showToast('Please sign in to like', 'o');
        }
      }

      function buildMediaHTML(post, index) {
        const items = getMediaItems(post);
        if (!items || items.length === 0) return '';
        // Single item
        if (items.length === 1) {
          const item = items[0];
          const isVideo = item.type === 'video' || (item.url && isYouTubeUrl(item.url));
          if (isVideo) {
            if (isYouTubeUrl(item.url)) {
              const ytId = extractYouTubeId(item.url);
              if (!ytId) return '';
              const idx = index || 'single';
              return `<div class="ig-video-wrap">
                <div class="yt-wrap">
                  <iframe id="yt-${idx}" src="https://www.youtube.com/embed/${ytId}?autoplay=0&loop=0&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}" allow="autoplay; encrypted-media" allowfullscreen onload="initYtListener('${idx}')"></iframe>
                  <div class="yt-tap" id="ytTap-${idx}" onclick="toggleYtControls('${idx}')"></div>
                  <div class="yt-mute-badge" id="ytMuteBadge-${idx}"><svg id="ytMuteIco-${idx}" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg></div>
                  <div class="yt-pause-icon" id="ytPauseIcon-${idx}"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></div>
                  <div class="yt-progress" id="ytProg-${idx}" onclick="seekYoutube(event, '${idx}')"><div class="yt-progress-fill" id="ytProgFill-${idx}"></div><div class="yt-progress-thumb" id="ytProgThumb-${idx}"></div></div>
                </div>
              </div>`;
            } else {
              return `<div class="ig-video-wrap" data-full-img="${item.url}">
                <video src="${item.url}" playsinline webkit-playsinline="true" muted preload="metadata"></video>
              </div>`;
            }
          } else {
            return `<div class="ig-media-container" data-full-img="${item.url}">
              <img src="${item.url}" class="fade-in-image" loading="lazy" onload="this.classList.add('loaded')" />
            </div>`;
          }
        }
        // Multiple items -> carousel
        return buildCarousel(items, index || 'single');
      }

      function buildCarousel(items, postIndex) {
        const carouselId = 'carousel-' + postIndex;
        const slides = items.slice(0, 5);
        let slidesHtml = slides.map((item, idx) => {
          let contentHtml = '';
          const isVideo = item.type === 'video' || (item.url && isYouTubeUrl(item.url));
          if (isVideo && isYouTubeUrl(item.url)) {
            const ytId = extractYouTubeId(item.url);
            if (ytId) {
              contentHtml = `<div class="yt-wrap">
                <iframe id="yt-${carouselId}-${idx}" src="https://www.youtube.com/embed/${ytId}?autoplay=0&loop=0&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}" allow="autoplay; encrypted-media" allowfullscreen onload="initYtListener('${carouselId}-${idx}')"></iframe>
                <div class="yt-tap" onclick="toggleYtControls('${carouselId}-${idx}')"></div>
                <div class="yt-mute-badge" id="ytMuteBadge-${carouselId}-${idx}"><svg id="ytMuteIco-${carouselId}-${idx}" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg></div>
                <div class="yt-pause-icon" id="ytPauseIcon-${carouselId}-${idx}"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></div>
                <div class="yt-progress" id="ytProg-${carouselId}-${idx}" onclick="seekYoutube(event, '${carouselId}-${idx}')"><div class="yt-progress-fill" id="ytProgFill-${carouselId}-${idx}"></div></div>
              </div>`;
            } else {
              contentHtml = `<video src="${item.url}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain;background:#000;"></video>`;
            }
          } else if (isVideo) {
            contentHtml = `<video src="${item.url}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain;background:#000;"></video>`;
          } else {
            contentHtml = `<img src="${item.url}" class="fade-in-image" loading="lazy" onload="this.classList.add('loaded')" style="width:100%;height:100%;object-fit:contain;background:#000;" />`;
          }
          return `<div class="media-carousel-slide" data-slide="${idx}">${contentHtml}</div>`;
        }).join('');

        let dotsHtml = '';
        let arrowsHtml = '';
        if (slides.length > 1) {
          dotsHtml = `<div class="carousel-dots">${slides.map((_, i) => `<div class="carousel-dot ${i===0?'active':''}" data-slide="${i}"></div>`).join('')}</div>`;
          arrowsHtml = `
            <button class="carousel-arrow left" data-carousel="${carouselId}" data-dir="-1"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
            <button class="carousel-arrow right" data-carousel="${carouselId}" data-dir="1"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
          `;
        }
        return `<div class="media-carousel" id="${carouselId}" data-slides="${slides.length}" data-current="0">
          <div class="media-carousel-track">${slidesHtml}</div>
          ${dotsHtml}
          ${arrowsHtml}
        </div>`;
      }

      function initCarousel(carouselEl) {
        if (!carouselEl) return;
        const carouselId = carouselEl.id;
        const track = carouselEl.querySelector('.media-carousel-track');
        const slides = carouselEl.querySelectorAll('.media-carousel-slide');
        const dots = carouselEl.querySelectorAll('.carousel-dot');
        const leftArrow = carouselEl.querySelector('.carousel-arrow.left');
        const rightArrow = carouselEl.querySelector('.carousel-arrow.right');
        if (slides.length <= 1) return;
        let current = 0;
        const total = slides.length;
        let autoTimer = null;
        let arrowTimeout = null;

        function goToSlide(idx) {
          current = (idx + total) % total;
          track.style.transform = `translateX(-${current * 100}%)`;
          dots.forEach((d, i) => d.classList.toggle('active', i === current));
          resetAutoTimer();
        }
        function nextSlide() { goToSlide(current + 1); }
        function resetAutoTimer() {
          if (autoTimer) clearInterval(autoTimer);
          autoTimer = setInterval(nextSlide, 3000);
        }
        dots.forEach((dot, i) => {
          dot.addEventListener('click', (e) => { e.stopPropagation(); goToSlide(i); showArrowsTemporarily(); });
        });
        if (leftArrow) {
          leftArrow.addEventListener('click', (e) => { e.stopPropagation(); goToSlide(current - 1); showArrowsTemporarily(); });
        }
        if (rightArrow) {
          rightArrow.addEventListener('click', (e) => { e.stopPropagation(); goToSlide(current + 1); showArrowsTemporarily(); });
        }
        function showArrowsTemporarily() {
          if (leftArrow) leftArrow.classList.remove('hidden');
          if (rightArrow) rightArrow.classList.remove('hidden');
          if (arrowTimeout) clearTimeout(arrowTimeout);
          arrowTimeout = setTimeout(() => {
            if (leftArrow) leftArrow.classList.add('hidden');
            if (rightArrow) rightArrow.classList.add('hidden');
          }, 3000);
        }
        setTimeout(showArrowsTemporarily, 500);
        let startX = 0, isDragging = false;
        carouselEl.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; isDragging = true; }, { passive: true });
        carouselEl.addEventListener('touchend', (e) => {
          if (!isDragging) return;
          isDragging = false;
          const endX = e.changedTouches[0].clientX;
          const diff = startX - endX;
          if (Math.abs(diff) > 30) {
            if (diff > 0) goToSlide(current + 1);
            else goToSlide(current - 1);
            showArrowsTemporarily();
          }
        }, { passive: true });
        resetAutoTimer();
        carouselEl._cleanup = function() {
          if (autoTimer) clearInterval(autoTimer);
          if (arrowTimeout) clearTimeout(arrowTimeout);
        };
      }

      function initAllCarousels(scope) {
        const root = scope || document;
        root.querySelectorAll('.media-carousel').forEach(el => {
          if (el._inited) return;
          el._inited = true;
          initCarousel(el);
        });
      }

      // ─── VIDEO AUTO-PLAY ───────────────────────────────────

      let videoObserver = null;
      let currentlyPlayingVideo = null;

      function pauseAllVideos() {
        document.querySelectorAll('video').forEach(vid => {
          if (vid.plyr) vid.plyr.pause();
          else vid.pause();
        });
        // pause YouTube iframes
        document.querySelectorAll('iframe').forEach(iframe => {
          if (iframe.src && iframe.src.includes('youtube.com/embed')) {
            const idx = iframe.id.replace('yt-', '');
            if (ytState[idx] && ytState[idx].playing) {
              ytPostMessage(idx, 'pauseVideo');
              ytState[idx].playing = false;
              _showYtPauseIcon(idx, false);
            }
          }
        });
        currentlyPlayingVideo = null;
      }

      function setupVideoAutoplay(scope) {
        if (videoObserver) videoObserver.disconnect();
        const root = scope || document;
        const videos = root.querySelectorAll('.ig-video-wrap video, .video-container video, .media-carousel-slide video');
        videoObserver = new IntersectionObserver((entries) => {
          let visibleVideo = null;
          for (const entry of entries) {
            if (entry.isIntersecting && entry.intersectionRatio >= 0.75) {
              visibleVideo = entry.target;
              break;
            }
          }
          // pause all others
          root.querySelectorAll('.ig-video-wrap video, .video-container video, .media-carousel-slide video').forEach(vid => {
            if (vid === visibleVideo) return;
            if (vid.plyr) vid.plyr.pause();
            else vid.pause();
            if (currentlyPlayingVideo === vid) currentlyPlayingVideo = null;
          });
          root.querySelectorAll('.ig-video-wrap iframe, .media-carousel-slide iframe').forEach(iframe => {
            const idx = iframe.id.replace('yt-', '');
            if (ytState[idx] && ytState[idx].playing) {
              ytPostMessage(idx, 'pauseVideo');
              ytState[idx].playing = false;
              _showYtPauseIcon(idx, false);
              if (currentlyPlayingVideo === idx) currentlyPlayingVideo = null;
            }
          });
          if (visibleVideo) {
            if (visibleVideo.plyr) {
              if (currentlyPlayingVideo !== visibleVideo) {
                visibleVideo.plyr.play().catch(() => {});
                currentlyPlayingVideo = visibleVideo;
              }
            } else {
              if (currentlyPlayingVideo !== visibleVideo) {
                visibleVideo.play().catch(() => {});
                currentlyPlayingVideo = visibleVideo;
              }
            }
          }
        }, { threshold: 0.75, rootMargin: '0px 0px -20px 0px' });
        videos.forEach(vid => videoObserver.observe(vid));
      }

      // ─── YOUTUBE PLAYER ────────────────────────────────────

      let ytState = {};
      let ytInfo = {};
      let ytWindows = {};

      function ytPostMessage(idx, func, args = []) {
        const iframe = document.getElementById('yt-' + idx);
        if (!iframe || !iframe.contentWindow) return;
        iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*');
      }

      function initYtListener(idx) {
        const iframe = document.getElementById('yt-' + idx);
        if (!iframe || iframe.contentWindow) return;
        ytWindows[idx] = iframe.contentWindow;
        iframe.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'yt-' + idx }), '*');
      }

      function _updateMuteBadge(idx) {
        const badge = document.getElementById('ytMuteBadge-' + idx);
        const ico = document.getElementById('ytMuteIco-' + idx);
        if (!badge || !ico) return;
        const state = ytState[idx] || { muted: true };
        if (state.muted) {
          ico.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
          badge.style.opacity = '.95';
        } else {
          ico.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>';
          badge.style.opacity = '.6';
        }
      }

      function _showYtPauseIcon(idx, isPlaying) {
        const icon = document.getElementById('ytPauseIcon-' + idx);
        if (!icon) return;
        icon.querySelector('svg').innerHTML = isPlaying ?
          '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' :
          '<polygon points="5 3 19 12 5 21 5 3"/>';
        icon.classList.remove('hide');
        icon.classList.add('show');
        setTimeout(() => {
          icon.classList.remove('show');
          icon.classList.add('hide');
          setTimeout(() => icon.classList.remove('hide'), 200);
        }, 700);
      }

      function toggleYtControls(idx) {
        if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
        const state = ytState[idx];
        if (state.muted) {
          ytPostMessage(idx, 'unMute');
          state.muted = false;
          showToast('Sound on');
          _updateMuteBadge(idx);
          return;
        }
        if (state.playing) {
          ytPostMessage(idx, 'pauseVideo');
          state.playing = false;
          _showYtPauseIcon(idx, false);
        } else {
          ytPostMessage(idx, 'playVideo');
          state.playing = true;
          _showYtPauseIcon(idx, true);
        }
        _updateMuteBadge(idx);
      }

      function seekYoutube(e, idx) {
        const prog = document.getElementById('ytProg-' + idx);
        if (!prog) return;
        const rect = prog.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const info = ytInfo[idx];
        if (!info || !info.duration) return;
        const time = pct * info.duration;
        ytPostMessage(idx, 'seekTo', [time, true]);
        updateYtProgressUI(idx, time, info.duration);
      }

      function updateYtProgressUI(idx, currentTime, duration) {
        if (!duration) return;
        const pct = (currentTime / duration) * 100;
        const fill = document.getElementById('ytProgFill-' + idx);
        const thumb = document.getElementById('ytProgThumb-' + idx);
        if (fill) fill.style.width = pct + '%';
        if (thumb) thumb.style.setProperty('--pct', pct + '%');
      }

      window.initYtListener = initYtListener;
      window.toggleYtControls = toggleYtControls;
      window.seekYoutube = seekYoutube;

      // ─── POST RENDER ────────────────────────────────────────

      function buildPostHTML(post, index) {
        const profile = post.profile || {};
        const author = window.getAuthorFromProfile ? window.getAuthorFromProfile(profile) : { name: 'Anonymous', avatar: '', verified_status: 'none' };

        const hd = post.description && post.description.trim().length > 0;
        const pt = (post.content || '').substring(0, 250);
        const isLong = (post.content || '').length > 250;
        const th = post.tags && post.tags.length > 0 ?
          `<div class="flex flex-wrap gap-1 mt-2">${post.tags.map(t => `<span class="tag-badge" style="display:inline-block;padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:600;background:rgba(124,58,237,.08);color:#7C3AED;">#${escapeHtml(t)}</span>`).join('')}</div>` : '';
        const mh = buildMediaHTML(post, index);
        const followBtn = buildFollowButton(post.user_id, author.name);

        const badgeHtml = window.getVerifiedBadgeHTML ? window.getVerifiedBadgeHTML(author.verified_status) : '';

        return `<article class="feed-post" data-post-id="${post.id}" data-author-id="${author.id}">
          <div class="flex items-start gap-3" style="padding:0 16px;">
            <img data-author-avatar src="${author.avatar}" class="user-mini-avatar" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;" />
            <div style="min-width:0;flex:1;">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span data-author-name class="font-bold text-sm cursor-pointer hover:underline" style="color:var(--text);">${escapeHtml(author.name)}</span>
                <span data-author-badge-wrapper>${badgeHtml}</span>
                <span class="text-xs" style="color:var(--muted);">${formatRelativeTime(post.timestamp || post.date)}</span>
                ${followBtn}
                <span class="text-xs text-primary font-semibold uppercase tracking-wide cursor-pointer hover:underline ml-auto flex-shrink-0">${escapeHtml(post.category || 'General')}</span>
              </div>
              <h3 class="font-heading font-bold text-base mt-0.5 cursor-pointer" style="overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;overflow-wrap:anywhere;color:var(--text);">${escapeHtml(post.title)}</h3>
              ${hd ? `<p class="text-sm mt-1 leading-relaxed" style="white-space:pre-wrap;color:var(--muted);">${escapeHtml(post.description)}</p>` : ''}
              <div class="mt-1" id="post-content-${post.id}">
                <div class="content-preview preview-text-${post.id}">${linkifyContent(pt)}</div>
                ${isLong ? `<div class="content-text full-text-${post.id} hidden">${linkifyContent(post.content)}</div><button type="button" class="read-more-btn mt-1 text-primary font-semibold text-sm">Show more</button>` : `<div class="content-text full-text-${post.id}">${linkifyContent(post.content)}</div>`}
              </div>
              ${mh}
              ${th}
              ${buildActionsRow(post)}
            </div>
          </div>
        </article>`;
      }

      function linkifyContent(t) {
        const r = /(https?:\/\/[^\s<>"{}|\\^`\[\]]+)/g;
        return escapeHtml(t).replace(r, u => `<a href="javascript:void(0)" class="text-primary underline font-medium break-all" data-extlink="${encodeURIComponent(u)}">${u}</a>`);
      }

      // ─── FEED RENDER ──────────────────────────────────────

      function renderFeedContainer() {
        const ps = getFilteredSortedPosts();
        const hf = searchQuery || currentCategoryFilter;
        const hh = hf ?
          `<div class="mb-4 px-4 pt-3"><h1 class="text-xl font-heading font-bold" style="color:var(--text);">${searchQuery?'Search results':currentCategoryFilter}</h1><p class="text-sm" style="color:var(--muted);">${ps.length} post(s)</p></div>` : '';
        return `<div class="max-w-2xl mx-auto"><div>${hh}</div><div id="feed-container" class="px-0"></div></div>`;
      }

      function renderSkeletons(c) {
        let h = '';
        for (let i = 0; i < (c || 3); i++) {
          h += `<div class="skeleton-post"><div class="flex gap-3" style="padding:0 16px;"><div class="skeleton skeleton-avatar"></div><div style="flex:1;"><div class="skeleton skeleton-line" style="width:40%;height:10px"></div><div class="skeleton skeleton-title"></div>${i===0?'<div class="skeleton skeleton-image"></div>':''}<div class="skeleton skeleton-line" style="width:100%"></div><div class="skeleton skeleton-line" style="width:70%"></div><div class="skeleton skeleton-reactions"></div></div></div></div>`;
        }
        return h;
      }

      function getSentinel() {
        if (!sentinel) {
          sentinel = document.createElement('div');
          sentinel.id = 'sentinel';
          sentinel.style.height = '1px';
        }
        return sentinel;
      }

      function getLoader() {
        if (!loader) {
          loader = document.createElement('div');
          loader.id = 'feed-loader';
          loader.className = 'hidden';
          loader.innerHTML = '<div style="text-align:center;padding:20px;"><div class="spinner" style="margin:0 auto;"></div></div>';
        }
        return loader;
      }

      function setupSentinel() {
        const co = document.getElementById('feed-container');
        if (co && !co.contains(getSentinel())) co.appendChild(getSentinel());
        const l = getLoader();
        if (co && !co.contains(l)) co.insertBefore(l, getSentinel());
      }

      function setupInfiniteScroll() {
        if (observer) observer.disconnect();
        observer = new IntersectionObserver(entries => {
          if (isTogglingContent || isLoadingMore) return;
          if (entries[0].isIntersecting) loadMorePosts();
        }, { root: null, rootMargin: '200px', threshold: 0 });
        observer.observe(getSentinel());
      }

      function initPlayers(root) {
        root.querySelectorAll('.ig-video-wrap video:not([data-plyr-init]), .video-container video:not([data-plyr-init]), .media-carousel-slide video:not([data-plyr-init])').forEach(vid => {
          vid.dataset.plyrInit = 'true';
          setupPlyrPlayer(vid);
        });
        initAllCarousels(root);
        setTimeout(() => {
          setupVideoAutoplay(root);
          setTimeout(() => {
            const wraps = root.querySelectorAll('.ig-video-wrap, .video-container, .media-carousel');
            let firstVisible = null;
            for (const w of wraps) {
              const rect = w.getBoundingClientRect();
              if (rect.top < window.innerHeight && rect.bottom > 0) {
                firstVisible = w;
                break;
              }
            }
            if (firstVisible) {
              const vid = firstVisible.querySelector('video');
              if (vid && vid.plyr) {
                vid.plyr.play().catch(() => {});
                currentlyPlayingVideo = vid;
              } else if (vid) {
                vid.play().catch(() => {});
                currentlyPlayingVideo = vid;
              }
              const ytIframe = firstVisible.querySelector('iframe');
              if (ytIframe) {
                const idx = ytIframe.id.replace('yt-', '');
                if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
                if (!ytState[idx].playing) {
                  ytPostMessage(idx, 'playVideo');
                  ytState[idx].playing = true;
                  _showYtPauseIcon(idx, true);
                  _updateMuteBadge(idx);
                  currentlyPlayingVideo = idx;
                }
              }
            }
          }, 400);
        }, 300);
      }

      function setupPlyrPlayer(videoElement) {
        if (videoElement.plyr) return;
        videoElement.setAttribute('playsinline', '');
        videoElement.setAttribute('webkit-playsinline', 'true');
        videoElement.removeAttribute('controls');
        const player = new Plyr(videoElement, {
          controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
          fullscreen: { enabled: true, fallback: true, iosNative: false },
          settings: ['quality', 'speed'],
          quality: { default: 'auto', options: ['1080p', '720p', '480p', '360p'] }
        });
        videoElement.plyr = player;
        return player;
      }

      function loadInitialFeed() {
        feedPage = 1;
        isLoadingMore = false;
        if (observer) observer.disconnect();
        const co = document.getElementById('feed-container');
        if (!co) return;
        co.innerHTML = renderSkeletons(3);
        setTimeout(() => {
          const ps = getFilteredSortedPosts();
          co.innerHTML = '';
          if (ps.length === 0) {
            co.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-center"><p class="text-sm" style="color:var(--muted);">No posts yet.</p></div>';
            return;
          }
          const fb = ps.slice(0, PAGE_SIZE);
          co.innerHTML = fb.map((p, i) => buildPostHTML(p, i)).join('');
          requestAnimationFrame(() => {
            initPlayers(co);
            setupSentinel();
            setupInfiniteScroll();
            co.querySelectorAll('article').forEach(a => setupPostEventDelegation(a));
            window._currentFeedPosts = ps;
          });
        }, 150);
      }

      function loadMorePosts() {
        if (isLoadingMore) return;
        const ps = window._currentFeedPosts || getFilteredSortedPosts();
        const start = feedPage * PAGE_SIZE;
        const nb = ps.slice(start, start + PAGE_SIZE);
        if (nb.length === 0) {
          if (observer && sentinel) observer.unobserve(sentinel);
          return;
        }
        isLoadingMore = true;
        const co = document.getElementById('feed-container');
        const s = getSentinel();
        const t = document.createElement('div');
        t.innerHTML = nb.map((p, i) => buildPostHTML(p, start + i)).join('');
        while (t.firstChild) co.insertBefore(t.firstChild, s);
        requestAnimationFrame(() => {
          initPlayers(co);
          co.querySelectorAll('article:not([data-events-set])').forEach(a => {
            setupPostEventDelegation(a);
            a.dataset.eventsSet = 'true';
          });
          feedPage++;
          isLoadingMore = false;
        });
      }

      function setupPostEventDelegation(article) {
        article.addEventListener('click', function(e) {
          const t = e.target;
          const pid = article.dataset.postId;
          if (t.classList.contains('read-more-btn')) {
            e.stopPropagation();
            toggleReadMore(article);
            return;
          }
          if (t.closest('.reaction-btn')) {
            e.stopPropagation();
            toggleReaction(pid);
            return;
          }
          if (t.closest('.bookmark-badge')) {
            e.stopPropagation();
            return; // handled by onclick
          }
          if (t.closest('.share-btn')) {
            e.stopPropagation();
            return; // handled by onclick
          }
          if (t.closest('.comment-btn')) {
            e.stopPropagation();
            openExplorePost(pid, 'home', true);
            return;
          }
          if (t.closest('.user-mini-avatar') || t.closest('.font-bold.text-sm')) {
            e.stopPropagation();
            const post = allPosts.find(p => p.id === pid);
            if (post && post.user_id) navigateToProfile(post.user_id);
            return;
          }
          if (t.closest('.text-primary.uppercase')) {
            e.stopPropagation();
            const post = allPosts.find(p => p.id === pid);
            if (post) filterCategory(post.category);
            return;
          }
          if (t.closest('[data-full-img]')) {
            const c = t.closest('[data-full-img]');
            e.stopPropagation();
            openLightbox(c.dataset.fullImg);
            return;
          }
          if (t.closest('[data-extlink]')) {
            e.stopPropagation();
            openInAppWebView(decodeURIComponent(t.closest('[data-extlink]').dataset.extlink));
            return;
          }
          // double tap to like
          const now = Date.now();
          const gap = now - lastDoubleTapTime;
          if (gap < 300 && gap > 0) {
            e.preventDefault();
            toggleReaction(pid);
            lastDoubleTapTime = now;
          } else {
            lastDoubleTapTime = now;
            if (gap >= 300) {
              setTimeout(() => {
                if (Date.now() - lastDoubleTapTime >= 300) openExplorePost(pid, 'home');
              }, 310);
            }
          }
        });
      }

      function toggleReadMore(article) {
        isTogglingContent = true;
        const pid = article.dataset.postId;
        const pv = article.querySelector(`.preview-text-${pid}`);
        const fl = article.querySelector(`.full-text-${pid}`);
        const b = article.querySelector('.read-more-btn');
        if (!pv || !fl) { isTogglingContent = false; return; }
        if (fl.classList.contains('hidden')) {
          pv.classList.add('hidden');
          fl.classList.remove('hidden');
          b.textContent = 'Show less';
        } else {
          pv.classList.remove('hidden');
          fl.classList.add('hidden');
          b.textContent = 'Show more';
        }
        isTogglingContent = false;
      }

      // ─── SHARE MODAL ─────────────────────────────────────

      function openShareModal(postId) {
        sharePostId = postId;
        const post = allPosts.find(p => p.id === postId);
        if (!post) { showToast('Post not found'); return; }
        const v = { // adapt to share preview
          src: post.mediaUrl || '',
          poster: post.mediaUrl || '',
          caption: post.title + (post.description ? '\n' + post.description : ''),
          handle: post.profile ? '@' + post.profile.username : ''
        };
        _shareIdx = 0; // we only have one post
        const nativeBtn = document.getElementById('nativeShareBtn');
        if (nativeBtn) nativeBtn.style.display = navigator.share ? 'flex' : 'none';
        const thumb = document.getElementById('sharePreviewThumb');
        const cap = document.getElementById('sharePreviewCaption');
        const handle = document.getElementById('sharePreviewHandle');
        if (thumb) thumb.src = v.poster || '';
        if (cap) cap.textContent = (v.caption || '').split('\n')[0].slice(0, 60);
        if (handle) handle.textContent = v.handle || '';
        openSheet('shareSheet');
      }

      function closeShareModal() {
        closeSheet('shareSheet');
        sharePostId = null;
      }

      function getPostUrl(idx) {
        const post = allPosts.find(p => p.id === sharePostId);
        const id = post ? post.id : '';
        return `${SITE_URL}/video.html?post=${encodeURIComponent(id || '')}`;
      }

      function getPostTitle(idx) {
        const post = allPosts.find(p => p.id === sharePostId);
        return (post && post.title) || 'Check this out on Freeupper';
      }

      async function shareAction(type) {
        const url = getPostUrl(0);
        const title = getPostTitle(0);
        const text = `${title} — ${url}`;
        if (navigator.vibrate) navigator.vibrate(8);

        switch (type) {
          case 'native':
            try { await navigator.share({ title, text: title, url }); } catch (e) { return; }
            closeShareModal();
            return;
          case 'copy': {
            const btn = document.getElementById('copyLinkBtn');
            const lbl = document.getElementById('copyLbl');
            try {
              await navigator.clipboard.writeText(url);
              if (btn) btn.classList.add('copied');
              if (lbl) lbl.textContent = 'Copied ✓';
              showToast('Link copied');
              setTimeout(() => {
                if (btn) btn.classList.remove('copied');
                if (lbl) lbl.textContent = 'Copy link';
              }, 2000);
            } catch (e) { showToast('Could not copy link'); }
            return;
          }
          case 'whatsapp':
            closeShareModal();
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            return;
          case 'twitter':
            closeShareModal();
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`, '_blank');
            return;
          case 'telegram':
            closeShareModal();
            window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`, '_blank');
            return;
          case 'facebook':
            closeShareModal();
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank');
            return;
          case 'instagram':
            closeShareModal();
            if (navigator.share) {
              try { await navigator.share({ title, url }); } catch (e) {}
            } else {
              showToast('Open Instagram app to share');
            }
            return;
          case 'repost':
            closeShareModal();
            openSheet('repostSheet');
            return;
          case 'quote':
            closeShareModal();
            openSheet('quoteSheet');
            return;
          case 'download':
            await downloadVideo();
            closeShareModal();
            return;
        }
      }

      async function downloadVideo() {
        const post = allPosts.find(p => p.id === sharePostId);
        if (!post) return;
        const lbl = document.getElementById('saveVideoLbl');
        const btn = document.getElementById('saveVideoBtn');
        if (btn) btn.disabled = true;
        let dots = 0;
        const anim = setInterval(() => {
          dots = (dots + 1) % 4;
          if (lbl) lbl.textContent = 'Downloading' + '.'.repeat(dots);
        }, 350);
        try {
          const res = await fetch(post.mediaUrl);
          if (!res.ok) throw new Error('Network error');
          const blob = await res.blob();
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `freeupper-${post.id}.mp4`;
          a.click();
          URL.revokeObjectURL(a.href);
          clearInterval(anim);
          if (lbl) lbl.textContent = 'Save Video';
          showToast('Downloaded successfully');
        } catch (e) {
          clearInterval(anim);
          if (lbl) lbl.textContent = 'Save Video';
          showToast('Download failed');
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      // ─── COMMENTS ─────────────────────────────────────────

      function getCommentsVisible() {
        const r = localStorage.getItem(CVK);
        return r ? JSON.parse(r) : {};
      }

      function setCommentsVisible(postId, count) {
        const cv = getCommentsVisible();
        cv[postId] = count;
        localStorage.setItem(CVK, JSON.stringify(cv));
      }

      function getVisibleComments(postId) {
        const cv = getCommentsVisible();
        return cv[postId] || INITIAL_COMMENT_DISPLAY;
      }

      function getAllDescendants(pid, comments) {
        const result = [];
        const direct = comments.filter(c => c.parentId === pid);
        for (const c of direct) {
          result.push(c);
          result.push(...getAllDescendants(c.id, comments));
        }
        return result;
      }

      function renderCommentsHTML(comments, postId, visibleCount) {
        const topLevel = comments.filter(c => c.parentId === null);
        if (topLevel.length === 0) {
          return '<p style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">Be the first to comment.</p>';
        }
        const shown = topLevel.slice(0, visibleCount);
        const hidden = topLevel.length - visibleCount;
        let html = shown.map(c => renderCommentThread(c, comments, postId)).join('');
        if (hidden > 0) {
          html += `<button class="view-replies-btn load-more-comments-btn" onclick="loadMoreComments('${postId}')">View ${hidden} more comment${hidden > 1 ? 's' : ''}</button>`;
        }
        return html;
      }

      function renderCommentThread(comment, allComments, postId) {
        const replies = getAllDescendants(comment.id, allComments);
        const total = replies.length;
        const expandedCount = expandedThreads.get(comment.id) || 0;
        const post = appData.posts.find(p => p.id === postId);
        const isCreator = post && comment.userId === post.authorId;

        let repliesHtml = '';
        if (total > 0 && expandedCount === 0) {
          repliesHtml = `<button class="view-replies-btn" onclick="expandReplies('${comment.id}','${postId}')">View ${total} repl${total > 1 ? 'ies' : 'y'}</button>`;
        } else if (total > 0 && expandedCount > 0) {
          const shownReplies = replies.slice(0, expandedCount);
          const remaining = total - expandedCount;
          repliesHtml = `<div class="replies-thread">${shownReplies.map(r => renderReplyItem(r, allComments, postId)).join('')}</div>`;
          if (remaining > 0) {
            repliesHtml += `<button class="view-replies-btn" onclick="expandReplies('${comment.id}','${postId}')">See ${remaining} more repl${remaining > 1 ? 'ies' : 'y'}</button>`;
          } else {
            repliesHtml += `<button class="hide-replies-btn" onclick="collapseReplies('${comment.id}','${postId}')">Hide replies</button>`;
          }
        }

        const likeCount = parseInt(localStorage.getItem('comment-like-' + comment.id) || '0');
        const isLiked = likeCount > 0;

        const avatarHtml = comment.avatar ? `<img src="${comment.avatar}" alt="">` : comment.username.charAt(0).toUpperCase();
        const avatarClass = comment.avatar ? 'comment-avatar has-image' : 'comment-avatar';
        const badgeHtml = window.getVerifiedBadgeHTML ? window.getVerifiedBadgeHTML(comment.verified_status) : '';

        return `<div class="comment-item" data-comment-id="${comment.id}">
          <div class="${avatarClass}" data-username="${escapeHtml(comment.username)}">${avatarHtml}</div>
          <div class="comment-body">
            <div class="comment-username-row">
              ${isCreator ? `<span class="creator-lbl">Creator</span>` : ''}
              <span class="comment-username">${escapeHtml(comment.username)} ${badgeHtml}</span>
              <span class="comment-time">${formatRelativeTime(comment.time)}</span>
            </div>
            <div class="comment-text" data-cid="${comment.id}">${escapeHtml(comment.message)}</div>
            <button class="comment-reply-btn" onclick="replyToComment('${comment.id}', '${escapeHtml(comment.username)}')">Reply</button>
            ${repliesHtml}
          </div>
          <button class="comment-like-btn ${isLiked ? 'liked' : ''}" onclick="toggleCommentLikeUI(this, '${comment.id}')">
            <svg class="like-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span class="like-count">${likeCount > 0 ? likeCount : ''}</span>
          </button>
        </div>`;
      }

      function renderReplyItem(reply, allComments, postId) {
        const parent = allComments.find(c => c.id === reply.parentId);
        const parentName = parent ? parent.username : '';
        const mention = (parentName && parentName !== reply.username) ? `<span style="color:var(--p);font-weight:500;">@${escapeHtml(parentName)}</span> ` : '';
        const post = appData.posts.find(p => p.id === postId);
        const isCreator = post && reply.userId === post.authorId;
        const likeCount = parseInt(localStorage.getItem('comment-like-' + reply.id) || '0');
        const isLiked = likeCount > 0;
        const badgeHtml = window.getVerifiedBadgeHTML ? window.getVerifiedBadgeHTML(reply.verified_status) : '';

        return `<div class="reply-item" data-comment-id="${reply.id}">
          <div class="reply-avatar-dot ${reply.avatar ? 'has-image' : ''}" data-username="${escapeHtml(reply.username)}">${reply.avatar ? `<img src="${reply.avatar}" alt="">` : reply.username.charAt(0).toUpperCase()}</div>
          <div class="reply-body">
            <div class="reply-username">${isCreator ? `<span class="creator-lbl">Creator</span>` : ''} @${escapeHtml(reply.username)} ${badgeHtml}</div>
            <div class="reply-text">${mention}${escapeHtml(reply.message)}</div>
            <div class="reply-meta">
              <span class="reply-time">${formatRelativeTime(reply.time)}</span>
              <button class="reply-reply-btn" onclick="replyToComment('${reply.id}', '${escapeHtml(reply.username)}')">Reply</button>
              <button class="reply-like-btn ${isLiked ? 'liked' : ''}" onclick="toggleCommentLikeUI(this, '${reply.id}')">
                <svg class="like-heart" viewBox="0 0 24 24" width="12" height="12"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span class="like-count">${likeCount > 0 ? likeCount : ''}</span>
              </button>
            </div>
          </div>
        </div>`;
      }

      function replyToComment(commentId, username) {
        replyTarget = { commentId, username };
        updateReplyContextUI();
        document.getElementById('commentInput').focus();
        document.getElementById('commentInput').placeholder = `Reply to @${username}...`;
        showToast(`Replying to @${username}`);
      }

      function cancelReply() {
        replyTarget = null;
        updateReplyContextUI();
        document.getElementById('commentInput').placeholder = 'Add a comment…';
        document.getElementById('commentInput').value = '';
      }

      function updateReplyContextUI() {
        const banner = document.getElementById('reply-context-banner');
        const usernameEl = document.getElementById('reply-context-username');
        if (replyTarget) {
          banner.classList.add('show');
          usernameEl.textContent = '@' + replyTarget.username;
        } else {
          banner.classList.remove('show');
          usernameEl.textContent = '';
        }
      }

      function toggleCommentLikeUI(btn, commentId) {
        const isLiked = btn.classList.toggle('liked');
        const key = 'comment-like-' + commentId;
        let count = parseInt(localStorage.getItem(key) || '0');
        if (isLiked) count++;
        else count = Math.max(0, count - 1);
        if (count === 0) localStorage.removeItem(key);
        else localStorage.setItem(key, String(count));
        const countEl = btn.querySelector('.like-count');
        if (countEl) countEl.textContent = count > 0 ? count : '';
      }

      async function expandReplies(commentId, postId) {
        const current = expandedThreads.get(commentId) || 0;
        const nextCount = current === 0 ? REPLY_FIRST_BATCH : current + REPLY_BATCH;
        expandedThreads.set(commentId, nextCount);
        refreshCommentsList(postId);
      }

      function collapseReplies(commentId, postId) {
        expandedThreads.delete(commentId);
        refreshCommentsList(postId);
      }

      function loadMoreComments(postId) {
        const current = getVisibleComments(postId);
        setCommentsVisible(postId, current + COMMENT_LOAD_MORE);
        refreshCommentsList(postId);
      }

      async function refreshCommentsList(postId) {
        const container = document.getElementById('comments-list');
        if (!container) return;
        try {
          const post = appData.posts.find(p => p.id === postId);
          let comments = post?.comments?.length ?
            post.comments :
            await window.PostsAPI.loadComments(postId);
          if (post) post.comments = comments;
          comments = [...comments].sort((a, b) => {
            if (commentSortMode === 'newest') return new Date(b.time) - new Date(a.time);
            const la = parseInt(localStorage.getItem('comment-like-' + a.id) || '0');
            const lb = parseInt(localStorage.getItem('comment-like-' + b.id) || '0');
            return lb - la;
          });
          const visibleCount = getVisibleComments(postId);
          container.innerHTML = renderCommentsHTML(comments, postId, visibleCount);
        } catch (err) {
          console.warn('Failed to load comments:', err);
          container.innerHTML = '<p style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">Could not load comments.</p>';
        }
      }

      function toggleSortMenu() {
        let menu = document.getElementById('sortMenuPopover');
        if (menu) { menu.remove(); return; }
        menu = document.createElement('div');
        menu.id = 'sortMenuPopover';
        menu.innerHTML = `
          <button class="sort-option ${commentSortMode === 'top' ? 'active' : ''}" data-mode="top">Top comments</button>
          <button class="sort-option ${commentSortMode === 'newest' ? 'active' : ''}" data-mode="newest">Newest comments</button>
        `;
        document.getElementById('commentSheet').appendChild(menu);
        menu.querySelectorAll('.sort-option').forEach(btn => {
          btn.onclick = () => {
            commentSortMode = btn.dataset.mode;
            menu.remove();
            refreshCommentsList(currentPostId);
            showToast(commentSortMode === 'top' ? 'Sorted by: Top comments' : 'Sorted by: Newest');
          };
        });
        setTimeout(() => {
          document.addEventListener('pointerdown', function closeMenu(ev) {
            if (!menu.contains(ev.target)) {
              menu.remove();
              document.removeEventListener('pointerdown', closeMenu);
            }
          }, { capture: true, once: true });
        }, 0);
      }

      // ─── EXPLORE FULLSCREEN ──────────────────────────────

      async function openExplorePost(id, returnPage, focusComment) {
        pauseAllVideos();
        const fs = document.getElementById('explore-fullscreen');
        const fc = document.getElementById('explore-fullscreen-content');
        if (!fs || !fc) {
          // fallback: just scroll to post if not in explore mode?
          // for now, create a temporary modal?

          if (!post) return;
          // simple scroll to post if in home feed

          if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });

        document.body.classList.add('explore-open');
        document.body.style.overflow = 'hidden';

        initPlayers(fc);
        if (focusComment) {
          const ta = document.getElementById('explore-comment-textarea');
          if (ta) setTimeout(() => ta.focus(), 300);
        }

      // ─── EXPLORE GRID ─────────────────────────────────────

      function renderExploreGrid() {
        const co = document.getElementById('user-content');
        const currentUser = getCurrentUser();
        let p = [...allPosts].filter(post => {
          if (post.user_id === currentUser.id) return true;
          const profile = post.profile || {};
          return !profile.is_private;
        });
        p.sort((a, b) => ((b.views || 0) + (b.likes || 0)) - ((a.views || 0) + (a.likes || 0)));

        co.innerHTML = `<div class="max-w-2xl mx-auto px-3 py-3">
