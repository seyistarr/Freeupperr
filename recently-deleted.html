<!doctype html><html lang="en"><head><meta name="theme-color" id="theme-color-meta" content="#000000"><script src="/theme.js?v=2"></script><link rel="stylesheet" href="/theme.css?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Recently deleted · FreeUpper</title><link rel="stylesheet" href="global.css?v=theme-v1">
<style>
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}
.rd-page{max-width:650px;margin:auto;padding:16px 12px 140px;min-height:100vh;box-sizing:border-box}
.rd-header{display:flex;align-items:center;gap:12px;margin:12px 0 24px}
.rd-header h1{font-size:clamp(17px,4.6vw,24px);margin:0;flex:1;text-align:center}
.rd-back{color:#7843f5;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.rd-help{border:2px solid #7843f5;border-radius:50%;width:35px;height:35px;background:transparent;color:#7843f5;font-weight:800;font-size:19px}
.rd-banner{display:flex;gap:12px;align-items:center;background:rgba(120,67,245,.11);padding:17px 14px;border-radius:18px;margin-bottom:18px}
.rd-banner-icon{font-size:25px;color:#7843f5;background:rgba(120,67,245,.12);border-radius:50%;width:48px;height:48px;display:grid;place-items:center;flex:none}
.rd-banner h2{margin:0 0 4px;font-size:17px}.rd-banner p{margin:0;font-size:14px;opacity:.8}.rd-banner b{color:#7843f5}
.rd-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.rd-card{border:1px solid rgba(128,128,128,.18);border-radius:14px;overflow:hidden;background:var(--bg)}
.rd-card.selected{outline:2px solid #7843f5}
.rd-thumb{position:relative;aspect-ratio:1/1.15;background:rgba(120,67,245,.13);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.rd-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rd-text{font-size:12px;font-weight:650;padding:8px;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.rd-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:white;border-radius:7px;padding:3px 5px;font-size:10px}
.rd-check{position:absolute;top:6px;right:6px;border:2px solid white;border-radius:50%;width:23px;height:23px;display:grid;place-items:center;color:white;background:rgba(0,0,0,.18)}
.selected .rd-check{background:#7843f5;border-color:#7843f5}
.rd-expiry{font-size:10px;opacity:.75;padding:6px;min-height:25px}
.rd-actions{display:flex;gap:4px;padding:5px 4px 7px}
.rd-actions button{flex:1;min-width:0;border:0;border-radius:9px;padding:9px 2px;font-size:clamp(10px,2.7vw,13px);font-weight:700}
.rd-restore{color:#7843f5;background:rgba(120,67,245,.12)}.rd-delete{color:#dc263c;background:rgba(220,38,60,.1)}
button:disabled{opacity:.45}
.rd-empty{grid-column:1/-1;text-align:center;padding:60px 8px;opacity:.7}
.rd-bar{position:fixed;bottom:0;left:0;right:0;padding:13px 14px calc(env(safe-area-inset-bottom) + 14px);background:var(--bg);border-top:1px solid rgba(128,128,128,.18);border-radius:22px 22px 0 0;z-index:30}
.rd-bar[hidden]{display:none}.rd-bar-inner{display:flex;gap:12px;max-width:650px;margin:auto}.rd-bar button{flex:1;border:0;border-radius:14px;min-height:55px;font-weight:700;font-size:14px}
#rdSelectAll{background:rgba(120,67,245,.12);color:#7843f5}#rdRestoreSel{background:#7843f5;color:white}
.rd-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}.rd-overlay.open{display:flex}
.rd-sheet{width:100%;max-width:520px;background:var(--bg);color:var(--text);border-radius:24px 24px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom) + 22px);box-sizing:border-box}
.rd-sheet h3{margin:0 0 8px}.rd-sheet p{margin:0 0 18px}.rd-sheet-actions{display:flex;gap:10px}.rd-sheet-actions button{flex:1;border:0;border-radius:12px;padding:14px;font-weight:700}
.rd-cancel{background:rgba(120,67,245,.12);color:#7843f5}.rd-confirm{background:#dc263c;color:white}
#status{font-size:13px}#status:empty{display:none}
@media(min-width:600px){.rd-overlay{align-items:center}.rd-sheet{border-radius:24px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" defer></script><script src="global.js?v=theme-v1" defer></script><script src="auth.js" defer></script><script src="recently-deleted.js?v=4" defer></script><link rel="stylesheet" href="/js/i18n.css">
<script type="module" src="/js/freeupper-i18n.js"></script>
</head>
<body><main class="rd-page">
<header class="rd-header"><a class="rd-back" href="settings.html">‹ Back to Settings</a><h1>Recently Deleted</h1><button id="rdHelp" class="rd-help" type="button" aria-label="Help">?</button></header>
<section class="rd-banner"><div class="rd-banner-icon">♻</div><div><h2>Your deleted posts are here</h2><p>Deleted posts are hidden immediately. You have <b>7 days</b> to restore them before permanent deletion.</p></div></section>
<button id="signin" hidden type="button">Sign in</button><p id="status" role="status"></p><ul id="posts" class="rd-grid"></ul></main>
<div id="rdBar" class="rd-bar" hidden><div class="rd-bar-inner"><button id="rdSelectAll" type="button">◯ Select all (0)</button><button id="rdRestoreSel" type="button" disabled>↶ Restore selected</button></div></div>
<div id="rdOverlay" class="rd-overlay" aria-hidden="true"><div class="rd-sheet" role="dialog" aria-modal="true" aria-labelledby="rdSheetTitle"><h3 id="rdSheetTitle"></h3><p id="rdSheetText"></p><div id="rdSheetActions" class="rd-sheet-actions"></div></div></div>
</body></html>
