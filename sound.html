<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sound · Freeupper</title>
    <link rel="icon" type="image/png" sizes="32x32" href="freeupper.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="freeupper.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="freeupper.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="freeupper.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Freeupper" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="description" content="Listen and discover videos using this sound on Freeupper." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Freeupper" />
    <meta property="og:title" content="Freeupper Sound" />
    <meta property="og:description" content="Listen and discover videos using this sound on Freeupper." />
    <link rel="stylesheet" href="global.css" />

    <!-- ===== SHARED NAV STYLES ===== -->
    <link rel="stylesheet" href="bottom-nav.css" />
    <link rel="stylesheet" href="side-nav.css" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="global.js"></script>
    <script src="auth.js"></script>
    <script src="posts.js"></script>
    <script src="sounds.js"></script>
    <script src="router.js"></script>

    <style>
        :root {
            --bg: #000;
            --surface: rgba(255, 255, 255, .08);
            --brd: rgba(255, 255, 255, .1);
            --text: #fff;
            --muted: rgba(255, 255, 255, .6);
            --muted2: rgba(255, 255, 255, .35);
            --accent: #1d9bf0;
            --red: #ff2d2d;
            --gold: #ffd700;
            --sheet-bg: #111;
            --sheet-bd: #2a2a2a;
            --inp-bg: #1a1a1a;
            --p: #8b5cf6;
            --pd: #6c3fc5;
            --pdim: rgba(139, 92, 246, .15);
            --pbrd: rgba(139, 92, 246, .28);
            --navbg: rgba(0, 0, 0, .97);
            --sidebg: #0a0a0a;
            --bg4: #2a2a2a;
            --rowh: rgba(255, 255, 255, .06);
            --nav-h: 78px;
            --card-bg: #fff;
            --card-text: #0d0d0d;
            --card-muted: rgba(0, 0, 0, .55);
        }
        [data-theme="light"] {
            --bg: #f5f5f7;
            --surface: rgba(0, 0, 0, .06);
            --brd: rgba(0, 0, 0, .1);
            --text: #0d0d0d;
            --muted: rgba(0, 0, 0, .55);
            --muted2: rgba(0, 0, 0, .35);
            --sheet-bg: #fff;
            --sheet-bd: #e5e7eb;
            --inp-bg: #f5f5f5;
            --navbg: rgba(242, 242, 247, .97);
            --sidebg: #fff;
            --bg4: #e5e7eb;
            --rowh: rgba(0, 0, 0, .05);
            --card-bg: #fff;
            --card-text: #0d0d0d;
            --card-muted: rgba(0, 0, 0, .55);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overscroll-behavior: none;
            transition: background .3s, color .3s;
        }

        .main {
            width: 100%;
            min-height: 100vh;
            padding-bottom: calc(var(--nav-h) + 90px);
        }

        /* ── TOP BAR ── */
        .sound-topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: max(env(safe-area-inset-top), 14px) 16px 12px;
            background: var(--bg);
        }
        .sb-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text);
            transition: background .15s, transform .12s;
            -webkit-tap-highlight-color: transparent;
        }
        .sb-btn:active { transform: scale(.9); background: var(--rowh); }
        .sb-btn svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .sb-right { display: flex; align-items: center; gap: 4px; }

        /* ── SOUND HEADER ── */
        .sound-hero {
            display: flex;
            gap: 18px;
            padding: 4px 20px 20px;
        }
        .sound-art-wrap {
            position: relative;
            width: 108px;
            height: 108px;
            flex-shrink: 0;
            border-radius: 14px;
            overflow: hidden;
            background: var(--bg4);
            cursor: pointer;
        }
        .sound-art-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .sound-art-play {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .28);
            transition: background .15s;
        }
        .sound-art-play svg { width: 30px; height: 30px; fill: #fff; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .4)); }
        .sound-art-wrap.playing .sound-art-play { background: rgba(0, 0, 0, .42); }
        .sound-art-wrap.playing .sound-art-play svg.icon-play { display: none; }
        .sound-art-wrap:not(.playing) .sound-art-play svg.icon-pause { display: none; }

        .sound-meta { flex: 1; min-width: 0; padding-top: 2px; }
        .sound-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.3px;
            line-height: 1.2;
            margin-bottom: 6px;
            word-break: break-word;
        }
        .sound-handle-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14.5px;
            font-weight: 700;
            color: var(--p);
            cursor: pointer;
            margin-bottom: 8px;
        }
        .sound-handle-row svg { width: 15px; height: 15px; flex-shrink: 0; }
        .sound-stat-line {
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
        }

        /* ── PILL ROW ── */
        .sound-pills {
            display: flex;
            gap: 8px;
            padding: 0 20px 16px;
            flex-wrap: wrap;
        }
        .sound-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 100px;
            background: var(--surface);
            border: 1px solid var(--brd);
            font-size: 12.5px;
            font-weight: 600;
            color: var(--muted);
        }
        .sound-pill svg { width: 13px; height: 13px; stroke: var(--muted); fill: none; stroke-width: 2; }

        /* ── CREATED BY ── */
        .created-by-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 20px 20px;
            cursor: pointer;
        }
        .created-by-ava {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg4);
        }
        .created-by-text { font-size: 13px; color: var(--muted); line-height: 1.4; }
        .created-by-text b { color: var(--text); font-weight: 700; }
        .created-by-date { font-size: 12px; color: var(--muted2); margin-top: 1px; }

        /* ── ACTION BUTTONS ── */
        .sound-actions {
            display: flex;
            gap: 10px;
            padding: 0 20px 18px;
        }
        .sound-use-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 100px;
            background: linear-gradient(135deg, var(--p), var(--pd));
            border: none;
            color: #fff;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: transform .12s, opacity .15s;
        }
        .sound-use-btn svg { width: 19px; height: 19px; fill: #fff; }
        .sound-use-btn:active { transform: scale(.97); }
        .sound-save-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 14px 20px;
            border-radius: 100px;
            background: var(--surface);
            border: 1px solid var(--brd);
            color: var(--text);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: transform .12s, background .15s;
        }
        .sound-save-btn svg { width: 17px; height: 17px; stroke: var(--text); fill: none; stroke-width: 2; }
        .sound-save-btn.saved { background: var(--pdim); border-color: var(--pbrd); color: var(--p); }
        .sound-save-btn.saved svg { stroke: var(--p); fill: var(--p); }
        .sound-save-btn:active { transform: scale(.95); }

        /* ── DESCRIPTION ── */
        .sound-desc {
            margin: 0 20px 20px;
            padding: 14px 16px;
            border-radius: 14px;
            background: var(--surface);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
        }
        .sound-desc-text {
            flex: 1;
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--muted);
        }
        .sound-desc-text.clamped {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .sound-desc-chevron {
            width: 18px;
            height: 18px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
            margin-top: 2px;
            transition: transform .2s;
        }
        .sound-desc.open .sound-desc-chevron { transform: rotate(180deg); }

        /* ── STATS GRID ── */
        .sound-stats {
            margin: 0 20px 22px;
            border: 1px solid var(--brd);
            border-radius: 16px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }
        .sound-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 16px 6px;
            border-right: 1px solid var(--brd);
        }
        .sound-stat:last-child { border-right: none; }
        .sound-stat svg { width: 19px; height: 19px; stroke: var(--p); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .sound-stat b { font-size: 16px; font-weight: 800; }
        .sound-stat span { font-size: 11.5px; color: var(--muted); font-weight: 600; }

        /* ── TABS ── */
        .sound-tabs {
            display: flex;
            border-bottom: 1px solid var(--brd);
            position: sticky;
            top: 62px;
            background: var(--bg);
            z-index: 20;
        }
        .sound-tab {
            flex: 1;
            text-align: center;
            padding: 14px 8px;
            background: none;
            border: none;
            font-size: 14.5px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            position: relative;
        }
        .sound-tab.active { color: var(--text); }
        .sound-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 3px;
            border-radius: 2px;
            background: var(--p);
        }

        /* ── VIDEO GRID ── */
        .sound-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding-top: 2px;
        }
        .sg-item {
            position: relative;
            aspect-ratio: 9 / 15.5;
            background: var(--bg4);
            overflow: hidden;
            cursor: pointer;
        }
        .sg-item img, .sg-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .sg-pin {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 3px 9px;
            border-radius: 100px;
            background: rgba(139, 92, 246, .9);
            color: #fff;
            font-size: 10.5px;
            font-weight: 800;
            z-index: 2;
        }
        .sg-play-count {
            position: absolute;
            bottom: 8px;
            left: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 6px rgba(0, 0, 0, .7);
            z-index: 2;
        }
        .sg-play-count svg { width: 12px; height: 12px; fill: #fff; }
        .sg-grad {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, .55) 0%, transparent 40%);
            z-index: 1;
        }

        /* ── ABOUT TAB ── */
        .about-panel { padding: 18px 20px 30px; display: none; }
        .about-panel.active { display: block; }
        .about-row {
            display: flex;
            justify-content: space-between;
            padding: 13px 0;
            border-bottom: 1px solid var(--brd);
            font-size: 14px;
        }
        .about-row:last-child { border-bottom: none; }
        .about-row span:first-child { color: var(--muted); }
        .about-row span:last-child { font-weight: 700; }

        /* ── EMPTY STATE ── */
        .sound-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 60px 30px;
            color: var(--muted);
        }
        .sound-empty svg { width: 44px; height: 44px; stroke: var(--muted2); fill: none; stroke-width: 1.5; margin-bottom: 14px; }
        .sound-empty p { font-size: 14px; line-height: 1.6; }

        .sound-skel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding-top: 2px; }
        .sound-skel-item { aspect-ratio: 9/15.5; background: linear-gradient(100deg, var(--bg4) 30%, var(--surface) 50%, var(--bg4) 70%); background-size: 200% 100%; animation: soundShimmer 1.6s ease-in-out infinite; }
        @keyframes soundShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* ── MINI AUDIO PLAYER BAR ── */
        .mini-player {
            position: fixed;
            left: 0;
            right: 0;
            bottom: var(--nav-h);
            z-index: 60;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--sheet-bg);
            border-top: 1px solid var(--sheet-bd);
            transform: translateY(120%);
            transition: transform .3s cubic-bezier(.4, 0, .2, 1);
        }
        .mini-player.show { transform: translateY(0); }
        .mp-art { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; background: var(--bg4); flex-shrink: 0; }
        .mp-meta { flex: 1; min-width: 0; }
        .mp-title { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mp-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mp-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .mp-btn svg { width: 16px; height: 16px; stroke: var(--text); fill: var(--text); }
        .mp-btn.close svg { fill: none; stroke: var(--muted); stroke-width: 2.2; }

        #toast {
            position: fixed;
            bottom: calc(var(--nav-h) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30, 30, 30, .95);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, .12);
            z-index: 400;
            opacity: 0;
            transition: opacity .25s, transform .25s;
            white-space: nowrap;
            pointer-events: none;
            backdrop-filter: blur(12px);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (min-width: 768px) {
            .sound-grid { grid-template-columns: repeat(4, 1fr); gap: 4px; }
            .sound-skel-grid { grid-template-columns: repeat(4, 1fr); gap: 4px; }
            .mini-player { bottom: 0; }
        }
    </style>
</head>
<body>

    <!-- ════ SIDE NAV (shared) ════ -->
    <side-nav show-chat></side-nav>

    <!-- ════ MAIN ════ -->
    <div class="main" id="mainScroll">

        <div class="sound-topbar">
            <button class="sb-btn" onclick="goBack()">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="sb-right">
                <button class="sb-btn" onclick="shareSoundPage()">
                    <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
                <button class="sb-btn" onclick="showToast('More options coming soon')">
                    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="6" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="18" r="1.8"/></svg>
                </button>
            </div>
        </div>

        <div id="soundContent">
            <!-- populated by JS -->
        </div>

    </div>

    <!-- ════ MINI PLAYER ════ -->
    <div class="mini-player" id="miniPlayer">
        <img class="mp-art" id="mpArt" src="" alt="">
        <div class="mp-meta">
            <div class="mp-title" id="mpTitle">Original sound</div>
            <div class="mp-sub" id="mpSub">@creator</div>
        </div>
        <button class="mp-btn" id="mpToggle" onclick="toggleAudioPlayback()">
            <svg id="mpToggleIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="mp-btn close" onclick="stopAudioPlayback()">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>

    <!-- ════ BOTTOM NAV (shared) ════ -->
    <bottom-nav></bottom-nav>

    <!-- ════ TOAST ════ -->
    <div id="toast"></div>

    <audio id="soundAudio" preload="none"></audio>

    <!-- ===== SHARED NAV SCRIPTS ===== -->
    <script src="bottom-nav.js" defer></script>
    <script src="side-nav.js" defer></script>

    <script>
        'use strict';

        if (!window.SoundsAPI) {
            console.error('sound.html: SoundsAPI missing. Ensure sounds.js loads before this script.');
        }

        const SITE_URL = window.location.origin;
        let _toastTimer = null;
        let currentTab = 'videos';
        let soundData = null;      // mapped by SoundsAPI (camelCase fields)
        let soundStats = null;     // { videoCount, totalUses, totalLikes, totalShares }
        let soundVideos = [];
        let isSaved = false;
        let isPlaying = false;

        // ─── HELPERS ──────────────────────────────────────────────

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
        }

        function fmtNum(n) {
            n = n || 0;
            if (n >= 1000000000) return (n / 1000000000).toFixed(1).replace(/\.0$/, '') + 'B';
            if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
            return String(n);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d)) return '';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function getCurrentUser() {
            if (window.AuthUser && typeof window.AuthUser.getCurrentUser === 'function') {
                return window.AuthUser.getCurrentUser();
            }
            if (typeof window.getCurrentUser === 'function') {
                return window.getCurrentUser();
            }
            return { id: 'guest', isLoggedIn: false, displayName: 'Guest', avatar: '' };
        }

        function goBack() {
            if (window.Router && typeof window.Router.back === 'function') {
                window.Router.back();
            } else if (document.referrer) {
                window.history.back();
            } else {
                window.location.href = 'video.html';
            }
        }

        function goToProfile(userId) {
            if (!userId) return;
            if (window.Router && typeof window.Router.openProfile === 'function') {
                window.Router.openProfile(userId);
            } else {
                window.location.href = 'profile.html?id=' + encodeURIComponent(userId);
            }
        }

        function openVideoPost(postId) {
            if (window.Router && typeof window.Router.openVideo === 'function') {
                window.Router.openVideo(postId);
            } else {
                window.location.href = 'video.html?post=' + encodeURIComponent(postId);
            }
        }

        function useThisSound() {
            if (!soundData) return;
            window.location.href = 'studio.html?sound=' + encodeURIComponent(soundData.id);
        }

        // ─── LOAD SOUND + VIDEOS (via SoundsAPI) ───────────────────

        async function loadSoundPage(soundId) {
            renderSkeleton();
            try {
                const [sound, videos, stats] = await Promise.all([
                    SoundsAPI.loadSound(soundId),
                    SoundsAPI.loadSoundVideos(soundId),
                    SoundsAPI.loadSoundStats(soundId),
                ]);

                if (!sound) {
                    renderEmpty();
                    return;
                }

                soundData = sound;
                soundVideos = videos;
                soundStats = stats;

                isSaved = await SoundsAPI.isSoundSaved(soundId);

                renderSoundPage();

                // Fire-and-forget usage increment on view (not on every reload spam —
                // acceptable here since sound.html is a discrete page visit).
                SoundsAPI.incrementSoundUsage(soundId).catch(() => {});
            } catch (err) {
                console.error('loadSoundPage error:', err);
                renderEmpty();
            }
        }

        // ─── RENDER ─────────────────────────────────────────────────

        function renderSkeleton() {
            const el = document.getElementById('soundContent');
            el.innerHTML = `
                <div class="sound-hero">
                    <div class="sound-art-wrap" style="background:var(--bg4)"></div>
                    <div class="sound-meta">
                        <div class="sound-title" style="opacity:.4">Loading sound…</div>
                    </div>
                </div>
                <div class="sound-skel-grid">
                    ${Array.from({ length: 9 }).map(() => '<div class="sound-skel-item"></div>').join('')}
                </div>
            `;
        }

        function renderEmpty() {
            const el = document.getElementById('soundContent');
            el.innerHTML = `
                <div class="sound-empty">
                    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    <p>This sound couldn't be found, or hasn't been used in any videos yet.</p>
                </div>
            `;
        }

        function renderSoundPage() {
            const s = soundData;
            const stats = soundStats || { videoCount: 0, totalUses: 0, totalLikes: 0, totalShares: 0 };
            const el = document.getElementById('soundContent');

            const authorName = s.creator ? s.creator.displayName : 'Unknown';
            const authorHandle = s.creator ? ('@' + (s.creator.username || authorName.toLowerCase().replace(/\s+/g, ''))) : '@unknown';
            const authorAvatar = s.creator ? s.creator.avatarUrl : '';
            const authorId = s.creator ? s.creator.id : null;
            const badgeHtml = window.getVerifiedBadgeHTML ? window.getVerifiedBadgeHTML(s.creator ? s.creator.verifiedStatus : 'none') : '';

            el.innerHTML = `
                <div class="sound-hero">
                    <div class="sound-art-wrap" id="soundArtWrap" onclick="toggleAudioPlayback()">
                        <img src="${s.artUrl}" alt="${escapeHtml(s.title)}"
                             onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(authorName)}'">
                        <div class="sound-art-play">
                            <svg class="icon-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                        </div>
                    </div>
                    <div class="sound-meta">
                        <div class="sound-title">${escapeHtml(s.title)}</div>
                        <div class="sound-handle-row" onclick="${authorId ? `goToProfile('${authorId}')` : ''}">
                            <span>${escapeHtml(authorHandle)}</span>
                            <span>${badgeHtml}</span>
                        </div>
                        <div class="sound-stat-line">${fmtNum(stats.videoCount)} videos&nbsp;&nbsp;·&nbsp;&nbsp;${fmtNum(stats.totalUses)} uses</div>
                    </div>
                </div>

                <div class="sound-pills">
                    ${s.duration ? `
                    <div class="sound-pill">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        ${escapeHtml(String(s.duration))}
                    </div>` : ''}
                    ${s.bpm ? `
                    <div class="sound-pill">
                        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                        ${escapeHtml(String(s.bpm))} BPM
                    </div>` : ''}
                </div>

                <div class="created-by-row" onclick="${authorId ? `goToProfile('${authorId}')` : ''}">
                    <img class="created-by-ava" src="${authorAvatar}" alt="${escapeHtml(authorName)}"
                         onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(authorName)}'">
                    <div>
                        <div class="created-by-text">Created by <b>${escapeHtml(authorHandle)}</b></div>
                        ${s.createdAt ? `<div class="created-by-date">${formatDate(s.createdAt)}</div>` : ''}
                    </div>
                </div>

                <div class="sound-actions">
                    <button class="sound-use-btn" onclick="useThisSound()">
                        <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                        Use this sound
                    </button>
                    <button class="sound-save-btn ${isSaved ? 'saved' : ''}" id="saveSoundBtn" onclick="toggleSaveSound()">
                        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                        <span id="saveSoundLbl">${isSaved ? 'Saved' : 'Save'}</span>
                    </button>
                </div>

                <div class="sound-desc" id="soundDesc" onclick="toggleDescExpand()">
                    <div class="sound-desc-text clamped" id="soundDescText">
                        This is the original sound created by ${escapeHtml(authorHandle)}. Feel free to use it in your videos 🔥
                    </div>
                    <svg class="sound-desc-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </div>

                <div class="sound-stats">
                    <div class="sound-stat">
                        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        <b>${fmtNum(stats.totalUses)}</b>
                        <span>Uses</span>
                    </div>
                    <div class="sound-stat">
                        <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                        <b>${fmtNum(stats.videoCount)}</b>
                        <span>Videos</span>
                    </div>
                    <div class="sound-stat">
                        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        <b>${fmtNum(stats.totalLikes)}</b>
                        <span>Likes</span>
                    </div>
                    <div class="sound-stat">
                        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        <b>${fmtNum(stats.totalShares)}</b>
                        <span>Shares</span>
                    </div>
                </div>

                <div class="sound-tabs">
                    <button class="sound-tab ${currentTab === 'videos' ? 'active' : ''}" data-tab="videos" onclick="switchSoundTab('videos')">Videos</button>
                    <button class="sound-tab ${currentTab === 'about' ? 'active' : ''}" data-tab="about" onclick="switchSoundTab('about')">About this sound</button>
                </div>

                <div class="sound-grid" id="soundGrid"></div>

                <div class="about-panel" id="aboutPanel">
                    <div class="about-row"><span>Sound title</span><span>${escapeHtml(s.title)}</span></div>
                    <div class="about-row"><span>Creator</span><span>${escapeHtml(authorHandle)}</span></div>
                    ${s.createdAt ? `<div class="about-row"><span>Created</span><span>${formatDate(s.createdAt)}</span></div>` : ''}
                    ${s.duration ? `<div class="about-row"><span>Duration</span><span>${escapeHtml(String(s.duration))}</span></div>` : ''}
                    ${s.bpm ? `<div class="about-row"><span>Tempo</span><span>${escapeHtml(String(s.bpm))} BPM</span></div>` : ''}
                    <div class="about-row"><span>Total videos</span><span>${fmtNum(stats.videoCount)}</span></div>
                    <div class="about-row"><span>Total uses</span><span>${fmtNum(stats.totalUses)}</span></div>
                </div>
            `;

            renderSoundGrid();

            const mpArt = document.getElementById('mpArt');
            const mpTitle = document.getElementById('mpTitle');
            const mpSub = document.getElementById('mpSub');
            if (mpArt) mpArt.src = s.artUrl;
            if (mpTitle) mpTitle.textContent = s.title;
            if (mpSub) mpSub.textContent = authorHandle;
        }

        function renderSoundGrid() {
            const grid = document.getElementById('soundGrid');
            if (!grid) return;
            if (!soundVideos.length) {
                grid.innerHTML = '';
                return;
            }
            grid.innerHTML = soundVideos.map(v => `
                <div class="sg-item" onclick="openVideoPost('${v.id}')">
                    ${v.pinned ? '<div class="sg-pin">Pinned</div>' : ''}
                    <div class="sg-grad"></div>
                    <img src="${v.mediaUrl}" alt="" loading="lazy"
                         onerror="this.style.display='none'">
                    <div class="sg-play-count">
                        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        ${fmtNum(v.views)}
                    </div>
                </div>
            `).join('');
        }

        function switchSoundTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.sound-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            document.getElementById('soundGrid').style.display = tab === 'videos' ? 'grid' : 'none';
            document.getElementById('aboutPanel').classList.toggle('active', tab === 'about');
        }

        function toggleDescExpand() {
            const desc = document.getElementById('soundDesc');
            const text = document.getElementById('soundDescText');
            if (!desc || !text) return;
            desc.classList.toggle('open');
            text.classList.toggle('clamped');
        }

        // ─── ACTIONS ────────────────────────────────────────────────

        async function toggleSaveSound() {
            const user = getCurrentUser();
            if (!user || !user.isLoggedIn) { showToast('Please sign in to save sounds'); return; }
            const btn = document.getElementById('saveSoundBtn');
            const lbl = document.getElementById('saveSoundLbl');
            const wasSaved = isSaved;
            isSaved = !wasSaved;
            if (btn) btn.classList.toggle('saved', isSaved);
            if (lbl) lbl.textContent = isSaved ? 'Saved' : 'Save';

            try {
                if (wasSaved) {
                    await SoundsAPI.unsaveSound(soundData.id);
                    showToast('Removed from saved sounds');
                } else {
                    await SoundsAPI.saveSound(soundData.id);
                    showToast('Sound saved ✓');
                }
            } catch (err) {
                isSaved = wasSaved;
                if (btn) btn.classList.toggle('saved', isSaved);
                if (lbl) lbl.textContent = isSaved ? 'Saved' : 'Save';
                showToast(err.message || 'Could not save sound');
            }
        }

        function shareSoundPage() {
            if (!soundData) return;
            const url = SITE_URL + '/sound.html?id=' + encodeURIComponent(soundData.id);
            const authorHandle = soundData.creator ? ('@' + (soundData.creator.username || soundData.creator.displayName)) : '';
            const title = soundData.title + (authorHandle ? ' — ' + authorHandle : '');
            if (navigator.share) {
                navigator.share({ title, url }).catch(() => {});
                return;
            }
            navigator.clipboard.writeText(url).then(() => showToast('Link copied 🔗')).catch(() => showToast('Could not copy link'));
        }

        // ─── AUDIO PLAYBACK ─────────────────────────────────────────

        const audioEl = document.getElementById('soundAudio');

        function toggleAudioPlayback() {
            if (!soundData) return;
            if (!soundData.audioUrl) {
                showToast('Preview not available for this sound');
                return;
            }
            if (audioEl.src !== soundData.audioUrl) {
                audioEl.src = soundData.audioUrl;
            }
            if (isPlaying) {
                audioEl.pause();
            } else {
                audioEl.play().catch(() => showToast('Could not play sound'));
            }
        }

        function stopAudioPlayback() {
            audioEl.pause();
            audioEl.currentTime = 0;
        }

        audioEl.addEventListener('play', () => {
            isPlaying = true;
            document.getElementById('miniPlayer').classList.add('show');
            const wrap = document.getElementById('soundArtWrap');
            if (wrap) wrap.classList.add('playing');
            const icon = document.getElementById('mpToggleIcon');
            if (icon) icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        });
        audioEl.addEventListener('pause', () => {
            isPlaying = false;
            const wrap = document.getElementById('soundArtWrap');
            if (wrap) wrap.classList.remove('playing');
            const icon = document.getElementById('mpToggleIcon');
            if (icon) icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        });
        audioEl.addEventListener('ended', () => {
            document.getElementById('miniPlayer').classList.remove('show');
        });

        // ─── INIT ──────────────────────────────────────────────────

        async function init() {
            document.addEventListener('themeChanged', function(e) {
                document.documentElement.setAttribute('data-theme', e.detail.theme);
            });

            function updateNavAvatar() {
                const user = getCurrentUser();
                document.querySelectorAll('.side-av, .nav-av').forEach(el => {
                    el.src = user.avatar;
                    el.onerror = function() { this.style.display = 'none'; };
                });
            }
            updateNavAvatar();

            if (!window.SoundsAPI) {
                renderEmpty();
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const soundId = params.get('id');
            if (!soundId) {
                renderEmpty();
                return;
            }
            await loadSoundPage(soundId);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // ─── EXPOSE GLOBALLY ────────────────────────────────────────
        window.goBack = goBack;
        window.goToProfile = goToProfile;
        window.openVideoPost = openVideoPost;
        window.switchSoundTab = switchSoundTab;
        window.toggleDescExpand = toggleDescExpand;
        window.useThisSound = useThisSound;
        window.toggleSaveSound = toggleSaveSound;
        window.shareSoundPage = shareSoundPage;
        window.toggleAudioPlayback = toggleAudioPlayback;
        window.stopAudioPlayback = stopAudioPlayback;
        window.showToast = showToast;
    </script>
</body>
</html>
