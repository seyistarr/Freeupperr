<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Studio · Freeupper</title>
<link rel="icon" type="image/png" sizes="32x32" href="freeupper.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#7C3AED" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="global.js"></script>
<script src="auth.js"></script>
<script src="posts.js"></script>
<script src="mentions.js"></script>
<script src="sounds.js"></script>

<style>
:root{
  --p:#8b5cf6; --pd:#6c3fc5; --pdim:rgba(139,92,246,.15); --pbrd:rgba(139,92,246,.28);
  --red:#fe2c55; --text:#fff; --muted:rgba(255,255,255,.55); --muted2:rgba(255,255,255,.3);
  --sheet-bg:#111; --sheet-bd:#262626; --inp-bg:#1a1a1a; --brd:rgba(255,255,255,.1);
  --font-head:'Outfit',sans-serif; --font-body:'Plus Jakarta Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;color:var(--text);font-family:var(--font-body);
  overflow:hidden;overscroll-behavior:none}
button{font-family:var(--font-head);border:none;cursor:pointer;background:none;color:inherit}
input,textarea{font-family:var(--font-body);outline:none;border:none;background:none;color:inherit}
::-webkit-scrollbar{display:none}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;transform:translateY(10px);z-index:10}
.screen.active{opacity:1;pointer-events:all;transform:translateY(0);z-index:20}

/* ═══ CAPTURE SCREEN ═══ */
#scCapture{background:#000}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camCanvas{display:none}
.cap-denied{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:40px;text-align:center;background:#000;z-index:6}
.cap-denied h2{font-family:var(--font-head);font-size:1.15rem;font-weight:800}
.cap-denied p{font-size:.84rem;color:var(--muted);line-height:1.6;max-width:260px}
.cap-denied-btn{padding:12px 26px;border-radius:100px;background:var(--red);color:#fff;
  font-family:var(--font-head);font-weight:700;font-size:.85rem;box-shadow:0 4px 18px rgba(254,44,85,.35)}

.cap-top{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;
  justify-content:space-between;padding:max(env(safe-area-inset-top),14px) 16px 10px;
  background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent)}
.cap-icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);
  border:1.5px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
  color:#fff;flex-shrink:0;transition:background .15s}
.cap-icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.cap-icon-btn:active{background:rgba(255,255,255,.2)}

/* Add music pill — center of header, exactly like original cam-music-pill */
.cap-music-pill{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:100px;
  background:rgba(0,0,0,.45);backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.22);
  color:#fff;font-family:var(--font-head);font-size:.76rem;font-weight:700;letter-spacing:.02em;
  white-space:nowrap;max-width:170px;overflow:hidden;transition:all .2s;cursor:pointer;flex-shrink:0}
.cap-music-pill.attached{border-color:rgba(139,92,246,.6);background:rgba(139,92,246,.18)}
.cap-music-pill svg{flex-shrink:0;width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
.cap-music-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cap-timer{position:absolute;top:66px;left:50%;transform:translateX(-50%);z-index:35;
  background:rgba(254,44,85,.9);border-radius:100px;padding:5px 16px;font-family:var(--font-head);
  font-weight:800;font-size:.92rem;opacity:0;transition:opacity .2s;font-variant-numeric:tabular-nums}
.cap-timer.show{opacity:1}

/* Right vertical toolbar */
.cap-right-toolbar{position:absolute;right:10px;top:50%;transform:translateY(-58%);z-index:35;
  display:flex;flex-direction:column;align-items:center;gap:18px}
.cap-tool{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.cap-tool-icon{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.4);
  border:1.5px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;
  color:#fff;transition:all .18s;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.cap-tool-icon.on{background:rgba(139,92,246,.35);border-color:var(--p);color:var(--p)}
.cap-tool-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.cap-tool-lbl{font-family:var(--font-head);font-size:.6rem;font-weight:700;color:rgba(255,255,255,.75);
  text-shadow:0 1px 4px rgba(0,0,0,.7)}

.mini-panel{position:absolute;right:64px;top:50%;transform:translateY(-50%);
  background:rgba(10,10,12,.92);backdrop-filter:blur(18px);border:1px solid var(--brd);
  border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px;z-index:45;
  opacity:0;pointer-events:none;transition:opacity .2s;min-width:110px}
.mini-panel.show{opacity:1;pointer-events:all}
.mini-opt{padding:8px 12px;border-radius:9px;font-family:var(--font-head);font-size:.74rem;
  font-weight:600;color:rgba(255,255,255,.65);cursor:pointer;text-align:center}
.mini-opt.on,.mini-opt:hover{background:rgba(139,92,246,.2);color:#fff}

.cap-bottom{position:absolute;bottom:0;left:0;right:0;z-index:30;padding:0 0 max(26px,env(safe-area-inset-bottom))}
.cap-modes{display:flex;justify-content:center;gap:2px;padding:0 20px 16px}
.cap-mode{padding:6px 16px;font-family:var(--font-head);font-size:.78rem;font-weight:700;
  letter-spacing:.03em;color:rgba(255,255,255,.5);border-radius:100px;transition:all .2s}
.cap-mode.on{color:#161823;background:#fff}

.cap-record-row{display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.gallery-trigger{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.1);
  border:1.5px solid rgba(255,255,255,.2);overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.gallery-trigger img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gallery-trigger input{position:absolute;inset:0;opacity:0;cursor:pointer}
.gallery-trigger svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}

.record-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.record-ring{position:absolute;width:92px;height:92px;border-radius:50%;
  border:3px solid rgba(255,255,255,.3);transition:border-color .25s}
.record-ring.pulsing{border-color:var(--red);animation:recPulse 1.2s infinite}
@keyframes recPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06);border-color:rgba(254,44,85,.5)}}
.record-btn{width:76px;height:76px;border-radius:50%;background:#fff;display:flex;
  align-items:center;justify-content:center;position:relative;z-index:3;touch-action:none;
  transition:transform .18s}
.record-btn:active{transform:scale(.92)}
.record-btn.photo-mode{border:4px solid rgba(255,255,255,.5)}
.record-core{width:56px;height:56px;border-radius:50%;background:var(--red);transition:all .2s}
.record-btn.photo-mode .record-core{opacity:0;width:0;height:0}
.record-btn.recording .record-core{border-radius:8px;width:26px;height:26px;background:#fff}

.flip-btn{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.5);
  border:1.5px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
  color:#fff;flex-shrink:0}
.flip-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

/* ═══ PREVIEW SCREEN ═══ */
#scPreview{background:#000}
.pv-media{position:absolute;inset:0;background:#000}
.pv-media video,.pv-media img{width:100%;height:100%;object-fit:contain;display:block}
.pv-top{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;
  justify-content:space-between;padding:max(env(safe-area-inset-top),14px) 16px 10px;
  background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent)}
.pv-text-layer{position:absolute;inset:0;z-index:15}
.pv-text-item{position:absolute;cursor:move;font-family:var(--font-head);font-weight:800;
  font-size:1.5rem;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);padding:4px 10px;
  border-radius:8px;user-select:none;touch-action:none;max-width:82%;word-wrap:break-word}
.pv-add-text-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:12;
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center}
.pv-add-text-hint .circ{width:52px;height:52px;border-radius:50%;border:2px dashed rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.pv-add-text-hint .circ svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2}
.pv-add-text-hint span{font-family:var(--font-head);font-size:.85rem;font-weight:700;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.8)}

.pv-bottom{position:absolute;bottom:0;left:0;right:0;z-index:30;
  padding:16px 18px max(26px,env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(0,0,0,.6),transparent)}
.pv-next-btn{width:100%;padding:15px;border-radius:100px;background:#fff;color:#161823;
  font-family:var(--font-head);font-size:.92rem;font-weight:900;display:flex;align-items:center;
  justify-content:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.4)}

/* Text input overlay for preview */
.pv-txt-input-wrap{display:none;position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);
  z-index:9700;min-width:260px;max-width:88vw;text-align:center}
.pv-txt-input{background:none;border:none;outline:none;resize:none;font-family:var(--font-head);
  font-weight:800;font-size:28px;color:#fff;text-align:center;width:100%;line-height:1.3;
  text-shadow:0 2px 14px rgba(0,0,0,.85);caret-color:var(--p);min-height:40px}
.pv-txt-bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:9600;
  background:rgba(8,8,10,.95);backdrop-filter:blur(20px);padding:14px 16px max(22px,env(safe-area-inset-bottom));
  border-top:1px solid var(--brd);flex-direction:column;gap:10px}
.pv-txt-colors{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pv-txt-color{width:26px;height:26px;border-radius:50%;flex-shrink:0;cursor:pointer;
  border:2.5px solid transparent;transition:transform .15s}
.pv-txt-color.on{border-color:#fff;transform:scale(1.2)}
.pv-txt-actions{display:flex;justify-content:space-between;align-items:center}
.pv-txt-cancel,.pv-txt-done{font-family:var(--font-head);font-size:.82rem;font-weight:800;
  padding:8px 6px}
.pv-txt-cancel{color:rgba(255,255,255,.5)}
.pv-txt-done{color:var(--p)}

/* ═══ TEXT CARD FLOW ═══ */
#scTextWrite{background:#fff;color-scheme:light}
.txw-header{display:flex;align-items:center;justify-content:space-between;
  padding:max(18px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid rgba(0,0,0,.06)}
.txw-title{font-family:var(--font-head);font-size:.95rem;font-weight:800;color:#161823}
.txw-back{width:38px;height:38px;border-radius:50%;background:none;color:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center}
.txw-back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
.txw-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 32px;gap:14px;cursor:text}
.txw-ph{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.txw-ph-emoji{font-size:2.2rem}
.txw-ph-line{font-family:var(--font-head);font-size:.85rem;font-weight:600;color:#bbb;text-align:center}
.txw-input{width:100%;max-width:360px;min-height:60px;font-family:var(--font-head);font-size:1.8rem;
  font-weight:900;color:#111;text-align:center;line-height:1.25;outline:none;word-break:break-word;
  white-space:pre-wrap;caret-color:var(--red)}
.txw-input:empty::before{content:attr(data-ph);color:rgba(0,0,0,.18);font-weight:600;font-size:1rem}
.txw-count{text-align:center;font-size:.72rem;color:#ccc;padding-bottom:8px}
.txw-bottom{padding:12px 20px max(28px,env(safe-area-inset-bottom));border-top:1px solid rgba(0,0,0,.06)}
.txw-next{width:100%;height:54px;border-radius:100px;background:var(--red);font-family:var(--font-head);
  font-size:.95rem;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;
  gap:8px;box-shadow:0 4px 22px rgba(254,44,85,.4);transition:opacity .2s}
.txw-next:disabled{opacity:.28}

#scTextStyle{background:#0e0e13}
.txs-header{display:flex;align-items:center;justify-content:space-between;
  padding:max(16px,env(safe-area-inset-top)) 16px 12px}
.txs-back{width:38px;height:38px;border-radius:50%;background:none;color:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center}
.txs-back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5}
.txs-title{font-family:var(--font-head);font-size:.95rem;font-weight:800;color:#fff}
.txs-preview-wrap{display:flex;justify-content:center;padding:10px 20px 10px}
.txs-card{width:200px;aspect-ratio:9/16;border-radius:18px;overflow:hidden;position:relative;
  box-shadow:0 16px 46px rgba(0,0,0,.6)}
.txs-card canvas{position:absolute;inset:0;width:100%;height:100%}
.txs-card-text-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:18px;z-index:2}
.txs-card-text{font-family:var(--font-head);font-size:clamp(.9rem,3.4vw,1.2rem);font-weight:900;
  text-align:center;line-height:1.28;word-break:break-word}
.txs-cats{display:flex;gap:0;overflow-x:auto;padding:10px 16px 0;border-bottom:1px solid var(--brd)}
.txs-cat{flex-shrink:0;padding:8px 14px;font-family:var(--font-head);font-size:.72rem;font-weight:700;
  color:rgba(255,255,255,.4);position:relative;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.txs-cat.on{color:#fff}
.txs-cat.on::after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:2px;
  background:var(--red);border-radius:2px}
.txs-row{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 14px}
.txs-tpl{flex-shrink:0;width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.txs-tpl-thumb{width:70px;height:94px;border-radius:13px;overflow:hidden;border:2.5px solid rgba(255,255,255,.08);
  position:relative;transition:all .18s}
.txs-tpl.on .txs-tpl-thumb{border-color:var(--red);box-shadow:0 0 0 2px rgba(254,44,85,.45);transform:scale(1.05)}
.txs-tpl-thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.txs-tpl-name{font-family:var(--font-head);font-size:.58rem;font-weight:700;color:rgba(255,255,255,.6)}
.txs-post-row{padding:12px 16px max(28px,env(safe-area-inset-bottom));border-top:1px solid var(--brd);
  display:flex;gap:10px}
.txs-post-btn{flex:1;height:54px;border-radius:100px;background:var(--red);color:#fff;
  font-family:var(--font-head);font-size:.9rem;font-weight:800;display:flex;align-items:center;
  justify-content:center;gap:7px;box-shadow:0 4px 24px rgba(254,44,85,.5)}

/* ═══ POST / DETAILS SCREEN ═══ */
#scPost{background:#000}
.det-top{display:flex;align-items:center;justify-content:space-between;
  padding:max(env(safe-area-inset-top),14px) 16px 12px;border-bottom:1px solid var(--brd);flex-shrink:0}
.det-title{font-family:var(--font-head);font-size:1rem;font-weight:800}
.det-body{flex:1;overflow-y:auto;padding:16px}

.det-preview-row{display:flex;gap:14px;margin-bottom:20px}
.det-thumb{width:78px;height:104px;border-radius:12px;overflow:hidden;background:var(--inp-bg);
  flex-shrink:0;position:relative}
.det-thumb img,.det-thumb video,.det-thumb canvas{width:100%;height:100%;object-fit:cover}
.det-caption-col{flex:1;display:flex;flex-direction:column}
.det-caption{width:100%;min-height:104px;resize:none;color:var(--text);font-size:.9rem;line-height:1.55}
.det-caption::placeholder{color:var(--muted2)}
.det-char-count{font-size:.68rem;color:var(--muted2);text-align:right}

.sound-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
  background:var(--pdim);border:1.5px solid var(--pbrd);margin-bottom:16px;cursor:pointer}
.sound-banner-art{width:38px;height:38px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--inp-bg)}
.sound-banner-meta{flex:1;min-width:0}
.sound-banner-title{font-size:.83rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sound-banner-sub{font-size:.72rem;color:var(--muted);margin-top:1px}
.sound-banner-x{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sound-banner-x svg{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2.4}
.add-sound-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;
  border-radius:14px;border:1.5px dashed var(--pbrd);color:var(--p);font-weight:700;font-size:.85rem;
  margin-bottom:16px;cursor:pointer}
.add-sound-row svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}

.tag-section{margin-bottom:16px}
.tag-lbl{font-family:var(--font-head);font-size:.68rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.tag-pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.tag-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 14px;border-radius:100px;
  background:var(--pdim);border:1.5px solid var(--pbrd);color:var(--p);font-size:.74rem;font-weight:700}
.tag-pill button{color:var(--p);font-size:.9rem}
.tag-input-row{display:flex;gap:8px}
.tag-input-row input{flex:1;padding:10px 14px;border-radius:12px;border:1.5px solid var(--brd);
  background:var(--inp-bg);font-size:.82rem}
.tag-input-row button{padding:10px 16px;border-radius:12px;background:var(--pdim);
  border:1.5px solid var(--pbrd);color:var(--p);font-weight:700;font-size:.78rem;white-space:nowrap}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0;border-top:1px solid var(--brd)}
.toggle-row-title{font-size:.85rem;font-weight:700}
.toggle-row-sub{font-size:.72rem;color:var(--muted);margin-top:2px;max-width:230px;line-height:1.4}
.toggle{position:relative;width:46px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .track{position:absolute;inset:0;border-radius:100px;background:rgba(255,255,255,.15);
  transition:background .2s}
.toggle input:checked + .track{background:var(--p)}
.toggle .track::after{content:'';position:absolute;left:2px;top:2px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked + .track::after{transform:translateX(20px)}

.det-bottom{padding:14px 16px max(20px,env(safe-area-inset-bottom));border-top:1px solid var(--brd);flex-shrink:0}
.publish-btn{width:100%;padding:14px;border-radius:100px;background:linear-gradient(135deg,var(--p),var(--pd));
  color:#fff;font-family:var(--font-head);font-weight:800;font-size:.92rem;display:flex;align-items:center;
  justify-content:center;gap:8px;box-shadow:0 4px 20px rgba(139,92,246,.35)}
.publish-btn:disabled{opacity:.4}

/* ═══ SOUND SHEET ═══ */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;opacity:0;pointer-events:none;
  transition:opacity .25s}
.sheet-overlay.show{opacity:1;pointer-events:all}
.sound-sheet{position:
