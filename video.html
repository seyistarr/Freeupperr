    <script>
        'use strict';

        // ══════════════════════════════════════════
        // CONFIG
        // ══════════════════════════════════════════
        const STORAGE_KEY = 'freeupper_blog_data_v2';
        const USER_KEY = 'freeupper_user_profile';
        const ALL_USERS_KEY = 'freeupper_all_users';
        const FOLLOW_KEY = 'freeupper_follows';
        const CVK = 'freeupper_comments_visible';
        const REPLY_BATCH = 3;
        const PAGE_SIZE = 5;

        // ══════════════════════════════════════════
        // DATA LAYER
        // ══════════════════════════════════════════
        function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : { posts: [], marketItems: [] };
        }

        function getCurrentUser() {
            let user = JSON.parse(localStorage.getItem(USER_KEY));
            if (!user) {
                user = {
                    id: 'FU-' + Math.random().toString(36).substr(2, 9).toUpperCase(),
                    username: '',
                    displayName: 'Guest',
                    avatar: 'data:image/svg+xml,' + encodeURIComponent(
                        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#E5E7EB"/><circle cx="50" cy="38" r="16" fill="#9CA3AF"/><ellipse cx="50" cy="75" rx="30" ry="22" fill="#9CA3AF"/></svg>'
                    ),
                    isLoggedIn: false,
                    verified: false
                };
                localStorage.setItem(USER_KEY, JSON.stringify(user));
            }
            return user;
        }

        function getAllUsers() {
            return JSON.parse(localStorage.getItem(ALL_USERS_KEY) || '[]');
        }

        function getFollows() {
            const raw = localStorage.getItem(FOLLOW_KEY);
            return raw ? JSON.parse(raw) : {};
        }

        function isFollowing(userId) {
            const follows = getFollows();
            return !!follows[userId];
        }

        function toggleFollowUser(userId) {
            const follows = getFollows();
            if (follows[userId]) {
                delete follows[userId];
            } else {
                follows[userId] = true;
            }
            localStorage.setItem(FOLLOW_KEY, JSON.stringify(follows));
            return !!follows[userId];
        }

        function getCommentsVisible() {
            const r = localStorage.getItem(CVK);
            return r ? JSON.parse(r) : {};
        }

        function setCommentsVisible(postId, count) {
            const cv = getCommentsVisible();
            cv[postId] = count;
            localStorage.setItem(CVK, JSON.stringify(cv));
        }

        function getVisibleComments(postId) {
            const cv = getCommentsVisible();
            return cv[postId] || 5;
        }

        // ══════════════════════════════════════════
        // COMMENT STATE
        // ══════════════════════════════════════════
        let expandedThreads = new Map();
        let replyTarget = null;
        let currentPostId = null;

        // ══════════════════════════════════════════
        // GET ALL DESCENDANTS (replies)
        // ══════════════════════════════════════════
        function getAllDescendants(pid, comments) {
            const result = [];
            const direct = comments.filter(c => c.parentId === pid);
            for (const c of direct) {
                result.push(c);
                result.push(...getAllDescendants(c.id, comments));
            }
            return result;
        }

        // ══════════════════════════════════════════
        // YOUTUBE STATE
        // ══════════════════════════════════════════
        let ytState = {};
        let ytInfo = {};
        let ytWindows = {};

        // ══════════════════════════════════════════
        // GET VIDEO POSTS
        // ══════════════════════════════════════════
        function getVideoPosts() {
            const data = loadData();
            const currentUser = getCurrentUser();
            const allUsers = getAllUsers();

            let posts = data.posts.filter(post =>
                post.mediaType === 'video' && post.mediaUrl
            );

            posts = posts.filter(post => {
                if (post.authorId === currentUser.id) return true;
                const author = allUsers.find(u => u.id === post.authorId);
                return !author || !author.isPrivate;
            });

            posts.sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date));

            return posts.map(post => {
                const isOwn = post.authorId === currentUser.id;
                const author = isOwn ? currentUser : allUsers.find(u => u.id === post.authorId);
                const authorName = isOwn ? currentUser.displayName : (author?.displayName || post.author ||
                    'Anonymous');
                const authorAvatar = isOwn ? currentUser.avatar : (author?.avatar || '');
                const isVerified = isOwn ? currentUser.verified : (author?.verified || false);
                const isFollowingUser = !isOwn && author ? isFollowing(author.id) : false;

                const liked = !!data.userReactions?.[`${post.id}-love`];
                const isYouTube = post.mediaUrl && (post.mediaUrl.includes('youtube.com/embed') || post.mediaUrl
                    .includes('youtu.be'));

                return {
                    id: post.id,
                    src: post.mediaUrl,
                    poster: post.mediaUrl || '',
                    creator: authorName,
                    handle: isOwn ? `@${currentUser.username || 'me'}` : `@${author?.username || authorName.toLowerCase()}`,
                    verified: isVerified,
                    avatar: authorAvatar,
                    caption: post.title + (post.description ? '\n' + post.description : '') + (post.tags ? ' ' + post
                        .tags.map(t => '#' + t).join(' ') : ''),
                    sound: 'Original Audio · ' + authorName,
                    soundImg: authorAvatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + authorName,
                    likes: (post.reactions?.love || 0) + (post.reactions?.laugh || 0) + (post.reactions?.cry || 0),
                    comments: post.comments?.length || 0,
                    reposts: 0,
                    bookmarks: 0,
                    liked: liked,
                    saved: false,
                    following: isFollowingUser,
                    authorId: post.authorId,
                    postData: post,
                    isYouTube: isYouTube,
                    ytId: isYouTube ? post.mediaUrl.match(/(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/)?.[1] || post
                        .mediaUrl.match(/(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1] : null
                };
            });
        }

        // ══════════════════════════════════════════
        // YOUTUBE POSTMESSAGE HELPERS
        // ══════════════════════════════════════════
        function ytPostMessage(idx, func, args = []) {
            const iframe = document.getElementById('yt-' + idx);
            if (!iframe || !iframe.contentWindow) return;
            iframe.contentWindow.postMessage(JSON.stringify({
                event: 'command',
                func: func,
                args: args
            }), '*');
        }

        function _updateMuteBadge(idx) {
            const badge = document.getElementById('muteBadge-' + idx);
            const ico = document.getElementById('muteIco-' + idx);
            if (!badge || !ico) return;
            const state = ytState[idx] || { muted: true };

            if (state.muted) {
                ico.innerHTML =
                    '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
                badge.style.opacity = '.95';
            } else {
                ico.innerHTML =
                    '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
                badge.style.opacity = '.6';
            }
        }

        function _showYtPauseIcon(idx, isPlaying) {
            const icon = document.getElementById('pauseIcon-' + idx);
            if (!icon) return;
            icon.querySelector('svg').innerHTML = isPlaying ?
                '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' :
                '<polygon points="5 3 19 12 5 21 5 3"/>';
            _showPauseIcon(icon);
        }

        // ══════════════════════════════════════════
        // SETS UP THE POSTMESSAGE HANDSHAKE
        // ══════════════════════════════════════════
        function initYtListener(idx) {
            const iframe = document.getElementById('yt-' + idx);
            if (!iframe || !iframe.contentWindow) return;
            ytWindows[idx] = iframe.contentWindow;
            iframe.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'yt-' + idx }), '*');
        }

        // ══════════════════════════════════════════
        // UPDATE YOUTUBE PROGRESS UI
        // ══════════════════════════════════════════
        function updateYtProgressUI(idx, currentTime, duration) {
            if (!duration) return;
            const pct = (currentTime / duration) * 100;
            const fill = document.getElementById('progFill-' + idx);
            const thumb = document.getElementById('progThumb-' + idx);
            if (fill) fill.style.width = pct + '%';
            if (thumb) thumb.style.setProperty('--pct', pct + '%');
        }

        // ══════════════════════════════════════════
        // TOGGLE YOUTUBE CONTROLS
        // ══════════════════════════════════════════
        function toggleYtControls(idx) {
            if (!ytState[idx]) ytState[idx] = { muted: true, playing: true };
            const state = ytState[idx];

            if (state.muted) {
                ytPostMessage(idx, 'unMute');
                state.muted = false;
                showToast('Sound on 🔊');
                _showYtPauseIcon(idx, true);
                _updateMuteBadge(idx);
                return;
            }

            if (state.playing) {
                ytPostMessage(idx, 'pauseVideo');
                state.playing = false;
                _showYtPauseIcon(idx, false);
            } else {
                ytPostMessage(idx, 'playVideo');
                state.playing = true;
                _showYtPauseIcon(idx, true);
            }
            _updateMuteBadge(idx);
        }

        // ══════════════════════════════════════════
        // GLOBAL POSTMESSAGE LISTENER
        // ══════════════════════════════════════════
        window.addEventListener('message', function(event) {
            if (typeof event.data !== 'string') return;
            let data;
            try { data = JSON.parse(event.data); } catch (e) { return; }
            if (!data || data.event !== 'infoDelivery' || !data.info) return;

            let idx = null;
            for (const k in ytWindows) {
                if (ytWindows[k] === event.source) { idx = k; break; }
            }
            if (idx === null) return;

            const info = data.info;
            if (typeof info.currentTime === 'number' && typeof info.duration === 'number' && info.duration > 0) {
                ytInfo[idx] = { currentTime: info.currentTime, duration: info.duration };
                updateYtProgressUI(idx, info.currentTime, info.duration);
            }
        });

        // ══════════════════════════════════════════
        // BUILD FEED
        // ══════════════════════════════════════════
        function buildFeed() {
            videoPosts = getVideoPosts();
            const track = document.getElementById('feedTrack');
            const emptyState = document.getElementById('emptyState');

            if (videoPosts.length === 0) {
                track.innerHTML = '';
                emptyState.style.display = 'flex';
                return;
            }

            emptyState.style.display = 'none';
            track.innerHTML = '';

            videoPosts.forEach((v, i) => {
                const card = document.createElement('div');
                card.className = 'v-card';
                card.id = 'card-' + i;
                card.innerHTML = buildCard(v, i);
                track.appendChild(card);
            });

            const io = new IntersectionObserver((entries) => {
                entries.forEach(e => {
                    const idx = parseInt(e.target.dataset.idx);
                    if (e.isIntersecting && e.intersectionRatio >= 0.6) {
                        onCardActive(idx);
                    } else {
                        pauseCard(idx);
                    }
                });
            }, { threshold: 0.6 });

            videoPosts.forEach((_, i) => {
                const card = document.getElementById('card-' + i);
                if (card) {
                    card.dataset.idx = i;
                    io.observe(card);
                }
            });

            if (videoPosts.length > 0) {
                onCardActive(0);
            }
        }

        function buildCard(v, i) {
            const likeClass = v.liked ? 'v-action-btn liked' : 'v-action-btn';
            const saveClass = v.saved ? 'v-action-btn saved' : 'v-action-btn';
            const followClass = v.following ? 'v-follow-dot following' : 'v-follow-dot';
            const captionHtml = v.caption ? hashify(v.caption) : '';

            let videoHtml = '';
            if (v.isYouTube && v.ytId) {
                videoHtml = `
                    <iframe class="v-yt-iframe" id="yt-${i}" src="https://www.youtube.com/embed/${v.ytId}?autoplay=1&loop=1&playlist=${v.ytId}&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}" allow="autoplay; encrypted-media" allowfullscreen onload="initYtListener(${i})"></iframe>
                    <div class="v-tap-yt" id="tapYt-${i}" onclick="toggleYtControls(${i})"></div>
                    <video class="v-video" id="vid-${i}" style="display:none;"></video>
                    <div class="v-mute-badge" id="muteBadge-${i}">
                        <svg id="muteIco-${i}" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                    </div>
                `;
            } else {
                videoHtml = `
                    <video class="v-video" id="vid-${i}" src="${v.src}" poster="${v.poster}"
                      playsinline loop preload="metadata" muted></video>
                `;
            }

            return `
            ${videoHtml}
            <div class="v-skeleton" id="skel-${i}"><div class="v-skeleton-pulse"></div></div>
            <div class="v-grad-top"></div>
            <div class="v-grad-bot"></div>
            ${!v.isYouTube ? `<div class="v-tap" id="tap-${i}" ondblclick="doubleTapLike(event,${i})" onclick="tapPause(${i})"></div>` : ''}
            <div class="v-pause-icon" id="pauseIcon-${i}">
              <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </div>

            <!-- TOP BAR -->
            <div class="v-topbar">
              <span class="v-topbar-title">Videos</span>
              <div style="display:flex;gap:8px">
                <button class="v-top-ico" onclick="openMore(${i})">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2" fill="#fff" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="#fff" stroke="none"/><circle cx="12" cy="19" r="1.2" fill="#fff" stroke="none"/></svg>
                </button>
              </div>
            </div>

            <!-- RIGHT ACTIONS -->
            <div class="v-actions">
              <div class="v-action">
                <div class="v-avatar-wrap">
                  <img class="v-avatar" src="${v.avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + v.creator}" alt="${v.creator}" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=${v.creator}'">
                  <div class="${followClass}" id="followDot-${i}" onclick="toggleFollow(${i})">
                    <svg id="followIco-${i}" viewBox="0 0 24 24">${v.following ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' : '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'}</svg>
                  </div>
                </div>
              </div>

              <div class="v-action">
                <button class="${likeClass}" id="likeBtn-${i}" onclick="toggleLike(${i})">
                  <svg id="likeIco-${i}" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
                <span class="v-action-lbl" id="likeCount-${i}">${fmtNum(v.likes)}</span>
              </div>

              <div class="v-action">
                <button class="v-action-btn" onclick="openComments(${i})">
                  <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </button>
                <span class="v-action-lbl">${fmtNum(v.comments)}</span>
              </div>

              <div class="v-action">
                <button class="v-action-btn" id="repostBtn-${i}" onclick="toggleRepost(${i})">
                  <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>
                <span class="v-action-lbl" id="repostCount-${i}">${fmtNum(v.reposts)}</span>
              </div>

              <div class="v-action">
                <button class="${saveClass}" id="saveBtn-${i}" onclick="toggleSave(${i})">
                  <svg id="saveIco-${i}" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                </button>
                <span class="v-action-lbl" id="saveCount-${i}">${fmtNum(v.bookmarks)}</span>
              </div>

              <div class="v-action">
                <button class="v-action-btn" onclick="openShare(${i})">
                  <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                </button>
                <span class="v-action-lbl">${fmtNum(v.reposts)}</span>
              </div>
            </div>

            <!-- BOTTOM INFO -->
            <div class="v-info">
              <div class="v-creator">
                <span class="v-creator-name">${v.handle}</span>
                ${v.verified ? `<span class="v-badge"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>` : ''}
              </div>
              <div>
                <div class="v-caption" id="cap-${i}">${captionHtml}</div>
                ${captionHtml.length > 80 ? `<button class="v-see-more" id="seeMore-${i}" onclick="toggleCaption(${i})">more</button>` : ''}
              </div>
              <div class="v-sound-row">
                <svg class="v-sound-ico" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                <span class="v-sound-lbl">${v.sound}</span>
                <div class="v-sound-disc"><img src="${v.soundImg || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + v.creator}" alt="" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=${v.creator}'"></div>
              </div>
            </div>

            <!-- PROGRESS BAR -->
            <div class="v-progress" id="prog-${i}" onclick="seekVideo(event,${i})">
              <div class="v-progress-fill" id="progFill-${i}" style="width:0%"></div>
              <div class="v-progress-thumb" id="progThumb-${i}"></div>
            </div>
          `;
        }

        // ══════════════════════════════════════════
        // PAUSE CARD
        // ══════════════════════════════════════════
        function pauseCard(idx) {
            const v = videoPosts[idx];
            if (!v) return;
            if (v.isYouTube) {
                ytPostMessage(idx, 'pauseVideo');
                if (ytState[idx]) ytState[idx].playing = false;
            } else {
                const vid = document.getElementById('vid-' + idx);
                if (vid) vid.pause();
            }
        }

        // ══════════════════════════════════════════
        // ACTIVE CARD
        // ══════════════════════════════════════════
        function onCardActive(idx) {
            if (idx === _curIdx && idx !== 0) return;

            pauseCard(_curIdx);

            _curIdx = idx;
            const v = videoPosts[idx];
            currentPostId = v.id;

            ytState[idx] = { muted: true, playing: true };

            if (v.isYouTube) {
                const iframe = document.getElementById('yt-' + idx);
                if (iframe) {
                    const src = iframe.src.split('?')[0];
                    iframe.src = src +
                        `?autoplay=1&loop=1&playlist=${v.ytId}&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}`;
                }
                _updateMuteBadge(idx);
                const sk = document.getElementById('skel-' + idx);
                if (sk) sk.style.display = 'none';
                return;
            }

            const vid = document.getElementById('vid-' + idx);
            if (!vid) return;

            const sk = document.getElementById('skel-' + idx);
            if (sk) sk.style.display = 'none';

            vid.muted = false;
            vid.play().catch(() => { vid.muted = true;
                vid.play(); });

            if (vid._progTimer) clearInterval(vid._progTimer);
            vid._progTimer = setInterval(() => updateProgress(idx), 250);
        }

        function updateProgress(idx) {
            const vid = document.getElementById('vid-' + idx);
            if (!vid || !vid.duration) return;
            const pct = (vid.currentTime / vid.duration) * 100;
            const fill = document.getElementById('progFill-' + idx);
            const thumb = document.getElementById('progThumb-' + idx);
            if (fill) fill.style.width = pct + '%';
            if (thumb) thumb.style.setProperty('--pct', pct + '%');
        }

        // ══════════════════════════════════════════
        // SEEK VIDEO (works for both types)
        // ══════════════════════════════════════════
        function seekVideo(e, idx) {
            const v = videoPosts[idx];
            const prog = document.getElementById('prog-' + idx);
            if (!prog) return;
            const rect = prog.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));

            if (v && v.isYouTube) {
                const info = ytInfo[idx];
                if (!info || !info.duration) return;
                const time = pct * info.duration;
                ytPostMessage(idx, 'seekTo', [time, true]);
                updateYtProgressUI(idx, time, info.duration);
            } else {
                const vid = document.getElementById('vid-' + idx);
                if (!vid || !vid.duration) return;
                vid.currentTime = pct * vid.duration;
            }
        }

        // ══════════════════════════════════════════
        // TAP TO PAUSE (non-YouTube)
        // ══════════════════════════════════════════
        let _tapTimer = null;

        function tapPause(idx) {
            const v = videoPosts[idx];
            if (v.isYouTube) return;

            if (_tapTimer) { clearTimeout(_tapTimer);
                _tapTimer = null; return; }
            _tapTimer = setTimeout(() => {
                _tapTimer = null;
                const vid = document.getElementById('vid-' + idx);
                const icon = document.getElementById('pauseIcon-' + idx);
                if (!vid) return;
                if (vid.paused) {
                    vid.play();
                    icon.querySelector('svg').innerHTML =
                        '<polygon points="5 3 19 12 5 21 5 3"/>';
                    _showPauseIcon(icon);
                } else {
                    vid.pause();
                    icon.querySelector('svg').innerHTML =
                        '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
                    _showPauseIcon(icon);
                }
            }, 180);
        }

        function _showPauseIcon(icon) {
            icon.classList.remove('hide');
            icon.classList.add('show');
            setTimeout(() => {
                icon.classList.remove('show');
                icon.classList.add('hide');
                setTimeout(() => icon.classList.remove('hide'), 200);
            }, 700);
        }

        // ══════════════════════════════════════════
        // DOUBLE TAP LIKE
        // ══════════════════════════════════════════
        function doubleTapLike(e, idx) {
            if (_tapTimer) { clearTimeout(_tapTimer);
                _tapTimer = null; }
            if (!videoPosts[idx].liked) toggleLike(idx);
            const card = document.getElementById('card-' + idx);
            const burst = document.createElement('div');
            burst.className = 'heart-burst';
            burst.style.left = e.clientX + 'px';
            burst.style.top = e.clientY + 'px';
            burst.innerHTML =
                `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
            card.appendChild(burst);
            setTimeout(() => burst.remove(), 600);
        }

        // ══════════════════════════════════════════
        // LIKE
        // ══════════════════════════════════════════
        function toggleLike(idx) {
            const v = videoPosts[idx];
            v.liked = !v.liked;
            v.likes += v.liked ? 1 : -1;
            const btn = document.getElementById('likeBtn-' + idx);
            const lbl = document.getElementById('likeCount-' + idx);
            btn.classList.toggle('liked', v.liked);
            if (lbl) lbl.textContent = fmtNum(v.likes);
            if (v.liked) {
                btn.style.transform = 'scale(1.25)';
                setTimeout(() => btn.style.transform = '', 200);
            }

            const data = loadData();
            const post = data.posts.find(p => p.id === v.id);
            if (post) {
                const key = `${v.id}-love`;
                if (v.liked) {
                    if (!data.userReactions) data.userReactions = {};
                    data.userReactions[key] = true;
                    post.reactions.love = (post.reactions.love || 0) + 1;
                } else {
                    if (data.userReactions) {
                        delete data.userReactions[key];
                        post.reactions.love = Math.max(0, (post.reactions.love || 0) - 1);
                    }
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                appData = data;
            }
        }

        // ══════════════════════════════════════════
        // REPOST / BOOKMARK / FOLLOW
        // ══════════════════════════════════════════
        function toggleRepost(idx) {
            const v = videoPosts[idx];
            v.reposted = !v.reposted;
            v.reposts += v.reposted ? 1 : -1;
            const btn = document.getElementById('repostBtn-' + idx);
            const lbl = document.getElementById('repostCount-' + idx);
            btn.style.background = v.reposted ? 'rgba(0,186,124,.2)' : '';
            btn.querySelector('svg').style.stroke = v.reposted ? '#00ba7c' : '';
            if (lbl) lbl.textContent = fmtNum(v.reposts);
            showToast(v.reposted ? 'Reposted ✓' : 'Repost undone');
        }

        function toggleSave(idx) {
            const v = videoPosts[idx];
            v.saved = !v.saved;
            v.bookmarks += v.saved ? 1 : -1;
            const btn = document.getElementById('saveBtn-' + idx);
            const lbl = document.getElementById('saveCount-' + idx);
            btn.classList.toggle('saved', v.saved);
            if (lbl) lbl.textContent = fmtNum(v.bookmarks);
            if (v.saved) {
                btn.style.transform = 'scale(1.25)';
                setTimeout(() => btn.style.transform = '', 200);
                showToast('Saved to Bookmarks ✓');
            } else {
                showToast('Removed from Bookmarks');
            }
        }

        function toggleFollow(idx) {
            const v = videoPosts[idx];
            if (!v.authorId) return;
            const newState = toggleFollowUser(v.authorId);
            v.following = newState;
            const dot = document.getElementById('followDot-' + idx);
            const ico = document.getElementById('followIco-' + idx);
            dot.classList.toggle('following', v.following);
            ico.innerHTML = v.following ?
                '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' :
                '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>';
            showToast(v.following ? 'Following ' + v.creator : 'Unfollowed');
        }

        // ══════════════════════════════════════════
        // CAPTION EXPAND
        // ══════════════════════════════════════════
        function toggleCaption(idx) {
            const cap = document.getElementById('cap-' + idx);
            const btn = document.getElementById('seeMore-' + idx);
            const expanded = cap.classList.toggle('expanded');
            btn.textContent = expanded ? 'less' : 'more';
        }

        // ══════════════════════════════════════════
        // SHEETS
        // ══════════════════════════════════════════
        function openSheet(id) {
            document.getElementById('backdrop').classList.add('open');
            document.getElementById(id).classList.add('open');
            const v = videoPosts[_curIdx];
            if (v && !v.isYouTube) {
                const vid = document.getElementById('vid-' + _curIdx);
                if (vid) vid.pause();
            }
        }

        function closeSheet(id) {
            document.getElementById(id).classList.remove('open');
            const anyOpen = document.querySelectorAll('.sheet.open').length > 0;
            if (!anyOpen) {
                document.getElementById('backdrop').classList.remove('open');
                const v = videoPosts[_curIdx];
                if (v && !v.isYouTube) {
                    const vid = document.getElementById('vid-' + _curIdx);
                    if (vid) vid.play().catch(() => {});
                }
            }
        }

        function closeAllSheets() {
            document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
            document.getElementById('backdrop').classList.remove('open');
            const v = videoPosts[_curIdx];
            if (v && !v.isYouTube) {
                const vid = document.getElementById('vid-' + _curIdx);
                if (vid) vid.play().catch(() => {});
            }
        }

        // ══════════════════════════════════════════
        // COMMENTS RENDER FUNCTIONS
        // ══════════════════════════════════════════
        function renderCommentsHTML(comments, postId, visibleCount) {
            const topLevel = comments.filter(c => c.parentId === null);

            if (topLevel.length === 0) {
                return '<p style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">Be the first to comment.</p>';
            }

            const shown = topLevel.slice(0, visibleCount);
            const hidden = topLevel.length - visibleCount;

            let html = shown.map(c => renderCommentThread(c, comments, postId)).join('');

            if (hidden > 0) {
                html += `<button class="view-replies-btn load-more-comments-btn" onclick="loadMoreComments(${postId})">
                    ▼ View ${hidden} more comment${hidden > 1 ? 's' : ''}
                </button>`;
            }

            return html;
        }

        function renderCommentThread(comment, allComments, postId) {
            const replies = getAllDescendants(comment.id, allComments);
            const hasReplies = replies.length > 0;
            const expandedCount = expandedThreads.get(comment.id) || 0;

            let repliesHtml = '';

            if (hasReplies && expandedCount > 0) {
                const shownReplies = replies.slice(0, expandedCount);
                const remaining = replies.length - expandedCount;

                repliesHtml = `<div class="replies-thread">
                    ${shownReplies.map(r => renderReplyItem(r, allComments, postId)).join('')}
                </div>`;

                if (remaining > 0) {
                    repliesHtml += `<button class="view-replies-btn expand-replies-btn" data-comment-id="${comment.id}" onclick="expandReplies(${comment.id}, ${postId})">
                        ▼ View ${remaining} more repl${remaining > 1 ? 'ies' : 'y'}
                    </button>`;
                } else {
                    repliesHtml += `<button class="hide-replies-btn collapse-replies-btn" data-comment-id="${comment.id}" onclick="collapseReplies(${comment.id}, ${postId})">
                        ▲ Hide replies
                    </button>`;
                }
            } else if (hasReplies && expandedCount === 0) {
                repliesHtml = `<button class="view-replies-btn expand-replies-btn" data-comment-id="${comment.id}" onclick="expandReplies(${comment.id}, ${postId})">
                    ▼ View ${replies.length} repl${replies.length > 1 ? 'ies' : 'y'}
                </button>`;
            }

            const isLong = comment.message.length > 160;
            const likeCount = parseInt(localStorage.getItem('comment-like-' + comment.id) || '0');
            const isLiked = likeCount > 0;

            return `
                <div class="comment-item" data-comment-id="${comment.id}">
                    <div class="comment-avatar" data-username="${escapeHtml(comment.username)}">
                        ${comment.username.charAt(0).toUpperCase()}
                    </div>
                    <div class="comment-body">
                        <div class="comment-username">${escapeHtml(comment.username)}</div>
                        <div class="comment-text${isLong ? ' collapsed' : ''}" data-cid="${comment.id}">
                            ${escapeHtml(comment.message)}
                        </div>
                        ${isLong ? `<button class="comment-show-more" onclick="toggleCommentExpand(this, '${comment.id}')">Show more</button>` : ''}
                        <div class="comment-meta">
                            <span class="comment-time">${formatRelativeTime(comment.time)}</span>
                            <button class="comment-reply-btn" onclick="replyToComment('${comment.id}', '${escapeHtml(comment.username)}')">Reply</button>
                            <button class="comment-like-btn ${isLiked ? 'liked' : ''}" onclick="toggleCommentLikeUI(this, '${comment.id}')">
                                <svg class="like-heart" viewBox="0 0 24 24" width="14" height="14"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                <span class="like-count">${likeCount > 0 ? likeCount : ''}</span>
                            </button>
                        </div>
                    </div>
                </div>
                ${repliesHtml}
            `;
        }

        function renderReplyItem(reply, allComments, postId) {
            const parent = allComments.find(c => c.id === reply.parentId);
            const parentName = parent ? parent.username : '';
            const mention = (parentName && parentName !== reply.username) ?
                `<span style="color:var(--p);font-weight:500;">@${escapeHtml(parentName)}</span> ` : '';

            const isLong = reply.message.length > 160;
            const likeCount = parseInt(localStorage.getItem('comment-like-' + reply.id) || '0');
            const isLiked = likeCount > 0;

            return `
                <div class="reply-item" data-comment-id="${reply.id}">
                    <div class="reply-avatar-dot" data-username="${escapeHtml(reply.username)}">
                        ${reply.username.charAt(0).toUpperCase()}
                    </div>
                    <div class="reply-body">
                        <div class="reply-username">${escapeHtml(reply.username)}</div>
                        <div class="comment-text reply-text${isLong ? ' collapsed' : ''}" data-cid="${reply.id}">
                            ${mention}${escapeHtml(reply.message)}
                        </div>
                        ${isLong ? `<button class="comment-show-more" onclick="toggleCommentExpand(this, '${reply.id}')">Show more</button>` : ''}
                        <div class="reply-meta">
                            <span class="reply-time">${formatRelativeTime(reply.time)}</span>
                            <button class="reply-reply-btn" onclick="replyToComment('${reply.id}', '${escapeHtml(reply.username)}')">Reply</button>
                            <button class="reply-like-btn ${isLiked ? 'liked' : ''}" onclick="toggleCommentLikeUI(this, '${reply.id}')">
                                <svg class="like-heart" viewBox="0 0 24 24" width="12" height="12"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                <span class="like-count">${likeCount > 0 ? likeCount : ''}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ══════════════════════════════════════════
        // COMMENT ACTIONS
        // ══════════════════════════════════════════
        function addComment(postId, parentId, message) {
            const post = appData.posts.find(p => p.id === postId);
            if (!post) return;

            const currentUser = getCurrentUser();

            post.comments.push({
                id: 'c' + Date.now(),
                username: currentUser.displayName || 'Guest',
                avatar: currentUser.avatar,
                message: message,
                time: new Date().toISOString(),
                approved: true,
                parentId: parentId || null
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            appData = loadData();
        }

        function submitCommentFromBar() {
            const textarea = document.getElementById('commentInput');
            const message = textarea.value.trim();
            if (!message) return showToast('Comment cannot be empty.');

            const parentId = replyTarget ? replyTarget.commentId : null;
            addComment(currentPostId, parentId, message);

            textarea.value = '';
            replyTarget = null;
            updateReplyContextUI();

            refreshCommentsList(currentPostId);
            showToast(parentId ? 'Reply posted' : 'Comment posted');
        }

        function replyToComment(commentId, username) {
            replyTarget = { commentId, username };
            updateReplyContextUI();
            document.getElementById('commentInput').focus();
            document.getElementById('commentInput').placeholder = `Reply to @${username}...`;
            showToast(`Replying to @${username}`);
        }

        function cancelReply() {
            replyTarget = null;
            updateReplyContextUI();
            document.getElementById('commentInput').placeholder = 'Add a comment…';
            document.getElementById('commentInput').value = '';
        }

        function updateReplyContextUI() {
            const banner = document.getElementById('reply-context-banner');
            const usernameEl = document.getElementById('reply-context-username');

            if (replyTarget) {
                banner.classList.add('show');
                usernameEl.textContent = '@' + replyTarget.username;
            } else {
                banner.classList.remove('show');
                usernameEl.textContent = '';
            }
        }

        function toggleCommentLikeUI(btn, commentId) {
            const isLiked = btn.classList.toggle('liked');
            const key = 'comment-like-' + commentId;
            let count = parseInt(localStorage.getItem(key) || '0');

            if (isLiked) count++;
            else count = Math.max(0, count - 1);

            if (count === 0) localStorage.removeItem(key);
            else localStorage.setItem(key, String(count));

            const countEl = btn.querySelector('.like-count');
            if (countEl) countEl.textContent = count > 0 ? count : '';
        }

        function toggleCommentExpand(btn, commentId) {
            const textEl = document.querySelector(`.comment-text[data-cid="${commentId}"], .reply-text[data-cid="${commentId}"]`);
            if (textEl) {
                const collapsed = textEl.classList.toggle('collapsed');
                btn.textContent = collapsed ? 'Show more' : 'Show less';
            }
        }

        // ══════════════════════════════════════════
        // EXPAND / COLLAPSE REPLIES
        // ══════════════════════════════════════════
        function expandReplies(commentId, postId) {
            const current = expandedThreads.get(commentId) || 0;
            expandedThreads.set(commentId, current + REPLY_BATCH);
            refreshCommentsList(postId);
        }

        function collapseReplies(commentId, postId) {
            expandedThreads.delete(commentId);
            refreshCommentsList(postId);
        }

        function loadMoreComments(postId) {
            const current = getVisibleComments(postId);
            setCommentsVisible(postId, current + 5);
            refreshCommentsList(postId);
        }

        function refreshCommentsList(postId) {
            // Reload fresh data from localStorage
            appData = loadData();
            const post = appData.posts.find(p => p.id === postId);
            if (!post) return;

            const container = document.getElementById('comments-list');
            if (!container) return;

            const approvedComments = post.comments.filter(c => c.approved !== false);
            const visibleCount = getVisibleComments(postId);

            container.innerHTML = renderCommentsHTML(approvedComments, postId, visibleCount);
        }

        // ══════════════════════════════════════════
        // OPEN COMMENTS
        // ══════════════════════════════════════════
        function openComments(idx) {
            const v = videoPosts[idx];
            currentPostId = v.id;

            const countEl = document.getElementById('commentCount');
            if (countEl) countEl.textContent = fmtNum(v.comments) + ' Replies';

            replyTarget = null;
            updateReplyContextUI();

            const user = getCurrentUser();
            const avatarEl = document.getElementById('commentUserAvatar');
            if (avatarEl) {
                avatarEl.src = user.avatar;
                avatarEl.onerror = function() {
                    this.style.display = 'none';
                };
            }

            refreshCommentsList(v.id);

            openSheet('commentSheet');
        }

        // ══════════════════════════════════════════
        // SHARE / REACTIONS / MORE
        // ══════════════════════════════════════════
        function openShare(idx) { openSheet('shareSheet'); }

        function shareAction(label) {
            closeSheet('shareSheet');
            showToast(label === 'Copy link' ? 'Link copied ✓' : label + ' ✓');
        }

        function openReactions(idx) {
            const strip = document.getElementById('reactionStrip');
            const list = document.getElementById('reactionList');
            const countEl = document.getElementById('reactionCount');

            const v = videoPosts[idx];
            if (countEl) countEl.textContent = fmtNum(v.likes) + ' Likes';

            const reactionTypes = [
                { emoji: '❤️', label: 'Love', count: Math.floor(v.likes * 0.5) },
                { emoji: '😂', label: 'Funny', count: Math.floor(v.likes * 0.2) },
                { emoji: '😮', label: 'Wow', count: Math.floor(v.likes * 0.15) },
                { emoji: '👏', label: 'Clap', count: Math.floor(v.likes * 0.1) },
                { emoji: '🔥', label: 'Fire', count: Math.floor(v.likes * 0.05) },
            ];

            _activeReactionChip = 0;
            strip.innerHTML = reactionTypes.map((r, i) => `
                <button class="r-chip ${i === 0 ? 'active' : ''}" onclick="switchReactionTab(${i})">
                    <span class="emoji">${r.emoji}</span>${r.label} ${fmtNum(r.count)}
                </button>
            `).join('');

            renderReactionUsers(0, reactionTypes);
            openSheet('reactionSheet');
        }

        function switchReactionTab(i) {
            _activeReactionChip = i;
            document.querySelectorAll('.r-chip').forEach((c, ci) => c.classList.toggle('active', ci === i));
            const reactionTypes = [
                { emoji: '❤️', label: 'Love' },
                { emoji: '😂', label: 'Funny' },
                { emoji: '😮', label: 'Wow' },
                { emoji: '👏', label: 'Clap' },
                { emoji: '🔥', label: 'Fire' },
            ];
            renderReactionUsers(i, reactionTypes);
        }

        function renderReactionUsers(i, reactionTypes) {
            const list = document.getElementById('reactionList');
            const r = reactionTypes[i] || reactionTypes[0];
            const users = ['Tunde', 'Adaeze', 'Bayo', 'Ngozi', 'Emeka', 'Chisom', 'Sola', 'Kemi'];
            list.innerHTML = users.slice(0, Math.floor(Math.random() * 5) + 3).map(u => {
                const ava = `https://api.dicebear.com/7.x/avataaars/svg?seed=${u}`;
                return `
                    <div class="r-user">
                        <img class="r-user-ava" src="${ava}" alt="${u}" onerror="this.src='${ava}'">
                        <div class="r-user-info">
                            <div class="r-user-name">${u}</div>
                            <div class="r-user-handle">@${u.toLowerCase()}</div>
                        </div>
                        <span class="r-user-emoji">${r.emoji}</span>
                        <button class="r-follow-btn" onclick="this.classList.toggle('following');this.textContent=this.classList.contains('following')?'Following':'Follow'">Follow</button>
                    </div>`;
            }).join('');
        }

        function openMore(idx) {
            const list = document.getElementById('moreList');
            const v = videoPosts[idx];
            list.innerHTML = [
                { ico: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
                    lbl: 'Not interested in this video' },
                { ico: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
                    lbl: 'Follow ' + v.creator, sub: v.handle },
                { ico: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
                    lbl: 'Find similar videos' },
                { ico: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
                    lbl: 'Save video' },
                { ico: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
                    lbl: 'Copy link to video' },
                { ico: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
                    lbl: 'Report video', danger: true },
            ].map(r => `
                <button class="more-row ${r.danger ? 'danger' : ''}" onclick="moreAction('${r.lbl}')">
                    <svg class="more-row-ico" viewBox="0 0 24 24">${r.ico}</svg>
                    <div>
                        <div class="more-row-lbl">${r.lbl}</div>
                        ${r.sub ? `<div class="more-row-sub">${r.sub}</div>` : ''}
                    </div>
                </button>
            `).join('');
            openSheet('moreSheet');
        }

        function moreAction(label) {
            closeSheet('moreSheet');
            showToast(label);
        }

        // ══════════════════════════════════════════
        // HELPERS
        // ══════════════════════════════════════════
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
        }

        function fmtNum(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
            return String(n);
        }

        function hashify(text) {
            return text.replace(/#(\w+)/g, '<span class="hashtag">#$1</span>');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function formatRelativeTime(iso) {
            const d = new Date(iso);
            const diff = Date.now() - d;
            const m = Math.floor(diff / 60000);
            if (m < 1) return 'Just now';
            if (m < 60) return m + 'm ago';
            const h = Math.floor(m / 60);
            if (h < 24) return h + 'h ago';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        // ══════════════════════════════════════════
        // UPDATE NAV AVATAR
        // ══════════════════════════════════════════
        function updateNavAvatar() {
            const user = getCurrentUser();
            const avatars = document.querySelectorAll('.side-av, .nav-av');
            avatars.forEach(el => {
                el.src = user.avatar;
                el.onerror = function() {
                    this.style.display = 'none';
                };
            });
        }

        // ══════════════════════════════════════════
        // REFRESH FEED
        // ══════════════════════════════════════════
        function refreshFeed() {
            document.querySelectorAll('.v-video').forEach(vid => {
                if (vid._progTimer) clearInterval(vid._progTimer);
                vid.pause();
            });
            buildFeed();
        }

        // ══════════════════════════════════════════
        // STATE
        // ══════════════════════════════════════════
        let _curIdx = 0;
        let _toastTimer = null;
        let _activeReactionChip = 0;
        let videoPosts = [];
        let appData = loadData();

        // ══════════════════════════════════════════
        // INIT
        // ══════════════════════════════════════════
        function init() {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector('.nav-item[href="video.html"]')?.classList.add('active');
            document.querySelectorAll('.side-btn').forEach(el => el.classList.remove('active'));
            document.querySelector('.side-btn[href="video.html"]')?.classList.add('active');

            updateNavAvatar();

            document.addEventListener('themeChanged', function(e) {
                document.documentElement.setAttribute('data-theme', e.detail.theme);
            });

            buildFeed();

            window.addEventListener('storage', function(e) {
                if (e.key === STORAGE_KEY) {
                    appData = loadData();
                    refreshFeed();
                }
            });

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    appData = loadData();
                    refreshFeed();
                }
            });

            document.getElementById('commentInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    submitCommentFromBar();
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>

</body>
</html>
