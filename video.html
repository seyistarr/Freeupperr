<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Videos · Freeupper</title>
    <link rel="icon" type="image/png" href="freeupper.png">
    <link rel="apple-touch-icon" href="freeupper.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Freeupper">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Watch short videos and discover creators on Freeupper.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Freeupper">
    <meta property="og:title" content="Freeupper Videos">
    <meta property="og:description" content="Watch short videos and discover creators on Freeupper.">
    <meta property="og:image" content="https://seyistarr.github.io/Freeupperr/freeupper.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="500">
    <meta property="og:image:height" content="500">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Freeupper Videos">
    <meta name="twitter:description" content="Watch short videos and discover creators on Freeupper.">
    <meta name="twitter:image" content="https://seyistarr.github.io/Freeupperr/freeupper.png">
    <link rel="stylesheet" href="global.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

    <style>
        /* ── TOKENS ── */
        :root {
            --bg: #000;
            --surface: rgba(255, 255, 255, .08);
            --brd: rgba(255, 255, 255, .1);
            --text: #fff;
            --muted: rgba(255, 255, 255, .6);
            --muted2: rgba(255, 255, 255, .35);
            --accent: #1d9bf0;
            --red: #f91880;
            --gold: #ffd700;
            --sheet-bg: #111;
            --sheet-bd: #2a2a2a;
            --inp-bg: #1a1a1a;
            --p: #8b5cf6;
            --pd: #6c3fc5;
            --pdim: rgba(139, 92, 246, .15);
            --pbrd: rgba(139, 92, 246, .28);
            --pglow: rgba(108, 63, 197, .45);
            --navbg: rgba(0, 0, 0, .97);
            --sidebg: #0a0a0a;
        }

        [data-theme="light"] {
            --bg: #f2f2f7;
            --surface: rgba(0, 0, 0, .06);
            --brd: rgba(0, 0, 0, .1);
            --text: #0d0d0d;
            --muted: rgba(0, 0, 0, .55);
            --muted2: rgba(0, 0, 0, .35);
            --sheet-bg: #fff;
            --sheet-bd: #e5e7eb;
            --inp-bg: #f5f5f5;
            --navbg: rgba(242, 242, 247, .97);
            --sidebg: #fff;
        }

        /* ── RESET ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            transition: background .3s, color .3s;
        }

        /* ══════════════════════════════════════
           LAYOUT
        ══════════════════════════════════════ */
        .layout {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* Side nav */
        .side-nav {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 28px 0 24px;
            background: var(--sidebg);
            border-right: 1px solid var(--brd);
            width: 70px;
            flex-shrink: 0;
            gap: 2px;
            z-index: 10;
            transition: background .3s, border-color .3s;
        }
        .side-logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--p);
            margin-bottom: 20px;
            letter-spacing: -1px;
            cursor: pointer;
        }
        .side-logo a {
            color: inherit;
            text-decoration: none;
        }
        .side-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s, transform .1s;
            background: none;
            border: none;
            position: relative;
            gap: 3px;
            color: inherit;
            text-decoration: none;
        }
        .side-btn:hover {
            background: var(--pdim);
            transform: scale(1.04);
        }
        .side-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .side-btn span {
            font-size: 8px;
            color: var(--muted2);
            font-weight: 600;
        }
        .side-btn.active svg {
            stroke: var(--p);
        }
        .side-btn.active span {
            color: var(--p);
        }
        .side-btn .side-badge {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--p);
            border: 1.5px solid var(--sidebg);
        }
        .side-gap {
            flex: 1;
        }
        .side-av {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .side-btn.active .side-av {
            border-color: var(--p);
        }

        /* Main */
        .main {
            flex: 1;
            overflow: hidden;
            background: var(--bg);
            transition: background .3s;
            position: relative;
        }

        /* ══════════════════════════════════════
           FEED TRACK
        ══════════════════════════════════════ */
        #feedTrack {
            position: absolute;
            inset: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 80px;
        }
        #feedTrack::-webkit-scrollbar {
            display: none;
        }

        /* ══════════════════════════════════════
           SINGLE VIDEO CARD
        ══════════════════════════════════════ */
        .v-card {
            position: relative;
            width: 100%;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow: hidden;
            background: #000;
        }

        .v-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* YouTube iframe */
        .v-yt-iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tap overlay for YouTube */
        .v-tap-yt {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: pointer;
        }

        .v-tap {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: pointer;
        }

        .v-pause-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 68px;
            height: 68px;
            background: rgba(0, 0, 0, .5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
            transition: transform .12s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
            opacity: 0;
            pointer-events: none;
        }
        .v-pause-icon svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }
        .v-pause-icon.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .v-pause-icon.hide {
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
        }

        /* YouTube mute badge */
        .v-mute-badge {
            position: absolute;
            top: max(env(safe-area-inset-top), 14px);
            left: 16px;
            width: 34px;
            height: 34px;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
            opacity: .95;
            transition: opacity .2s;
        }
        .v-mute-badge svg {
            width: 17px;
            height: 17px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Gradients - pure black */
        .v-grad-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, .7) 0%, transparent 100%);
            z-index: 12;
            pointer-events: none;
        }
        .v-grad-bot {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 300px;
            background: linear-gradient(to top, rgba(0, 0, 0, .9) 0%, rgba(0, 0, 0, .3) 60%, transparent 100%);
            z-index: 12;
            pointer-events: none;
        }

        /* ── TOP BAR ── */
        .v-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 14px) 16px 0;
            padding-top: max(env(safe-area-inset-top), 14px);
            z-index: 20;
        }
        .v-topbar-title {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -.3px;
            color: #fff;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
        }
        .v-top-ico {
            width: 38px;
            height: 38px;
            background: rgba(0, 0, 0, .5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, .15);
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .v-top-ico svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── RIGHT ACTIONS ── */
        .v-actions {
            position: absolute;
            right: 12px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 20;
        }
        .v-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .v-action-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, .15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .15s cubic-bezier(.34, 1.56, .64, 1), background .18s;
            -webkit-tap-highlight-color: transparent;
        }
        .v-action-btn:active {
            transform: scale(.88);
        }
        .v-action-btn svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .18s, fill .18s, transform .2s cubic-bezier(.34, 1.56, .64, 1);
            pointer-events: none;
        }
        .v-action-lbl {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .8);
        }

        .v-action-btn.liked {
            background: rgba(249, 24, 128, .3);
            border-color: rgba(249, 24, 128, .4);
        }
        .v-action-btn.liked svg {
            stroke: var(--red);
            fill: var(--red);
            transform: scale(1.15);
        }

        .v-action-btn.saved {
            background: rgba(255, 215, 0, .2);
            border-color: rgba(255, 215, 0, .3);
        }
        .v-action-btn.saved svg {
            stroke: var(--gold);
            fill: var(--gold);
            transform: scale(1.15);
        }

        .v-avatar-wrap {
            position: relative;
            width: 46px;
            height: 46px;
            margin-bottom: 4px;
        }
        .v-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid #fff;
            display: block;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .5);
        }
        .v-follow-dot {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 22px;
            background: var(--accent);
            border-radius: 50%;
            border: 2.5px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform .2s cubic-bezier(.34, 1.56, .64, 1), background .18s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
        }
        .v-follow-dot.following {
            background: #555;
        }
        .v-follow-dot svg {
            width: 12px;
            height: 12px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
        }

        /* ── BOTTOM INFO ── */
        .v-info {
            position: absolute;
            left: 14px;
            right: 72px;
            bottom: 80px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .v-creator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .v-creator-name {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -.2px;
            color: #fff;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
        }
        .v-verified {
            width: 17px;
            height: 17px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .v-verified svg {
            width: 10px;
            height: 10px;
            stroke: #fff;
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .v-caption {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            color: #fff;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .v-caption .hashtag {
            color: var(--accent);
            font-weight: 700;
        }
        .v-caption.expanded {
            -webkit-line-clamp: unset;
            overflow: visible;
        }
        .v-see-more {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, .7);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            text-align: left;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
        }
        .v-sound-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .v-sound-ico {
            width: 16px;
            height: 16px;
            stroke: rgba(255, 255, 255, .7);
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }
        .v-sound-lbl {
            font-size: 12px;
            color: rgba(255, 255, 255, .7);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
        }
        .v-sound-disc {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: 1.5px solid rgba(255, 255, 255, .15);
            overflow: hidden;
            flex-shrink: 0;
            animation: spinDisc 4s linear infinite;
        }
        .v-sound-disc img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes spinDisc {
            to {
                transform: rotate(360deg);
            }
        }

        .v-progress {
            position: absolute;
            bottom: 54px;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, .2);
            z-index: 20;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .v-progress-fill {
            height: 100%;
            background: #fff;
            border-radius: 0 2px 2px 0;
            transition: width .1s linear;
            pointer-events: none;
        }
        .v-progress-thumb {
            position: absolute;
            top: 50%;
            right: calc(100% - var(--pct, 0%));
            transform: translate(50%, -50%) scale(0);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            transition: transform .15s;
            pointer-events: none;
        }
        .v-progress:hover .v-progress-thumb,
        .v-progress:active .v-progress-thumb {
            transform: translate(50%, -50%) scale(1);
        }

        /* ══════════════════════════════════════
           BOTTOM NAV
        ══════════════════════════════════════ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--navbg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-top: 1px solid var(--brd);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0 max(env(safe-area-inset-bottom), 16px);
            z-index: 50;
            transition: background .3s, border-color .3s;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px clamp(8px, 3vw, 14px);
            border-radius: 14px;
            transition: background .15s;
            position: relative;
            background: none;
            border: none;
            text-decoration: none;
            color: inherit;
        }
        .nav-item:hover {
            background: var(--pdim);
        }
        .nav-item svg {
            width: clamp(20px, 5vw, 24px);
            height: clamp(20px, 5vw, 24px);
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .nav-item span {
            font-size: clamp(9px, 2vw, 10px);
            color: var(--muted);
            font-weight: 600;
            letter-spacing: .03em;
        }
        .nav-item.active svg {
            stroke: var(--p);
        }
        .nav-item.active span {
            color: var(--p);
        }
        .nav-av {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .nav-item.active .nav-av {
            border-color: var(--p);
        }
        .nav-badge {
            position: absolute;
            top: 3px;
            right: clamp(4px, 2vw, 6px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--p);
            border: 1.5px solid var(--bg);
        }

        /* ══════════════════════════════════════
           SHEETS
        ══════════════════════════════════════ */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity .25s, visibility .25s;
        }
        .sheet-backdrop.open {
            opacity: 1;
            visibility: visible;
        }

        .sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--sheet-bg);
            border-radius: 20px 20px 0 0;
            z-index: 201;
            transform: translateY(100%);
            transition: transform .32s cubic-bezier(.4, 0, .2, 1);
            max-height: 90dvh;
            display: flex;
            flex-direction: column;
        }
        .sheet.open {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, .2);
            border-radius: 2px;
            margin: 12px auto 0;
            flex-shrink: 0;
        }
        .sheet-hdr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px 12px;
            border-bottom: 1px solid var(--sheet-bd);
            flex-shrink: 0;
        }
        .sheet-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
        }
        .sheet-close {
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, .08);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sheet-close svg {
            width: 14px;
            height: 14px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        /* ── COMMENTS SHEET ── */
        #commentSheet .sheet-body {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 8px;
            scrollbar-width: none;
        }
        #commentSheet .sheet-body::-webkit-scrollbar {
            display: none;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            padding: 10px 18px;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
        }
        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--muted);
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
        }
        .comment-avatar.has-image {
            background: transparent;
            padding: 0;
        }
        .comment-avatar.has-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

            25% {
                transform: scale(1.35);

            50% {
                transform: scale(.9);

            75% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);

        .replies-thread {

            margin-left: 20px;
            padding-left: 0;

            gap: 8px;

        .reply-avatar-dot {
            width: 22px;

            border-radius: 50%;

            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.6rem;
            color: var(--muted);
            margin-left: -12px;
            border: 2px solid var(--bg);

            overflow: hidden;
            cursor: pointer;

        .reply-avatar-dot.has-image {
            background: transparent;
            padding: 0;

        .reply-avatar-dot.has-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .reply-body {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .reply-username {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1px;
        }
        .reply-text {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 0.88rem;
            color: var(--text);
            font-weight: 400;

            overflow-wrap: anywhere;
        }
        .reply-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .reply-time {
            font-size: 0.7rem;
            color: var(--muted2);

        .reply-reply-btn {

            background: none;

        .reply-like-btn {
            font-size: 0.7rem;

        .view-replies-btn,

            border: none;
            padding: 0;
            margin-top: 4px;

        .view-replies-btn:hover {

        .load-more-comments-btn {

        .comment-inp-row {

            gap: 8px;

        .comment-send {

            height: 32px;

            height: 15px;

            stroke-width: 2.5;
            stroke-linecap: round;

            background: none;
            border: none;

            cursor: pointer;

        /* ── SHARE SHEET ── */
        .share-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            padding: 16px;
        }
        .share-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 8px;
            border-radius: 14px;
            background: none;
            border: none;
            cursor: pointer;
            transition: background .18s;
            -webkit-tap-highlight-color: transparent;
        }
        .share-item:hover {
            background: rgba(255, 255, 255, .07);
        }
        .share-ico {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .share-ico svg {
            width: 26px;
            height: 26px;
        }
        .share-lbl {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        .share-links {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 0 12px 16px;
        }
        .share-link-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 8px;
            border-radius: 12px;
            background: none;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: background .18s;
            -webkit-tap-highlight-color: transparent;
        }
        .share-link-row:hover {
            background: rgba(255, 255, 255, .07);
        }
        .share-link-ico {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .share-link-ico svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .share-link-txt {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        /* ── REACTION SHEET ── */
        .reaction-strip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 16px 20px 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .reaction-strip::-webkit-scrollbar {
            display: none;
        }
        .r-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 100px;
            background: rgba(255, 255, 255, .07);
            border: 1.5px solid rgba(255, 255, 255, .1);
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            transition: background .18s, border-color .18s, transform .12s;
            -webkit-tap-highlight-color: transparent;
        }
        .r-chip:active {
            transform: scale(.93);
        }
        .r-chip.active {
            background: rgba(249, 24, 128, .18);
            border-color: rgba(249, 24, 128, .4);
            color: var(--red);
        }
        .r-chip .emoji {
            font-size: 18px;
        }

        .reaction-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 8px;
            scrollbar-width: none;
        }
        .reaction-list::-webkit-scrollbar {
            display: none;
        }
        .r-user {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
        }
        .r-user-ava {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--bg4);
        }
        .r-user-info {
            flex: 1;
            min-width: 0;
        }
        .r-user-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }
        .r-user-handle {
            font-size: 12px;
            color: var(--muted);
        }
        .r-user-emoji {
            font-size: 20px;
        }
        .r-follow-btn {
            padding: 8px 18px;
            border-radius: 100px;
            background: #fff;
            color: #000;
            font-size: 13px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: background .18s, transform .12s;
            flex-shrink: 0;

        .r-follow-btn:active {
            transform: scale(.95);
        }
        .r-follow-btn.following {
            background: transparent;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, .3);
        }

        /* ── MORE OPTIONS ── */
        .more-list {
            padding: 8px 12px calc(16px + env(safe-area-inset-bottom));
        }
        .more-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 8px;
            border-radius: 12px;
            background: none;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: background .18s;
            -webkit-tap-highlight-color: transparent;
        }
        .more-row:hover {
            background: rgba(255, 255, 255, .06);
        }
        .more-row-ico {
            width: 22px;
            height: 22px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .more-row-lbl {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        .more-row.danger .more-row-ico {
            stroke: var(--red);
        }
        .more-row.danger .more-row-lbl {
            color: var(--red);
        }
        .more-row-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 1px;
        }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30, 30, 30, .95);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, .12);
            z-index: 400;
            opacity: 0;
            transition: opacity .25s, transform .25s;
            white-space: nowrap;
            pointer-events: none;
            backdrop-filter: blur(12px);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── HEART BURST ── */
        @keyframes heartBurst {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.4);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0;
            }
        }
        .heart-burst {
            position: absolute;
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 15;
            animation: heartBurst .55s cubic-bezier(.22, 1, .36, 1) forwards;
        }
        .heart-burst svg {
            width: 100%;
            height: 100%;
            fill: var(--red);
        }

        .v-skeleton {
            position: absolute;
            inset: 0;
            background: #111;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .v-skeleton-pulse {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .15);
            border-top-color: rgba(255, 255, 255, .6);
            animation: spin .9s linear infinite;

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }

        .v-badge {
            display: inline-flex;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .v-badge svg {
            width: 9px;
            height: 9px;
            stroke: #fff;
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .empty-videos {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: var(--bg);
            z-index: 1;
        }
        .empty-videos .empty-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .empty-videos .empty-icon svg {
            width: 36px;
            height: 36px;
            stroke: var(--p);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .empty-videos h3 {
            font-size: clamp(18px, 4vw, 22px);
            font-weight: 800;
            color: var(--text);
            margin-bottom: 8px;
        }
        .empty-videos p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            max-width: 300px;
        }
        .empty-videos .create-btn {
            margin-top: 16px;
            padding: 12px 28px;
            border-radius: 100px;
            background: linear-gradient(135deg, var(--p), var(--pd));

            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: opacity .15s, transform .15s;
        }
        .empty-videos .create-btn:hover {
            opacity: .85;
            transform: translateY(-1px);

        /* ══════════════════════════════════════
           RESPONSIVE
        ══════════════════════════════════════ */
        @media (min-width: 768px) {
            .side-nav {
                display: flex;
            }

                display: none;
            }
            #feedTrack {
                padding-bottom: 0;
            }

                width: 82px;

        [data-theme="light"] .v-topbar-title,

        [data-theme="light"] .v-grad-bot {

        [data-theme="light"] .v-follow-dot {
            border-color: #000;
        }
        [data-theme="light"] .v-top-ico {
            background: rgba(0, 0, 0, .5);
        }
        [data-theme="light"] .v-top-ico svg {
            stroke: #fff;
        }
        [data-theme="light"] .v-action-btn.liked {
            background: rgba(249, 24, 128, .3);
        }
        [data-theme="light"] .v-action-btn.liked svg {
            stroke: var(--red);

        [data-theme="light"] .v-action-btn.saved {

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {

            console.warn('SW registration failed:', err);
          });
