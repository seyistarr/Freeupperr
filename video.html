    <script src="global.js"></script>
    <script src="auth.js"></script>
    <script src="posts.js"></script>
    <script src="listings.js"></script>
    <script src="mentions.js"></script>

    <style>
        /* ── all existing CSS kept exactly as in the old video.html ── */
        :root {
            --bg: #000;
            --surface: rgba(255, 255, 255, .08);
            --brd: rgba(255, 255, 255, .1);
            --text: #fff;
            --muted: rgba(255, 255, 255, .6);
            --muted2: rgba(255, 255, 255, .35);
            --accent: #1d9bf0;
            --red: #ff2d2d;
            --gold: #ffd700;
            --sheet-bg: #111;
            --sheet-bd: #2a2a2a;
            --inp-bg: #1a1a1a;
            --p: #8b5cf6;
            --pd: #6c3fc5;
            --pdim: rgba(139, 92, 246, .15);
            --pbrd: rgba(139, 92, 246, .28);
            --pglow: rgba(108, 63, 197, .45);
            --navbg: rgba(0, 0, 0, .97);
            --sidebg: #0a0a0a;
            --bg4: #2a2a2a;
            --rowh: rgba(255, 255, 255, .06);
            --nav-h: 78px;
        }

        [data-theme="light"] {
            --bg: #f2f2f7;
            --surface: rgba(0, 0, 0, .06);
            --brd: rgba(0, 0, 0, .1);
            --text: #0d0d0d;
            --muted: rgba(0, 0, 0, .55);
            --muted2: rgba(0, 0, 0, .35);
            --sheet-bg: #fff;
            --sheet-bd: #e5e7eb;
            --inp-bg: #f5f5f5;
            --navbg: rgba(242, 242, 247, .97);
            --sidebg: #fff;
            --bg4: #e5e7eb;
            --rowh: rgba(0, 0, 0, .05);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            transition: background .3s, color .3s;
        }

        .layout {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .side-nav {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 28px 0 24px;
            background: var(--sidebg);
            border-right: 1px solid var(--brd);
            width: 70px;
            flex-shrink: 0;
            gap: 2px;
            z-index: 10;
            transition: background .3s, border-color .3s;
        }
        .side-logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--p);
            margin-bottom: 20px;
            letter-spacing: -1px;
            cursor: pointer;
        }
        .side-logo a {
            color: inherit;
            text-decoration: none;
        }
        .side-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s, transform .1s;
            background: none;
            border: none;
            position: relative;
            gap: 3px;
            color: inherit;
            text-decoration: none;
        }
        .side-btn:hover {
            background: var(--pdim);
            transform: scale(1.04);
        }
        .side-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .side-btn span {
            font-size: 8px;
            color: var(--muted2);
            font-weight: 600;
        }
        .side-btn.active svg {
            stroke: var(--p);
        }
        .side-btn.active span {
            color: var(--p);
        }
        .side-btn .side-badge {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--p);
            border: 1.5px solid var(--sidebg);
        }
        .side-gap {
            flex: 1;
        }
        .side-av {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .side-btn.active .side-av {
            border-color: var(--p);
        }

        .main {
            flex: 1;
            overflow: hidden;
            background: var(--bg);
            transition: background .3s;
            position: relative;
        }

        .video-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(env(safe-area-inset-top), 14px) 16px 10px;
            pointer-events: none;
        }
        .video-topbar>* {
            pointer-events: auto;
        }
        .vt-tabs {
            display: flex;
            gap: 24px;
        }
        .vt-tab {
            background: none;
            border: none;
            color: rgba(255, 255, 255, .6);
            font-weight: 600;
            font-size: 16px;
            padding: 0 2px 6px;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: color .2s, border-color .2s;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .5);
            position: relative;
        }
        .vt-tab.active {
            color: #fff;
        }
        .vt-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 3px;
            background: var(--p);
            border-radius: 2px;
        }
        .vt-tab:hover {
            color: #fff;
        }
        .vt-more {
            position: absolute;
            right: 16px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, .3);
            background: rgba(0, 0, 0, .4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .18s, transform .12s;
        }
        .vt-more:active {
            transform: scale(.92);
        }
        .vt-more svg {
            width: 18px;
            height: 18px;
        }
        .vt-more svg circle {
            fill: #fff;
        }

        #feedTrack {
            position: absolute;
            inset: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-top: 60px;
            padding-bottom: 80px;
        }
        #feedTrack::-webkit-scrollbar {
            display: none;
        }

        .v-card {
            position: relative;
            width: 100%;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow: hidden;
            background: #000;
        }

        .v-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .v-yt-iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .v-tap-yt {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: pointer;
        }

        .v-tap {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: pointer;
        }

        .v-pause-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 68px;
            height: 68px;
            background: rgba(0, 0, 0, .5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
            transition: transform .12s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
            opacity: 0;
            pointer-events: none;
        }
        .v-pause-icon svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }
        .v-pause-icon.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .v-pause-icon.hide {
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
        }

        .v-mute-badge {
            position: absolute;
            top: max(env(safe-area-inset-top), 14px);
            left: 16px;
            width: 34px;
            height: 34px;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
            opacity: .95;
            transition: opacity .2s;
        }
        .v-mute-badge svg {
            width: 17px;
            height: 17px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .v-grad-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, .7) 0%, transparent 100%);
            z-index: 12;
            pointer-events: none;
        }
        .v-grad-bot {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 300px;
            background: linear-gradient(to top, rgba(0, 0, 0, .9) 0%, rgba(0, 0, 0, .3) 60%, transparent 100%);
            z-index: 12;
            pointer-events: none;
        }

        .v-actions {
            position: absolute;
            right: 15px;
            bottom: calc(var(--nav-h, 78px) + 45px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            z-index: 20;
        }
        .v-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .v-action-btn {
            width: auto;
            height: auto;
            background: none !important;
            border: none;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .15s cubic-bezier(.34, 1.56, .64, 1);
            -webkit-tap-highlight-color: transparent;
            padding: 0;
        }
        .v-action-btn:active {
            transform: scale(.88);
        }
        .v-action-btn svg {
            width: 32px;
            height: 32px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            filter: drop-shadow(0 1px 4px rgba(0, 0, 0, .6));
        }
        .v-action-btn.liked svg {
            fill: var(--red) !important;
            stroke: none !important;
            animation: vActionPop .3s ease-in-out;
        }
        .v-action-btn.saved svg {
            fill: var(--gold) !important;
            stroke: var(--gold) !important;
            animation: vActionPop .3s ease-in-out;
        }
        @keyframes vActionPop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
            }
        }

        .v-action-lbl {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .8);
        }

        .v-disc-wrap {
            position: relative;
            margin-top: 5px;
        }
        .v-disc {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--p);
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: spinDisc 6s linear infinite;
        }
        .v-disc img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .v-disc-note {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #111;
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .v-disc-note svg {
            width: 10px;
            height: 10px;
            fill: #fff;
        }
        @keyframes spinDisc {
            to {
                transform: rotate(360deg);
            }
        }

        .v-info {
            position: absolute;
            left: 20px;
            right: 90px;
            bottom: calc(var(--nav-h, 78px) + 40px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .v-user-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .v-avatar-wrap {
            position: relative;
            width: 48px;
            height: 48px;
            cursor: pointer;
        }
        .v-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, .3);
        }
        .v-plus-badge {
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            border: 1.5px solid #000;
            cursor: pointer;
            transition: opacity .25s, transform .25s;
        }
        .v-plus-badge.hidden {
            opacity: 0;
            transform: translateX(-50%) scale(0);
            pointer-events: none;
        }
        .v-user-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .v-creator {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            cursor: pointer;
        }
        .v-creator-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
        }
        .v-post-time {
            font-size: 13px;
            color: rgba(255, 255, 255, .7);
            text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
        }

        .v-desc-container {
            position: relative;
            max-width: 100%;
        }
        .v-caption {
            font-size: 16px;
            line-height: 1.55;
            letter-spacing: .1px;
            color: #fff;
            font-weight: 500;
            text-shadow: 0 1px 6px rgba(0, 0, 0, .75), 0 1px 12px rgba(0, 0, 0, .5);
            overflow-y: hidden;
            transition: max-height .3s cubic-bezier(.4, 0, .2, 1);
            word-wrap: break-word;
        }
        .v-caption.clamped {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            max-height: 100px;
        }
        .v-caption.expanded {
            display: block;
            max-height: 300px;
            overflow-y: auto;
            scrollbar-width: none;
            -webkit-mask-image: linear-gradient(to bottom,
                    rgba(0, 0, 0, 0) 0%,
                    rgba(0, 0, 0, 1) var(--fade-top, 0px),
                    rgba(0, 0, 0, 1) calc(100% - var(--fade-bottom, 0px)),
                    rgba(0, 0, 0, 0) 100%);
            mask-image: linear-gradient(to bottom,
                    rgba(0, 0, 0, 0) 0%,
                    rgba(0, 0, 0, 1) var(--fade-top, 0px),
                    rgba(0, 0, 0, 1) calc(100% - var(--fade-bottom, 0px)),
                    rgba(0, 0, 0, 0) 100%);
        }
        .v-caption.expanded::-webkit-scrollbar {
            display: none;
        }
        .v-caption .hashtag {
            color: var(--accent);
            font-weight: 700;
        }
        .v-caption .mention-link {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .v-caption .mention-link:hover {
            text-decoration: underline;
        }

        .v-see-more {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, .7);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            text-align: left;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
            display: none;
        }
        .v-see-more:hover {
            color: #fff;
        }

        .v-music-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, .1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, .15);
            padding: 8px 16px;
            border-radius: 30px;
            width: max-content;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .4);
        }
        .v-music-tag svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
        }

        .v-repost-pill {
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(0, 186, 124, .16);
            border: 1px solid rgba(0, 186, 124, .35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 100px;
            width: max-content;
            max-width: 260px;
            cursor: pointer;
            transition: transform .15s cubic-bezier(.34, 1.56, .64, 1), background .15s;
        }
        .v-repost-pill:active {
            transform: scale(.95);
        }
        .v-repost-pill:hover {
            background: rgba(0, 186, 124, .24);
        }
        .v-repost-pill span {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .4);
        }

        .v-repost-banner {
            position: absolute;
            top: max(env(safe-area-inset-top), 14px);
            left: 16px;
            right: 60px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, .55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, .12);
            padding: 7px 12px 7px 7px;
            border-radius: 100px;
            width: max-content;
            max-width: calc(100% - 20px);
            pointer-events: none;
        }
        .v-repost-banner-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, .4);
            flex-shrink: 0;
        }
        .v-repost-banner-text {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
        }
        .v-repost-banner-name {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
        .v-repost-banner-verb {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, .65);
            white-space: nowrap;
        }
        .v-repost-banner-icon {
            width: 13px;
            height: 13px;
            stroke: #00ba7c;
            fill: none;
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .v-repost-banner-chevron {
            width: 12px;
            height: 12px;
            stroke: rgba(255, 255, 255, .8);
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            margin-left: 2px;
            transition: transform .2s ease;
        }
        .v-repost-banner-chevron.open {
            transform: rotate(180deg);
        }
        .v-repost-pill-chevron {
            margin-left: 2px;
            transition: transform .2s ease;
        }
        .v-repost-pill-chevron.open {
            transform: rotate(180deg);
        }
        .v-repost-banner-comment {
            position: absolute;

        }

        .share-cancel-btn {
            width: calc(100% - 24px);
            margin: 4px 12px calc(12px + env(safe-area-inset-bottom));
            padding: 14px;
            border-radius: 14px;
            background: var(--inp-bg);
            border: none;
            color: var(--text);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: transform .12s ease, background .18s;
            position: relative;
            overflow: hidden;
        }
        .share-cancel-btn:active {
            transform: scale(.95);
        }
        .share-cancel-btn:hover {
            background: var(--bg4);
        }

        .share-ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
            transform: scale(0);
            animation: shareRipple .5s ease-out forwards;
            pointer-events: none;
        }
        @keyframes shareRipple {
            to {
                transform: scale(3);
                opacity: 0;
            }
        }

        .composer-body {
            padding: 16px 18px;
        }
        .composer-input {
            width: 100%;
            min-height: 90px;
            background: var(--inp-bg);
            border: 1px solid var(--sheet-bd);
            border-radius: 14px;
            padding: 12px 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        .composer-input::placeholder {
            color: var(--muted2);
        }
        .composer-actions {
            display: flex;
            gap: 10px;
            padding: 0 18px calc(16px + env(safe-area-inset-bottom));
        }
        .composer-btn {
            flex: 1;
            padding: 13px;
            border-radius: 100px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform .12s ease, background .18s;
            position: relative;
            overflow: hidden;
        }
        .composer-btn:active {
            transform: scale(.95);
        }
        .composer-btn.ghost {
            background: var(--inp-bg);
            color: var(--text);
        }
        .composer-btn.solid {
            background: var(--p);
            color: #fff;
        }
        .composer-btn.solid:hover {
            background: var(--pd);
        }

        .reaction-strip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 16px 20px 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .reaction-strip::-webkit-scrollbar {
            display: none;
        }
        .r-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 100px;
            background: rgba(255, 255, 255, .07);
            border: 1.5px solid rgba(255, 255, 255, .1);
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            transition: background .18s, border-color .18s, transform .12s;
            -webkit-tap-highlight-color: transparent;
        }
        .r-chip:active {
            transform: scale(.93);
        }
        .r-chip.active {
            background: rgba(255, 45, 45, .18);
            border-color: rgba(255, 45, 45, .4);
            color: var(--red);
        }
        .r-chip .emoji {
            font-size: 18px;
        }

        .reaction-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 8px;
            scrollbar-width: none;
        }
        .reaction-list::-webkit-scrollbar {
            display: none;
        }
        .r-user {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
        }
        .r-user-ava {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--bg4);
        }
        .r-user-info {
            flex: 1;
            min-width: 0;
        }
        .r-user-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }
        .r-user-handle {
            font-size: 12px;
            color: var(--muted);
        }
        .r-user-emoji {
            font-size: 20px;
        }
        .r-follow-btn {
            padding: 8px 18px;
            border-radius: 100px;
            background: #fff;
            color: #000;
            font-size: 13px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: background .18s, transform .12s;
            flex-shrink: 0;
        }
        .r-follow-btn:active {
            transform: scale(.95);
        }
        .r-follow-btn.following {
            background: transparent;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, .3);
        }

        .more-list {
            padding: 8px 12px calc(16px + env(safe-area-inset-bottom));
        }
        .more-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 8px;
            border-radius: 12px;
            background: none;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: background .18s;
            -webkit-tap-highlight-color: transparent;
        }
        .more-row:hover {
            background: rgba(255, 255, 255, .06);
        }
        .more-row-ico {
            width: 22px;
            height: 22px;
            stroke: var(--text);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .more-row-lbl {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        .more-row.danger .more-row-ico {
            stroke: var(--red);
        }
        .more-row.danger .more-row-lbl {
            color: var(--red);
        }
        .more-row-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 1px;
        }
        .more-follow-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 8px;
            border-radius: 12px;
            background: none;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: background .18s;
        }
        .more-follow-row:hover {
            background: rgba(255, 255, 255, .06);
        }
        .more-follow-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        #toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30, 30, 30, .95);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, .12);
            z-index: 400;
            opacity: 0;
            transition: opacity .25s, transform .25s;
            white-space: nowrap;
            pointer-events: none;
            backdrop-filter: blur(12px);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes heartBurst {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.4);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0;
            }
        }
        .heart-burst {
            position: absolute;
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 15;
            animation: heartBurst .55s cubic-bezier(.22, 1, .36, 1) forwards;
        }
        .heart-burst svg {
            width: 100%;
            height: 100%;
            fill: var(--red);
        }

        .v-skeleton {
            position: absolute;
            inset: 0;
            background: #111;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .v-skeleton-pulse {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .15);
            border-top-color: rgba(255, 255, 255, .6);
            animation: spin .9s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-videos {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: var(--bg);
            z-index: 1;
        }
        .empty-videos .empty-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .empty-videos .empty-icon svg {
            width: 36px;
            height: 36px;
            stroke: var(--p);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .empty-videos h3 {
            font-size: clamp(18px, 4vw, 22px);
            font-weight: 800;
            color: var(--text);
            margin-bottom: 8px;
        }
        .empty-videos p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            max-width: 300px;
        }
        .empty-videos .create-btn {
            margin-top: 16px;
            padding: 12px 28px;
            border-radius: 100px;
            background: linear-gradient(135deg, var(--p), var(--pd));
            color: #fff;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: opacity .15s, transform .15s;
        }
        .empty-videos .create-btn:hover {
            opacity: .85;
            transform: translateY(-1px);
        }

        @media (min-width: 768px) {
            .side-nav {
                display: flex;
            }
            .bottom-nav {
                display: none;
            }
            #feedTrack {
                padding-bottom: 0;
                padding-top: 70px;
            }
            .v-progress {
                bottom: 20px;
                opacity: 1;
            }
            .v-actions {
                bottom: 45px;
            }
            .v-info {
                bottom: 30px;
            }
        }
        @media (min-width: 1024px) {
            .side-nav {
                width: 82px;
            }
        }

        [data-theme="light"] .vt-tab {
            color: rgba(255, 255, 255, .6);
        }
        [data-theme="light"] .vt-tab.active {
            color: #fff;
        }
        [data-theme="light"] .vt-more {
            border-color: rgba(255, 255, 255, .3);
            background: rgba(0, 0, 0, .4);
        }
        [data-theme="light"] .v-action-lbl,
        [data-theme="light"] .v-caption,
        [data-theme="light"] .v-creator-name,
        [data-theme="light"] .v-post-time,
        [data-theme="light"] .v-music-tag {
            color: #fff;
        }
        [data-theme="light"] .v-music-tag {
            border-color: rgba(255, 255, 255, .15);
            background: rgba(255, 255, 255, .1);
        }
        [data-theme="light"] .v-music-tag svg {
            stroke: #fff;
        }
        [data-theme="light"] .v-avatar {
            border-color: rgba(255, 255, 255, .3);
        }
        [data-theme="light"] .v-plus-badge {
            border-color: #000;
        }
        [data-theme="light"] .v-progress::before {
            background: rgba(255, 255, 255, .2);
        }
        [data-theme="light"] .v-progress-fill {
            background: var(--p);
        }
        [data-theme="light"] .v-progress-thumb {
            background: #fff;
        }
        [data-theme="light"] .v-grad-top {
            background: linear-gradient(to bottom, rgba(0, 0, 0, .7) 0%, transparent 100%);
        }
        [data-theme="light"] .v-grad-bot {
            background: linear-gradient(to top, rgba(0, 0, 0, .9) 0%, rgba(0, 0, 0, .3) 60%, transparent 100%);
        }
        [data-theme="light"] .v-mute-badge {
            background: rgba(0, 0, 0, .5);
        }
        [data-theme="light"] .v-mute-badge svg {
            stroke: #fff;
        }
        [data-theme="light"] .v-see-more {
            color: rgba(255, 255, 255, .7);
        }
        [data-theme="light"] .v-see-more:hover {
            color: #fff;
        }
        [data-theme="light"] .v-disc {
            border-color: var(--p);
            background: #000;
        }
        [data-theme="light"] .v-disc-note {
            background: #111;
            border-color: rgba(255, 255, 255, .3);
        }
        [data-theme="light"] .v-disc-note svg {
            fill: #fff;
        }
        [data-theme="light"] .empty-videos {
            background: var(--bg);
        }
        [data-theme="light"] .empty-videos .empty-icon {
            background: var(--pdim);
            border-color: var(--pbrd);
        }
        [data-theme="light"] .empty-videos .empty-icon svg {
            stroke: var(--p);
        }
        [data-theme="light"] .empty-videos h3 {
            color: var(--text);
        }
        [data-theme="light"] .empty-videos p {
            color: var(--muted);
        }
        [data-theme="light"] .sheet-title,
        [data-theme="light"] .more-row-lbl,
        [data-theme="light"] .share-lbl,
        [data-theme="light"] .share-link-txt,
        [data-theme="light"] .r-chip,
        [data-theme="light"] .r-user-name,
        [data-theme="light"] .comment-username,
        [data-theme="light"] .comment-text,
        [data-theme="light"] .reply-username,
        [data-theme="light"] .reply-text,
        [data-theme="light"] .share-preview-caption {
            color: var(--text);
        }
        [data-theme="light"] .comment-inp {
            color: var(--text);
        }
        [data-theme="light"] .sheet-close svg {
            stroke: var(--text);
        }
        [data-theme="light"] .comment-avatar,
        [data-theme="light"] .reply-avatar-dot {
            background: var(--bg4);
            color: var(--muted);
        }
        [data-theme="light"] .more-row-ico {
            stroke: var(--text);
        }
        [data-theme="light"] .more-row.danger .more-row-ico {
            stroke: var(--red);
        }
        [data-theme="light"] .share-link-ico svg {
            stroke: var(--text);
        }
        [data-theme="light"] .v-action-btn svg {
            stroke: #fff;
        }
        [data-theme="light"] .v-action-btn.liked svg {
            fill: var(--red) !important;
            stroke: none !important;
        }
        [data-theme="light"] .v-action-btn.saved svg {
            fill: var(--gold) !important;
            stroke: var(--gold) !important;
        }
        [data-theme="light"] .sheet-sort-btn svg {
            stroke: var(--muted);
        }
        [data-theme="light"] .comment-icon-btn svg {
            stroke: var(--muted2);
        }
        [data-theme="light"] .comment-icon-btn:hover svg {
            stroke: var(--text);
        }
        [data-theme="light"] .like-heart {
            stroke: var(--muted2);
        }
        [data-theme="light"] .comment-like-btn.liked .like-heart {
            stroke: var(--red);
            fill: var(--red);
        }
        [data-theme="light"] .share-preview-handle {
            color: var(--muted);
        }
        [data-theme="light"] .share-cancel-btn {
            background: var(--inp-bg);
            color: var(--text);
        }
        [data-theme="light"] .share-cancel-btn:hover {
            background: var(--bg4);
        }
        [data-theme="light"] .composer-btn.ghost {
            background: var(--inp-bg);
            color: var(--text);
        }
        [data-theme="light"] .composer-btn.solid {
            background: var(--p);
            color: #fff;
        }
        [data-theme="light"] .add-post-btn {
            background: var(--p);
        }
        [data-theme="light"] .add-post-btn svg {
            stroke: #fff;
        }
        [data-theme="light"] .nav-item.active svg {
            stroke: var(--p);
        }
        [data-theme="light"] .nav-item.active span {
            color: var(--p);
        }
        [data-theme="light"] #sortMenuPopover {
            background: var(--sheet-bg);
            border-color: var(--sheet-bd);
        }
        [data-theme="light"] #sortMenuPopover .sort-option {
            color: var(--text);
        }
        [data-theme="light"] #sortMenuPopover .sort-option:not(:last-child) {
            border-color: var(--sheet-bd);
        }
        [data-theme="light"] #sortMenuPopover .sort-option:hover {
            background: var(--rowh);

</head>
<body>

    <div class="layout">

        <!-- ════ SIDE NAV ════ -->
        <nav class="side-nav">
            <div class="side-logo"><a href="index.html">◈</a></div>
            <a href="index.html" class="side-btn">
                <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
                <span>Home</span>
            </a>
            <a href="search.html" class="side-btn">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>Search</span>
            </a>
            <a href="chat.html" class="side-btn">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>Chat</span>
                <div class="side-badge"></div>
            </a>
            <a href="create.html" class="side-btn">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span>Create</span>
            </a>
            <a href="video.html" class="side-btn active">
                <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                <span>Video</span>
            </a>
            <div class="side-gap"></div>
            <a href="profile.html" class="side-btn" id="sideProfileBtn">
                <img class="side-av" id="sideAv" src="" alt="" onerror="this.style.display='none'" />
                <span>Profile</span>
            </a>
        </nav>

        <!-- ════ MAIN ════ -->
        <div class="main" id="mainScroll">
            <div class="video-topbar">
                <div class="vt-tabs">
                    <button class="vt-tab active" data-tab="foryou" onclick="switchFeedTab('foryou')">For You</button>
                    <button class="vt-tab" data-tab="following" onclick="switchFeedTab('following')">Following</button>
                </div>
                <button class="vt-more" onclick="openMore(_curIdx)">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="1.6" fill="#fff" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="#fff" stroke="none"/><circle cx="12" cy="18" r="1.6" fill="#fff" stroke="none"/></svg>
                </button>
            </div>
            <div id="feedTrack"></div>
            <div class="empty-videos" id="emptyState" style="display:none;">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                </div>
                <h3>No Videos Yet</h3>
                <p>Videos you create or share will appear here. Upload your first video now!</p>
                <button class="create-btn" onclick="window.location.href='create.html'">Create Video</button>
            </div>
        </div>

        <!-- ════ BOTTOM NAV ════ -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
                <span>Home</span>
            </a>
            <a href="search.html" class="nav-item">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>Search</span>
            </a>
            <button class="add-post-btn" aria-label="Create" onclick="window.location.href='create.html'">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <a href="video.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                <span>Video</span>
            </a>
            <a href="profile.html" class="nav-item" id="navProfileBtn">
                <img class="nav-av" id="navAv" src="" alt="" onerror="this.style.background='linear-gradient(135deg,#1a1035,#3b1a6b)'" />
                <span>Profile</span>
            </a>
        </nav>

    </div>

    <!-- ══════════════════════════════════════════════════════
    BACKDROP
    ══════════════════════════════════════════════════════ -->
    <div class="sheet-backdrop" id="backdrop" onclick="closeAllSheets()"></div>

    <!-- ══════════════════════════════════════════════════════
    COMMENT SHEET
    ══════════════════════════════════════════════════════ -->
    <div class="sheet" id="commentSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-hdr">
            <span class="sheet-title" id="commentCount">0 comments</span>
            <button class="sheet-sort-btn" onclick="toggleSortMenu()">
                <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
            </button>
            <button class="sheet-close" onclick="closeSheet('commentSheet')">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div id="reply-context-banner">
            <span>Replying to</span>
            <span id="reply-context-username"></span>
            <button id="reply-cancel-btn" onclick="cancelReply()">✕</button>
        </div>
        <div class="sheet-body" id="commentBody">
            <div id="comments-list"></div>
        </div>
        <div class="comment-inp-row">
            <img class="comment-inp-ava" id="commentUserAvatar" src="" alt="" onerror="this.style.display='none'" />
