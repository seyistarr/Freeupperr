    <script>
        (function() {
            'use strict';

            // ───────────────────────────────────────────────────────────────
            // STATE
            // ───────────────────────────────────────────────────────────────
            let targetUserId = null;
            let isOwner = false;
            let currentUser = null;
            let targetUser = null;
            let allPosts = [];
            let activeTab = 'posts';
            let selAvIdx = -1;
            let selCountry = '';
            let selGender = '';
            let pendingPills = [];
            let dobSel = { month: null, day: null, year: null };

            // ─── FOLLOW MODAL STATE ──────────────────────────
            let followersList = [];
            let followingList = [];
            let friendsList = [];
            let suggestionsList = [];
            let _fwPageIdx = 0;
            let _fwPageState = [
                { list: [], query: '', loaded: false },
                { list: [], query: '', loaded: false },
                { list: [], query: '', loaded: false },
                { list: [], query: '', loaded: false }
            ];
            let _fwCurTab = 'followers';
            let _fwFiltered = [];
            let _fwList = [];
            const FW_ROW_H = 76;
            const FW_BUFFER = 4;

            // ─── HELPERS ────────────────────────────────────────
            function fmtNum(n) {
                if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
                if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
                return String(n);
            }

            function escapeHtml(s) {
                const d = document.createElement('div');
                d.textContent = s || '';
                return d.innerHTML;
            }

            function getAvatar(u) {
                return u?.avatar_url || u?.avatar || 'data:image/svg+xml,' + encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#E5E7EB"/><circle cx="50" cy="38" r="16" fill="#9CA3AF"/><ellipse cx="50" cy="75" rx="30" ry="22" fill="#9CA3AF"/></svg>'
                );
            }

            function formatRelativeTime(iso) {
                const now = Date.now(),
                    then = new Date(iso).getTime(),
                    diff = Math.floor((now - then) / 1000);
                if (diff < 60) return 'Just now';
                if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                if (diff < 172800) return 'Yesterday';
                if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
                return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            // ─── GET CURRENT USER ──────────────────────────────────
            function getCurrentUser() {
                if (window.AuthUser && window.AuthUser.getCurrentUser) {
                    return window.AuthUser.getCurrentUser();
                }
                return null;
            }

            // ─── GET TARGET USER ID ──────────────────────────────
            function getTargetUserFromUrl() {
                const params = new URLSearchParams(window.location.search);
                const uid = params.get('uid');
                if (uid) return uid;
                return null;
            }

            // ─── FETCH PROFILE ────────────────────────────────────
            async function fetchProfile(userId) {
                const { data, error } = await window.sb
                    .from('profiles')
                    .select('*')
                    .eq('id', userId)
                    .single();
                if (error) throw error;
                return data;
            }

            // ─── FETCH FOLLOW COUNTS ─────────────────────────────
            async function fetchFollowCounts(userId) {
                const { count: followers, error: e1 } = await window.sb
                    .from('follows')
                    .select('*', { count: 'exact', head: true })
                    .eq('following_id', userId);

                const { count: following, error: e2 } = await window.sb
                    .from('follows')
                    .select('*', { count: 'exact', head: true })
                    .eq('follower_id', userId);

                if (e1 || e2) throw e1 || e2;
                return { followers: followers || 0, following: following || 0 };
            }

            // ─── FETCH FOLLOWERS / FOLLOWING LISTS ──────────────
            async function fetchFollowers(userId) {
                const { data, error } = await window.sb
                    .from('follows')
                    .select('follower_id, profiles:follower_id (id, username, display_name, avatar_url, verified)')
                    .eq('following_id', userId);
                if (error) throw error;
                return data.map(f => f.profiles).filter(p => p);
            }

            async function fetchFollowing(userId) {
                const { data, error } = await window.sb
                    .from('follows')
                    .select('following_id, profiles:following_id (id, username, display_name, avatar_url, verified)')
                    .eq('follower_id', userId);
                if (error) throw error;
                return data.map(f => f.profiles).filter(p => p);
            }

            // ─── CHECK / TOGGLE FOLLOW ───────────────────────────
            async function isFollowing(followerId, targetId) {
                const { data, error } = await window.sb
                    .from('follows')
                    .select('id')
                    .eq('follower_id', followerId)
                    .eq('following_id', targetId)
                    .maybeSingle();
                if (error) throw error;
                return !!data;
            }

            async function toggleFollow(targetId) {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) {
                    showToast('Please sign in to follow', 'o');
                    return false;
                }
                const currently = await isFollowing(user.id, targetId);
                if (currently) {
                    await window.sb
                        .from('follows')
                        .delete()
                        .eq('follower_id', user.id)
                        .eq('following_id', targetId);
                } else {
                    await window.sb
                        .from('follows')
                        .insert({ follower_id: user.id, following_id: targetId });
                }
                return !currently;
            }

            // ─── FETCH USER LIKES / BOOKMARKS / SHARES ──────────
            async function getUserLikes(userId) {
                const { data, error } = await window.sb
                    .from('post_likes')
                    .select('post_id')
                    .eq('user_id', userId);
                if (error) throw error;
                return data.map(l => l.post_id);
            }

            async function getUserBookmarks(userId) {
                const { data, error } = await window.sb
                    .from('bookmarks')
                    .select('post_id')
                    .eq('user_id', userId);
                if (error) throw error;
                return data.map(b => b.post_id);
            }

            async function getUserShares(userId) {
                const { data, error } = await window.sb
                    .from('shares')
                    .select('post_id')
                    .eq('user_id', userId);
                if (error) throw error;
                return data.map(s => s.post_id);
            }

            // ─── FETCH USER MARKET ITEMS ─────────────────────────
            async function getUserMarketItems(userId) {
                const { data, error } = await window.sb
                    .from('market_items')
                    .select('*')
                    .eq('seller_id', userId)
                    .order('created_at', { ascending: false });
                if (error) throw error;
                return data || [];
            }

            // ─── LOAD POSTS (via PostsAPI) ───────────────────────
            async function loadPosts() {
                try {
                    const posts = await window.PostsAPI.loadAllPosts();
                    allPosts = posts;
                    return posts;
                } catch (err) {
                    console.error('Failed to load posts:', err);
                    showToast('Failed to load posts', 'r');
                    return [];
                }
            }

            function getUserPosts(userId) {
                return allPosts.filter(p => p.authorId === userId);
            }

            // ─── RENDER PROFILE ──────────────────────────────────
            async function renderProfile() {
                const user = getCurrentUser();
                currentUser = user;

                let targetId = getTargetUserFromUrl();
                if (!targetId) {
                    if (user && user.isLoggedIn) {
                        targetId = user.id;
                    } else {
                        window.location.href = 'index.html';
                        return;
                    }
                }

                targetUserId = targetId;
                isOwner = targetId === user?.id;

                try {
                    const profile = await fetchProfile(targetId);
                    targetUser = profile;
                    const counts = await fetchFollowCounts(targetId);
                    await loadPosts();
                    const userPosts = getUserPosts(targetId);

                    let likedIds = [],
                        bookmarkedIds = [],
                        sharedIds = [];
                    if (isOwner && user && user.isLoggedIn) {
                        likedIds = await getUserLikes(targetId);
                        bookmarkedIds = await getUserBookmarks(targetId);
                        sharedIds = await getUserShares(targetId);
                    }
                    const marketItems = await getUserMarketItems(targetId);

                    updateProfileUI(profile, counts, userPosts, likedIds, bookmarkedIds, sharedIds, marketItems);

                } catch (err) {
                    console.error('Error rendering profile:', err);
                    showToast('Failed to load profile', 'r');
                }
            }

            // ─── UPDATE UI ───────────────────────────────────────
            function updateProfileUI(profile, counts, userPosts, likedIds, bookmarkedIds, sharedIds, marketItems) {
                const avatarSrc = getAvatar(profile);
                document.getElementById('profileAvatar').src = avatarSrc;
                document.getElementById('editAv').src = avatarSrc;
                document.getElementById('qrAvatar').src = avatarSrc;
                updateNavAvatar();

                document.getElementById('displayName').textContent = profile.display_name || 'Guest';
                document.getElementById('headerUsername').textContent = profile.username || '@user';
                document.getElementById('qrName').textContent = profile.display_name || 'Guest';
                document.getElementById('qrHandle').textContent = '@' + (profile.username || 'user');

                const bioEl = document.getElementById('heroBio');
                bioEl.textContent = profile.bio || (isOwner ? 'No bio yet. Tap edit to add one.' : 'No bio yet.');

                const tags = profile.tags || [];
                document.getElementById('roleTags').innerHTML = tags.map(t =>
                    `<span class="role-tag">${escapeHtml(t)}</span>`
                ).join('');

                const badge = document.getElementById('verifiedBadge');
                if (profile.verified) {
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }

                document.getElementById('statPosts').textContent = fmtNum(userPosts.length);
                document.getElementById('statFollowers').textContent = fmtNum(counts.followers);
                document.getElementById('statFollowing').textContent = fmtNum(counts.following);

                renderActionRow();

                document.getElementById('fsTabFCount').textContent = fmtNum(counts.followers);
                document.getElementById('fsTabFgCount').textContent = fmtNum(counts.following);
                document.getElementById('fsTabFrCount').textContent = fmtNum(0); // we'll compute later

                const ownerTabs = document.querySelectorAll('.fw-owner-only');
                ownerTabs.forEach(t => t.style.display = isOwner ? '' : 'none');
                if (isOwner) document.getElementById('followModal').classList.add('is-owner');
                else document.getElementById('followModal').classList.remove('is-owner');

                renderTab(activeTab, { userPosts, likedIds, bookmarkedIds, sharedIds, marketItems });
            }

            // ─── ACTION ROW ──────────────────────────────────────
            function renderActionRow() {
                const row = document.getElementById('actionRow');
                if (isOwner) {
                    row.innerHTML = '';
                    return;
                }
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) {
                    row.innerHTML =
                        `<button class="act-btn act-follow" onclick="showToast('Please sign in to follow','o')">Follow</button>
                                    <button class="act-btn act-msg" onclick="showToast('Messaging coming soon','p')">Message</button>`;
                    return;
                }
                isFollowing(user.id, targetUserId).then(following => {
                    row.innerHTML = `
                                <button class="act-btn ${following ? 'act-follow fstate' : 'act-follow'}" id="followBtn" onclick="handleFollow()">
                                    ${following ? 'Following' : 'Follow'}
                                </button>
                                <button class="act-btn act-msg" onclick="showToast('Messaging coming soon','p')">Message</button>
                            `;
                }).catch(() => {
                    row.innerHTML =
                    `<button class="act-btn act-follow" onclick="handleFollow()">Follow</button>
                                <button class="act-btn act-msg" onclick="showToast('Messaging coming soon','p')">Message</button>`;
                });
            }

            window.handleFollow = async function() {
                const user = getCurrentUser();
                if (!user || !user.isLoggedIn) {
                    showToast('Please sign in to follow', 'o');
                    return;
                }
                const newState = await toggleFollow(targetUserId);
                renderActionRow();
                const counts = await fetchFollowCounts(targetUserId);
                document.getElementById('statFollowers').textContent = fmtNum(counts.followers);
                document.getElementById('statFollowing').textContent = fmtNum(counts.following);
                showToast(newState ? 'Following ✓' : 'Unfollowed', newState ? 'g' : 'o');
            };

            // ─── TABS ─────────────────────────────────────────────
            window.switchTab = function(el, tab) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + tab).classList.add('active');
                activeTab = tab;
                renderTab(tab);
            };

            function renderTab(tab, data) {
                const container = document.getElementById('panel-' + tab);
                if (!container) return;
                const userPosts = data?.userPosts || getUserPosts(targetUserId);
                const likedIds = data?.likedIds || [];

            // ─── QR SCANNER (unchanged) ─────────────────────────
            let camStream = null;
            let scanRAF = null;

            window.showScanView = function() {
                document.getElementById('shareQRView').style.display = 'none';
                document.getElementById('shareScanView').style.display = 'flex';
                startCamera();
            };

            window.stopCameraAndShowQR = function() {
                stopCamera();
                document.getElementById('shareQRView').style.display = 'flex';
                document.getElementById('shareScanView').style.display = 'none';
                generateQRCode();
            };

            function startCamera() {
                const video = document.getElementById('scanVideo');
                const canvas = document.getElementById('scanCanvas');
                stopCamera();
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showScanStatus('Camera not supported', 'rgba(248,113,113,.85)');
                    return;
                }
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                }).then(stream => {
                    camStream = stream;
                    video.srcObject = stream;
                    video.play();
                    video.style.display = 'block';
                    tickQR(video, canvas);
                }).catch(err => {
                    console.warn('Camera error:', err);
                    showScanStatus('Could not access camera', 'rgba(248,113,113,.85)');
                });
            }

            function stopCamera() {
                if (scanRAF) { cancelAnimationFrame(scanRAF);
                    scanRAF = null; }
                if (camStream) { camStream.getTracks().forEach(t => t.stop());
                    camStream = null; }
                const video = document.getElementById('scanVideo');
                if (video) video.srcObject = null;
            }

            function tickQR(video, canvas) {
                if (!camStream) return;
                const tick = () => {
                    if (!camStream || video.readyState < 2) { scanRAF = requestAnimationFrame(tick); return; }
                    const w = video.videoWidth,
                        h = video.videoHeight;
                    if (!w || !h) { scanRAF = requestAnimationFrame(tick); return; }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, w, h);
                    let code = null;
                    try {
                        if (typeof jsQR === 'function') {
                            code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
                        }
                    } catch (e) {}
                    if (code && code.data) { onQRDetected(code.data); return; }
                    scanRAF = requestAnimationFrame(tick);
                };
                scanRAF = requestAnimationFrame(tick);
            }

            function onQRDetected(data) {
                stopCamera();
                document.querySelectorAll('.scan-corner').forEach(c => {
                    c.style.transition = 'border-color .2s';
                    c.style.borderColor = '#4ade80';
                    setTimeout(() => { c.style.borderColor = '';
                        c.style.transition = ''; }, 700);
                });
                const match = data.match(/^https?:\/\/(www\.)?freeupper\.vercel\.app\/@([a-zA-Z0-9_.]+)$/);
                if (match) {
                    const username = match[2];
                    showScanStatus('✓ Found @' + username, 'rgba(74,222,128,.9)');
                    setTimeout(() => {
                        stopCameraAndShowQR();
                        window.location.href = '/@' + username;
                    }, 900);
                } else {
                    showScanStatus('Not a valid Freeupper QR code', 'rgba(248,113,113,.85)');
                    setTimeout(() => { if (!camStream) startCamera(); }, 1800);
                }
            }

            function showScanStatus(msg, color) {
                const el = document.getElementById('scanStatus');
                if (!el) return;
                el.textContent = msg;
                el.style.background = color || 'rgba(0,0,0,.7)';
                el.style.display = 'block';
                clearTimeout(el._t);
                el._t = setTimeout(() => { el.style.display = 'none'; }, 2800);
            }

            window.scanGalleryQR = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = '';
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        let code = null;
                        try {
                            if (typeof jsQR === 'function') {
                                code = jsQR(ctx.getImageData(0, 0, img.width, img.height).data, img.width, img.height);
                            }
                        } catch (ex) {}
                        if (code && code.data) { onQRDetected(code.data); } else { showToast(
                                'No valid Freeupper QR code found', 'o'); }
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };

            window.saveProfile = async function() {
                const dn = document.getElementById('eDN').value.trim();

                const bio = document.getElementById('eBio').value.trim();
                const user = getCurrentUser();

                const updates = {
                    display_name: dn || 'Guest',
                    username: un || 'user',
                    bio: bio,
                    tags: pendingPills.slice(),
                    gender: selGender,
                    country: selCountry

                if (dobSel.month && dobSel.day && dobSel.year) {
                    const d = new Date(dobSel.year, dobSel.month - 1, dobSel.day);
                    updates.dob = d.toISOString();
                }

                try {
                    const { error } = await window.sb
                        .from('profiles')
                        .update(updates)
                        .eq('id', user.id);
                    if (error) throw error;
                    if (typeof updateUserProfile === 'function') {
                        const localUpdates = {
                            displayName: updates.display_name,
                            username: updates.username,
                            bio: updates.bio,
                            tags: updates.tags,
                            gender: updates.gender,
                            country: updates.country,
                            dob: updates.dob
                        };
                        updateUserProfile(localUpdates);

            // ─── FOLLOW MODAL ──────────────────────────────────
            async function fetchFollowLists(userId) {
                const followers = await fetchFollowers(userId);
                const following = await fetchFollowing(userId);
                const followingIds = new Set(following.map(u => u.id));
                const friends = followers.filter(u => followingIds.has(u.id));

                const current = getCurrentUser();
                let suggestions = [];
                if (current && current.isLoggedIn && current.id !== userId) {
                    const followedIds = new Set([userId, ...followingIds]);
                    const { data, error } = await window.sb
                        .from('profiles')
                        .select('id, username, display_name, avatar_url, verified')
                        .not('id', 'in', `(${[...followedIds].join(',')})`)
                        .limit(10);
                    if (!error) suggestions = data;
                }
                return { followers, following, friends, suggestions };
            }

            let followModalData = null;

            window.openFollowModal = async function(tab) {
                tab = tab || 'followers';
                if (!followModalData) {
                    try {
                        followModalData = await fetchFollowLists(targetUserId);
                    } catch (err) {
                        showToast('Failed to load followers', 'r');
                        return;
                    }
                }
                openFS('followModal');
                const idx = ['followers', 'following', 'friends', 'suggestions'].indexOf(tab);
                if (idx < 0) idx = 0;
                if (!isOwner && idx > 1) idx = 0;
                tabTap(idx);
                requestAnimationFrame(() => { _fwPositionBar(idx); });
            };

            function tabTap(idx) {
                idx = Math.max(0, Math.min(idx, 3));
                _fwPageIdx = idx;
                const tabs = ['followers', 'following', 'friends', 'suggestions'];
                _fwCurTab = tabs[idx];

                let dataSource = [];
                if (followModalData) {
                    if (idx === 0) dataSource = followModalData.followers;
                    else if (idx === 1) dataSource = followModalData.following;
                    else if (idx === 2) dataSource = followModalData.friends;
                    else if (idx === 3) dataSource = followModalData.suggestions;
                }
                _fwList = dataSource.map(u => ({
                    id: u.id,
                    displayName: u.display_name || u.username,
                    handle: '@' + (u.username || ''),
                    avatar: u.avatar_url || '',
                    verified: u.verified || false,
                    isFollowing: false,
                    isMutual: false
                }));
                _fwPageState[idx].loaded = true;

                for (let i = 0; i < 4; i++) {
                    const pg = document.getElementById('fsPage' + i);
                    if (pg) pg.classList.toggle('active', i === idx);
                }

                _fwPositionBar(idx);
                _fwApplyFilter();
                _fwRenderVisible();
            }

            function _fwPositionBar(idx) {
                const tabIds = ['fsTabF', 'fsTabFg', 'fsTabFr', 'fsTabSg'];
                const titles = ['Followers', 'Following', 'Friends', 'Suggestions'];
                for (let t = 0; t < tabIds.length; t++) {
                    const el = document.getElementById(tabIds[t]);
                    if (el) el.classList.toggle('active', t === idx);
                }
                const titleEl = document.getElementById('fsTitle');
                if (titleEl) titleEl.textContent = titles[idx] || titles[0];

                const bar = document.getElementById('fsTabBar');
                const tabsEl = document.getElementById('fsTabs');
                if (!bar || !tabsEl) return;
                const btn = document.getElementById(tabIds[idx]);
                if (!btn) return;
                const wrapRect = tabsEl.getBoundingClientRect();
                const btnRect = btn.getBoundingClientRect();
                const L = btnRect.left - wrapRect.left;
                const W = btnRect.width;
                bar.style.left = (L + W * 0.25) + 'px';
                bar.style.width = (W * 0.5) + 'px';
            }

            function _fwApplyFilter() {
                const q = _fwPageState[_fwPageIdx].query || '';
                if (!q) {
                    _fwFiltered = _fwList.slice();
                } else {
                    const q2 = q.toLowerCase();
                    _fwFiltered = _fwList.filter(u =>
                        (u.displayName || '').toLowerCase().includes(q2) ||
                        (u.handle || '').toLowerCase().includes(q2)
                    );
                }
            }

            function _fwRenderVisible() {
                const listEl = document.getElementById('fsList' + _fwPageIdx);
                const wrapEl = document.getElementById('fsVirtualWrap' + _fwPageIdx);
                const contentEl = document.getElementById('fsVirtualContent' + _fwPageIdx);
                if (!listEl || !wrapEl || !contentEl) return;

                const data = _fwFiltered;
                const total = data.length;

                if (total === 0) {
                    wrapEl.style.height = '0';
                    contentEl.innerHTML =
                        `<div class="fw-empty"><div class="fw-empty-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><h3>No ${_fwCurTab}</h3><p>No ${_fwCurTab} found.</p></div>`;
                    return;
                }

                const rowH = (_fwCurTab === 'suggestions') ? 88 : 72;
                wrapEl.style.height = (total * rowH) + 'px';

                const scrollTop = listEl.scrollTop;
                const vh = listEl.clientHeight || window.innerHeight * 0.75;
                const startIdx = Math.max(0, Math.floor(scrollTop / rowH) - FW_BUFFER);
                const endIdx = Math.min(total, Math.ceil((scrollTop + vh) / rowH) + FW_BUFFER);

                let html = '';
                const isSugg = (_fwCurTab === 'suggestions');

                for (let i = startIdx; i < endIdx; i++) {
                    const u = data[i];
                    const top = i * rowH;
                    const d = 'data-uid="' + (u.id || '') + '" data-fidx="' + i + '"';
                    const tp = 'onclick="_fwTap(this)"';

                    if (isSugg) {
                        const srcLbl = u.source || 'People you may know';
                        html += `<div class="u-row u-row-suggestion" style="position:absolute;top:${top}px;left:0;right:0;height:${rowH}px;box-sizing:border-box;padding:0 clamp(14px,5vw,24px)">
                                    <div class="u-av" style="background:var(--bg4);flex-shrink:0">${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : '&#x1F464;'}</div>
                                    <div class="u-info">
                                        <div class="u-name">${u.displayName || ''}${u.verified ? '<span class="mini-badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></span>' : ''}</div>
                                        <div class="u-handle">${u.handle || ''}</div>
                                        <div class="u-sugg-src">${srcLbl}</div>
                                    </div>
                                    <div class="u-sugg-actions" style="display:flex;gap:8px;flex-shrink:0">
                                        <button class="u-btn" ${d} data-action="toggle-follow" ${tp}>Follow</button>
                                        <button class="u-btn-sugg-remove" ${d} data-action="remove" ${tp}><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                                    </div>
                                </div>`;
                    } else {
                        let actionHtml = _fwRowAction(u, i);
                        html += `<div class="u-row" data-row-idx="${i}" style="position:absolute;top:${top}px;left:0;right:0;height:${rowH}px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 clamp(14px,5vw,24px)">
                                    <div class="u-av" style="background:var(--bg4);flex-shrink:0">${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : '&#x1F464;'}</div>
                                    <div class="u-info">
                                        <div class="u-name">${u.displayName || ''}${u.verified ? '<span class="mini-badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></span>' : ''}</div>
                                        <div class="u-handle">${u.handle || ''}</div>
                                    </div>
                                    ${actionHtml}
                                </div>`;
                    }
                }
                contentEl.innerHTML = html;
            }

            function _fwRowAction(u, idx) {
                const d = 'data-uid="' + (u.id || '') + '" data-fidx="' + idx + '"';
                const tp = 'onclick="_fwTap(this)"';

                if (_fwCurTab === 'friends') {
                    return `<button class="u-btn-msg" ${d} data-action="message" ${tp}><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Message</button>`;
                }
                if (_fwCurTab === 'suggestions') {
                    return `<div style="display:flex;gap:8px;flex-shrink:0">
                                <button class="u-btn" ${d} data-action="toggle-follow" ${tp}>Follow</button>
                                <button class="u-btn-sugg-remove" ${d} data-action="remove" ${tp}><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                            </div>`;
                }
                if (_fwCurTab === 'followers') {
                    const isMutual = followModalData?.following.some(f => f.id === u.id) || false;
                    if (isMutual) {
                        return `<button class="u-btn friends" ${d} data-action="unfriend" ${tp}>Friends</button>`;
                    }
                    return `<button class="u-btn follow-back" ${d} data-action="follow-back" ${tp}>Follow Back</button>`;
                }
                if (_fwCurTab === 'following') {
                    const isMutual = followModalData?.followers.some(f => f.id === u.id) || false;
                    if (isMutual) {
                        return `<button class="u-btn friends" ${d} data-action="unfriend" ${tp}>Friends</button>`;
                    }
                    return `<button class="u-btn following" ${d} data-action="unfollow" ${tp}>Following</button>`;
                }
                return '';
            }

            window._fwTap = function(btn) {
                if (btn.classList.contains('pending')) return;
                const action = btn.getAttribute('data-action') || 'toggle-follow';
                const fidx = parseInt(btn.getAttribute('data-fidx'), 10);
                const user = _fwFiltered[fidx];
                if (!user) return;

                window.AuthUser.requireAuth(async () => {
                    try {
                        if (action === 'follow-back' || action === 'toggle-follow') {
                            const newState = await toggleFollow(user.id);
                            btn.textContent = newState ? 'Following' : 'Follow';
                            btn.className = 'u-btn' + (newState ? ' following' : '');
                            btn.setAttribute('data-action', newState ? 'unfollow' : 'follow-back');
                            showToast(newState ? 'Following ✓' : 'Unfollowed');
                            followModalData = await fetchFollowLists(targetUserId);
                            tabTap(_fwPageIdx);
                            const counts = await fetchFollowCounts(targetUserId);
                            document.getElementById('statFollowers').textContent = fmtNum(counts.followers);
                            document.getElementById('statFollowing').textContent = fmtNum(counts.following);
                        } else if (action === 'unfollow') {
                            await toggleFollow(user.id);
                            btn.textContent = 'Follow';
                            btn.className = 'u-btn';
                            btn.setAttribute('data-action', 'follow-back');
                            showToast('Unfollowed');
                            followModalData = await fetchFollowLists(targetUserId);
                            tabTap(_fwPageIdx);
                            const counts = await fetchFollowCounts(targetUserId);
                            document.getElementById('statFollowers').textContent = fmtNum(counts.followers);
                            document.getElementById('statFollowing').textContent = fmtNum(counts.following);
                        } else if (action === 'unfriend') {
                            await toggleFollow(user.id);
                            showToast('Unfriended');
                            followModalData = await fetchFollowLists(targetUserId);
                            tabTap(_fwPageIdx);
                            const counts = await fetchFollowCounts(targetUserId);
                            document.getElementById('statFollowers').textContent = fmtNum(counts.followers);
                            document.getElementById('statFollowing').textContent = fmtNum(counts.following);
                        } else if (action === 'remove') {
                            _fwList = _fwList.filter(u => u.id !== user.id);
                            _fwApplyFilter();
                            _fwRenderVisible();
                            showToast('Removed suggestion', 'o');
                        } else if (action === 'message') {
                            showToast('Messaging coming soon 💬', 'p');
                        }
                    } catch (err) {
                        showToast(err.message, 'r');
                    }
                });
            };

                const ys = document.getElementById('dobYearScroll');
                const years = [];
                for (let y = curY - 13; y >= curY - 120; y--) years.push(y);
                ys.innerHTML = years.map(y =>
                    `<div class="dob-item${dobSel.year===y ? ' sel' : ''}" onclick="selDOB('year',${y},this)">${y}</div>`
                ).join('');
                if (dobSel.month) scrollToDOB(ms, dobSel.month - 1);
                if (dobSel.day) scrollToDOB(ds, dobSel.day - 1);
                if (dobSel.year) scrollToDOB(ys, years.indexOf(dobSel.year));
                updateDOBResult();
            }

            function scrollToDOB(container, idx) {
                const itemH = 48;
                container.scrollTop = Math.max(0, idx * itemH - container.clientHeight / 2 + itemH / 2);
            }

            window.selDOB = function(field, val, el) {
                dobSel[field] = val;
                const scroll = el.closest('.dob-scroll');
                scroll.querySelectorAll('.dob-item').forEach(i => i.classList.remove('sel'));
                el.classList.add('sel');
                const idx = Array.from(scroll.querySelectorAll('.dob-item')).indexOf(el);
                scrollToDOB(scroll, idx);
                updateDOBResult();
            };

            function updateDOBResult() {
                const res = document.getElementById('dobResult');
                const warn = document.getElementById('dobWarn');
                const saveBtn = document.getElementById('dobSaveBtn');
                if (!dobSel.month || !dobSel.day || !dobSel.year) {
                    res.textContent = 'Select your date of birth above';
                    warn.style.display = 'none';
                    if (saveBtn) saveBtn.disabled = false;
                    return;
                }
                const dob = new Date(dobSel.year, dobSel.month - 1, dobSel.day);
                const today = new Date();
                let age = today.getFullYear() - dob.getFullYear();
                const mDiff = today.getMonth() - dob.getMonth();
                if (mDiff < 0 || (mDiff === 0 && today.getDate() < dob.getDate())) age--;
                const dateStr = MONTHS[dobSel.month - 1] + ' ' + dobSel.day + ', ' + dobSel.year;
                if (age < 13) {
                    res.innerHTML =
                        `<span style="color:var(--danger);font-weight:700">${dateStr}</span><br><span style="font-size:12px;color:var(--muted)">That makes you ${age} years old</span>`;
                    warn.style.display = 'flex';
                    if (saveBtn) saveBtn.disabled = true;
                } else {
                    res.innerHTML =
                        `<span style="color:var(--ok);font-weight:700">${dateStr}</span><br><span style="font-size:12px;color:var(--muted)">Age: ${age} years old</span>`;
                    warn.style.display = 'none';
                    if (saveBtn) saveBtn.disabled = false;
                }
            }

            window.saveDOB = function() {
                if (!dobSel.month || !dobSel.day || !dobSel.year) { showToast('Please select your full date of birth',
                        'o'); return; }
                const dob = new Date(dobSel.year, dobSel.month - 1, dobSel.day);
                const today = new Date();
                let age = today.getFullYear() - dob.getFullYear();
                const mDiff = today.getMonth() - dob.getMonth();
                if (mDiff < 0 || (mDiff === 0 && today.getDate() < dob.getDate())) age--;
                if (age < 13) { showToast('You must be at least 13 years old', 'r'); return; }
                const dateStr = MONTHS[dobSel.month - 1] + ' ' + dobSel.day + ', ' + dobSel.year;
                const disp = document.getElementById('eDOBDisplay');
                const hint = document.getElementById('dobAgeHint');
                if (disp) { disp.textContent = dateStr;
                    disp.style.color = 'var(--text)'; }
                if (hint) hint.textContent = 'Age: ' + age + ' years old';
                closeFS('dobModal');
                showToast('Date of birth saved ✓', 'g');
            };

            // ─── GENDER MODAL ────────────────────────────────────
            window.openGenderModal = function() {
                document.querySelectorAll('.gen-opt').forEach(o => {
                    const isSel = o.dataset.val === selGender;
                    o.classList.toggle('sel', isSel);
                    const existing = o.querySelector('.gen-check');
                    if (isSel && !existing) {
                        const chk = document.createElement('div');
                        chk.className = 'gen-check';
                        chk.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
                        o.appendChild(chk);
                    } else if (!isSel && existing) { existing.remove(); }
                });
                openMov('genderOverlay');
            };

            window.pickGender = function(el) {
                selGender = el.dataset.val;
                const icons = { '': '', 'Male': '♂', 'Female': '♀', 'Non-binary': '⚧', 'Genderfluid': '≈',
                    'Other': '✦' };
                const disp = document.getElementById('eGenderDisplay');
                if (disp) { disp.textContent = (icons[selGender] || '') + ' ' + (selGender || 'Prefer not to say');
                    disp.style.color = 'var(--text)'; }
                closeMov('genderOverlay');
            };

            function openMov(id) { document.getElementById(id).classList.add('open');
                document.body.style.overflow = 'hidden'; }

            function closeMov(id) { document.getElementById(id).classList.remove('open');
                document.body.style.overflow = ''; }

            document.querySelectorAll('.mov').forEach(m => {
                m.addEventListener('click', function(e) { if (e.target === this) closeMov(this.id); });
            });

            // ─── TOAST ──────────────────────────────────────────
            function showToast(msg, type) {
                if (typeof window.showToast === 'function') {
                    window.showToast(msg, type);
                } else {
                    alert(msg);
                }
            }

            function updateNavAvatar() {
                if (typeof window.updateNavAvatar === 'function') {
                    window.updateNavAvatar();
                }
            }

            // ─── INIT ───────────────────────────────────────────
            async function init() {
                if (!window.AuthUser) {
                    await new Promise(resolve => setTimeout(resolve, 300));
                }
                await renderProfile();

                if (typeof window.setupProfileSync === 'function') {
                    window.setupProfileSync(() => {
                        renderProfile();
                    });
                }

                window.addEventListener('storage', function(e) {
                    if (e.key === 'freeupper_user_profile') {
                        renderProfile();
                    }
                });

                document.getElementById('avatarModal').addEventListener('open', initAvatarGrid);

                window.addEventListener('popstate', function() {
                    renderProfile();
                });

                window.handleAvatarClick = function() { if (isOwner) openFS('avatarModal'); };
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // Expose to global
            window.switchTab = switchTab;
            window.openFS = openFS;
            window.closeFS = closeFS;
            window.closeCenter = closeCenter;
            window.openPostsModal = openPostsModal;
            window.openShareModal = openShareModal;
            window.copyProfileLink = copyProfileLink;
            window.shareProfileLink = shareProfileLink;
            window.showScanView = showScanView;
            window.stopCameraAndShowQR = stopCameraAndShowQR;
            window.scanGalleryQR = scanGalleryQR;
            window.openEditModal = openEditModal;
            window.addPill = addPill;
            window.removePill = removePill;
            window.saveProfile = saveProfile;
            window.openCountryModal = openCountryModal;
            window.filterCountries = filterCountries;
            window.clearCountrySearch = clearCountrySearch;
            window.pickCountry = pickCountry;
            window.openDOBModal = openDOBModal;
            window.selDOB = selDOB;
            window.saveDOB = saveDOB;
            window.openGenderModal = openGenderModal;
            window.pickGender = pickGender;
            window.openFollowModal = openFollowModal;
            window.tabTap = tabTap;
            window.filterUsersPage = filterUsersPage;
            window.onFollowScrollPage = onFollowScrollPage;
            window.handleFollow = handleFollow;
            window.toggleReaction = toggleReaction;
            window.toggleBookmark = toggleBookmark;
            window.toggleShare = toggleShare;
            window.removeFromTab = removeFromTab;
            window.deletePost = deletePost;
            window.deleteMarketItem = deleteMarketItem;

        })();
    </script>
</body>
</html>
