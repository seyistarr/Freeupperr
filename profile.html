<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile · Freeupper</title>
    <link rel="icon" type="image/png" href="freeupper.png">
    <link rel="apple-touch-icon" href="freeupper.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Freeupper">
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="View profiles, posts, saved content, and marketplace activity on Freeupper.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Freeupper">
    <meta property="og:title" content="Freeupper Profile">
    <meta property="og:description" content="View profiles, posts, saved content, and marketplace activity on Freeupper.">
    <meta property="og:image" content="https://seyistarr.github.io/Freeupperr/freeupper.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="500">
    <meta property="og:image:height" content="500">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Freeupper Profile">
    <meta name="twitter:description" content="View profiles, posts, saved content, and marketplace activity on Freeupper.">
    <meta name="twitter:image" content="https://seyistarr.github.io/Freeupperr/freeupper.png">
    <link rel="stylesheet" href="global.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <style>
        /* ══════════════════════════════════════════
           PROFILE-SPECIFIC STYLES
        ══════════════════════════════════════════ */
        .layout {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* Side nav – reuses global styles, but we keep local overrides */
        .side-nav {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 28px 0 24px;
            background: var(--sidebg);
            border-right: 1px solid var(--brd);
            width: 70px;
            flex-shrink: 0;
            gap: 2px;
            z-index: 10;
            transition: background .3s, border-color .3s;
        }
        .side-logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--p);
            margin-bottom: 20px;
            letter-spacing: -1px;
            cursor: pointer;
        }
        .side-logo a { color: inherit; text-decoration: none; }
        .side-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s, transform .1s;
            background: none;
            border: none;
            position: relative;
            gap: 3px;
            color: inherit;
            text-decoration: none;
        }
        .side-btn:hover { background: var(--pdim); transform: scale(1.04); }
        .side-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .side-btn span { font-size: 8px; color: var(--muted2); font-weight: 600; }
        .side-btn.active svg { stroke: var(--p); }
        .side-btn.active span { color: var(--p); }
        .side-badge {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--p);
            border: 1.5px solid var(--sidebg);
        }
        .side-gap { flex: 1; }
        .side-av {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .side-btn.active .side-av { border-color: var(--p); }

        .main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--bg);
            scroll-behavior: smooth;
            transition: background .3s;
            padding-bottom: 80px;
        }
        .main::-webkit-scrollbar { width: 0; }
        .profile-col {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px 40px;
        }

        /* Topbar */
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(44px, 8vw, 56px) 0 10px;
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--bg);
            transition: background .3s;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-username {
            font-size: clamp(16px, 4vw, 18px);
            font-weight: 800;
            letter-spacing: -.3px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--dotbg);
            border: 1.5px solid var(--brd2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .18s, transform .15s;
            color: var(--text);
        }
        .header-btn:hover { background: var(--pdim); transform: scale(1.05); }
        .header-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .verified-badge {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--p), var(--pd));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 10px var(--pglow);
        }
        .verified-badge svg {
            width: 11px;
            height: 11px;
            stroke: #fff;
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Hero */
        .profile-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 0 20px;
            animation: fadeUp .5s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-wrap {
            position: relative;
            width: clamp(92px, 22vw, 110px);
            height: clamp(92px, 22vw, 110px);
            margin-bottom: 14px;
            cursor: pointer;
        }
        .avatar-ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff6b6b, #ffa500, #ffdd57, #4ade80, #38bdf8, #818cf8, #e879f9, #ff6b6b);
            animation: spin 4s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .avatar-ring-gap {
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: var(--bg);
            transition: background .3s;
        }
        .avatar-img {
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 1;
            width: calc(100% - 10px);
            height: calc(100% - 10px);
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
            transition: opacity .2s;
        }
        .avatar-wrap:hover .avatar-img { opacity: .88; }
        .online-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #22c55e;
            border: 2.5px solid var(--bg);
            z-index: 2;
            transition: border-color .3s;
        }

        .role-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 10px;
        }
        .role-tag {
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .04em;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
        }

        .display-name-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 5px;
        }
        .display-name {
            font-size: clamp(18px, 5vw, 23px);
            font-weight: 800;
            letter-spacing: -.4px;
        }
        .edit-pen {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: background .15s;
        }
        .edit-pen:hover { background: var(--pdim); }
        .edit-pen svg {
            width: 15px;
            height: 15px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hero-bio {
            font-size: clamp(12px, 3vw, 13.5px);
            color: var(--muted);
            text-align: center;
            line-height: 1.6;
            max-width: 300px;
            margin-bottom: 18px;
            white-space: pre-wrap;
        }

        .action-row {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 380px;
        }
        .act-btn {
            flex: 1;
            height: 42px;
            border-radius: 12px;
            border: none;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: all .18s;
            color: var(--text);
        }
        .act-follow {
            background: linear-gradient(135deg, var(--p), var(--pd));
            color: #fff !important;
            box-shadow: 0 4px 16px var(--pglow);
        }
        .act-follow:hover { opacity: .88; transform: translateY(-1px); }
        .act-follow.fstate {
            background: var(--inp);
            color: var(--text) !important;
            box-shadow: none;
            border: 1.5px solid var(--brd2);
        }
        .act-msg {
            background: var(--inp);
            border: 1.5px solid var(--brd2);
        }
        .act-msg:hover { background: var(--rowh); }

        /* Stats */
        .stats-row {
            display: flex;
            margin: 0 0 4px 0;
            background: var(--inp);
            border: 1px solid var(--brd);
            border-radius: 18px;
            overflow: hidden;
            animation: fadeUp .5s .1s ease both;
            transition: background .3s, border-color .3s;
        }
        .stat {
            flex: 1;
            padding: clamp(12px, 3vw, 16px) 8px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: background .15s;
        }
        .stat:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 22%;
            bottom: 22%;
            width: 1px;
            background: var(--brd);
        }
        .stat:hover { background: var(--pdim); }
        .stat-n {
            font-size: clamp(17px, 4vw, 21px);
            font-weight: 800;
            letter-spacing: -.5px;
            background: linear-gradient(135deg, var(--pl), var(--p));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-l {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
            margin-top: 2px;
            letter-spacing: .03em;
        }
        .stat.locked .stat-n,
        .stat.locked .stat-l { opacity: .4; }

        /* Tabs */
        .profile-tabs {
            display: flex;
            border-top: 1px solid var(--brd);
            border-bottom: 1px solid var(--brd);
            margin-top: 16px;
            position: sticky;
            top: 56px;
            background: var(--bg);
            z-index: 20;
            transition: background .3s, border-color .3s;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .profile-tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex: 1;
            min-width: 60px;
            padding: 13px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            transition: all .15s;
            color: var(--muted2);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .03em;
        }
        .tab svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: var(--muted2);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .tab.active {
            border-bottom-color: var(--p);
            color: var(--p);
        }
        .tab.active svg { stroke: var(--p); }
        .tab:disabled { opacity: .35; cursor: default; }

        /* Panels */
        .panel { display: none; animation: fadeUp .3s ease both; }
        .panel.active { display: block; }

        /* Feed posts (reuses card style from index) */
        .feed-post {
            border-bottom: 1px solid var(--brd);
            padding: 16px 0;
            position: relative;
            transition: background .1s ease;
            cursor: pointer;
        }
        .feed-post:active { background: var(--rowh); }
        .feed-post:last-child { border-bottom: none; }
        .content-text {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 1rem;
            color: var(--text);
            font-weight: 400;
            word-wrap: break-word;
        }
        .content-preview {
            white-space: pre-wrap;
            line-height: 1.55;
            font-size: .98rem;
            color: var(--text);
            font-weight: 400;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        /* Post media */
        .post-media-wrap {
            width: calc(100% + 32px);
            margin-left: -16px;
            margin-right: -16px;
            background: #000;
            border-radius: 0;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
        }
        .post-media-wrap img {
            width: 100%;
            display: block;
            max-height: 70vh;
            object-fit: contain;
            background: #000;
        }
        .post-media-wrap video {
            width: 100%;
            display: block;
            max-height: 70vh;
            object-fit: contain;
            background: #000;
        }
        .post-media-wrap .yt-wrap {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .post-media-wrap .yt-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Post actions */
        .post-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .post-actions .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            border-radius: 20px;
            border: none;
            background: transparent;
            font-size: .85rem;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: .15s;
        }
        .post-actions .action-btn:hover { background: var(--pdim); color: var(--p); }
        .post-actions .action-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .post-actions .action-btn.danger:hover {
            background: rgba(248, 113, 113, .12);
            color: var(--danger);
        }
        .post-actions .action-btn.reacted { color: var(--danger); }
        .post-actions .action-btn.bookmarked { color: var(--warn); }
        .post-actions .action-btn .count {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* Grid (Explore style) */
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            padding: 12px 0;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 8px 0;
        }
        .grid-card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: var(--bg4);
            cursor: pointer;
            aspect-ratio: 9/16;
            transition: transform .18s ease;
        }
        .grid-card:active { transform: scale(.97); }
        .grid-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .grid-card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, .85));
            padding: 32px 9px 10px;
        }
        .grid-card .title {
            font-size: .78rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .grid-card .meta {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
        }
        .grid-card .meta .avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, .55);
            flex-shrink: 0;
            background: var(--bg4);
        }
        .grid-card .meta .name {
            font-size: .68rem;
            font-weight: 600;
            color: rgba(255, 255, 255, .85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .grid-card .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(124, 58, 237, .9);
            color: #fff;
            font-size: .58rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        .grid-card .video-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, .6);
            color: #fff;
            font-size: .6rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .grid-card .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .7);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: background .15s;
        }
        .grid-card .remove-btn:hover { background: rgba(220, 38, 38, .8); }
        .grid-card .remove-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }
        .grid-card .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(220, 38, 38, .85);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: background .15s;
        }
        .grid-card .delete-btn:hover { background: rgba(220, 38, 38, 1); }
        .grid-card .delete-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }
        .grid-card .no-media {
            width: 100%;
            height: 100%;
            background: var(--bg4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
            font-size: .7rem;
            font-weight: 700;
            color: var(--muted2);
            line-height: 1.4;
        }

        /* Market card (2-col) */
        .market-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: var(--bg3);
            border: 1px solid var(--brd);
            box-shadow: var(--cardsh);
            transition: transform .18s ease;
            cursor: pointer;
        }
        .market-card:active { transform: scale(.97); }
        .market-card .img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            background: var(--bg4);
        }
        .market-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .market-card .price-tag {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, .78);
            color: #fff;
            font-weight: 700;
            font-size: .8rem;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .market-card .cat-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(124, 58, 237, .9);
            color: #fff;
            font-size: .55rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            letter-spacing: .04em;
            text-transform: uppercase;
            z-index: 2;
        }
        .market-card .body {
            padding: 10px 12px 12px;
        }
        .market-card .body .title {
            font-size: .82rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .market-card .body .location {
            font-size: .68rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .market-card .body .seller {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--brd);
        }
        .market-card .body .seller .avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .market-card .body .seller .name {
            font-size: .68rem;
            color: var(--muted);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .market-card .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(220, 38, 38, .85);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: background .15s;
        }
        .market-card .delete-btn:hover { background: rgba(220, 38, 38, 1); }
        .market-card .delete-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        /* Empty states */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(48px, 10vw, 80px) 30px;
            gap: 14px;
            text-align: center;
            min-height: 200px;
        }
        .empty-state .icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }
        .empty-state .icon svg {
            width: 32px;
            height: 32px;
            stroke: var(--p);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .empty-state h3 { font-size: clamp(16px, 4vw, 18px); font-weight: 800; }
        .empty-state p {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
            max-width: 230px;
        }

        /* Bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--navbg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-top: 1px solid var(--brd);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0 max(env(safe-area-inset-bottom), 16px);
            z-index: 50;
            transition: background .3s, border-color .3s;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px clamp(8px, 3vw, 14px);
            border-radius: 14px;
            transition: background .15s;
            position: relative;
            background: none;
            border: none;
            text-decoration: none;
            color: inherit;
        }
        .nav-item:hover { background: var(--pdim); }
        .nav-item svg {
            width: clamp(20px, 5vw, 24px);
            height: clamp(20px, 5vw, 24px);
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .nav-item span {
            font-size: clamp(9px, 2vw, 10px);
            color: var(--muted);
            font-weight: 600;
            letter-spacing: .03em;
        }
        .nav-item.active svg { stroke: var(--p); }
        .nav-item.active span { color: var(--p); }
        .nav-av {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .nav-item.active .nav-av { border-color: var(--p); }
        .nav-badge {
            position: absolute;
            top: 3px;
            right: clamp(4px, 2vw, 6px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--p);
            border: 1.5px solid var(--bg);
        }

        /* Responsive */
        @media (min-width: 768px) {
            .side-nav { display: flex; }
            .bottom-nav { display: none; }
            .main { padding-bottom: 24px; }
        }
        @media (min-width: 1024px) {
            .side-nav { width: 82px; }
            .profile-col { max-width: 640px; }
        }

        .hidden { display: none !important; }
        .fw-bold { font-weight: 700; }
        .text-muted { color: var(--muted); }
        .text-sm { font-size: 13px; }
        .mt-2 { margin-top: 8px; }
        .mb-2 { margin-bottom: 8px; }
        .gap-1 { gap: 4px; }
        .flex { display: flex; }
        .flex-wrap { flex-wrap: wrap; }
        .items-center { align-items: center; }

        /* Toast container is in global.css, but we need #tw */
        #tw {
            position: fixed;
            top: clamp(14px, 4vw, 22px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: calc(100vw - 32px);
        }
        .toast {
            background: var(--bg3);
            border: 1px solid var(--brd2);
            border-radius: 100px;
            padding: 11px 18px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .55);
            animation: tIn .3s cubic-bezier(.34, 1.2, .64, 1) both;
            white-space: nowrap;
        }
        .toast.out { animation: tOut .25s ease forwards; }
        @keyframes tIn { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes tOut { to { transform: translateY(-10px); opacity: 0; } }
        .td { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .tg { background: var(--ok); }
        .tp { background: var(--p); }
        .tr { background: var(--danger); }
        .to { background: var(--warn); }
    </style>
</head>

    <script>
      if ('serviceWorker' in navigator) {

            console.warn('SW registration failed:', err);

    <script>
        // ══════════════════════════════════════════
        // PROFILE PAGE — FULL LOGIC
        // ══════════════════════════════════════════

        (function() {
            'use strict';

            // ─── STATE ────────────────────────────────
            let targetUserId = null;
            let isOwner = false;
            let currentUser = getCurrentUser();
            let targetUser = null;
            let allUsers = getAllUsers();
            let blogData = loadBlogData();
            let posts = blogData.posts || [];
            let marketItems = blogData.marketItems || [];
            let bookmarks = getBookmarks();
            let shares = getShares();
            let follows = getFollows();

            let activeTab = 'posts';

            // ─── HELPERS ──────────────────────────────
            function fmtNum(n) {
                if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
                if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
                return String(n);
            }

            function escapeHtml(s) {
                const d = document.createElement('div');
                d.textContent = s || '';
                return d.innerHTML;
            }

            function getInitials(name) {
                return name ? name.charAt(0).toUpperCase() : '?';
            }

            function getAvatar(user) {
                return user && user.avatar ? user.avatar :
                    'data:image/svg+xml,' + encodeURIComponent(
                        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#E5E7EB"/><circle cx="50" cy="38" r="16" fill="#9CA3AF"/><ellipse cx="50" cy="75" rx="30" ry="22" fill="#9CA3AF"/></svg>'
                    );
            }

            function formatRelativeTime(iso) {
                const now = Date.now();
                const then = new Date(iso).getTime();
                const diff = Math.floor((now - then) / 1000);
                if (diff < 60) return 'Just now';
                if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                if (diff < 172800) return 'Yesterday';
                if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
                return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            function formatPrice(n) {
                return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }

            // ─── GET USER FROM URL ────────────────────
            function getTargetUserFromUrl() {
                const params = new URLSearchParams(window.location.search);
                const uid = params.get('uid');
                if (uid) {
                    const found = allUsers.find(u => u.id === uid);
                    if (found) return found;
                }
                return currentUser;
            }

            // ─── RENDER PROFILE ──────────────────────
            function renderProfile() {
                targetUser = getTargetUserFromUrl();
                if (!targetUser) {
                    targetUser = currentUser;
                }
                targetUserId = targetUser.id;
                isOwner = targetUserId === currentUser.id;

                // Update avatar
                updateNavAvatar();
                const avatarEl = document.getElementById('profileAvatar');
                if (avatarEl) avatarEl.src = getAvatar(targetUser);

                // Display name & username
                document.getElementById('displayName').textContent = targetUser.displayName || 'Guest';
                document.getElementById('headerUsername').textContent = targetUser.username || '@user';

                // Verified badge
                const badge = document.getElementById('verifiedBadge');
                if (targetUser.verified) {
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }

                // Bio
                const bioEl = document.getElementById('heroBio');
                if (targetUser.bio) {
                    bioEl.textContent = targetUser.bio;
                } else {
                    bioEl.textContent = isOwner ? 'No bio yet. Tap edit to add one.' : 'No bio yet.';
                }

                // Role tags
                const tags = targetUser.tags || [];
                const tagsContainer = document.getElementById('roleTags');
                if (tags.length) {
                    tagsContainer.innerHTML = tags.map(t => `<span class="role-tag">${escapeHtml(t)}</span>`).join('');
                } else {
                    tagsContainer.innerHTML = '';
                }

                // Edit pen
                document.getElementById('editPenBtn').classList.toggle('hidden', !isOwner);

                // Stats
                const followsData = getFollowCounts(targetUserId);
                const userPosts = getUserPosts(targetUserId);
                const postCount = userPosts.length;
                document.getElementById('statPosts').textContent = fmtNum(postCount);
                document.getElementById('statFollowers').textContent = fmtNum(followsData.followers);
                document.getElementById('statFollowing').textContent = fmtNum(followsData.following);

                // Action row
                renderActionRow();

                // Render initial tab
                switchTab(document.querySelector('.tab.active'), 'posts');
            }

            // ─── ACTION ROW ──────────────────────────
            function renderActionRow() {
                const row = document.getElementById('actionRow');
                if (isOwner) {
                    row.innerHTML = `
                        <button class="act-btn act-follow" onclick="editProfile()" style="flex:1">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
                            Edit Profile
                        </button>
                    `;
                    return;
                }

                const following = isFollowing(targetUserId);
                row.innerHTML = `
                    <button class="act-btn ${following ? 'act-follow fstate' : 'act-follow'}" id="followBtn" onclick="handleFollow()">
                        ${following ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> Following` : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg> Follow`}
                    </button>
                    <button class="act-btn act-msg" onclick="showToast('Messaging coming soon', 'p')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        Message
                    </button>
                `;
            }

            // ─── FOLLOW HANDLER ──────────────────────
            window.handleFollow = function() {
                if (!targetUserId) return;
                const btn = document.getElementById('followBtn');
                if (!btn) return;
                const newState = toggleFollowUser(targetUserId);
                renderActionRow();
                // Update stats
                const counts = getFollowCounts(targetUserId);
                document.getElementById('statFollowers').textContent = fmtNum(counts.followers);
                showToast(newState ? 'Following ✓' : 'Unfollowed', newState ? 'g' : 'o');
            };

            // ─── EDIT PROFILE ────────────────────────
            window.editProfile = function() {
                window.location.href = 'settings.html?tab=edit';
            };

            window.goToSettings = function() {
                window.location.href = 'settings.html';
            };

            window.shareProfile = function() {
                const url = window.location.href;
                if (navigator.share) {
                    navigator.share({ title: 'Check out ' + (targetUser.displayName || 'this profile'), url: url });
                } else {
                    navigator.clipboard.writeText(url).then(() => showToast('Profile link copied', 'g'));
                }
            };

            window.handleAvatarClick = function() {
                if (isOwner) {
                    window.location.href = 'settings.html?tab=edit';
                }
            };

            window.openEditProfile = function() {
                window.location.href = 'settings.html?tab=edit';
            };

            // ─── TABS ─────────────────────────────────
            window.switchTab = function(el, tab) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + tab).classList.add('active');
                activeTab = tab;
                renderTab(tab);
            };

            function renderTab(tab) {
                const panel = document.getElementById('panel-' + tab);
                if (!panel) return;
                switch (tab) {
                    case 'posts':
                        renderPosts(panel);
                        break;
                    case 'love':
                        renderLove(panel);
                        break;
                    case 'share':
                        renderShare(panel);
                        break;
                    case 'star':
                        renderStar(panel);
                        break;
                    case 'market':
                        renderMarket(panel);
                        break;
                }
            }

            // ─── RENDER POSTS (feed style) ──────────
            function renderPosts(container) {
                const userPosts = getUserPosts(targetUserId);
                if (!userPosts.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>
                            <h3>No posts yet</h3>
                            <p>${isOwner ? 'Create your first post.' : 'Nothing posted yet.'}</p>
                        </div>
                    `;
                    return;
                }
                // Sort newest first
                userPosts.sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date));
                container.innerHTML = userPosts.map((post, idx) => buildPostCard(post, idx, 'delete')).join('');
            }

            // ─── RENDER LOVE (grid style) ───────────
            function renderLove(container) {
                const likedPostIds = [];
                for (const key in blogData.userReactions) {
                    if (key.endsWith('-like') && blogData.userReactions[key]) {
                        const postId = parseInt(key.split('-')[0]);
                        if (postId) likedPostIds.push(postId);
                    }
                }
                const likedPosts = posts.filter(p => likedPostIds.includes(p.id));
                if (!likedPosts.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
                            <h3>No liked posts</h3>
                            <p>Posts you love will appear here.</p>
                        </div>
                    `;
                    return;
                }
                likedPosts.sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date));
                container.innerHTML = `<div class="grid-3">${likedPosts.map((post, idx) => buildGridCard(post, idx, 'remove', 'love')).join('')}</div>`;
            }

            // ─── RENDER SHARE (feed style) ──────────
            function renderShare(container) {
                const sharedPostIds = getShares();
                const sharedPosts = posts.filter(p => sharedPostIds.includes(p.id));
                if (!sharedPosts.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div>
                            <h3>No shared posts</h3>
                            <p>Posts you share will appear here.</p>
                        </div>
                    `;
                    return;
                }
                sharedPosts.sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date));
                container.innerHTML = sharedPosts.map((post, idx) => buildPostCard(post, idx, 'remove', 'share')).join('');
            }

            // ─── RENDER STAR (feed style) ───────────
            function renderStar(container) {
                const bookmarkedPostIds = getBookmarks();
                const bookmarkedPosts = posts.filter(p => bookmarkedPostIds.includes(p.id));
                if (!bookmarkedPosts.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
                            <h3>No bookmarks</h3>
                            <p>Star posts you love to find them instantly.</p>
                        </div>
                    `;
                    return;
                }
                bookmarkedPosts.sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date));
                container.innerHTML = bookmarkedPosts.map((post, idx) => buildPostCard(post, idx, 'remove', 'star')).join('');
            }

            // ─── RENDER MARKET (2-col grid) ─────────
            function renderMarket(container) {
                const userItems = getUserMarketItems(targetUserId);
                if (!userItems.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div>
                            <h3>No listings</h3>
                            <p>${isOwner ? 'Sell something on Campus Market.' : 'No items listed yet.'}</p>
                        </div>
                    `;
                    return;
                }
                userItems.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                container.innerHTML = `<div class="grid-2">${userItems.map(item => buildMarketCard(item, isOwner)).join('')}</div>`;
            }

            // ─── BUILD POST CARD (feed style) ──────
            function buildPostCard(post, idx, actionType, sourceTab) {
                const isLiked = blogData.userReactions[post.id + '-like'] || false;
                const likeCount = post.reactions && post.reactions.like ? post.reactions.like : 0;
                const isBookmarked = getBookmarks().includes(post.id);
                const isShared = getShares().includes(post.id);
                const commentCount = post.comments ? post.comments.filter(c => c.approved !== false).length : 0;

                const authorName = post.author || 'Anonymous';
                const authorAvatar = post.authorAvatar || getAvatar(currentUser);
                const mediaHtml = buildMediaHtml(post);

                let actionBtnHtml = '';
                if (actionType === 'delete') {
                    actionBtnHtml = `
                        <button class="action-btn danger" onclick="event.stopPropagation();deletePost(${post.id})" title="Delete">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                        </button>
                    `;
                } else if (actionType === 'remove') {
                    let removeLabel = 'Remove';
                    let removeIcon = `<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
                    if (sourceTab === 'love') {
                        removeLabel = 'Unlike';
                    } else if (sourceTab === 'share') {
                        removeLabel = 'Unshare';
                    } else if (sourceTab === 'star') {
                        removeLabel = 'Unsave';
                    }
                    actionBtnHtml = `
                        <button class="action-btn danger" onclick="event.stopPropagation();removeFromTab(${post.id}, '${sourceTab}')" title="${removeLabel}">
                            ${removeIcon}
                        </button>
                    `;
                }

                return `
                    <div class="feed-post" data-post-id="${post.id}">
                        <div class="flex items-center gap-3">
                            <img src="${authorAvatar}" class="avatar-img" style="width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;" onerror="this.style.display='none'">
                            <div style="min-width:0;flex:1;">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="fw-bold text-sm cursor-pointer hover:underline" style="color:var(--text);">${escapeHtml(authorName)}</span>
                                    <span class="text-sm" style="color:var(--muted);">· ${formatRelativeTime(post.timestamp || post.date)}</span>
                                    <span class="text-xs text-primary font-semibold uppercase tracking-wide cursor-pointer hover:underline ml-auto flex-shrink-0">${escapeHtml(post.category || 'General')}</span>
                                </div>
                                <h3 class="font-heading font-bold text-base mt-0.5 cursor-pointer" style="overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;overflow-wrap:anywhere;color:var(--text);">${escapeHtml(post.title)}</h3>
                                ${post.description ? `<p class="text-sm mt-1 leading-relaxed" style="white-space:pre-wrap;color:var(--muted);">${escapeHtml(post.description)}</p>` : ''}
                                <div class="mt-1 content-text">${escapeHtml(post.content)}</div>
                                ${mediaHtml}
                                ${post.tags && post.tags.length ? `<div class="flex flex-wrap gap-1 mt-2">${post.tags.map(t => `<span style="display:inline-block;padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:600;background:var(--pdim);color:var(--p);">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
                                <div class="post-actions">
                                    <button class="action-btn ${isLiked ? 'reacted' : ''}" onclick="event.stopPropagation();toggleReaction(${post.id})">
                                        <svg viewBox="0 0 24 24" fill="${isLiked ? '#DC2626' : 'none'}" stroke="currentColor" stroke-width="1.7"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                        <span class="count">${fmtNum(likeCount)}</span>
                                    </button>
                                    <button class="action-btn" onclick="event.stopPropagation();showToast('Comments coming soon', 'p')">
                                        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                        <span class="count">${fmtNum(commentCount)}</span>
                                    </button>
                                    <button class="action-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="event.stopPropagation();toggleBookmark(${post.id})">
                                        <svg viewBox="0 0 24 24" fill="${isBookmarked ? 'var(--warn)' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                                    </button>
                                    <button class="action-btn ${isShared ? 'bookmarked' : ''}" onclick="event.stopPropagation();toggleShare(${post.id})" style="color:${isShared ? 'var(--p)' : 'var(--muted)'}">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                                        ${isShared ? '<span style="font-size:10px;font-weight:700;color:var(--p);">Shared</span>' : ''}
                                    </button>
                                    ${actionBtnHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // ─── BUILD GRID CARD (3-col) ──────────
            function buildGridCard(post, idx, actionType, sourceTab) {
                let mediaHtml = '';
                if (post.mediaType === 'image' && post.mediaUrl) {
                    mediaHtml = `<img src="${post.mediaUrl}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'no-media\\'>${escapeHtml(post.title)}</div>'">`;
                } else if (post.mediaType === 'video' && post.mediaUrl) {
                    if (post.mediaUrl.includes('youtube.com') || post.mediaUrl.includes('youtu.be')) {
                        const ytId = post.mediaUrl.match(/(?:youtube\.com\/embed\/|youtu\.be\/|v=)([a-zA-Z0-9_-]{11})/);
                        if (ytId) {
                            mediaHtml = `<img src="https://img.youtube.com/vi/${ytId[1]}/hqdefault.jpg" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'no-media\\'>${escapeHtml(post.title)}</div>'">`;
                        } else {
                            mediaHtml = `<div class="no-media">${escapeHtml(post.title)}</div>`;
                        }
                    } else {
                        mediaHtml = `<video src="${post.mediaUrl}" muted playsinline style="width:100%;height:100%;object-fit:cover;"></video>`;
                    }
                } else {
                    mediaHtml = `<div class="no-media">${escapeHtml(post.title)}</div>`;
                }

                const authorName = post.author || 'Anonymous';
                const authorAvatar = post.authorAvatar || getAvatar(currentUser);

                let actionBtn = '';
                if (actionType === 'remove') {
                    const label = sourceTab === 'love' ? 'Unlike' : sourceTab === 'share' ? 'Unshare' : 'Unsave';
                    actionBtn = `
                        <button class="remove-btn" onclick="event.stopPropagation();removeFromTab(${post.id}, '${sourceTab}')" title="${label}">
                            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    `;
                } else if (actionType === 'delete') {
                    actionBtn = `
                        <button class="delete-btn" onclick="event.stopPropagation();deletePost(${post.id})" title="Delete">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                        </button>
                    `;
                }

                const isVideo = post.mediaType === 'video';
                const videoBadge = isVideo ? `<div class="video-badge"><svg width="9" height="9" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg> Video</div>` : '';

                return `
                    <div class="grid-card" onclick="openPostDetail(${post.id})">
                        ${mediaHtml}
                        <div class="badge">${escapeHtml(post.category || 'General')}</div>
                        ${videoBadge}
                        ${actionBtn}
                        <div class="overlay">
                            <div class="title">${escapeHtml(post.title)}</div>
                            <div class="meta">
                                <img src="${authorAvatar}" class="avatar" onerror="this.style.display='none'">
                                <span class="name">${escapeHtml(authorName)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            // ─── BUILD MARKET CARD ──────────────────
            function buildMarketCard(item, isOwner) {
                const imgUrl = item.images && item.images.length ? item.images[0] : '';
                const sellerName = item.sellerName || 'Seller';
                const sellerAvatar = item.sellerAvatar || getAvatar(currentUser);

                let deleteBtn = '';
                if (isOwner) {
                    deleteBtn = `
                        <button class="delete-btn" onclick="event.stopPropagation();deleteMarketItem(${item.id})" title="Delete">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                        </button>
                    `;
                }

                return `
                    <div class="market-card" onclick="openMarketDetail(${item.id})">
                        <div class="img-wrap">
                            ${imgUrl ? `<img src="${imgUrl}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'no-media\\' style=\\'display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted2);\\'>No image</div>'">` : `<div class="no-media" style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted2);">No image</div>`}
                            <span class="cat-badge">${escapeHtml(item.category || 'General')}</span>
                            <span class="price-tag">₦${formatPrice(item.price)}</span>
                            ${deleteBtn}
                        </div>
                        <div class="body">
                            <div class="title">${escapeHtml(item.title)}</div>
                            <div class="location">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                ${escapeHtml(item.location || 'Campus')}
                            </div>
                            <div class="seller">
                                <img src="${sellerAvatar}" class="avatar" onerror="this.style.display='none'">
                                <span class="name">${escapeHtml(sellerName)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            // ─── BUILD MEDIA HTML ───────────────────
            function buildMediaHtml(post) {
                if (!post.mediaUrl) return '';
                if (post.mediaType === 'video') {
                    if (post.mediaUrl.includes('youtube.com') || post.mediaUrl.includes('youtu.be')) {
                        const ytId = post.mediaUrl.match(/(?:youtube\.com\/embed\/|youtu\.be\/|v=)([a-zA-Z0-9_-]{11})/);
                        if (ytId) {
                            return `<div class="post-media-wrap"><div class="yt-wrap"><iframe src="https://www.youtube.com/embed/${ytId[1]}?autoplay=0&mute=1&controls=1&modestbranding=1&rel=0&showinfo=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>`;
                        }
                    }
                    return `<div class="post-media-wrap"><video src="${post.mediaUrl}" controls playsinline muted preload="metadata"></video></div>`;
                }
                if (post.mediaType === 'image') {
                    return `<div class="post-media-wrap"><img src="${post.mediaUrl}" loading="lazy" onerror="this.style.display='none'"></div>`;
                }
                return '';
            }

            // ─── ACTIONS ─────────────────────────────
            window.toggleReaction = function(postId) {
                const reacted = toggleReaction(postId, 'like');
                // Refresh active tab
                renderTab(activeTab);
                showToast(reacted ? 'Liked ♥' : 'Unliked', reacted ? 'g' : 'o');
            };

            window.toggleBookmark = function(postId) {
                const saved = toggleBookmark(postId);
                renderTab(activeTab);
                showToast(saved ? 'Bookmarked ⭐' : 'Removed from bookmarks', saved ? 'g' : 'o');
            };

            window.toggleShare = function(postId) {
                const shared = toggleShare(postId);
                renderTab(activeTab);
                showToast(shared ? 'Shared 📤' : 'Unshared', shared ? 'g' : 'o');
            };

            window.removeFromTab = function(postId, sourceTab) {
                if (sourceTab === 'love') {
                    // Unlike the post
                    const data = loadBlogData();
                    const key = postId + '-like';
                    if (data.userReactions[key]) {
                        delete data.userReactions[key];
                        const post = data.posts.find(p => p.id === postId);
                        if (post && post.reactions && post.reactions.like) {
                            post.reactions.like = Math.max(0, post.reactions.like - 1);
                        }
                        saveBlogData(data);
                        showToast('Removed from likes', 'o');
                    }
                } else if (sourceTab === 'share') {
                    const shares = getShares();
                    const updated = shares.filter(id => id !== postId);
                    saveShares(updated);
                    showToast('Unshared', 'o');
                } else if (sourceTab === 'star') {
                    const bookmarks = getBookmarks();
                    const updated = bookmarks.filter(id => id !== postId);
                    saveBookmarks(updated);
                    showToast('Removed from bookmarks', 'o');
                }
                renderTab(activeTab);
            };

            window.deletePost = function(postId) {
                if (!confirm('Delete this post permanently?')) return;
                deletePost(postId);
                renderTab(activeTab);
                showToast('Post deleted', 'r');
            };

            window.deleteMarketItem = function(itemId) {
                if (!confirm('Delete this listing permanently?')) return;
                deleteMarketItem(itemId);
                renderTab(activeTab);
                showToast('Listing deleted', 'r');
            };

            window.openPostDetail = function(postId) {
                window.location.href = 'index.html?post=' + postId;
            };

            window.openMarketDetail = function(itemId) {
                showToast('Market detail coming soon', 'p');
            };

            window.openFollowModal = function(type) {
                showToast('Follow modal coming soon', 'p');
            };

            window.openPostsModal = function() {
                const count = getUserPosts(targetUserId).length;
                showToast('Total posts: ' + count, 'p');
            };

            // ─── INIT ─────────────────────────────────
            function init() {
                renderProfile();
                // Re-render when data changes
                window.addEventListener('storage', function(e) {
                    if (e.key === 'freeupper_blog_data_v2' || e.key === 'freeupper_all_users' || e.key === 'freeupper_follows') {
                        // Reload data
                        blogData = loadBlogData();
                        posts = blogData.posts || [];
                        marketItems = blogData.marketItems || [];
                        allUsers = getAllUsers();
                        follows = getFollows();
                        renderProfile();
                    }
                });
            }

            init();

        })();
    </script>

</body>
</html>
