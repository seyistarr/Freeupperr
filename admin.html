<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin · Freeupper</title>
    <link rel="icon" type="image/png" href="freeupper.png" />
    <link rel="stylesheet" href="global.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ────────────────────────────────────────────────────────────────
           DESIGN SYSTEM – fixed nav overlap + theme support
        ──────────────────────────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --nav-h: 64px;
            --primary: #7c3aed;
            --primary-dim: rgba(124, 58, 237, 0.15);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 20px;
            --radius-sm: 12px;
        }

        [data-theme="dark"] {
            --bg: #09090b;
            --surface: #15151a;
            --surface2: #1f1f26;
            --surface3: #2a2a33;
            --border: rgba(255, 255, 255, 0.06);
            --border2: rgba(255, 255, 255, 0.10);
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.35);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        [data-theme="light"] {
            --bg: #f6f6f8;
            --surface: #ffffff;
            --surface2: #f0f0f3;
            --surface3: #e5e5ea;
            --border: rgba(0, 0, 0, 0.07);
            --border2: rgba(0, 0, 0, 0.12);
            --text: #0b0b0d;
            --text-secondary: rgba(0, 0, 0, 0.6);
            --text-tertiary: rgba(0, 0, 0, 0.4);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        html,
        body {
            height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }

        /* ─── LAYOUT ──────────────────────────────────────────────────── */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg);
            position: relative;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 40px);
            scroll-behavior: smooth;
        }
        .main-content::-webkit-scrollbar {
            width: 0;
        }

        /* ─── BOTTOM NAV ────────────────────────────────────────────── */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: var(--surface);
            border-top: 1px solid var(--border);
            min-height: var(--nav-h);
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.3s cubic-bezier(0.32, 1, 0.64, 1), opacity 0.3s ease;
        }
        .bottom-nav.hidden-nav {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 0;
            background: none;
            border: none;
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
            position: relative;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }
        .nav-item.active {
            color: var(--primary);
        }
        .nav-item .badge-dot {
            position: absolute;
            top: 4px;
            right: 50%;
            transform: translateX(calc(50% + 12px));
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            border: 2px solid var(--surface);
        }
        .nav-item .badge-count {
            position: absolute;
            top: 2px;
            right: 50%;
            transform: translateX(calc(50% + 14px));
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 0 5px;
            border-radius: 100px;
            line-height: 14px;
            min-width: 18px;
            text-align: center;
            border: 2px solid var(--surface);
        }

        /* ─── FLOATING THEME TOGGLE ────────────────────────────────── */
        .theme-toggle-btn {
            position: fixed;
            top: 16px;
            right: max(16px, calc((100vw - 480px) / 2 + 16px));
            z-index: 150;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border2);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.32, 1, 0.64, 1), opacity 0.3s ease;
        }
        .theme-toggle-btn.hidden-toggle {
            transform: translateY(-80px);
            opacity: 0;
            pointer-events: none;
        }
        .theme-toggle-btn svg {
            width: 19px;
            height: 19px;
            position: absolute;
            transition: opacity 0.2s, transform 0.2s;
        }
        .theme-toggle-btn .icon-moon {
            opacity: 0;
            transform: rotate(-40deg) scale(0.6);
        }
        .theme-toggle-btn .icon-sun {
            opacity: 1;
            transform: rotate(0) scale(1);
        }
        [data-theme="light"] .theme-toggle-btn .icon-sun {
            opacity: 0;
            transform: rotate(40deg) scale(0.6);
        }
        [data-theme="light"] .theme-toggle-btn .icon-moon {
            opacity: 1;
            transform: rotate(0) scale(1);
        }

        /* ─── MORE OVERLAY ──────────────────────────────────────────── */
        .more-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.25s, visibility 0.25s;
        }
        .more-overlay.open {
            visibility: visible;
            opacity: 1;
        }
        .more-sheet {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 24px 24px 0 0;
            padding: 16px 20px calc(30px + env(safe-area-inset-bottom));
            transform: translateY(40px);
            transition: transform 0.34s cubic-bezier(0.32, 1, 0.64, 1);
            max-height: 80vh;
            overflow-y: auto;
        }
        .more-overlay.open .more-sheet {
            transform: translateY(0);
        }
        .more-sheet .handle {
            width: 40px;
            height: 4px;
            border-radius: 100px;
            background: var(--border2);
            margin: 0 auto 16px;
        }
        .more-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 12px;
            border-radius: var(--radius-sm);
            background: none;
            border: none;
            width: 100%;
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .more-item:hover {
            background: var(--surface2);
        }
        .more-item svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            flex-shrink: 0;
        }
        .more-item.danger {
            color: var(--danger);
            border: 1.5px solid var(--danger);
            justify-content: center;
            margin-top: 10px;
        }

        /* ─── CARDS & COMMON ───────────────────────────────────────── */
        .card,
        .thumb-row,
        .category-group,
        .stat-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .card:active,
        .thumb-row:active {
            transform: scale(0.985);
        }
        .overview-card {
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.25);
        }
        .empty-state svg {
            opacity: 0.5;
        }

        .page-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page-title .back-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 4px;
        }
        .page-title .back-btn svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            stroke-width: 2;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
        }
        .stat-card .label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 800;
            margin-top: 4px;
            line-height: 1.2;
        }
        .stat-card .value .accent {
            color: var(--primary);
        }
        .stat-card .value .success {
            color: var(--success);
        }
        .stat-card .value .danger {
            color: var(--danger);
        }
        .stat-card .value .warning {
            color: var(--warning);
        }

        .activity-list {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 0;
        }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-item .icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .activity-item .icon svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-secondary);
            stroke-width: 1.8;
        }
        .activity-item .icon.verify {
            background: rgba(124, 58, 237, 0.18);
        }
        .activity-item .icon.verify svg {
            stroke: var(--primary);
        }
        .activity-item .icon.report {
            background: rgba(239, 68, 68, 0.18);
        }
        .activity-item .icon.report svg {
            stroke: var(--danger);
        }
        .activity-item .icon.newuser {
            background: rgba(34, 197, 94, 0.18);
        }
        .activity-item .icon.newuser svg {
            stroke: var(--success);
        }
        .activity-item .content {
            flex: 1;
        }
        .activity-item .content .primary {
            font-weight: 600;
            font-size: 14px;
        }
        .activity-item .content .secondary {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .activity-item .time {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .activity-list .view-all {
            font-size: 12px;
            color: var(--primary);
            font-weight: 700;
            background: none;
            border: none;
            cursor: pointer;
        }
        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .section-head .h {
            font-weight: 700;
            font-size: 16px;
        }

        /* ─── TABS ───────────────────────────────────────────────────── */
        .filter-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-tab {
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .filter-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .filter-tab:hover {
            border-color: var(--primary);
        }
        .filter-tab .count {
            opacity: 0.7;
            margin-left: 4px;
            font-weight: 700;
        }

        /* ─── SEARCH BAR ───────────────────────────────────────────── */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        .search-bar input:focus {
            border-color: var(--primary);
        }
        .search-bar input::placeholder {
            color: var(--text-tertiary);
        }

        /* ─── REQUEST / USER / POST CARDS ─────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
        }
        .card .top {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .card .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--surface2);
            flex-shrink: 0;
        }
        .card .info {
            flex: 1;
            min-width: 0;
        }
        .card .info .name {
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .card .info .handle {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .card .info .meta {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }
        .card .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
            flex-shrink: 0;
        }
        .badge.pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }
        .badge.approved,
        .badge.resolved {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }
        .badge.rejected {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }
        .badge.verified {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }
        .badge.suspended {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }
        .badge.admin {
            background: rgba(124, 58, 237, 0.15);
            color: var(--primary);
        }
        .badge.inactive {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-tertiary);
        }
        .badge.active-badge {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }
        .badge.reviewed {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
        }
        .badge.dismissed {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-tertiary);
        }

        .card .details {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .card .details .reason {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .card .details .reason strong {
            color: var(--text);
        }

        .card .media-preview {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card .media-preview img,
        .card .media-preview video {
            max-width: 100%;
            max-height: 160px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            background: var(--surface2);
        }

        .card .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .card .actions button {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            opacity: 0.85;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            opacity: 0.85;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            opacity: 0.85;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            background: var(--surface2);
        }
        .btn-ghost {
            background: var(--surface2);
            color: var(--text);
        }
        .btn-ghost:hover {
            background: var(--border);
        }

        /* ─── CATEGORY MANAGEMENT ───────────────────────────────────── */
        .category-group {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
        }
        .category-group .cat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .category-group .cat-header .cat-name {
            font-weight: 700;
            font-size: 16px;
            flex: 1;
            min-width: 0;
        }
        .category-group .cat-header .cat-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .category-group .cat-header .cat-actions button {
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 11px;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        .subcat-list {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .subcat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .subcat-item:last-child {
            border-bottom: none;
        }
        .subcat-item .subcat-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }
        .subcat-item .subcat-actions {
            display: flex;
            gap: 4px;
        }
        .subcat-item .subcat-actions button {
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 10px;
            border: none;
            cursor: pointer;
            transition: 0.15s;
            background: var(--surface2);
            color: var(--text-secondary);
        }
        .subcat-item .subcat-actions button:hover {
            background: var(--border);
        }
        .subcat-item .subcat-actions button.danger:hover {
            background: var(--danger);
            color: #fff;
        }
        .subcat-item .subcat-actions button.success:hover {
            background: var(--success);
            color: #fff;
        }

        .add-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .add-row input {
            flex: 1;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        .add-row input:focus {
            border-color: var(--primary);
        }
        .add-row button {
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s;
            white-space: nowrap;
        }
        .add-row button:hover {
            opacity: 0.85;
        }

        .sort-btn {
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: 2px 4px;
            transition: color 0.15s;
        }
        .sort-btn:hover {
            color: var(--text);
        }

        /* ─── MODAL (Bottom Sheet) ──────────────────────────────────── */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.25s, visibility 0.25s;
        }
        .sheet-overlay.open {
            visibility: visible;
            opacity: 1;
        }
        .sheet {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 24px 24px 0 0;
            padding: 16px 20px calc(30px + env(safe-area-inset-bottom));
            transform: translateY(40px);
            transition: transform 0.34s cubic-bezier(0.32, 1, 0.64, 1);
            max-height: 85vh;
            overflow-y: auto;
        }
        .sheet-overlay.open .sheet {
            transform: translateY(0);
        }
        .sheet .handle {
            width: 40px;
            height: 4px;
            border-radius: 100px;
            background: var(--border2);
            margin: 0 auto 16px;
        }
        .sheet .title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .sheet .sub {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        .sheet .action-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

            flex: 1;
            padding: 14px;

            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: 0.15s;

        /* ─── EMPTY STATE ──────────────────────────────────────────── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 14px;
            text-align: center;
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            stroke: var(--text-tertiary);
            stroke-width: 1.2;
            fill: none;

            font-size: 18px;
            font-weight: 800;

        .empty-state p {
            font-size: 13px;
            color: var(--text-secondary);
            max-width: 280px;

            margin-top: 6px;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }

        /* ─── TOAST ──────────────────────────────────────────────────── */
        #tw {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: calc(100vw - 32px);
        }
        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
            animation: tIn 0.3s cubic-bezier(0.34, 1.2, 0.64, 1) both;
        }
        .toast.out {
            animation: tOut 0.25s ease forwards;
        }
        @keyframes tIn {
            from {
                transform: translateY(-14px);
                opacity: 0;
            }
            to {
                transform: none;
                opacity: 1;
            }
        }
        @keyframes tOut {
            to {
                transform: translateY(-10px);
                opacity: 0;
            }
        }
        .td {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .tg {
            background: var(--success);
        }
        .tr {
            background: var(--danger);
        }
        .to {
            background: var(--warning);
        }

            align-items: center;
            justify-content: center;
            padding: 20px;

        .auth-card {
            width: 100%;

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 28px;

        .auth-card .logo {

            font-weight: 900;
            text-align: center;
            color: var(--primary);

        .auth-card .title {
            font-size: 20px;
            font-weight: 800;
            text-align: center;
        }
        .auth-card .sub {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 20px;
        }
        .auth-card .field {
            margin-bottom: 14px;
        }
        .auth-card .field input {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        .auth-card .field input:focus {
            border-color: var(--primary);
        }
        .auth-card .error {
            font-size: 12px;
            color: var(--danger);

        }

            font-weight: 700;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .auth-card .btn:hover {
            opacity: 0.85;
        }
        .auth-card .btn:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
            color: var(--text-tertiary);
            font-size: 12px;

            height: 1px;
            background: var(--border);
        }
        .auth-switch {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 16px;
        }
        .auth-switch button {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        /* ─── PAGE HEADER ──────────────────────────────────────────── */

            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .detail-actionbar button.full {
            flex: 1 1 100%;

        /* ─── THUMB ROW ────────────────────────────────────────────── */
        .thumb-row {
            display: flex;

    <script>
        (function() {
            'use strict';

            // ─── THEME (persistent) ───────────────────────────────────────
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('freeupper_admin_theme', theme);
            }

            window.toggleTheme = function() {
                const current = document.documentElement.getAttribute('data-theme');
                applyTheme(current === 'dark' ? 'light' : 'dark');
                showToast('Theme updated', 'g');
            };

            const savedTheme = localStorage.getItem('freeupper_admin_theme') || 'dark';
            applyTheme(savedTheme);

            document.getElementById('themeToggleBtn').addEventListener('click', window.toggleTheme);

            // ─── STATE ──────────────────────────────────────────────────────────
            let currentTab = 'dashboard';
            let currentFilter = 'all';
            let pendingRequestId = null;
            let authMode = 'signin';
            let userSearchTerm = '';

            // Data stores
            let requests = [];
            let allUsers = [];
            let posts = [];
            let marketItems = [];
            let marketCategories = [];
            let marketSubcategories = [];
            let reportsList = [];
            let feedbackList = [];

            const sb = window.sb;
            const main = document.getElementById('mainContent');
            const bottomNav = document.getElementById('bottomNav');
            const moreOverlay = document.getElementById('moreOverlay');
            const themeToggleBtn = document.getElementById('themeToggleBtn');

            // ─── HELPERS ────────────────────────────────────────────────────────
            function fmtNum(n) {
                if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
                if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
                return String(n);
            }

            function escapeHtml(s) {
                const d = document.createElement('div');
                d.textContent = s || '';
                return d.innerHTML;
            }

            function formatDate(iso) {
                if (!iso) return '—';
                return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            function formatDateTime(iso) {
                if (!iso) return '—';
                return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric',
                    hour: '2-digit', minute: '2-digit' });
            }

            function timeAgo(iso) {
                if (!iso) return '';
                const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
                if (diff < 60) return diff + 's ago';
                if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                return Math.floor(diff / 86400) + 'd ago';
            }

            function getStatusBadgeClass(status) {
                const map = {
                    'pending': 'pending',
                    'approved': 'approved',
                    'rejected': 'rejected',
                    'revoked': 'rejected',
                    'resolved': 'resolved',
                    'dismissed': 'dismissed',
                    'reviewed': 'reviewed',
                    'new': 'pending',
                    'published': 'approved',
                    'removed': 'rejected',
                    'active': 'approved',
                    'deleted': 'rejected'
                };
                return map[status] || '';
            }

            function getStatusLabel(status) {
                const map = {
                    'pending': 'Pending',
                    'approved': 'Approved',
                    'rejected': 'Rejected',
                    'revoked': 'Revoked',
                    'resolved': 'Resolved',
                    'dismissed': 'Dismissed',
                    'reviewed': 'Reviewed',
                    'new': 'New',
                    'published': 'Published',
                    'removed': 'Removed',
                    'active': 'Active',
                    'deleted': 'Deleted'
                };
                return map[status] || status || 'Unknown';
            }

            function getCurrentUser() {
                if (window.AuthUser && window.AuthUser.getCurrentUser) {
                    return window.AuthUser.getCurrentUser();
                }
                if (typeof window.getCurrentUser === 'function') {
                    return window.getCurrentUser();
                }
                return { id: 'guest', isLoggedIn: false, displayName: 'Guest', avatar: '' };
            }

            function saveCurrentUser(user) {
                if (window.AuthUser && window.AuthUser.saveCurrentUser) {
                    window.AuthUser.saveCurrentUser(user);
                } else {
                    localStorage.setItem('freeupper_user_profile', JSON.stringify(user));

            // ─── COLORED AVATAR HELPER ───────────────────────────────────────
            const AVATAR_PALETTE = ['#ef4444', '#14b8a6', '#f59e0b', '#3b82f6', '#7c3aed', '#22c55e', '#ec4899', '#06b6d4'];

            function avatarColor(seed) {
                let hash = 0;
                const s = String(seed || 'x');
                for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
                return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
            }

            function renderAvatar(user, sizeClass = '') {
                const name = (user && (user.display_name || user.username)) || '?';
                const url = user && user.avatar_url;
                if (url) {
                    return `<img class="avatar ${sizeClass}" src="${escapeHtml(url)}" onerror="this.outerHTML=renderAvatarFallback('${escapeHtml(name)}','${sizeClass}')" alt="">`;
                }
                return renderAvatarFallback(name, sizeClass);
            }

            function renderAvatarFallback(name, sizeClass = '') {
                const initial = (name || '?').charAt(0).toUpperCase();
                const color = avatarColor(name);
                return `<div class="avatar-fallback ${sizeClass}" style="background:${color};">${initial}</div>`;
            }

            // ─── AUTH ──────────────────────────────────────────────────────────
            function renderAuth() {
                const title = document.getElementById('authTitle');
                const sub = document.getElementById('authSub');
                const nameField = document.getElementById('adminNameField');
                const submitBtn = document.getElementById('authSubmitBtn');
                const switchText = document.getElementById('authSwitch');
                if (authMode === 'signup') {
                    title.textContent = 'Create Admin Account';
                    sub.textContent = 'Sign up as an admin to manage the platform.';
                    nameField.style.display = 'block';
                    submitBtn.textContent = 'Create Account';
                    switchText.innerHTML = 'Already have an account? <button id="authSwitchBtn">Sign In</button>';
                } else {
                    title.textContent = 'Admin Access';
                    sub.textContent = 'Sign in to manage the platform.';
                    nameField.style.display = 'none';
                    submitBtn.textContent = 'Sign In';
                    switchText.innerHTML =
                        'Don\'t have an account? <button id="authSwitchBtn">Sign Up</button>';
                }
                document.getElementById('authSwitchBtn').addEventListener('click', function() {
                    authMode = authMode === 'signin' ? 'signup' : 'signin';
                    renderAuth();
                });
            }

            async function handleAuth() {
                const email = document.getElementById('adminEmail').value.trim();
                const password = document.getElementById('adminPassword').value;
                const name = document.getElementById('adminName').value.trim();
                const errorEl = document.getElementById('authError');
                const btn = document.getElementById('authSubmitBtn');
                errorEl.textContent = '';
                if (!email || !password) { errorEl.textContent = 'Please fill in email and password.'; return; }
                if (authMode === 'signup' && !name) { errorEl.textContent = 'Please enter your full name.'; return; }
                btn.disabled = true;
                btn.textContent = 'Please wait…';
                try {
                    let result;
                    if (authMode === 'signup') {
                        result = await sb.auth.signUp({
                            email,
                            password,
                            options: {
                                data: {
                                    display_name: name,
                                    username: name.toLowerCase().replace(/\s+/g, ''),
                                    is_admin: true
                                }
                            }
                        });
                        if (result.error) throw result.error;
                        if (result.data.session) {
                            await new Promise(r => setTimeout(r, 1000));
                            await sb.from('profiles').update({ is_admin: true }).eq('id', result.data.session.user.id);
                        }
                    } else {
                        result = await sb.auth.signInWithPassword({ email, password });
                        if (result.error) throw result.error;
                    }
                    document.getElementById('authOverlay').classList.add('hidden');
                    await loadData();
                } catch (e) {
                    errorEl.textContent = e.message || 'Something went wrong.';
                    btn.disabled = false;
                    btn.textContent = authMode === 'signup' ? 'Create Account' : 'Sign In';
                }
            }

            document.getElementById('authSubmitBtn').addEventListener('click', handleAuth);
            document.getElementById('adminPassword').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
            document.getElementById('adminEmail').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });

            document.getElementById('authGoogleBtn').addEventListener('click', async function() {
                const { error } = await sb.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin + '/admin.html' }
                });
                if (error) document.getElementById('authError').textContent = error.message;
            });

            window.adminSignOut = async function() {
                await sb.auth.signOut();
                document.getElementById('authOverlay').classList.remove('hidden');
                closeMore();
                renderAuth();
                main.innerHTML = '';
                setNavHidden(false);
            };

            // ─── CHECK ADMIN STATUS ──────────────────────────────────────────
            async function checkAdminStatus() {
                const user = getCurrentUser();
                if (!user.isLoggedIn && user.id.startsWith('GUEST-')) {
                    document.getElementById('authOverlay').classList.remove('hidden');
                    renderAuth();
                    return false;
                }
                try {
                    const { data, error } = await sb.from('profiles').select('is_admin, suspended').eq('id', user.id)
                        .single();
                    if (error) {
                        console.error('Profile fetch error:', error);
                        if (error.code === 'PGRST116') {
                            document.getElementById('authOverlay').classList.remove('hidden');
                            renderAuth();
                            return false;
                        }
                        throw error;
                    }
                    if (!data || !data.is_admin) {
                        document.getElementById('authOverlay').classList.add('hidden');
                        showToast('Access denied. Admin privileges required.', 'r');
                        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                        return false;
                    }
                    if (data.suspended) {
                        document.getElementById('authOverlay').classList.add('hidden');
                        showToast('Your admin account has been suspended.', 'r');
                        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                        return false;
                    }
                    user.isAdmin = true;
                    saveCurrentUser(user);
                    document.getElementById('authOverlay').classList.add('hidden');
                    return true;
                } catch (err) {
                    console.error('Failed to check admin status:', err);
                    showToast('Error checking admin status: ' + err.message, 'r');
                    document.getElementById('authOverlay').classList.remove('hidden');
                    renderAuth();
                    return false;
                }
            }

            // ─── TOAST ─────────────────────────────────────────────────────────

                el.innerHTML =
                    `<span class="td ${type === 'g' ? 'tg' : type === 'r' ? 'tr' : 'to'}"></span> ${msg}`;
                container.appendChild(el);
                setTimeout(() => {

            // ─── LOAD DATA ────────────────────────────────────────────────────
            async function loadData() {
                try {
                    const [reqs, users, ps, market, cats, subcats, reports, fb] = await Promise.all([
                        sb.from('verification_requests').select('*').order('created_at', { ascending: false }),
                        sb.from('profiles').select('*').order('display_name'),
                        sb.from('posts').select('*').order('created_at', { ascending: false }),
                        sb.from('market_items').select('*').order('created_at', { ascending: false }),
                        sb.from('market_categories').select('*').order('sort_order', { ascending: true }),
                        sb.from('market_subcategories').select('*').order('sort_order', { ascending: true }),
                        sb.from('reports').select('*').order('created_at', { ascending: false }),
                        sb.from('feedback').select('*').order('created_at', { ascending: false })
                    ]);

                    if (reqs.error) throw reqs.error;
                    if (users.error) throw users.error;
                    if (ps.error) throw ps.error;
                    if (market.error) throw market.error;
                    if (cats.error) throw cats.error;
                    if (subcats.error) throw subcats.error;
                    if (reports.error) throw reports.error;
                    if (fb.error) throw fb.error;

                    requests = reqs.data || [];
                    allUsers = users.data || [];
                    posts = ps.data || [];
                    marketItems = market.data || [];
                    marketCategories = cats.data || [];
                    marketSubcategories = subcats.data || [];
                    reportsList = reports.data || [];
                    feedbackList = fb.data || [];

                    updateBadges();
                    renderView(currentTab);
                } catch (err) {
                    console.error('Failed to load admin data:', err);
                    showToast('Failed to load data: ' + err.message, 'r');
                    main.innerHTML = `
                            <div class="empty-state">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                <h3>Data Loading Failed</h3>
                                <p>${escapeHtml(err.message)}</p>
                                <button class="cta-btn" onclick="loadData()">Retry</button>
                            </div>
                        `;
                }
            }

            // ─── DASHBOARD ────────────────────────────────────────────────────
            function renderDashboard() {
                const usersCount = allUsers.length;
                const postsCount = posts.length;
                const reportsOpen = reportsList.filter(r => r.status === 'pending' || r.status === 'under_review').length;
                const pendingReqs = requests.filter(r => r.status === 'pending').length;
                const totalBellCount = pendingReqs + reportsOpen;

                const activities = [];
                requests.filter(r => r.status === 'pending' || r.status === 'approved').slice(0, 3).forEach(r => {
                    const user = allUsers.find(u => u.id === r.user_id);
                    activities.push({
                        type: 'verify',
                        title: `@${user ? (user.username || user.display_name) : 'Unknown'}`,
                        sub: 'Verification request',
                        time: r.created_at,
                        status: r.status
                    });
                });
                reportsList.slice(0, 2).forEach(r => {
                    activities.push({
                        type: 'report',
                        title: 'New report submitted',
                        sub: r.reason || 'Inappropriate content',
                        time: r.created_at,
                        status: r.status
                    });
                });
                activities.sort((a, b) => new Date(b.time) - new Date(a.time));
                const top = activities.slice(0, 5);

                    if (type === 'verify') return `<div class="icon verify">${ICONS.verify}</div>`;

            // ─── REQUESTS ──────────────────────────────────────────────────────
            function renderRequests() {
                const counts = {
                    all: requests.length,
                    pending: requests.filter(r => r.status === 'pending').length,
                    approved: requests.filter(r => r.status === 'approved').length,
                };
                let filtered = requests;
                if (currentFilter !== 'all') filtered = requests.filter(r => r.status === currentFilter);

                const html = filtered.length ? filtered.map(req => {
                    const user = allUsers.find(u => u.id === req.user_id);
                    const name = user ? user.display_name : 'Unknown';
                    const username = user ? user.username : '';
                    const statusClass = getStatusBadgeClass(req.status);
                    const statusLabel = getStatusLabel(req.status);

                    return `
                                <div class="card" style="cursor:pointer;" onclick="openRequestDetail('${req.id}')">
                                    <div class="top">
                                        ${renderAvatar(user, '')}
                                        <div class="info">
                                            <div class="name">${username ? '@' + escapeHtml(username) : escapeHtml(name)}</div>
                                            <div class="handle">Verification request</div>
                                        </div>
                                        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                                            <div class="time" style="color:var(--text-tertiary);font-size:11px;">${timeAgo(req.created_at)}</div>
                                            <span class="badge ${statusClass}">${statusLabel}</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                }).join('') : `
                            <div class="empty-state">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                <h3>No requests</h3>
                                <p>${currentFilter === 'all' ? 'No verification requests found.' : `No ${currentFilter} requests.`}</p>
                            </div>
                        `;

                main.innerHTML = `
                            <div class="page-header">
                                <div class="title-block"><div class="title">Requests</div></div>
                                <button class="icon-btn">${ICONS.search}</button>
                            </div>
                            <div class="filter-tabs">
                                <button class="filter-tab ${currentFilter === 'all' ? 'active' : ''}" onclick="setReqFilter('all')">All <span class="count">${counts.all}</span></button>
                                <button class="filter-tab ${currentFilter === 'pending' ? 'active' : ''}" onclick="setReqFilter('pending')">Pending <span class="count">${counts.pending}</span></button>

            async function moveCategory(categoryId, direction) {
                const idx = marketCategories.findIndex(c => c.id === categoryId);
                if (idx === -1) return;
                const newIdx = idx + direction;
                if (newIdx < 0 || newIdx >= marketCategories.length) return;
                const ids = marketCategories.map(c => c.id);
                [ids[idx], ids[newIdx]] = [ids[newIdx], ids[idx]];
                try {
                    for (let i = 0; i < ids.length; i++) {
                        await sb.from('market_categories').update({ sort_order: i }).eq('id', ids[i]);
                    }
                    showToast('Order updated', 'g');
                    await loadData();
                } catch (err) {
                    showToast('Failed: ' + err.message, 'r');
                }

                                    <div class="info"><div class="name">Theme</div><div class="handle">Switch between dark and light mode</div></div>
                                    <button class="icon-btn" onclick="toggleTheme()">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                                    </button>
                                </div>
                            </div>

                            <div style="font-size:11px;font-weight:700;color:var(--text-tertiary);margin:16px 0 8px;letter-spacing:0.5px;">ACCOUNT</div>
                            <div class="card">
                                <div class="top"><div class="info"><div class="name">Sign Out</div></div></div>
                                <div class="actions">
                                    <button class="btn-danger" onclick="adminSignOut()">Sign Out</button>
                                </div>
                            </div>
                        `;
            }

            // ─── VERIFICATION FUNCTIONS (reverted to pre-Step-4) ────────────
            window.approveRequest = async function(requestId) {
                if (!confirm('Approve this verification request?')) return;
                try {
                    const { data: reqData, error: reqError } = await sb.from('verification_requests').select('*').eq('id',
                        requestId).single();
                    if (reqError) throw reqError;
                    const { data: updatedReq, error: updateReqError } = await sb
                        .from('verification_requests')
                        .update({ status: 'approved', reviewed_at: new Date().toISOString() })
                        .eq('id', requestId)
                        .select();
                    if (updateReqError) throw updateReqError;
                    if (!updatedReq || updatedReq.length === 0) throw new Error('Request update failed – check RLS.');
                    const { data: updatedProfile, error: profileError } = await sb
                        .from('profiles')
                        .update({ verified: true, verified_status: 'verified' })
                        .eq('id', reqData.user_id)
                        .select();
                    if (profileError) throw profileError;
                    if (!updatedProfile || updatedProfile.length === 0) throw new Error('Profile update failed – check RLS.');
                    showToast('✅ Verification approved!', 'g');
                    await loadData();
                } catch (err) {
                    showToast('Failed to approve: ' + err.message, 'r');
                }
            };

            window.verifyUserDirectly = async function(userId) {
                if (!confirm('Verify this user directly?')) return;
                try {
                    const { data, error } = await sb
                        .from('profiles')
                        .update({ verified: true, verified_status: 'verified' })
                        .eq('id', userId)
                        .select();
                    if (error) throw error;
                    if (!data?.length) throw new Error('Update blocked – check RLS.');
                    showToast('✅ User verified directly!', 'g');
                    await loadData();
                } catch (err) {
                    showToast('Failed to verify: ' + err.message, 'r');
                }
            };

            window.withdrawVerification = async function(userId) {
                if (!confirm('Withdraw verified badge?')) return;
                try {
                    const { data, error } = await sb
                        .from('profiles')
                        .update({ verified: false, verified_status: 'none' })
                        .eq('id', userId)
                        .select();
                    if (error) throw error;
                    if (!data?.length) throw new Error('Update blocked – check RLS.');
                    await sb.from('verification_requests')
                        .update({ status: 'revoked', reviewed_at: new Date().toISOString() })
                        .eq('user_id', userId)
                        .eq('status', 'approved');
                    showToast('Verification withdrawn', 'o');
                    await loadData();
                } catch (err) {
                    showToast('Failed to withdraw: ' + err.message, 'r');
                }
            };

            // ─── REJECT SHEET ──────────────────────────────────────────────────
            window.openRejectSheet = function(requestId) {
                pendingRequestId = requestId;
                const html = `
                            <div class="title">Reject Verification</div>
                            <div class="sub">Provide a reason (optional)</div>
                            <textarea id="rejectReasonInput" style="width:100%;min-height:80px;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;resize:vertical;font-family:inherit;"></textarea>
                            <div style="text-align:right;font-size:12px;color:var(--text-tertiary);margin-top:4px;" id="rejectCharCount">0 / 500</div>
                            <div class="action-row">
                                <button class="btn-outline" style="flex:1;" onclick="closeSheet();">Cancel</button>
                                <button class="btn-danger" style="flex:1;" onclick="confirmRejectSheet();">Reject</button>
                            </div>
                        `;
                openSheet(html);
                document.getElementById('rejectReasonInput')?.addEventListener('input', function() {
                    document.getElementById('rejectCharCount').textContent = this.value.length + ' / 500';
                });
            };

            window.confirmRejectSheet = async function() {
                if (!pendingRequestId) return;
                const reason = document.getElementById('rejectReasonInput')?.value.trim() || '';
                try {
                    const admin = getCurrentUser();
                    const { data: reqData, error: reqError } = await sb.from('verification_requests').select('*').eq('id',
                        pendingRequestId).single();
                    if (reqError) throw reqError;
                    const { data: updatedReq, error: updateError } = await sb
                        .from('verification_requests')
                        .update({
                            status: 'rejected',
                            reviewed_at: new Date().toISOString(),
                            rejection_reason: reason || null,
                            reviewed_by: admin.id
                        })
                        .eq('id', pendingRequestId)
                        .select();
                    if (updateError) throw updateError;
                    if (!updatedReq || updatedReq.length === 0) throw new Error('Update failed – check RLS.');
                    closeSheet();
                    showToast('❌ Verification rejected', 'o');
                    await loadData();
                } catch (err) {
                    showToast('Failed to reject: ' + err.message, 'r');
                } finally {
                    pendingRequestId = null;
                }
            };

            // ─── FIXED DELETE POST ───────────────────────────────────────────
            window.deletePost = async function(postId) {
                if (!confirm('Delete this post permanently?')) return;
                try {
                    const { data: post, error: fetchError } = await sb
                        .from('posts')
                        .select('media, media_url, media_type, image_public_id, video_public_id')
                        .eq('id', postId)
                        .single();
                    if (fetchError) throw fetchError;

                    const { data, error } = await sb.from('posts').delete().eq('id', postId).select();
                    if (error) throw error;
                    if (!data?.length) throw new Error('Delete blocked – check RLS.');

                    let imagePublicId = post?.image_public_id;
                    let videoPublicId = post?.video_public_id;

                    if (post?.media && Array.isArray(post.media)) {
                        for (const item of post.media) {
                            if (item.public_id) {
                                if (item.type === 'video') videoPublicId = item.public_id;
                                else imagePublicId = item.public_id;
                            }
                        }
                    }

                    if (!imagePublicId && post?.media_url) {
                        imagePublicId = extractPublicIdFromUrl(post.media_url);
                    }

                    if (imagePublicId) await deleteCloudinaryMedia(imagePublicId, 'image');
                    if (videoPublicId) await deleteCloudinaryMedia(videoPublicId, 'video');

                    showToast('🗑️ Post deleted', 'o');
                    await loadData();
                } catch (err) {
                    showToast('Failed to delete post: ' + err.message, 'r');
                }
            };

            // ─── FIXED DELETE LISTING ─────────────────────────────────────────
            window.deleteListing = async function(itemId) {
                if (!confirm('Delete this listing permanently?')) return;
                try {
                    const { data: item, error: fetchError } = await sb
                        .from('market_items')
                        .select('images, image_url, video_url, media_type, image_public_id, video_public_id')
                        .eq('id', itemId)
                        .single();
                    if (fetchError) throw fetchError;

                    const { data, error } = await sb.from('market_items').delete().eq('id', itemId).select();
                    if (error) throw error;
                    if (!data?.length) throw new Error('Delete blocked – check RLS.');

                    let imagePublicId = item?.image_public_id;
                    let videoPublicId = item?.video_public_id;

                    if (item?.images && Array.isArray(item.images)) {
                        for (const img of item.images) {
                            if (img.public_id) imagePublicId = img.public_id;
                        }
                    }

                    if (!imagePublicId && item?.image_url) {
                        imagePublicId = extractPublicIdFromUrl(item.image_url);
                    }
                    if (!videoPublicId && item?.video_url) {
                        videoPublicId = extractPublicIdFromUrl(item.video_url);
                    }

                    if (imagePublicId) await deleteCloudinaryMedia(imagePublicId, item?.media_type || 'image');
                    if (videoPublicId) await deleteCloudinaryMedia(videoPublicId, 'video');

                    showToast('🗑️ Listing deleted', 'o');
                    await loadData();
                } catch (err) {
                    showToast('Failed to delete listing: ' + err.message, 'r');
                }
            };

            // ─── SUSPEND / UNSUSPEND ─────────────────────────────────────────
            window.suspendUser = async function(userId) {
                const reason = prompt('Reason for suspension:');
                if (reason === null) return;
                try {
                    const { data, error } = await sb
                        .from('profiles')
                        .update({ suspended: true, suspended_reason: reason || null, suspended_at: new Date()
                                .toISOString() })
                        .eq('id', userId)
                        .select();
                    if (error) throw error;
                    if (!data?.length) throw new Error('Update blocked – check RLS.');
                    showToast('🚫 User suspended', 'o');
                    await loadData();
                } catch (err) {
                    showToast('Failed to suspend: ' + err.message, 'r');
                }
            };

            window.unsuspendUser = async function(userId) {
                if (!confirm('Restore this user\'s access?')) return;
                try {
                    const { data, error } = await sb
                        .from('profiles')
                        .update({ suspended: false, suspended_reason: null, suspended_at: null })
                        .eq('id', userId)
                        .select();
                    if (error) throw error;
                    if (!data?.length) throw new Error('Update blocked – check RLS.');
                    showToast('✅ User restored', 'g');
                    await loadData();
                } catch (err) {
                    showToast('Failed to restore: ' + err.message, 'r');
                }
            };

            // ─── EXPOSE FUNCTIONS TO GLOBAL ──────────────────────────────────
            window.loadData = loadData;
            window.switchTab = switchTab;
            window.renderCategories = renderCategories;
            window.addCategory = addCategory;
            window.editCategory = editCategory;
            window.deleteCategory = deleteCategory;
            window.toggleCategoryActive = toggleCategoryActive;
            window.moveCategory = moveCategory;
            window.addSubcategory = addSubcategory;
            window.editSubcategory = editSubcategory;
            window.deleteSubcategory = deleteSubcategory;
            window.toggleSubcategoryActive = toggleSubcategoryActive;
            window.moveSubcategory = moveSubcategory;
            window.openMore = openMore;
            window.closeMore = closeMore;

            // ─── INIT ──────────────────────────────────────────────────────────
            async function init() {
                document.getElementById('authOverlay').classList.remove('hidden');
                renderAuth();
                const isAdmin = await checkAdminStatus();
                if (isAdmin) {
                    await loadData();
                    if (typeof window.setupProfileSync === 'function') {
                        window.setupProfileSync(function(user) { loadData(); });
                    }
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
