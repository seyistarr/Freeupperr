                if (!confirm('Restore this user\'s access?')) return;
                try {
                    const { data, error } = await sb
                        .from('profiles')
                        .update({ suspended: false, suspended_reason: null, suspended_at: null })
                        .eq('id', userId)
                        .select();
                    if (error) throw error;
                    if (!data?.length) throw new Error('Update blocked — check RLS policy.');
                    showToast('✅ User restored', 'g');
                    await loadData();
                } catch (err) {
                    showToast('Failed to restore: ' + err.message, 'r');
                }
            };

            // ─── WITHDRAW VERIFICATION ────────────────
            window.withdrawVerification = async function(userId) {
                if (!confirm('Withdraw verified badge?')) return;
                try {
                    const { data, error } = await sb
                        .from('profiles')
                        .update({ verified: false, verified_status: 'none' })
                        .eq('id', userId)
                        .select();
                    if (error) throw error;
                    if (!data?.length) throw new Error('Update blocked — check RLS policy.');

                    await sb
                        .from('verification_requests')
                        .update({ status: 'revoked', reviewed_at: new Date().toISOString() })
                        .eq('user_id', userId)
                        .eq('status', 'approved');

                    showToast('Verification withdrawn', 'o');
                    await loadData();
                } catch (err) {
                    showToast('Failed to withdraw: ' + err.message, 'r');
                }
            };

            // ─── RESOLVE REPORT ──────────────────────
            window.resolveReport = async function(reportId, status) {
                try {
                    const user = getCurrentUser();
                    const { data, error } = await sb
                        .from('reports')
                        .update({
                            status,
                            reviewed_at: new Date().toISOString(),
                            reviewed_by: user.id
                        })
                        .eq('id', reportId)
                        .select();
                    if (error) throw error;
                    if (!data?.length) throw new Error('Update blocked — check RLS policy.');
                    showToast(status === 'resolved' ? '✅ Report resolved' : 'Report dismissed', 'g');
                    await loadData();
                } catch (err) {
                    showToast('Failed: ' + err.message, 'r');
                }
            };

            // ─── MARK FEEDBACK REVIEWED ──────────────
            window.markFeedbackReviewed = async function(feedbackId) {
                try {
                    const { data, error } = await sb
                        .from('feedback')
                        .update({ status: 'reviewed' })
                        .eq('id', feedbackId)
                        .select();
                    if (error) throw error;
                    if (!data?.length) throw new Error('Update blocked — check RLS policy.');
                    showToast('Marked as reviewed', 'g');
                    await loadData();
                } catch (err) {
                    showToast('Failed: ' + err.message, 'r');
                }
            };

            // ─── MODAL HELPERS ──────────────────────────
            window.openMov = function(id) {
                document.getElementById(id).classList.add('open');
                document.body.style.overflow = 'hidden';
            };
            window.closeMov = function(id) {
                document.getElementById(id).classList.remove('open');
                document.body.style.overflow = '';
            };

            // ─── INIT ──────────────────────────────────
            async function init() {
                document.getElementById('adminContent').innerHTML = `
                    <div class="empty-state">
                        <div class="icon"><div class="spinner" style="width:32px;height:32px;"></div></div>
                        <h3>Loading...</h3>
                    </div>
                `;

                const isAdmin = await checkAdminStatus();
                if (isAdmin) {
                    await loadData();
                    setupProfileSync(function(user) {
                        loadData();
                    });
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
