    <!-- ══════════════════════════════════════════
    PAGE LOGIC
    ══════════════════════════════════════════ -->
    <script>
        /**
         * ================================================================
         *  CREATE PAGE — Freeupper
         *  Version: 2.5 (composer video tiles render stored posters)
         *  Description: Full-featured post & marketplace listing composer
         *  with live purple highlighting for @mentions and #hashtags.
         *
         *  v2.5 changes
         *  ----------------------------------------------------------------
         *  - renderPostImageGrid() now prefers m.thumbnailUrl when
         *    present, rendering video tiles as <img> instead of a raw
         *    <video> with no poster. Previously a freshly uploaded
         *    video's tile stayed a black rectangle until the browser
         *    finished decoding a frame, even though Cloudinary had
         *    already returned a perfect JPG poster that was sitting
         *    unused on the media object.
         *  - Added forceComposerVideoThumbnails() — composer twin of
         *    profile.html's forceVideoThumbnails(). Runs at the end of
         *    every render and seeks any remaining <video> tiles to
         *    their first frame. Only matters during the blob-URL window
         *    (before Cloudinary responds) or if a poster failed to
         *    generate server-side. No-op when every video tile is an
         *    <img>.
         *  - The <img src="…mp4"> trap is avoided by the same
         *    hasPoster guard used on the profile side: thumbnailUrl
         *    must differ from the video URL to be used as an <img>.
         *
         *  v2.4 changes
         *  ----------------------------------------------------------------
         *  - YouTube thumbnail URL switched from maxresdefault.jpg to
         *    hqdefault.jpg in both buildYouTubeThumb() and the composer's
         *    YouTube-link branch.
         *  - No other behaviour changed from v2.3.
         *
         *  v2.3 changes
         *  ----------------------------------------------------------------
         *  - Added thumbnail helpers (buildCloudinaryVideoThumb,
         *    buildYouTubeThumb, resolveMediaThumbnail) under CONFIG.
         *  - uploadToCloudinary() resolves with thumbnailUrl so every
         *    uploaded video carries its own poster frame.
         *  - handlePostUpload() stores thumbnailUrl on the media entry.
         *  - previewPostMedia() attaches thumbnailUrl to YouTube links
         *    and external image links.
         *  - submitPost() maps thumbnailUrl into each media entry and
         *    passes it at the top level of PostsAPI.createPost so
         *    posts.js can persist posts.thumbnail_url directly.
         * ================================================================
         */

        // ──────────────────────────────────────────────────────────────
        // 1.  CONFIGURATION
        // ──────────────────────────────────────────────────────────────

        const CONFIG = {
            CLOUDINARY: {
                cloudName: 'duzyf1kda',
                imagePreset: 'image_upload',
                videoPreset: 'video_upload',
                marketPreset: 'market_upload',
            },
            LIMITS: {
                maxFileSize: 5 * 1024 * 1024, // 5MB
                maxVideoSize: 100 * 1024 * 1024, // 100MB
                maxVideoDuration: 180, // seconds
                maxPostImages: 20,
                maxMarketImages: 5,
                maxTitleLength: 100,
                maxContentLength: 10000,
            },
            DEBOUNCE: {
                mention: 250,
                hashtag: 250,
                search: 300,
            }
        };

        // ──────────────────────────────────────────────────────────────
        // 1b. VIDEO THUMBNAIL HELPERS
        // --------------------------------------------------------------
        // These run client-side at upload time. The generated URL is
        // stored on the media item and later lands in posts.thumbnail_url
        // via posts.js. Profile grids and the composer grid both render
        // an <img> for video posts instead of decoding the <video>.
        //
        // Cloudinary: swap /video/upload/ for a transformation that
        // extracts a poster JPG at 0s, then change the extension to
        // .jpg. The so_auto parameter picks the best frame; w/h/c_fill
        // gives us a square crop matching the grid aspect. If your
        // Cloudinary plan rejects so_auto, swap it for so_0 — see the
        // note in buildCloudinaryVideoThumb below.
        //
        // YouTube: img.youtube.com serves several quality variants of a
        // video's poster. hqdefault is used because it always exists.
        // maxresdefault only exists for HD uploads and 404s for Shorts,
        // vertical, older, and most music videos. hqdefault is 480×360
        // with tiny 4:3 letterbox bars on 16:9 videos; the tile's
        // object-fit: cover crops those bars away.
        // ──────────────────────────────────────────────────────────────

        function buildCloudinaryVideoThumb(videoUrl) {
            if (!videoUrl || typeof videoUrl !== 'string') return '';
            if (!/res\.cloudinary\.com\/.+\/video\/upload\//.test(videoUrl)) {
                return '';
            }
            // so_auto requires a Cloudinary plan that supports smart
            // frame extraction. If you see 400/404 responses on the
            // generated JPG, swap 'so_auto' for 'so_0' below — that
            // extracts the literal frame at t=0 and is universally
            // supported. The tradeoff is a potentially dark poster if
            // the video opens on a fade-from-black.
            return videoUrl
                .replace(
                    '/video/upload/',
                    '/video/upload/so_auto,w_800,h_800,c_fill/'
                )
                .replace(
                    /\.(mp4|mov|webm|mkv|avi|m4v)(\?.*)?$/i,
                    '.jpg'
                );
        }

        function buildYouTubeThumb(videoUrl) {
            if (!videoUrl) return '';
            var match = videoUrl.match(
                /(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
            );
            return match
                ? 'https://img.youtube.com/vi/' + match[1] + '/hqdefault.jpg'
                : '';
        }

        function resolveMediaThumbnail(media) {
            if (!media) return '';
            if (media.thumbnailUrl) {
                return media.thumbnailUrl;
            }
            if (media.type === 'video') {
                return (
                    buildYouTubeThumb(media.url) ||
                    buildCloudinaryVideoThumb(media.url)
                );
            }
            return media.url || '';
        }

        // ──────────────────────────────────────────────────────────────
        // 2.  STATE
        // ──────────────────────────────────────────────────────────────

        const state = {
            // Post
            postMedia: [],
            postEmbeddings: [],
            postFullscreenImages: [],

            // Market
            marketImages: [],
            marketLat: null,
            marketLng: null,
            marketFullscreenImages: [],

            // Categories
            categories: [],
            subcategories: [],
            selectedCategoryId: '',
            selectedSubcategoryId: '',
            categoriesLoaded: false,

            // UI
            pickerMode: 'category',
            pickerData: [],
            fullscreenData: null,
            lastUploadTime: 0,

            // Suggestion state
            hashtagTriggerStart: -1,
            mentionTriggerStart: -1,
            hashtagSearchTimer: null,
            mentionSearchTimer: null,
        };

        // ──────────────────────────────────────────────────────────────
        // 3.  TOAST SYSTEM
        // ──────────────────────────────────────────────────────────────

        function showToast(message, type = 'p') {
            const container = document.getElementById('tw');
            if (!container) return;

            const types = {
                g: 'tg',
                p: 'tp',
                r: 'tr',
                o: 'to'
            };
            const dotClass = types[type] || 'tp';

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `<div class="td ${dotClass}"></div>${message}`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('out');
                setTimeout(() => toast.remove(), 300);
            }, 2800);
        }

        // ──────────────────────────────────────────────────────────────
        // 4.  USER HELPERS
        // ──────────────────────────────────────────────────────────────

        function getCurrentUser() {
            if (window.AuthUser && typeof window.AuthUser.getCurrentUser === 'function') {
                return window.AuthUser.getCurrentUser();
            }
            if (typeof window.getCurrentUser === 'function') {
                return window.getCurrentUser();
            }
            return null;
        }

        function requireAuth(redirectOnFail = true) {
            const user = getCurrentUser();
            if (user && user.isLoggedIn) return user;

            showToast('Please sign in to continue', 'o');
            if (redirectOnFail && window.AuthUser && typeof window.AuthUser.openModal === 'function') {
                window.AuthUser.openModal('signup');
            }
            return null;
        }

        // ──────────────────────────────────────────────────────────────
        // 5.  HASHTAG EXTRACTION
        // ──────────────────────────────────────────────────────────────

        function extractHashtags(text) {
            if (!text) return [];
            const matches = text.match(/#(\w{1,50})/g) || [];
            const seen = new Set();
            const result = [];
            for (const match of matches) {
                const tag = match.slice(1).toLowerCase();
                if (!seen.has(tag)) {
                    seen.add(tag);
                    result.push(tag);
                }
            }
            return result;
        }

        function mergeHashtagLists(...lists) {
            const seen = new Set();
            const result = [];
            for (const tag of lists.flat()) {
                const key = tag.toLowerCase();
                if (!seen.has(key)) {
                    seen.add(key);
                    result.push(tag);
                }
            }
            return result;
        }

        // ──────────────────────────────────────────────────────────────
        // 6.  UNICODE FORMATTING
        // ──────────────────────────────────────────────────────────────

        const UNI_RANGES = {
            bold: { upper: 0x1D400, lower: 0x1D41A, digit: 0x1D7CE },
            italic: { upper: 0x1D434, lower: 0x1D44E, digit: null },
            mono: { upper: 0x1D670, lower: 0x1D68A, digit: 0x1D7F6 }
        };
        const ITALIC_EXCEPTIONS = { h: '\u210E' };

        function buildUnicodeMap(kind) {
            const range = UNI_RANGES[kind];
            const map = {};
            for (let i = 0; i < 26; i++) {
                const upperChar = String.fromCharCode(65 + i);
                const lowerChar = String.fromCharCode(97 + i);
                map[upperChar] = String.fromCodePoint(range.upper + i);
                map[lowerChar] = (kind === 'italic' && lowerChar === 'h') ? ITALIC_EXCEPTIONS.h : String.fromCodePoint(
                    range.lower + i);
            }
            if (range.digit !== null) {
                for (let i = 0; i < 10; i++) {
                    map[String(i)] = String.fromCodePoint(range.digit + i);
                }
            }
            return map;
        }

        const FORMAT_MAPS = {
            bold: buildUnicodeMap('bold'),
            italic: buildUnicodeMap('italic'),
            mono: buildUnicodeMap('mono')
        };

        const REVERSE_FORMAT_MAP = {};
        for (const map of Object.values(FORMAT_MAPS)) {
            for (const [plain, styled] of Object.entries(map)) {
                REVERSE_FORMAT_MAP[styled] = plain;
            }
        }

        function splitProtectedSegments(text) {
            const tokenRe = /([#@]\w{1,50})/g;
            const segments = [];
            let lastIndex = 0;
            let match;
            while ((match = tokenRe.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    segments.push({ text: text.slice(lastIndex, match.index), protected: false });
                }
                segments.push({ text: match[0], protected: true });
                lastIndex = match.index + match[0].length;
            }
            if (lastIndex < text.length) {
                segments.push({ text: text.slice(lastIndex), protected: false });
            }
            return segments;
        }

        function transformText(text, kind) {
            const segments = splitProtectedSegments(text);
            return segments.map(seg => {
                if (seg.protected) return seg.text;
                if (kind === 'normal') {
                    return [...seg.text].map(ch => REVERSE_FORMAT_MAP[ch] || ch).join('');
                }
                const map = FORMAT_MAPS[kind];
                return [...seg.text].map(ch => map[ch] || ch).join('');
            }).join('');
        }

        function applyUnicodeFormat(kind) {
            const ta = document.getElementById('postContent');
            if (!ta) return;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            if (start === end) {
                showToast('Select some text first', 'o');
                return;
            }
            const before = ta.value.slice(0, start);
            const selected = ta.value.slice(start, end);
            const after = ta.value.slice(end);
            const transformed = transformText(selected, kind);
            ta.value = before + transformed + after;
            const newEnd = start + transformed.length;
            ta.focus();
            ta.setSelectionRange(start, newEnd);
            ta.dispatchEvent(new Event('input'));
        }

        function insertAtCursor(char) {
            const ta = document.getElementById('postContent');
            if (!ta) return;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            ta.value = ta.value.slice(0, start) + char + ta.value.slice(end);
            ta.focus();
            ta.setSelectionRange(start + 1, start + 1);
            ta.dispatchEvent(new Event('input'));
        }

        // ──────────────────────────────────────────────────────────────
        // 7.  MENTION BACKDROP (LIVE HIGHLIGHT)
        // ──────────────────────────────────────────────────────────────

        function escapeHtmlForMentions(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        function syncMentionBackdrop(textareaEl, backdropEl) {
            if (!textareaEl || !backdropEl) return;
            const text = textareaEl.value;
            const mentions = textareaEl._mentions || [];
            const usernames = new Set(mentions.map(m => (m.username || '').toLowerCase()));
            let html = escapeHtmlForMentions(text);

            // Highlight confirmed mentions (from mentions.js)
            if (usernames.size) {
                html = html.replace(/@([A-Za-z0-9_]{1,30})/g, (match, uname) =>
                    usernames.has(uname.toLowerCase()) ? `<span class="mention-highlight">@${uname}</span>` : match
                );
            }

            // Highlight any #hashtag as the user types — every # token counts,
            // not just ones confirmed via suggestion click.
            html = html.replace(/#(\w{1,50})/g, '<span class="mention-highlight">#$1</span>');

            backdropEl.innerHTML = html + (text.endsWith('\n') ? '<br>&nbsp;' : '');
            backdropEl.scrollTop = textareaEl.scrollTop;
        }

        function initContentBackdrop() {
            const ta = document.getElementById('postContent');
            const bd = document.getElementById('postContentBackdrop');
            if (!ta || !bd || ta._backdropWired) return;
            ta._backdropWired = true;
            ta.addEventListener('input', () => {
                syncMentionBackdrop(ta, bd);
            });
            ta.addEventListener('scroll', () => { bd.scrollTop = ta.scrollTop; });
            syncMentionBackdrop(ta, bd);
        }

        function initTitleBackdrop() {
            const ta = document.getElementById('postTitle');
            const bd = document.getElementById('postTitleBackdrop');
            if (!ta || !bd || ta._backdropWired) return;
            ta._backdropWired = true;
            ta.addEventListener('input', () => {
                syncMentionBackdrop(ta, bd);
            });
            ta.addEventListener('scroll', () => { bd.scrollLeft = ta.scrollLeft; });
            syncMentionBackdrop(ta, bd);
        }

        // ──────────────────────────────────────────────────────────────
        // 8.  HASHTAG SUGGESTIONS
        // ──────────────────────────────────────────────────────────────

        function handleHashtagTyping(ta) {
            // Check if hashtags.js loaded
            if (!window.Hashtags || typeof window.Hashtags.searchHashtags !== 'function') {
                console.error('[Create] hashtags.js did not load — # suggestions disabled. Check Network tab for a 404.');
                return;
            }

            const cursor = ta.selectionStart;
            const text = ta.value;
            const hashStart = text.lastIndexOf('#', cursor - 1);
            if (hashStart === -1) {
                closeHashtagSuggestions();
                return;
            }
            const between = text.slice(hashStart + 1, cursor);
            if (/\s/.test(between) || between.length > 50) {
                closeHashtagSuggestions();
                return;
            }

            state.hashtagTriggerStart = hashStart;
            const query = between;

            clearTimeout(state.hashtagSearchTimer);
            state.hashtagSearchTimer = setTimeout(async () => {
                try {
                    const results = await window.Hashtags.searchHashtags(query);
                    renderHashtagSuggestions(results, query, ta);
                } catch (err) {
                    console.warn('[Hashtags] Search error:', err);
                }
            }, CONFIG.DEBOUNCE.hashtag);
        }

        function renderHashtagSuggestions(results, query, ta) {
            const box = document.getElementById('hashtagSuggestions');
            if (!box) return;

            const items = [...results];
            const exists = items.some(r => r.tag.toLowerCase() === query.toLowerCase());
            if (query && !exists) {
                items.push({ tag: query, count: 0, isNew: true });
            }
            if (!items.length) {
                box.style.display = 'none';
                return;
            }

            const rect = ta.getBoundingClientRect();
            box.style.left = rect.left + 'px';
            box.style.top = (rect.bottom + 6) + 'px';
            box.style.width = Math.min(rect.width, 340) + 'px';

            box.innerHTML = items.map(r => `
                        <div class="h-item" data-tag="${r.tag}" role="option">
                            <span class="h-name">#${r.tag}</span>
                            <span class="h-count ${r.isNew ? 'h-new' : ''}">${r.isNew ? 'New hashtag' : formatCount(r.count) + ' posts'}</span>
                        </div>
                    `).join('');
            box.style.display = 'block';

            box.querySelectorAll('.h-item').forEach(el => {
                el.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    insertHashtagCompletion(ta, el.dataset.tag);
                });
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    insertHashtagCompletion(ta, el.dataset.tag);
                });
            });
        }

        function insertHashtagCompletion(ta, tag) {
            if (state.hashtagTriggerStart === -1) return;
            const cursor = ta.selectionStart;
            const before = ta.value.slice(0, state.hashtagTriggerStart);
            const after = ta.value.slice(cursor);
            const insertion = '#' + tag + ' ';
            ta.value = before + insertion + after;
            const newPos = before.length + insertion.length;
            ta.focus();
            ta.setSelectionRange(newPos, newPos);
            closeHashtagSuggestions();
            ta.dispatchEvent(new Event('input'));
        }

        function closeHashtagSuggestions() {
            const box = document.getElementById('hashtagSuggestions');
            if (box) box.style.display = 'none';
            state.hashtagTriggerStart = -1;
        }

        function formatCount(n) {
            n = Number(n) || 0;
            if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
            return String(n);
        }

        // ──────────────────────────────────────────────────────────────
        // 9.  INIT CONTENT FIELD
        // ──────────────────────────────────────────────────────────────

        function initContentField() {
            const ta = document.getElementById('postContent');
            if (!ta) return;

            // Mentions
            if (window.Mentions && typeof window.Mentions.initMentions === 'function') {
                window.Mentions.initMentions(ta);
            } else {
                console.error('[Create] mentions.js did not load — @ suggestions disabled. Check Network tab for a 404.');
            }

            // Hashtags
            if (!window.Hashtags || typeof window.Hashtags.searchHashtags !== 'function') {
                console.error('[Create] hashtags.js did not load — # suggestions disabled. Check Network tab for a 404.');
            }

            ta.addEventListener('input', () => {
                handleHashtagTyping(ta);
                updateContentCounter(ta);
            });

            // Char counter
            const countEl = document.getElementById('postContentCount');
            if (countEl) {
                ta.addEventListener('input', () => {
                    const len = ta.value.length;
                    countEl.textContent = len + ' characters';
                    countEl.classList.toggle('warn', len > 1000);
                    countEl.classList.toggle('err', len > CONFIG.LIMITS.maxContentLength);
                });
            }

            // Keyboard shortcuts
            ta.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeHashtagSuggestions();
                }
            });

            // Click outside to close suggestions
            document.addEventListener('click', (e) => {
                if (!ta.contains(e.target)) {
                    closeHashtagSuggestions();
                }
            });

            // Live backdrop
            initContentBackdrop();

            console.log('[Create] Content field initialised with @ and # support and live highlighting.');
        }

        function updateContentCounter(ta) {
            const countEl = document.getElementById('postContentCount');
            if (!countEl) return;
            const len = ta.value.length;
            countEl.textContent = len + ' characters';
            countEl.classList.toggle('warn', len > 1000);
            countEl.classList.toggle('err', len > CONFIG.LIMITS.maxContentLength);
        }

        // ──────────────────────────────────────────────────────────────
        // 10. INIT TITLE FIELD (with tagging and backdrop)
        // ──────────────────────────────────────────────────────────────

        function initTitleField() {
            const titleEl = document.getElementById('postTitle');
            if (!titleEl || titleEl._taggingWired) return;
            titleEl._taggingWired = true;

            // Mentions on title
            if (window.Mentions && typeof window.Mentions.initMentions === 'function') {
                window.Mentions.initMentions(titleEl);
            } else {
                console.error('[Create] mentions.js did not load — @ suggestions disabled. Check Network tab for a 404.');
            }

            // Hashtag typing
            titleEl.addEventListener('input', () => {
                handleHashtagTyping(titleEl);
                const countEl = document.getElementById('postTitleCount');
                if (countEl) {
                    countEl.textContent = titleEl.value.length + ' / ' + CONFIG.LIMITS.maxTitleLength;
                }
            });

            // Char counter
            const countEl = document.getElementById('postTitleCount');
            if (countEl) {
                countEl.textContent = '0 / ' + CONFIG.LIMITS.maxTitleLength;
            }

            titleEl.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeHashtagSuggestions();
                }
            });

            // Live backdrop
            initTitleBackdrop();

            console.log('[Create] Title field initialised with @ and # support and live highlighting.');
        }

        // ──────────────────────────────────────────────────────────────
        // 11. TABS
        // ──────────────────────────────────────────────────────────────

        function switchTab(el, tab) {
            // Update tab buttons
            document.querySelectorAll('.create-tab').forEach(t => {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            el.classList.add('active');
            el.setAttribute('aria-selected', 'true');

            // Update panels
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            const panel = document.getElementById('panel-' + tab);
            if (panel) panel.classList.add('active');

            if (tab === 'sell') {
                loadCategories();
            }
            if (tab === 'post') {
                setTimeout(() => {
                    initContentField();
                    initTitleField();
                }, 100);
            }
        }

        // ──────────────────────────────────────────────────────────────
        // 12. CONDITION SELECTION
        // ──────────────────────────────────────────────────────────────

        function selectCondition(el) {
            document.querySelectorAll('.condition-opt').forEach(c => {
                c.classList.remove('active');
                c.setAttribute('aria-checked', 'false');
            });
            el.classList.add('active');
            el.setAttribute('aria-checked', 'true');
            document.getElementById('itemCondition').value = el.dataset.condition;
        }

        // ──────────────────────────────────────────────────────────────
        // 13. PRICE FORMAT
        // ──────────────────────────────────────────────────────────────

        function formatPrice(input) {
            let raw = input.value.replace(/[^0-9,]/g, '');
            let digits = raw.replace(/,/g, '');
            digits = digits.slice(0, 9);
            if (digits.length > 0) {
                input.value = Number(digits).toLocaleString('en-US');
            } else {
                input.value = '';
            }
        }

        // ──────────────────────────────────────────────────────────────
        // 14. LOCATION DETECTION
        // ──────────────────────────────────────────────────────────────

        function detectLocation() {
            const status = document.getElementById('locationStatus');
            if (!navigator.geolocation) {
                status.textContent = 'Geolocation not supported';
                status.className = 'location-status error';
                return;
            }

            status.textContent = 'Detecting location…';
            status.className = 'location-status loading';

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    state.marketLat = lat;
                    state.marketLng = lng;
                    document.getElementById('itemLat').value = lat;
                    document.getElementById('itemLng').value = lng;

                    try {
                        const res = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`, {
                                headers: { 'Accept-Language': 'en' }
                            }
                        );
                        const data = await res.json();
                        if (data && data.display_name) {
                            const address = data.address || {};
                            const city = address.city || address.town || address.village || '';
                            const stateName = address.state || '';
                            const place = [city, stateName].filter(Boolean).join(', ') || data.display_name;
                            document.getElementById('itemLocation').value = place;
                            status.textContent = '📍 ' + place;
                            status.className = 'location-status success';
                        } else {
                            document.getElementById('itemLocation').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                            status.textContent = 'Location detected (coordinates)';
                            status.className = 'location-status success';
                        }
                    } catch (e) {
                        document.getElementById('itemLocation').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                        status.textContent = 'Location detected (coordinates)';
                        status.className = 'location-status success';
                    }
                },
                (error) => {
                    status.textContent = 'Could not detect location. Enter manually.';
                    status.className = 'location-status error';
                    state.marketLat = null;
                    state.marketLng = null;
                }, { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ──────────────────────────────────────────────────────────────
        // 15. CLOUDINARY UPLOAD
        // --------------------------------------------------------------
        // Resolves with a thumbnailUrl:
        //   - video → a Cloudinary-generated poster JPG at 0s
        //   - image → the image URL itself (thumbnail of an image IS the
        //             image; the <img> in the grid can just use it)
        // This means every completed upload carries a ready-to-use
        // poster without any further processing.
        // ──────────────────────────────────────────────────────────────

        function uploadToCloudinary(file, mode = 'post', onProgress) {
            return new Promise((resolve, reject) => {
                const isVideo = file.type.startsWith('video');
                const resourceType = isVideo ? 'video' : 'image';
                const preset = mode === 'market' ?
                    CONFIG.CLOUDINARY.marketPreset :
                    isVideo ? CONFIG.CLOUDINARY.videoPreset : CONFIG.CLOUDINARY.imagePreset;

                const url = `https://api.cloudinary.com/v1_1/${CONFIG.CLOUDINARY.cloudName}/${resourceType}/upload`;
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', preset);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', url);
                xhr.timeout = 300000;

                if (onProgress) {
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            onProgress(Math.round((e.loaded / e.total) * 100));
                        }
                    });
                }

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            resolve({
                                url: data.secure_url,
                                type: resourceType,
                                public_id: data.public_id,
                                thumbnailUrl: resourceType === 'video'
                                    ? buildCloudinaryVideoThumb(data.secure_url)
                                    : data.secure_url
                            });
                        } catch (e) {
                            reject(new Error('Invalid response from Cloudinary'));
                        }
                    } else {
                        let errMsg = `Upload failed (HTTP ${xhr.status})`;
                        try {
                            const data = JSON.parse(xhr.responseText);
                            errMsg = data.error?.message || errMsg;
                        } catch (e) {}
                        reject(new Error(errMsg));
                    }
                };
                xhr.onerror = () => reject(new Error('Network error – check your connection'));
                xhr.ontimeout = () => reject(new Error('Upload timed out'));
                xhr.send(formData);
            });
        }

        function getVideoDuration(file) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.src = URL.createObjectURL(file);
                video.onloadedmetadata = () => {
                    URL.revokeObjectURL(video.src);
                    resolve(video.duration);
                };
                video.onerror = () => resolve(0);
            });
        }

        // ──────────────────────────────────────────────────────────────
        // 16. POST MEDIA HANDLING
        // --------------------------------------------------------------
        // Every branch that pushes into state.postMedia also stores a
        // thumbnailUrl, so submitPost() can forward the field without
        // having to guess it from the URL afterward:
        //   - YouTube link    → hqdefault.jpg
        //   - external image  → the image URL itself
        //   - uploaded file   → Cloudinary poster JPG (via upload helper)
        // ──────────────────────────────────────────────────────────────

        function previewPostMedia() {
            const input = document.getElementById('postMediaUrlInput');
            const url = input.value.trim();
            if (!url) {
                input.placeholder = 'Paste image or YouTube link…';
                return;
            }

            const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
            const isImage = /\.(jpg|jpeg|png|gif|webp)/i.test(url) ||
                url.includes('cloudinary.com') ||
                url.includes('imgur.com');

            if (ytMatch) {
                if (state.postMedia.length > 0) {
                    showToast('Remove existing media before adding a video', 'o');
                    input.value = '';
                    return;
                }
                const videoUrl = `https://www.youtube.com/embed/${ytMatch[1]}`;
                state.postMedia = [{
                    url: videoUrl,
                    type: 'video',
                    public_id: 'youtube_' + ytMatch[1],
                    thumbnailUrl: 'https://img.youtube.com/vi/' + ytMatch[1] + '/hqdefault.jpg',
                    uploading: false
                }];
                state.postEmbeddings = [null];
                input.value = '🎬 Video linked';
                input.style.color = 'var(--pl)';
                input.style.fontWeight = '600';
                renderPostImageGrid();
                showToast('YouTube video linked', 'p');
            } else if (isImage) {
                if (state.postMedia.some(m => m.type === 'video')) {
                    showToast('Remove the video before adding images', 'o');
                    input.value = '';
                    return;
                }
                if (state.postMedia.length >= CONFIG.LIMITS.maxPostImages) {
                    showToast(`Max ${CONFIG.LIMITS.maxPostImages} images`, 'o');
                    input.value = '';
                    return;
                }
                if (state.postMedia.some(m => m.url === url)) {
                    showToast('Image already added', 'o');
                    input.value = '';
                    return;
                }
                const idx = state.postMedia.length;
                state.postMedia.push({
                    url,
                    type: 'image',
                    public_id: 'external_' + Date.now(),
                    thumbnailUrl: url,
                    uploading: false
                });
                state.postEmbeddings.push(null);
                input.value = '';
                renderPostImageGrid();
                showToast('Image added', 'p');
            } else {
                showToast('Enter a valid image or YouTube link', 'o');
                input.value = '';
            }
        }

        async function handlePostUpload(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;

            const hasVideo = files.some(f => f.type.startsWith('video'));
            const hasMultiple = files.length > 1;

            if (hasVideo) {
                if (state.postMedia.length > 0) {
                    showToast('Remove existing media before adding a video', 'o');
                    event.target.value = '';
                    return;
                }
                if (hasMultiple) {
                    showToast('Only one video allowed per post', 'o');
                    event.target.value = '';
                    return;
                }
            } else {
                if (state.postMedia.some(m => m.type === 'video')) {
                    showToast('Remove the video before adding images', 'o');
                    event.target.value = '';
                    return;
                }
            }

            const remaining = hasVideo ? 1 : (CONFIG.LIMITS.maxPostImages - state.postMedia.length);
            if (remaining <= 0) {
                showToast(`Max ${CONFIG.LIMITS.maxPostImages} images`, 'o');
                event.target.value = '';
                return;
            }

            const toUpload = files.slice(0, remaining);
            const progress = document.getElementById('postProgress');
            const bar = document.getElementById('postProgressBar');

            for (const file of toUpload) {
                const isVideo = file.type.startsWith('video');
                const isImage = file.type.startsWith('image');
                if (!isImage && !isVideo) {
                    showToast('Only images or videos allowed', 'o');
                    continue;
                }
                if (isImage && file.size > CONFIG.LIMITS.maxFileSize) {
                    showToast(`${file.name} too large (max 5MB)`, 'o');
                    continue;
                }
                if (isVideo && file.size > CONFIG.LIMITS.maxVideoSize) {
                    showToast('Video too large (max 100MB)', 'o');
                    continue;
                }
                if (isVideo) {
                    const duration = await getVideoDuration(file);
                    if (duration > CONFIG.LIMITS.maxVideoDuration) {
                        showToast(`Video must be ${CONFIG.LIMITS.maxVideoDuration/60} mins or less`, 'o');
                        continue;
                    }
                }

                const localUrl = URL.createObjectURL(file);
                const idx = state.postMedia.length;
                state.postMedia.push({ url: localUrl, type: isVideo ? 'video' : 'image', public_id: '', uploading: true });
                state.postEmbeddings.push(null);
                renderPostImageGrid();

                progress.style.display = 'block';
                bar.style.width = '0%';

                try {
                    const result = await uploadToCloudinary(file, 'post', (percent) => { bar.style.width = percent +
                            '%'; });
                    URL.revokeObjectURL(localUrl);
                    state.postMedia[idx] = {
                        url: result.url,
                        type: result.type,
                        public_id: result.public_id,
                        // uploadToCloudinary() already computed this —
                        // fall back to the resolver only if it somehow
                        // came back empty (older uploader response).
                        thumbnailUrl: result.thumbnailUrl || (
                            result.type === 'video'
                                ? buildCloudinaryVideoThumb(result.url)
                                : result.url
                        ),
                        uploading: false
                    };
                    renderPostImageGrid();
                    showToast('Uploaded!', 'g');
                    if (isImage) {
                        computeEmbedding(file).then(emb => { state.postEmbeddings[idx] = emb; });
                    }
                } catch (e) {
                    URL.revokeObjectURL(localUrl);
                    state.postMedia.splice(idx, 1);
                    state.postEmbeddings.splice(idx, 1);
                    renderPostImageGrid();
                    showToast('Upload failed: ' + e.message, 'r');
                }
            }

            progress.style.display = 'none';
            event.target.value = '';
        }

        function removePostImage(idx) {
            if (state.postMedia[idx]?.url?.startsWith('blob:')) {
                URL.revokeObjectURL(state.postMedia[idx].url);
            }
            state.postMedia.splice(idx, 1);
            state.postEmbeddings.splice(idx, 1);
            renderPostImageGrid();
            if (state.postMedia.length === 0) {
                const input = document.getElementById('postMediaUrlInput');
                input.value = '';
                input.style.color = '';
                input.style.fontWeight = '';
                input.placeholder = 'Paste image or YouTube link…';
                state.postEmbeddings = [];
            }
            showToast('Media removed', 'o');
        }

        // Composer preview tile.
        //
        // Video tiles now prefer m.thumbnailUrl (the Cloudinary poster
        // JPG or a YouTube hqdefault) and render as <img>. This is the
        // same fast path the profile grid uses — no video decode, no
        // black rectangle. The <video> fallback below is only reached
        // during the brief blob-URL window before Cloudinary responds,
        // or if a poster generation failed server-side.
        //
        // The hasPoster guard (thumbnailUrl !== m.url) prevents an
        // <img src="…mp4">, which browsers would refuse to decode.
        function renderPostImageGrid() {
            const grid = document.getElementById('postImageGrid');
            if (!grid) return;

            const hasVideo = state.postMedia.some(m => m.type === 'video');

            const thumbHtml = state.postMedia.map((m, i) => {
                var inner;
                if (m.type === 'video') {
                    var thumbnailUrl = m.thumbnailUrl || '';
                    var hasPoster = thumbnailUrl && thumbnailUrl !== m.url;
                    if (hasPoster) {
                        inner = `<img src="${thumbnailUrl}" alt="" loading="eager" decoding="async" style="width:100%;height:100%;object-fit:cover;display:block;background:#000;">`;
                    } else {
                        // Local blob URL (still uploading) — decode first frame.
                        inner = `<video src="${m.url}" preload="metadata" muted playsinline webkit-playsinline style="width:100%;height:100%;object-fit:cover;background:#000;"></video>`;
                    }
                } else {
                    inner = `<img src="${m.url}" alt="" loading="lazy">`;
                }
                return `<div class="image-thumb" onclick="${m.type === 'image' ? `openPostFullscreen(${i})` : ''}" role="listitem">
                            ${inner}
                            ${m.uploading ? `<div class="uploading-overlay"><div class="spinner"></div></div>` : ''}
                            <div class="cover-badge">${m.type === 'video' ? 'VIDEO' : (i === 0 && !m.uploading ? 'COVER' : '')}</div>
                            <button class="remove-btn" onclick="event.stopPropagation();removePostImage(${i})" ${m.uploading ? 'disabled' : ''} aria-label="Remove media">×</button>
                        </div>`;
            }).join('');

            const addBtn = (!hasVideo && state.postMedia.length < CONFIG.LIMITS.maxPostImages) ?
                `<div class="image-add-btn" onclick="document.getElementById('postFileInput').click()" role="button" tabindex="0" aria-label="Add more images">
                            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add
                        </div>` :
                '';

            grid.innerHTML = thumbHtml + addBtn;

            // For any tile that fell through to <video> — the blob
            // window before Cloudinary responds, or a failed poster
            // generation — force a seek to 0.1s once metadata loads so
            // the tile shows a first frame instead of a black box.
            forceComposerVideoThumbnails(grid);
        }

        // Composer-side twin of profile.html's forceVideoThumbnails().
        // Only touches <video> tiles; <img> tiles are left alone. No-op
        // when every video tile is an <img> (which is the normal state
        // after Cloudinary has responded).
        function forceComposerVideoThumbnails(rootEl) {
            if (!rootEl) return;
            var vids = rootEl.querySelectorAll('video');
            for (var i = 0; i < vids.length; i++) {
                (function(v) {
                    try {
                        v.preload = 'metadata';
                        v.muted = true;
                        v.playsInline = true;
                        var seek = function() {
                            try {
                                if (v.duration && !isNaN(v.duration) && v.duration > 0.1) {
                                    v.currentTime = 0.1;
                                }
                            } catch (e) {}
                        };
                        if (v.readyState >= 1) {
                            seek();
                        } else {
                            v.addEventListener('loadedmetadata', seek, { once: true });
                        }
                    } catch (e) {}
                })(vids[i]);
            }
        }

        // ──────────────────────────────────────────────────────────────
        // 17. POST FULLSCREEN
        // ──────────────────────────────────────────────────────────────

        function openPostFullscreen(index) {
            const images = state.postMedia.filter(m => m.type === 'image' && !m.uploading);
            if (images.length === 0) return;
            const urls = images.map(m => m.url);
            openFullscreenViewer(urls, Math.min(index, urls.length - 1));
        }

        // ──────────────────────────────────────────────────────────────
        // 18. MARKET MEDIA HANDLING
        // ──────────────────────────────────────────────────────────────

        function previewMarketUrl() {
            const input = document.getElementById('marketImageUrlInput');
            const url = input.value.trim();
            if (!url) return;
            if (state.marketImages.length >= CONFIG.LIMITS.maxMarketImages) {
                showToast(`Max ${CONFIG.LIMITS.maxMarketImages} images`, 'o');
                return;
            }
            if (state.marketImages.some(i => i.url === url)) {
                showToast('Image already added', 'o');
                return;
            }

            const isImage = /\.(jpg|jpeg|png|gif|webp)/i.test(url) ||
                url.includes('cloudinary.com') ||
                url.includes('imgur.com');
            if (!isImage) {
                showToast('Please enter a valid image URL', 'o');
                return;
            }

            state.marketImages.push({ url, public_id: 'external_' + Date.now(), isUploaded: true, uploading: false });
            input.value = '';
            renderMarketImages();
            showToast('Image added', 'p');
        }

        async function handleMarketUpload(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;
            const remaining = CONFIG.LIMITS.maxMarketImages - state.marketImages.length;
            if (remaining <= 0) {
                showToast(`Max ${CONFIG.LIMITS.maxMarketImages} images already added`, 'o');
                event.target.value = '';
                return;
            }

            const progress = document.getElementById('marketProgress');
            const bar = document.getElementById('marketProgressBar');
            const toUpload = files.slice(0, remaining);

            for (const file of toUpload) {
                if (file.size > CONFIG.LIMITS.maxFileSize) {
                    showToast(`${file.name} is too large`, 'o');
                    continue;
                }
                if (!file.type.startsWith('image/')) {
                    showToast('Only image files allowed', 'o');
                    continue;
                }

                const localUrl = URL.createObjectURL(file);
                const idx = state.marketImages.length;
                state.marketImages.push({ url: localUrl, public_id: '', isUploaded: false, uploading: true });
                renderMarketImages();

                progress.style.display = 'block';
                bar.style.width = '0%';

                try {
                    const result = await uploadToCloudinary(file, 'market', (percent) => { bar.style.width = percent +
                            '%'; });
                    URL.revokeObjectURL(localUrl);
                    state.marketImages[idx] = { url: result.url, public_id: result.public_id, isUploaded: true,
                        uploading: false };
                    renderMarketImages();
                    setTimeout(() => { progress.style.display = 'none'; }, 500);
                } catch (e) {
                    progress.style.display = 'none';
                    URL.revokeObjectURL(localUrl);
                    state.marketImages.splice(idx, 1);
                    renderMarketImages();
                    showToast('Upload failed: ' + e.message, 'r');
                }
            }
            event.target.value = '';
        }

        function removeMarketImage(idx) {
            if (state.marketImages[idx]?.url?.startsWith('blob:')) {
                URL.revokeObjectURL(state.marketImages[idx].url);
            }
            state.marketImages.splice(idx, 1);
            renderMarketImages();
            if (state.marketImages.length === 0) {
                const input = document.getElementById('marketImageUrlInput');
                input.value = '';
                input.style.color = '';
                input.style.fontWeight = '';
            }
            showToast('Image removed', 'o');
        }

        function renderMarketImages() {
            const grid = document.getElementById('marketImageGrid');
            if (!grid) return;

            const thumbHtml = state.marketImages.map((img, i) =>
                `<div class="image-thumb" onclick="${img.isUploaded ? `openMarketFullscreen(${i})` : ''}" role="listitem">
                            <img src="${img.url}" alt="" loading="lazy" onerror="this.style.display='none'">
                            ${img.uploading ? `<div class="uploading-overlay"><div class="spinner"></div></div>` : ''}
                            <button class="remove-btn" onclick="event.stopPropagation();removeMarketImage(${i})" ${img.uploading ? 'disabled' : ''} aria-label="Remove image">×</button>
                            ${i === 0 && img.isUploaded && !img.uploading ? `<div class="cover-badge">COVER</div>` : ''}
                        </div>`
            ).join('');

            const addBtn = state.marketImages.length < CONFIG.LIMITS.maxMarketImages ?
                `<div class="image-add-btn" onclick="document.getElementById('marketFileInput').click()" role="button" tabindex="0" aria-label="Add more market images">
                            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add
                        </div>` :
                '';

            grid.innerHTML = thumbHtml + addBtn;
        }

        // ──────────────────────────────────────────────────────────────
        // 19. MARKET FULLSCREEN
        // ──────────────────────────────────────────────────────────────

        function openMarketFullscreen(index) {
            const uploaded = state.marketImages.filter(i => i.isUploaded);
            if (uploaded.length === 0) return;
            const urls = uploaded.map(i => i.url);
            openFullscreenViewer(urls, Math.min(index, urls.length - 1));
        }

        // ──────────────────────────────────────────────────────────────
        // 20. FULLSCREEN VIEWER (shared)
        // ──────────────────────────────────────────────────────────────

        function openFullscreenViewer(images, index) {
            if (!images || images.length === 0) return;
            const viewer = document.getElementById('fullscreenViewer');
            const img = document.getElementById('fullscreenImage');
            const counter = document.getElementById('viewerCounter');

            state.fullscreenData = { images, current: Math.min(index, images.length - 1) };
            img.src = images[state.fullscreenData.current];
            counter.textContent = `${state.fullscreenData.current + 1} / ${images.length}`;
            viewer.classList.add('open');
            document.body.style.overflow = 'hidden';
            updateFullscreenNav();
        }

        function closeFullscreen() {
            const viewer = document.getElementById('fullscreenViewer');
            viewer.classList.remove('open');
            document.body.style.overflow = '';
            state.fullscreenData = null;
            document.getElementById('fullscreenImage').src = '';
        }

        function navigateFullscreen(direction) {
            if (!state.fullscreenData) return;
            const data = state.fullscreenData;
            const newIndex = data.current + direction;
            if (newIndex < 0 || newIndex >= data.images.length) return;
            data.current = newIndex;
            document.getElementById('fullscreenImage').src = data.images[newIndex];
            document.getElementById('viewerCounter').textContent = `${newIndex + 1} / ${data.images.length}`;
            updateFullscreenNav();
        }

        function updateFullscreenNav() {
            const data = state.fullscreenData;
            if (!data) return;
            const prev = document.querySelector('.viewer-nav.prev');
            const next = document.querySelector('.viewer-nav.next');
            if (prev) prev.style.opacity = data.current > 0 ? '1' : '0.2';
            if (next) next.style.opacity = data.current < data.images.length - 1 ? '1' : '0.2';
        }

        // Keyboard navigation for fullscreen
        document.addEventListener('keydown', (e) => {
            if (!state.fullscreenData) return;
            if (e.key === 'Escape') closeFullscreen();
            if (e.key === 'ArrowLeft') navigateFullscreen(-1);
            if (e.key === 'ArrowRight') navigateFullscreen(1);
        });

        // ──────────────────────────────────────────────────────────────
        // 21. CATEGORIES
        // ──────────────────────────────────────────────────────────────

            } catch (err) {

                showToast('Could not load categories. Please refresh.', 'r');

        }

        async function loadSubcategories(categoryId) {

        // ──────────────────────────────────────────────────────────────
        // 22. PICKER MODAL
        // ──────────────────────────────────────────────────────────────

                list.innerHTML = `<div class="picker-empty">No options available</div>`;

                        <div class="picker-item ${item.id === selectedId ? 'active' : ''}" onclick="selectPickerItem('${item.id}')" role="option" aria-selected="${item.id === selectedId}">

                            <span class="check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
                        </div>

        function filterPickerItems() {
            const query = document.getElementById('pickerSearchInput').value.toLowerCase();
            const filtered = state.pickerData.filter(item =>
                item.name.toLowerCase().includes(query)
            );
            renderPickerItems(filtered);

        function selectPickerItem(id) {
            if (state.pickerMode === 'category') {
                state.selectedCategoryId = id;
                const cat = state.categories.find(c => c.id === id);
                if (cat) {
                    document.getElementById('categoryPickerBtn').querySelector('.placeholder').textContent = cat.name;
                    document.getElementById('itemCategoryId').value = id;
                    state.selectedSubcategoryId = '';
                    document.getElementById('subcategoryPickerBtn').querySelector('.placeholder').textContent =
                        'Select subcategory';
                    document.getElementById('itemSubcategoryId').value = '';
                    loadSubcategories(id);
                }
            } else {
                state.selectedSubcategoryId = id;
                const sub = state.subcategories.find(s => s.id === id);
                if (sub) {
                    document.getElementById('subcategoryPickerBtn').querySelector('.placeholder').textContent = sub.name;
                    document.getElementById('itemSubcategoryId').value = id;

            renderPickerItems(state.pickerData);

        function updateCategoryPickerDisplay(categoryId) {
            const cat = state.categories.find(c => c.id === categoryId);
            if (cat) {
                document.getElementById('categoryPickerBtn').querySelector('.placeholder').textContent = cat.name;
                document.getElementById('itemCategoryId').value = categoryId;
            }
        }

        function updateSubcategoryPickerDisplay(subcategoryId) {
            const sub = state.subcategories.find(s => s.id === subcategoryId);
            if (sub) {
                document.getElementById('subcategoryPickerBtn').querySelector('.placeholder').textContent = sub.name;
                document.getElementById('itemSubcategoryId').value = subcategoryId;
            }
        }

        // ──────────────────────────────────────────────────────────────
        // 23. COMPUTE EMBEDDING
        // ──────────────────────────────────────────────────────────────

        async function computeEmbedding(file) {
            if (!window.ImageEmbedding || typeof window.ImageEmbedding.getEmbeddingFromFile !== 'function') {
                return null;
            }
            try {
                return await window.ImageEmbedding.getEmbeddingFromFile(file);
            } catch (e) {
                console.warn('[Embedding] Failed:', e);
                return null;
            }
        }

        // ──────────────────────────────────────────────────────────────
        // 24. SUBMIT POST
        // --------------------------------------------------------------
        // The media mapping writes thumbnailUrl into every entry via
        // resolveMediaThumbnail(), which handles all three sources:
        //   - already-set m.thumbnailUrl (uploaded / YouTube / external)
        //   - video URL with no thumbnail → Cloudinary/YouTube inference
        //   - image URL with no thumbnail → the URL itself
        // We also pass thumbnailUrl at the TOP LEVEL of the createPost
        // call so posts.js can persist posts.thumbnail_url directly,
        // without having to dig into media[0] on the server side.
        // ──────────────────────────────────────────────────────────────

        async function submitPost() {
            if (!window.PostsAPI || typeof window.PostsAPI.createPost !== 'function') {
                showToast('System not ready. Please refresh.', 'r');
                return;
            }

            const user = requireAuth(true);
            if (!user) return;

            const titleEl = document.getElementById('postTitle');
            const contentEl = document.getElementById('postContent');
            const title = titleEl.value.trim();
            const content = contentEl.value.trim();
            const hideComments = document.getElementById('postHideComments').checked;

            if (!title && !content && state.postMedia.length === 0) {
                showToast('Please add a title, content or media', 'o');
                return;
            }
            if (state.postMedia.some(m => m.uploading)) {
                showToast('Please wait for media to finish uploading', 'o');
                return;
            }

            // Extract hashtags
            const titleHashtags = extractHashtags(title);
            const contentHashtags = extractHashtags(content);
            const hashtags = mergeHashtagLists(titleHashtags, contentHashtags);

            // Extract mentions
            let mentions = [];
            if (window.Mentions && typeof window.Mentions.extractMentions === 'function') {
                const titleMentions = window.Mentions.extractMentions(titleEl);
                const contentMentions = window.Mentions.extractMentions(contentEl);
                const seen = new Set();
                mentions = [...titleMentions, ...contentMentions].filter(m => {
                    const key = (m.username || '').toLowerCase();
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });
            }

            const btn = document.getElementById('postSubmitBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            // Each media entry carries thumbnailUrl. resolveMediaThumbnail()
            // is the single source of truth for the fallback chain, so this
            // mapping is safe even for legacy media objects that don't
            // already have thumbnailUrl set.
            const media = state.postMedia.map(m => ({
                url: m.url,
                type: m.type,
                public_id: m.public_id || '',
                thumbnailUrl: resolveMediaThumbnail(m)
            }));
            const firstItem = media[0] || {};

            // Average embeddings
            const validEmbeddings = state.postEmbeddings.filter(e => Array.isArray(e) && e.length);
            const imageEmbedding = (window.ImageEmbedding && typeof window.ImageEmbedding.averageEmbeddings ===
                'function' && validEmbeddings.length) ?
                window.ImageEmbedding.averageEmbeddings(validEmbeddings) :
                null;

            try {
                const result = await PostsAPI.createPost({
                    title,
                    content: content || '',
                    tags: hashtags,
                    hashtags: hashtags,
                    media: media,
                    mediaUrl: firstItem.url || '',
                    mediaType: firstItem.type || '',
                    // Explicit top-level thumbnail so posts.js can write
                    // posts.thumbnail_url directly, without inspecting media[].
                    thumbnailUrl: firstItem.thumbnailUrl || null,
                    mentions: mentions,
                    commentsHidden: hideComments,
                    source: 'composer',
                    imageEmbedding: imageEmbedding
                });

                // Notify mentions
                if (result.id && mentions.length > 0) {
                    if (window.Mentions && typeof window.Mentions.notifyMentionedUsers === 'function') {
                        try {
                            await window.Mentions.notifyMentionedUsers('post', result.id, mentions, user.id, null);
                        } catch (notifyErr) {
                            console.error('[Mentions] notify failed:', notifyErr);
                        }
                    }
                }

                // Reset form
                titleEl.value = '';
                contentEl.value = '';
                if (contentEl._mentions) contentEl._mentions = [];
                if (titleEl._mentions) titleEl._mentions = [];
                document.getElementById('postHideComments').checked = false;
                document.getElementById('postMediaUrlInput').value = '';
                state.postMedia.forEach(m => { if (m.url?.startsWith('blob:')) URL.revokeObjectURL(m.url); });
                state.postMedia = [];
                state.postEmbeddings = [];
                renderPostImageGrid();
                document.getElementById('postTitleCount').textContent = '0 / ' + CONFIG.LIMITS.maxTitleLength;
                document.getElementById('postContentCount').textContent = '0 characters';

                showToast('Post published! 🎉', 'g');
                btn.classList.remove('loading');
                btn.disabled = false;

                setTimeout(() => {
                    window.location.href = 'index.html?refresh=' + Date.now();
                }, 500);

            } catch (err) {
                console.error('[SubmitPost] Error:', err);
                showToast(err.message || 'Failed to publish post. Please try again.', 'r');
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // ──────────────────────────────────────────────────────────────
        // 25. SUBMIT ITEM
        // ──────────────────────────────────────────────────────────────

        function submitItem() {
            const user = requireAuth(true);
            if (!user) return;

            if (!window.ListingsAPI || typeof window.ListingsAPI.createListing !== 'function') {
                showToast('Marketplace system not ready. Please refresh.', 'r');
                return;
            }

            const title = document.getElementById('itemTitle').value.trim();
            const priceInput = document.getElementById('itemPrice');
            const price = priceInput.value.replace(/[^0-9,]/g, '').replace(/,/g, '');
            const description = document.getElementById('itemDescription').value.trim();
            const location = document.getElementById('itemLocation').value.trim();
            const condition = document.getElementById('itemCondition').value;
            const lat = document.getElementById('itemLat').value;
            const lng = document.getElementById('itemLng').value;
            const categoryId = document.getElementById('itemCategoryId').value;
            const subcategoryId = document.getElementById('itemSubcategoryId').value;
            const whatsapp = document.getElementById('itemWhatsApp').value.trim();

            if (!title || !price) {
                showToast('Item name and price are required', 'o');
                return;
            }
            if (isNaN(Number(price)) || Number(price) <= 0) {
                showToast('Enter a valid price', 'o');
                return;
            }
            if (!categoryId) {
                showToast('Please select a category', 'o');
                return;
            }
            if (state.marketImages.some(i => i.uploading)) {
                showToast('Please wait for images to finish uploading', 'o');
                return;
            }

            const imageObjects = state.marketImages.map(img => ({ url: img.url, public_id: img.public_id || '' }));

            const btn = document.getElementById('sellSubmitBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            ListingsAPI.createListing({
                    title,
                    price: parseFloat(price),
                    category_id: categoryId,
                    subcategory_id: subcategoryId || null,
                    location: location || 'Campus',
                    lat: lat ? parseFloat(lat) : null,
                    lng: lng ? parseFloat(lng) : null,
                    images: imageObjects,
                    description: description || '',
                    condition: condition || 'New',
                    whatsapp: whatsapp || null
                })
                .then(function(result) {
                    // Reset form
                    document.getElementById('itemTitle').value = '';
                    document.getElementById('itemPrice').value = '';
                    document.getElementById('itemDescription').value = '';
                    document.getElementById('itemLocation').value = '';
                    document.getElementById('itemLat').value = '';
                    document.getElementById('itemLng').value = '';
                    document.getElementById('locationStatus').textContent = '';
                    document.getElementById('locationStatus').className = 'location-status';
                    document.getElementById('itemWhatsApp').value = '';
                    document.getElementById('marketImageUrlInput').value = '';
                    state.marketImages = [];
                    renderMarketImages();

                    document.querySelectorAll('.condition-opt').forEach(c => c.classList.remove('active'));
                    const newOpt = document.querySelector('.condition-opt[data-condition="New"]');
                    if (newOpt) {
                        newOpt.classList.add('active');
                        newOpt.setAttribute('aria-checked', 'true');
                    }
                    selectedCondition = 'New';
                    document.getElementById('itemCondition').value = 'New';

                    state.selectedCategoryId = '';
                    state.selectedSubcategoryId = '';
                    document.getElementById('itemCategoryId').value = '';
                    document.getElementById('itemSubcategoryId').value = '';
                    document.getElementById('categoryPickerBtn').querySelector('.placeholder').textContent =
                    'Select category';
                    document.getElementById('subcategoryPickerBtn').querySelector('.placeholder').textContent =
                        'Select category first';
                    document.getElementById('subcategoryPickerBtn').disabled = true;
                    state.categoriesLoaded = false;
                    state.categories = [];
                    state.subcategories = [];
                    loadCategories();

                    showToast('Item listed! 🛍️', 'g');
                    btn.classList.remove('loading');
                    btn.disabled = false;

                    setTimeout(() => {
                        window.location.href = 'index.html?refresh=' + Date.now();
                    }, 500);
                })
                .catch(function(err) {
                    console.error('[SubmitItem] Error:', err);
                    showToast(err.message || 'Failed to list item', 'r');
                    btn.classList.remove('loading');
                    btn.disabled = false;
                });
        }

        // ──────────────────────────────────────────────────────────────
        // 26. NAV AVATAR
        // ──────────────────────────────────────────────────────────────

        function updateNavAvatar() {
            const user = getCurrentUser();
            const avatar = user?.avatar || '';
            document.querySelectorAll('.side-av, .nav-av').forEach(el => {
                el.src = avatar;
                el.onerror = function() { this.style.display = 'none'; };
            });
        }

        // ──────────────────────────────────────────────────────────────
        // 27. THEME WATCHER
        // ──────────────────────────────────────────────────────────────

        function watchTheme() {
            // Theme is managed by global.js — just listen for changes
            document.addEventListener('themeChanged', function(e) {
                document.documentElement.setAttribute('data-theme', e.detail.theme);
            });
        }

        // ──────────────────────────────────────────────────────────────
        // 28. DROP ZONE SUPPORT (drag & drop)
        // ──────────────────────────────────────────────────────────────

        function setupDropZones() {
            const postZone = document.querySelector('#panel-post .upload-row');
            const marketZone = document.querySelector('#panel-sell .upload-row');

            function setupZone(zone, handler) {
                if (!zone) return;
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('drop-highlight');
                });
                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drop-highlight');
                });
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drop-highlight');
                    const files = e.dataTransfer.files;
                    if (files.length) {
                        const input = zone.querySelector('input[type="file"]');
                        if (input) {
                            const dt = new DataTransfer();
                            for (const f of files) dt.items.add(f);
                            input.files = dt.files;
                            input.dispatchEvent(new Event('change'));
                        }
                    }
                });
            }

            setupZone(postZone, handlePostUpload);
            setupZone(marketZone, handleMarketUpload);
        }

        // ──────────────────────────────────────────────────────────────
        // 29. INIT
        // ──────────────────────────────────────────────────────────────

        function init() {
            console.log('[Create] Initialising…');

            // Update nav avatar
            updateNavAvatar();

            // Highlight active nav
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.side-btn').forEach(el => el.classList.remove('active'));
            const sideBtn = document.querySelector('.side-btn[href="create.html"]');
            if (sideBtn) sideBtn.classList.add('active');

            // User state
            const user = getCurrentUser();
            if (user && user.isLoggedIn) {
                updateNavAvatar();
            }

            // Listen for profile updates
            document.addEventListener('profileUpdated', function(e) {
                if (e.detail?.user) {
                    updateNavAvatar();
                }
            });

            // Theme
            watchTheme();

            // Init fields
            initTitleField();
            initContentField();

            // Load categories (deferred)
            const activePanel = document.querySelector('.panel.active');
            if (activePanel && activePanel.id === 'panel-sell') {
                loadCategories();
            } else {
                setTimeout(loadCategories, 400);
            }

            // Preload embedding model
            if (window.ImageEmbedding && typeof window.ImageEmbedding.preloadModel === 'function') {
                window.ImageEmbedding.preloadModel()
                    .then(() => console.log('[Embedding] Model preloaded'))
                    .catch(e => console.warn('[Embedding] Preload error:', e));
            }

            // Drop zones
            setupDropZones();

            // Close suggestions on scroll
            const mainScroll = document.getElementById('mainScroll');
            if (mainScroll) {
                mainScroll.addEventListener('scroll', () => {
                    closeHashtagSuggestions();
                });
            }

            console.log('[Create] Initialised successfully.');
        }

        // ──────────────────────────────────────────────────────────────
        // 30. DOM READY
        // ──────────────────────────────────────────────────────────────

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Expose functions globally
        window.switchTab = switchTab;
        window.applyUnicodeFormat = applyUnicodeFormat;
        window.insertAtCursor = insertAtCursor;
        window.previewPostMedia = previewPostMedia;
        window.handlePostUpload = handlePostUpload;
        window.removePostImage = removePostImage;
        window.openPostFullscreen = openPostFullscreen;
        window.previewMarketUrl = previewMarketUrl;
        window.handleMarketUpload = handleMarketUpload;
        window.removeMarketImage = removeMarketImage;
        window.openMarketFullscreen = openMarketFullscreen;
        window.closeFullscreen = closeFullscreen;
        window.navigateFullscreen = navigateFullscreen;
        window.openPickerModal = openPickerModal;
        window.closePickerModal = closePickerModal;
        window.filterPickerItems = filterPickerItems;
        window.selectPickerItem = selectPickerItem;
        window.selectCondition = selectCondition;
        window.formatPrice = formatPrice;
        window.detectLocation = detectLocation;
        window.submitPost = submitPost;
        window.submitItem = submitItem;
        window.showToast = showToast;
    </script>
</body>
</html>
