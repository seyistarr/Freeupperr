                    dbCategories = await window.CategoryAPI.loadCategories();
                }

                sel.innerHTML = '<option value="">Select a category</option>';
                dbCategories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.id;
                    opt.textContent = cat.name;
                    sel.appendChild(opt);
                });

                sel.disabled = false;
                categoriesLoaded = true;

                if (dbCategories.length === 0) {
                    sel.innerHTML = '<option value="">No categories available</option>';
                    sel.disabled = true;
                }

                if (selectedCategoryId) {
                    sel.value = selectedCategoryId;
                    onCategoryChange(selectedCategoryId);
                }

                console.log('[DEBUG] Categories loaded:', dbCategories.length);

            } catch (err) {
                console.error('[DEBUG] Failed to load categories:', err);
                sel.innerHTML = '<option value="">Error loading categories</option>';
                sel.disabled = true;
                showToast('Could not load categories. Please refresh.', 'r');
            }
        }

        async function loadSubcategories(categoryId) {
            const sel = document.getElementById('itemSubcategorySelect');
            sel.innerHTML = '<option value="">Loading...</option>';
            sel.disabled = true;

            if (!categoryId) {
                sel.innerHTML = '<option value="">Select a category first</option>';
                sel.disabled = true;
                selectedSubcategoryId = '';
                document.getElementById('itemSubcategoryId').value = '';
                return;
            }

            try {
                if (!window.CategoryAPI || typeof window.CategoryAPI.loadSubcategories !== 'function') {
                    console.warn('[DEBUG] CategoryAPI not loaded, trying fallback...');
                    const { data, error } = await window.sb
                        .from('market_subcategories')
                        .select('*')
                        .eq('category_id', categoryId)
                        .eq('active', true)
                        .order('sort_order', { ascending: true });
                    if (error) throw error;
                    dbSubcategories = data || [];
                } else {
                    dbSubcategories = await window.CategoryAPI.loadSubcategories(categoryId);
                }

                sel.innerHTML = '<option value="">Select a subcategory</option>';
                dbSubcategories.forEach(sub => {
                    const opt = document.createElement('option');
                    opt.value = sub.id;
                    opt.textContent = sub.name;
                    sel.appendChild(opt);
                });

                sel.disabled = (dbSubcategories.length === 0);
                if (dbSubcategories.length === 0) {
                    sel.innerHTML = '<option value="">No subcategories</option>';
                }

                if (selectedSubcategoryId) {
                    sel.value = selectedSubcategoryId;
                }

                document.getElementById('itemCategoryId').value = categoryId;
                console.log('[DEBUG] Subcategories loaded:', dbSubcategories.length);

            } catch (err) {
                console.error('[DEBUG] Failed to load subcategories:', err);
                sel.innerHTML = '<option value="">Error loading subcategories</option>';
                sel.disabled = true;
                showToast('Could not load subcategories. Please refresh.', 'r');
            }
        }

        function onCategoryChange(categoryId) {
            selectedCategoryId = categoryId;
            selectedSubcategoryId = '';
            document.getElementById('itemSubcategoryId').value = '';
            loadSubcategories(categoryId);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const subSel = document.getElementById('itemSubcategorySelect');
            if (subSel) {
                subSel.addEventListener('change', function() {
                    selectedSubcategoryId = this.value;
                    document.getElementById('itemSubcategoryId').value = this.value;
                });
            }
            const catSel = document.getElementById('itemCategorySelect');
            if (catSel) {
                catSel.addEventListener('change', function() {
                    document.getElementById('itemCategoryId').value = this.value;
                });
            }
        });

        // ──────────────────────────────────────────────────────────────
        // SUBMIT POST – with Mentions + Notifications
        // ──────────────────────────────────────────────────────────────
        async function submitPost() {
            console.log('[DEBUG] submitPost called');

            if (!window.PostsAPI || typeof window.PostsAPI.createPost !== 'function') {
                showToast('System not ready. Please refresh.', 'r');
                return;
            }

            const user = getCurrentUser();
            if (!user || !user.isLoggedIn) {
                showToast('Please sign in to create a post', 'o');
                if (window.AuthUser && typeof window.AuthUser.openModal === 'function') {
                    window.AuthUser.openModal('signup');
                }
                return;
            }

            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const description = document.getElementById('postDescription').value.trim();
            const category = document.getElementById('postCategory').value;
            const mediaUrl = document.getElementById('postMediaUrl').value;
            const mediaType = document.getElementById('postMediaType').value;
            const publicId = document.getElementById('postPublicId').value;

            if (!title || !content) {
                showToast('Please fill in both title and content', 'o');
                return;
            }
            if (postTags.length > 3) {
                showToast('Max 3 tags allowed', 'o');
                return;
            }

            // ── EXTRACT MENTIONS ──
            const textarea = document.getElementById('postContent');
            let mentions = [];
            if (window.Mentions && typeof window.Mentions.extractMentions === 'function') {
                mentions = window.Mentions.extractMentions(textarea);
                console.log('[DEBUG] Extracted mentions:', mentions);
            } else {
                console.warn('[DEBUG] Mentions.extractMentions not available');
            }

            const btn = document.querySelector('.btn-primary[onclick="submitPost()"]');
            const originalText = btn.textContent;
            btn.textContent = 'Publishing...';
            btn.disabled = true;

            let media = [];
            if (mediaUrl) {
                media = [{
                    url: mediaUrl,
                    type: mediaType || 'image',
                    public_id: publicId || ''
                }];
            }

            console.log('[DEBUG] Submitting post with media:', media);
            console.log('[DEBUG] Post data:', { title, description, content, category, tags: postTags, media, mentions });

            try {
                const result = await PostsAPI.createPost({
                    title,
                    description,
                    content,
                    category: category || 'General',
                    tags: postTags.slice(),
                    media: media,
                    mediaUrl: mediaUrl,
                    mediaType: mediaType,
                    mentions: mentions // ← pass mentions to API
                });

                console.log('[DEBUG] Post created successfully:', result);

                // ── NOTIFY MENTIONED USERS ──
                if (result.id && mentions.length > 0) {
                    if (window.Mentions && typeof window.Mentions.notifyMentionedUsers === 'function') {
                        try {
                            await window.Mentions.notifyMentionedUsers(
                                'post', // target type
                                result.id, // the new post ID
                                mentions, // array of usernames
                                user.id, // sender ID
                                null // no parent (for posts)
                            );
                            console.log('[DEBUG] Mention notifications sent for', mentions.length, 'users');
                        } catch (notifyErr) {
                            console.error('[DEBUG] Failed to send mention notifications:', notifyErr);
                            // Don't fail the post creation if notifications fail
                        }
                    } else {
                        console.warn('[DEBUG] Mentions.notifyMentionedUsers not available');
                    }
                }

                // ── RESET FORM ──
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('postDescription').value = '';
                document.getElementById('postCategory').value = '';
                document.getElementById('postCategoryDisplay').textContent = 'Select a category';
                document.getElementById('postCategoryDisplay').classList.add('placeholder');
                document.getElementById('postMediaUrl').value = '';
                document.getElementById('postMediaType').value = '';
                document.getElementById('postPublicId').value = '';
                const input = document.getElementById('postMediaUrlInput');
                input.value = '';
                input.style.color = '';
                input.style.fontWeight = '';
                input.placeholder = 'Paste image or YouTube link...';
                document.getElementById('postImageGrid').innerHTML = '';
                postTags = [];
                renderPostTags();
                selectedPostCategory = '';

                showToast('Post published! 🎉', 'g');
                btn.textContent = originalText;
                btn.disabled = false;

                setTimeout(() => {
                    window.location.href = 'index.html?refresh=' + Date.now();
                }, 500);

            } catch (err) {
                console.error('[DEBUG] Error creating post:', err);
                showToast(err.message || 'Failed to publish post. Please try again.', 'r');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // ──────────────────────────────────────────────────────────────
        // SUBMIT ITEM – uses ListingsAPI.createListing with WhatsApp
        // ──────────────────────────────────────────────────────────────
        function submitItem() {
            console.log('[DEBUG] submitItem called');

            const user = getCurrentUser();
            if (!user || !user.isLoggedIn) {
                showToast('Please sign in to list an item', 'o');
                if (window.AuthUser && typeof window.AuthUser.openModal === 'function') {
                    window.AuthUser.openModal('signup');
                }
                return;
            }

            if (!window.ListingsAPI || typeof window.ListingsAPI.createListing !== 'function') {
                showToast('Marketplace system not ready. Please refresh.', 'r');
                return;
            }

            const title = document.getElementById('itemTitle').value.trim();
            var priceInput = document.getElementById('itemPrice');
            var price = priceInput.value.replace(/[^0-9,]/g, '').replace(/,/g, '');
            const description = document.getElementById('itemDescription').value.trim();
            const location = document.getElementById('itemLocation').value.trim();
            const condition = document.getElementById('itemCondition').value;
            const lat = document.getElementById('itemLat').value;
            const lng = document.getElementById('itemLng').value;
            const categoryId = document.getElementById('itemCategoryId').value;
            const subcategoryId = document.getElementById('itemSubcategoryId').value;
            const whatsapp = document.getElementById('itemWhatsApp').value.trim();

            if (!title || !price) {
                showToast('Item name and price are required', 'o');
                return;
            }
            if (isNaN(Number(price)) || Number(price) <= 0) {
                showToast('Enter a valid price', 'o');
                return;
            }
            if (!categoryId) {
                showToast('Please select a category', 'o');
                return;
            }
            if (marketImages.some(function(i) { return i.uploading; })) {
                showToast('Please wait for images to finish uploading', 'o');
                return;
            }

            var imageObjects = marketImages.map(function(img) {
                return {
                    url: img.url,
                    public_id: img.public_id || ''
                };
            });

            console.log('[DEBUG] Submitting listing with images:', imageObjects);
            console.log('[DEBUG] Listing data:', { title, price, categoryId, subcategoryId, location, description,
                condition, images: imageObjects, whatsapp });

            var btn = document.querySelector('.btn-primary[onclick="submitItem()"]');
            var originalText = btn.textContent;
            btn.textContent = 'Listing...';
            btn.disabled = true;

            ListingsAPI.createListing({
                    title: title,
                    price: parseFloat(price),
                    category_id: categoryId,
                    subcategory_id: subcategoryId || null,
                    location: location || 'Campus',
                    lat: lat ? parseFloat(lat) : null,
                    lng: lng ? parseFloat(lng) : null,
                    images: imageObjects,
                    description: description || '',
                    condition: condition || 'New',
                    whatsapp: whatsapp || null
                })
                .then(function(result) {
                    console.log('[DEBUG] Item listed successfully:', result);
                    document.getElementById('itemTitle').value = '';
                    document.getElementById('itemPrice').value = '';
                    document.getElementById('itemDescription').value = '';
                    document.getElementById('itemLocation').value = '';
                    document.getElementById('itemLat').value = '';
                    document.getElementById('itemLng').value = '';
                    document.getElementById('locationStatus').textContent = '';
                    document.getElementById('itemWhatsApp').value = '';
                    var input = document.getElementById('marketImageUrlInput');
                    input.value = '';
                    input.style.color = '';
                    input.style.fontWeight = '';
                    marketImages = [];
                    renderMarketImages();
                    fullscreenImages = [];
                    document.querySelectorAll('.condition-opt').forEach(function(c) { c.classList.remove('active'); });
                    document.querySelector('.condition-opt[data-condition="New"]').classList.add('active');
                    selectedCondition = 'New';
                    document.getElementById('itemCondition').value = 'New';

                    selectedCategoryId = '';
                    selectedSubcategoryId = '';
                    document.getElementById('itemCategoryId').value = '';
                    document.getElementById('itemSubcategoryId').value = '';
                    const catSel = document.getElementById('itemCategorySelect');
                    if (catSel) catSel.value = '';
                    const subSel = document.getElementById('itemSubcategorySelect');
                    if (subSel) {
                        subSel.innerHTML = '<option value="">Select a category first</option>';
                        subSel.disabled = true;
                    }
                    categoriesLoaded = false;
                    loadCategories();

                    showToast('Item listed! 🛍️', 'g');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    setTimeout(() => {
                        window.location.href = 'index.html?refresh=' + Date.now();
                    }, 500);
                })
                .catch(function(err) {
                    console.error('[DEBUG] Error listing item:', err);
                    showToast(err.message || 'Failed to list item', 'r');
                    btn.textContent = originalText;
                    btn.disabled = false;
                });
        }

        // ──────────────────────────────────────────────────────────────
        // AVATAR / NAV UPDATES
        // ──────────────────────────────────────────────────────────────
        function updateNavAvatar() {
            const user = getCurrentUser();
            document.querySelectorAll('.side-av, .nav-av').forEach(el => {
                el.src = user?.avatar || '';
                el.onerror = function() { this.style.display = 'none'; };
            });
        }

        // ──────────────────────────────────────────────────────────────
        // CHARACTER COUNTERS
        // ──────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', function() {
            const titleInput = document.getElementById('postTitle');
            const titleCount = document.getElementById('postTitleCount');
            titleInput.addEventListener('input', function() {
                titleCount.textContent = this.value.length + ' / 100';
            });

            const contentInput = document.getElementById('postContent');
            const contentCount = document.getElementById('postContentCount');
            contentInput.addEventListener('input', function() {
                const len = this.value.length;
                contentCount.textContent = len + ' characters';
                if (len > 1000) {
                    contentCount.classList.add('warn');
                } else {
                    contentCount.classList.remove('warn');
                }
            });
        });

        // ──────────────────────────────────────────────────────────────
        // INIT
        // ──────────────────────────────────────────────────────────────
        function init() {
            updateNavAvatar();

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.side-btn').forEach(el => el.classList.remove('active'));
            document.querySelector('.side-btn[href="create.html"]')?.classList.add('active');

            const user = getCurrentUser();
            if (user && user.isLoggedIn) {
                updateNavAvatar();
                document.querySelector('.topbar-title').textContent = 'Create';
            }

            document.addEventListener('profileUpdated', function(e) {
                if (e.detail?.user) {
                    updateNavAvatar();
                    if (e.detail.user.isLoggedIn) {
                        document.querySelector('.topbar-title').textContent = 'Create';
                    }
                }
            });

            document.addEventListener('themeChanged', function(e) {
                document.documentElement.setAttribute('data-theme', e.detail.theme);
            });

            // ── INITIALISE MENTIONS ON POST CONTENT ──
            const postContent = document.getElementById('postContent');
            if (postContent) {
                if (window.Mentions && typeof window.Mentions.initMentions === 'function') {
                    window.Mentions.initMentions(postContent, {
                        onMentionInsert: function(mentionData) {
                            console.log('[DEBUG] Mention inserted:', mentionData);
                        }
                    });
                    console.log('[DEBUG] Mentions initialised on post content');
                } else {
                    console.warn('[DEBUG] Mentions.initMentions not available');
                }
            }

            const activePanel = document.querySelector('.panel.active');
            if (activePanel && activePanel.id === 'panel-sell') {
                loadCategories();
            } else {
                setTimeout(loadCategories, 500);
            }

            console.log('[DEBUG] create.html initialised (with Mentions + Notifications)');
            console.log('[DEBUG] PostsAPI:', !!window.PostsAPI);
            console.log('[DEBUG] ListingsAPI:', !!window.ListingsAPI);
            console.log('[DEBUG] CategoryAPI:', !!window.CategoryAPI);
            console.log('[DEBUG] Mentions:', !!window.Mentions);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
