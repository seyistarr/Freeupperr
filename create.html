        async function loadCategories() {
            if (categoriesLoaded) return;
            try {
                if (!window.CategoryAPI || typeof window.CategoryAPI.loadCategories !== 'function') {
                    console.warn('[DEBUG] CategoryAPI not loaded, trying fallback...');
                    const { data, error } = await window.sb
                        .from('market_categories')
                        .select('*')
                        .eq('active', true)
                        .order('sort_order', { ascending: true });
                    if (error) throw error;
                    dbCategories = data || [];
                } else {
                    dbCategories = await window.CategoryAPI.loadCategories();
                }
                categoriesLoaded = true;

                document.getElementById('categoryPickerBtn').disabled = false;

                if (selectedCategoryId) {
                    updateCategoryPickerDisplay(selectedCategoryId);
                }
                console.log('[DEBUG] Categories loaded:', dbCategories.length);
            } catch (err) {
                console.error('[DEBUG] Failed to load categories:', err);
                showToast('Could not load categories. Please refresh.', 'r');
            }
        }

        async function loadSubcategories(categoryId) {
            if (!categoryId) {
                document.getElementById('subcategoryPickerBtn').disabled = true;
                document.getElementById('subcategoryPickerBtn').querySelector('.placeholder').textContent =
                    'Select category first';
                document.getElementById('itemSubcategoryId').value = '';
                selectedSubcategoryId = '';
                return;
            }

            try {
                if (!window.CategoryAPI || typeof window.CategoryAPI.loadSubcategories !== 'function') {
                    console.warn('[DEBUG] CategoryAPI not loaded, trying fallback...');
                    const { data, error } = await window.sb
                        .from('market_subcategories')
                        .select('*')
                        .eq('category_id', categoryId)
                        .eq('active', true)
                        .order('sort_order', { ascending: true });
                    if (error) throw error;
                    dbSubcategories = data || [];
                } else {
                    dbSubcategories = await window.CategoryAPI.loadSubcategories(categoryId);
                }

                const subBtn = document.getElementById('subcategoryPickerBtn');
                if (dbSubcategories.length === 0) {
                    subBtn.disabled = true;
                    subBtn.querySelector('.placeholder').textContent = 'No subcategories';
                    document.getElementById('itemSubcategoryId').value = '';
                    selectedSubcategoryId = '';
                } else {
                    subBtn.disabled = false;
                    subBtn.querySelector('.placeholder').textContent = 'Select subcategory';
                    if (selectedSubcategoryId) {
                        updateSubcategoryPickerDisplay(selectedSubcategoryId);
                    }
                }
                console.log('[DEBUG] Subcategories loaded:', dbSubcategories.length);
            } catch (err) {
                console.error('[DEBUG] Failed to load subcategories:', err);
                showToast('Could not load subcategories.', 'r');
            }
        }

        // ── Picker Modal Functions ──

        function openPickerModal(mode) {
            pickerMode = mode;
            const modal = document.getElementById('pickerModal');
            const title = document.getElementById('pickerModalTitle');
            const list = document.getElementById('pickerList');
            const search = document.getElementById('pickerSearchInput');

            if (mode === 'category') {
                title.textContent = 'Select Category';
                pickerData = dbCategories.map(c => ({ id: c.id, name: c.name }));
            } else {
                title.textContent = 'Select Subcategory';
                if (!selectedCategoryId) {
                    showToast('Please select a category first', 'o');
                    return;
                }
                pickerData = dbSubcategories.map(s => ({ id: s.id, name: s.name }));
                if (pickerData.length === 0) {
                    showToast('No subcategories available', 'o');
                    return;
                }
            }

            search.value = '';
            renderPickerItems(pickerData);
            modal.classList.add('open');
        }

        function closePickerModal() {
            document.getElementById('pickerModal').classList.remove('open');
        }

        function renderPickerItems(data) {
            const list = document.getElementById('pickerList');
            if (!data || data.length === 0) {
                list.innerHTML = `<div class="picker-empty">No options available</div>`;
                return;
            }

            const selectedId = pickerMode === 'category' ? selectedCategoryId : selectedSubcategoryId;

            list.innerHTML = data.map(item => `
                    <div class="picker-item ${item.id === selectedId ? 'active' : ''}" onclick="selectPickerItem('${item.id}')">
                        <span>${item.name}</span>
                        <span class="check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
                    </div>
                `).join('');
        }

        function filterPickerItems() {
            const query = document.getElementById('pickerSearchInput').value.toLowerCase();
            const filtered = pickerData.filter(item => item.name.toLowerCase().includes(query));
            renderPickerItems(filtered);
        }

        function selectPickerItem(id) {
            if (pickerMode === 'category') {
                selectedCategoryId = id;
                const cat = dbCategories.find(c => c.id === id);
                if (cat) {
                    document.getElementById('categoryPickerBtn').querySelector('.placeholder').textContent = cat.name;
                    document.getElementById('itemCategoryId').value = id;
                    selectedSubcategoryId = '';
                    document.getElementById('subcategoryPickerBtn').querySelector('.placeholder').textContent =
                        'Select subcategory';
                    document.getElementById('itemSubcategoryId').value = '';
                    loadSubcategories(id);
                }
            } else {
                selectedSubcategoryId = id;
                const sub = dbSubcategories.find(s => s.id === id);
                if (sub) {
                    document.getElementById('subcategoryPickerBtn').querySelector('.placeholder').textContent = sub.name;
                    document.getElementById('itemSubcategoryId').value = id;
                }
            }
            closePickerModal();
            renderPickerItems(pickerData);
        }

        function updateCategoryPickerDisplay(categoryId) {
            const cat = dbCategories.find(c => c.id === categoryId);
            if (cat) {
                document.getElementById('categoryPickerBtn').querySelector('.placeholder').textContent = cat.name;
                document.getElementById('itemCategoryId').value = categoryId;
            }
        }

        function updateSubcategoryPickerDisplay(subcategoryId) {
            const sub = dbSubcategories.find(s => s.id === subcategoryId);
            if (sub) {
                document.getElementById('subcategoryPickerBtn').querySelector('.placeholder').textContent = sub.name;
                document.getElementById('itemSubcategoryId').value = subcategoryId;
            }
        }

        // ──────────────────────────────────────────────────────────────
        // SUBMIT POST – with Mentions + Notifications + commentsHidden flag + source: 'composer' + image embedding (averaged)
        // ──────────────────────────────────────────────────────────────
        async function submitPost() {
            console.log('[DEBUG] submitPost called');

            if (!window.PostsAPI || typeof window.PostsAPI.createPost !== 'function') {
                showToast('System not ready. Please refresh.', 'r');
                return;
            }

            const user = getCurrentUser();
            if (!user || !user.isLoggedIn) {
                showToast('Please sign in to create a post', 'o');
                if (window.AuthUser && typeof window.AuthUser.openModal === 'function') {
                    window.AuthUser.openModal('signup');
                }
                return;
            }

            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const hideComments = document.getElementById('postHideComments').checked;

            if (!title && !content && postMedia.length === 0) {
                showToast('Please add a title, content or media', 'o');
                return;
            }
            if (postTags.length > 5) {
                showToast('Max 5 tags allowed', 'o');
                return;
            }
            if (postMedia.some(m => m.uploading)) {
                showToast('Please wait for media to finish uploading', 'o');
                return;
            }

            const textarea = document.getElementById('postContent');
            let mentions = [];
            if (window.Mentions && typeof window.Mentions.extractMentions === 'function') {
                mentions = window.Mentions.extractMentions(textarea);
                console.log('[DEBUG] Extracted mentions:', mentions);
            }

            const btn = document.querySelector('.btn-primary[onclick="submitPost()"]');
            const originalText = btn.textContent;
            btn.textContent = 'Publishing...';
            btn.disabled = true;

            const media = postMedia.map(m => ({
                url: m.url,
                type: m.type,
                public_id: m.public_id || ''
            }));
            const firstItem = media[0] || {};

            const validEmbeddings = postImageEmbeddings.filter(e => Array.isArray(e) && e.length);
            const imageEmbedding = (window.ImageEmbedding && typeof window.ImageEmbedding.averageEmbeddings === 'function' &&
                validEmbeddings.length) ?
                window.ImageEmbedding.averageEmbeddings(validEmbeddings) :
                null;
            console.log(`[Embedding] Averaging ${validEmbeddings.length}/${postImageEmbeddings.length} image(s) for this post.`);

            try {
                const result = await PostsAPI.createPost({
                    title,
                    content: content || '',
                    tags: postTags.slice(),
                    media: media,
                    mediaUrl: firstItem.url || '',
                    mediaType: firstItem.type || '',
                    mentions: mentions,
                    commentsHidden: hideComments,
                    source: 'composer',
                    imageEmbedding: imageEmbedding
                });

                console.log('[DEBUG] Post created successfully:', result);

                if (result.id && mentions.length > 0) {
                    if (window.Mentions && typeof window.Mentions.notifyMentionedUsers === 'function') {
                        try {
                            await window.Mentions.notifyMentionedUsers(
                                'post',
                                result.id,
                                mentions,
                                user.id,
                                null
                            );
                            console.log('[DEBUG] Mention notifications sent for', mentions.length, 'users');
                        } catch (notifyErr) {
                            console.error('[DEBUG] Failed to send mention notifications:', notifyErr);
                        }
                    }
                }

                // ── Reset form ──
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('postContent')._mentions = [];
                syncMentionBackdrop(document.getElementById('postContent'), document.getElementById('postContentBackdrop'));
                document.getElementById('postHideComments').checked = false;
                document.getElementById('postMediaUrlInput').value = '';
                postMedia.forEach(m => { if (m.url?.startsWith('blob:')) URL.revokeObjectURL(m.url); });
                postMedia = [];
                postImageEmbeddings = [];
                renderPostImageGrid();
                postTags = [];
                renderPostTags();

                showToast('Post published! 🎉', 'g');
                btn.textContent = originalText;
                btn.disabled = false;

                setTimeout(() => {
                    window.location.href = 'index.html?refresh=' + Date.now();
                }, 500);

            } catch (err) {
                console.error('[DEBUG] Error creating post:', err);
                showToast(err.message || 'Failed to publish post. Please try again.', 'r');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // ──────────────────────────────────────────────────────────────
        // SUBMIT ITEM – uses ListingsAPI.createListing
        // ──────────────────────────────────────────────────────────────
        function submitItem() {
            console.log('[DEBUG] submitItem called');

            const user = getCurrentUser();
            if (!user || !user.isLoggedIn) {
                showToast('Please sign in to list an item', 'o');
                if (window.AuthUser && typeof window.AuthUser.openModal === 'function') {
                    window.AuthUser.openModal('signup');
                }
                return;
            }

            if (!window.ListingsAPI || typeof window.ListingsAPI.createListing !== 'function') {
                showToast('Marketplace system not ready. Please refresh.', 'r');
                return;
            }

            const title = document.getElementById('itemTitle').value.trim();
            var priceInput = document.getElementById('itemPrice');
            var price = priceInput.value.replace(/[^0-9,]/g, '').replace(/,/g, '');
            const description = document.getElementById('itemDescription').value.trim();
            const location = document.getElementById('itemLocation').value.trim();
            const condition = document.getElementById('itemCondition').value;
            const lat = document.getElementById('itemLat').value;
            const lng = document.getElementById('itemLng').value;
            const categoryId = document.getElementById('itemCategoryId').value;
            const subcategoryId = document.getElementById('itemSubcategoryId').value;
            const whatsapp = document.getElementById('itemWhatsApp').value.trim();

            if (!title || !price) {
                showToast('Item name and price are required', 'o');
                return;
            }
            if (isNaN(Number(price)) || Number(price) <= 0) {
                showToast('Enter a valid price', 'o');
                return;
            }
            if (!categoryId) {
                showToast('Please select a category', 'o');
                return;
            }
            if (marketImages.some(function(i) { return i.uploading; })) {
                showToast('Please wait for images to finish uploading', 'o');
                return;
            }

            var imageObjects = marketImages.map(function(img) {
                return {
                    url: img.url,
                    public_id: img.public_id || ''
                };
            });

            var btn = document.querySelector('.btn-primary[onclick="submitItem()"]');
            var originalText = btn.textContent;
            btn.textContent = 'Listing...';
            btn.disabled = true;

            ListingsAPI.createListing({
                    title: title,
                    price: parseFloat(price),
                    category_id: categoryId,
                    subcategory_id: subcategoryId || null,
                    location: location || 'Campus',
                    lat: lat ? parseFloat(lat) : null,
                    lng: lng ? parseFloat(lng) : null,
                    images: imageObjects,
                    description: description || '',
                    condition: condition || 'New',
                    whatsapp: whatsapp || null
                })
                .then(function(result) {
                    console.log('[DEBUG] Item listed successfully:', result);
                    document.getElementById('itemTitle').value = '';
                    document.getElementById('itemPrice').value = '';
                    document.getElementById('itemDescription').value = '';
                    document.getElementById('itemLocation').value = '';
                    document.getElementById('itemLat').value = '';
                    document.getElementById('itemLng').value = '';
                    document.getElementById('locationStatus').textContent = '';
                    document.getElementById('itemWhatsApp').value = '';
                    var input = document.getElementById('marketImageUrlInput');
                    input.value = '';
                    input.style.color = '';
                    input.style.fontWeight = '';
                    marketImages = [];
                    renderMarketImages();
                    fullscreenImages = [];
                    document.querySelectorAll('.condition-opt').forEach(function(c) { c.classList.remove('active'); });
                    document.querySelector('.condition-opt[data-condition="New"]').classList.add('active');
                    selectedCondition = 'New';
                    document.getElementById('itemCondition').value = 'New';

                    selectedCategoryId = '';
                    selectedSubcategoryId = '';
                    document.getElementById('itemCategoryId').value = '';
                    document.getElementById('itemSubcategoryId').value = '';
                    document.getElementById('categoryPickerBtn').querySelector('.placeholder').textContent =
                        'Select category';
                    document.getElementById('subcategoryPickerBtn').querySelector('.placeholder').textContent =
                        'Select category first';
                    document.getElementById('subcategoryPickerBtn').disabled = true;
                    categoriesLoaded = false;
                    dbCategories = [];
                    dbSubcategories = [];
                    loadCategories();

                    showToast('Item listed! 🛍️', 'g');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    setTimeout(() => {
                        window.location.href = 'index.html?refresh=' + Date.now();
                    }, 500);
                })
                .catch(function(err) {
                    console.error('[DEBUG] Error listing item:', err);
                    showToast(err.message || 'Failed to list item', 'r');
                    btn.textContent = originalText;
                    btn.disabled = false;
                });
        }

        // ──────────────────────────────────────────────────────────────
        // AVATAR / NAV UPDATES
        // ──────────────────────────────────────────────────────────────
        function updateNavAvatar() {
            const user = getCurrentUser();
            document.querySelectorAll('.side-av, .nav-av').forEach(el => {
                el.src = user?.avatar || '';
                el.onerror = function() { this.style.display = 'none'; };
            });
        }

        // ──────────────────────────────────────────────────────────────
        // CHARACTER COUNTERS
        // ──────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', function() {
            const titleInput = document.getElementById('postTitle');
            const titleCount = document.getElementById('postTitleCount');
            titleInput.addEventListener('input', function() {
                titleCount.textContent = this.value.length + ' / 100';
            });

            const contentInput = document.getElementById('postContent');
            const contentCount = document.getElementById('postContentCount');
            contentInput.addEventListener('input', function() {
                const len = this.value.length;
                contentCount.textContent = len + ' characters';
                if (len > 1000) {
                    contentCount.classList.add('warn');
                } else {
                    contentCount.classList.remove('warn');
                }
            });

            initMentionBackdrop();
        });

        // ──────────────────────────────────────────────────────────────
        // INIT
        // ──────────────────────────────────────────────────────────────
        function init() {
            updateNavAvatar();

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.side-btn').forEach(el => el.classList.remove('active'));
            document.querySelector('.side-btn[href="create.html"]')?.classList.add('active');

            const user = getCurrentUser();
            if (user && user.isLoggedIn) {
                updateNavAvatar();
                document.querySelector('.topbar-title').textContent = 'Create';
            }

            document.addEventListener('profileUpdated', function(e) {
                if (e.detail?.user) {
                    updateNavAvatar();
                    if (e.detail.user.isLoggedIn) {
                        document.querySelector('.topbar-title').textContent = 'Create';
                    }
                }
            });

            document.addEventListener('themeChanged', function(e) {
                document.documentElement.setAttribute('data-theme', e.detail.theme);
            });

            const postContent = document.getElementById('postContent');
            if (postContent) {
                if (window.Mentions && typeof window.Mentions.initMentions === 'function') {
                    window.Mentions.initMentions(postContent);
                    console.log('[DEBUG] Mentions initialised on post content');
                }
                initMentionBackdrop();
            }

            const activePanel = document.querySelector('.panel.active');
            if (activePanel && activePanel.id === 'panel-sell') {
                loadCategories();
            } else {
                setTimeout(loadCategories, 500);
            }

            if (window.ImageEmbedding && typeof window.ImageEmbedding.preloadModel === 'function') {
                window.ImageEmbedding.preloadModel()
                    .then(() => console.log('[Embedding] Model preloaded successfully'))
                    .catch(e => console.warn('[Embedding] Preload error:', e));
            } else {
                console.warn('[Embedding] ImageEmbedding not available for preload');
            }

            console.log('[DEBUG] create.html: multi‑image support, source: composer, up to 20 images, with per-image embedding averaging, mention live-highlight');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
