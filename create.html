    <style>
        /* ── all existing styles from original create.html, minus duplicate nav rules ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }
        svg {
            overflow: visible;
        }

        :root {
            --p: #8b5cf6;
            --pd: #6c3fc5;
            --pl: #a78bfa;
            --pdim: rgba(139, 92, 246, .15);
            --pbrd: rgba(139, 92, 246, .28);
            --pglow: rgba(108, 63, 197, .45);
            --danger: #f87171;
            --warn: #fb923c;
            --ok: #4ade80;
            --blue: #60a5fa;
            --nav-h: 78px;
        }

        [data-theme="dark"] {
            --bg: #000;
            --bg2: #0a0a0a;
            --bg3: #111;
            --bg4: #1a1a1a;
            --bg5: #222;
            --brd: rgba(255, 255, 255, .07);
            --brd2: rgba(255, 255, 255, .12);
            --text: #fff;
            --muted: rgba(255, 255, 255, .4);
            --muted2: rgba(255, 255, 255, .22);
            --inp: rgba(255, 255, 255, .05);
            --rowh: rgba(255, 255, 255, .04);
            --navbg: rgba(0, 0, 0, .97);
            --sidebg: #0a0a0a;
            --dotbg: rgba(255, 255, 255, .07);
            --dotc: #fff;
            --cardsh: 0 2px 16px rgba(0, 0, 0, .5);
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --bg2: #fff;
            --bg3: #fff;
            --bg4: #e8e8ed;
            --bg5: #d8d8de;
            --brd: rgba(0, 0, 0, .08);
            --brd2: rgba(0, 0, 0, .13);
            --text: #0d0d0d;
            --muted: rgba(0, 0, 0, .44);
            --muted2: rgba(0, 0, 0, .26);
            --inp: rgba(0, 0, 0, .05);
            --rowh: rgba(0, 0, 0, .04);
            --navbg: rgba(242, 242, 247, .97);
            --sidebg: #fff;
            --dotbg: rgba(0, 0, 0, .07);
            --dotc: #0d0d0d;
            --cardsh: 0 2px 16px rgba(0, 0, 0, .1);
        }

        /* BASE */
        html,
        body {
            height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background .3s, color .3s;
            overflow: hidden;
        }

        .layout {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* ─── side-nav and bottom-nav styles are now external ─── */

        .main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--bg);
            scroll-behavior: smooth;
            transition: background .3s;
            padding-bottom: 80px;
        }
        .main::-webkit-scrollbar {
            width: 0;
        }
        .create-col {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(44px, 8vw, 56px) 0 10px;
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--bg);
            transition: background .3s;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-title {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 800;
            letter-spacing: -.3px;
        }

        .create-tabs {
            display: flex;
            border-bottom: 1px solid var(--brd);
            margin-bottom: 20px;
            gap: 4px;
            background: var(--bg);
            transition: background .3s, border-color .3s;
        }
        .create-tab {
            flex: 1;
            padding: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            transition: all .15s;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }
        .create-tab svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--muted2);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .create-tab.active {
            border-bottom-color: var(--p);
            color: var(--p);
        }
        .create-tab.active svg {
            stroke: var(--p);
        }
        .create-tab:hover {
            color: var(--text);
            background: var(--rowh);
        }

        .panel {
            display: none;
            animation: fadeUp .3s ease both;
        }
        .panel.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* FORM ELEMENTS */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        .form-lbl {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .07em;
        }
        .form-inp {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color .15s, background .3s, color .3s;
            font-family: inherit;
        }
        .form-inp:focus {
            border-color: var(--p);
        }
        .form-inp::placeholder {
            color: var(--muted2);
        }
        .form-inp:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        textarea.form-inp {
            resize: vertical;
            min-height: 100px;
            line-height: 1.6;
        }

        /* ── Modern Picker Button (replaces select) ── */
        .picker-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color .15s, background .3s, color .3s;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            -webkit-appearance: none;
            appearance: none;
        }
        .picker-btn:focus {
            border-color: var(--p);
        }
        .picker-btn .placeholder {
            color: var(--muted2);
        }
        .picker-btn .arrow {
            flex-shrink: 0;
            margin-left: 8px;
            transition: transform .25s;
        }
        .picker-btn .arrow svg {
            width: 16px;
            height: 16px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: block;
        }
        .picker-btn .selected-label {
            font-weight: 500;
            color: var(--text);
        }
        .picker-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .picker-btn .badge-pill {
            font-size: 10px;
            background: var(--pdim);
            color: var(--pl);
            padding: 2px 10px;
            border-radius: 100px;
            font-weight: 700;
            margin-left: 8px;
        }

        /* ── Picker Modal ── */
        .picker-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .picker-modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .picker-sheet {
            width: 100%;
            max-width: 560px;
            max-height: 75vh;
            background: var(--bg3);
            border-radius: 24px 24px 0 0;
            border-top: 1px solid var(--brd2);
            transform: translateY(60px);
            transition: transform .34s cubic-bezier(.32, 1, .64, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .picker-modal-overlay.open .picker-sheet {
            transform: translateY(0);
        }
        .picker-handle {
            width: 40px;
            height: 4px;
            border-radius: 100px;
            background: var(--brd2);
            margin: 14px auto 0;
            flex-shrink: 0;
        }
        .picker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 12px;
            border-bottom: 1px solid var(--brd);
            flex-shrink: 0;
        }
        .picker-title {
            font-size: 17px;
            font-weight: 800;
        }
        .picker-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--inp);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }
        .picker-close:hover {
            background: var(--pdim);
        }
        .picker-close svg {
            width: 15px;
            height: 15px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
        }
        .picker-search {
            padding: 8px 16px 8px;
            flex-shrink: 0;
        }
        .picker-search input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color .15s;
        }
        .picker-search input:focus {
            border-color: var(--p);
        }
        .picker-search input::placeholder {
            color: var(--muted2);
        }
        .picker-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 20px;
            -webkit-overflow-scrolling: touch;
        }
        .picker-list::-webkit-scrollbar {
            width: 0;
        }
        .picker-item {
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: background .1s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
        }
        .picker-item:hover {
            background: var(--rowh);
        }
        .picker-item.active {
            background: var(--pdim);
            color: var(--pl);
        }
        .picker-item .check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--brd2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all .15s;
        }
        .picker-item.active .check {
            border-color: var(--p);
            background: var(--p);
        }
        .picker-item.active .check svg {
            stroke: #fff;
            width: 10px;
            height: 10px;
            display: block;
        }
        .picker-item .check svg {
            display: none;
        }
        .picker-empty {
            padding: 30px 0;
            text-align: center;
            color: var(--muted2);
            font-size: 14px;
        }

        /* ── other existing styles ── */
        .char-c {
            font-size: 11px;
            color: var(--muted2);
            text-align: right;
        }
        .char-c.warn {
            color: var(--warn);
        }
        .char-c.err {
            color: var(--danger);
        }

        /* ─── TOGGLE SWITCH ─── */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            margin-bottom: 16px;
        }
        .toggle-row-text {
            min-width: 0;
        }
        .toggle-row-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }
        .toggle-row-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
            line-height: 1.4;
        }
        .toggle {
            position: relative;
            width: 46px;
            height: 26px;
            flex-shrink: 0;
        }
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle .track {
            position: absolute;
            inset: 0;
            border-radius: 100px;
            background: rgba(150, 150, 150, .25);
            cursor: pointer;
            transition: background .2s;
            border: 1.5px solid var(--brd);
        }
        .toggle input:checked+.track {
            background: var(--p);
            border-color: var(--p);
        }
        .toggle .track::after {
            content: '';
            position: absolute;
            left: 2px;
            top: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            transition: transform .2s cubic-bezier(.34, 1.4, .64, 1);
            box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
        }
        .toggle input:checked+.track::after {
            transform: translateX(20px);
        }

        .tag-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px 5px 14px;
            border-radius: 100px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-size: 12px;
            font-weight: 700;
        }
        .tag-pill button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--pl);
            font-size: 14px;
            line-height: 1;
            padding: 0;
        }
        .tag-pill button:hover {
            color: var(--danger);
        }

        .tag-input-row {
            display: flex;
            gap: 8px;
        }
        .tag-input-row .form-inp {
            flex: 1;
        }
        .tag-input-row button {
            padding: 10px 18px;
            border-radius: 12px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
            white-space: nowrap;
        }
        .tag-input-row button:hover {
            background: rgba(139, 92, 246, .25);
        }

        .btn-primary {
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--p), var(--pd));
            color: #fff !important;
            font-size: 15px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: opacity .15s, transform .15s;
            box-shadow: 0 4px 20px var(--pglow);
        }
        .btn-primary:hover {
            opacity: .9;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: .35;
            cursor: default;
            transform: none;
        }

        .category-row {
            display: flex;
            gap: 10px;
        }
        .category-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .upload-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .upload-row .form-inp {
            flex: 1;
        }
        .upload-row .upload-btn {
            padding: 10px 16px;
            border-radius: 12px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
            white-space: nowrap;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .upload-row .upload-btn:hover {
            background: rgba(139, 92, 246, .25);
        }
        .upload-row .upload-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .upload-progress {
            height: 3px;
            background: var(--brd);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        .upload-progress-bar {
            height: 100%;
            background: var(--p);
            width: 0%;
            transition: width .3s;
            border-radius: 2px;
        }

        .image-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .image-scroll::-webkit-scrollbar {
            display: none;
        }
        .image-thumb {
            position: relative;
            flex: 0 0 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg4);
            border: 2px solid var(--brd);
            cursor: pointer;
            transition: transform .15s;
        }
        .image-thumb:hover {
            transform: scale(1.05);
        }
        .image-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-thumb .remove-btn {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .7);
            border: none;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }
        .image-thumb .remove-btn:hover {
            background: rgba(220, 38, 38, .8);
        }
        .image-thumb .cover-badge {
            position: absolute;
            bottom: 3px;
            left: 3px;
            background: rgba(0, 0, 0, .6);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 3px;
        }
        .image-thumb .uploading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-thumb .uploading-overlay .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, .2);
            border-top-color: var(--p);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .image-add-btn {
            flex: 0 0 80px;
            height: 80px;
            border-radius: 12px;
            border: 2px dashed var(--brd2);
            background: var(--inp);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .15s;
            color: var(--muted2);
            font-size: 10px;
            font-weight: 600;
            gap: 2px;
        }
        .image-add-btn:hover {
            border-color: var(--pbrd);
            color: var(--pl);
            background: var(--pdim);
        }
        .image-add-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .fullscreen-viewer {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, .95);
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .fullscreen-viewer.open {
            opacity: 1;
            pointer-events: auto;
        }
        .fullscreen-viewer .viewer-header {
            display: flex;
            justify-content: flex-end;
            padding: 16px 20px;
            flex-shrink: 0;
            z-index: 2;
        }
        .fullscreen-viewer .viewer-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .2);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }
        .fullscreen-viewer .viewer-close:hover {
            background: rgba(255, 255, 255, .2);
        }
        .fullscreen-viewer .viewer-close svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
        }
        .fullscreen-viewer .viewer-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px 40px;
            overflow: hidden;
        }
        .fullscreen-viewer .viewer-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            user-select: none;
            -webkit-user-drag: none;
        }
        .fullscreen-viewer .viewer-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .6);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .price-wrap {
            position: relative;
        }
        .price-wrap .currency {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: var(--muted);
        }
        .price-wrap .form-inp {
            padding-left: 32px;
        }

        .condition-row {
            display: flex;
            gap: 8px;
        }
        .condition-opt {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            text-align: center;
            cursor: pointer;
            transition: all .15s;
            font-weight: 600;
            color: var(--muted);
            font-size: 13px;
        }
        .condition-opt:hover {
            border-color: var(--pbrd);
            background: var(--pdim);
            color: var(--pl);
        }
        .condition-opt.active {
            border-color: var(--p);
            background: var(--pdim);
            color: var(--pl);
        }

        .location-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .location-row .form-inp {
            flex: 1;
        }
        .location-btn {
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .location-btn:hover {
            background: rgba(139, 92, 246, .25);
        }
        .location-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .location-status {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        #tw {
            position: fixed;
            top: clamp(14px, 4vw, 22px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: calc(100vw - 32px);
        }
        .toast {
            background: var(--bg3);
            border: 1px solid var(--brd2);
            border-radius: 100px;
            padding: 11px 18px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .55);
            animation: tIn .3s cubic-bezier(.34, 1.2, .64, 1) both;
            white-space: nowrap;
        }
        .toast.out {
            animation: tOut .25s ease forwards;
        }
        @keyframes tIn {
            from {
                transform: translateY(-14px);
                opacity: 0;
            }
            to {
                transform: none;
                opacity: 1;
            }
        }
        @keyframes tOut {
            to {
                transform: translateY(-10px);
                opacity: 0;
            }
        }
        .td {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .tg {
            background: var(--ok);
        }
        .tp {
            background: var(--p);
        }
        .tr {
            background: var(--danger);
        }
        .to {
            background: var(--warn);
        }

        @media (min-width:768px) {
            .main {
                padding-bottom: 24px;
            }
        }
        @media (min-width:1024px) {
            .create-col {
                max-width: 640px;
            }
        }
        .main::-webkit-scrollbar,
        .side-nav::-webkit-scrollbar {
            width: 0;
        }

        /* ─── FIX: mention highlight now matches index.html's mention-link style ───
           bold, light-purple text, no background pill */
        .mention-highlight {
            color: var(--pl);
            font-weight: 800;
        }

        /* ─── Mention live-highlight overlay for the Content textarea ───
           A textarea can't style parts of its own text, so we stack a
           read-only "backdrop" div behind a transparent-text textarea.
           The backdrop mirrors what's typed and bolds/colors @mentions;
           the textarea itself only shows the caret and selection. */
        .mention-textarea-wrap {
            position: relative;
        }
        .mention-backdrop {
            position: absolute;
            inset: 0;
            margin: 0;
            padding: 12px 16px;
            border: 1.5px solid transparent;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            font-family: inherit;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: hidden;
            color: var(--text);
            pointer-events: none;
        }
        .mention-textarea {
            position: relative;
            background: transparent;
            color: transparent;
            caret-color: var(--text);
        }
        .mention-textarea::placeholder {
            color: var(--muted2);
        }
        .mention-suggestions {
            background: var(--bg3);
            border: 1px solid var(--brd2);
            border-radius: 12px;
            max-height: 180px;
            overflow-y: auto;
            position: absolute;
            z-index: 60;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
            display: none;
            padding: 6px 0;
        }
        .mention-suggestions .suggestion-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background .1s;
            font-size: 14px;
        }
        .mention-suggestions .suggestion-item:hover,
        .mention-suggestions .suggestion-item.active {
            background: var(--pdim);
        }
        .mention-suggestions .suggestion-item img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg4);
        }
        .mention-suggestions .suggestion-item .s-name {
            font-weight: 600;
        }
        .mention-suggestions .suggestion-item .s-handle {
            font-size: 12px;
            color: var(--muted);
        }
        .mention-suggestions .suggestion-item .s-badge {
            font-size: 10px;
            background: var(--pdim);
            color: var(--pl);
            padding: 2px 8px;
            border-radius: 100px;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <!-- ══ TOAST CONTAINER ══ -->
    <div id="tw"></div>

    <div class="layout">

        <!-- ════ SIDE NAV (shared) ════ -->
        <side-nav show-chat></side-nav>

        <!-- ════ MAIN ════ -->
        <div class="main" id="mainScroll">
            <div class="create-col">

                <!-- Topbar -->
                <div class="topbar">
                    <div class="topbar-left">
                        <span class="topbar-title" id="pageTitle">Create</span>
                    </div>
                    <div class="topbar-actions">
                        <!-- Theme toggle is global via global.js -->
                    </div>
                </div>

                <!-- Tabs -->
                <div class="create-tabs">
                    <button class="create-tab active" data-tab="post" onclick="switchTab(this, 'post')">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        Create Post
                    </button>
                    <button class="create-tab" data-tab="sell" onclick="switchTab(this, 'sell')">
                        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                        Sell Item
                    </button>
                </div>

                <!-- Panel: Create Post (no category, no description) -->
                <div class="panel active" id="panel-post">
                    <div id="post-form">
                        <!-- Title -->
                        <div class="form-group">
                            <label class="form-lbl">Title <span style="font-weight:400;color:var(--muted2);">(optional)</span></label>
                            <input class="form-inp" id="postTitle" type="text" placeholder="What's on your mind?" maxlength="100">
                            <span class="char-c" id="postTitleCount">0 / 100</span>
                        </div>

                        <!-- Content (optional) — with mention live-highlight overlay -->
                        <div class="form-group" style="position:relative;">
                            <label class="form-lbl">Content <span style="font-weight:400;color:var(--muted2);">(optional)</span></label>
                            <div class="mention-textarea-wrap">
                                <div class="mention-backdrop" id="postContentBackdrop" aria-hidden="true"></div>
                                <textarea class="form-inp mention-textarea" id="postContent" placeholder="Write your post content... Use @ to mention someone" rows="6"></textarea>
                            </div>
                            <div class="mention-suggestions" id="mentionSuggestions"></div>
                            <span class="char-c" id="postContentCount">0 characters</span>
                        </div>

                        <!-- Tags (max 5) -->
                        <div class="form-group">
                            <label class="form-lbl">Tags <span style="font-weight:400;color:var(--muted2);">(max 5)</span></label>
                            <div class="tag-pills" id="postTags"></div>
                            <div class="tag-input-row">
                                <input class="form-inp" id="postTagInput" type="text" placeholder="Add a tag..." maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault();addPostTag();}">
                                <button onclick="addPostTag()">Add</button>
                            </div>
                        </div>

                        <!-- Media – multi‑image / video (up to 20 images) -->
                        <div class="form-group">
                            <label class="form-lbl">Media <span style="font-weight:400;color:var(--muted2);">(up to 20 images, or 1 video max 100MB/3 mins)</span></label>
                            <div class="upload-row">
                                <input class="form-inp" id="postMediaUrlInput" type="text" placeholder="Paste image or YouTube link..." oninput="previewPostMedia()">
                                <button class="upload-btn" onclick="document.getElementById('postFileInput').click()">
                                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    Upload
                                </button>
                            </div>
                            <input type="file" id="postFileInput" accept="image/*,video/*" multiple style="display:none" onchange="handlePostUpload(event)">
                            <div class="upload-progress" id="postProgress" style="display:none;">
                                <div class="upload-progress-bar" id="postProgressBar"></div>
                            </div>
                            <div class="image-scroll" id="postImageGrid"></div>
                        </div>

                        <!-- Toggle: Hide Comments -->
                        <div class="toggle-row">
                            <div class="toggle-row-text">
                                <div class="toggle-row-title">Hide Comments</div>
                                <div class="toggle-row-sub">Turn off replies for this post. You can change this anytime from the post's menu.</div>
                            </div>
                            <label class="toggle">
                                <input type="checkbox" id="postHideComments">
                                <div class="track"></div>
                            </label>
                        </div>

                        <button class="btn-primary" onclick="submitPost()">Publish Post</button>
                    </div>
                </div>

                <!-- Panel: Sell Item – DATABASE-DRIVEN CATEGORIES + WHATSAPP -->
                <div class="panel" id="panel-sell">
                    <div id="sell-form">
                        <!-- Item Name -->
                        <div class="form-group">
                            <label class="form-lbl">Item Name <span style="color:var(--danger);">*</span></label>
                            <input class="form-inp" id="itemTitle" type="text" placeholder="What are you selling?" maxlength="80">
                        </div>

                        <!-- Price -->
                        <div class="form-group">
                            <label class="form-lbl">Price (₦) <span style="color:var(--danger);">*</span></label>
                            <div class="price-wrap">
                                <span class="currency">₦</span>
                                <input class="form-inp" id="itemPrice" type="text" inputmode="numeric" placeholder="5000" maxlength="12" oninput="formatPrice(this)">
                            </div>
                        </div>

                        <!-- ── CATEGORY & SUBCATEGORY with modern pickers ── -->
                        <div class="category-row">
                            <div class="form-group">
                                <label class="form-lbl">Category <span style="color:var(--danger);">*</span></label>
                                <button class="picker-btn" id="categoryPickerBtn" onclick="openPickerModal('category')">
                                    <span class="placeholder">Select category</span>
                                    <span class="arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></span>
                                </button>
                                <input type="hidden" id="itemCategoryId" value="">
                            </div>
                            <div class="form-group">
                                <label class="form-lbl">Subcategory</label>
                                <button class="picker-btn" id="subcategoryPickerBtn" onclick="openPickerModal('subcategory')" disabled>
                                    <span class="placeholder">Select category first</span>
                                    <span class="arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></span>
                                </button>
                                <input type="hidden" id="itemSubcategoryId" value="">
                            </div>
                        </div>

                        <!-- Condition -->
                        <div class="form-group">
                            <label class="form-lbl">Condition</label>
                            <div class="condition-row">
                                <div class="condition-opt active" data-condition="New" onclick="selectCondition(this)">New</div>
                                <div class="condition-opt" data-condition="Used" onclick="selectCondition(this)">Used</div>
                                <div class="condition-opt" data-condition="Fair" onclick="selectCondition(this)">Fair</div>
                            </div>
                            <input type="hidden" id="itemCondition" value="New">
                        </div>

                        <!-- Location -->
                        <div class="form-group">
                            <label class="form-lbl">Location</label>
                            <div class="location-row">
                                <input class="form-inp" id="itemLocation" type="text" placeholder="Enter location or tap detect">
                                <button class="location-btn" onclick="detectLocation()">
                                    <svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"/></svg>
                                    Detect
                                </button>
                            </div>
                            <div class="location-status" id="locationStatus"></div>
                            <input type="hidden" id="itemLat" value="">
                            <input type="hidden" id="itemLng" value="">
                        </div>

                        <!-- WhatsApp -->
                        <div class="form-group">
                            <label class="form-lbl">WhatsApp Number <span style="font-weight:400;color:var(--muted2);">(optional)</span></label>
                            <input class="form-inp" id="itemWhatsApp" type="tel" placeholder="e.g. 2348012345678" maxlength="15">
                            <span style="font-size:11px;color:var(--muted2);">Include country code without '+'.</span>
                        </div>

                        <!-- Description -->
                        <div class="form-group">
                            <label class="form-lbl">Description</label>
                            <textarea class="form-inp" id="itemDescription" placeholder="Describe your item..." rows="3"></textarea>
                        </div>

                        <!-- Images -->
                        <div class="form-group">
                            <label class="form-lbl">Images <span style="font-weight:400;color:var(--muted2);">(up to 5)</span></label>
                            <div class="upload-row">
                                <input class="form-inp" id="marketImageUrlInput" type="text" placeholder="Paste image URL..." oninput="previewMarketUrl()">
                                <button class="upload-btn" onclick="document.getElementById('marketFileInput').click()">
                                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    Upload
                                </button>
                            </div>
                            <input type="file" id="marketFileInput" accept="image/*" multiple style="display:none" onchange="handleMarketUpload(event)">
                            <div class="upload-progress" id="marketProgress" style="display:none;">
                                <div class="upload-progress-bar" id="marketProgressBar"></div>
                            </div>
                            <div class="image-scroll" id="marketImageGrid"></div>
                        </div>

                        <button class="btn-primary" onclick="submitItem()">List Item</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- ════ BOTTOM NAV (shared) ════ -->
        <bottom-nav></bottom-nav>

    </div>

    <!-- ══════════════════════════════════════════
         PICKER MODAL (for category/subcategory – scrollable)
    ══════════════════════════════════════════ -->
    <div class="picker-modal-overlay" id="pickerModal" onclick="if(event.target===this)closePickerModal()">
        <div class="picker-sheet" onclick="event.stopPropagation()">
            <div class="picker-handle"></div>
            <div class="picker-header">
                <span class="picker-title" id="pickerModalTitle">Select</span>
                <button class="picker-close" onclick="closePickerModal()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="picker-search">
                <input type="text" id="pickerSearchInput" placeholder="Search..." oninput="filterPickerItems()">
            </div>
            <div class="picker-list" id="pickerList">
                <div class="picker-empty">Loading...</div>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════
         FULLSCREEN IMAGE VIEWER
    ══════════════════════════════════════════ -->
    <div class="fullscreen-viewer" id="fullscreenViewer" onclick="if(event.target===this)closeFullscreen()">
        <div class="viewer-header">
            <button class="viewer-close" onclick="closeFullscreen()">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="viewer-body" id="viewerBody">
            <img id="fullscreenImage" src="" alt="Fullscreen image">
        </div>
        <div class="viewer-counter" id="viewerCounter"></div>
    </div>

    <!-- ===== SHARED NAV SCRIPTS ===== -->
    <script src="bottom-nav.js" defer></script>
    <script src="side-nav.js" defer></script>

    <!-- ══════════════════════════════════════════
    PAGE LOGIC – using PostsAPI & ListingsAPI
    ══════════════════════════════════════════ -->
    <script>
        // ── CONFIG (your original Cloudinary settings) ──
        const CLOUDINARY_CLOUD_NAME = 'duzyf1kda';
        // ─── SEPARATE PRESETS FOR EACH MEDIA TYPE ───
        const CLOUDINARY_IMAGE_UPLOAD_PRESET = 'image_upload'; // for images
        const CLOUDINARY_VIDEO_UPLOAD_PRESET = 'video_upload'; // for videos (must be configured)
        const CLOUDINARY_MARKET_UPLOAD_PRESET = 'market_upload'; // for marketplace images

        const MAX_FILE_SIZE = 5 * 1024 * 1024;
        const MAX_VIDEO_SIZE = 100 * 1024 * 1024;
        const MAX_VIDEO_DURATION_SECONDS = 180;
        const MAX_POST_IMAGES = 20; // ─── up to 20 images ───

        let postTags = [];
        let postMedia = []; // array of {url, type, public_id, uploading}
        let postImageEmbeddings = []; // parallel array, same index as postMedia — embedding vector or null per slot

        let marketImages = [];
        let marketLat = null;
        let marketLng = null;
        let selectedCondition = 'New';
        let lastUploadTime = 0;
        let fullscreenImages = [];
        let fullscreenIndex = 0;

        // ── DB-driven category state ──
        let dbCategories = [];
        let dbSubcategories = [];
        let selectedCategoryId = '';
        let selectedSubcategoryId = '';
        let categoriesLoaded = false;
        let pickerMode = 'category'; // 'category' or 'subcategory'
        let pickerData = [];

        // ──────────────────────────────────────────────────────────────
        // TOAST
        // ──────────────────────────────────────────────────────────────
        function showToast(msg, type) {
            type = type || 'p';
            const w = document.getElementById('tw');
            const el = document.createElement('div');
            el.className = 'toast';
            el.innerHTML = '<div class="td t' + type + '"></div>' + msg;
            w.appendChild(el);
            setTimeout(function() {
                el.classList.add('out');
                setTimeout(function() { el.remove(); }, 260);
            }, 2600);
        }

        // ──────────────────────────────────────────────────────────────
        // MENTION HIGHLIGHT OVERLAY (Content textarea)
        // Mirrors the textarea's text into a backdrop div, wrapping any
        // @username that matches a real captured mention (from
        // mentions.js's el._mentions) in bold, light-purple styling —
        // the same look it gets once the post renders on index.html.
        // ──────────────────────────────────────────────────────────────
        function escapeHtmlForMentions(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        function syncMentionBackdrop(textareaEl, backdropEl) {
            if (!textareaEl || !backdropEl) return;
            const text = textareaEl.value;
            const mentions = textareaEl._mentions || [];
            const usernames = new Set(mentions.map(m => (m.username || '').toLowerCase()));
            let html = escapeHtmlForMentions(text);
            if (usernames.size) {
                html = html.replace(/@([A-Za-z0-9_]{1,30})/g, (match, uname) =>
                    usernames.has(uname.toLowerCase()) ? `<span class="mention-highlight">@${uname}</span>` : match
                );
            }
            // Preserve a trailing newline so the backdrop's height doesn't
            // fall a line short of the textarea's.
            backdropEl.innerHTML = html + (text.endsWith('\n') ? '<br>&nbsp;' : '');
            backdropEl.scrollTop = textareaEl.scrollTop;
        }

        function initMentionBackdrop() {
            const textareaEl = document.getElementById('postContent');
            const backdropEl = document.getElementById('postContentBackdrop');
            if (!textareaEl || !backdropEl || textareaEl._backdropWired) return;
            textareaEl._backdropWired = true;
            textareaEl.addEventListener('input', () => syncMentionBackdrop(textareaEl, backdropEl));

        // ──────────────────────────────────────────────────────────────
        // LOCATION DETECTION
        // ──────────────────────────────────────────────────────────────
        function detectLocation() {
            const status = document.getElementById('locationStatus');
            if (!navigator.geolocation) {
                status.textContent = 'Geolocation not supported';
                status.style.color = 'var(--danger)';
                return;
            }
            status.textContent = 'Detecting location...';
            status.style.color = 'var(--muted)';

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    marketLat = lat;
                    marketLng = lng;
                    document.getElementById('itemLat').value = lat;
                    document.getElementById('itemLng').value = lng;

                    try {
                        const res = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`, {
                                headers: { 'Accept-Language': 'en' }
                            }
                        );
                        const data = await res.json();
                        if (data && data.display_name) {
                            const address = data.address || {};
                            const city = address.city || address.town || address.village || '';
                            const state = address.state || '';
                            const placeName = [city, state].filter(Boolean).join(', ') || data.display_name;
                            document.getElementById('itemLocation').value = placeName;
                            status.textContent = '📍 ' + placeName;
                            status.style.color = 'var(--ok)';
                        } else {
                            document.getElementById('itemLocation').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                            status.textContent = 'Location detected (coordinates)';
                            status.style.color = 'var(--ok)';
                        }
                    } catch (e) {
                        document.getElementById('itemLocation').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                        status.textContent = 'Location detected (coordinates)';
                        status.style.color = 'var(--ok)';
                    }
                },
                (error) => {
                    status.textContent = 'Could not detect location. Enter manually.';
                    status.style.color = 'var(--danger)';
                    marketLat = null;
                    marketLng = null;
                }, { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ──────────────────────────────────────────────────────────────
        // CLOUDINARY UPLOAD – using separate presets for each type
        // ──────────────────────────────────────────────────────────────
        function uploadToCloudinary(file, mode = 'post', onProgress) {
            return new Promise((resolve, reject) => {
                const isVideo = file.type.startsWith('video');
                const resourceType = isVideo ? 'video' : 'image';

                let preset;
                if (mode === 'market') {
                    preset = CLOUDINARY_MARKET_UPLOAD_PRESET;
                } else if (isVideo) {
                    preset = CLOUDINARY_VIDEO_UPLOAD_PRESET;
                } else {
                    preset = CLOUDINARY_IMAGE_UPLOAD_PRESET;
                }

                const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', preset);

                console.log(`[Upload] → URL: ${url}, preset: ${preset}, resource: ${resourceType}, file size: ${(file.size/1024/1024).toFixed(1)}MB`);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', url);
                xhr.timeout = 300000;

                if (onProgress) {
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percent = Math.round((e.loaded / e.total) * 100);
                            onProgress(percent);
                        }
                    });
                }

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            console.log('[Upload] ✅ Success:', data.secure_url);
                            resolve({
                                url: data.secure_url,
                                type: resourceType,
                                public_id: data.public_id
                            });
                        } catch (e) {
                            reject(new Error('Invalid response from Cloudinary'));
                        }
                    } else {
                        let errMsg = `Upload failed (HTTP ${xhr.status})`;
                        try {
                            const data = JSON.parse(xhr.responseText);
                            errMsg = data.error?.message || errMsg;
                            console.error('[Upload] ❌ Cloudinary error:', data.error);
                        } catch (e) {}
                        reject(new Error(errMsg));
                    }
                };

                xhr.onerror = () => reject(new Error('Network error – check your connection'));
                xhr.ontimeout = () => reject(new Error('Upload timed out – the file may be too large or your connection is slow'));

                xhr.send(formData);
            });
        }

        async function getVideoDuration(file) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.src = URL.createObjectURL(file);
                video.onloadedmetadata = () => {
                    URL.revokeObjectURL(video.src);
                    resolve(video.duration);
                };
                video.onerror = () => resolve(0);
            });
        }

        // ──────────────────────────────────────────────────────────────
        // IMAGE EMBEDDING — compute from uploaded image files
        // ──────────────────────────────────────────────────────────────
        async function computeImageEmbedding(file) {
            if (!window.ImageEmbedding || typeof window.ImageEmbedding.getEmbeddingFromFile !== 'function') {
                console.warn('[Embedding] ImageEmbedding not available');
                return null;
            }
            try {
                console.log('[Embedding] Computing embedding for', file.name);
                const embedding = await window.ImageEmbedding.getEmbeddingFromFile(file);
                console.log('[Embedding] Done (length:', embedding ? embedding.length : 0, ')');
                return embedding;
            } catch (err) {
                console.warn('[Embedding] Failed for', file.name, ':', err);
                return null;
            }
        }

        // ──────────────────────────────────────────────────────────────
        // handlePostUpload – with per-image embedding (non-blocking)
        // ──────────────────────────────────────────────────────────────
        async function handlePostUpload(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;

            const hasVideo = files.some(f => f.type.startsWith('video'));
            const hasMultiple = files.length > 1;

            if (hasVideo) {
                if (postMedia.length > 0) {
                    showToast('Remove existing media before adding a video', 'o');
                    event.target.value = '';
                    return;
                }
                if (hasMultiple) {
                    showToast('Only one video allowed per post', 'o');
                    event.target.value = '';
                    return;
                }
            } else {
                if (postMedia.some(m => m.type === 'video')) {
                    showToast('Remove the video before adding images', 'o');
                    event.target.value = '';
                    return;
                }
            }

            if (Date.now() - lastUploadTime < 8000) {
                showToast('Please wait before uploading again', 'o');
                event.target.value = '';
                return;
            }
            lastUploadTime = Date.now();

            const remaining = hasVideo ? 1 : (MAX_POST_IMAGES - postMedia.length);
            if (remaining <= 0) {
                showToast(`Max ${MAX_POST_IMAGES} images`, 'o');
                event.target.value = '';
                return;
            }
            const toUpload = files.slice(0, remaining);

            const progress = document.getElementById('postProgress');
            const bar = document.getElementById('postProgressBar');

            for (const file of toUpload) {
                const isVideo = file.type.startsWith('video');
                const isImage = file.type.startsWith('image');
                if (!isImage && !isVideo) {
                    showToast('Only images or videos allowed', 'o');
                    continue;
                }
                if (isImage && file.size > MAX_FILE_SIZE) {
                    showToast(`${file.name} too large (max 5MB)`, 'o');
                    continue;
                }
                if (isVideo && file.size > MAX_VIDEO_SIZE) {
                    showToast('Video too large (max 100MB)', 'o');
                    continue;
                }
                if (isVideo) {
                    const duration = await getVideoDuration(file);
                    if (duration > MAX_VIDEO_DURATION_SECONDS) {
                        showToast(`Video must be ${MAX_VIDEO_DURATION_SECONDS/60} mins or less`, 'o');
                        continue;
                    }
                }

                const localUrl = URL.createObjectURL(file);
                const idx = postMedia.length;
                postMedia.push({
                    url: localUrl,
                    type: isVideo ? 'video' : 'image',
                    public_id: '',
                    uploading: true
                });
                postImageEmbeddings.push(null);
                renderPostImageGrid();

                progress.style.display = 'block';
                bar.style.width = '0%';

                try {
                    const result = await uploadToCloudinary(file, 'post', (percent) => {
                        bar.style.width = percent + '%';
                    });
                    URL.revokeObjectURL(localUrl);
                    postMedia[idx] = {
                        url: result.url,
                        type: result.type,
                        public_id: result.public_id,
                        uploading: false
                    };
                    renderPostImageGrid();
                    showToast('Uploaded!', 'g');

                    if (isImage) {
                        computeImageEmbedding(file).then(embedding => {
                            postImageEmbeddings[idx] = embedding;
                            console.log(`[Embedding] Slot ${idx} done:`, embedding ? '✅' : '❌ (skipped)');
                        });
                    }
                } catch (e) {
                    URL.revokeObjectURL(localUrl);
                    postMedia.splice(idx, 1);
                    postImageEmbeddings.splice(idx, 1);
                    renderPostImageGrid();
                    showToast('Upload failed: ' + e.message, 'r');
                    console.error('[Upload Error]', e);
                }
            }

            progress.style.display = 'none';
            event.target.value = '';
        }

        // Override closeFullscreen to handle both market and post
        const originalCloseFullscreen = closeFullscreen;
        closeFullscreen = function() {
            const viewer = document.getElementById('fullscreenViewer');
            viewer.classList.remove('open');
            document.body.style.overflow = '';
            viewer.style.opacity = '';
            document.getElementById('fullscreenImage').style.transform = '';
            document.getElementById('fullscreenImage').src = '';
            if (viewer._touchStart) viewer.removeEventListener('touchstart', viewer._touchStart);
            if (viewer._touchMove) viewer.removeEventListener('touchmove', viewer._touchMove);
            if (viewer._touchEnd) viewer.removeEventListener('touchend', viewer._touchEnd);
            if (viewer._keyHandler) document.removeEventListener('keydown', viewer._keyHandler);
            viewer._fullscreenData = null;
        };
        document.addEventListener('keydown', function(e) {
            const viewer = document.getElementById('fullscreenViewer');
            if (!viewer.classList.contains('open')) return;
            const data = viewer._fullscreenData;
            if (!data) return;
            if (e.key === 'Escape') closeFullscreen();
            if (e.key === 'ArrowLeft' && data.current > 0) {
                data.current--;
                document.getElementById('fullscreenImage').src = data.images[data.current];
                document.getElementById('viewerCounter').textContent = `${data.current + 1} / ${data.images.length}`;
            }
            if (e.key === 'ArrowRight' && data.current < data.images.length - 1) {
                data.current++;
                document.getElementById('fullscreenImage').src = data.images[data.current];
                document.getElementById('viewerCounter').textContent = `${data.current + 1} / ${data.images.length}`;
            }
        });
