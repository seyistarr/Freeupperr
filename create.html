<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Create · Freeupper</title>
    <link rel="icon" type="image/png" href="freeupper.png" />
    <link rel="stylesheet" href="global.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.6.1/video.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js">
    </script>

    <style>
        /* ══════════════════════════════════════════
           RESET & THEME TOKENS
        ══════════════════════════════════════════ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }
        svg {
            overflow: visible;
        }

        :root {
            --p: #8b5cf6;
            --pd: #6c3fc5;
            --pl: #a78bfa;
            --pdim: rgba(139, 92, 246, .15);
            --pbrd: rgba(139, 92, 246, .28);
            --pglow: rgba(108, 63, 197, .45);
            --danger: #f87171;
            --warn: #fb923c;
            --ok: #4ade80;
            --blue: #60a5fa;
        }

        [data-theme="dark"] {
            --bg: #000;
            --bg2: #0a0a0a;
            --bg3: #111;
            --bg4: #1a1a1a;
            --bg5: #222;
            --brd: rgba(255, 255, 255, .07);
            --brd2: rgba(255, 255, 255, .12);
            --text: #fff;
            --muted: rgba(255, 255, 255, .4);
            --muted2: rgba(255, 255, 255, .22);
            --inp: rgba(255, 255, 255, .05);
            --rowh: rgba(255, 255, 255, .04);
            --navbg: rgba(0, 0, 0, .97);
            --sidebg: #0a0a0a;
            --dotbg: rgba(255, 255, 255, .07);
            --dotc: #fff;
            --cardsh: 0 2px 16px rgba(0, 0, 0, .5);
        }

        [data-theme="light"] {
            --bg: #f2f2f7;
            --bg2: #fff;
            --bg3: #fff;
            --bg4: #e8e8ed;
            --bg5: #d8d8de;
            --brd: rgba(0, 0, 0, .08);
            --brd2: rgba(0, 0, 0, .13);
            --text: #0d0d0d;
            --muted: rgba(0, 0, 0, .44);
            --muted2: rgba(0, 0, 0, .26);
            --inp: rgba(0, 0, 0, .05);
            --rowh: rgba(0, 0, 0, .04);
            --navbg: rgba(242, 242, 247, .97);
            --sidebg: #fff;
            --dotbg: rgba(0, 0, 0, .07);
            --dotc: #0d0d0d;
            --cardsh: 0 2px 16px rgba(0, 0, 0, .1);
        }

        html,
        body {
            height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background .3s, color .3s;
            overflow: hidden;
        }

        .layout {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* ─── Side Nav ─── */
        .side-nav {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 28px 0 24px;
            background: var(--sidebg);
            border-right: 1px solid var(--brd);
            width: 70px;
            flex-shrink: 0;
            gap: 2px;
            z-index: 10;
            transition: background .3s, border-color .3s;
        }
        .side-logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--p);
            margin-bottom: 20px;
            letter-spacing: -1px;
            cursor: pointer;
        }
        .side-logo a {
            color: inherit;
            text-decoration: none;
        }
        .side-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s, transform .1s;
            background: none;
            border: none;
            position: relative;
            gap: 3px;
            color: inherit;
            text-decoration: none;
        }
        .side-btn:hover {
            background: var(--pdim);
            transform: scale(1.04);
        }
        .side-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .side-btn span {
            font-size: 8px;
            color: var(--muted2);
            font-weight: 600;
        }
        .side-btn.active svg {
            stroke: var(--p);
        }
        .side-btn.active span {
            color: var(--p);
        }
        .side-btn .side-badge {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--p);
            border: 1.5px solid var(--sidebg);
        }
        .side-gap {
            flex: 1;
        }
        .side-av {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .side-btn.active .side-av {
            border-color: var(--p);
        }

        /* ─── Main ─── */
        .main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--bg);
            scroll-behavior: smooth;
            transition: background .3s;
            padding-bottom: 80px;
        }
        .main::-webkit-scrollbar {
            width: 0;
        }
        .create-col {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* ─── Topbar ─── */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(44px, 8vw, 56px) 0 10px;
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--bg);
            transition: background .3s;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-title {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 800;
            letter-spacing: -.3px;
        }

        /* ─── Tabs ─── */
        .create-tabs {
            display: flex;
            border-bottom: 1px solid var(--brd);
            margin-bottom: 20px;
            gap: 4px;
            background: var(--bg);
            transition: background .3s, border-color .3s;
        }
        .create-tab {
            flex: 1;
            padding: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            transition: all .15s;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }
        .create-tab svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--muted2);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .create-tab.active {
            border-bottom-color: var(--p);
            color: var(--p);
        }
        .create-tab.active svg {
            stroke: var(--p);
        }
        .create-tab:hover {
            color: var(--text);
            background: var(--rowh);
        }

        .panel {
            display: none;
            animation: fadeUp .3s ease both;
        }
        .panel.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ─── Form Elements ─── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        .form-lbl {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .07em;
        }
        .form-inp {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color .15s, background .3s, color .3s;
            font-family: inherit;
        }
        .form-inp:focus {
            border-color: var(--p);
        }
        .form-inp::placeholder {
            color: var(--muted2);
        }
        .form-inp:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        textarea.form-inp {
            resize: vertical;
            min-height: 100px;
            line-height: 1.6;
        }

        .char-c {
            font-size: 11px;
            color: var(--muted2);
            text-align: right;
        }
        .char-c.warn {
            color: var(--warn);
        }
        .char-c.err {
            color: var(--danger);
        }

        /* Tags */
        .tag-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px 5px 14px;
            border-radius: 100px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-size: 12px;
            font-weight: 700;
        }
        .tag-pill button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--pl);
            font-size: 14px;
            line-height: 1;
            padding: 0;
        }
        .tag-pill button:hover {
            color: var(--danger);
        }

        .tag-input-row {
            display: flex;
            gap: 8px;
        }
        .tag-input-row .form-inp {
            flex: 1;
        }
        .tag-input-row button {
            padding: 10px 18px;
            border-radius: 12px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
            white-space: nowrap;
        }
        .tag-input-row button:hover {
            background: rgba(139, 92, 246, .25);
        }

        /* Primary Button */
        .btn-primary {
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--p), var(--pd));
            color: #fff !important;
            font-size: 15px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: opacity .15s, transform .15s;
            box-shadow: 0 4px 20px var(--pglow);
        }
        .btn-primary:hover {
            opacity: .9;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: .35;
            cursor: default;
            transform: none;
        }

        /* Category Selector */
        .category-selector {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color .15s;
        }
        .category-selector:hover {
            border-color: var(--pbrd);
        }
        .category-selector .placeholder {
            color: var(--muted2);
        }
        .category-selector svg {
            width: 16px;
            height: 16px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ─── Modal ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-sheet {
            width: 100%;
            max-width: 560px;
            max-height: 80vh;
            background: var(--bg3);
            border-radius: 24px 24px 0 0;
            border-top: 1px solid var(--brd2);
            transform: translateY(60px);
            transition: transform .34s cubic-bezier(.32, 1, .64, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-overlay.open .modal-sheet {
            transform: translateY(0);
        }
        .modal-handle {
            width: 40px;
            height: 4px;
            border-radius: 100px;
            background: var(--brd2);
            margin: 14px auto 0;
            flex-shrink: 0;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 12px;
            border-bottom: 1px solid var(--brd);
            flex-shrink: 0;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 800;
        }
        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--inp);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }
        .modal-close:hover {
            background: var(--pdim);
        }
        .modal-close svg {
            width: 15px;
            height: 15px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
        }
        .modal-body {
            overflow-y: auto;
            padding: 12px 16px 24px;
            flex: 1;
        }
        .modal-body::-webkit-scrollbar {
            width: 0;
        }
        .modal-category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .modal-category-item {
            padding: 12px;
            border-radius: 12px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            text-align: center;
            cursor: pointer;
            transition: all .15s;
            font-weight: 600;
            color: var(--muted);
            font-size: 13px;
        }
        .modal-category-item:hover {
            border-color: var(--pbrd);
            background: var(--pdim);
            color: var(--pl);
        }
        .modal-category-item.active {
            border-color: var(--p);
            background: var(--pdim);
            color: var(--pl);
        }

        /* ─── Upload Row ─── */
        .upload-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .upload-row .form-inp {
            flex: 1;
        }
        .upload-row .upload-btn {
            padding: 10px 16px;
            border-radius: 12px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
            white-space: nowrap;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .upload-row .upload-btn:hover {
            background: rgba(139, 92, 246, .25);
        }
        .upload-row .upload-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .upload-progress {
            height: 3px;
            background: var(--brd);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        .upload-progress-bar {
            height: 100%;
            background: var(--p);
            width: 0%;
            transition: width .3s;
            border-radius: 2px;
        }

        /* ─── Media Grid ─── */
        .media-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .media-scroll::-webkit-scrollbar {
            display: none;
        }
        .media-thumb {
            position: relative;
            flex: 0 0 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg4);
            border: 2px solid var(--brd);
            cursor: pointer;
            transition: transform .15s;
        }
        .media-thumb:hover {
            transform: scale(1.05);
        }
        .media-thumb img,
        .media-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .media-thumb .remove-btn {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .7);
            border: none;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }
        .media-thumb .remove-btn:hover {
            background: rgba(220, 38, 38, .8);
        }
        .media-thumb .badge {
            position: absolute;
            bottom: 3px;
            left: 3px;
            background: rgba(0, 0, 0, .6);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 3px;
        }
        .media-thumb .duration-badge {
            position: absolute;
            bottom: 3px;
            right: 3px;
            background: rgba(0, 0, 0, .7);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
        }
        .media-thumb .uploading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .media-thumb .uploading-overlay .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, .2);
            border-top-color: var(--p);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .media-add-btn {
            flex: 0 0 80px;
            height: 80px;
            border-radius: 12px;
            border: 2px dashed var(--brd2);
            background: var(--inp);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .15s;
            color: var(--muted2);
            font-size: 10px;
            font-weight: 600;
            gap: 2px;
        }
        .media-add-btn:hover {
            border-color: var(--pbrd);
            color: var(--pl);
            background: var(--pdim);
        }
        .media-add-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* ─── Fullscreen Viewer ─── */
        .fullscreen-viewer {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, .95);
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .fullscreen-viewer.open {
            opacity: 1;
            pointer-events: auto;
        }
        .fullscreen-viewer .viewer-header {
            display: flex;
            justify-content: flex-end;
            padding: 16px 20px;
            flex-shrink: 0;
            z-index: 2;
        }
        .fullscreen-viewer .viewer-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .2);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }
        .fullscreen-viewer .viewer-close:hover {
            background: rgba(255, 255, 255, .2);
        }
        .fullscreen-viewer .viewer-close svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
        }
        .fullscreen-viewer .viewer-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px 40px;
            overflow: hidden;
        }
        .fullscreen-viewer .viewer-body img,
        .fullscreen-viewer .viewer-body video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            user-select: none;
            -webkit-user-drag: none;
        }
        .fullscreen-viewer .viewer-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .6);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
        }

        /* ─── Price ─── */
        .price-wrap {
            position: relative;
        }
        .price-wrap .currency {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: var(--muted);
        }
        .price-wrap .form-inp {
            padding-left: 32px;
        }

        /* ─── Condition ─── */
        .condition-row {
            display: flex;
            gap: 8px;
        }
        .condition-opt {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            text-align: center;
            cursor: pointer;
            transition: all .15s;
            font-weight: 600;
            color: var(--muted);
            font-size: 13px;
        }
        .condition-opt:hover {
            border-color: var(--pbrd);
            background: var(--pdim);
            color: var(--pl);
        }
        .condition-opt.active {
            border-color: var(--p);
            background: var(--pdim);
            color: var(--pl);
        }

        /* ─── Location ─── */
        .location-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .location-row .form-inp {
            flex: 1;
        }
        .location-btn {
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .location-btn:hover {
            background: rgba(139, 92, 246, .25);
        }
        .location-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .location-status {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* ─── Bottom Nav ─── */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--navbg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-top: 1px solid var(--brd);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0 max(env(safe-area-inset-bottom), 16px);
            z-index: 50;
            transition: background .3s, border-color .3s;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px clamp(8px, 3vw, 14px);
            border-radius: 14px;
            transition: background .15s;
            position: relative;
            background: none;
            border: none;
            text-decoration: none;
            color: inherit;
        }
        .nav-item:hover {
            background: var(--pdim);
        }
        .nav-item svg {
            width: clamp(20px, 5vw, 24px);
            height: clamp(20px, 5vw, 24px);
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .nav-item span {
            font-size: clamp(9px, 2vw, 10px);
            color: var(--muted);
            font-weight: 600;
            letter-spacing: .03em;
        }
        .nav-item.active svg {
            stroke: var(--p);
        }
        .nav-item.active span {
            color: var(--p);
        }
        .nav-av {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .nav-item.active .nav-av {
            border-color: var(--p);
        }
        .nav-badge {
            position: absolute;
            top: 3px;
            right: clamp(4px, 2vw, 6px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--p);
            border: 1.5px solid var(--bg);
        }

        /* ─── Toast ─── */
        #tw {
            position: fixed;
            top: clamp(14px, 4vw, 22px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: calc(100vw - 32px);
        }
        .toast {
            background: var(--bg3);
            border: 1px solid var(--brd2);
            border-radius: 100px;
            padding: 11px 18px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .55);
            animation: tIn .3s cubic-bezier(.34, 1.2, .64, 1) both;
            white-space: nowrap;
        }
        .toast.out {
            animation: tOut .25s ease forwards;
        }
        @keyframes tIn {
            from {
                transform: translateY(-14px);
                opacity: 0;
            }
            to {
                transform: none;
                opacity: 1;
            }
        }
        @keyframes tOut {
            to {
                transform: translateY(-10px);
                opacity: 0;
            }
        }
        .td {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .tg {
            background: var(--ok);
        }
        .tp {
            background: var(--p);
        }
        .tr {
            background: var(--danger);
        }
        .to {
            background: var(--warn);
        }

        /* ─── Responsive ─── */
        @media (min-width: 768px) {
            .side-nav {
                display: flex;
            }
            .bottom-nav {
                display: none;
            }
            .main {
                padding-bottom: 24px;
            }
        }
        @media (min-width: 1024px) {
            .side-nav {
                width: 82px;
            }
            .create-col {
                max-width: 640px;
            }
        }
        .main::-webkit-scrollbar,
        .side-nav::-webkit-scrollbar {
            width: 0;
        }

        .text-muted {
            color: var(--muted);
        }
        .text-xs {
            font-size: 11px;
        }
    </style>
</head>

    <script>
        // ═══════════════════════════════════════════════════
        //  CONFIG
        // ═══════════════════════════════════════════════════
        const STORAGE_KEY = 'freeupper_blog_data_v2';
        const USER_KEY = 'freeupper_user_profile';
        const ALL_USERS_KEY = 'freeupper_all_users';

        // Cloudinary config – rotate presets and switch to signed uploads in production
        const CLOUDINARY_CLOUD_NAME = 'duzyf1kda';
        const CLOUDINARY_UPLOAD_PRESET = 'unsigned_demo'; // Replace with your own

        const PREDEFINED_CATEGORIES = [
            "Technology", "Education", "Campus gist", "News & Updates",
            "Entertainment", "Movies", "Lifestyle", "Business & Finance",
            "Opinion / Thoughts", "Health & Fitness", "Travel & Culture", "Gaming",
            "Memes", "Science", "Fashion", "Music"
        ];

        const MARKET_CATEGORIES = [
            "Home & Garden", "Entertainment", "Clothing & Accessories",
            "Family", "Health & Beauty", "Electronics", "Hobbies",
            "Classified", "Vehicle", "Home for Sales", "Service",
            "Tools", "Furniture", "Garden Appliance", "Household",
            "Books, Movies & Music", "Video Games", "Jewelry & Accessories",
            "Bags & Luggage", "Men's Clothing & Shoes", "Women's Clothing & Shoes",
            "Toys & Games", "Baby & Kids", "Pet Supplies", "Mobile Phones",
            "Electronics & Computers", "Sports", "Musical Instruments",
            "Arts & Crafts", "Antiques & Collectibles", "Auto Parts",
            "Bicycles", "Garage Sale", "Miscellaneous", "Cars & Trucks",
            "Motorcycles", "Powersports", "RVs & Campers", "Boats",
            "Commercial & Industrial", "Trailers", "Other", "Home sales",
            "Rental", "Repairs", "Maintenance", "Others"
        ];

        // ─── Limits ───
        const MAX_FILE_SIZE = 5 * 1024 * 1024;          // 5 MB for images
        const MAX_VIDEO_SIZE = 100 * 1024 * 1024;       // 100 MB for videos
        const MAX_POST_MEDIA = 5;                       // total media (images + videos) per post
        const MAX_MARKET_IMAGES = 5;
        const MAX_VIDEO_DURATION = 120;                 // 2 minutes

        // ─── State ───
        let postTags = [];
        let postMediaItems = [];
        let marketImages = [];
        let marketLat = null;
        let marketLng = null;
        let selectedPostCategory = '';
        let selectedMarketCategory = '';
        let selectedCondition = 'New';
        let lastUploadTime = 0;
        let categoryModalMode = 'post';
        let fullscreenItems = [];
        let fullscreenIndex = 0;

        // ═══════════════════════════════════════════════════
        //  DATA LAYER
        // ═══════════════════════════════════════════════════
        function getDefaultData() {
            return { posts: [], nextId: 1, nextCommentId: 1, userReactions: {}, notificationLastId: 0, notifications: [],
                marketItems: [], nextMarketId: 1, views: {}, watchTime: {}, verificationRequests: [] };
        }

        function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            const data = raw ? JSON.parse(raw) : getDefaultData();
            if (!data.marketItems) data.marketItems = [];
            if (!data.nextMarketId) data.nextMarketId = 1;
            if (!data.notifications) data.notifications = [];
            if (!data.notificationLastId) data.notificationLastId = 0;
            return data;
        }

        let appData = loadData();

        function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }

        function getCurrentUser() {
            let user = JSON.parse(localStorage.getItem(USER_KEY));
            if (!user) {
                user = {
                    id: 'FU-' + Math.random().toString(36).substr(2, 9).toUpperCase(),
                    username: '',
                    displayName: 'Guest',
                    bio: '',
                    website: '',
                    avatar: 'data:image/svg+xml,' + encodeURIComponent(
                        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#E5E7EB"/><circle cx="50" cy="38" r="16" fill="#9CA3AF"/><ellipse cx="50" cy="75" rx="30" ry="22" fill="#9CA3AF"/></svg>'
                    ),
                    createdAt: Date.now(),
                    isLoggedIn: false,
                    verified: false,
                    verificationStatus: 'none'
                };
                localStorage.setItem(USER_KEY, JSON.stringify(user));
            }
            return user;
        }

        // ═══════════════════════════════════════════════════
        //  TOAST
        // ═══════════════════════════════════════════════════
        function showToast(msg, type) {
            type = type || 'p';
            const w = document.getElementById('tw');
            const el = document.createElement('div');
            el.className = 'toast';
            el.innerHTML = '<div class="td t' + type + '"></div>' + msg;
            w.appendChild(el);
            setTimeout(function() {
                el.classList.add('out');
                setTimeout(function() { el.remove(); }, 260);
            }, 2600);
        }

        // ═══════════════════════════════════════════════════
        //  HELPERS
        // ═══════════════════════════════════════════════════
        function formatDuration(seconds) {
            if (!seconds || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + String(s).padStart(2, '0');
        }

        function getOptimizedUrl(url, width, quality) {
            if (!url) return url;
            if (url.includes('cloudinary.com')) {
                const w = width || 800;
                const q = quality || 'auto';
                return url.replace('/upload/', `/upload/f_auto,q_${q},w_${w}/`);
            }
            return url;
        }

        function getVideoThumb(publicId) {
            if (!publicId) return '';
            return `https://res.cloudinary.com/${CLOUDINARY_CLOUD_NAME}/video/upload/f_auto,q_auto,w_400/${publicId}.jpg`;
        }

        // ═══════════════════════════════════════════════════
        //  🔐 CLOUDINARY UPLOAD (signed-ready)
        // ═══════════════════════════════════════════════════
        async function uploadToCloudinary(file, mode = 'post') {
            const isVideo = file.type.startsWith('video');
            const resourceType = isVideo ? 'video' : 'image';

            // ─── Option A: Signed upload via backend (recommended) ───
            // Uncomment and implement your signing endpoint
            /*
            const sigRes = await fetch('/api/cloudinary-sign', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ resourceType, mode, filename: file.name })
            });
            const { signature, timestamp, api_key, public_id, folder } = await sigRes.json();

            const formData = new FormData();
            formData.append('file', file);
            formData.append('api_key', api_key);
            formData.append('timestamp', timestamp);
            formData.append('signature', signature);
            formData.append('public_id', public_id);
            formData.append('folder', folder);
            const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
            const res = await fetch(url, { method: 'POST', body: formData });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || 'Upload failed');
            */

            // ─── Option B: Unsigned preset (DEV only – rotate presets!) ───
            const preset = mode === 'market' ? 'market_upload' :
                isVideo ? 'video_upload' : 'image_upload';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', preset);
            if (mode === 'post') {
                formData.append('moderation', 'cloudinary'); // optional auto-moderation
            }

            const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
            const res = await fetch(url, { method: 'POST', body: formData });
            const data = await res.json();
            if (!res.ok || data.error) {
                throw new Error(data.error?.message || 'Upload failed');
            }

            return {
                url: data.secure_url,
                public_id: data.public_id,
                resource_type: data.resource_type || resourceType,
                width: data.width || 0,
                height: data.height || 0,
                format: data.format || '',
                bytes: data.bytes || 0,
                duration: data.duration || 0,
                created_at: data.created_at || new Date().toISOString(),
                version: data.version || 0,
                moderation: data.moderation || null
            };
        }

        async function getVideoDuration(file) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.src = URL.createObjectURL(file);
                video.onloadedmetadata = () => {
                    URL.revokeObjectURL(video.src);
                    resolve(video.duration);
                };
                video.onerror = () => resolve(0);
            });
        }

        async function compressImage(file) {
            try {
                const options = { maxSizeMB: 1, maxWidthOrHeight: 1920, useWebWorker: true, fileType: 'image/jpeg' };
                return await imageCompression(file, options);
            } catch (e) {
                console.warn('Compression failed, using original:', e);
                return file;
            }
        }

        function detectLocation() {
            const status = document.getElementById('locationStatus');
            if (!navigator.geolocation) {
                status.textContent = 'Geolocation not supported';
                status.style.color = 'var(--danger)';
                return;
            }
            status.textContent = 'Detecting location...';
            status.style.color = 'var(--muted)';
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    marketLat = lat;
                    marketLng = lng;
                    document.getElementById('itemLat').value = lat;
                    document.getElementById('itemLng').value = lng;
                    try {
                        const res = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`, {
                                headers: { 'Accept-Language': 'en' }
                            }
                        );
                        const data = await res.json();
                        if (data && data.display_name) {
                            const address = data.address || {};
                            const city = address.city || address.town || address.village || '';
                            const state = address.state || '';
                            const placeName = [city, state].filter(Boolean).join(', ') || data.display_name;
                            document.getElementById('itemLocation').value = placeName;
                            status.textContent = '📍 ' + placeName;
                            status.style.color = 'var(--ok)';
                        } else {
                            document.getElementById('itemLocation').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                            status.textContent = 'Location detected (coordinates)';
                            status.style.color = 'var(--ok)';
                        }
                    } catch (e) {
                        document.getElementById('itemLocation').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                        status.textContent = 'Location detected (coordinates)';
                        status.style.color = 'var(--ok)';
                    }
                },
                (error) => {
                    status.textContent = 'Could not detect location. Enter manually.';
                    status.style.color = 'var(--danger)';
                    marketLat = null;
                    marketLng = null;
                }, { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function previewPostMediaUrl() {
            const input = document.getElementById('postMediaUrlInput');

            if (postMediaItems.length >= MAX_POST_MEDIA) { showToast('Max ' + MAX_POST_MEDIA + ' media items', 'o');
                input.value = ''; return; }

            const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
            const isImage = /\.(jpg|jpeg|png|gif|webp)/i.test(url) || url.includes('cloudinary.com') || url.includes(
            'imgur.com');

            if (ytMatch) {
                const vid = ytMatch[1];
                postMediaItems.push({
                    url: `https://www.youtube.com/embed/${vid}`,
                    public_id: 'youtube_' + vid,
                    type: 'video',
                    width: 640,
                    height: 360,
                    format: 'youtube',
                    bytes: 0,
                    duration: 0,
                    isUploaded: true,
                    uploading: false,
                    isYoutube: true
                });

                input.placeholder = 'Paste image or YouTube link...';
                renderPostMedia();
                showToast('YouTube video linked', 'p');
            } else if (isImage) {
                postMediaItems.push({
                    url: url,
                    public_id: 'external_' + Date.now(),
                    type: 'image',
                    width: 0,
                    height: 0,
                    format: 'external',
                    bytes: 0,
                    duration: 0,
                    isUploaded: true,
                    uploading: false,
                    isExternal: true
                });
                input.value = '';
                input.placeholder = 'Paste image or YouTube link...';
                renderPostMedia();
                showToast('Image linked', 'p');
            } else {
                showToast('Please enter a valid image or YouTube URL', 'o');
            }
        }

        async function handlePostUpload(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;

            const remaining = MAX_POST_MEDIA - postMediaItems.length;
            if (remaining <= 0) { showToast('Max ' + MAX_POST_MEDIA + ' media items', 'o');
                event.target.value = ''; return; }

            const progress = document.getElementById('postProgress');
            const bar = document.getElementById('postProgressBar');

            const toUpload = files.slice(0, remaining);
            for (const file of toUpload) {
                const isVideo = file.type.startsWith('video');
                const isImage = file.type.startsWith('image');

                if (!isImage && !isVideo) { showToast('Only images or videos allowed', 'o'); continue; }
                if (isImage && file.size > MAX_FILE_SIZE) { showToast('Image too large (max 5MB)', 'o'); continue; }
                if (isVideo && file.size > MAX_VIDEO_SIZE) { showToast('Video too large (max 100MB)', 'o'); continue; }

                let duration = 0;
                if (isVideo) {
                    duration = await getVideoDuration(file);
                    if (duration > MAX_VIDEO_DURATION) {
                        showToast(`Video must be ${MAX_VIDEO_DURATION} seconds or less`, 'o');
                        continue;
                    }
                }

                let fileToUpload = file;
                if (isImage) {
                    try { fileToUpload = await compressImage(file); } catch (e) { console.warn('Compression skipped'); }
                }

                if (Date.now() - lastUploadTime < 6000) { showToast('Please wait before uploading again', 'o');
                    continue; }
                lastUploadTime = Date.now();

                const idx = postMediaItems.length;
                postMediaItems.push({
                    url: URL.createObjectURL(file),
                    public_id: '',
                    type: isVideo ? 'video' : 'image',
                    width: 0,
                    height: 0,
                    format: '',
                    bytes: 0,
                    duration: duration,
                    isUploaded: false,
                    uploading: true
                });
                renderPostMedia();

                progress.style.display = 'block';
                bar.style.width = '0%';
                let interval = setInterval(() => {
                    if (parseFloat(bar.style.width) < 85) {
                        bar.style.width = (parseFloat(bar.style.width) + 8) + '%';
                    }
                }, 400);

                try {
                    const result = await uploadToCloudinary(fileToUpload, 'post');
                    clearInterval(interval);
                    bar.style.width = '100%';

                    postMediaItems[idx] = {
                        url: result.url,
                        public_id: result.public_id,
                        type: result.resource_type,
                        width: result.width,
                        height: result.height,
                        format: result.format,
                        bytes: result.bytes,
                        duration: result.duration || duration,
                        isUploaded: true,
                        uploading: false,
                        moderation: result.moderation
                    };
                    renderPostMedia();
                    setTimeout(() => { progress.style.display = 'none'; }, 500);
                    showToast(isVideo ? 'Video uploaded!' : 'Image uploaded!', 'g');
                } catch (e) {
                    clearInterval(interval);
                    progress.style.display = 'none';
                    postMediaItems.splice(idx, 1);
                    renderPostMedia();
                    showToast('Upload failed: ' + e.message, 'r');
                }
            }
            event.target.value = '';
        }

        function removePostMedia(idx) {
            if (postMediaItems[idx]?.url?.startsWith('blob:')) {
                URL.revokeObjectURL(postMediaItems[idx].url);
            }
            postMediaItems.splice(idx, 1);
            renderPostMedia();
        }

        function renderPostMedia() {
            const grid = document.getElementById('postMediaGrid');
            if (!grid) return;

            const thumbHtml = postMediaItems.map((item, i) => {
                const isVideo = item.type === 'video' || item.isYoutube;
                const src = isVideo && !item.isYoutube ? item.url : getOptimizedUrl(item.url, 200);
                const thumb = isVideo && item.public_id && !item.isYoutube ?
                    getVideoThumb(item.public_id) :
                    (isVideo && item.isYoutube ?
                        `https://img.youtube.com/vi/${item.public_id.replace('youtube_', '')}/hqdefault.jpg` :
                        src);

                return `<div class="media-thumb" onclick="openPostFullscreen(${i})">
                            ${isVideo ? `<video src="${src}" style="width:100%;height:100%;object-fit:cover;"></video>` :
                            `<img src="${thumb}" loading="lazy" alt="media" style="width:100%;height:100%;object-fit:cover;" />`}
                            ${item.uploading ? `<div class="uploading-overlay"><div class="spinner"></div></div>` : ''}
                            ${item.duration > 0 ? `<span class="duration-badge">${formatDuration(item.duration)}</span>` : ''}
                            <span class="badge">${isVideo ? 'VIDEO' : 'IMG'}</span>
                            <button class="remove-btn" onclick="event.stopPropagation();removePostMedia(${i})" ${item.uploading ? 'disabled' : ''}>×</button>
                        </div>`;
            }).join('');

            const addBtn = postMediaItems.length < MAX_POST_MEDIA ?
                `<div class="media-add-btn" onclick="document.getElementById('postFileInput').click()">
                            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add
                        </div>` : '';

            grid.innerHTML = thumbHtml + addBtn;
        }

        // ─── Post fullscreen ───
        function openPostFullscreen(index) {
            const uploaded = postMediaItems.filter(i => i.isUploaded);
            if (uploaded.length === 0) return;
            fullscreenItems = uploaded.map(i => ({ url: i.url, type: i.type, public_id: i.public_id }));
            fullscreenIndex = Math.min(index, fullscreenItems.length - 1);
            showFullscreenItem(fullscreenIndex);
        }

        function showFullscreenItem(idx) {
            const viewer = document.getElementById('fullscreenViewer');
            const body = document.getElementById('viewerBody');
            const counter = document.getElementById('viewerCounter');
            const item = fullscreenItems[idx];
            if (!item) return;

            body.innerHTML = '';
            if (item.type === 'video' || item.type === 'video/mp4') {
                const vid = document.createElement('video');
                vid.src = item.url;
                vid.controls = true;
                vid.autoplay = true;
                vid.style.maxWidth = '100%';
                vid.style.maxHeight = '100%';
                vid.style.borderRadius = '8px';
                body.appendChild(vid);
            } else {
                const img = document.createElement('img');
                img.src = getOptimizedUrl(item.url, 1200);
                img.alt = 'Fullscreen';
                img.loading = 'lazy';
                body.appendChild(img);
            }

            counter.textContent = `${idx + 1} / ${fullscreenItems.length}`;
            viewer.classList.add('open');
            document.body.style.overflow = 'hidden';

            document.removeEventListener('keydown', viewer._keyHandler);
            viewer._keyHandler = (e) => {
                if (e.key === 'Escape') closeFullscreen();
                if (e.key === 'ArrowLeft' && fullscreenIndex > 0) { fullscreenIndex--;
                    showFullscreenItem(fullscreenIndex); }
                if (e.key === 'ArrowRight' && fullscreenIndex < fullscreenItems.length - 1) { fullscreenIndex++;
                    showFullscreenItem(fullscreenIndex); }
            };
            document.addEventListener('keydown', viewer._keyHandler);
        }

        function closeFullscreen() {
            const viewer = document.getElementById('fullscreenViewer');
            viewer.classList.remove('open');
            document.body.style.overflow = '';
            document.getElementById('viewerBody').innerHTML = '<img id="fullscreenImage" src="" alt="Fullscreen" />';
            if (viewer._keyHandler) { document.removeEventListener('keydown', viewer._keyHandler);
                viewer._keyHandler = null; }
        }

        // ═══════════════════════════════════════════════════

        function submitPost() {
            const user = getCurrentUser();
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const description = document.getElementById('postDescription').value.trim();
            const category = document.getElementById('postCategory').value;

            if (!title || !content) { showToast('Please fill in both title and content', 'o'); return; }
            if (postTags.length > 3) { showToast('Max 3 tags allowed', 'o'); return; }

            const uploaded = postMediaItems.filter(i => i.isUploaded && !i.uploading);
            const mediaData = uploaded.map(i => ({
                url: i.url,
                public_id: i.public_id || '',
                type: i.type || 'image',
                width: i.width || 0,
                height: i.height || 0,
                format: i.format || '',
                bytes: i.bytes || 0,
                duration: i.duration || 0,
                isYoutube: i.isYoutube || false,
                isExternal: i.isExternal || false,
                moderation: i.moderation || null
            }));

            const newPost = {
                id: appData.nextId++,
                author: user.displayName || 'Guest',
                authorId: user.id,
                authorAvatar: user.avatar,
                authorUsername: user.username || user.displayName || 'guest',
                title: title,
                description: description,
                content: content,
                media: mediaData,
                category: category || 'General',
                tags: [...postTags],
                date: new Date().toISOString().split('T')[0],
                timestamp: new Date().toISOString(),
                views: 0,
                reactions: { love: 0, laugh: 0, cry: 0 },
                comments: []
            };

            appData.posts.unshift(newPost);
            persist();

            // Reset
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postDescription').value = '';
            document.getElementById('postCategory').value = '';
            document.getElementById('postCategoryDisplay').textContent = 'Select a category';
            document.getElementById('postCategoryDisplay').classList.add('placeholder');
            document.getElementById('postMediaUrlInput').value = '';
            document.getElementById('postMediaUrlInput').placeholder = 'Paste image or YouTube link...';
            postMediaItems.forEach(i => { if (i.url.startsWith('blob:')) URL.revokeObjectURL(i.url); });
            postMediaItems = [];
            renderPostMedia();
            postTags = [];
            renderPostTags();
            selectedPostCategory = '';

            showToast('Post published! 🎉', 'g');
        }

        // ═══════════════════════════════════════════════════
        //  SUBMIT ITEM
        // ═══════════════════════════════════════════════════
        function submitItem() {
            const user = getCurrentUser();
            const title = document.getElementById('itemTitle').value.trim();
            const priceInput = document.getElementById('itemPrice');
            const price = priceInput.value.replace(/[^0-9]/g, '').trim();
            const description = document.getElementById('itemDescription').value.trim();
            const category = document.getElementById('itemCategory').value;
            const location = document.getElementById('itemLocation').value.trim();
            const condition = document.getElementById('itemCondition').value;
            const lat = document.getElementById('itemLat').value;
            const lng = document.getElementById('itemLng').value;

            if (!title || !price) { showToast('Item name and price are required', 'o'); return; }
            if (isNaN(Number(price)) || Number(price) <= 0) { showToast('Enter a valid price', 'o'); return; }
            if (marketImages.some(i => i.uploading)) { showToast('Please wait for images to finish uploading', 'o');
                return; }

            const uploaded = marketImages.filter(i => i.isUploaded && !i.uploading);
            const imageData = uploaded.map(i => ({
                url: i.url,
                public_id: i.public_id || '',
                width: i.width || 0,
                height: i.height || 0,
                format: i.format || '',
                bytes: i.bytes || 0
            }));

            const newItem = {
                id: appData.nextMarketId++,
                title: title,
                price: Number(price),
                category: category || 'General',
                location: location || 'Campus',
                lat: lat ? parseFloat(lat) : null,
                lng: lng ? parseFloat(lng) : null,
                images: imageData,
                description: description,
                condition: condition || 'New',
                sellerName: user.displayName || 'Guest',
                sellerId: user.id,
                sellerAvatar: user.avatar,
                date: new Date().toISOString().split('T')[0],
                createdAt: Date.now()
            };

            appData.marketItems.unshift(newItem);
            persist();

            // Reset
            document.getElementById('itemTitle').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemDescription').value = '';
            document.getElementById('itemCategory').value = '';
            document.getElementById('marketCategoryDisplay').textContent = 'Select a category';
            document.getElementById('marketCategoryDisplay').classList.add('placeholder');
            document.getElementById('itemLocation').value = '';
            document.getElementById('itemLat').value = '';
            document.getElementById('itemLng').value = '';
            document.getElementById('locationStatus').textContent = '';
            document.getElementById('marketImageUrlInput').value = '';
            document.getElementById('marketImageUrlInput').placeholder = 'Paste image URL...';
            marketImages.forEach(i => { if (i.url.startsWith('blob:')) URL.revokeObjectURL(i.url); });
            marketImages = [];
            renderMarketImages();
            selectedMarketCategory = '';
            document.querySelectorAll('.condition-opt').forEach(c => c.classList.remove('active'));
            document.querySelector('.condition-opt[data-condition="New"]').classList.add('active');
            selectedCondition = 'New';
            document.getElementById('itemCondition').value = 'New';

            showToast('Item listed! 🛍️', 'g');
        }

        // ═══════════════════════════════════════════════════
        //  UPDATE NAV AVATAR
        // ═══════════════════════════════════════════════════
        function updateNavAvatar() {
            const user = getCurrentUser();
            document.querySelectorAll('.side-av, .nav-av').forEach(el => {
                el.src = user.avatar;
                el.onerror = function() { this.style.display = 'none'; };
            });
        }

        // ═══════════════════════════════════════════════════
        //  CHARACTER COUNTERS
        // ═══════════════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', function() {
            const titleInput = document.getElementById('postTitle');
            const titleCount = document.getElementById('postTitleCount');
            titleInput.addEventListener('input', function() {
                titleCount.textContent = this.value.length + ' / 100';
            });

            const contentInput = document.getElementById('postContent');
            const contentCount = document.getElementById('postContentCount');
            contentInput.addEventListener('input', function() {
                const len = this.value.length;
                contentCount.textContent = len + ' characters';
                contentCount.classList.toggle('warn', len > 1000);
            });
        });

        // ═══════════════════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════════════════
        function init() {
            updateNavAvatar();
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector('.nav-item[href="create.html"]')?.classList.add('active');
            document.querySelectorAll('.side-btn').forEach(el => el.classList.remove('active'));
            document.querySelector('.side-btn[href="create.html"]')?.classList.add('active');

            document.addEventListener('themeChanged', function(e) {
                document.documentElement.setAttribute('data-theme', e.detail.theme);
            });

            console.log('🔐 Cloudinary uploads: using unsigned presets (DEV).');
            console.log('📌 For production: implement signed uploads & rotate presets.');
            console.log('📹 Video limit: 2 min, 100 MB.');
            console.log('🖼️ Max media per post: 5 (images/videos combined).');
        }

        init();
    </script>

</body>
</html>
