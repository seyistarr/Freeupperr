    <style>
        /* ──────────────────────────────────────────────────────────────
           1.  RESET & ROOT VARIABLES
           ────────────────────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        svg {
            overflow: visible;
        }

        :root {
            --p: #8b5cf6;
            --pd: #6c3fc5;
            --pl: #a78bfa;
            --pdim: rgba(139, 92, 246, .15);
            --pbrd: rgba(139, 92, 246, .28);
            --pglow: rgba(108, 63, 197, .45);
            --danger: #f87171;
            --warn: #fb923c;
            --ok: #4ade80;
            --blue: #60a5fa;
            --nav-h: 78px;
            --max-width: 640px;
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --transition: .25s cubic-bezier(.34, 1.2, .64, 1);
        }

        [data-theme="dark"] {
            --bg: #000;
            --bg2: #0a0a0a;
            --bg3: #111;
            --bg4: #1a1a1a;
            --bg5: #222;
            --brd: rgba(255, 255, 255, .07);
            --brd2: rgba(255, 255, 255, .12);
            --text: #fff;
            --muted: rgba(255, 255, 255, .4);
            --muted2: rgba(255, 255, 255, .22);
            --inp: rgba(255, 255, 255, .05);
            --rowh: rgba(255, 255, 255, .04);
            --navbg: rgba(0, 0, 0, .97);
            --sidebg: #0a0a0a;
            --dotbg: rgba(255, 255, 255, .07);
            --dotc: #fff;
            --cardsh: 0 2px 16px rgba(0, 0, 0, .5);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, .7);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, .4);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, .3);
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --bg2: #fff;
            --bg3: #fff;
            --bg4: #e8e8ed;
            --bg5: #d8d8de;
            --brd: rgba(0, 0, 0, .08);
            --brd2: rgba(0, 0, 0, .13);
            --text: #0d0d0d;
            --muted: rgba(0, 0, 0, .44);
            --muted2: rgba(0, 0, 0, .26);
            --inp: rgba(0, 0, 0, .05);
            --rowh: rgba(0, 0, 0, .04);
            --navbg: rgba(242, 242, 247, .97);
            --sidebg: #fff;
            --dotbg: rgba(0, 0, 0, .07);
            --dotc: #0d0d0d;
            --cardsh: 0 2px 16px rgba(0, 0, 0, .1);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, .15);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, .08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, .05);
        }

        /* ──────────────────────────────────────────────────────────────
           2.  BASE LAYOUT
           ────────────────────────────────────────────────────────────── */
        html,
        body {
            height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background .3s, color .3s;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .layout {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--bg);
            scroll-behavior: smooth;
            transition: background .3s;
            padding-bottom: 80px;
            -webkit-overflow-scrolling: touch;
        }

        .main::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .create-col {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* ──────────────────────────────────────────────────────────────
           3.  TOPBAR
           ────────────────────────────────────────────────────────────── */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(44px, 8vw, 56px) 0 10px;
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--bg);
            transition: background .3s;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-title {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 800;
            letter-spacing: -.3px;
            background: linear-gradient(135deg, var(--p), var(--pl));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topbar-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--inp);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }

        .topbar-btn:hover {
            background: var(--pdim);
        }

        .topbar-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ──────────────────────────────────────────────────────────────
           4.  TABS
           ────────────────────────────────────────────────────────────── */
        .create-tabs {
            display: flex;
            border-bottom: 1.5px solid var(--brd);
            margin-bottom: 20px;
            gap: 4px;
            background: var(--bg);
            transition: background .3s, border-color .3s;
            border-radius: var(--radius-xs) var(--radius-xs) 0 0;
            overflow: hidden;
        }

        .create-tab {
            flex: 1;
            padding: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            background: none;
            border: none;
            border-bottom: 2.5px solid transparent;
            transition: all .2s;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
            position: relative;
        }

        .create-tab svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--muted2);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .2s;
        }

        .create-tab.active {
            border-bottom-color: var(--p);
            color: var(--p);
        }

        .create-tab.active svg {
            stroke: var(--p);
        }

        .create-tab:hover {
            color: var(--text);
            background: var(--rowh);
        }

        .create-tab .tab-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--p);
            display: none;
        }

        .create-tab.active .tab-badge {
            display: block;
        }

        /* ──────────────────────────────────────────────────────────────
           5.  PANELS
           ────────────────────────────────────────────────────────────── */
        .panel {
            display: none;
            animation: fadeUp .35s cubic-bezier(.34, 1.2, .64, 1) both;
        }

        .panel.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ──────────────────────────────────────────────────────────────
           6.  FORM ELEMENTS
           ────────────────────────────────────────────────────────────── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
            position: relative;
        }

        .form-lbl {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .07em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-lbl .required {
            color: var(--danger);
            font-weight: 800;
        }

        .form-lbl .optional {
            font-weight: 400;
            color: var(--muted2);
            text-transform: none;
            font-size: 11px;
        }

        .form-inp {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--brd);
            background: var(--inp);
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color .15s, background .3s, color .3s, box-shadow .15s;
            font-family: inherit;
        }

        .form-inp:focus {
            border-color: var(--p);
            box-shadow: 0 0 0 3px var(--pdim);
        }

        .form-inp::placeholder {
            color: var(--muted2);
        }

        .form-inp:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        textarea.form-inp {
            resize: vertical;
            min-height: 100px;
            line-height: 1.6;
        }

        /* ──────────────────────────────────────────────────────────────
           7.  TITLE INPUT (with backdrop wrapper)
           ────────────────────────────────────────────────────────────── */
        #postTitle {
            font-weight: 800;
            font-size: 18px;
            padding: 14px 16px;
        }

        #postTitle::placeholder {
            font-weight: 500;
            color: var(--muted2);
        }

        /* ──────────────────────────────────────────────────────────────
           8.  CONTENT TEXTAREA + BACKDROP (live highlight)
           ────────────────────────────────────────────────────────────── */
        .mention-textarea-wrap {
            position: relative;
        }

        /* Backdrop — visible again, sits behind the transparent text */
        .mention-backdrop {
            position: absolute;
            inset: 0;
            margin: 0;
            padding: 12px 16px;
            border: 1.5px solid transparent;
            border-radius: var(--radius-sm);
            font-size: 15px;
            line-height: 1.6;
            font-family: inherit;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: hidden;
            color: var(--text);
            font-weight: 700;
            pointer-events: none;
            background: transparent;
            z-index: 1;
        }

        /* Textarea — transparent text, caret visible */
        .mention-textarea {
            position: relative;
            background: transparent !important;
            color: transparent;
            caret-color: var(--text);
            z-index: 2;
            font-weight: 700;
            font-size: 15px;
            line-height: 1.6;
        }

        /* min-height only applies to the multi-line Content textarea,
           not the single-line Title input (both share .mention-textarea) */
        textarea.mention-textarea {
            min-height: 120px;
        }

        .mention-textarea.form-inp {
            background: transparent !important;
        }

        .mention-textarea::placeholder {
            color: var(--muted2);
            font-weight: 400;
        }

        .mention-textarea-wrap .form-inp {
            background: transparent !important;
        }

        /* Highlighted tokens — both mentions and hashtags */
        .mention-highlight {
            color: var(--pl);
            font-weight: 800;
        }

        /* ──────────────────────────────────────────────────────────────
           9.  FORMATTING TOOLBAR
           ────────────────────────────────────────────────────────────── */
        .fmt-toolbar {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 6px 8px;
            border: 1.5px solid var(--brd);
            border-bottom: none;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            background: var(--inp);
            flex-wrap: wrap;
            transition: border-color .15s, background .3s;
        }

        .fmt-toolbar:focus-within {
            border-color: var(--p);
        }

        .fmt-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-xs);
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .12s, transform .12s;
            user-select: none;
        }

        .fmt-btn:hover {
            background: var(--pdim);
            transform: scale(1.05);
        }

        .fmt-btn:active {
            transform: scale(.92);
        }

        .fmt-btn.italic-btn {
            font-style: italic;
            font-weight: 600;
        }

        .fmt-btn.mono-btn {
            font-family: monospace;
            font-weight: 700;
        }

        .fmt-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .fmt-divider {
            width: 1px;
            height: 22px;
            background: var(--brd2);
            margin: 0 4px;
            flex-shrink: 0;
        }

        .fmt-hint {
            font-size: 11px;
            color: var(--muted2);
            padding: 6px 2px 0;
            letter-spacing: .02em;
        }

        .fmt-toolbar+.mention-textarea-wrap .form-inp,
        .fmt-toolbar+.mention-textarea-wrap .mention-backdrop {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        /* ──────────────────────────────────────────────────────────────
           10. SUGGESTION BOXES (unified styling)
           ────────────────────────────────────────────────────────────── */
        .mention-suggestions,
        .hashtag-suggestions,
        #mention-suggestions /* dynamic box from mentions.js */ {
            background: var(--bg3);
            border: 1px solid var(--brd2);
            border-radius: var(--radius-sm);
            max-height: 240px;
            overflow-y: auto;
            position: fixed;
            z-index: 60;
            box-shadow: var(--shadow-lg);
            display: none;
            padding: 6px 0;
            min-width: 200px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity .15s;
        }

        .mention-suggestions::-webkit-scrollbar,
        .hashtag-suggestions::-webkit-scrollbar,
        #mention-suggestions::-webkit-scrollbar {
            width: 3px;
        }

        .mention-suggestions::-webkit-scrollbar-track,
        .hashtag-suggestions::-webkit-scrollbar-track,
        #mention-suggestions::-webkit-scrollbar-track {
            background: transparent;
        }

        .mention-suggestions::-webkit-scrollbar-thumb,
        .hashtag-suggestions::-webkit-scrollbar-thumb,
        #mention-suggestions::-webkit-scrollbar-thumb {
            background: var(--pbrd);
            border-radius: 100px;
        }

        .mention-suggestions .suggestion-item,
        #mention-suggestions .suggestion-item,
        .hashtag-suggestions .h-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background .1s;
            font-size: 14px;
            border-radius: 4px;
            margin: 0 4px;
        }

        .mention-suggestions .suggestion-item:hover,
        .mention-suggestions .suggestion-item.active,
        #mention-suggestions .suggestion-item:hover,
        #mention-suggestions .suggestion-item.active,
        .hashtag-suggestions .h-item:hover,
        .hashtag-suggestions .h-item.active {
            background: var(--pdim);
        }

        .mention-suggestions .suggestion-item img,
        #mention-suggestions .suggestion-item img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg4);
            flex-shrink: 0;
        }

        .mention-suggestions .suggestion-item .s-name,
        #mention-suggestions .suggestion-item .s-name {
            font-weight: 600;
            white-space: nowrap;
        }

        .mention-suggestions .suggestion-item .s-handle,
        #mention-suggestions .suggestion-item .s-handle {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
        }

        .mention-suggestions .suggestion-item .s-badge,
        #mention-suggestions .suggestion-item .s-badge {
            font-size: 10px;
            background: var(--pdim);
            color: var(--pl);
            padding: 2px 8px;
            border-radius: 100px;
            margin-left: auto;
            white-space: nowrap;
        }

        .hashtag-suggestions .h-name {
            font-weight: 700;
            color: var(--pl);
        }

        .hashtag-suggestions .h-count {
            font-size: 12px;
            color: var(--muted);
            flex-shrink: 0;
            margin-left: auto;
        }

        .hashtag-suggestions .h-count.h-new {
            color: var(--ok);
            font-weight: 600;
        }

        /* ──────────────────────────────────────────────────────────────
           11. CHAR COUNTER
           ────────────────────────────────────────────────────────────── */
        .char-c {
            font-size: 11px;
            color: var(--muted2);
            text-align: right;
            padding-top: 2px;
            transition: color .2s;
        }

        .char-c.warn {
            color: var(--warn);
        }

        .char-c.err {
            color: var(--danger);
        }

        /* ──────────────────────────────────────────────────────────────
           12. TOGGLE SWITCH
           ────────────────────────────────────────────────────────────── */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-radius: var(--radius);
            border: 1.5px solid var(--brd);
            background: var(--inp);
            margin-bottom: 18px;
            transition: border-color .15s, background .3s;
        }

        .toggle-row:hover {
            border-color: var(--brd2);
        }

        .toggle-row-text {
            min-width: 0;
            flex: 1;
        }

        .toggle-row-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        .toggle-row-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
            line-height: 1.4;
        }

        .toggle {
            position: relative;
            width: 48px;
            height: 28px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .toggle .track {
            position: absolute;
            inset: 0;
            border-radius: 100px;
            background: rgba(150, 150, 150, .25);
            cursor: pointer;
            transition: background .25s;
            border: 1.5px solid var(--brd);
        }

        .toggle input:checked+.track {
            background: var(--p);
            border-color: var(--p);
        }

        .toggle .track::after {
            content: '';
            position: absolute;
            left: 2px;
            top: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: transform .3s cubic-bezier(.34, 1.4, .64, 1);
            box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
        }

        .toggle input:checked+.track::after {
            transform: translateX(20px);
        }

        /* ──────────────────────────────────────────────────────────────
           13. BUTTONS
           ────────────────────────────────────────────────────────────── */
        .btn-primary {
            padding: 14px 20px;
            border-radius: var(--radius);
            background: linear-gradient(135deg, var(--p), var(--pd));
            color: #fff !important;
            font-size: 15px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: opacity .2s, transform .2s, box-shadow .2s;
            box-shadow: 0 4px 24px var(--pglow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, .1));
            pointer-events: none;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: .92;
            transform: translateY(-2px);
            box-shadow: 0 6px 32px var(--pglow);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0) scale(.98);
        }

        .btn-primary:disabled {
            opacity: .35;
            cursor: default;
            transform: none;
            box-shadow: none;
        }

        .btn-primary .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, .2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-primary.loading .spinner {
            display: block;
        }

        .btn-primary.loading .btn-text {
            opacity: .7;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ──────────────────────────────────────────────────────────────
           14. UPLOAD ROW
           ────────────────────────────────────────────────────────────── */
        .upload-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .upload-row .form-inp {
            flex: 1;
        }

        .upload-btn {
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-weight: 700;
            cursor: pointer;
            transition: background .15s, transform .12s;
            white-space: nowrap;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .upload-btn:hover {
            background: rgba(139, 92, 246, .25);
        }

        .upload-btn:active {
            transform: scale(.95);
        }

        .upload-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .upload-progress {
            height: 3px;
            background: var(--brd);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
            display: none;
        }

        .upload-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--p), var(--pl));
            width: 0%;
            transition: width .3s;
            border-radius: 2px;
        }

        /* ──────────────────────────────────────────────────────────────
           15. IMAGE GRID
           ────────────────────────────────────────────────────────────── */
        .image-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .image-scroll::-webkit-scrollbar {
            display: none;
        }

        .image-thumb {
            position: relative;
            flex: 0 0 84px;
            height: 84px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg4);
            border: 2px solid var(--brd);
            cursor: pointer;
            transition: transform .2s, border-color .2s, box-shadow .2s;
        }

        .image-thumb:hover {
            transform: scale(1.04);
            border-color: var(--pbrd);
            box-shadow: var(--shadow-sm);
        }

        .image-thumb img,
        .image-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-thumb .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .7);
            border: none;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, transform .12s;
            z-index: 3;
            font-weight: 700;
        }

        .image-thumb .remove-btn:hover {
            background: rgba(220, 38, 38, .85);
            transform: scale(1.1);
        }

        .image-thumb .remove-btn:active {
            transform: scale(.85);
        }

        .image-thumb .cover-badge {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0, 0, 0, .65);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: .04em;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2;
        }

        .image-thumb .uploading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .image-thumb .uploading-overlay .spinner {
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, .2);
            border-top-color: var(--p);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .image-add-btn {
            flex: 0 0 84px;
            height: 84px;
            border-radius: var(--radius-sm);
            border: 2px dashed var(--brd2);
            background: var(--inp);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .2s;
            color: var(--muted2);
            font-size: 10px;
            font-weight: 600;
            gap: 3px;
        }

        .image-add-btn:hover {
            border-color: var(--pbrd);
            color: var(--pl);
            background: var(--pdim);
            transform: scale(1.02);
        }

        .image-add-btn:active {
            transform: scale(.95);
        }

        .image-add-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* ──────────────────────────────────────────────────────────────
           16. FULLSCREEN VIEWER
           ────────────────────────────────────────────────────────────── */
        .fullscreen-viewer {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, .96);
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .fullscreen-viewer.open {
            opacity: 1;
            pointer-events: auto;
        }

        .fullscreen-viewer .viewer-header {
            display: flex;
            justify-content: flex-end;
            padding: 16px 20px;
            flex-shrink: 0;
            z-index: 2;
        }

        .fullscreen-viewer .viewer-close {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, transform .12s;
        }

        .fullscreen-viewer .viewer-close:hover {
            background: rgba(255, 255, 255, .16);
            transform: scale(1.05);
        }

        .fullscreen-viewer .viewer-close:active {
            transform: scale(.92);
        }

        .fullscreen-viewer .viewer-close svg {
            width: 24px;
            height: 24px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
        }

        .fullscreen-viewer .viewer-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px 40px;
            overflow: hidden;
            position: relative;
        }

        .fullscreen-viewer .viewer-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            user-select: none;
            -webkit-user-drag: none;
            transition: transform .3s;
        }

        .fullscreen-viewer .viewer-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .6);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 100px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, .06);
        }

        .fullscreen-viewer .viewer-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .1);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
            z-index: 3;
        }

        .fullscreen-viewer .viewer-nav:hover {
            background: rgba(255, 255, 255, .16);
        }

        .fullscreen-viewer .viewer-nav.prev {
            left: 16px;
        }

        .fullscreen-viewer .viewer-nav.next {
            right: 16px;
        }

        .fullscreen-viewer .viewer-nav svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ──────────────────────────────────────────────────────────────
           17. PICKER MODAL
           ────────────────────────────────────────────────────────────── */
        .picker-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }

        .picker-modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .picker-sheet {
            width: 100%;
            max-width: 560px;
            max-height: 78vh;
            background: var(--bg3);
            border-radius: 28px 28px 0 0;
            border-top: 1px solid var(--brd2);
            transform: translateY(60px);
            transition: transform .4s cubic-bezier(.32, 1, .64, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -8px 60px rgba(0, 0, 0, .5);
        }

        .picker-modal-overlay.open .picker-sheet {
            transform: translateY(0);
        }

        .picker-handle {
            width: 44px;
            height: 4px;
            border-radius: 100px;
            background: var(--brd2);
            margin: 14px auto 0;
            flex-shrink: 0;
        }

        .picker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 12px;
            border-bottom: 1px solid var(--brd);
            flex-shrink: 0;
        }

        .picker-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
        }

        .picker-close {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--inp);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }

        .picker-close:hover {
            background: var(--pdim);
        }

        .picker-close svg {
            width: 16px;
            height: 16px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
        }

        .picker-search {
            padding: 8px 16px 8px;
            flex-shrink: 0;
        }

        .picker-search input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--brd);
            background: var(--inp);
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color .15s;
        }

        .picker-search input:focus {
            border-color: var(--p);
        }

        .picker-search input::placeholder {
            color: var(--muted2);
        }

        .picker-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 20px;
            -webkit-overflow-scrolling: touch;
        }

        .picker-list::-webkit-scrollbar {
            width: 0;
        }

        .picker-item {
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background .1s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
        }

        .picker-item:hover {
            background: var(--rowh);
        }

        .picker-item.active {
            background: var(--pdim);
            color: var(--pl);
        }

        .picker-item .check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--brd2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all .2s;
        }

        .picker-item.active .check {
            border-color: var(--p);
            background: var(--p);
        }

        .picker-item.active .check svg {
            stroke: #fff;
            width: 11px;
            height: 11px;
            display: block;
        }

        .picker-item .check svg {
            display: none;
        }

        .picker-empty {
            padding: 40px 0;
            text-align: center;
            color: var(--muted2);
            font-size: 14px;
        }

        /* ──────────────────────────────────────────────────────────────
           18. MARKETPLACE SPECIFIC
           ────────────────────────────────────────────────────────────── */
        .price-wrap {
            position: relative;
        }

        .price-wrap .currency {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: var(--muted);
            font-size: 15px;
        }

        .price-wrap .form-inp {
            padding-left: 34px;
        }

        .category-row {
            display: flex;
            gap: 10px;
        }

        .category-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .condition-row {
            display: flex;
            gap: 8px;
        }

        .condition-opt {
            flex: 1;
            padding: 10px 8px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--brd);
            background: var(--inp);
            text-align: center;
            cursor: pointer;
            transition: all .2s;
            font-weight: 600;
            color: var(--muted);
            font-size: 13px;
            user-select: none;
        }

        .condition-opt:hover {
            border-color: var(--pbrd);
            background: var(--pdim);
            color: var(--pl);
        }

        .condition-opt.active {
            border-color: var(--p);
            background: var(--pdim);
            color: var(--pl);
            box-shadow: 0 0 0 3px var(--pdim);
        }

        .location-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .location-row .form-inp {
            flex: 1;
        }

        .location-btn {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, transform .12s;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .location-btn:hover {
            background: rgba(139, 92, 246, .25);
        }

        .location-btn:active {
            transform: scale(.95);
        }

        .location-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .location-status {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
            min-height: 18px;
        }

        .location-status.success {
            color: var(--ok);
        }

        .location-status.error {
            color: var(--danger);
        }

        .location-status.loading {
            color: var(--warn);
        }

        /* ──────────────────────────────────────────────────────────────
           19. PICKER BUTTON
           ────────────────────────────────────────────────────────────── */
        .picker-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--brd);
            background: var(--inp);
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color .15s, background .3s, color .3s;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            -webkit-appearance: none;
            appearance: none;
        }

        .picker-btn:focus {
            border-color: var(--p);
            box-shadow: 0 0 0 3px var(--pdim);
        }

        .picker-btn .placeholder {
            color: var(--muted2);
        }

        .picker-btn .arrow {
            flex-shrink: 0;
            margin-left: 8px;
            transition: transform .25s;
        }

        .picker-btn .arrow svg {
            width: 16px;
            height: 16px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: block;
        }

        .picker-btn .selected-label {
            font-weight: 500;
            color: var(--text);
        }

        .picker-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .picker-btn .badge-pill {
            font-size: 10px;
            background: var(--pdim);
            color: var(--pl);
            padding: 2px 10px;
            border-radius: 100px;
            font-weight: 700;
            margin-left: 8px;
        }

        /* ──────────────────────────────────────────────────────────────
           20. TOAST
           ────────────────────────────────────────────────────────────── */
        #tw {
            position: fixed;
            top: clamp(14px, 4vw, 22px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: calc(100vw - 32px);
            width: 100%;
            align-items: center;
        }

        .toast {
            background: var(--bg3);
            border: 1px solid var(--brd2);
            border-radius: 100px;
            padding: 11px 20px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-lg);
            animation: tIn .35s cubic-bezier(.34, 1.2, .64, 1) both;
            white-space: nowrap;
            max-width: 100%;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .toast.out {
            animation: tOut .3s ease forwards;
        }

        @keyframes tIn {
            from {
                transform: translateY(-18px);
                opacity: 0;
                scale: .92;
            }
            to {
                transform: none;
                opacity: 1;
                scale: 1;
            }
        }

        @keyframes tOut {
            to {
                transform: translateY(-12px) scale(.95);
                opacity: 0;
            }
        }

        .td {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .tg {
            background: var(--ok);
        }
        .tp {
            background: var(--p);
        }
        .tr {
            background: var(--danger);
        }
        .to {
            background: var(--warn);
        }

        /* ──────────────────────────────────────────────────────────────
           21. RESPONSIVE
           ────────────────────────────────────────────────────────────── */
        @media (min-width: 768px) {
            .main {
                padding-bottom: 24px;
            }

            .create-col {
                padding: 20px 24px 40px;
            }

            .fullscreen-viewer .viewer-nav {
                width: 52px;
                height: 52px;
            }

            .fullscreen-viewer .viewer-nav.prev {
                left: 24px;
            }
            .fullscreen-viewer .viewer-nav.next {
                right: 24px;
            }
        }

        @media (min-width: 1024px) {
            .create-col {
                max-width: var(--max-width);
            }
        }

        @media (max-width: 480px) {
            .create-tab {
                font-size: 12px;
                padding: 10px 0;
            }

            .create-tab svg {
                width: 17px;
                height: 17px;
            }

            .category-row {
                flex-direction: column;
                gap: 6px;
            }

            .condition-row {
                gap: 6px;
            }

            .condition-opt {
                font-size: 12px;
                padding: 8px 4px;
            }

            .location-row {
                flex-wrap: wrap;
            }

            .location-btn {
                width: 100%;
                justify-content: center;
            }

            .image-thumb {
                flex: 0 0 72px;
                height: 72px;
            }

            .image-add-btn {
                flex: 0 0 72px;
                height: 72px;
            }

            .fullscreen-viewer .viewer-nav {
                width: 38px;
                height: 38px;
            }

            .fullscreen-viewer .viewer-nav.prev {
                left: 8px;
            }
            .fullscreen-viewer .viewer-nav.next {
                right: 8px;
            }

            .fullscreen-viewer .viewer-nav svg {
                width: 16px;
                height: 16px;
            }
        }

        /* ──────────────────────────────────────────────────────────────
           22. UTILITY
           ────────────────────────────────────────────────────────────── */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .mt-1 {
            margin-top: 4px;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-3 {
            margin-top: 12px;
        }

        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gap-1 {
            gap: 4px;
        }
        .gap-2 {
            gap: 8px;
        }
        .gap-3 {
            gap: 12px;
        }

        .text-muted {
            color: var(--muted);
        }

        .text-muted2 {
            color: var(--muted2);
        }

        .text-sm {
            font-size: 12px;
        }
        .text-xs {
            font-size: 11px;
        }

        .fw-700 {
            font-weight: 700;
        }
        .fw-800 {
            font-weight: 800;
        }

        /* ──────────────────────────────────────────────────────────────
           23. SCROLLBAR STYLING (global)
           ────────────────────────────────────────────────────────────── */
        .main::-webkit-scrollbar,
        .side-nav::-webkit-scrollbar,
        .picker-list::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        /* ──────────────────────────────────────────────────────────────
           24. DRAG & DROP HIGHLIGHT
           ────────────────────────────────────────────────────────────── */
        .drop-highlight {
            border-color: var(--p) !important;
            background: var(--pdim) !important;
            box-shadow: 0 0 0 3px var(--pdim) !important;
            transition: all .2s;
        }

        /* ──────────────────────────────────────────────────────────────
           25. LOADING SHIMMER
           ────────────────────────────────────────────────────────────── */
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .shimmer {
            background: linear-gradient(90deg, var(--bg4) 25%, var(--bg5) 50%, var(--bg4) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* ──────────────────────────────────────────────────────────────
           26. SAFE AREA (notch phones)
           ────────────────────────────────────────────────────────────── */
        @supports (padding: max(0px)) {
            .topbar {
                padding-top: max(clamp(44px, 8vw, 56px), env(safe-area-inset-top, 12px));
            }

            .main {
                padding-bottom: max(80px, env(safe-area-inset-bottom, 12px));
            }
        }
    </style>
</head>
<body>
