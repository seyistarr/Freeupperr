    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script src="global.js">
    </script>
    <script src="auth.js">
    </script>
    <script src="posts.js">
    </script>
    <script src="listings.js">
    </script>
    <script src="mentions.js">
    </script>
    <script src="https://vjs.zencdn.net/8.6.1/video.min.js">
    </script>

    <style>
        /* ── all existing styles from original create.html (unchanged) ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }
        svg {
            overflow: visible;
        }

        :root {
            --p: #8b5cf6;
            --pd: #6c3fc5;
            --pl: #a78bfa;
            --pdim: rgba(139, 92, 246, .15);
            --pbrd: rgba(139, 92, 246, .28);
            --pglow: rgba(108, 63, 197, .45);
            --danger: #f87171;
            --warn: #fb923c;
            --ok: #4ade80;
            --blue: #60a5fa;
            --nav-h: 78px;
        }

        [data-theme="dark"] {
            --bg: #000;
            --bg2: #0a0a0a;
            --bg3: #111;
            --bg4: #1a1a1a;
            --bg5: #222;
            --brd: rgba(255, 255, 255, .07);
            --brd2: rgba(255, 255, 255, .12);
            --text: #fff;
            --muted: rgba(255, 255, 255, .4);
            --muted2: rgba(255, 255, 255, .22);
            --inp: rgba(255, 255, 255, .05);
            --rowh: rgba(255, 255, 255, .04);
            --navbg: rgba(0, 0, 0, .97);
            --sidebg: #0a0a0a;
            --dotbg: rgba(255, 255, 255, .07);
            --dotc: #fff;
            --cardsh: 0 2px 16px rgba(0, 0, 0, .5);
        }

        [data-theme="light"] {
            --bg: #f2f2f7;
            --bg2: #fff;
            --bg3: #fff;
            --bg4: #e8e8ed;
            --bg5: #d8d8de;
            --brd: rgba(0, 0, 0, .08);
            --brd2: rgba(0, 0, 0, .13);
            --text: #0d0d0d;
            --muted: rgba(0, 0, 0, .44);
            --muted2: rgba(0, 0, 0, .26);
            --inp: rgba(0, 0, 0, .05);
            --rowh: rgba(0, 0, 0, .04);
            --navbg: rgba(242, 242, 247, .97);
            --sidebg: #fff;
            --dotbg: rgba(0, 0, 0, .07);
            --dotc: #0d0d0d;
            --cardsh: 0 2px 16px rgba(0, 0, 0, .1);
        }

        /* BASE */
        html,
        body {
            height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background .3s, color .3s;
            overflow: hidden;
        }

        .layout {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .side-nav {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 28px 0 24px;
            background: var(--sidebg);
            border-right: 1px solid var(--brd);
            width: 70px;
            flex-shrink: 0;
            gap: 2px;
            z-index: 10;
            transition: background .3s, border-color .3s;
        }
        .side-logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--p);
            margin-bottom: 20px;
            letter-spacing: -1px;
            cursor: pointer;
        }
        .side-logo a {
            color: inherit;
            text-decoration: none;
        }
        .side-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s, transform .1s;
            background: none;
            border: none;
            position: relative;
            gap: 3px;
            color: inherit;
            text-decoration: none;
        }
        .side-btn:hover {
            background: var(--pdim);
            transform: scale(1.04);
        }
        .side-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .side-btn span {
            font-size: 8px;
            color: var(--muted2);
            font-weight: 600;
        }
        .side-btn.active svg {
            stroke: var(--p);
        }
        .side-btn.active span {
            color: var(--p);
        }
        .side-btn .side-badge {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--p);
            border: 1.5px solid var(--sidebg);
        }
        .side-gap {
            flex: 1;
        }
        .side-av {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }
        .side-btn.active .side-av {
            border-color: var(--p);
        }

        .main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--bg);
            scroll-behavior: smooth;
            transition: background .3s;
            padding-bottom: 80px;
        }
        .main::-webkit-scrollbar {
            width: 0;
        }
        .create-col {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(44px, 8vw, 56px) 0 10px;
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--bg);
            transition: background .3s;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-title {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 800;
            letter-spacing: -.3px;
        }

        .create-tabs {
            display: flex;
            border-bottom: 1px solid var(--brd);
            margin-bottom: 20px;
            gap: 4px;
            background: var(--bg);
            transition: background .3s, border-color .3s;
        }
        .create-tab {
            flex: 1;
            padding: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            transition: all .15s;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }
        .create-tab svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--muted2);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }
        .create-tab.active {
            border-bottom-color: var(--p);
            color: var(--p);
        }
        .create-tab.active svg {
            stroke: var(--p);
        }
        .create-tab:hover {
            color: var(--text);
            background: var(--rowh);
        }

        .panel {
            display: none;
            animation: fadeUp .3s ease both;
        }
        .panel.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* FORM ELEMENTS */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        .form-lbl {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .07em;
        }
        .form-inp {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color .15s, background .3s, color .3s;
            font-family: inherit;
        }
        .form-inp:focus {
            border-color: var(--p);
        }
        .form-inp::placeholder {
            color: var(--muted2);
        }
        .form-inp:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        textarea.form-inp {
            resize: vertical;
            min-height: 100px;
            line-height: 1.6;
        }
        select.form-inp {
            appearance: auto;
            cursor: pointer;
            background: var(--inp);
            color: var(--text);
            border: 1.5px solid var(--brd);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            outline: none;
            transition: border-color .15s, background .3s, color .3s;
            width: 100%;
        }
        select.form-inp:focus {
            border-color: var(--p);
        }
        select.form-inp option {
            background: var(--bg2);
            color: var(--text);
        }

        .char-c {
            font-size: 11px;
            color: var(--muted2);
            text-align: right;
        }
        .char-c.warn {
            color: var(--warn);
        }
        .char-c.err {
            color: var(--danger);
        }

        .tag-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px 5px 14px;
            border-radius: 100px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-size: 12px;
            font-weight: 700;
        }
        .tag-pill button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--pl);
            font-size: 14px;
            line-height: 1;
            padding: 0;
        }
        .tag-pill button:hover {
            color: var(--danger);
        }

        .tag-input-row {
            display: flex;
            gap: 8px;
        }
        .tag-input-row .form-inp {
            flex: 1;
        }
        .tag-input-row button {
            padding: 10px 18px;
            border-radius: 12px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
            white-space: nowrap;
        }
        .tag-input-row button:hover {
            background: rgba(139, 92, 246, .25);
        }

        .btn-primary {
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--p), var(--pd));
            color: #fff !important;
            font-size: 15px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: opacity .15s, transform .15s;
            box-shadow: 0 4px 20px var(--pglow);
        }
        .btn-primary:hover {
            opacity: .9;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: .35;
            cursor: default;
            transform: none;
        }

        .category-selector {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color .15s;
        }
        .category-selector:hover {
            border-color: var(--pbrd);
        }
        .category-selector .placeholder {
            color: var(--muted2);
        }
        .category-selector svg {
            width: 16px;
            height: 16px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .category-row {
            display: flex;
            gap: 10px;
        }
        .category-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-sheet {
            width: 100%;
            max-width: 560px;
            max-height: 80vh;
            background: var(--bg3);
            border-radius: 24px 24px 0 0;
            border-top: 1px solid var(--brd2);
            transform: translateY(60px);
            transition: transform .34s cubic-bezier(.32, 1, .64, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-overlay.open .modal-sheet {
            transform: translateY(0);
        }
        .modal-handle {
            width: 40px;
            height: 4px;
            border-radius: 100px;
            background: var(--brd2);
            margin: 14px auto 0;
            flex-shrink: 0;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 12px;
            border-bottom: 1px solid var(--brd);
            flex-shrink: 0;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 800;
        }
        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--inp);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }
        .modal-close:hover {
            background: var(--pdim);
        }
        .modal-close svg {
            width: 15px;
            height: 15px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
        }
        .modal-body {
            overflow-y: auto;
            padding: 12px 16px 24px;
            flex: 1;
        }
        .modal-body::-webkit-scrollbar {
            width: 0;
        }
        .modal-category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .modal-category-item {
            padding: 12px;
            border-radius: 12px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            text-align: center;
            cursor: pointer;
            transition: all .15s;
            font-weight: 600;
            color: var(--muted);
            font-size: 13px;
        }
        .modal-category-item:hover {
            border-color: var(--pbrd);
            background: var(--pdim);
            color: var(--pl);
        }
        .modal-category-item.active {
            border-color: var(--p);
            background: var(--pdim);
            color: var(--pl);
        }

        .upload-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .upload-row .form-inp {
            flex: 1;
        }
        .upload-row .upload-btn {
            padding: 10px 16px;
            border-radius: 12px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
            white-space: nowrap;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .upload-row .upload-btn:hover {
            background: rgba(139, 92, 246, .25);
        }
        .upload-row .upload-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .upload-progress {
            height: 3px;
            background: var(--brd);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        .upload-progress-bar {
            height: 100%;
            background: var(--p);
            width: 0%;
            transition: width .3s;
            border-radius: 2px;
        }

        .image-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .image-scroll::-webkit-scrollbar {
            display: none;
        }
        .image-thumb {
            position: relative;
            flex: 0 0 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg4);
            border: 2px solid var(--brd);
            cursor: pointer;
            transition: transform .15s;
        }
        .image-thumb:hover {
            transform: scale(1.05);
        }
        .image-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-thumb .remove-btn {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .7);
            border: none;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }
        .image-thumb .remove-btn:hover {
            background: rgba(220, 38, 38, .8);
        }
        .image-thumb .cover-badge {
            position: absolute;
            bottom: 3px;
            left: 3px;
            background: rgba(0, 0, 0, .6);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 3px;
        }
        .image-thumb .uploading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-thumb .uploading-overlay .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, .2);
            border-top-color: var(--p);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .image-add-btn {
            flex: 0 0 80px;
            height: 80px;
            border-radius: 12px;
            border: 2px dashed var(--brd2);
            background: var(--inp);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .15s;
            color: var(--muted2);
            font-size: 10px;
            font-weight: 600;
            gap: 2px;
        }
        .image-add-btn:hover {
            border-color: var(--pbrd);
            color: var(--pl);
            background: var(--pdim);
        }
        .image-add-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .fullscreen-viewer {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, .95);
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .fullscreen-viewer.open {
            opacity: 1;
            pointer-events: auto;
        }
        .fullscreen-viewer .viewer-header {
            display: flex;
            justify-content: flex-end;
            padding: 16px 20px;
            flex-shrink: 0;
            z-index: 2;
        }
        .fullscreen-viewer .viewer-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .2);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }
        .fullscreen-viewer .viewer-close:hover {
            background: rgba(255, 255, 255, .2);
        }
        .fullscreen-viewer .viewer-close svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
        }
        .fullscreen-viewer .viewer-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px 40px;
            overflow: hidden;
        }
        .fullscreen-viewer .viewer-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            user-select: none;
            -webkit-user-drag: none;
        }
        .fullscreen-viewer .viewer-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .6);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .price-wrap {
            position: relative;
        }
        .price-wrap .currency {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: var(--muted);
        }
        .price-wrap .form-inp {
            padding-left: 32px;
        }

        .condition-row {
            display: flex;
            gap: 8px;
        }
        .condition-opt {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1.5px solid var(--brd);
            background: var(--inp);
            text-align: center;
            cursor: pointer;
            transition: all .15s;
            font-weight: 600;
            color: var(--muted);
            font-size: 13px;
        }
        .condition-opt:hover {
            border-color: var(--pbrd);
            background: var(--pdim);
            color: var(--pl);
        }
        .condition-opt.active {
            border-color: var(--p);
            background: var(--pdim);
            color: var(--pl);
        }

        .location-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .location-row .form-inp {
            flex: 1;
        }
        .location-btn {
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--pdim);
            border: 1.5px solid var(--pbrd);
            color: var(--pl);
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .location-btn:hover {
            background: rgba(139, 92, 246, .25);
        }
        .location-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .location-status {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* ══════════════════════════════════════════
           BOTTOM NAV
        ══════════════════════════════════════════ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--navbg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-top: 1px solid var(--brd);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0 max(env(safe-area-inset-bottom), 16px);
            z-index: 50;
            transition: background .3s, border-color .3s;
            height: var(--nav-h, 78px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px clamp(8px, 3vw, 14px);
            border-radius: 14px;
            transition: background .15s;
            position: relative;
            background: none;
            border: none;
            text-decoration: none;
            color: inherit;
        }

        .nav-item:hover {
            background: var(--pdim);
        }

        .nav-item svg {
            width: clamp(20px, 5vw, 24px);
            height: clamp(20px, 5vw, 24px);
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke .15s;
        }

        .nav-item span {
            font-size: clamp(9px, 2vw, 10px);
            color: var(--muted);
            font-weight: 600;
            letter-spacing: .03em;
        }

        .nav-item.active svg {
            stroke: var(--p);
        }

        .nav-item.active span {
            color: var(--p);
        }

        .nav-av {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #1a1035, #3b1a6b);
        }

        .nav-item.active .nav-av {
            border-color: var(--p);
        }

        .add-post-btn {
            background: var(--p);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(139, 92, 246, .4);
            transform: translateY(-2px);
            flex-shrink: 0;
            transition: transform .15s, box-shadow .15s;
        }

        .add-post-btn:active {
            transform: translateY(-2px) scale(.92);
        }

        .add-post-btn svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        #tw {
            position: fixed;
            top: clamp(14px, 4vw, 22px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: calc(100vw - 32px);
        }
        .toast {
            background: var(--bg3);
            border: 1px solid var(--brd2);
            border-radius: 100px;
            padding: 11px 18px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .55);
            animation: tIn .3s cubic-bezier(.34, 1.2, .64, 1) both;
            white-space: nowrap;
        }
        .toast.out {
            animation: tOut .25s ease forwards;
        }
        @keyframes tIn {
            from {
                transform: translateY(-14px);
                opacity: 0;
            }
            to {
                transform: none;
                opacity: 1;
            }
        }
        @keyframes tOut {
            to {
                transform: translateY(-10px);
                opacity: 0;
            }
        }
        .td {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .tg {
            background: var(--ok);
        }
        .tp {
            background: var(--p);
        }
        .tr {
            background: var(--danger);
        }
        .to {
            background: var(--warn);
        }

        @media (min-width:768px) {
            .side-nav {
                display: flex;
            }
            .bottom-nav {
                display: none;
            }
            .main {
                padding-bottom: 24px;
            }
        }
        @media (min-width:1024px) {
            .side-nav {
                width: 82px;
            }
            .create-col {
                max-width: 640px;
            }
        }
        .main::-webkit-scrollbar,
        .side-nav::-webkit-scrollbar {
            width: 0;
        }

        .cat-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 0;
            gap: 10px;
            color: var(--muted);
            font-size: 13px;
        }
        .cat-loading .spinner-sm {
            width: 18px;
            height: 18px;
            border: 2px solid var(--brd2);
            border-top-color: var(--p);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0;
        }
        .cat-empty {
            padding: 12px 0;
            color: var(--muted2);
            font-size: 13px;
            text-align: center;
        }

        /* ── mention highlight styling ── */
        .mention-highlight {
            background: var(--pdim);
            color: var(--pl);
            border-radius: 4px;
            padding: 0 2px;
            font-weight: 600;
        }
        .mention-suggestions {
            background: var(--bg3);
            border: 1px solid var(--brd2);
            border-radius: 12px;
            max-height: 180px;
            overflow-y: auto;
            position: absolute;
            z-index: 60;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
            display: none;
            padding: 6px 0;
        }
        .mention-suggestions .suggestion-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background .1s;
            font-size: 14px;
        }
        .mention-suggestions .suggestion-item:hover,
        .mention-suggestions .suggestion-item.active {
            background: var(--pdim);
        }
        .mention-suggestions .suggestion-item img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg4);
        }
        .mention-suggestions .suggestion-item .s-name {
            font-weight: 600;
        }
        .mention-suggestions .suggestion-item .s-handle {
            font-size: 12px;
            color: var(--muted);
        }
        .mention-suggestions .suggestion-item .s-badge {
            font-size: 10px;
            background: var(--pdim);
            color: var(--pl);
            padding: 2px 8px;
            border-radius: 100px;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <!-- ══ TOAST CONTAINER ══ -->
    <div id="tw"></div>

    <div class="layout">

        <!-- ════ SIDE NAV ════ -->
        <nav class="side-nav">
            <div class="side-logo"><a href="index.html">◈</a></div>
            <a href="index.html" class="side-btn">
                <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
                <span>Home</span>
            </a>
            <a href="search.html" class="side-btn">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>Search</span>
            </a>
            <a href="create.html" class="side-btn active">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span>Create</span>
            </a>
            <a href="video.html" class="side-btn">
                <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                <span>Video</span>
            </a>
            <div class="side-gap"></div>
            <a href="profile.html" class="side-btn" id="sideProfileBtn">
                <img class="side-av" id="sideAv" src="" alt="" onerror="this.style.display='none'">
                <span>Profile</span>
            </a>
        </nav>

        <!-- ════ MAIN ════ -->
        <div class="main" id="mainScroll">
            <div class="create-col">

                <!-- Topbar -->
                <div class="topbar">
                    <div class="topbar-left">
                        <span class="topbar-title" id="pageTitle">Create</span>
                    </div>
                    <div class="topbar-actions">
                        <!-- Theme toggle is global via global.js -->
                    </div>
                </div>

                <!-- Tabs -->
                <div class="create-tabs">
                    <button class="create-tab active" data-tab="post" onclick="switchTab(this, 'post')">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        Create Post
                    </button>
                    <button class="create-tab" data-tab="sell" onclick="switchTab(this, 'sell')">
                        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                        Sell Item
                    </button>
                </div>

                <!-- Panel: Create Post -->
                <div class="panel active" id="panel-post">
                    <div id="post-form">
                        <!-- Title -->
                        <div class="form-group">
                            <label class="form-lbl">Title</label>
                            <input class="form-inp" id="postTitle" type="text" placeholder="What's on your mind?" maxlength="100">
                            <span class="char-c" id="postTitleCount">0 / 100</span>
                        </div>

                        <!-- Content (with mention support) -->
                        <div class="form-group" style="position:relative;">
                            <label class="form-lbl">Content</label>
                            <textarea class="form-inp" id="postContent" placeholder="Write your post content... Use @ to mention someone" rows="6"></textarea>
                            <div class="mention-suggestions" id="mentionSuggestions"></div>
                            <span class="char-c" id="postContentCount">0 characters</span>
                        </div>

                        <!-- Description -->
                        <div class="form-group">
                            <label class="form-lbl">Description <span style="font-weight:400;color:var(--muted2);">(optional)</span></label>
                            <input class="form-inp" id="postDescription" type="text" placeholder="Brief description...">
                        </div>

                        <!-- Category (post) – uses predefined list via modal -->
                        <div class="form-group">
                            <label class="form-lbl">Category</label>
                            <button class="category-selector" onclick="openCategoryModal('post')">
                                <span id="postCategoryDisplay" class="placeholder">Select a category</span>
                                <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                            <input type="hidden" id="postCategory" value="">
                        </div>

                        <!-- Tags -->
                        <div class="form-group">
                            <label class="form-lbl">Tags <span style="font-weight:400;color:var(--muted2);">(max 3)</span></label>
                            <div class="tag-pills" id="postTags"></div>
                            <div class="tag-input-row">
                                <input class="form-inp" id="postTagInput" type="text" placeholder="Add a tag..." maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault();addPostTag();}">
                                <button onclick="addPostTag()">Add</button>
                            </div>
                        </div>

                        <!-- Media -->
                        <div class="form-group">
                            <label class="form-lbl">Media <span style="font-weight:400;color:var(--muted2);">(image or video, max 30s)</span></label>
                            <div class="upload-row">
                                <input class="form-inp" id="postMediaUrlInput" type="text" placeholder="Paste image or YouTube link..." oninput="previewPostMedia()">
                                <button class="upload-btn" onclick="document.getElementById('postFileInput').click()">
                                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    Upload
                                </button>
                            </div>
                            <input type="file" id="postFileInput" accept="image/*,video/*" style="display:none" onchange="handlePostUpload(event)">
                            <div class="upload-progress" id="postProgress" style="display:none;">
                                <div class="upload-progress-bar" id="postProgressBar"></div>
                            </div>
                            <div class="image-scroll" id="postImageGrid"></div>
                            <input type="hidden" id="postMediaUrl" value="">
                            <input type="hidden" id="postMediaType" value="">
                            <input type="hidden" id="postPublicId" value="">
                        </div>

                        <button class="btn-primary" onclick="submitPost()">Publish Post</button>
                    </div>
                </div>

                <!-- Panel: Sell Item – DATABASE-DRIVEN CATEGORIES + WHATSAPP -->
                <div class="panel" id="panel-sell">
                    <div id="sell-form">
                        <!-- Item Name -->
                        <div class="form-group">
                            <label class="form-lbl">Item Name</label>
                            <input class="form-inp" id="itemTitle" type="text" placeholder="What are you selling?" maxlength="80">
                        </div>

                        <!-- Price -->
                        <div class="form-group">
                            <label class="form-lbl">Price (₦)</label>
                            <div class="price-wrap">
                                <span class="currency">₦</span>
                                <input class="form-inp" id="itemPrice" type="text" inputmode="numeric" placeholder="5000" maxlength="12" oninput="formatPrice(this)">
                            </div>
                        </div>

                        <!-- ── CATEGORY & SUBCATEGORY (DB-driven) ── -->
                        <div class="category-row">
                            <div class="form-group">
                                <label class="form-lbl">Category</label>
                                <select class="form-inp" id="itemCategorySelect" onchange="onCategoryChange(this.value)">
                                    <option value="">Loading categories...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-lbl">Subcategory</label>
                                <select class="form-inp" id="itemSubcategorySelect" disabled>
                                    <option value="">Select a category first</option>
                                </select>
                            </div>
                        </div>
                        <input type="hidden" id="itemCategoryId" value="">
                        <input type="hidden" id="itemSubcategoryId" value="">

                        <!-- Condition -->
                        <div class="form-group">
                            <label class="form-lbl">Condition</label>
                            <div class="condition-row">
                                <div class="condition-opt active" data-condition="New" onclick="selectCondition(this)">New</div>
                                <div class="condition-opt" data-condition="Used" onclick="selectCondition(this)">Used</div>
                                <div class="condition-opt" data-condition="Fair" onclick="selectCondition(this)">Fair</div>
                            </div>
                            <input type="hidden" id="itemCondition" value="New">
                        </div>

                        <!-- Location -->
                        <div class="form-group">
                            <label class="form-lbl">Location</label>
                            <div class="location-row">
                                <input class="form-inp" id="itemLocation" type="text" placeholder="Enter location or tap detect">
                                <button class="location-btn" onclick="detectLocation()">
                                    <svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"/></svg>
                                    Detect
                                </button>
                            </div>
                            <div class="location-status" id="locationStatus"></div>
                            <input type="hidden" id="itemLat" value="">
                            <input type="hidden" id="itemLng" value="">
                        </div>

                        <!-- ─── WHATSAPP NUMBER ─── -->
                        <div class="form-group">
                            <label class="form-lbl">WhatsApp Number <span style="font-weight:400;color:var(--muted2);">(optional)</span></label>
                            <input class="form-inp" id="itemWhatsApp" type="tel" placeholder="e.g. 2348012345678" maxlength="15">
                            <span style="font-size:11px;color:var(--muted2);">Include country code without '+'.</span>
                        </div>

                        <!-- Description -->
                        <div class="form-group">
                            <label class="form-lbl">Description</label>
                            <textarea class="form-inp" id="itemDescription" placeholder="Describe your item..." rows="3"></textarea>
                        </div>

                        <!-- Images -->
                        <div class="form-group">
                            <label class="form-lbl">Images <span style="font-weight:400;color:var(--muted2);">(up to 5)</span></label>
                            <div class="upload-row">
                                <input class="form-inp" id="marketImageUrlInput" type="text" placeholder="Paste image URL..." oninput="previewMarketUrl()">
                                <button class="upload-btn" onclick="document.getElementById('marketFileInput').click()">
                                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    Upload
                                </button>
                            </div>
                            <input type="file" id="marketFileInput" accept="image/*" multiple style="display:none" onchange="handleMarketUpload(event)">
                            <div class="upload-progress" id="marketProgress" style="display:none;">
                                <div class="upload-progress-bar" id="marketProgressBar"></div>
                            </div>
                            <div class="image-scroll" id="marketImageGrid"></div>
                        </div>

                        <button class="btn-primary" onclick="submitItem()">List Item</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- ════ BOTTOM NAV ════ -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
                <span>Home</span>
            </a>

            <a href="search.html" class="nav-item">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>Search</span>
            </a>

            <button class="add-post-btn" aria-label="Create" onclick="window.location.href='create.html'">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>

            <a href="video.html" class="nav-item">
                <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                <span>Video</span>
            </a>

            <a href="profile.html" class="nav-item" id="navProfileBtn">
                <img class="nav-av" id="navAv" src="" alt="" onerror="this.style.background='linear-gradient(135deg,#1a1035,#3b1a6b)'" />
                <span>Profile</span>
            </a>
        </nav>

    </div>

    <!-- ══════════════════════════════════════════
         CATEGORY MODAL (for posts)
    ══════════════════════════════════════════ -->
    <div class="modal-overlay" id="categoryModal" onclick="if(event.target===this)closeCategoryModal()">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <span class="modal-title" id="categoryModalTitle">Select Category</span>
                <button class="modal-close" onclick="closeCategoryModal()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-category-grid" id="categoryModalGrid"></div>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════
         FULLSCREEN IMAGE VIEWER
    ══════════════════════════════════════════ -->
    <div class="fullscreen-viewer" id="fullscreenViewer" onclick="if(event.target===this)closeFullscreen()">
        <div class="viewer-header">
            <button class="viewer-close" onclick="closeFullscreen()">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="viewer-body" id="viewerBody">
            <img id="fullscreenImage" src="" alt="Fullscreen image">
        </div>
        <div class="viewer-counter" id="viewerCounter"></div>
    </div>

    <!-- ══════════════════════════════════════════
    PAGE LOGIC – using PostsAPI & ListingsAPI
    ══════════════════════════════════════════ -->
    <script>
        // ── CONFIG ──
        const CLOUDINARY_CLOUD_NAME = 'duzyf1kda';
        const CLOUDINARY_IMAGE_UPLOAD_PRESET = 'image_upload';
        const CLOUDINARY_VIDEO_UPLOAD_PRESET = 'video_upload';
        const CLOUDINARY_MARKET_UPLOAD_PRESET = 'market_upload';

        // Predefined categories for posts (separate from marketplace)
        const PREDEFINED_CATEGORIES = [
            "Technology", "Education", "Campus gist", "News & Updates",
            "Entertainment", "Movies", "Lifestyle", "Business & Finance",
            "Opinion / Thoughts", "Health & Fitness", "Travel & Culture", "Gaming",
            "Memes", "Science", "Fashion", "Music"
        ];

        const MAX_FILE_SIZE = 5 * 1024 * 1024;
        const MAX_VIDEO_SIZE = 15 * 1024 * 1024;

        let postTags = [];
        let marketImages = [];
        let marketLat = null;
        let marketLng = null;
        let selectedPostCategory = '';
        let selectedCondition = 'New';
        let lastUploadTime = 0;
        let categoryModalMode = 'post';
        let fullscreenImages = [];
        let fullscreenIndex = 0;

        // ── DB-driven category state ──
        let dbCategories = [];
        let dbSubcategories = [];
        let selectedCategoryId = '';
        let selectedSubcategoryId = '';
        let categoriesLoaded = false;

        // ──────────────────────────────────────────────────────────────
        // TOAST
        // ──────────────────────────────────────────────────────────────
        function showToast(msg, type) {
            type = type || 'p';
            const w = document.getElementById('tw');
            const el = document.createElement('div');
            el.className = 'toast';
            el.innerHTML = '<div class="td t' + type + '"></div>' + msg;
            w.appendChild(el);
            setTimeout(function() {
                el.classList.add('out');
                setTimeout(function() { el.remove(); }, 260);
            }, 2600);
        }

        // ──────────────────────────────────────────────────────────────
        // TABS
        // ──────────────────────────────────────────────────────────────
        function switchTab(el, tab) {
            document.querySelectorAll('.create-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('panel-' + tab).classList.add('active');
            if (tab === 'sell') loadCategories();

            // Re-init mention on post panel when switching back
            if (tab === 'post') {
                setTimeout(function() {
                    const textarea = document.getElementById('postContent');
                    if (textarea && window.Mentions) {
                        window.Mentions.initMentions(textarea);
                    }
                }, 200);
            }
        }

        // ──────────────────────────────────────────────────────────────
        // CATEGORY MODAL (for posts – static list)
        // ──────────────────────────────────────────────────────────────
        function openCategoryModal(mode) {
            categoryModalMode = mode;
            const grid = document.getElementById('categoryModalGrid');
            const title = document.getElementById('categoryModalTitle');
            const selected = selectedPostCategory;

            title.textContent = 'Select Category';

            grid.innerHTML = PREDEFINED_CATEGORIES.map(cat =>
                `<div class="modal-category-item ${selected === cat ? 'active' : ''}" onclick="selectPostCategory('${cat.replace(/'/g, "\\'")}')">${cat}</div>`
            ).join('');

            document.getElementById('categoryModal').classList.add('open');
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.remove('open');
        }

        function selectPostCategory(cat) {
            selectedPostCategory = cat;
            document.getElementById('postCategory').value = cat;
            document.getElementById('postCategoryDisplay').textContent = cat;
            document.getElementById('postCategoryDisplay').classList.remove('placeholder');
            closeCategoryModal();
            document.querySelectorAll('.modal-category-item').forEach(el => {
                el.classList.toggle('active', el.textContent === cat);
            });
        }

        // ──────────────────────────────────────────────────────────────
        // POST TAGS
        // ──────────────────────────────────────────────────────────────
        function addPostTag() {
            const input = document.getElementById('postTagInput');
            const tag = input.value.trim();
            if (!tag) return;
            if (postTags.length >= 3) { showToast('Max 3 tags allowed', 'o'); return; }
            if (postTags.includes(tag)) { showToast('Tag already added', 'o'); return; }
            postTags.push(tag);
            input.value = '';
            renderPostTags();
        }

        function removePostTag(idx) {
            postTags.splice(idx, 1);
            renderPostTags();
        }

        function renderPostTags() {
            const container = document.getElementById('postTags');
            container.innerHTML = postTags.map((t, i) =>
                `<span class="tag-pill">${t}<button onclick="removePostTag(${i})">×</button></span>`
            ).join('');
        }

        // ──────────────────────────────────────────────────────────────
        // CONDITION
        // ──────────────────────────────────────────────────────────────
        function selectCondition(el) {
            document.querySelectorAll('.condition-opt').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            selectedCondition = el.dataset.condition;
            document.getElementById('itemCondition').value = selectedCondition;
        }

        // ──────────────────────────────────────────────────────────────
        // PRICE FORMAT
        // ──────────────────────────────────────────────────────────────
        function formatPrice(input) {
            let raw = input.value.replace(/[^0-9,]/g, '');
            let digits = raw.replace(/,/g, '');
            digits = digits.slice(0, 9);
            if (digits.length > 0) {
                input.value = Number(digits).toLocaleString('en-US');
            } else {
                input.value = '';
            }
        }

        // ──────────────────────────────────────────────────────────────
        // LOCATION DETECTION
        // ──────────────────────────────────────────────────────────────
        function detectLocation() {
            const status = document.getElementById('locationStatus');
            if (!navigator.geolocation) {
                status.textContent = 'Geolocation not supported';
                status.style.color = 'var(--danger)';
                return;
            }
            status.textContent = 'Detecting location...';
            status.style.color = 'var(--muted)';

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    marketLat = lat;
                    marketLng = lng;
                    document.getElementById('itemLat').value = lat;
                    document.getElementById('itemLng').value = lng;

                    try {
                        const res = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`, {
                                headers: { 'Accept-Language': 'en' }
                            }
                        );
                        const data = await res.json();
                        if (data && data.display_name) {
                            const address = data.address || {};
                            const city = address.city || address.town || address.village || '';
                            const state = address.state || '';
                            const placeName = [city, state].filter(Boolean).join(', ') || data.display_name;
                            document.getElementById('itemLocation').value = placeName;
                            status.textContent = '📍 ' + placeName;
                            status.style.color = 'var(--ok)';
                        } else {
                            document.getElementById('itemLocation').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                            status.textContent = 'Location detected (coordinates)';
                            status.style.color = 'var(--ok)';
                        }
                    } catch (e) {
                        document.getElementById('itemLocation').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                        status.textContent = 'Location detected (coordinates)';
                        status.style.color = 'var(--ok)';
                    }
                },
                (error) => {
                    status.textContent = 'Could not detect location. Enter manually.';
                    status.style.color = 'var(--danger)';
                    marketLat = null;
                    marketLng = null;
                }, { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ──────────────────────────────────────────────────────────────
        // CLOUDINARY UPLOAD
        // ──────────────────────────────────────────────────────────────
        async function uploadToCloudinary(file, mode = 'post') {
            const isVideo = file.type.startsWith('video');
            const resourceType = isVideo ? 'video' : 'image';
            let preset = CLOUDINARY_IMAGE_UPLOAD_PRESET;
            if (mode === 'market') preset = CLOUDINARY_MARKET_UPLOAD_PRESET;
            else if (isVideo) preset = CLOUDINARY_VIDEO_UPLOAD_PRESET;

            const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', preset);

            const res = await fetch(url, { method: 'POST', body: formData });
            const data = await res.json();
            if (!res.ok || data.error) {
                throw new Error(data.error?.message || 'Upload failed');
            }
            return { url: data.secure_url, type: resourceType, public_id: data.public_id };
        }

        async function getVideoDuration(file) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.src = URL.createObjectURL(file);
                video.onloadedmetadata = () => {
                    URL.revokeObjectURL(video.src);
                    resolve(video.duration);
                };
                video.onerror = () => resolve(0);
            });
        }

        // ──────────────────────────────────────────────────────────────
        // GET CURRENT USER (for UI only – APIs handle auth)
        // ──────────────────────────────────────────────────────────────
        function getCurrentUser() {
            if (window.AuthUser && typeof window.AuthUser.getCurrentUser === 'function') {
                return window.AuthUser.getCurrentUser();
            }
            if (typeof window.getCurrentUser === 'function') {
                return window.getCurrentUser();
            }
            return null;
        }

        // ──────────────────────────────────────────────────────────────
        // POST MEDIA
        // ──────────────────────────────────────────────────────────────
        function previewPostMedia() {
            const input = document.getElementById('postMediaUrlInput');
            const url = input.value.trim();
            if (!url) {
                document.getElementById('postImageGrid').innerHTML = '';
                document.getElementById('postMediaUrl').value = '';
                document.getElementById('postMediaType').value = '';
                document.getElementById('postPublicId').value = '';
                input.placeholder = 'Paste image or YouTube link...';
                return;
            }

            const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
            const isImage = /\.(jpg|jpeg|png|gif|webp)/i.test(url) || url.includes('cloudinary.com') || url.includes(
                'imgur.com');

            if (ytMatch) {
                document.getElementById('postMediaUrl').value = `https://www.youtube.com/embed/${ytMatch[1]}`;
                document.getElementById('postMediaType').value = 'video';
                document.getElementById('postPublicId').value = 'youtube_' + ytMatch[1];
                input.value = '🎬 Video linked';
                input.style.color = 'var(--pl)';
                input.style.fontWeight = '600';
                document.getElementById('postImageGrid').innerHTML = `
                        <div class="image-thumb">
                            <img src="https://img.youtube.com/vi/${ytMatch[1]}/hqdefault.jpg" alt="YouTube video">
                            <div class="cover-badge">VIDEO</div>
                            <button class="remove-btn" onclick="removePostMedia()">×</button>
                        </div>
                    `;
                showToast('YouTube video linked', 'p');
            } else if (isImage) {
                document.getElementById('postMediaUrl').value = url;
                document.getElementById('postMediaType').value = 'image';
                document.getElementById('postPublicId').value = 'external_' + Date.now();
                input.value = '🖼️ Image linked';
                input.style.color = 'var(--pl)';
                input.style.fontWeight = '600';
                document.getElementById('postImageGrid').innerHTML = `
                        <div class="image-thumb">
                            <img src="${url}" alt="Image">
                            <div class="cover-badge">IMAGE</div>
                            <button class="remove-btn" onclick="removePostMedia()">×</button>
                        </div>
                    `;
                showToast('Image linked', 'p');
            }
        }

        async function handlePostUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const isVideo = file.type.startsWith('video');
            const isImage = file.type.startsWith('image');

            if (!isImage && !isVideo) {
                showToast('Only images or videos allowed', 'o');
                return;
            }

            if (isImage && file.size > MAX_FILE_SIZE) {
                showToast('Image too large (max 5MB)', 'o');
                return;
            }
            if (isVideo && file.size > MAX_VIDEO_SIZE) {
                showToast('Video too large (max 15MB)', 'o');
                return;
            }

            if (isVideo) {
                const duration = await getVideoDuration(file);
                if (duration > 120) {
                    showToast('Video must be 2 mins or less', 'o');
                    return;
                }
            }

            if (Date.now() - lastUploadTime < 8000) {
                showToast('Please wait before uploading again', 'o');
                return;
            }
            lastUploadTime = Date.now();

            const progress = document.getElementById('postProgress');
            const bar = document.getElementById('postProgressBar');
            progress.style.display = 'block';
            bar.style.width = '0%';

            let interval = setInterval(() => {
                if (parseFloat(bar.style.width) < 85) {
                    bar.style.width = (parseFloat(bar.style.width) + 8) + '%';
                }
            }, 400);

            try {
                const result = await uploadToCloudinary(file, 'post');
                clearInterval(interval);
                bar.style.width = '100%';

                document.getElementById('postMediaUrl').value = result.url;
                document.getElementById('postMediaType').value = result.type;
                document.getElementById('postPublicId').value = result.public_id;

                const input = document.getElementById('postMediaUrlInput');
                input.value = result.type === 'video' ? '🎬 Video uploaded' : '🖼️ Image uploaded';
                input.style.color = 'var(--pl)';
                input.style.fontWeight = '600';

                const grid = document.getElementById('postImageGrid');
                if (result.type === 'video') {
                    grid.innerHTML = `
                            <div class="image-thumb" style="flex:0 0 120px;height:80px;">
                                <video src="${result.url}" style="width:100%;height:100%;object-fit:cover;"></video>
                                <div class="cover-badge">VIDEO</div>
                                <button class="remove-btn" onclick="removePostMedia()">×</button>
                            </div>
                        `;
                } else {
                    grid.innerHTML = `
                            <div class="image-thumb">
                                <img src="${result.url}" alt="Uploaded image">
                                <div class="cover-badge">IMAGE</div>
                                <button class="remove-btn" onclick="removePostMedia()">×</button>
                            </div>
                        `;
                }

                setTimeout(() => { progress.style.display = 'none'; }, 1500);
                showToast(result.type === 'video' ? 'Video uploaded!' : 'Image uploaded!', 'g');

            } catch (e) {
                clearInterval(interval);
                progress.style.display = 'none';
                showToast('Upload failed: ' + e.message, 'r');
            }
            event.target.value = '';
        }

        function removePostMedia() {
            document.getElementById('postMediaUrl').value = '';
            document.getElementById('postMediaType').value = '';
            document.getElementById('postPublicId').value = '';
            const input = document.getElementById('postMediaUrlInput');
            input.value = '';
            input.style.color = '';
            input.style.fontWeight = '';
            input.placeholder = 'Paste image or YouTube link...';
            document.getElementById('postImageGrid').innerHTML = '';
            document.getElementById('postFileInput').value = '';
            showToast('Media removed', 'o');
        }

        // ──────────────────────────────────────────────────────────────
        // MARKET IMAGES (multiple)
        // ──────────────────────────────────────────────────────────────
        function previewMarketUrl() {
            const input = document.getElementById('marketImageUrlInput');
            const url = input.value.trim();
            if (!url) return;
            if (marketImages.length >= 5) { showToast('Max 5 images', 'o'); return; }
            if (marketImages.some(i => i.url === url)) { showToast('Image already added', 'o'); return; }

            const isImage = /\.(jpg|jpeg|png|gif|webp)/i.test(url) || url.includes('cloudinary.com') || url.includes(
                'imgur.com');
            if (!isImage) { showToast('Please enter a valid image URL', 'o'); return; }

            marketImages.push({ url: url, public_id: 'external_' + Date.now(), isUploaded: true, uploading: false });
            input.value = '🖼️ Image added';
            input.style.color = 'var(--pl)';
            input.style.fontWeight = '600';
            renderMarketImages();
            showToast('Image added', 'p');
        }

        async function handleMarketUpload(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;
            const remaining = 5 - marketImages.length;
            if (remaining <= 0) {
                showToast('Max 5 images already added', 'o');
                event.target.value = '';
                return;
            }

            const progress = document.getElementById('marketProgress');
            const bar = document.getElementById('marketProgressBar');
            const toUpload = files.slice(0, remaining);

            for (const file of toUpload) {
                if (file.size > MAX_FILE_SIZE) {
                    showToast(`${file.name} is too large`, 'o');
                    continue;
                }
                if (!file.type.startsWith('image/')) {
                    showToast('Only image files allowed', 'o');
                    continue;
                }

                const localUrl = URL.createObjectURL(file);
                const idx = marketImages.length;
                marketImages.push({ url: localUrl, public_id: '', isUploaded: false, uploading: true });
                renderMarketImages();

                progress.style.display = 'block';
                bar.style.width = '0%';
                let interval = setInterval(() => {
                    if (parseFloat(bar.style.width) < 85) {
                        bar.style.width = (parseFloat(bar.style.width) + 8) + '%';
                    }
                }, 400);

                try {
                    const result = await uploadToCloudinary(file, 'market');
                    URL.revokeObjectURL(localUrl);
                    clearInterval(interval);
                    bar.style.width = '100%';
                    marketImages[idx] = {
                        url: result.url,
                        public_id: result.public_id,
                        isUploaded: true,
                        uploading: false
                    };
                    renderMarketImages();
                    setTimeout(() => { progress.style.display = 'none'; }, 500);
                } catch (e) {
                    clearInterval(interval);
                    progress.style.display = 'none';
                    URL.revokeObjectURL(localUrl);
                    marketImages.splice(idx, 1);
                    renderMarketImages();
                    showToast('Upload failed: ' + e.message, 'r');
                }
            }
            event.target.value = '';
        }

        function removeMarketImage(idx) {
            if (marketImages[idx]?.url?.startsWith('blob:')) {
                URL.revokeObjectURL(marketImages[idx].url);
            }
            marketImages.splice(idx, 1);
            renderMarketImages();
            if (marketImages.length === 0) {
                const input = document.getElementById('marketImageUrlInput');
                input.value = '';
                input.style.color = '';
                input.style.fontWeight = '';
            }
        }

        function renderMarketImages() {
            const grid = document.getElementById('marketImageGrid');
            if (!grid) return;

            const thumbHtml = marketImages.map((img, i) =>
                `<div class="image-thumb" onclick="openFullscreen(${i})">
                        <img src="${img.url}" onerror="this.style.display='none'">
                        ${img.uploading ? `<div class="uploading-overlay"><div class="spinner"></div></div>` : ''}
                        <button class="remove-btn" onclick="event.stopPropagation();removeMarketImage(${i})" ${img.uploading ? 'disabled' : ''}>×</button>
                        ${i === 0 && !img.uploading ? `<div class="cover-badge">COVER</div>` : ''}
                    </div>`
            ).join('');

            const addBtn = marketImages.length < 5 ?
                `<div class="image-add-btn" onclick="document.getElementById('marketFileInput').click()">
                        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add
                    </div>` :
                '';

            grid.innerHTML = thumbHtml + addBtn;
            fullscreenImages = marketImages.filter(i => i.isUploaded).map(i => i.url);
        }

        // ──────────────────────────────────────────────────────────────
        // FULLSCREEN VIEWER
        // ──────────────────────────────────────────────────────────────
        function openFullscreen(index) {
            const uploaded = marketImages.filter(i => i.isUploaded);
            if (uploaded.length === 0) return;

            fullscreenImages = uploaded.map(i => i.url);
            fullscreenIndex = Math.min(index, fullscreenImages.length - 1);

            const viewer = document.getElementById('fullscreenViewer');
            const img = document.getElementById('fullscreenImage');
            const counter = document.getElementById('viewerCounter');

            img.src = fullscreenImages[fullscreenIndex];
            counter.textContent = `${fullscreenIndex + 1} / ${fullscreenImages.length}`;

            viewer.classList.add('open');
            document.body.style.overflow = 'hidden';

            let startY = 0;
            let isDragging = false;
            let currentY = 0;

            const onTouchStart = (e) => {
                startY = e.touches[0].clientY;
                isDragging = true;
                currentY = 0;
                viewer.classList.add('dragging');
            };

            const onTouchMove = (e) => {
                if (!isDragging) return;
                currentY = e.touches[0].clientY - startY;
                if (currentY > 0) {
                    const opacity = Math.max(0, 1 - currentY / 300);
                    viewer.style.opacity = opacity;
                    img.style.transform = `translateY(${currentY}px) scale(${1 - currentY/600})`;
                }
            };

            const onTouchEnd = () => {
                isDragging = false;
                viewer.classList.remove('dragging');
                if (currentY > 120) {
                    closeFullscreen();
                } else {
                    viewer.style.opacity = '';
                    img.style.transform = '';
                }
                currentY = 0;
            };

            viewer._touchStart = onTouchStart;
            viewer._touchMove = onTouchMove;
            viewer._touchEnd = onTouchEnd;

            viewer.addEventListener('touchstart', onTouchStart, { passive: true });
            viewer.addEventListener('touchmove', onTouchMove, { passive: true });
            viewer.addEventListener('touchend', onTouchEnd, { passive: true });

            document.addEventListener('keydown', viewer._keyHandler = (e) => {
                if (e.key === 'Escape') closeFullscreen();
                if (e.key === 'ArrowLeft' && fullscreenIndex > 0) {
                    fullscreenIndex--;
                    img.src = fullscreenImages[fullscreenIndex];
                    counter.textContent = `${fullscreenIndex + 1} / ${fullscreenImages.length}`;
                }
                if (e.key === 'ArrowRight' && fullscreenIndex < fullscreenImages.length - 1) {
                    fullscreenIndex++;
                    img.src = fullscreenImages[fullscreenIndex];
                    counter.textContent = `${fullscreenIndex + 1} / ${fullscreenImages.length}`;
                }
            });
        }

        function closeFullscreen() {
            const viewer = document.getElementById('fullscreenViewer');
            viewer.classList.remove('open');
            document.body.style.overflow = '';
            viewer.style.opacity = '';
            const img = document.getElementById('fullscreenImage');
            img.style.transform = '';
            img.src = '';
            if (viewer._touchStart) viewer.removeEventListener('touchstart', viewer._touchStart);
            if (viewer._touchMove) viewer.removeEventListener('touchmove', viewer._touchMove);
            if (viewer._touchEnd) viewer.removeEventListener('touchend', viewer._touchEnd);
            if (viewer._keyHandler) document.removeEventListener('keydown', viewer._keyHandler);
        }

        // ──────────────────────────────────────────────────────────────
        // DATABASE-DRIVEN CATEGORIES (using CategoryAPI from listings.js)
        // ──────────────────────────────────────────────────────────────

        async function loadCategories() {
            if (categoriesLoaded) return;
            const sel = document.getElementById('itemCategorySelect');
            sel.innerHTML = '<option value="">Loading...</option>';
            sel.disabled = true;

            try {
                if (!window.CategoryAPI || typeof window.CategoryAPI.loadCategories !== 'function') {
                    console.warn('[DEBUG] CategoryAPI not loaded, trying fallback...');
                    const { data, error } = await window.sb
                        .from('market_categories')
                        .select('*')
                        .eq('active', true)
                        .order('sort_order', { ascending: true });
                    if (error) throw error;
                    dbCategories = data || [];
                } else {
