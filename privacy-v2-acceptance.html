<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Isolated staging browser acceptance</title>
<h1>Staging browser acceptance</h1>
<p>This exercise publishes a synthetic Only Me image and video in staging. It never logs passwords or tokens. Use newly authorized synthetic accounts with app_metadata.privacy_v2_browser_acceptance = true. Keep this tab open while the visible frames run.</p>
<form id="accounts">
<label>Owner synthetic email <input name="owner-email" type="email" required autocomplete="off"></label>
<label>Owner password <input name="owner-password" type="password" required autocomplete="off"></label>
<label>Unapproved synthetic email <input name="denied-email" type="email" required autocomplete="off"></label>
<label>Unapproved password <input name="denied-password" type="password" required autocomplete="off"></label>
<button>Run staging browser exercise</button></form><pre id="results" role="status"></pre>
<iframe id="surface" title="Actual staging UI" style="width:100%;height:700px"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="scripts/privacy-v2/browser-acceptance.js"></script>
