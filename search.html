<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Search · Freeupper</title>
<link rel="icon" type="image/png" href="freeupper.png">
<link rel="stylesheet" href="global.css">
<link rel="stylesheet" href="bottom-nav.css" />
<link rel="stylesheet" href="side-nav.css" />
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
button,input,textarea{font-family:inherit;}
svg{overflow:visible;display:block;}
button{cursor:pointer;}

:root{
  --p:#7C3AED; --pd:#6c3fc5; --pl:#a78bfa;
  --pdim:#F2EDFD; --pbrd:#E4D9FB;
  --ok-bg:#DCFCE7; --ok-tx:#16A34A;
  --warn-bg:#FEF3C7; --warn-tx:#D97706;
  --blue-bg:#DBEAFE; --blue-tx:#2563EB;
  --text:#0d0d0d;
  --muted:#6B7280; --muted2:#9CA3AF;
  --brd:#e5e7eb; --brd2:#d1d5db;
  --bg:#ffffff; --bg2:#f9fafb; --bg3:#ffffff; --bg4:#f3f4f6;
  --inp:#f9fafb;
  --danger:#DC2626; --gold:#FFD700; --heart-red:#DC2626;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --text:#f0f0f0; --muted:#9ca3af; --muted2:#6b7280;
  --brd:#2a2a2a; --brd2:#3a3a3a;
  --bg:#000; --bg2:#1a1a1a; --bg3:#242424; --bg4:#2a2a2a;
  --inp:#1f1f1f;
}
html,body{height:100%;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#0d0d0d;}
[data-theme="dark"] body{background:#000;color:#fff;}
body.fu-modal-open{overflow:hidden;}

.layout{display:flex;height:100vh;width:100%;overflow:hidden;}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:90px;}
.main::-webkit-scrollbar{width:0;}
.col{width:100%;max-width:640px;margin:0 auto;padding:20px 18px 40px;}

/* ── Page title / search bar / tabs ── */
.page-title{font-size:32px;font-weight:900;letter-spacing:-.6px;margin-bottom:18px;}
.search-bar{position:relative;margin-bottom:16px;}
.search-bar input{width:100%;padding:15px 46px;border-radius:16px;border:1.5px solid var(--pbrd);background:var(--pdim);color:#0d0d0d;font-size:15px;outline:none;transition:border-color .15s,background .15s;}
[data-theme="dark"] .search-bar input{background:#151016;color:#fff;border-color:#3a2a55;}
.search-bar input:focus{border-color:var(--p);background:#fff;}
[data-theme="dark"] .search-bar input:focus{background:#1a1220;}
.search-bar input::placeholder{color:#9CA3AF;}
.search-bar .ic-left{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--p);}
.search-bar .ic-right{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:#B9AEDD;color:#fff;border:none;border-radius:50%;width:21px;height:21px;display:none;align-items:center;justify-content:center;}
.search-bar .ic-right.show{display:flex;}

.tabs{display:none;gap:26px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #EEF0F3;}
[data-theme="dark"] .tabs{border-color:#1c1c1e;}
.tabs::-webkit-scrollbar{display:none;}
.tabs.visible{display:flex;}
.tab{display:flex;align-items:center;gap:6px;padding:11px 1px;border:none;background:none;color:#9CA3AF;flex-shrink:0;font-size:14px;font-weight:700;border-bottom:2.5px solid transparent;}
.tab.active{color:var(--p);border-bottom-color:var(--p);}

/* ── Discovery / results heads ── */
.section-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin-bottom:13px;}
.section-title svg{width:19px;height:19px;stroke:var(--p);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.discovery-block{margin-bottom:30px;}
.results-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;}
.results-head h2{font-size:22px;font-weight:900;}
.results-head .cnt{color:#9CA3AF;font-weight:600;font-size:15px;margin-left:6px;}
.results-head .sub{color:#6b7280;font-size:13px;margin-top:3px;}

/* ── Recent pills ── */
.recent-wrap{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px;}
.recent-pill{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 13px;border-radius:100px;border:1.5px solid #E9EAEE;background:#fff;font-size:13.5px;font-weight:500;color:#111;}
[data-theme="dark"] .recent-pill{background:#0f0f0f;border-color:#232323;color:#fff;}
.recent-pill svg.clk{width:15px;height:15px;stroke:#9CA3AF;fill:none;stroke-width:2;flex-shrink:0;}
.recent-pill .x-btn{width:18px;height:18px;color:#9CA3AF;flex-shrink:0;}
.recent-pill .x-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;}

/* ── Trending hashtag grid ── */
.trend-tag-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.trend-tag-card{border:1.5px solid #EEF0F3;border-radius:16px;padding:16px;background:#fff;}
[data-theme="dark"] .trend-tag-card{background:#0a0a0a;border-color:#1c1c1e;}
.trend-tag-card .box{width:34px;height:34px;border-radius:10px;background:var(--pdim);display:flex;align-items:center;justify-content:center;margin-bottom:11px;}
.trend-tag-card .box svg{width:16px;height:16px;stroke:var(--p);fill:none;stroke-width:2.4;}
.trend-tag-card .name{font-weight:800;font-size:14.5px;}
.trend-tag-card .cnt{color:var(--p);font-size:12.5px;margin-top:2px;font-weight:500;}

/* ── Suggested users scroll ── */
.sugg-scroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.sugg-scroll::-webkit-scrollbar{display:none;}
.sugg-card{flex-shrink:0;width:100px;text-align:center;}
.sugg-avatar{position:relative;width:64px;height:64px;margin:0 auto 9px;}
.sugg-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#eee;}
.sugg-avatar .vb{position:absolute;bottom:-1px;right:-1px;width:19px;height:19px;border-radius:50%;background:var(--p);border:2px solid #fff;display:flex;align-items:center;justify-content:center;}
.sugg-avatar .vb svg{width:9px;height:9px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.sugg-card .name{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sugg-card .handle{color:#9CA3AF;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:9px;}

/* ── Follow button (matches index.html) ── */
.follow-btn{display:inline-flex;align-items:center;justify-content:center;padding:5px 14px;border-radius:20px;font-size:.72rem;font-weight:700;border:1.5px solid transparent;background:#7C3AED;color:#fff;transition:background .15s,color .15s,border-color .15s,transform .1s;white-space:nowrap;flex-shrink:0;}
.follow-btn:active{transform:scale(.95);}
.follow-btn.hidden-follow{display:none;}
.follow-btn.rel-follow{background:#7C3AED;color:#fff;}
.follow-btn.rel-follow-back{background:#A855F7;color:#fff;}
.follow-btn.rel-following{background:rgba(124,58,237,.12);color:#7C3AED;border-color:rgba(124,58,237,.35);}
.follow-btn.rel-friends{background:rgba(124,58,237,.1);color:#8B5CF6;border-color:rgba(139,92,246,.3);}
[data-theme="dark"] .follow-btn.rel-following{background:rgba(139,92,246,.18);color:#C4B5FD;border-color:rgba(139,92,246,.4);}
[data-theme="dark"] .follow-btn.rel-friends{background:rgba(139,92,246,.15);color:#C4B5FD;border-color:rgba(139,92,246,.35);}

/* ── Trending post feed ── */
.tpost{padding:18px 0;border-bottom:8px solid #F7F7F9;}
[data-theme="dark"] .tpost{border-color:#0a0a0a;}
.tpost .head{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.tpost .head img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#eee;flex-shrink:0;cursor:pointer;}
.tpost .head .meta{flex:1;min-width:0;cursor:pointer;}
.tpost .head .nm{display:flex;align-items:center;gap:5px;font-weight:800;font-size:14.5px;}
.tpost .head .time{color:#9CA3AF;font-size:12.5px;margin-top:1px;}
.tpost .cap{font-size:14.5px;font-weight:500;margin-bottom:11px;line-height:1.4;}
.tpost .media{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/11;}
.tpost .media img{width:100%;height:100%;object-fit:cover;}
.tpost .page-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;}
.tpost .stat-badge{position:absolute;bottom:10px;left:10px;display:flex;align-items:center;gap:5px;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6);}
.tpost .stat-badge svg{width:15px;height:15px;fill:#fff;stroke:none;}
.tpost .play-c{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;}
.tpost .play-c svg{width:20px;height:20px;fill:#fff;stroke:none;margin-left:3px;}

/* ── User row ── */
.user-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #F0F1F4;}
[data-theme="dark"] .user-row{border-color:#161616;}
.user-row .av{position:relative;width:58px;height:58px;flex-shrink:0;}
.user-row .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#eee;}
.user-row .av .vb{position:absolute;bottom:-1px;right:-1px;width:19px;height:19px;border-radius:50%;background:var(--p);border:2px solid #fff;display:flex;align-items:center;justify-content:center;}
.user-row .av .vb svg{width:9px;height:9px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.user-row .info{flex:1;min-width:0;}
.user-row .name-line{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-row .handle{color:#9CA3AF;font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-row .bio{color:#6b7280;font-size:13px;margin-top:3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.user-row .actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}

.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--p);flex-shrink:0;}
.verified-badge svg{width:8.5px;height:8.5px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}

/* ── Tag row ── */
.tag-row{display:flex;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid #F0F1F4;}
[data-theme="dark"] .tag-row{border-color:#161616;}
.tag-row .box{width:46px;height:46px;border-radius:14px;background:var(--pdim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tag-row .box svg{width:20px;height:20px;stroke:var(--p);fill:none;stroke-width:2.4;}
.tag-row .info{flex:1;min-width:0;}
.tag-row .name{font-weight:800;font-size:16px;}
.tag-row .cnt{color:#9CA3AF;font-size:13.5px;margin-top:2px;}
.tag-row .chev{color:#C7CAD1;flex-shrink:0;}
.tag-row .chev svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;}

/* ── Photo grid ── */
.sq-grid{column-count:2;column-gap:10px;}
.sq-item{position:relative;break-inside:avoid;margin-bottom:10px;border-radius:14px;overflow:hidden;background:#eee;display:inline-block;width:100%;}
.sq-item img{width:100%;height:auto;display:block;}
.sq-item video{width:100%;height:auto;display:block;}
@media (min-width:768px) and (max-width:1023px){ .sq-grid{column-count:4;} }
@media (min-width:1024px){ .sq-grid{column-count:5;} }
.sq-item .heart-badge{position:absolute;bottom:8px;left:8px;display:flex;align-items:center;gap:4px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6);}
.sq-item .page-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:100px;}
.sq-text-preview{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;color:#fff;font-size:11px;font-weight:700;line-height:1.3;}

/* ── Video grid ── */
.vid-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (min-width:768px) and (max-width:1023px){ .vid-grid{grid-template-columns:repeat(4,1fr);} }
@media (min-width:1024px){ .vid-grid{grid-template-columns:repeat(5,1fr);} }
.vid-card .thumb{position:relative;width:100%;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;}
.vid-card .thumb img{width:100%;height:100%;object-fit:cover;}
.vid-card .dur{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:100px;}
.vid-card .title{font-weight:700;font-size:12px;line-height:1.3;margin-top:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
.vid-card .author-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;}
.vid-card .author{display:flex;align-items:center;gap:5px;min-width:0;flex:1;cursor:pointer;}
.vid-card .author img{width:17px;height:17px;border-radius:50%;object-fit:cover;background:#eee;flex-shrink:0;}
.vid-card .au-name{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70px;}
.vid-card .views{font-size:10.5px;color:#9CA3AF;flex-shrink:0;white-space:nowrap;}

/* ── Post cards ── */
.pcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.pcard .head{display:flex;align-items:center;gap:8px;margin-bottom:9px;cursor:pointer;}
.pcard .head img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#eee;flex-shrink:0;}
.pcard .head .nm{font-weight:700;font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pcard .media{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#eee;}
.pcard .media img{width:100%;height:100%;object-fit:cover;}
.pcard .stats{position:absolute;bottom:9px;left:9px;display:flex;gap:11px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5);}
.pcard .stats span{display:flex;align-items:center;gap:4px;}
.pcard .stats svg{width:14px;height:14px;fill:#fff;stroke:none;}

/* ── Market cards ── */
.market-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.market-card .img-wrap{position:relative;width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#eee;}
.market-card .img-wrap img{width:100%;height:100%;object-fit:cover;}
.market-card .featured{position:absolute;top:10px;left:10px;background:var(--p);color:#fff;font-size:11px;font-weight:800;padding:4px 11px;border-radius:100px;}
.market-card .fav{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;}
.market-card .fav svg{width:16px;height:16px;stroke:#111;fill:none;stroke-width:2;}
.market-card .title{font-weight:700;font-size:14.5px;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.market-card .price{font-weight:800;font-size:16px;color:var(--p);margin-top:3px;}
.market-card .meta-row{display:flex;align-items:center;justify-content:space-between;margin-top:5px;}
.market-card .loc{display:flex;align-items:center;gap:4px;color:#9CA3AF;font-size:12px;}
.market-card .loc svg{width:12px;height:12px;stroke:#9CA3AF;fill:none;stroke-width:2.2;}
.market-card .cond{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:100px;}
.cond-new{background:var(--blue-bg);color:var(--blue-tx);}
.cond-good{background:var(--ok-bg);color:var(--ok-tx);}
.cond-fair{background:var(--warn-bg);color:var(--warn-tx);}

/* ── Hashtag header ── */
.tag-header{display:block;margin-bottom:8px;}
.tag-header .top-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
.tag-header .back{width:38px;height:38px;border-radius:50%;border:none;background:#F3F4F6;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
[data-theme="dark"] .tag-header .back{background:#151515;}
.tag-header .back svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}
[data-theme="dark"] .tag-header .back svg{stroke:#fff;}
.tag-header .box{width:46px;height:46px;border-radius:14px;background:var(--pdim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tag-header .box svg{width:21px;height:21px;stroke:var(--p);fill:none;stroke-width:2.4;}
.tag-header .title-block{flex:1;min-width:0;padding-top:2px;}
.tag-header h1{font-size:23px;font-weight:900;letter-spacing:-.3px;}
.tag-header .cnt{color:#9CA3AF;font-size:13.5px;font-weight:500;}
.tag-header .side-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:2px;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid #E5E7EB;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
[data-theme="dark"] .icon-btn{background:#111;border-color:#2a2a2a;}
.icon-btn svg{width:16px;height:16px;stroke:#111;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
[data-theme="dark"] .icon-btn svg{stroke:#fff;}
.subtabs{display:flex;gap:26px;border-bottom:1.5px solid #EEF0F3;margin-bottom:18px;}
[data-theme="dark"] .subtabs{border-color:#1c1c1e;}
.subtabs button{display:flex;align-items:center;gap:6px;padding:11px 1px;background:none;border:none;border-bottom:2.5px solid transparent;color:#9CA3AF;font-weight:700;font-size:14px;}
.subtabs button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
.subtabs button.active{color:var(--p);border-bottom-color:var(--p);}

/* ── Empty / loading ── */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 20px;gap:11px;}
.empty-state .ic{width:64px;height:64px;border-radius:50%;background:var(--pdim);display:flex;align-items:center;justify-content:center;}
.empty-state .ic svg{width:28px;height:28px;stroke:var(--p);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.empty-state h3{font-size:16px;font-weight:800;}
.empty-state p{font-size:13.5px;color:#6b7280;max-width:260px;line-height:1.55;}
.spin-icon{width:16px;height:16px;border:2px solid #E5D9FB;border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0;}
@keyframes sp{to{transform:rotate(360deg);}}
.load-more-row{display:flex;align-items:center;justify-content:center;gap:9px;padding:30px 0;color:var(--p);font-weight:700;font-size:14px;border:none;background:none;width:100%;}
.load-more-row.muted{color:#6b7280;}
.load-more-row .dashed{width:16px;height:16px;border-radius:50%;border:2px dashed var(--p);flex-shrink:0;}
#searchSentinel{height:1px;}
.center-loading{display:flex;align-items:center;justify-content:center;gap:9px;padding:60px 0;color:#6b7280;font-size:14px;font-weight:600;}

/* ══════════════════════════════════════════════════════════
   LIGHTBOX — copied verbatim from index.html
   ══════════════════════════════════════════════════════════ */
.lightbox-modal{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s;touch-action:none;}
.lightbox-modal.show{opacity:1;pointer-events:auto;}
.lightbox-modal.dragging .gallery-lightbox-track{transition:none !important;}
.gallery-lightbox-header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 16px 12px;z-index:5;}
.gallery-lightbox-header .lightbox-close{position:static;font-size:26px;background:none;border:none;color:#fff;cursor:pointer;}
.gallery-lightbox-counter{color:#fff;font-size:.85rem;font-weight:700;}
.lightbox-media-area{position:relative;flex:1;min-height:0;overflow:hidden;}
.gallery-lightbox-track{display:flex;width:100%;height:100%;background:#000;transition:transform .3s ease;}
.gallery-lightbox-slide{flex:0 0 100%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;}
.gallery-lightbox-media{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;}
.gallery-lightbox-slide .plyr{max-width:100%;max-height:100%;width:100%;}
.gallery-lightbox-slide .plyr__video-wrapper{max-height:100%;}
.gallery-lightbox-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;}
.gallery-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);}
.gallery-dot.active{background:#fff;width:16px;border-radius:3px;}
.gallery-lightbox-footer{position:absolute;left:0;right:0;bottom:0;flex-shrink:0;z-index:6;padding:46px 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.5) 35%,rgba(0,0,0,.85) 100%);border-top:none;transition:opacity .22s ease,transform .22s ease;}
.lb-scrubber-wrap{position:relative;width:100%;display:none;align-items:center;gap:10px;margin-bottom:6px;}
.lb-scrubber-wrap.active{display:flex;}
.lb-scrubber-track{position:relative;flex:1;height:16px;cursor:pointer;}
.lb-scrubber-track-line{position:absolute;top:50%;left:0;right:0;height:3px;transform:translateY(-50%);background:rgba(255,255,255,.25);border-radius:2px;}
.lb-scrubber-fill{position:absolute;top:50%;left:0;height:3px;width:0%;transform:translateY(-50%);background:#A78BFA;border-radius:2px;pointer-events:none;}
.lb-scrubber-thumb{position:absolute;top:50%;left:0%;width:12px;height:12px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;}
.lb-mute-btn,.lb-playpause-btn{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.lb-mute-btn svg,.lb-playpause-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.lb-video-wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.lb-video-wrap video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transition:transform .25s ease;}
.lightbox-modal.ui-hidden .gallery-lightbox-header{opacity:0;transform:translateY(-10px);pointer-events:none;}
.lightbox-modal.ui-hidden .gallery-lightbox-footer{opacity:0;transform:translateY(10px);pointer-events:none;}
.lightbox-modal.ui-hidden .gallery-lightbox-dots{opacity:0;pointer-events:none;}

.lightbox-caption-block{margin-bottom:10px;}
.lightbox-author-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;}
.lightbox-author-row img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#333;}
.lightbox-author-info{min-width:0;flex:1;}
.lightbox-author-name{font-weight:700;font-size:.88rem;color:#fff;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lightbox-author-time{font-size:.74rem;color:rgba(255,255,255,.65);}
.lightbox-caption-text{font-size:.86rem;line-height:1.4;color:#fff;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.lightbox-caption-text.expanded{display:block;-webkit-line-clamp:unset;max-height:16.8em;overflow-y:auto;padding-right:2px;}
.lightbox-caption-seemore{background:none;border:none;padding:2px 0 0;color:rgba(255,255,255,.75);font-weight:700;font-size:.8rem;cursor:pointer;}

.gallery-lightbox-footer .post-actions-row{margin-top:0;}
.gallery-lightbox-footer .post-actions-row .comment-btn,
.gallery-lightbox-footer .post-actions-row .reaction-btn,
.gallery-lightbox-footer .post-actions-row .views-count,
.gallery-lightbox-footer .post-actions-row .bookmark-badge,
.gallery-lightbox-footer .post-actions-row .share-btn,
.gallery-lightbox-footer .post-actions-row .repost-count-badge,
.gallery-lightbox-footer .post-actions-row .reaction-count,
.gallery-lightbox-footer .post-actions-row .comment-count,
.gallery-lightbox-footer .post-actions-row .share-count,
.gallery-lightbox-footer .post-actions-row .bookmark-count,
.gallery-lightbox-footer .post-actions-row .repost-count-num{color:#fff !important;}

/* ── Post actions row (shared with feed) ── */
.post-actions-row{display:flex;align-items:center;justify-content:flex-start;gap:22px;margin-top:10px;padding:4px 0 0;max-width:100%;width:100%;}
.post-actions-row>*{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:flex-start;min-width:0;position:relative;overflow:visible;}
.post-actions-row .bookmark-badge{margin-left:auto;}
.post-actions-row .comment-btn,
.post-actions-row .reaction-btn,
.post-actions-row .views-count,
.post-actions-row .bookmark-badge,
.post-actions-row .share-btn,
.post-actions-row .repost-count-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:20px;font-size:.85rem;color:var(--muted);cursor:pointer;transition:background .15s,color .15s;background:transparent;border:none;font-weight:500;}
.post-actions-row .comment-btn:hover{background:rgba(124,58,237,.08);color:#7C3AED;}
.post-actions-row .share-btn:hover{background:rgba(124,58,237,.08);color:#7C3AED;}
.post-actions-row .reaction-btn:hover{background:rgba(220,38,38,.08);color:var(--heart-red);}
.post-actions-row .bookmark-badge:hover{background:rgba(255,215,0,.15);color:var(--gold);}
.post-actions-row .bookmark-badge.bookmarked{color:var(--gold);}
.post-actions-row .bookmark-badge.bookmarked svg{fill:var(--gold);stroke:var(--gold);}
.post-actions-row .repost-count-badge.reposted .repost-icon{color:#16A34A;}
.post-actions-row svg{width:18px;height:18px;flex-shrink:0;}
.post-actions-row .reaction-count,
.post-actions-row .comment-count,
.post-actions-row .share-count,
.post-actions-row .bookmark-count,
.post-actions-row .repost-count-num,
.post-actions-row .views-count span{font-family:"Inter","SF Pro Text","Segoe UI","Roboto","Noto Sans",sans-serif;font-weight:500;font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted) !important;}
.post-actions-row .bookmark-count{margin-left:2px;}
.post-actions-row .repost-count-badge:hover{background:rgba(124,58,237,.08);color:#7C3AED;}
.post-actions-row .repost-count-badge.reposted{color:#16A34A;}

/* ── Lightbox comments sheet ── */
.lightbox-comments-overlay{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.lightbox-comments-overlay.open{opacity:1;pointer-events:auto;}
.lightbox-comments-sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:560px;height:72vh;display:flex;flex-direction:column;border:1px solid var(--brd2);border-bottom:none;transform:translateY(24px);transition:transform .3s cubic-bezier(.34,1.56,.64,1);overflow:hidden;}
.lightbox-comments-overlay.open .lightbox-comments-sheet{transform:translateY(0);}
.lightbox-comments-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--brd);flex-shrink:0;}
.lightbox-comments-header h3{font-family:'Poppins','Inter',sans-serif;font-size:1.05rem;font-weight:800;color:var(--text);}
.lightbox-comments-header button{width:32px;height:32px;border-radius:50%;background:var(--inp);border:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.lightbox-comments-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 16px;}
.lightbox-comments-inputbar{display:flex;gap:8px;align-items:flex-end;padding:10px 14px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--brd);background:var(--bg2);flex-shrink:0;flex-wrap:wrap;}
.lightbox-comments-inputbar textarea{flex:1;min-width:0;border:1.5px solid var(--brd);border-radius:20px;padding:9px 14px;font-size:.9rem;resize:none;outline:none;font-family:inherit;background:var(--inp);color:var(--text);line-height:1.45;min-height:40px;max-height:100px;box-sizing:border-box;height:40px;}
.lightbox-comments-inputbar textarea:focus{border-color:#7C3AED;}

.lb-sheet-header{padding:4px 0 12px;border-bottom:1px solid var(--brd);margin-bottom:8px;}
.lb-sheet-author-row{display:flex;align-items:center;gap:10px;}
.lb-sheet-author-row img{width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;background:var(--bg4);}
.lb-sheet-author-info{flex:1;min-width:0;}
.lb-sheet-author-name{font-weight:800;font-size:.92rem;color:var(--text);display:flex;align-items:center;gap:4px;}
.lb-sheet-author-username{font-size:.78rem;color:var(--muted);}
.lb-sheet-caption{font-size:.88rem;line-height:1.45;color:var(--text);margin-top:8px;white-space:pre-wrap;word-break:break-word;}
.lb-sheet-caption.clamp4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.lb-sheet-seemore{background:none;border:none;color:#7C3AED;font-weight:700;font-size:.82rem;padding:4px 0 0;cursor:pointer;display:none;}
.lb-sheet-meta-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.lb-sheet-meta-row .lb-sheet-views{display:flex;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600;}
.lb-sheet-meta-row .lb-sheet-views svg{width:13px;height:13px;}
.lb-sheet-meta-row .lb-sheet-date{font-size:.78rem;color:var(--muted);}
.lb-sheet-meta-row .comment-sort-btn{margin-left:auto;}

.comment-sort-btn{display:inline-flex;align-items:center;gap:4px;background:var(--bg4);border:none;border-radius:20px;padding:6px 12px;font-size:.78rem;font-weight:700;color:var(--text);cursor:pointer;}
.comment-sort-btn svg{width:11px;height:11px;}

/* ── Comment / reply blocks ── */
.comment-item{display:flex;gap:10px;padding:10px 0;align-items:flex-start;width:100%;box-sizing:border-box;}
.comment-avatar{width:36px;height:36px;border-radius:50%;background:#E5E7EB;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#6B7280;flex-shrink:0;overflow:hidden;cursor:pointer;position:relative;}
.comment-avatar img{width:100%;height:100%;object-fit:cover;}
.comment-avatar svg{width:58%;height:58%;color:#9CA3AF;}
.comment-body{flex:1;min-width:0;overflow:hidden;}
.comment-username-row,.reply-username-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.comment-username{font-family:"Inter",sans-serif;font-size:.88rem;font-weight:700;color:var(--text);margin-bottom:2px;cursor:pointer;}
.comment-text{font-family:"Inter",sans-serif;white-space:pre-wrap;line-height:1.5;font-size:.92rem;color:var(--text);font-weight:400;word-break:break-word;overflow-wrap:anywhere;}
.comment-text.collapsed{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.comment-show-more{font-size:.78rem;color:#7C3AED;font-weight:700;cursor:pointer;background:none;border:none;padding:2px 0 0 0;display:block;}
.comment-meta{display:flex;align-items:center;gap:12px;margin-top:5px;flex-wrap:wrap;}
.comment-time{font-size:.75rem;color:#9CA3AF;}
.comment-reply-btn{font-size:.75rem;color:#6B7280;font-weight:700;cursor:pointer;background:none;border:none;padding:0;}
.comment-like-btn{font-size:.75rem;color:#9CA3AF;font-weight:500;cursor:pointer;background:none;border:none;padding:0;display:flex;align-items:center;gap:3px;}
.comment-like-btn.liked{color:var(--heart-red);}
.comment-like-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s ease;}
.comment-like-btn.liked svg{fill:#DC2626;stroke:#DC2626;animation:heartPop .3s ease;}
.comment-like-btn.liked .like-count{color:#DC2626;font-weight:700;}
@keyframes heartPop{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}

.replies-thread{border-left:none;margin-left:32px;padding-left:14px;box-sizing:border-box;width:calc(100% - 32px);}
.reply-item{display:flex;gap:8px;padding:8px 0 8px 14px;align-items:flex-start;width:100%;box-sizing:border-box;position:relative;}
.reply-item::before{content:'';position:absolute;left:-14px;top:0;bottom:50%;width:14px;border-left:2px solid var(--brd2);border-bottom:2px solid var(--brd2);border-bottom-left-radius:10px;}
.reply-avatar-dot{width:26px;height:26px;border-radius:50%;background:#E5E7EB;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.6rem;color:#6B7280;border:none;z-index:2;overflow:hidden;cursor:pointer;position:relative;}
.reply-avatar-dot img{width:100%;height:100%;object-fit:cover;}
.reply-avatar-dot svg{width:58%;height:58%;color:#9CA3AF;}
.reply-body{flex:1;min-width:0;overflow:hidden;}
.reply-username{font-family:"Inter",sans-serif;font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:1px;cursor:pointer;}
.reply-text{font-family:"Inter",sans-serif;white-space:pre-wrap;line-height:1.45;font-size:.88rem;color:var(--text);font-weight:400;word-break:break-word;overflow-wrap:anywhere;}
.reply-meta{display:flex;align-items:center;gap:10px;margin-top:3px;flex-wrap:wrap;}
.reply-time{font-size:.7rem;color:#9CA3AF;}
.reply-reply-btn{font-size:.7rem;color:#6B7280;font-weight:700;cursor:pointer;background:none;border:none;padding:0;}
.reply-like-btn{font-size:.7rem;color:#9CA3AF;font-weight:500;cursor:pointer;background:none;border:none;padding:0;display:flex;align-items:center;gap:2px;}
.reply-like-btn.liked{color:var(--heart-red);}
.reply-like-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;}
.reply-like-btn.liked svg{fill:#DC2626;stroke:#DC2626;animation:heartPop .3s ease;}
.reply-like-btn.liked .like-count{color:#DC2626;font-weight:700;}

.view-replies-btn,.hide-replies-btn{display:flex;align-items:center;gap:4px;font-size:.78rem;color:#7C3AED;font-weight:700;cursor:pointer;background:none;border:none;padding:0;margin-top:4px;}
.view-replies-btn{margin-left:46px;}
.hide-replies-btn{margin-left:18px;padding-left:14px;color:#6B7280;}
.reply-sort-toggle{margin-left:4px;font-size:.7rem;color:var(--muted2);cursor:pointer;}

.comment-media,.reply-media{display:block;margin-top:7px;border-radius:8px;object-fit:cover;cursor:pointer;background:var(--bg2);border:1px solid var(--brd);}
.comment-media{width:120px;height:120px;max-width:120px;max-height:120px;}
.reply-media{width:100px;height:100px;max-width:100px;max-height:100px;}

.comment-skeleton{display:flex;gap:10px;padding:10px 0;align-items:flex-start;}
.comment-skeleton .skeleton-avatar-sm{width:36px;height:36px;border-radius:50%;background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;flex-shrink:0;}
.comment-skeleton .skeleton-line-sm{height:10px;border-radius:5px;background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;margin-bottom:6px;}
.comment-skeleton .skeleton-line-sm.w70{width:70%;}
.comment-skeleton .skeleton-line-sm.w50{width:50%;}
.comment-skeleton .skeleton-line-sm.w90{width:90%;}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}

.comment-menu-actions,.reply-menu-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.owner-like-badge{display:inline-flex;align-items:center;justify-content:center;}
.owner-like-badge svg{width:14px;height:14px;}
.comment-menu-btn-top,.reply-menu-btn-top{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;flex-shrink:0;font-size:1rem;line-height:1;}
.comment-pinned-badge{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:700;color:#7C3AED;background:rgba(124,58,237,.12);padding:2px 7px;border-radius:6px;margin-right:6px;}
.comment-pinned-badge svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;}
.comment-edited-tag{font-size:.68rem;color:var(--muted);margin-left:4px;}

.comments-off-illustration{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 20px;margin-top:8px;border-radius:16px;background:var(--bg4);border:1px dashed var(--brd2);}
.comments-off-illustration svg{stroke:var(--muted2);margin-bottom:4px;}
.comments-off-illustration p{font-size:.92rem;font-weight:700;color:var(--text);}
.comments-off-illustration span{font-size:.8rem;color:var(--muted);max-width:260px;line-height:1.5;}

.comment-media-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex-shrink:0;border:none;border-radius:50%;background:var(--inp);color:var(--muted);cursor:pointer;transition:background .15s,color .15s;}
.comment-media-btn:hover{background:var(--pdim);color:#7C3AED;}
.comment-media-btn svg{width:19px;height:19px;}
.comment-media-preview{position:relative;display:inline-flex;margin-bottom:8px;}
.comment-media-preview img{width:140px;height:140px;object-fit:cover;border-radius:12px;border:1px solid var(--brd);display:block;}
.comment-media-preview button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#000;color:#fff;border:2px solid var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.comment-media-preview button svg{width:12px;height:12px;}
.comment-send-btn{width:36px;height:36px;border-radius:50%;background:#7C3AED;color:#fff;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;align-self:flex-end;padding:0;}
.comment-send-btn svg{width:16px;height:16px;}
.comment-send-btn:disabled{opacity:.35;cursor:not-allowed;}

.replies-views-line{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.8rem;font-weight:600;margin-bottom:8px;white-space:nowrap;}
.replies-views-line svg{width:14px;height:14px;flex-shrink:0;}

.similar-posts-section{padding:12px 0 4px;border-bottom:1px solid var(--brd);margin-bottom:8px;}
.similar-posts-title{font-size:.8rem;font-weight:700;color:var(--muted);padding:0 0 8px;}
.similar-posts-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 0 4px;-webkit-overflow-scrolling:touch;}
.similar-post-card{flex:0 0 84px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--bg3);}
.similar-post-card img{width:100%;height:100%;object-fit:cover;}

/* ── YouTube embed inside lightbox ── */
.ig-video-wrap{position:relative;width:100%;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.ig-video-wrap .yt-wrap{position:relative;width:100%;padding-bottom:56.25%;height:0;background:#000;}
.ig-video-wrap .yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.ig-video-wrap .yt-tap{position:absolute;inset:0;z-index:10;cursor:pointer;}
.ig-video-wrap .yt-mute-badge{position:absolute;top:12px;left:12px;width:34px;height:34px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:11;pointer-events:none;opacity:.95;}
.ig-video-wrap .yt-mute-badge svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ig-video-wrap .yt-pause-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);width:68px;height:68px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:11;transition:transform .12s cubic-bezier(.34,1.56,.64,1),opacity .2s;opacity:0;pointer-events:none;}
.ig-video-wrap .yt-pause-icon svg{width:28px;height:28px;fill:#fff;}
.ig-video-wrap .yt-pause-icon.show{transform:translate(-50%,-50%) scale(1);opacity:1;}
.ig-video-wrap .yt-pause-icon.hide{transform:translate(-50%,-50%) scale(.8);opacity:0;}
.ig-video-wrap .yt-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2);z-index:12;cursor:pointer;}
.ig-video-wrap .yt-progress-fill{height:100%;background:#A78BFA;border-radius:0 2px 2px 0;transition:width .1s linear;pointer-events:none;width:0%;}
.ig-video-wrap .yt-progress-thumb{position:absolute;top:50%;right:calc(100% - var(--pct,0%));transform:translate(50%,-50%) scale(0);width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .15s;pointer-events:none;}
.ig-video-wrap .yt-progress:hover .yt-progress-thumb,.ig-video-wrap .yt-progress:active .yt-progress-thumb{transform:translate(50%,-50%) scale(1);}

/* ── Confirm modal (comment sort) ── */
.confirm-modal-backdrop{position:fixed;inset:0;z-index:960;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s;}
.confirm-modal-backdrop.open{opacity:1;pointer-events:auto;}
.confirm-modal{background:var(--bg2);border-radius:18px;padding:22px 20px;max-width:320px;width:100%;transform:scale(.9);transition:transform .2s;}
.confirm-modal-backdrop.open .confirm-modal{transform:scale(1);}
.confirm-modal h3{font-size:1.05rem;font-weight:800;margin-bottom:6px;color:var(--text);}
.confirm-modal p{font-size:.85rem;color:var(--muted);margin-bottom:18px;line-height:1.4;}
.report-reason-option{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--brd);cursor:pointer;font-size:.88rem;color:var(--text);}
.report-reason-option .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--brd);flex-shrink:0;}
.report-reason-option.selected .dot{border-color:#7C3AED;background:radial-gradient(circle,#7C3AED 40%,transparent 44%);}

/* ── Share modal ── */
#share-modal{position:fixed;inset:0;z-index:120;background:rgba(15,15,15,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease;padding:20px;}
#share-modal.open{opacity:1;pointer-events:auto;}
#share-modal .share-sheet{background:var(--bg2);border:1px solid var(--brd);border-radius:24px;max-width:380px;width:100%;padding:28px 26px 24px;transform:translateY(16px) scale(.96);transition:transform .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 24px 60px rgba(0,0,0,.25);}
#share-modal.open .share-sheet{transform:translateY(0) scale(1);}
#share-modal .share-sheet h3{font-family:'Poppins','Inter',sans-serif;font-weight:800;font-size:1.2rem;color:var(--text);margin-bottom:4px;text-align:left;}
#share-modal .share-sheet .share-sub{font-size:.85rem;color:var(--muted);text-align:left;margin-bottom:22px;}
#share-modal .share-sheet .share-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
#share-modal .share-sheet .share-option{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;border:1px solid var(--brd);background:var(--bg3);cursor:pointer;color:var(--text);font-size:.72rem;font-weight:600;transition:transform .15s,box-shadow .15s,border-color .15s;}
#share-modal .share-sheet .share-option:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,58,237,.15);border-color:#7C3AED;}
#share-modal .share-sheet .share-option.share-native{grid-column:span 2;flex-direction:row;justify-content:center;padding:12px;}
#share-modal .share-sheet .share-icon-circle{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#share-modal .share-sheet .share-option svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;}
#share-modal .share-sheet .share-notinterested .share-icon-circle{background:linear-gradient(135deg,#6B7280,#9CA3AF);}
#share-modal .share-sheet .share-copy .share-icon-circle{background:linear-gradient(135deg,#3B82F6,#60A5FA);}
#share-modal .share-sheet .share-native .share-icon-circle{background:linear-gradient(135deg,#10B981,#34D399);}
#share-modal .share-sheet .share-close-btn{width:100%;padding:12px;border-radius:14px;border:none;background:var(--bg4);color:var(--muted);font-weight:700;font-size:.9rem;cursor:pointer;transition:.15s;margin-top:6px;}
#share-modal .share-sheet .share-close-btn:hover{background:var(--brd2);color:var(--text);}

/* ── Repost modal ── */
.repost-modal-overlay{position:fixed;inset:0;z-index:310;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.repost-modal-overlay.open{opacity:1;pointer-events:auto;}
.repost-sheet{background:var(--bg3);border-radius:24px 24px 0 0;max-width:500px;width:100%;max-height:85vh;display:flex;flex-direction:column;border:1px solid var(--brd2);box-shadow:0 -24px 60px rgba(0,0,0,.4);transform:translateY(20px);transition:transform .3s cubic-bezier(.34,1.56,.64,1);overflow-y:auto;overscroll-behavior:contain;}
.repost-modal-overlay.open .repost-sheet{transform:translateY(0);}
.repost-sheet-body{padding:16px 20px 24px;}
@media (min-width:640px){.repost-modal-overlay{align-items:center;}.repost-sheet{border-radius:24px;}}
.tags-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--brd);flex-shrink:0;}
.tags-header h3{font-size:18px;font-weight:800;}
.tags-header button{background:none;border:none;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.tags-header button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;}

/* ── Toast ── */
.fu-toast{position:fixed;left:50%;bottom:calc(72px + 24px);transform:translateX(-50%) translateY(10px);z-index:500;display:flex;align-items:center;gap:10px;max-width:min(360px,calc(100vw - 32px));padding:13px 16px;border-radius:14px;background:var(--bg3);border:1px solid var(--brd2);box-shadow:0 14px 34px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.14);opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s cubic-bezier(.34,1.56,.64,1);}
.fu-toast.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
.fu-toast-icon{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.fu-toast-icon svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.fu-toast-icon.t-g{background:#16A34A;}
.fu-toast-icon.t-r{background:#DC2626;}
.fu-toast-icon.t-o{background:#CA8A04;}
.fu-toast-icon.t-p{background:#7C3AED;}
.fu-toast-message{font-size:.86rem;font-weight:600;color:var(--text);line-height:1.4;}

/* ── Peek modal ── */
.search-peek{position:fixed;inset:0;z-index:150;display:none;}
.search-peek.open{display:block;}
.search-peek-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.75);}
.search-peek-card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,420px);max-height:88vh;background:#fff;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.35);}
[data-theme="dark"] .search-peek-card{background:#111;}
.search-peek-close{position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;}
.search-peek-img{width:100%;max-height:52vh;object-fit:cover;display:block;background:#000;cursor:zoom-in;}
.search-peek-body{padding:14px 16px;overflow-y:auto;}
.search-peek-author{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;}
.search-peek-author img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#eee;flex-shrink:0;}
.search-peek-author .nm{font-weight:800;font-size:14px;color:var(--text);}
.search-peek-author .un{font-size:12px;color:#9CA3AF;}
.search-peek-caption{font-size:13.5px;line-height:1.5;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.search-peek-hint{margin-top:10px;font-size:11.5px;font-weight:700;color:var(--p);text-transform:uppercase;letter-spacing:.4px;}

/* ── Post action anim keyframes ── */
@keyframes bookmarkPop{0%{transform:scale(1);filter:none;}50%{transform:scale(1.15);filter:drop-shadow(0 0 6px rgba(255,215,0,.65));}100%{transform:scale(1);filter:none;}}
.post-actions-row .bookmark-badge.bookmark-breathe .bookmark-icon-wrap svg{display:inline-block;animation:bookmarkPop 180ms ease-out;}
@keyframes commentPop{0%{transform:scale(1);}45%{transform:scale(1.18);}100%{transform:scale(1);}}
.post-actions-row .comment-btn.comment-pop svg{animation:commentPop 250ms cubic-bezier(.34,1.56,.64,1);}
@keyframes repostSpin{from{transform:rotate(0deg) scale(1);}50%{transform:rotate(180deg) scale(1.15);}to{transform:rotate(360deg) scale(1);}}
.repost-btn.spinning .repost-icon{animation:repostSpin 220ms ease;}
@keyframes bounceHeart{0%{transform:scale(1);}30%{transform:scale(1.35);}50%{transform:scale(.92);}70%{transform:scale(1.12);}100%{transform:scale(1);}}
.post-actions-row .reaction-btn.bounce-heart .heart-icon-wrap{display:inline-block;animation:bounceHeart .22s cubic-bezier(.17,.89,.32,1.49);}
@keyframes shareBounce{0%{transform:scale(1) rotate(0deg);}35%{transform:scale(1.25) rotate(-12deg);}60%{transform:scale(.95) rotate(6deg);}100%{transform:scale(1) rotate(0deg);}}
.post-actions-row .share-btn.share-bounce svg,#single-share-btn.share-bounce svg{display:inline-block;animation:shareBounce .45s cubic-bezier(.17,.89,.32,1.49);}
@keyframes countOut{to{transform:translateY(-10px);opacity:0;}}
@keyframes countIn{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
</style>
</head>
<body>

<div class="layout">
  <side-nav show-chat></side-nav>

  <div class="main" id="mainScroll">
    <div class="col">
      <div id="normalHeader">
        <h1 class="page-title">Search</h1>
        <div class="search-bar">
          <span class="ic-left" id="searchIcon"></span>
          <input type="text" id="searchInput" placeholder="Search FreeUpper..."
                 oninput="Search.onQueryInput(this.value)" onfocus="Search.onFocus()">
          <button class="ic-right" id="clearBtn" onclick="Search.clear()"></button>
        </div>
      </div>
      <div class="tabs" id="searchTabs"></div>
      <div id="hashtagHeader" style="display:none;"></div>
      <div class="results-container" id="resultsContainer"></div>
    </div>
  </div>

  <bottom-nav></bottom-nav>
</div>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox-modal" id="lightbox">
  <div class="gallery-lightbox-header">
    <button class="lightbox-close" id="galleryLightboxClose">&times;</button>
    <span class="gallery-lightbox-counter" id="galleryLightboxCounter"></span>
    <span style="width:34px;"></span>
  </div>
  <div class="lightbox-media-area" id="lightboxMediaArea">
    <div class="gallery-lightbox-track" id="galleryLightboxTrack"></div>
    <div class="gallery-lightbox-dots" id="galleryLightboxDots"></div>
  </div>
</div>

<!-- ===== LIGHTBOX COMMENTS SHEET ===== -->
<div class="lightbox-comments-overlay" id="lightboxCommentsOverlay">
  <div class="lightbox-comments-sheet">
    <div class="lightbox-comments-header">
      <h3>Replies</h3>
      <button id="lightboxCommentsCloseBtn" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="lightbox-comments-body">
      <div id="lightbox-comments-post-header"></div>
      <div id="lightbox-comments-list"></div>
    </div>
    <div class="lightbox-comments-inputbar">
      <div id="lightbox-comment-media-preview" class="comment-media-preview" style="display:none;">
        <img id="lightbox-comment-media-preview-img" src="" alt="">
        <button type="button" id="lightbox-comment-media-remove-btn" aria-label="Remove media">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <input type="file" id="lightbox-comment-media-input" accept="image/jpeg,image/png,image/webp" hidden>
      <button type="button" id="lightbox-comment-media-btn" class="comment-media-btn" aria-label="Add media" title="Add media">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <textarea id="lightbox-comment-textarea" placeholder="Write a reply..." rows="1"></textarea>
      <button type="button" id="lightbox-comment-submit-btn" class="comment-send-btn" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ===== COMMENT SORT MODAL ===== -->
<div class="confirm-modal-backdrop" id="commentSortModal">
  <div class="confirm-modal" style="text-align:left;">
    <h3 style="margin-bottom:14px;">Sort replies</h3>
    <div class="report-reason-option" data-sort="top"><span>Top</span><span class="dot"></span></div>
    <div class="report-reason-option" data-sort="recent" style="border-bottom:none;"><span>Recent</span><span class="dot"></span></div>
  </div>
</div>

<!-- ===== SHARE MODAL ===== -->
<div id="share-modal">
  <div class="share-sheet">
    <h3>Share post</h3>
    <p class="share-sub">Choose how you'd like to share this</p>
    <div class="share-options">
      <button class="share-option share-notinterested" data-share="notinterested">
        <span class="share-icon-circle"><svg viewBox="0 0 24 24"><path d="M17.32 4.68A9 9 0 105.32 16.68M4.68 5.32a9 9 0 0012 12"/><line x1="3" y1="3" x2="21" y2="21"/></svg></span>
        <span>Not interested</span>
      </button>
      <button class="share-option share-copy" data-share="copy">
        <span class="share-icon-circle"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span>
        <span>Copy Link</span>
      </button>
      <button class="share-option share-native" data-share="native">
        <span class="share-icon-circle"><svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></span>
        <span>Share via device</span>
      </button>
    </div>
    <button class="share-close-btn" id="share-close-btn">Cancel</button>
  </div>
</div>

<!-- ===== REPOST QUOTE MODAL ===== -->
<div id="repostQuoteOverlay" class="repost-modal-overlay">
  <div class="repost-sheet" id="repostQuoteSheet">
    <div class="tags-header">
      <h3 id="repostQuoteTitle">Repost</h3>
      <button id="repostQuoteCloseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="repost-sheet-body">
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:8px;">Share this post with your followers.</p>
      <textarea id="repostQuoteInput" maxlength="280" placeholder="Add a note... (optional)" rows="3"
        style="width:100%;border:1.5px solid var(--brd);border-radius:12px;padding:10px;font-family:inherit;background:var(--inp);color:var(--text);resize:none;"></textarea>
      <div style="text-align:right;font-size:.72rem;color:var(--muted2);margin-top:4px;" id="repostCharCount">0/280</div>
      <div id="repostPreview" style="margin-top:12px;padding:10px;border:1px solid var(--brd);border-radius:12px;background:var(--bg4);display:flex;gap:10px;">
        <img id="repostPreviewThumb" style="display:none;width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;" alt="">
        <div style="min-width:0;flex:1;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
            <span id="repostPreviewAuthor" style="font-weight:700;font-size:.82rem;color:var(--text);"></span>
            <span id="repostPreviewTime" style="font-size:.72rem;color:var(--muted);"></span>
          </div>
          <div id="repostPreviewContent" style="font-size:.82rem;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;"></div>
        </div>
      </div>
      <button id="repostSubmitBtn" style="width:100%;margin-top:12px;padding:12px;border-radius:14px;border:none;background:#7C3AED;color:#fff;font-weight:700;">Repost</button>
      <button id="repostRemoveBtn" style="display:none;width:100%;margin-top:8px;padding:12px;border-radius:14px;border:none;background:rgba(220,38,38,.1);color:#DC2626;font-weight:700;">Remove Repost</button>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="fu-toast">
  <span id="toast-icon" class="fu-toast-icon"></span>
  <span id="toast-message" class="fu-toast-message"></span>
</div>

<!-- ===== Pinterest peek (search-specific) ===== -->
<div class="search-peek" id="searchPeekModal">
  <div class="search-peek-backdrop" onclick="Search._closePeek()"></div>
  <div class="search-peek-card">
    <button class="search-peek-close" onclick="Search._closePeek()">&times;</button>
    <img class="search-peek-img" id="searchPeekImg" src="" alt="" onclick="Search._peekExpand()">
    <div class="search-peek-body">
      <div class="search-peek-author" id="searchPeekAuthor" onclick="Search._peekGoToProfile()"></div>
      <div class="search-peek-caption" id="searchPeekCaption"></div>
      <div class="search-peek-hint">Tap image to open</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="global.js"></script>
<script src="auth.js"></script>
<script src="posts.js"></script>
<script src="listings.js"></script>
<script src="hashtags.js"></script>
<script src="router.js" defer></script>
<script src="bottom-nav.js" defer></script>
<script src="side-nav.js" defer></script>
<script src="search.js"></script>

</body>
</html>
