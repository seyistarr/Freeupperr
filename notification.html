<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Notifications · FreeUpper</title>
    <link rel="icon" type="image/png" href="freeupper.png">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="bottom-nav.css">
    <link rel="stylesheet" href="side-nav.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        button { font-family: inherit; background: none; border: none; cursor: pointer; }
        svg { overflow: visible; display: block; }

        :root {
            --p: #8b5cf6;
            --pd: #6c3fc5;
            --pl: #a78bfa;
            --pdim: rgba(139, 92, 246, .15);
            --pbrd: rgba(139, 92, 246, .28);
            --pglow: rgba(108, 63, 197, .45);
            --danger: #f87171;
            --warn: #fb923c;
            --ok: #4ade80;
            --nav-h: 78px;
        }
        [data-theme="dark"] {
            --bg: #000; --bg2: #0a0a0a; --bg3: #111; --bg4: #1a1a1a;
            --brd: rgba(255,255,255,.07); --brd2: rgba(255,255,255,.12);
            --text: #fff; --muted: rgba(255,255,255,.4); --muted2: rgba(255,255,255,.22);
            --inp: rgba(255,255,255,.05); --rowh: rgba(255,255,255,.04);
            --unreadbg: rgba(139, 92, 246, .06);
        }
        [data-theme="light"] {
            --bg: #fff; --bg2: #fff; --bg3: #fff; --bg4: #e8e8ed;
            --brd: rgba(0,0,0,.08); --brd2: rgba(0,0,0,.13);
            --text: #0d0d0d; --muted: rgba(0,0,0,.44); --muted2: rgba(0,0,0,.26);
            --inp: rgba(0,0,0,.05); --rowh: rgba(0,0,0,.04);
            --unreadbg: rgba(139, 92, 246, .05);
        }

        html, body {
            height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background .3s, color .3s;
            overflow: hidden;
        }

        .layout { display: flex; height: 100vh; width: 100%; overflow: hidden; }
        .main { flex: 1; overflow-y: auto; overflow-x: hidden; background: var(--bg); padding-bottom: 80px; }
        .main::-webkit-scrollbar { width: 0; }
        .col { width: 100%; max-width: 620px; margin: 0 auto; }

        /* ─── HEADER ─── */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: clamp(44px, 8vw, 56px) 16px 12px;
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--bg);
        }
        .header .icon-btn {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--inp); border: 1.5px solid var(--brd2);
            color: var(--text); flex-shrink: 0; transition: background .15s;
        }
        .header .icon-btn:hover { background: var(--pdim); }
        .header .icon-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .header .title-block { flex: 1; min-width: 0; }
        .header h1 { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
        .header .sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
        .mark-all-btn {
            font-size: 12.5px; font-weight: 700; color: var(--pl);
            padding: 8px 4px; flex-shrink: 0; white-space: nowrap;
        }
        .mark-all-btn:disabled { color: var(--muted2); cursor: default; }

        /* ─── TABS ─── */
        .tabs {
            display: flex; border-bottom: 1px solid var(--brd);
            position: sticky; top: 84px; z-index: 20; background: var(--bg);
            padding: 0 16px;
        }
        .tab {
            flex: 1; padding: 12px 4px; text-align: center;
            font-size: 13.5px; font-weight: 700; color: var(--muted);
            border-bottom: 2.5px solid transparent; transition: color .15s;
        }
        .tab.active { color: var(--p); border-bottom-color: var(--p); }

        /* ─── DATE SECTION ─── */
        .date-heading {
            padding: 16px 16px 6px;
            font-size: 12px; font-weight: 800; color: var(--muted2);
            text-transform: uppercase; letter-spacing: .06em;
        }

        /* ─── NOTIFICATION ROW ─── */
        .notif-row {
            display: flex; gap: 12px; align-items: flex-start;
            padding: 12px 16px; cursor: pointer;
            border-bottom: 1px solid var(--brd);
            transition: background .12s;
            position: relative;
        }
        .notif-row:hover { background: var(--rowh); }
        .notif-row.unread { background: var(--unreadbg); }
        .notif-row .unread-dot {
            position: absolute; left: 6px; top: 22px;
            width: 7px; height: 7px; border-radius: 50%; background: var(--p);
        }

        .avatar-stack { position: relative; flex-shrink: 0; width: 44px; height: 44px; }
        .avatar-stack img {
            width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
            background: var(--bg4); border: 1.5px solid var(--brd);
        }
        .avatar-stack .type-badge {
            position: absolute; bottom: -3px; right: -3px;
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--bg);
        }
        .avatar-stack .type-badge svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
        .type-badge.t-like { background: var(--danger); }
        .type-badge.t-comment, .type-badge.t-reply { background: var(--p); }
        .type-badge.t-follow { background: var(--ok); }
        .type-badge.t-mention { background: #60a5fa; }
        .type-badge.t-repost { background: #22c55e; }
        .type-badge.t-system, .type-badge.t-verified { background: var(--warn); }

        .notif-body { flex: 1; min-width: 0; }
        .notif-text { font-size: 14px; line-height: 1.45; color: var(--text); }
        .notif-text b { font-weight: 800; }
        .notif-preview {
            font-size: 13px; color: var(--muted); margin-top: 3px;
            display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
        }
        .notif-time { font-size: 12px; color: var(--muted2); margin-top: 4px; }
        .notif-unavailable { font-size: 12.5px; color: var(--muted2); font-style: italic; margin-top: 3px; }

        .notif-thumb {
            width: 44px; height: 44px; border-radius: 8px; object-fit: cover;
            background: var(--bg4); flex-shrink: 0; margin-left: 8px;
        }

        .follow-back-btn {
            margin-top: 8px; display: inline-flex; padding: 6px 16px;
            border-radius: 100px; background: var(--pdim); border: 1.5px solid var(--pbrd);
            color: var(--pl); font-size: 12px; font-weight: 700;
        }

        /* ─── SKELETON ─── */
        .skeleton-row { display: flex; gap: 12px; padding: 12px 16px; }
        .skl { background: var(--bg4); border-radius: 8px; animation: pulse 1.3s ease-in-out infinite; }
        .skl.av { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
        .skl.line { height: 12px; border-radius: 6px; margin-bottom: 6px; }
        @keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

        /* ─── EMPTY STATE ─── */
        .empty-state {
            display: flex; flex-direction: column; align-items: center;
            padding: 70px 30px; gap: 14px; text-align: center;
        }
        .empty-state .icon {
            width: 72px; height: 72px; border-radius: 50%;
            background: var(--pdim); border: 1.5px solid var(--pbrd);
            display: flex; align-items: center; justify-content: center;
        }
        .empty-state .icon svg { width: 30px; height: 30px; stroke: var(--p); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .empty-state h3 { font-size: 16px; font-weight: 800; }
        .empty-state p { font-size: 13px; color: var(--muted); max-width: 240px; line-height: 1.5; }

        .caught-up { text-align: center; padding: 24px; font-size: 12.5px; color: var(--muted2); }

        /* ─── TOAST ─── */
        #tw { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast {
            background: var(--bg3); border: 1px solid var(--brd2); border-radius: 100px;
            padding: 10px 18px; font-size: 13px; font-weight: 600; color: var(--text);
            box-shadow: 0 8px 30px rgba(0,0,0,.4); display: flex; align-items: center; gap: 8px;
            animation: tIn .25s ease both;
        }
        @keyframes tIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="tw"></div>

    <div class="layout">
        <side-nav show-chat></side-nav>

        <div class="main" id="mainScroll">
            <div class="col">
                <div class="header">
                    <button class="icon-btn" onclick="history.length > 1 ? history.back() : window.location.href='index.html'">
                        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <div class="title-block">
                        <h1>Notifications</h1>
                        <div class="sub" id="unreadSub">Stay updated with everything that matters</div>
                    </div>
                    <button class="mark-all-btn" id="markAllBtn" onclick="markAllRead()">Mark all read</button>
                </div>

                <div class="tabs">
                    <button class="tab active" data-tab="activity" onclick="switchTab(this,'activity')">All Activities</button>
                    <button class="tab" data-tab="system" onclick="switchTab(this,'system')">System</button>
                </div>

                <div id="listRoot"></div>
            </div>
        </div>

        <bottom-nav></bottom-nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="global.js"></script>
    <script src="auth.js"></script>
    <script src="bottom-nav.js" defer></script>
    <script src="side-nav.js" defer></script>
    <script src="notification.js" defer></script>
</body>
</html>
